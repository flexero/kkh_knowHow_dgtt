<text x="90.0" y="520.0" font-size="11.5" text-anchor="start" fill="#000">Box beam 120 × 50 × 2.0: I = (50·120³ − 46·116³)/12 = 1.217 × 10⁶ mm⁴, W = 20.3 × 10³ mm³</text>
<text x="90.0" y="538.0" font-size="11.5" text-anchor="start" fill="#000">σ_d = 1.4 × 699 000 / 20 276 = 48.3 N/mm² ≤ 355 (S355) – the connector moment / shear is proven by test (EN 15512).</text>
