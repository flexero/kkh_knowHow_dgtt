<text x="627.4" y="556.0" font-size="11" text-anchor="middle" fill="#000">+43</text>
<text x="90.0" y="602.0" font-size="12" text-anchor="start" fill="#000">Φn = n·cS/(cS + cP) = 0.5·525/2289 = 0.115</text>
<text x="90.0" y="624.0" font-size="12" text-anchor="start" fill="#000">FSA = Φn·FA = 1.15 kN (bolt)   FPA = 8.85 kN (plates unload)</text>
<text x="90.0" y="646.0" font-size="12" text-anchor="start" fill="#000">FZ (embedding 11 µm) = 0.011·525·1764/2289 = 4.45 kN</text>
<text x="90.0" y="668.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">FKR = 76 − 4.45 − 8.85 = 62.7 kN  ≫  needed clamp</text>
<text x="90.0" y="690.0" font-size="12" text-anchor="start" fill="#000">bolt fatigue: σa = FSA/(2·As) = 3.7 MPa vs σASV = 46 MPa → S = 12.6</text>
