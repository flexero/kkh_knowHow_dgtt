<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#666666">Preload 76 kN (minimum after scatter), bolt stiffness 525 kN/mm, plate stiffness 1764 kN/mm, axial load 10 kN, load factor n = 0.5. Guide 10 §27.</text>
