<line x1="100.0" y1="590.0" x2="100.0" y2="120.0" stroke="#ccc" stroke-width="0.6"/>
<text x="100.0" y="608.0" font-size="12" text-anchor="middle" fill="#000">100</text>
<line x1="168.4" y1="590.0" x2="168.4" y2="120.0" stroke="#ccc" stroke-width="0.6"/>
<text x="168.4" y="608.0" font-size="12" text-anchor="middle" fill="#000">120</text>
<line x1="252.1" y1="590.0" x2="252.1" y2="120.0" stroke="#ccc" stroke-width="0.6"/>
<text x="252.1" y="608.0" font-size="12" text-anchor="middle" fill="#000">150</text>
<line x1="360.0" y1="590.0" x2="360.0" y2="120.0" stroke="#ccc" stroke-width="0.6"/>
