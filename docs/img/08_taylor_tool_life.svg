<title>Taylor tool life vc · T^n = C – log-log chart, face mill Ø100 in GG25 (example test data)</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1100" height="700" fill="#ffffff"/>
<rect x="6" y="6" width="1088" height="688" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">Taylor tool life vc · T^n = C – log-log chart, face mill Ø100 in GG25 (example test data)</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#000">Two test points from own trials (wear limit VB = 0.3 mm). Line = Taylor fit. Costs: 5 inserts × 3.75 € per edge = 18.75 € per edge set, edge change 3 min, machine 90 €/h.</text>
