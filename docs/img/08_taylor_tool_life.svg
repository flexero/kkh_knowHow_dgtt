<text x="1022.0" y="344.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">2.18</text>
<text x="662.0" y="366.0" font-size="12" text-anchor="start" fill="#000">200</text>
<text x="712.0" y="366.0" font-size="12" text-anchor="start" fill="#000">19.6</text>
<text x="772.0" y="366.0" font-size="12" text-anchor="start" fill="#000">22.3</text>
<text x="862.0" y="366.0" font-size="12" text-anchor="start" fill="#000">0.84</text>
<text x="932.0" y="366.0" font-size="12" text-anchor="start" fill="#000">1.52</text>
<text x="1022.0" y="366.0" font-size="12" text-anchor="start" fill="#000">2.36</text>
<text x="662.0" y="388.0" font-size="12" text-anchor="start" fill="#000">220</text>
<text x="712.0" y="388.0" font-size="12" text-anchor="start" fill="#000">13.4</text>
<text x="772.0" y="388.0" font-size="12" text-anchor="start" fill="#000">16.7</text>
<text x="862.0" y="388.0" font-size="12" text-anchor="start" fill="#000">1.12</text>
<text x="932.0" y="388.0" font-size="12" text-anchor="start" fill="#000">1.47</text>
<text x="1022.0" y="388.0" font-size="12" text-anchor="start" fill="#000">2.59</text>
<text x="662.0" y="410.0" font-size="12" text-anchor="start" fill="#000">242</text>
<text x="712.0" y="410.0" font-size="12" text-anchor="start" fill="#000">9.1</text>
<text x="772.0" y="410.0" font-size="12" text-anchor="start" fill="#000">12.5</text>
<text x="862.0" y="410.0" font-size="12" text-anchor="start" fill="#000">1.50</text>
<text x="932.0" y="410.0" font-size="12" text-anchor="start" fill="#000">1.45</text>
<text x="1022.0" y="410.0" font-size="12" text-anchor="start" fill="#000">2.95</text>
<text x="662.0" y="444.0" font-size="11" text-anchor="start" fill="#000">machine € = (cut time + change time share) · 1.5 €/min</text>
<text x="662.0" y="460.0" font-size="11" text-anchor="start" fill="#000">Lowest cost at v_econ; fastest at v_prod (§22.4).</text>
<rect x="650.0" y="502.0" width="435.0" height="112.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="658.0" y="520.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">How to use it</text>
<text x="658.0" y="539.0" font-size="12" text-anchor="start" fill="#000">Run 2–3 speeds to VB 0.3 mm, record minutes in cut</text>
<text x="658.0" y="556.0" font-size="12" text-anchor="start" fill="#000">Tool life counter = T / cut time per part (Step 8)</text>
<text x="658.0" y="573.0" font-size="12" text-anchor="start" fill="#000">Re-test when the casting lot or the insert grade changes</text>
