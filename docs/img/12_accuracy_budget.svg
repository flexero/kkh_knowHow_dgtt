<text x="410.0" y="419.0" font-size="13" text-anchor="end" fill="#000" font-weight="bold" >Statistical RSS √Σe²</text>
<rect x="420.0" y="405.0" width="206.1" height="22.0" fill="#c0392b" stroke="#000" stroke-width="1" />
<text x="632.1" y="421.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold" >9.4</text>
<line x1="860.0" y1="70.0" x2="860.0" y2="434.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 4"/>
<text x="866.0" y="92.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold" >tolerance ±20 µm</text>
<rect x="30.0" y="480.0" width="700.0" height="92.0" fill="#fff" stroke="#000" stroke-width="1.2" />
<text x="42.0" y="502.0" font-size="12" text-anchor="start" fill="#000" >RSS 9.4 µm uses about half of the ±20 µm tolerance → OK (rule: machine ≤ ½ of the tolerance).</text>
<text x="42.0" y="521.0" font-size="12" text-anchor="start" fill="#000" >Worst-case 24.9 µm is over the limit → control the biggest term: part temperature</text>
<text x="42.0" y="540.0" font-size="12" text-anchor="start" fill="#000" >(coolant chiller, soak the part), then the Abbe offsets.  Values: guide 12, M13.2.</text>
<text x="42.0" y="559.0" font-size="12" text-anchor="start" fill="#000" >Python check: Σ = 24.9 µm, RSS = 9.37 µm.</text>
