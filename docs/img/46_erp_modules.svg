<text x="1010" y="500" font-size="12" text-anchor="start" fill="#1f6fd1">HTTP JSON</text>
<rect x="850" y="690" width="260" height="60" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="980.0" y="716.2" font-size="12" text-anchor="middle" fill="#000">machines: only via MES +</text>
<text x="980.0" y="732.2" font-size="12" text-anchor="middle" fill="#000">Modbus TCP gateway (item 4)</text>
<line x1="980" y1="660" x2="980" y2="688" stroke="#000" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#aK)"/>
<text x="24" y="700" font-size="13" text-anchor="start" fill="#000">Outside partners over HTTP: customer order APIs (sales), supplier portals (purchasing), bank file / e-invoice (finance – check local law).</text>
<text x="24" y="722" font-size="13" text-anchor="start" fill="#000">Rule of the plant: Ethernet + Modbus TCP + HTTP only – the ERP talks HTTP (REST + JSON), never to a PLC; no MQTT, no OPC UA.</text>
