<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">Induction scan hardening BS-IND – I/O and sequence (850 mm thread, 4 mm/s, 35 kW)</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><text x="30" y="78" font-size="14" text-anchor="start" font-weight="700" fill="#000">Inputs (Delta / Siemens S7-1500)</text><text x="30" y="102" font-size="12.5" text-anchor="start" fill="#000">B_PART X0.0 / %I0.0 screw loaded</text><text x="30" y="123" font-size="12.5" text-anchor="start" fill="#000">B_TAIL X0.1 / %I0.1 tailstock</text><text x="30" y="144" font-size="12.5" text-anchor="start" fill="#000">B_DOOR X0.2 / %I0.2 (status, safety!)</text><text x="30" y="165" font-size="12.5" text-anchor="start" fill="#000">AX_RDY X0.3 servo ready</text><text x="30" y="186" font-size="12.5" text-anchor="start" fill="#000">B_ROT X0.4 rotation at speed</text><text x="30" y="207" font-size="12.5" text-anchor="start" fill="#000">GEN_RDY / GEN_FLT X0.5 / X0.6</text><text x="30" y="228" font-size="12.5" text-anchor="start" fill="#000">B_QFLOW X0.7 / %I1.0 ≥ 40 l/min</text><text x="30" y="249" font-size="12.5" text-anchor="start" fill="#000">AI: GEN_P, GEN_F, Q_FLOW, Q_TEMP</text><text x="30" y="270" font-size="12.5" text-anchor="start" fill="#000">AX_POS encoder (mm)</text><text x="30" y="310" font-size="14" text-anchor="start" font-weight="700" fill="#000">Outputs</text><text x="30" y="334" font-size="12.5" text-anchor="start" fill="#000">Y_TAIL Y0.0, Y_ROT Y0.1, Y_AXEN Y0.2</text><text x="30" y="355" font-size="12.5" text-anchor="start" fill="#000">Y_QPUMP Y0.3, Y_QSPRAY Y0.4</text><text x="30" y="376" font-size="12.5" text-anchor="start" fill="#000">Y_GEN Y0.5 heat ON</text><text x="30" y="397" font-size="12.5" text-anchor="start" fill="#000">AQ GEN_RAW: 35 kW → 16128 (27648 = 60 kW)</text><text x="30" y="418" font-size="12.5" text-anchor="start" fill="#000">AQ AX_SPD: +50 / +4 / −100 mm/s</text><rect x="420" y="70" width="250" height="44" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="545.0" y="88" font-size="12" text-anchor="middle" font-weight="700" fill="#000">0 wait</text><text x="545.0" y="104" font-size="12" text-anchor="middle" fill="#000">Enable, part, home</text><rect x="420" y="128" width="250" height="44" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="545.0" y="146" font-size="12" text-anchor="middle" font-weight="700" fill="#000">1 prepare</text><text x="545.0" y="162" font-size="12" text-anchor="middle" fill="#000">clamp, rotate, pump: quench OK?</text><line x1="545" y1="114" x2="545" y2="128" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="420" y="186" width="250" height="44" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="545.0" y="204" font-size="12" text-anchor="middle" font-weight="700" fill="#000">2 approach</text><text x="545.0" y="220" font-size="12" text-anchor="middle" fill="#000">0 → 75 mm, 50 mm/s, 1.5 s</text><line x1="545" y1="172" x2="545" y2="186" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="420" y="244" width="250" height="44" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="545.0" y="262" font-size="12" text-anchor="middle" font-weight="700" fill="#000">3 preheat</text><text x="545.0" y="278" font-size="12" text-anchor="middle" fill="#000">generator ON 1.0 s</text><line x1="545" y1="230" x2="545" y2="244" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="420" y="302" width="250" height="44" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="545.0" y="320" font-size="12" text-anchor="middle" font-weight="700" fill="#000">4 scan</text><text x="545.0" y="336" font-size="12" text-anchor="middle" fill="#000">75 → 925 mm, 4 mm/s = 212.5 s</text><line x1="545" y1="288" x2="545" y2="302" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="420" y="360" width="250" height="44" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="545.0" y="378" font-size="12" text-anchor="middle" font-weight="700" fill="#000">5 post-quench</text><text x="545.0" y="394" font-size="12" text-anchor="middle" fill="#000">heat OFF, spray 8 s</text><line x1="545" y1="346" x2="545" y2="360" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="420" y="418" width="250" height="44" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="545.0" y="436" font-size="12" text-anchor="middle" font-weight="700" fill="#000">6 return</text><text x="545.0" y="452" font-size="12" text-anchor="middle" fill="#000">925 → 0 mm, 100 mm/s, 9.25 s</text><line x1="545" y1="404" x2="545" y2="418" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="420" y="476" width="250" height="44" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="545.0" y="494" font-size="12" text-anchor="middle" font-weight="700" fill="#000">7 unload</text><text x="545.0" y="510" font-size="12" text-anchor="middle" fill="#000">unclamp 1 s, part done</text><line x1="545" y1="462" x2="545" y2="476" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><text x="700" y="80" font-size="14" text-anchor="start" font-weight="700" fill="#000">Interlocks (process – safety is the F-CPU)</text><text x="700" y="104" font-size="12.5" text-anchor="start" fill="#000">M_QOK = pump ∧ flow switch ∧ level ∧ 15 ≤ T ≤ 35 °C</text><text x="700" y="126" font-size="12.5" text-anchor="start" fill="#000">M_HEAT = M_QOK ∧ door ∧ rotation ∧ generator ready ∧ no alarm</text><text x="700" y="148" font-size="12.5" text-anchor="start" fill="#1f6fd1">Y_GEN = (step 3 ∨ step 4) ∧ M_HEAT  – quench lost → heat OFF</text><text x="700" y="170" font-size="12.5" text-anchor="start" fill="#1f6fd1">   in the SAME scan, alarm 302 after 0.2 s, part = scrap</text><text x="700" y="192" font-size="12.5" text-anchor="start" fill="#000">Energy E = Σ P × 0.1 s (10 Hz clock) → 35 kW × 213.5 s = 7472.5 kJ</text><text x="700" y="214" font-size="12.5" text-anchor="start" fill="#000">Window ± 5 %: 7099 … 7846 kJ, else reject + alarm 303</text><text x="700" y="236" font-size="12.5" text-anchor="start" fill="#000">Power deviation &gt; 10 % for 0.5 s → reject</text><rect x="700" y="300" width="450" height="260" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="700" y="292" font-size="13" text-anchor="start" font-weight="700" fill="#000">Coil height z over time (example)</text><path d="M700.0 560.0 L703.8 560.0 L706.7 540.5 L708.6 540.5 L1115.5 319.5 L1130.9 319.5 L1148.6 560.0 L1150.0 560.0" fill="none" stroke="#1f6fd1" stroke-width="2.2"/><line x1="700" y1="540.5" x2="1150" y2="540.5" stroke="#888" stroke-width="0.6" stroke-dasharray="4 4"/><text x="694" y="544.5" font-size="11.5" text-anchor="end" fill="#000">75</text><line x1="700" y1="319.5" x2="1150" y2="319.5" stroke="#888" stroke-width="0.6" stroke-dasharray="4 4"/><text x="694" y="323.5" font-size="11.5" text-anchor="end" fill="#000">925</text><text x="700.0" y="576" font-size="11.5" text-anchor="middle" fill="#000">0</text><text x="795.7446808510638" y="576" font-size="11.5" text-anchor="middle" fill="#000">50</text><text x="891.4893617021277" y="576" font-size="11.5" text-anchor="middle" fill="#000">100</text><text x="987.2340425531916" y="576" font-size="11.5" text-anchor="middle" fill="#000">150</text><text x="1082.9787234042553" y="576" font-size="11.5" text-anchor="middle" fill="#000">200</text><text x="1150.0" y="576" font-size="11.5" text-anchor="middle" fill="#000">235</text><text x="925.0" y="594" font-size="12" text-anchor="middle" fill="#000">time t in s</text><text x="670" y="430.0" font-size="12" text-anchor="middle" fill="#000">z mm</text><text x="30" y="600" font-size="14" text-anchor="start" font-weight="700" fill="#000">Hand calculation</text><text x="30" y="624" font-size="12.5" text-anchor="start" fill="#000">heating time = thread length / scan speed = 850 mm / 4 mm/s = 212.5 s</text><text x="30" y="646" font-size="12.5" text-anchor="start" fill="#000">cycle ≈ prepare 2 + approach 1.5 + preheat 1 + scan 212.5 + post-quench 8 + return 9.25 + unload 1 ≈ 235 s</text><text x="30" y="668" font-size="12.5" text-anchor="start" fill="#000">parts per hour = 3600 / 235 ≈ 15.3 → one machine for ≈ 15 screws per hour (item 2 capacity check)</text><text x="30" y="690" font-size="12.5" text-anchor="start" fill="#000">generator set point (Siemens AQ): raw = P × 27648 / 60 kW = 35 × 460.8 = 16128 counts</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>