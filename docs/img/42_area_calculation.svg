 room 120 m² ≈ 920 m²</text><text x="52.0" y="655.0" font-size="12" font-weight="700" fill="#1f6fd1">→ ≈ 3 480 m² needed → hall 80 × 48 m = 3 840 m² (columns 10 × 24 m) + annex 80 × 8 m = 640 m²</text><text x="52.0" y="678.0" font-size="12" fill="#111">Factor &lt; 2.5: heat treatment (dense furnace lines – check access for baskets + maintenance). Assembly + packing &gt; 5: room for benches, run-in and growth.</text><g><rect x="800.0" y="756.0" width="390.0" height="64.0" fill="none" stroke="#111" stroke-width="1.2"/><line x1="800.0" y1="780.0" x2="1190.0" y2="780.0" stroke="#111" stroke-width="1"/><text x="808.0" y="773.0" font-size="13" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your planner</text><text x="808.0" y="796.0" font-size="11">Ball screw + guide factory · item 3 · guide 42</text><text x="808.0" y="812.0" font-size="11" fill="#666">Drawing 42-03 · all values are examples · 2026</text></g></svg>