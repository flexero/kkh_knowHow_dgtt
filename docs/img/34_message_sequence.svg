<text x="30.0" y="766.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">Error rule: no ACK within 5 s (telegram) / 60 s (B2MML) → resend up to 3 × with the SAME sequence number / BODID, then alarm. Receivers ignore duplicates (idempotent).</text>
<text x="30.0" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">If the ERP link is down: MES and WMS keep working; postings 13 / 14 wait in the outbound queue and are sent in order when the link is back.</text>
