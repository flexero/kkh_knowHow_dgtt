<text x="35.0" y="408.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">f</text>
<line x1="170.0" y1="392.0" x2="170.0" y2="414.0" stroke="#000" stroke-width="0.8"/>
<text x="175.0" y="408.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">δ cold (ρ 0.2 µΩ·m, μr 100)</text>
<line x1="370.0" y1="392.0" x2="370.0" y2="414.0" stroke="#000" stroke-width="0.8"/>
<text x="375.0" y="408.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">δ hot &gt; Curie 770 °C (ρ 1.2 µΩ·m, μr 1)</text>
<line x1="630.0" y1="392.0" x2="630.0" y2="414.0" stroke="#000" stroke-width="0.8"/>
<text x="635.0" y="408.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">use</text>
<rect x="30.0" y="414.0" width="820.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="430.0" font-size="11.5" text-anchor="start" fill="#000">10 kHz</text>
<line x1="170.0" y1="414.0" x2="170.0" y2="436.0" stroke="#000" stroke-width="0.8"/>
<text x="175.0" y="430.0" font-size="11.5" text-anchor="start" fill="#000">0.225 mm</text>
<line x1="370.0" y1="414.0" x2="370.0" y2="436.0" stroke="#000" stroke-width="0.8"/>
<text x="375.0" y="430.0" font-size="11.5" text-anchor="start" fill="#000">5.51 mm</text>
<line x1="630.0" y1="414.0" x2="630.0" y2="436.0" stroke="#000" stroke-width="0.8"/>
<text x="635.0" y="430.0" font-size="11.5" text-anchor="start" fill="#000">deep cases 4 – 6 mm</text>
<rect x="30.0" y="436.0" width="820.0" height="22.0" rx="0" fill="#eaf1fb" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="452.0" font-size="11.5" text-anchor="start" fill="#000">30 kHz (our choice)</text>
<line x1="170.0" y1="436.0" x2="170.0" y2="458.0" stroke="#000" stroke-width="0.8"/>
<text x="175.0" y="452.0" font-size="11.5" text-anchor="start" fill="#000">0.130 mm</text>
<line x1="370.0" y1="436.0" x2="370.0" y2="458.0" stroke="#000" stroke-width="0.8"/>
<text x="375.0" y="452.0" font-size="11.5" text-anchor="start" fill="#000">3.18 mm</text>
<line x1="630.0" y1="436.0" x2="630.0" y2="458.0" stroke="#000" stroke-width="0.8"/>
<text x="635.0" y="452.0" font-size="11.5" text-anchor="start" fill="#000">case 2 – 3 mm (Ø32 screw, rails)</text>
<rect x="30.0" y="458.0" width="820.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="474.0" font-size="11.5" text-anchor="start" fill="#000">100 kHz</text>
<line x1="170.0" y1="458.0" x2="170.0" y2="480.0" stroke="#000" stroke-width="0.8"/>
<text x="175.0" y="474.0" font-size="11.5" text-anchor="start" fill="#000">0.071 mm</text>
<line x1="370.0" y1="458.0" x2="370.0" y2="480.0" stroke="#000" stroke-width="0.8"/>
<text x="375.0" y="474.0" font-size="11.5" text-anchor="start" fill="#000">1.74 mm</text>
<line x1="630.0" y1="458.0" x2="630.0" y2="480.0" stroke="#000" stroke-width="0.8"/>
<text x="635.0" y="474.0" font-size="11.5" text-anchor="start" fill="#000">thin cases 1 – 1.5 mm</text>
<text x="30.0" y="500.0" font-size="11.5" text-anchor="start" fill="#000">Cold steel: the current flows in a skin of 0.13 mm. Above the Curie point the steel is no longer magnetic (μr = 1) → δ grows to 3.18 mm</text>
<text x="30.0" y="516.0" font-size="11.5" text-anchor="start" fill="#000">and the heat goes as deep as the case we want. Frequency for δ_hot = 3 mm: f = ρ·(503/δ)² = 33.7 kHz.</text>
<text x="30.0" y="548.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">D  Power estimate (simple heat balance)</text>
<text x="30.0" y="568.0" font-size="11.5" text-anchor="start" fill="#000">case ring A = π/4·(31.5² − 26.5²) = 227.8 mm²;  mass flow ṁ = A · v · ρ = 227.8 · 4 · 7.85·10⁻³ = 7.15 g/s</text>
<text x="30.0" y="586.0" font-size="11.5" text-anchor="start" fill="#000">heat P = ṁ · c · ΔT = 7.15 · 0.65 · 880 = 4.09 kW;  with 50 % conduction loss + coil efficiency 0.65 → generator ≈ 12.6 kW</text>
<text x="30.0" y="604.0" font-size="11.5" text-anchor="start" fill="#000">real set-ups use 30 – 40 kW of a 60 kW generator (faster scan, groove edges, ends) – check with the maker's trial.</text>
<text x="30.0" y="622.0" font-size="11.5" text-anchor="start" fill="#000">Checks QG-BS-2: 58 – 62 HRC (ISO 6508), case depth cut-up HV1 (ISO 18203), eddy-current crack test 100 %, energy monitor per part.</text>
<text x="30.0" y="660.0" font-size="11.5" text-anchor="start" fill="#1f6fd1">Typical mistakes: power / scan drift → soft spiral band; coil not centred → uneven case; overheating at the journal step → cracks.</text>
