<text x="720.0" y="627.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">motion: travel, hoist, fork</text>
<rect x="20.0" y="690.0" width="1160.0" height="100.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="32.0" y="710.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#111111">Rules</text>
<text x="32.0" y="728.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">1  Each system owns its data: ERP = items + money, MES = orders + serials, WMS = slots + crates + lots, WCS = device moves, PLC = axes. One master per field.</text>
<text x="32.0" y="743.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">2  Every message has a unique ID and is acknowledged; the receiver ignores duplicates (idempotent); queues (store-and-forward) between IT and OT.</text>
<text x="32.0" y="758.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">3  The PLC never sees items or lots – only coordinates and the handling unit. The ERP never sees slots – only quantity per lot in ASRS-RAW.</text>
<text x="32.0" y="773.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">4  Offline: WMS, WCS, MES run on servers in the plant (VLAN 30 / 40); the ERP link may stop for hours without stopping the store.</text>
</svg>