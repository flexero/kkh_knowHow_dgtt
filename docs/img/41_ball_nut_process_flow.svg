<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Ball nut – process flow</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="eab" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="20.0" y="30.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Ball nut BN-3210-FL – routing (material 20MnCr5 bar Ø85, 108 mm per nut; case hardened 58 – 62 HRC, Eht 0.8 – 1.2 mm)</text>
<rect x="40.0" y="70.0" width="240.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="47.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 10</text>
<text x="273.0" y="86.0" font-size="11" text-anchor="end" fill="#000">MS-SAW</text>
<text x="47.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Saw bar Ø85 to slugs 108 mm</text>
<text x="47.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 2.4 min</text>
<rect x="330.0" y="70.0" width="240.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="337.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 20</text>
<text x="563.0" y="86.0" font-size="11" text-anchor="end" fill="#000">BN-TRN</text>
<text x="337.0" y="103.0" font-size="11" text-anchor="start" fill="#000">CNC turning soft OP1 + OP2, thread</text>
<text x="337.0" y="117.0" font-size="11" text-anchor="start" fill="#000">pre-cut</text>
<text x="337.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 12.0 min</text>
<rect x="620.0" y="70.0" width="240.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="627.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 30</text>
<text x="853.0" y="86.0" font-size="11" text-anchor="end" fill="#000">BN-MC</text>
<text x="627.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Drill flange 6 × Ø9, flat, return</text>
<text x="627.0" y="117.0" font-size="11" text-anchor="start" fill="#000">holes, 4 deflector windows</text>
<text x="627.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 10.0 min</text>
<rect x="910.0" y="70.0" width="240.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="917.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 40</text>
<text x="1143.0" y="86.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">HT-CAR</text>
<text x="917.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Carburise 920 °C + oil quench +</text>
<text x="917.0" y="117.0" font-size="11" text-anchor="start" fill="#000">temper 170 °C</text>
<text x="917.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 2.0 min</text>
<text x="1143.0" y="142.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-BN-1</text>
<rect x="910.0" y="240.0" width="240.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="917.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 50</text>
<text x="1143.0" y="256.0" font-size="11" text-anchor="end" fill="#000">BN-HTN</text>
<text x="917.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Hard turning OD g6, flange face</text>
<text x="917.0" y="287.0" font-size="11" text-anchor="start" fill="#000">(CBN)</text>
<text x="917.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 6.0 min</text>
<rect x="620.0" y="240.0" width="240.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="627.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 60</text>
<text x="853.0" y="256.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">BN-ITG</text>
<text x="627.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Internal thread grinding, Ø25 CBN</text>
<text x="627.0" y="287.0" font-size="11" text-anchor="start" fill="#000">wheel on quill</text>
<text x="627.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 9.0 min</text>
<text x="853.0" y="312.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-BN-2</text>
<rect x="330.0" y="240.0" width="240.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="337.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 70</text>
<text x="563.0" y="256.0" font-size="11" text-anchor="end" fill="#000">AS-WSH</text>
<text x="337.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Wash + demagnetise</text>
<text x="337.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 1.0 min</text>
<rect x="40.0" y="240.0" width="240.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="47.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 80</text>
<text x="273.0" y="256.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">AS-NAS</text>
<text x="47.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Insert deflectors + gauge-ball fit →</text>
<text x="47.0" y="287.0" font-size="11" text-anchor="start" fill="#000">ball class</text>
<text x="47.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 6.0 min</text>
<text x="273.0" y="312.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-BN-3</text>
<line x1="280.0" y1="118.0" x2="330.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="570.0" y1="118.0" x2="620.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="860.0" y1="118.0" x2="910.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="1030.0" y1="166.0" x2="1030.0" y2="240.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="910.0" y1="288.0" x2="860.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="620.0" y1="288.0" x2="570.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="330.0" y1="288.0" x2="280.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<text x="40.0" y="360.0" font-size="11.5" text-anchor="start" fill="#000">→ final assembly FABS op 10: balls of the selected oversize class are loaded on the screw, preload torque Tp ≈ 0.29 N·m ± 40 % (P1, 3 % Ca).</text>
<rect x="40.0" y="390.0" width="730.0" height="22.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="406.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Item</text>
<line x1="250.0" y1="390.0" x2="250.0" y2="412.0" stroke="#000" stroke-width="0.8"/>
<text x="255.0" y="406.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Value (example)</text>
<rect x="40.0" y="412.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="428.0" font-size="11.5" text-anchor="start" fill="#000">Σ cycle per nut</text>
<line x1="250.0" y1="412.0" x2="250.0" y2="434.0" stroke="#000" stroke-width="0.8"/>
<text x="255.0" y="428.0" font-size="11.5" text-anchor="start" fill="#000">48.4 min (8 ops)</text>
<rect x="40.0" y="434.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="450.0" font-size="11.5" text-anchor="start" fill="#000">Heat treatment load</text>
<line x1="250.0" y1="434.0" x2="250.0" y2="456.0" stroke="#000" stroke-width="0.8"/>
<text x="255.0" y="450.0" font-size="11.5" text-anchor="start" fill="#000">300 nuts per 10 h load → 2.0 machine-min per nut</text>
<rect x="40.0" y="456.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="472.0" font-size="11.5" text-anchor="start" fill="#000">Carburising time (Harris)</text>
<line x1="250.0" y1="456.0" x2="250.0" y2="478.0" stroke="#000" stroke-width="0.8"/>
<text x="255.0" y="472.0" font-size="11.5" text-anchor="start" fill="#000">d = 0.63·√t → 1.2 mm total case ≈ 3.6 h at 920 °C</text>
<rect x="40.0" y="478.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="494.0" font-size="11.5" text-anchor="start" fill="#000">Internal grinding time</text>
<line x1="250.0" y1="478.0" x2="250.0" y2="500.0" stroke="#000" stroke-width="0.8"/>
<text x="255.0" y="494.0" font-size="11.5" text-anchor="start" fill="#000">4 × 80/(10·30) + 2 × 80/(10·8) = 3.07 min grinding (+ load, dress, gauge = 9 min)</text>
<rect x="40.0" y="500.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="516.0" font-size="11.5" text-anchor="start" fill="#000">Wheel speed</text>
<line x1="250.0" y1="500.0" x2="250.0" y2="522.0" stroke="#000" stroke-width="0.8"/>
<text x="255.0" y="516.0" font-size="11.5" text-anchor="start" fill="#000">n = 30·60 000/(π·25) = 22 918 min⁻¹</text>
<rect x="40.0" y="522.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="538.0" font-size="11.5" text-anchor="start" fill="#000">Machines (120 / day)</text>
<line x1="250.0" y1="522.0" x2="250.0" y2="544.0" stroke="#000" stroke-width="0.8"/>
<text x="255.0" y="538.0" font-size="11.5" text-anchor="start" fill="#000">BN-TRN 3 · BN-MC 3 · HT-CAR 2 (shared) · BN-HTN 2 · BN-ITG 2</text>
<rect x="800.0" y="400.0" width="34.0" height="18.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="842.0" y="414.0" font-size="11.5" text-anchor="start" fill="#000">quality gate (QG-… feeds item 5 – quality)</text>
<rect x="800.0" y="426.0" width="34.0" height="18.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="842.0" y="440.0" font-size="11.5" text-anchor="start" fill="#000">operation: op no. · machine type id · name ·</text>
<text x="842.0" y="456.0" font-size="11.5" text-anchor="start" fill="#000">cycle per piece incl. load / unload (min)</text>
<text x="800.0" y="484.0" font-size="11.5" text-anchor="start" fill="#000">Deflector windows must be phased to the</text>
<text x="800.0" y="500.0" font-size="11.5" text-anchor="start" fill="#000">pre-cut groove (± 0.02 mm), else a step in</text>
<text x="800.0" y="516.0" font-size="11.5" text-anchor="start" fill="#000">the ball path → noise and ball jam.</text>
<rect x="812.0" y="742.0" width="382.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="812.0" y1="768.0" x2="1194.0" y2="768.0" stroke="#000" stroke-width="0.8"/>
<line x1="812.0" y1="792.0" x2="1194.0" y2="792.0" stroke="#000" stroke-width="0.8"/>
<line x1="1002.0" y1="792.0" x2="1002.0" y2="824.0" stroke="#000" stroke-width="0.8"/>
<text x="820.0" y="760.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Ball nut – process flow</text>
<text x="820.0" y="785.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the machine maker's data</text>
<text x="820.0" y="812.0" font-size="11.5" text-anchor="start" fill="#000">Drawing 41-02</text>
<text x="1010.0" y="806.0" font-size="11" text-anchor="start" fill="#000">Scale: none (flow)</text>
<text x="1010.0" y="819.0" font-size="11" text-anchor="start" fill="#000">guide 41 §7</text>
</svg>
