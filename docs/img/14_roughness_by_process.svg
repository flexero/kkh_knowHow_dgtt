<text x="30.0" y="938.0" font-size="11" text-anchor="start" fill="#000">Rules: Rz ≈ 4 – 7 × Ra for turned/milled surfaces (no exact conversion). Turning: Rt ≈ f²/(8·r), e.g. f 0.15, r 0.8 → 3.5 µm → Ra ≈ 0.9 µm.</text>
<text x="30.0" y="956.0" font-size="11" text-anchor="start" fill="#000">Each finer class needs more passes, slower feed or an extra process (cost). Specify only what the function needs. Do not use N-classes on new drawings – write Ra.</text>
