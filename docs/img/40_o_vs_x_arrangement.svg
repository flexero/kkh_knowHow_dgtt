<text x="655.0" y="602.0" font-size="12" text-anchor="start" fill="#000">low</text>
<rect x="20.0" y="608.0" width="880.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="25.0" y="628.0" font-size="12" text-anchor="start" fill="#000">Tolerance to mounting errors (height, parallelism)</text>
<line x1="350.0" y1="608.0" x2="350.0" y2="634.0" stroke="#000" stroke-width="0.8"/>
<text x="355.0" y="628.0" font-size="12" text-anchor="start" fill="#000">low – needs flat, parallel surfaces</text>
<line x1="650.0" y1="608.0" x2="650.0" y2="634.0" stroke="#000" stroke-width="0.8"/>
<text x="655.0" y="628.0" font-size="12" text-anchor="start" fill="#000">high – self-aligning</text>
<rect x="20.0" y="634.0" width="880.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
