<text x="890.0" y="124.6" font-size="12" text-anchor="middle" fill="#1f6fd1" font-weight="bold">rolling moment M_R</text>
<text x="40.0" y="470.0" font-size="12" text-anchor="start" fill="#000">Contact lines meet OUTSIDE the rail → large lever arm</text>
<text x="40.0" y="487.0" font-size="12" text-anchor="start" fill="#000">→ high rigidity against the rolling moment M_R.</text>
<text x="620.0" y="470.0" font-size="12" text-anchor="start" fill="#000">Contact lines meet INSIDE the rail → small lever arm</text>
<text x="620.0" y="487.0" font-size="12" text-anchor="start" fill="#000">→ the block can tilt a little: tolerant to mounting errors.</text>
<rect x="20.0" y="530.0" width="880.0" height="26.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="0.8"/>
