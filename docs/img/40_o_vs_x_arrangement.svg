<line x1="350.0" y1="634.0" x2="350.0" y2="660.0" stroke="#000" stroke-width="0.8"/>
<text x="355.0" y="654.0" font-size="12" text-anchor="start" fill="#000">single rail with moment load, machine tools</text>
<line x1="650.0" y1="634.0" x2="650.0" y2="660.0" stroke="#000" stroke-width="0.8"/>
<text x="655.0" y="654.0" font-size="12" text-anchor="start" fill="#000">two rails on less accurate beds</text>
<rect x="20.0" y="660.0" width="880.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="25.0" y="680.0" font-size="12" text-anchor="start" fill="#000">Same idea in bearings</text>
<line x1="350.0" y1="660.0" x2="350.0" y2="686.0" stroke="#000" stroke-width="0.8"/>
<text x="355.0" y="680.0" font-size="12" text-anchor="start" fill="#000">DB (back-to-back) angular-contact pair</text>
<line x1="650.0" y1="660.0" x2="650.0" y2="686.0" stroke="#000" stroke-width="0.8"/>
<text x="655.0" y="680.0" font-size="12" text-anchor="start" fill="#000">DF (face-to-face) pair</text>
<rect x="20.0" y="686.0" width="880.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="25.0" y="706.0" font-size="12" text-anchor="start" fill="#000">Equal load in 4 directions (45°)</text>
<line x1="350.0" y1="686.0" x2="350.0" y2="712.0" stroke="#000" stroke-width="0.8"/>
<text x="355.0" y="706.0" font-size="12" text-anchor="start" fill="#000">yes</text>
<line x1="650.0" y1="686.0" x2="650.0" y2="712.0" stroke="#000" stroke-width="0.8"/>
<text x="655.0" y="706.0" font-size="12" text-anchor="start" fill="#000">yes</text>
<text x="20.0" y="728.0" font-size="11.5" text-anchor="start" fill="#000">Note: makers draw the contact lines in different ways – check the catalogue drawing of the block you buy.</text>
<text x="20.0" y="745.0" font-size="11.5" text-anchor="start" fill="#000">Each 45° row carries radial AND lateral load, so the block has the same rating C in all 4 directions.</text>
