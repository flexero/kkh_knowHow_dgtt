<text x="122.0" y="354.8" font-size="12" text-anchor="start" fill="#000">Δp = 0.8 · (18.7/60)² = 0.078 MPa ✓</text>
<text x="1000.0" y="130.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Example data (catalogue class)</text>
<text x="1000.0" y="156.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Size</text>
<text x="1070.0" y="156.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Q_N</text>
<text x="1150.0" y="156.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Δp_N</text>
<text x="1230.0" y="156.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Q at 1.6 MPa</text>
<line x1="1000.0" y1="162.0" x2="1360.0" y2="162.0" stroke="#000" stroke-width="0.8"/>
<text x="1000.0" y="182.0" font-size="12" text-anchor="start" fill="#000">NG6</text>
<text x="1070.0" y="182.0" font-size="12" text-anchor="start" fill="#000">60 L/min</text>
<text x="1150.0" y="182.0" font-size="12" text-anchor="start" fill="#000">0.8 MPa</text>
<text x="1230.0" y="182.0" font-size="12" text-anchor="start" fill="#000">85 L/min</text>
<text x="1000.0" y="204.0" font-size="12" text-anchor="start" fill="#000">NG10</text>
<text x="1070.0" y="204.0" font-size="12" text-anchor="start" fill="#000">100 L/min</text>
<text x="1150.0" y="204.0" font-size="12" text-anchor="start" fill="#000">0.6 MPa</text>
<text x="1230.0" y="204.0" font-size="12" text-anchor="start" fill="#000">163 L/min</text>
<text x="1000.0" y="226.0" font-size="12" text-anchor="start" fill="#000">NG16</text>
<text x="1070.0" y="226.0" font-size="12" text-anchor="start" fill="#000">300 L/min</text>
<text x="1150.0" y="226.0" font-size="12" text-anchor="start" fill="#000">0.7 MPa</text>
<text x="1230.0" y="226.0" font-size="12" text-anchor="start" fill="#000">454 L/min</text>
<text x="1000.0" y="248.0" font-size="12" text-anchor="start" fill="#000">NG25</text>
<text x="1070.0" y="248.0" font-size="12" text-anchor="start" fill="#000">650 L/min</text>
<text x="1150.0" y="248.0" font-size="12" text-anchor="start" fill="#000">0.7 MPa</text>
<text x="1230.0" y="248.0" font-size="12" text-anchor="start" fill="#000">983 L/min</text>
<text x="1000.0" y="270.0" font-size="12" text-anchor="start" fill="#000">NG32</text>
<text x="1070.0" y="270.0" font-size="12" text-anchor="start" fill="#000">1100 L/min</text>
<text x="1150.0" y="270.0" font-size="12" text-anchor="start" fill="#000">0.7 MPa</text>
<text x="1230.0" y="270.0" font-size="12" text-anchor="start" fill="#000">1663 L/min</text>
<text x="1000.0" y="320.0" font-size="12" text-anchor="start" fill="#000">How to use:</text>
<text x="1000.0" y="339.0" font-size="12" text-anchor="start" fill="#000">1. Take the MAX flow in ANY path (retract:</text>
<text x="1000.0" y="358.0" font-size="12" text-anchor="start" fill="#000">   piston-side outflow 18.7 L/min &gt; pump 12.6).</text>
<text x="1000.0" y="377.0" font-size="12" text-anchor="start" fill="#000">2. Δp₂ = Δp₁ · (Q₂/Q₁)² from the catalogue point.</text>
<text x="1000.0" y="396.0" font-size="12" text-anchor="start" fill="#000">3. Sum the paths: Δp(P→A) + Δp(B→T).</text>
<text x="1000.0" y="415.0" font-size="12" text-anchor="start" fill="#000">4. Power loss P [kW] = Δp [bar] · Q / 600.</text>
<text x="1000.0" y="434.0" font-size="12" text-anchor="start" fill="#000">5. Check the performance limit (max flow at</text>
<text x="1000.0" y="453.0" font-size="12" text-anchor="start" fill="#000">   your pressure) – solenoid valves stop</text>
<text x="1000.0" y="472.0" font-size="12" text-anchor="start" fill="#000">   shifting above it.</text>
<text x="1000.0" y="491.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1000.0" y="510.0" font-size="12" text-anchor="start" fill="#000">Example NG10: 0.6 MPa @ 60 L/min →</text>
<text x="1000.0" y="529.0" font-size="12" text-anchor="start" fill="#000">0.6 · (90/60)² = 1.35 MPa @ 90 L/min.</text>
<text x="1000.0" y="548.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1000.0" y="567.0" font-size="12" text-anchor="start" fill="#000">Line style = size; ○ = rated point (Δp_N @ Q_N).</text>
<text x="1000.0" y="586.0" font-size="12" text-anchor="start" fill="#000">Accent = NG6 of the guide-25 job.</text>
