<text x="856.0" y="262.0" font-size="12" text-anchor="end" fill="#000" >front</text>
<text x="856.0" y="278.0" font-size="12" text-anchor="end" fill="#c0392b" >+1 K</text>
<line x1="800.0" y1="140.0" x2="800.0" y2="300.0" stroke="#000" stroke-width="1" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="794.0" y="224.0" font-size="12" text-anchor="end">L = 1.6 m</text>
<line x1="860.0" y1="330.0" x2="910.0" y2="330.0" stroke="#000" stroke-width="1" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="885.0" y="345.0" font-size="12" text-anchor="middle" fill="#000" >w = 0.7 m</text>
<text x="800.0" y="380.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold" >δ = α · ΔT · L² / (2 · w)</text>
<text x="800.0" y="400.0" font-size="12" text-anchor="start" fill="#000" >= 10.5·10⁻⁶ · 1 · 1.6² / (2 · 0.7) = 19.2 µm</text>
<text x="800.0" y="428.0" font-size="12" text-anchor="start" fill="#000" >Ball screw Ø50, 1 150 mm, +3 K: 39.7 µm</text>
<text x="800.0" y="446.0" font-size="12" text-anchor="start" fill="#000" >(linear scales remove it from the position)</text>
<text x="800.0" y="464.0" font-size="12" text-anchor="start" fill="#000" >Part 500 mm cast iron, +1 K: 5.3 µm</text>
<rect x="30.0" y="560.0" width="760.0" height="128.0" fill="#fff" stroke="#000" stroke-width="1.2" />
<text x="42.0" y="582.0" font-size="12" text-anchor="start" fill="#000" >Spindle growth: ΔL = α · L · ΔT = 11.5·10⁻⁶ · 400 mm · 10 K = 46 µm; time constant τ ≈ 30 min (example),</text>
<text x="42.0" y="602.0" font-size="12" text-anchor="start" fill="#000" >cooling τ ≈ 40 min. Points (Python check): 15 / 30 / 60 / 120 / 180 min → 18.1 / 29.1 / 39.8 / 45.2 / 45.9 µm.</text>
<text x="42.0" y="622.0" font-size="12" text-anchor="start" fill="#000" >Measures: remove heat at the source (chillers), symmetry, linear scales, stable hall 20 ± 2 K,</text>
<text x="42.0" y="642.0" font-size="12" text-anchor="start" fill="#000" >warm-up program, thermal model + probing.  Test method: ISO 230-3.  Guide 12, M14.</text>
<text x="42.0" y="662.0" font-size="12" text-anchor="start" fill="#000" >Model curves are examples – measure the real machine (ISO 230-3) and fit τ and k.</text>
