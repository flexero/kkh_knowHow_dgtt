<text x="240.0" y="271.2" font-size="11" text-anchor="middle" fill="#000">pinion</text>
<circle cx="328.0" cy="128.0" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="328.0" y1="128.0" x2="410.0" y2="100.0" stroke="#000" stroke-width="0.7"/>
<text x="414.0" y="104.0" font-size="11.5" text-anchor="start" fill="#000">top stage (moves s), steel flat + slide pads</text>
<circle cx="344.0" cy="160.0" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="344.0" y1="160.0" x2="410.0" y2="150.0" stroke="#000" stroke-width="0.7"/>
<text x="414.0" y="154.0" font-size="11.5" text-anchor="start" fill="#000">middle stage (moves s/2)</text>
<circle cx="376.0" cy="260.0" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="376.0" y1="260.0" x2="410.0" y2="270.0" stroke="#000" stroke-width="0.7"/>
<text x="414.0" y="274.0" font-size="11.5" text-anchor="start" fill="#000">base stage on the carriage</text>
<circle cx="352.0" cy="216.0" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="352.0" y1="216.0" x2="410.0" y2="220.0" stroke="#000" stroke-width="0.7"/>
<text x="414.0" y="224.0" font-size="11.5" text-anchor="start" fill="#000">guide rollers (steel / PU)</text>
<circle cx="272.0" cy="236.8" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="272.0" y1="236.8" x2="410.0" y2="320.0" stroke="#000" stroke-width="0.7"/>
<text x="414.0" y="324.0" font-size="11.5" text-anchor="start" fill="#000">rack (base → middle) + chain (middle → top)</text>
<line x1="104.0" y1="299.0" x2="104.0" y2="330.0" stroke="#555" stroke-width="0.6"/>
<line x1="376.0" y1="299.0" x2="376.0" y2="330.0" stroke="#555" stroke-width="0.6"/>
<line x1="104.0" y1="326.0" x2="376.0" y2="326.0" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="240.0" y="340.0" font-size="11.5" text-anchor="middle" fill="#000">≈ 170</text>
<text x="24.0" y="400.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Differential principle (one motor drives all stages)</text>
<rect x="60.0" y="450.0" width="300.0" height="16.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="370.0" y="463.0" font-size="11" text-anchor="start" fill="#000">base (fixed on the carriage)</text>
<rect x="135.0" y="474.0" width="300.0" height="16.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="445.0" y="487.0" font-size="11" text-anchor="start" fill="#000">middle: + s/2</text>
<rect x="210.0" y="498.0" width="300.0" height="16.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="520.0" y="511.0" font-size="11" text-anchor="start" fill="#000">top: + s</text>
<line x1="60.0" y1="450.0" x2="60.0" y2="436.0" stroke="#555" stroke-width="0.6"/>
<line x1="135.0" y1="450.0" x2="135.0" y2="436.0" stroke="#555" stroke-width="0.6"/>
<line x1="60.0" y1="440.0" x2="135.0" y2="440.0" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="97.5" y="435.0" font-size="11.5" text-anchor="middle" fill="#000">s/2</text>
<line x1="60.0" y1="514.0" x2="60.0" y2="544.0" stroke="#555" stroke-width="0.6"/>
<line x1="210.0" y1="514.0" x2="210.0" y2="544.0" stroke="#555" stroke-width="0.6"/>
<line x1="60.0" y1="540.0" x2="210.0" y2="540.0" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="135.0" y="554.0" font-size="11.5" text-anchor="middle" fill="#000">s</text>
<text x="60.0" y="580.0" font-size="11.5" text-anchor="start" fill="#000">chain over a sprocket on the middle stage: one end fixed to the base,</text>
<text x="60.0" y="598.0" font-size="11.5" text-anchor="start" fill="#000">the other to the top stage → the top moves twice as far as the middle.</text>
<text x="60.0" y="616.0" font-size="11.5" text-anchor="start" fill="#000">stroke s = ± 1 350 (single-deep), both sides L and R, 1.0 m/s, 1.2 m/s²,</text>
<text x="60.0" y="634.0" font-size="11.5" text-anchor="start" fill="#000">time per stroke 1.35 / 1.0 + 1.0 / 1.2 = 2.18 s; motor 1.1 kW</text>
<text x="640.0" y="30.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Fully extended, 300 kg crate (2 tines)</text>
<rect x="640.0" y="110.0" width="40.0" height="200.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="660.0" y="102.0" font-size="11" text-anchor="middle" fill="#000">carriage</text>
<rect x="680.0" y="230.0" width="120.0" height="14.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<rect x="800.0" y="230.0" width="162.0" height="14.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="962.0" y="230.0" width="162.0" height="14.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="740.0" y="262.0" font-size="11" text-anchor="middle" fill="#000">base</text>
<text x="880.9" y="262.0" font-size="11" text-anchor="middle" fill="#000">middle</text>
<text x="1040.0" y="262.0" font-size="11" text-anchor="middle" fill="#000">top</text>
<polyline points="680.0,237.0 691.1,237.1 702.2,237.3 713.3,237.7 724.4,238.2 735.5,238.8 746.6,239.6 757.7,240.5 768.8,241.5 779.9,242.6 791.0,243.9 802.1,245.2 813.2,246.6 824.3,248.2 835.4,249.8 846.5,251.5 857.6,253.2 868.7,255.1 879.8,257.0 890.9,258.9 902.0,261.0 913.1,263.0 924.2,265.1 935.3,267.3 946.4,269.5 957.5,271.7 968.6,273.9 979.7,276.1 990.8,278.4 1001.9,280.7 1013.0,282.9 1024.1,285.2 1035.2,287.5 1046.3,289.7 1057.4,292.0 1068.5,294.3 1079.6,296.5 1090.7,298.8 1101.8,301.1 1112.9,303.3 1124.0,305.6" fill="none" stroke="#1f6fd1" stroke-width="1.6" stroke-dasharray="6 3"/>
<rect x="860.0" y="50.0" width="288.0" height="180.0" rx="0" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="1004.0" y1="140.0" x2="1004.0" y2="210.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<text x="996.0" y="170.0" font-size="11.5" text-anchor="end" fill="#1f6fd1">F = 1.47 kN per tine</text>
<line x1="660.0" y1="270.0" x2="660.0" y2="304.0" stroke="#555" stroke-width="0.6"/>
<line x1="1004.0" y1="270.0" x2="1004.0" y2="304.0" stroke="#555" stroke-width="0.6"/>
<line x1="660.0" y1="300.0" x2="1004.0" y2="300.0" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="832.0" y="314.0" font-size="11.5" text-anchor="middle" fill="#000">1 350 crane axis → load centre</text>
<text x="1004.0" y="297.1" font-size="11" text-anchor="start" fill="#1f6fd1">tip 4.9 mm (drawn × 9)</text>
<text x="640.0" y="360.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Tip deflection at x = 1 350 (unit-load method)</text>
<text x="640.0" y="379.0" font-size="11.5" text-anchor="start" fill="#000">δ = Σ ∫ M·m / (E·I) dx, M = F (a − x), F = 300 × 9.81 / 2 = 1.47 kN</text>
<text x="640.0" y="398.0" font-size="11.5" text-anchor="start" fill="#000">elastic δ_e = 2.64 mm (stepped I: 3.0 / 1.2 / 0.6 × 10⁶ mm⁴)</text>
<text x="640.0" y="417.0" font-size="11.5" text-anchor="start" fill="#000">play in the stage rollers 2 × 0.4 mm over 300 overlap → 2.27 mm</text>
<text x="640.0" y="436.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">total ≈ 4.9 mm ≈ the 5 mm of the z budget (guide 31 §9)</text>
<text x="640.0" y="455.0" font-size="11.5" text-anchor="start" fill="#000">bending stress middle stage σ = 1.47 kN × 0.85 m / W = 33 MPa</text>
<text x="640.0" y="474.0" font-size="11.5" text-anchor="start" fill="#000">moment at the fork root per tine 1.99 kN·m</text>
<text x="640.0" y="512.0" font-size="11.5" text-anchor="start" fill="#000">What to check: stage play, chain tension, slide-pad wear,</text>
<text x="640.0" y="531.0" font-size="11.5" text-anchor="start" fill="#000">fork level with 300 kg (test load) at full stroke, both sides.</text>
