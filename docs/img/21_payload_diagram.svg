<text x="154" y="534.8" font-size="12" text-anchor="start" fill="#000" font-weight="bold">20 kg</text>
<circle cx="100" cy="404.4" r="6" stroke="#1f6fd1" stroke-width="1.5" fill="#1f6fd1"/>
<line x1="104" y1="400.4" x2="208" y2="101.8" stroke="#1f6fd1" stroke-width="0.9"/>
<text x="211.6" y="105.8" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">example 13 kg: Z = 218.5 mm → M5 = 38.7 N·m (88 %)</text>
<circle cx="100" cy="467.4" r="6" stroke="#000" stroke-width="1.5" fill="#fff"/>
<line x1="104" y1="463.4" x2="208" y2="142.2" stroke="#000" stroke-width="0.9"/>
<text x="211.6" y="146.2" font-size="11.5" text-anchor="start" fill="#000">short gripper (TCP 130): Z = 174.9 mm</text>
<text x="150.4" y="683.9" font-size="11" text-anchor="start" fill="#555">J6 torque limit: L ≤ 22 / (m · g)</text>
<text x="517.6" y="387.8" font-size="11" text-anchor="start" fill="#555">J4 / J5 torque limit:</text>
<text x="517.6" y="402.6" font-size="11" text-anchor="start" fill="#555">m · g · √((d6 + Z)² + L²)</text>
<text x="517.6" y="417.5" font-size="11" text-anchor="start" fill="#555">≤ 44 N·m</text>
<text x="700" y="72" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Definitions at the flange</text>
<rect x="720" y="100" width="70" height="46" rx="4" stroke="#000" stroke-width="1.3" fill="#dcdcdc"/>
<text x="755" y="128" font-size="11" text-anchor="middle" fill="#000">wrist</text>
<rect x="735" y="146" width="40" height="14" rx="0" stroke="#000" stroke-width="1.3" fill="url(#hatch)"/>
<text x="784" y="158" font-size="11" text-anchor="start" fill="#000">flange</text>
<rect x="725" y="160" width="60" height="90" rx="3" stroke="#1f6fd1" stroke-width="1.2" fill="none" stroke-dasharray="5 3"/>
<line x1="755" y1="90" x2="755" y2="300" stroke="#555" stroke-width="0.8" stroke-dasharray="14 3 2 3"/>
<circle cx="785" cy="230" r="6" stroke="#1f6fd1" stroke-width="1.3" fill="#1f6fd1"/>
<text x="795" y="234" font-size="11" text-anchor="start" fill="#1f6fd1" font-weight="bold">CoG of</text>
<text x="795" y="248.8" font-size="11" text-anchor="start" fill="#1f6fd1" font-weight="bold">gripper + part</text>
<line x1="752" y1="160" x2="750" y2="160" stroke="#555" stroke-width="0.7"/>
<line x1="752" y1="230" x2="750" y2="230" stroke="#555" stroke-width="0.7"/>
<line x1="755" y1="160" x2="755" y2="230" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="759" y="195" font-size="11" text-anchor="middle" fill="#000" transform="rotate(90 759 195)"></text>
<text x="748" y="202" font-size="13" text-anchor="end" fill="#000" font-weight="bold">Z</text>
<line x1="755" y1="268" x2="755" y2="270" stroke="#555" stroke-width="0.7"/>
<line x1="785" y1="268" x2="785" y2="270" stroke="#555" stroke-width="0.7"/>
<line x1="755" y1="265" x2="785" y2="265" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="770" y="261" font-size="11" text-anchor="middle" fill="#000"></text>
<text x="770" y="286" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">L</text>
<text x="755" y="316" font-size="11" text-anchor="middle" fill="#555">J6 axis</text>
<rect x="880" y="70" width="306" height="152" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="888" y="86.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Worked example (8.4)</text>
<text x="888" y="102.6" font-size="11.5" text-anchor="start" fill="#000">m = 3 + 10 = 13 kg (65 % of 20 kg) ✓</text>
<text x="888" y="118.1" font-size="11.5" text-anchor="start" fill="#000">z_c = (3 × 80 + 10 × 260) / 13 = 218.5</text>
<text x="888" y="133.7" font-size="11.5" text-anchor="start" fill="#000">M5 = 13 × 9.81 × (0.085 + 0.2185)</text>
<text x="888" y="149.2" font-size="11.5" text-anchor="start" fill="#000">   = 38.7 N·m (88 % of 44) ✓</text>
<text x="888" y="164.7" font-size="11.5" text-anchor="start" fill="#000">J5 = Σ [J_cog + m (d6 + z)²]</text>
<text x="888" y="180.2" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">   = 1.32 kg·m² &gt; 1.0 → NOT OK</text>
<rect x="700" y="340" width="486" height="140" rx="4" stroke="#1f6fd1" stroke-width="1.2" fill="#fff"/>
<text x="708" y="356.5" font-size="12.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Lesson</text>
<text x="708" y="372.6" font-size="11.5" text-anchor="start" fill="#000">A point inside its mass curve only proves the STATIC TORQUE.</text>
<text x="708" y="388.1" font-size="11.5" text-anchor="start" fill="#000">The moment of inertia about J5 / J6 is a second limit. It grows</text>
<text x="708" y="403.7" font-size="11.5" text-anchor="start" fill="#000">with the square of the distance → a long gripper fails first.</text>
<text x="708" y="419.2" font-size="11.5" text-anchor="start" fill="#000">Fix: shorter gripper (TCP 130 → J5 = 0.98 kg·m²), grip closer to</text>
<text x="708" y="434.7" font-size="11.5" text-anchor="start" fill="#000">the CoG, stronger robot, or reduced acceleration.</text>
<text x="708" y="450.2" font-size="11.5" text-anchor="start" fill="#000">Always run the maker's load tool (ABB RobotLoad, KUKA.Load …).</text>
<rect x="700" y="492" width="486" height="120" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="708" y="508.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Basis of these curves</text>
<text x="708" y="524.6" font-size="11.5" text-anchor="start" fill="#000">J4 / J5 static torque 44 N·m, J6 22 N·m (assumed),</text>
<text x="708" y="540.1" font-size="11.5" text-anchor="start" fill="#000">J4 / J5 inertia 1.0 kg·m², J6 0.3 kg·m² (assumed).</text>
<text x="708" y="555.6" font-size="11.5" text-anchor="start" fill="#000">Curves: generic method from these limits, d6 = 85 mm.</text>
<text x="708" y="571.2" font-size="11.5" text-anchor="start" fill="#000">A real load diagram also includes speed and life limits –</text>
<text x="708" y="586.7" font-size="11.5" text-anchor="start" fill="#000">use only the robot maker's diagram for a decision.</text>
<rect x="540" y="764" width="648" height="54" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="540" y1="790" x2="1188" y2="790" stroke="#000" stroke-width="0.8"/>
<line x1="910" y1="790" x2="910" y2="818" stroke="#000" stroke-width="0.8"/>
<text x="548" y="782" font-size="14" font-weight="bold">Load diagram Z–L – allowed mass vs. centre of gravity, with the example load</text>
<text x="548" y="809" font-size="12" font-weight="bold" fill="#1f6fd1">EXAMPLE – check the maker's documentation</text>
<text x="918" y="802" font-size="11.5">Dwg 21-06 · guide 21 §8.2–8.4 · generic 20 kg class</text>
<text x="918" y="814" font-size="11">NOT the IRB 2600 datasheet – generic limits</text>
</svg>
