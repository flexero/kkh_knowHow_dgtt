<line x1="100.0" y1="870.0" x2="200.0" y2="870.0" stroke="#000" stroke-width="3"/>
<text x="84.0" y="874.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">PE</text>
<text x="146.0" y="870.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">b</text>
<text x="240.0" y="812.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">L′ ≈ 1 µH/m, di/dt ≈ 1 kA/µs (example surge front)</text>
<text x="240.0" y="828.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">a + b = 0.5 m → 1 µH/m × 0.5 m × 1 kA/µs = 0.5 kV</text>
<text x="240.0" y="844.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">U = 1.5 kV + 0.5 kV = 2.0 kV ≤ 2.5 kV (cat. II) ✓</text>
<text x="240.0" y="860.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">a + b = 1.5 m → 3.0 kV ✗  → keep a + b ≤ 0.5 m or use V-wiring</text>
