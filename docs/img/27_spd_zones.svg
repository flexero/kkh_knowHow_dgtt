<text x="146.0" y="820.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">a</text>
<rect x="131.0" y="828.0" width="18.0" height="30.0" rx="0" stroke="#000" stroke-width="1.5" fill="#fff"/>
<line x1="140.0" y1="832.0" x2="140.0" y2="853.0" stroke="#000" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="140.0" y1="820.0" x2="140.0" y2="828.0" stroke="#000" stroke-width="1.5"/>
