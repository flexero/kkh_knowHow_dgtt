<text x="552.0" y="412.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">data SPD at LPZ entry – or better FIBRE (no metal, no SPD needed)</text>
<text x="1090.0" y="270.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">SPD types (IEC 61643-11)</text>
<text x="1090.0" y="292.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Type 1</text>
<text x="1142.0" y="292.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">10/350 µs, I_imp 12.5 kA/pole</text>
<text x="1142.0" y="306.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">MDB, service entrance</text>
<text x="1090.0" y="324.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000"></text>
<text x="1142.0" y="324.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">= 100 kA × 50 % / 4 conductors</text>
<text x="1142.0" y="338.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">(LPL III, TN-S: L1, L2, L3, N)</text>
<text x="1090.0" y="356.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Type 2</text>
<text x="1142.0" y="356.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">8/20 µs, I_n 20 kA</text>
<text x="1142.0" y="370.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">every board &gt; 10 m away</text>
<text x="1090.0" y="388.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Type 3</text>
<text x="1142.0" y="388.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">combination wave</text>
<text x="1142.0" y="402.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">≤ 10 m before device</text>
<text x="1090.0" y="420.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">U_c</text>
<text x="1142.0" y="420.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">≥ 1.1·U0 = 253 V</text>
<text x="1142.0" y="434.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">→ 255–320 V types</text>
<text x="1090.0" y="452.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">U_p</text>
<text x="1142.0" y="452.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">≤ 1.5 kV (T1/T2)</text>
<text x="1142.0" y="466.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">≤ 1 kV (T3)</text>
<text x="1090.0" y="500.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Impulse withstand (230/400 V)</text>
<text x="1090.0" y="520.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">cat. IV 6 kV – meter, main board</text>
<text x="1090.0" y="536.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">cat. III 4 kV – boards, fixed machines</text>
<text x="1090.0" y="552.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">cat. II 2.5 kV – appliances, tools</text>
<text x="1090.0" y="568.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">cat. I 1.5 kV – sensitive electronics</text>
<text x="1090.0" y="600.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">LPL  I / II / III / IV</text>
<text x="1090.0" y="618.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">peak current 200 / 150 / 100 / 100 kA</text>
<text x="1090.0" y="634.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">sphere radius 20 / 30 / 45 / 60 m</text>
<text x="1090.0" y="650.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">mesh 5×5 / 10×10 / 15×15 / 20×20 m</text>
<text x="1090.0" y="666.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">down cond. spacing 10 / 10 / 15 / 20 m</text>
