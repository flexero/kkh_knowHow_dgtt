<text x="439.0" y="282.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#111111">reject lane: re-label / manual check, then infeed again (TC 11 / 12 / 13)</text>
<text x="30.0" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">Dock-to-stock time for one delivery of 30 crates (example)</text>
<text x="30.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">unload + scan 30 crates</text>
<rect x="280.0" y="340.0" width="180.0" height="18.0" rx="2" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
<text x="466.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">0 – 20 min</text>
<text x="30.0" y="382.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">ID point + infeed</text>
<rect x="370.0" y="368.0" width="270.0" height="18.0" rx="2" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
<text x="646.0" y="382.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">10 – 40 min</text>
<text x="30.0" y="410.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">sample inspection n = 13</text>
<rect x="460.0" y="396.0" width="540.0" height="18.0" rx="2" fill="#eef3fa" stroke="#0a5fb4" stroke-width="1.2"/>
<text x="1006.0" y="410.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">20 – 80 min</text>
<text x="30.0" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">putaway 30 × 35 s (single cycles)</text>
<rect x="550.0" y="424.0" width="432.0" height="18.0" rx="2" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
<text x="988.0" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">30 – 78 min</text>
