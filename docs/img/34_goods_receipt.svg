<text x="706.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">ISO 2859-1, level II,</text>
<text x="706.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">AQL 1.0: lot 120 →</text>
<text x="706.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">n = 13, Ac 0 / Re 1</text>
<text x="706.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#0a5fb4">lot QI → released</text>
<text x="706.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#0a5fb4">or blocked + NCR</text>
<line x1="848.0" y1="136.0" x2="865.0" y2="136.0" stroke="#111111" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="865.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
