<text x="1000.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">80</text>
<line x1="1090.0" y1="455.0" x2="1090.0" y2="461.0" stroke="#111111" stroke-width="1"/>
<text x="1090.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">90</text>
<text x="685.0" y="492.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#666666">minutes after the truck arrives</text>
<text x="30.0" y="520.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">dock-to-stock (booked → all crates stored and released) ≈ 80 min – the sample decides, not the crane (30 × 35 s = 17.5 min of crane time).</text>
<text x="30.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">Crates can be stored in status QI before the sample result (the WMS blocks them for call-off) – then the crane does not wait for the lab.</text>
<rect x="30.0" y="560.0" width="1140.0" height="220.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="42.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">Checks at goods receipt (minimum)</text>
<text x="42.0" y="604.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">1  ASN ↔ PO: item, quantity, date, price – differences go to purchasing, not to the store</text>
<text x="42.0" y="626.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">2  SSCC unique, GS1 check digit OK (mod 10); crate ID readable by RFID AND barcode (two technologies)</text>
<text x="42.0" y="648.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">3  3.1 certificate (EN 10204) present, heat number on the certificate = heat on the ASN; file name = lot ID</text>
<text x="42.0" y="670.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">4  sample per ISO 2859-1: visual (cracks, porosity), key dimensions, hardness HB; record in the MES / QMS</text>
<text x="42.0" y="692.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">5  crate: no damage, no overhang (contour), weight ≤ 300 kg (rack design load), label on 2 sides</text>
<text x="42.0" y="714.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">6  result: lot released → category unrestricted; failed → whole lot blocked, NCR, supplier 8D, return or 100 % sort</text>
<text x="42.0" y="736.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">7  dock-to-stock KPI ≤ 1 – 2 h including inspection (guide 03 §28)</text>
</svg>