<text x="372.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">own crate label if</text>
<text x="372.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">needed (CRT, lot)</text>
<text x="372.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">put crate on infeed</text>
<text x="372.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#0a5fb4">print job</text>
<text x="372.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#0a5fb4">vc-ops-prt01</text>
