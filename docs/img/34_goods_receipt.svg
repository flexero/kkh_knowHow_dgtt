<text x="1040.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">TC status 00</text>
<text x="1040.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">quant in slot</text>
<text x="1040.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">category released</text>
<text x="1040.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#0a5fb4">GM 101 to ERP</text>
<text x="1040.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#0a5fb4">value + lot qty</text>
