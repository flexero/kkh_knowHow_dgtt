<text x="873.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">WMS picks the slot:</text>
<text x="873.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">zone by class, FIFO,</text>
<text x="873.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">weight class</text>
<text x="873.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#0a5fb4">TO telegram</text>
<text x="873.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#0a5fb4">crane store cycle</text>
<line x1="1015.0" y1="136.0" x2="1032.0" y2="136.0" stroke="#111111" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="1032.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
