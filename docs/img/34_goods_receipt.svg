<text x="370.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">10</text>
<line x1="460.0" y1="455.0" x2="460.0" y2="461.0" stroke="#111111" stroke-width="1"/>
<text x="460.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">20</text>
<line x1="550.0" y1="455.0" x2="550.0" y2="461.0" stroke="#111111" stroke-width="1"/>
<text x="550.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">30</text>
<line x1="640.0" y1="455.0" x2="640.0" y2="461.0" stroke="#111111" stroke-width="1"/>
<text x="640.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">40</text>
<line x1="730.0" y1="455.0" x2="730.0" y2="461.0" stroke="#111111" stroke-width="1"/>
<text x="730.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">50</text>
<line x1="820.0" y1="455.0" x2="820.0" y2="461.0" stroke="#111111" stroke-width="1"/>
<text x="820.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">60</text>
