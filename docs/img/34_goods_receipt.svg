<text x="14.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="bold" fill="#111111">Goods receipt flow – ASN → unloading → ID point → quality check → putaway job → slot</text>
<text x="14.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#666666">physical flow (boxes) and system postings (accent text) for one delivery of 120 × CC20-CAST = 30 crates; times are examples</text>
