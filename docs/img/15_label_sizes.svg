<text x="64" y="286" font-size="11" text-anchor="start" fill="#c62828" xml:space="preserve">10X = 5 mm quiet zone</text>
<line x1="110" y1="245" x2="890" y2="245" stroke="#000" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="500" y="270" font-size="12" text-anchor="middle" fill="#000" xml:space="preserve">156 modules × 0.5 mm = 78 mm</text>
<text x="960" y="150" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">bar height ≥ 31.75 mm for logistics labels</text>
<text x="960" y="168" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">(GS1 General Specifications – check the table)</text>
<text x="960" y="194" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">N = 11 symbol characters:</text>
<text x="960" y="212" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">FNC1 + 10 digit pairs in code set C</text>
<text x="960" y="230" font-size="12" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">modules = 11·11 + 35 = 156</text>
<text x="960" y="256" font-size="12" text-anchor="start" fill="#c62828" xml:space="preserve">with quiet zones 78 + 2 × 5 = 88 mm</text>
<text x="960" y="274" font-size="12" text-anchor="start" fill="#c62828" xml:space="preserve">→ fits a 102 mm (4 in) wide label</text>
<text x="40" y="320" font-size="14" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">2  One module X built from whole printer dots (target X ≈ 0.5 mm, drawn at 400 px per mm)</text>
