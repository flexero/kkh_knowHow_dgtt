<text x="24" y="34" font-size="17" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Label design – X-dimension, quiet zone, printer resolution (DPI) and standard label sizes</text>
<text x="24" y="56" font-size="12" text-anchor="start" fill="#555" xml:space="preserve">Formulas: dot pitch p = 25.4 / DPI [mm];  X = n · p (n = whole dots per module);  Code 128 width = (11·N + 35)·X + 2 · 10X quiet zone.</text>
