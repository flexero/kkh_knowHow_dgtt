<text x="1163.2" y="380" font-size="16" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">600 dpi</text>
<text x="1163.2" y="406" font-size="12" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">p = 25.4 / 600</text>
<text x="1163.2" y="424" font-size="12" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">  = 0.0423 mm</text>
<text x="1163.2" y="448" font-size="12" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">X = 12 × p</text>
<text x="1163.2" y="466" font-size="12" text-anchor="start" fill="#c62828" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">  = 0.508 mm</text>
<text x="60" y="582" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">Never scale a code by a non-integer factor: 0.33 mm at 203 dpi = 2.6 dots → the printer rounds → bar-width error. Allowed X at 203 dpi: 0.250 / 0.375 / 0.500 / 0.626 / 0.751 mm.</text>
<text x="40" y="620" font-size="14" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">3  Quiet zones (no print, no edge inside)</text>
