<text x="790" y="806" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">Human-readable text ≥ 2 mm high. Thermal transfer + resin ribbon</text>
<text x="790" y="824" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">on polyester for oil and washer; direct thermal only for</text>
<text x="790" y="842" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">short-life paper labels (&lt; 6 months, no heat, no sun).</text>
