<text x="20.0" y="892.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">6 ms &lt; 200 ms → every device behind the break fails for a moment (line stops although the ring 'worked')</text>
<text x="20.0" y="910.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">fix: watchdog ≥ recovery (2 ms × 100 = 200 ms), or MRPD/HSR (0 ms). PROFIsafe F-monitoring time must also be &gt; recovery.</text>
