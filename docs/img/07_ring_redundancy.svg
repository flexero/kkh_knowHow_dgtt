<text x="868.0" y="837.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">200 ms</text>
<text x="20.0" y="865.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">MRPD / HSR / PRP</text>
