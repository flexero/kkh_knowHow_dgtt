<circle cx="458.0" cy="175.0" r="10.0" fill="#fff" stroke="#1f6fd1" stroke-width="2"/>
<circle cx="458.0" cy="175.0" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="225.0" y="183.0" width="10.0" height="10.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<rect x="225.0" y="157.0" width="10.0" height="10.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<text x="230.0" y="210.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">A</text>
<text x="230.0" y="152.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">B</text>
<text x="24.0" y="270.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">2  half way: s_mid = 337.5 mm, s_top = 675 mm</text>
<line x1="320.0" y1="280.0" x2="320.0" y2="410.0" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="170.0" y="380.0" width="300.0" height="18.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="162.0" y="394.0" font-size="12" text-anchor="end" fill="#000">base</text>
<rect x="271.2" y="350.0" width="300.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="263.2" y="364.0" font-size="12" text-anchor="end" fill="#1f6fd1">middle</text>
<rect x="372.5" y="300.0" width="300.0" height="18.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="364.5" y="314.0" font-size="12" text-anchor="end" fill="#000">top</text>
<path d="M 230.0 378.0 L 559.2 378.0 A 13 13 0 0 0 559.2 352.0 L 432.5 352.0" fill="none" stroke="#000" stroke-width="3"/>
<circle cx="559.2" cy="365.0" r="10.0" fill="#fff" stroke="#1f6fd1" stroke-width="2"/>
<circle cx="559.2" cy="365.0" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="225.0" y="373.0" width="10.0" height="10.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<rect x="427.5" y="347.0" width="10.0" height="10.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<text x="230.0" y="400.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">A</text>
<text x="432.5" y="342.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">B</text>
<line x1="320.0" y1="428.0" x2="421.2" y2="428.0" stroke="#000" stroke-width="1" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="370.6" y="443.0" font-size="11.5" text-anchor="middle" fill="#000">s_mid = 338</text>
<line x1="320.0" y1="450.0" x2="522.5" y2="450.0" stroke="#1f6fd1" stroke-width="1" marker-end="url(#ea)" marker-start="url(#sa)"/>
<text x="421.2" y="465.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1">s_top = 675</text>
<text x="24.0" y="460.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">3  full stroke: s_mid = 675 mm, s_top = 1 350 mm</text>
<line x1="320.0" y1="470.0" x2="320.0" y2="600.0" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="170.0" y="570.0" width="300.0" height="18.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="162.0" y="584.0" font-size="12" text-anchor="end" fill="#000">base</text>
<rect x="372.5" y="540.0" width="300.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="364.5" y="554.0" font-size="12" text-anchor="end" fill="#1f6fd1">middle</text>
<rect x="575.0" y="490.0" width="300.0" height="18.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="567.0" y="504.0" font-size="12" text-anchor="end" fill="#000">top</text>
<path d="M 230.0 568.0 L 660.5 568.0 A 13 13 0 0 0 660.5 542.0 L 635.0 542.0" fill="none" stroke="#000" stroke-width="3"/>
<circle cx="660.5" cy="555.0" r="10.0" fill="#fff" stroke="#1f6fd1" stroke-width="2"/>
<circle cx="660.5" cy="555.0" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="225.0" y="563.0" width="10.0" height="10.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<rect x="630.0" y="537.0" width="10.0" height="10.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<text x="230.0" y="590.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">A</text>
<text x="635.0" y="532.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">B</text>
<line x1="320.0" y1="618.0" x2="522.5" y2="618.0" stroke="#000" stroke-width="1" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="421.2" y="633.0" font-size="11.5" text-anchor="middle" fill="#000">s_mid = 675</text>
<line x1="320.0" y1="640.0" x2="725.0" y2="640.0" stroke="#1f6fd1" stroke-width="1" marker-end="url(#ea)" marker-start="url(#sa)"/>
<text x="522.5" y="655.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1">s_top = 1350</text>
<text x="900.0" y="120.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Why the top stage moves twice as far</text>
<text x="900.0" y="141.0" font-size="12" text-anchor="start" fill="#000">Chain length is constant:</text>
<text x="900.0" y="162.0" font-size="12" text-anchor="start" fill="#000">  L = (x_spr − x_A) + (x_spr − x_B) + π·r</text>
<text x="900.0" y="183.0" font-size="12" text-anchor="start" fill="#000">Move the middle stage + sprocket by Δs:</text>
<text x="900.0" y="204.0" font-size="12" text-anchor="start" fill="#000">  the lower strand gets longer by Δs,</text>
<text x="900.0" y="225.0" font-size="12" text-anchor="start" fill="#000">  so the upper strand must get shorter by Δs</text>
<text x="900.0" y="246.0" font-size="12" text-anchor="start" fill="#000">  → anchor B moves Δs + Δs = 2·Δs</text>
<text x="900.0" y="267.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="900.0" y="288.0" font-size="12.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">s_top = 2 · s_mid</text>
<text x="900.0" y="309.0" font-size="12.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">v_top = 2 · v_mid,  a_top = 2 · a_mid</text>
<text x="900.0" y="330.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="900.0" y="351.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Forces (one tine)</text>
<text x="900.0" y="372.0" font-size="12" text-anchor="start" fill="#000">chain force T = force at the top stage</text>
<text x="900.0" y="393.0" font-size="12" text-anchor="start" fill="#000">sprocket axle: 2 · T (both strands pull)</text>
<text x="900.0" y="414.0" font-size="12" text-anchor="start" fill="#000">rack pushes 2 · T = 2 × chain force</text>
<text x="900.0" y="435.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="900.0" y="456.0" font-size="12" text-anchor="start" fill="#000">Example: F_top 761 N (2 tines)</text>
<text x="900.0" y="477.0" font-size="12" text-anchor="start" fill="#000">  T = 761 / 2 = 380 N per tine</text>
<text x="900.0" y="498.0" font-size="12" text-anchor="start" fill="#000">  rack force 2 × 761 = 1 521 N</text>
<text x="900.0" y="519.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="900.0" y="540.0" font-size="12" text-anchor="start" fill="#000">A 2nd chain (other side of the tine)</text>
<text x="900.0" y="561.0" font-size="12" text-anchor="start" fill="#000">pulls the top stage to side L.</text>
<text x="900.0" y="582.0" font-size="12" text-anchor="start" fill="#000">Link on the lower strand: still (v = 0).</text>
<text x="900.0" y="603.0" font-size="12" text-anchor="start" fill="#000">Link on the upper strand: moves</text>
<text x="900.0" y="624.0" font-size="12" text-anchor="start" fill="#000">with the tine (2·v_mid).</text>
<rect x="774" y="752" width="414" height="66" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="774" y1="774" x2="1188" y2="774" stroke="#000" stroke-width="0.8"/><line x1="844" y1="752" x2="844" y2="774" stroke="#000" stroke-width="0.8"/>
<text x="782" y="768" font-size="12.5" fill="#000" font-weight="bold">39-02</text>
<text x="852" y="768" font-size="12" fill="#000" font-weight="bold">Stroke doubling with chains (pulley-block principle)</text>
<text x="782" y="791" font-size="12" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the fork maker's documentation</text>
<text x="782" y="809" font-size="11" fill="#000">Digital twin · ASRS-RAW telescopic fork · guide 39 · not to scale · mm</text>
</svg>
