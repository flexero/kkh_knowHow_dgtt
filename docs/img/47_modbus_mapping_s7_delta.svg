<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">Modbus TCP server in the PLC – Siemens MB_SERVER vs Delta AS (holding registers of map V1.1)</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><rect x="30" y="70" width="540" height="300" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="300.0" y="88.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Siemens S7-1200 / S7-1500 – MB_SERVER</text><text x="300.0" y="104.5" font-size="12.5" text-anchor="middle" fill="#000">OB1: MB_SERVER(DISCONNECT := FALSE,</text><text x="300.0" y="121.0" font-size="12.5" text-anchor="middle" fill="#000">   MB_HOLD_REG := P#DB10.DBX0.0 WORD 227,</text><text x="300.0" y="137.5" font-size="12.5" text-anchor="middle" fill="#000">   CONNECT := "MbConn".gw01)  // TCON_IP_v4</text><text x="300.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#000">TCON_IP_v4: InterfaceId 64 (check HW id), ID 1,</text><text x="300.0" y="170.5" font-size="12.5" text-anchor="middle" fill="#000">   ConnectionType 11 (TCP), ActiveEstablished FALSE,</text><text x="300.0" y="187.0" font-size="12.5" text-anchor="middle" fill="#000">   RemoteAddress 0.0.0.0, RemotePort 0, LocalPort 502</text><text x="300.0" y="203.5" font-size="12.5" text-anchor="middle" fill="#000">second client gw02: 2nd call, own instance DB, ID 2</text><text x="300.0" y="220.0" font-size="12.5" text-anchor="middle" fill="#000">I1 watchdog: 226 changed in 5 s (NDR / DR optional)</text><text x="300.0" y="236.5" font-size="12.5" text-anchor="middle" fill="#000">ERROR / STATUS (e.g. no connection resources)</text><text x="300.0" y="253.0" font-size="12.5" text-anchor="middle" fill="#000">FC01 / FC05 → %Q · FC02 → %I · FC04 → %IW (!)</text><text x="300.0" y="269.5" font-size="12.5" text-anchor="middle" fill="#000">FC03 / FC06 / FC16 → MB_HOLD_REG</text><rect x="630" y="70" width="540" height="300" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="900.0" y="88.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Delta AS332T-A – built-in Modbus TCP server</text><text x="900.0" y="104.5" font-size="12.5" text-anchor="middle" fill="#000">HWCONFIG → CPU → Ethernet: IP / mask / gateway</text><text x="900.0" y="121.0" font-size="12.5" text-anchor="middle" fill="#000">Modbus TCP server enabled (check menu), port 502</text><text x="900.0" y="137.5" font-size="12.5" text-anchor="middle" fill="#000">holding register n = D n  (check AS manual!)</text><text x="900.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#000">→ map image in D0 … D226, own data from D1000</text><text x="900.0" y="170.5" font-size="12.5" text-anchor="middle" fill="#000">coils / FC01 / FC05 = M bits (check range)</text><text x="900.0" y="187.0" font-size="12.5" text-anchor="middle" fill="#000">DVP series differ: D0 = 0x1000 = 4096 (404097),</text><text x="900.0" y="203.5" font-size="12.5" text-anchor="middle" fill="#000">   M0 = 0x0800, X0 = 0x0400, Y0 = 0x0500</text><text x="900.0" y="220.0" font-size="12.5" text-anchor="middle" fill="#000">no per-request flag in the program →</text><text x="900.0" y="236.5" font-size="12.5" text-anchor="middle" fill="#000">   map V1.1 gateway heartbeat D226 (+1 per s):</text><text x="900.0" y="253.0" font-size="12.5" text-anchor="middle" fill="#000">   I1: D226 &lt;&gt; D1036 → MOV, TOF 5 s = gateway OK</text><text x="900.0" y="269.5" font-size="12.5" text-anchor="middle" fill="#000">connections: check the number in the manual</text><text x="30" y="400" font-size="15" text-anchor="start" font-weight="700" fill="#000">32-bit values – word order</text><text x="30" y="424" font-size="12.5" text-anchor="start" font-weight="700" fill="#000">REAL 212.5 = 0x43548000 in the map (ABCD): register 24, 25</text><rect x="30" y="430" width="116" height="36" rx="0" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.2"/><text x="88" y="453" font-size="12.5" text-anchor="middle" fill="#000">24: 0x4354</text><rect x="150" y="430" width="116" height="36" rx="0" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.2"/><text x="208" y="453" font-size="12.5" text-anchor="middle" fill="#000">25: 0x8000</text><text x="30" y="494" font-size="12.5" text-anchor="start" font-weight="700" fill="#000">Siemens "MB_HR".std_lastCycle_s (Real at DBD48)</text><rect x="30" y="500" width="116" height="36" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="88" y="523" font-size="12.5" text-anchor="middle" fill="#000">DBW48: 0x4354</text><rect x="150" y="500" width="116" height="36" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="208" y="523" font-size="12.5" text-anchor="middle" fill="#000">DBW50: 0x8000</text><text x="30" y="564" font-size="12.5" text-anchor="start" font-weight="700" fill="#000">Delta float D1014 / D1015 (low word first!)</text><rect x="30" y="570" width="116" height="36" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="88" y="593" font-size="12.5" text-anchor="middle" fill="#000">D1014: 0x8000</text><rect x="150" y="570" width="116" height="36" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="208" y="593" font-size="12.5" text-anchor="middle" fill="#000">D1015: 0x4354</text><text x="30" y="634" font-size="12.5" text-anchor="start" font-weight="700" fill="#000">Delta after MOV D1015 D24 + MOV D1014 D25</text><rect x="30" y="640" width="116" height="36" rx="0" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.2"/><text x="88" y="663" font-size="12.5" text-anchor="middle" fill="#000">D24: 0x4354</text><rect x="150" y="640" width="116" height="36" rx="0" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.2"/><text x="208" y="663" font-size="12.5" text-anchor="middle" fill="#000">D25: 0x8000</text><text x="300" y="523" font-size="12.5" text-anchor="start" fill="#000">big-endian = ABCD, one MOVE</text><text x="300" y="593" font-size="12.5" text-anchor="start" fill="#1f6fd1">CDAB if moved with DMOVR D1014 D24 – wrong!</text><text x="300" y="663" font-size="12.5" text-anchor="start" fill="#000">correct ABCD</text><text x="640" y="400" font-size="15" text-anchor="start" font-weight="700" fill="#000">0-based and 1-based</text><text x="640" y="426" font-size="12.5" text-anchor="start" fill="#000">map offset 0 = 'register 40001' in 1-based tools = PDU address 0</text><text x="640" y="448" font-size="12.5" text-anchor="start" fill="#000">offset 224 (cmd.lotQty) = 40225 · writing 40224 in a 1-based tool hits 223 (recipe)!</text><text x="640" y="470" font-size="12.5" text-anchor="start" fill="#000">Siemens: MB_HOLD_REG word 0 = offset 0</text><text x="640" y="492" font-size="12.5" text-anchor="start" fill="#000">Delta AS: D0 = offset 0 (check) · DVP: D0 = offset 4096</text><text x="640" y="530" font-size="15" text-anchor="start" font-weight="700" fill="#000">Write protection</text><text x="640" y="556" font-size="12.5" text-anchor="start" fill="#000">neither MB_SERVER nor the Delta server can make 0 … 199 read-only</text><text x="640" y="578" font-size="12.5" text-anchor="start" fill="#000">→ the PLC program rewrites the image every scan; the gateway writes</text><text x="640" y="600" font-size="12.5" text-anchor="start" fill="#000">   only 200 … 226 (the item-4 simulator answers exception 02 elsewhere)</text><text x="640" y="640" font-size="15" text-anchor="start" font-weight="700" fill="#000">Poll period vs scan time</text><text x="640" y="666" font-size="12.5" text-anchor="start" fill="#000">MB_SERVER is processed once per scan: 20 ms scan, 100 ms poll → fine</text><text x="640" y="688" font-size="12.5" text-anchor="start" fill="#000">toggle bits are LEVELS, not pulses → a slow poll never misses an ACK</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>