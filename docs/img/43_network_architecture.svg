th="1.4"/><rect x="360" y="488" width="150" height="54" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="435.0" y="504.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">VLAN 643 switch</text><text x="435.0" y="518.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">Grinding room</text><text x="435.0" y="532.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">22 machines</text><line x1="435" y1="542" x2="435" y2="622" stroke="#1565c0" stroke-width="1.6"/><text x="440" y="570" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Cat6A copper</text><text x="440" y="584" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">Modbus TCP 502</text><rect x="370" y="622" width="130" height="26" rx="3" fill="#fff" stroke="#000" stroke-width="1"/><text x="435" y="639" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">PLC / CNC / meters</text><line x1="600" y1="440" x2="435" y2="488" stroke="#1565c0" stroke-width="1.4"/><rect x="525" y="488" width="150" height="54" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="600.0" y="504.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">VLAN 644 switch</text><text x="600.0" y="518.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">Metrology</text><text x="600.0" y="532.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">8 machines</text><line x1="600" y1="542" x2="600" y2="622" stroke="#1565c0" stroke-width="1.6"/><text x="605" y="570" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Cat6A copper</text><text x="605" y="584" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">Modbus TCP 502</text><rect x="535" y="622" width="130" height="26" rx="3" fill="#fff" stroke="#000" stroke-width="1"/><text x="600" y="639" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">PLC / CNC / meters</text><line x1="600" y1="440" x2="600" y2="488" stroke="#1565c0" stroke-width="1.4"/><rect x="690" y="488" width="150" height="54" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="765.0" y="504.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">VLAN 645 switch</text><text x="765.0" y="518.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">Assembly + packing</text><text x="765.0" y="532.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">15 machines</text><line x1="765" y1="542" x2="765" y2="622" stroke="#1565c0" stroke-width="1.6"/><text x="770" y="570" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Cat6A copper</text><text x="770" y="584" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">Modbus TCP 502</text><rect x="700" y="622" width="130" height="26" rx="3" fill="#fff" stroke="#000" stroke-width="1"/><text x="765" y="639" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">PLC / CNC / meters</text><line x1="600" y1="440" x2="765" y2="488" stroke="#1565c0" stroke-width="1.4"/><rect x="855" y="488" width="150" height="54" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="930.0" y="504.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">VLAN 650 switch</text><text x="930.0" y="518.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">AGV Wi-Fi (own SSID)</text><text x="930.0" y="532.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">2 AGVs + chargers</text><line x1="930" y1="542" x2="930" y2="622" stroke="#000" stroke-width="1.2" stroke-dasharray="5 3"/><text x="935" y="570" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Wi-Fi</text><text x="935" y="584" font-size="11" text-anchor="start" font-weight="normal" fill="#000">fleet HTTP</text><rect x="865" y="622" width="130" height="26" rx="3" fill="#fff" stroke="#000" stroke-width="1"/><text x="930" y="639" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">AGV controllers</text><line x1="600" y1="440" x2="930" y2="488" stroke="#000" stroke-width="1.4"/><rect x="1020" y="488" width="150" height="54" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1095.0" y="504.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">VLAN 660 switch</text><text x="1095.0" y="518.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">Utilities</text><text x="1095.0" y="532.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">meters, air, HVAC, doors</text><line x1="1095" y1="542" x2="1095" y2="622" stroke="#1565c0" stroke-width="1.6"/><text x="1090" y="570" font-size="11" text-anchor="end" font-weight="normal" fill="#000">Cat6A copper</text><text x="1090" y="584" font-size="11" text-anchor="end" font-weight="normal" fill="#1565c0">Modbus TCP 502</text><rect x="1030" y="622" width="130" height="26" rx="3" fill="#fff" stroke="#000" stroke-width="1"/><text x="1095" y="639" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">PLC / CNC / meters</text><line x1="600" y1="440" x2="1095" y2="488" stroke="#1565c0" stroke-width="1.4"/><text x="830" y="416" font-size="11" text-anchor="start" font-weight="normal" fill="#000">fibre between halls (1 Gbit/s),</text><text x="830" y="432" font-size="11" text-anchor="start" font-weight="normal" fill="#000">copper ≤ 90 m inside a cell</text><text x="22" y="674" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Level 0 · Machines / PLCs / sensors (each with its own Modbus TCP server)</text><line x1="480" y1="136" x2="480" y2="166" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><line x1="470" y1="206" x2="420" y2="238" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="452" y="226" font-size="11" text-anchor="start" font-weight="normal" fill="#000">HTTPS</text><line x1="360" y1="282" x2="320" y2="320" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="354" y="304" font-size="11" text-anchor="start" font-weight="bold" fill="#000">HTTP(S) REST + JSON / SSE</text><line x1="420" y1="346" x2="402" y2="346" stroke="#000" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#as)"/><line x1="300" y1="372" x2="600" y2="400" stroke="#1565c0" stroke-width="2.2"/><text x="120" y="422" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">gateway = only Modbus client:</text><text x="120" y="436" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">Modbus TCP 502 to all cells</text><line x1="725" y1="372" x2="680" y2="400" stroke="#000" stroke-width="1.2"/><line x1="915" y1="372" x2="760" y2="400" stroke="#000" stroke-width="1.2"/><rect x="30" y="690" width="560" height="110" rx="3" fill="#fff" stroke="#000" stroke-width="1"/><text x="40" y="708" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Legend + rules</text><line x1="42" y1="726" x2="92" y2="726" stroke="#1565c0" stroke-width="2.2"/><text x="102" y="730" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Modbus TCP, port 502 – machines / PLCs ↔ gateway only</text><line x1="42" y1="746" x2="92" y2="746" stroke="#000" stroke-width="1.2"/><text x="102" y="750" font-size="11" text-anchor="start" font-weight="normal" fill="#000">HTTP(S): REST + JSON, Server-Sent Events – everything above</text><text x="42" y="770" font-size="11" text-anchor="start" font-weight="bold" fill="#000">No MQTT, no OPC UA. SAFETY IS HARD-WIRED (safety relay / F-PLC),</text><text x="42" y="786" font-size="11" text-anchor="start" font-weight="bold" fill="#000">never over Modbus or HTTP. Fixed IPs, no DHCP in the cells.</text><text x="620" y="712" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Example: BS-TGR-03 = unit 15 = 10.60.43.16</text><text x="620" y="728" font-size="12" text-anchor="start" font-weight="normal" fill="#000">host vc-bsf-grd-bstgr03, port 502</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Network architecture</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-01  ·  guide 43 §4</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
