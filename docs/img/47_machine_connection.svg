<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">How one machine is connected – from the sensor to the MES</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><rect x="30" y="90" width="200" height="190" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="130.0" y="108.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Field level</text><text x="130.0" y="124.5" font-size="12.5" text-anchor="middle" fill="#000">sensors 24 V PNP</text><text x="130.0" y="141.0" font-size="12.5" text-anchor="middle" fill="#000">4 – 20 mA / 0 – 10 V</text><text x="130.0" y="157.5" font-size="12.5" text-anchor="middle" fill="#000">PT100, encoder</text><text x="130.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#000">valves, contactors,</text><text x="130.0" y="190.5" font-size="12.5" text-anchor="middle" fill="#000">servo drive, generator</text><rect x="260" y="90" width="210" height="190" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="365.0" y="108" font-size="12" text-anchor="middle" font-weight="700" fill="#000">PLC</text><text x="365.0" y="124" font-size="12" text-anchor="middle" fill="#000">program (LAD / ST)</text><text x="365.0" y="140" font-size="12" text-anchor="middle" fill="#000">scan 10 – 20 ms</text><text x="365.0" y="156" font-size="12" text-anchor="middle" fill="#000">standard interface FB</text><text x="365.0" y="172" font-size="12" text-anchor="middle" fill="#000">Modbus TCP SERVER</text><text x="365.0" y="188" font-size="12" text-anchor="middle" fill="#000">port 502, D0 – D225 /</text><text x="365.0" y="204" font-size="12" text-anchor="middle" fill="#000">"MB_HR"</text><rect x="500" y="90" width="190" height="190" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="595.0" y="108.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Cell switch</text><text x="595.0" y="124.5" font-size="12.5" text-anchor="middle" fill="#000">managed, VLAN 64x</text><text x="595.0" y="141.0" font-size="12.5" text-anchor="middle" fill="#000">100 Mbit / 1 Gbit</text><text x="595.0" y="157.5" font-size="12.5" text-anchor="middle" fill="#000">Cat6A / M12 X-coded</text><text x="595.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#000">port mirror for</text><text x="595.0" y="190.5" font-size="12.5" text-anchor="middle" fill="#000">Wireshark</text><rect x="720" y="90" width="200" height="190" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="820.0" y="108" font-size="12" text-anchor="middle" font-weight="700" fill="#000">Gateway</text><text x="820.0" y="124" font-size="12" text-anchor="middle" fill="#000">Modbus TCP CLIENT</text><text x="820.0" y="140" font-size="12" text-anchor="middle" fill="#000">fast 0 – 11: 500 ms</text><text x="820.0" y="156" font-size="12" text-anchor="middle" fill="#000">(100 ms in a command)</text><text x="820.0" y="172" font-size="12" text-anchor="middle" fill="#000">counters 1 s</text><text x="820.0" y="188" font-size="12" text-anchor="middle" fill="#000">energy 10 s</text><text x="820.0" y="204" font-size="12" text-anchor="middle" fill="#000">HTTP server</text><rect x="950" y="90" width="220" height="190" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1060.0" y="108.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">MES / twin / andon</text><text x="1060.0" y="124.5" font-size="12.5" text-anchor="middle" fill="#000">HTTP REST + JSON</text><text x="1060.0" y="141.0" font-size="12.5" text-anchor="middle" fill="#000">SSE live events</text><text x="1060.0" y="157.5" font-size="12.5" text-anchor="middle" fill="#000">orders → handshake</text><text x="1060.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#000">DONE → confirmation</text><text x="1060.0" y="190.5" font-size="12.5" text-anchor="middle" fill="#000">trend, OEE</text><line x1="230" y1="185" x2="258" y2="185" stroke="#000" stroke-width="1.6" marker-end="url(#aK)"/><line x1="470" y1="185" x2="498" y2="185" stroke="#000" stroke-width="1.6" marker-end="url(#aK)"/><line x1="690" y1="185" x2="718" y2="185" stroke="#000" stroke-width="1.6" marker-end="url(#aK)"/><line x1="920" y1="185" x2="948" y2="185" stroke="#000" stroke-width="1.6" marker-end="url(#aK)"/><text x="245" y="176" font-size="11" text-anchor="middle" fill="#000">wires</text><text x="485" y="176" font-size="11" text-anchor="middle" fill="#000">TCP</text><text x="705" y="176" font-size="11" text-anchor="middle" fill="#000">502</text><text x="935" y="176" font-size="11" text-anchor="middle" fill="#000">HTTP</text><rect x="260" y="320" width="210" height="60" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="365" y="344" font-size="13" text-anchor="middle" font-weight="700" fill="#000">safety relay / F-CPU</text><text x="365" y="362" font-size="12" text-anchor="middle" fill="#000">e-stop, guard, STO, HV off</text><line x1="130" y1="280" x2="130" y2="350" stroke="#000" stroke-width="1.2"/><line x1="130" y1="350" x2="258" y2="350" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><line x1="365" y1="320" x2="365" y2="282" stroke="#000" stroke-width="1.2" marker-end="url(#aK)" stroke-dasharray="5 4"/><text x="375" y="305" font-size="11" text-anchor="start" fill="#000">status only (DI)</text><text x="30" y="420" font-size="14" text-anchor="start" font-weight="700" fill="#000">One fast-block poll (example BS-TGR-03, unit 15):</text><text x="30" y="446" font-size="13" text-anchor="start" fill="#000">request: 00 2A 00 00 00 06 0F 03 00 00 00 0C  =  FC03, start 0, 12 registers</text><text x="30" y="468" font-size="13" text-anchor="start" fill="#000">response: 00 2A 00 00 00 1B 0F 03 18 01 01 00 0C 00 0F 0B 2C 00 01 00 01 00 02 00 00 00 03 …</text><text x="30" y="490" font-size="12" text-anchor="start" fill="#000">          map version 0x0101, type 12, unit 15, heartbeat 2860, status 1 = RUN, mode 1 = AUTO, state 2, alarm 0, hs.status 3 = ACK + BUSY …</text><text x="30" y="530" font-size="14" text-anchor="start" font-weight="700" fill="#000">Timing chain (example)</text><rect x="30" y="544" width="380" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><rect x="410" y="544" width="330" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40" y="564" font-size="12.5" text-anchor="start" fill="#000">PLC scan (logic + I/O)</text><text x="420" y="564" font-size="12.5" text-anchor="start" fill="#000">20 ms</text><rect x="30" y="574" width="380" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><rect x="410" y="574" width="330" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40" y="594" font-size="12.5" text-anchor="start" fill="#000">MB_SERVER answers a request</text><text x="420" y="594" font-size="12.5" text-anchor="start" fill="#000">≤ 1 scan (+ comm. processor)</text><rect x="30" y="604" width="380" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><rect x="410" y="604" width="330" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40" y="624" font-size="12.5" text-anchor="start" fill="#000">gateway fast poll</text><text x="420" y="624" font-size="12.5" text-anchor="start" fill="#000">500 ms (100 ms during a command)</text><rect x="30" y="634" width="380" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><rect x="410" y="634" width="330" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40" y="654" font-size="12.5" text-anchor="start" fill="#000">network round trip in the VLAN</text><text x="420" y="654" font-size="12.5" text-anchor="start" fill="#000">1 – 3 ms</text><rect x="30" y="664" width="380" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><rect x="410" y="664" width="330" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40" y="684" font-size="12.5" text-anchor="start" fill="#000">gateway → MES (HTTP SSE event)</text><text x="420" y="684" font-size="12.5" text-anchor="start" fill="#000">&lt; 50 ms</text><rect x="30" y="694" width="380" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><rect x="410" y="694" width="330" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40" y="714" font-size="12.5" text-anchor="start" fill="#000">worst-case age of a status bit at the MES</text><text x="420" y="714" font-size="12.5" text-anchor="start" fill="#000">≈ 500 + 20 + 3 + 50 ≈ 575 ms</text><text x="780" y="560" font-size="14" text-anchor="start" font-weight="700" fill="#000">Why this way?</text><text x="780" y="586" font-size="12.5" text-anchor="start" fill="#000">• only ONE protocol to the machines (Modbus TCP)</text><text x="780" y="608" font-size="12.5" text-anchor="start" fill="#000">• the PLC stays simple: a server, no client logic</text><text x="780" y="630" font-size="12.5" text-anchor="start" fill="#000">• the gateway owns retries, time-outs, stale flags</text><text x="780" y="652" font-size="12.5" text-anchor="start" fill="#000">• HTTP above: easy for MES / ERP / browser</text><text x="780" y="674" font-size="12.5" text-anchor="start" fill="#000">• safety never depends on the network</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>