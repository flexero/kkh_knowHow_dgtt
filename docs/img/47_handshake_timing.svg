<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">MES order handshake – toggle bits REQ / ACK, BUSY, DONE (timing example)</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><text x="24" y="126" font-size="12.5" text-anchor="start" fill="#000">FC16 data 200 – 225 (gateway)</text><line x1="230" y1="140" x2="1150" y2="140" stroke="#999" stroke-width="0.6"/><text x="24" y="190" font-size="12.5" text-anchor="start" fill="#000">REQ = cmd.ctl bit 0 (gateway)</text><line x1="230" y1="204" x2="1150" y2="204" stroke="#999" stroke-width="0.6"/><text x="24" y="254" font-size="12.5" text-anchor="start" fill="#000">ACK = hs.status bit 0 (PLC)</text><line x1="230" y1="268" x2="1150" y2="268" stroke="#999" stroke-width="0.6"/><text x="24" y="318" font-size="12.5" text-anchor="start" fill="#000">gateway poll (100 ms)</text><line x1="230" y1="332" x2="1150" y2="332" stroke="#999" stroke-width="0.6"/><text x="24" y="382" font-size="12.5" text-anchor="start" fill="#000">BUSY = hs bit 1 (PLC)</text><line x1="230" y1="396" x2="1150" y2="396" stroke="#999" stroke-width="0.6"/><text x="24" y="446" font-size="12.5" text-anchor="start" fill="#000">lotDone (offset 11)</text><line x1="230" y1="460" x2="1150" y2="460" stroke="#999" stroke-width="0.6"/><text x="24" y="510" font-size="12.5" text-anchor="start" fill="#000">DONE = hs bit 2 (PLC)</text><line x1="230" y1="524" x2="1150" y2="524" stroke="#999" stroke-width="0.6"/><text x="24" y="574" font-size="12.5" text-anchor="start" fill="#000">READY = hs bit 4 (PLC)</text><line x1="230" y1="588" x2="1150" y2="588" stroke="#999" stroke-width="0.6"/><path d="M230 140 L230.0 140 L230.0 112 L268.4 112 L268.4 140 L1150 140" fill="none" stroke="#000" stroke-width="2"/><path d="M230 204 L294.0 204 L294.0 176 L1150 176" fill="none" stroke="#1f6fd1" stroke-width="2"/><path d="M230 268 L326.0 268 L326.0 240 L1150 240" fill="none" stroke="#1f6fd1" stroke-width="2"/><line x1="230.0" y1="332" x2="230.0" y2="306" stroke="#000" stroke-width="1.6"/><line x1="614.0" y1="332" x2="614.0" y2="306" stroke="#000" stroke-width="1.6"/><line x1="738.0" y1="332" x2="738.0" y2="306" stroke="#000" stroke-width="1.6"/><line x1="813.0" y1="332" x2="813.0" y2="306" stroke="#000" stroke-width="1.6"/><line x1="888.0" y1="332" x2="888.0" y2="306" stroke="#000" stroke-width="1.6"/><line x1="963.0" y1="332" x2="963.0" y2="306" stroke="#000" stroke-width="1.6"/><line x1="1038.0" y1="332" x2="1038.0" y2="306" stroke="#000" stroke-width="1.6"/><line x1="1113.0" y1="332" x2="1113.0" y2="306" stroke="#000" stroke-width="1.6"/><path d="M230 396 L326.0 396 L326.0 368 L1053.0 368 L1053.0 396 L1150 396" fill="none" stroke="#000" stroke-width="2"/><text x="230.0" y="450" font-size="12" text-anchor="start" fill="#000">0</text><text x="760.5" y="450" font-size="12" text-anchor="start" fill="#000">1</text><text x="910.5" y="450" font-size="12" text-anchor="start" fill="#000">2</text><text x="1053.0" y="450" font-size="12" text-anchor="start" fill="#000">3 = lot qty</text><path d="M230 524 L1053.0 524 L1053.0 496 L1150 496" fill="none" stroke="#1f6fd1" stroke-width="2"/><path d="M230 560 L326.0 560 L326.0 588 L1075.5 588 L1075.5 560 L1150 560" fill="none" stroke="#000" stroke-width="2"/><line x1="230.0" y1="96" x2="230.0" y2="610" stroke="#1f6fd1" stroke-width="0.8" stroke-dasharray="4 4"/><text x="233.0" y="66" font-size="11.5" text-anchor="start" fill="#1f6fd1">t = 0 data</text><line x1="294.0" y1="96" x2="294.0" y2="610" stroke="#1f6fd1" stroke-width="0.8" stroke-dasharray="4 4"/><text x="297.0" y="79" font-size="11.5" text-anchor="start" fill="#1f6fd1">20 ms REQ</text><line x1="326.0" y1="96" x2="326.0" y2="610" stroke="#1f6fd1" stroke-width="0.8" stroke-dasharray="4 4"/><text x="329.0" y="92" font-size="11.5" text-anchor="start" fill="#1f6fd1">ACK = REQ (≤ 1 scan)</text><line x1="614.0" y1="96" x2="614.0" y2="610" stroke="#1f6fd1" stroke-width="0.8" stroke-dasharray="4 4"/><text x="617.0" y="66" font-size="11.5" text-anchor="start" fill="#1f6fd1">120 ms gateway sees ACK</text><line x1="1053.0" y1="96" x2="1053.0" y2="610" stroke="#1f6fd1" stroke-width="0.8" stroke-dasharray="4 4"/><text x="1056.0" y="79" font-size="11.5" text-anchor="start" fill="#1f6fd1">lot end</text><text x="24" y="640" font-size="12.5" text-anchor="start" fill="#000">Sequence (guide 43 §8.4): 1 read 200 – 202 + 8 – 10 (REQ = ACK?) · 2 FC16 write 200 – 225 with seq + 1, REQ unchanged · 3 FC06 toggle REQ (LAST, own frame)</text><text x="24" y="662" font-size="12.5" text-anchor="start" fill="#000">4 PLC: REQ ≠ ACK → check code + data → result 0 … 4 → copy order / qty / recipe → ackSeq := seq → ACK := REQ (same scan, last) · 5 gateway polls 8 – 11 every 100 ms</text><text x="24" y="684" font-size="12.5" text-anchor="start" fill="#000">until ACK = REQ and ackSeq = seq (time-out 3 s) · 6 BUSY while the lot runs, lotDone counts · 7 lotDone ≥ qty → BUSY 0, DONE toggles → MES books the confirmation.</text><text x="24" y="712" font-size="12.5" text-anchor="start" fill="#1f6fd1">Hand timing: REQ written 1 scan after the data (20 ms) · ACK ≤ 1 scan later · seen by the gateway at the next 100 ms poll → ≈ 120 ms + the wait for the first poll.</text><text x="24" y="734" font-size="12.5" text-anchor="start" fill="#000">Result codes: 0 OK · 1 unknown command · 2 not ready (not AUTO, alarm, gateway lost) · 3 bad data (empty order, qty 0 or &gt; 100 000, recipe 0) · 4 busy.</text><text x="24" y="756" font-size="11.5" text-anchor="start" font-style="italic" fill="#000">Time axis not to scale after 120 ms (pieces take seconds to minutes).</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>