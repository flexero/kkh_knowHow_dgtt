y="99.0" font-size="12" text-anchor="middle" fill="#000">VLAN 10 ENT-OFFICE</text><rect x="330.0" y="150.0" width="220.0" height="62.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="440.0" y="170.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">MES</text><text x="440.0" y="185.0" font-size="12" text-anchor="middle" fill="#000">line call-off, traceability</text><text x="440.0" y="200.0" font-size="12" text-anchor="middle" fill="#000">vc-ops-mes01 10.30.0.100</text><rect x="710.0" y="150.0" width="220.0" height="62.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="820.0" y="170.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">WMS</text><text x="820.0" y="185.0" font-size="12" text-anchor="middle" fill="#000">slot, lot, FIFO, slotting</text><text x="820.0" y="200.0" font-size="12" text-anchor="middle" fill="#000">vc-ops-wms01 10.30.0.104</text><rect x="500.0" y="262.0" width="260.0" height="66.0" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/><text x="630.0" y="284.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">WCS / material flow controller</text><text x="630.0" y="299.0" font-size="12" text-anchor="middle" fill="#000">jobs, dual command, load tracking</text><text x="630.0" y="314.0" font-size="12" text-anchor="middle" fill="#000">10.54.0.100 · vc-log-wcsraw01</text><rect x="880.0" y="262.0" width="230.0" height="66.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="995.0" y="284.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">HMI + SCADA</text><text x="995.0" y="299.0" font-size="12" text-anchor="middle" fill="#000">modes, jog, alarms</text><text x="995.0" y="314.0" font-size="12" text-anchor="middle" fill="#000">10.54.0.101 / VLAN 40</text><rect x="300.0" y="382.0" width="280.0" height="66.0" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/><text x="440.0" y="404.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Crane PLC PLC-ASRS-RAW</text><text x="440.0" y="419.0" font-size="12" text-anchor="middle" fill="#000">S7-1515F-2 PN, F-program</text><text x="440.0" y="434.0" font-size="12" text-anchor="middle" fill="#000">10.54.0.31 vc-log-plcasrsraw</text><rect x="700.0" y="382.0" width="260.0" height="66.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="830.0" y="404.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Conveyor control</text><text x="830.0" y="419.0" font-size="12" text-anchor="middle" fill="#000">zones, ID, contour, scale</text><text x="830.0" y="434.0" font-size="12" text-anchor="middle" fill="#000">ET 200SP 10.54.0.153 (proposal)</text><rect x="300.0" y="470.0" width="280.0" height="50.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="440.0" y="491.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Optical data link (fixed + crane)</text><text x="440.0" y="506.5" font-size="12" text-anchor="middle" fill="#000">PROFINET + PROFIsafe, 100 Mbit/s</text><rect x="120.0" y="560.0" width="190.0" height="54.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="215.0" y="583.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Drives + STO/SBC</text><text x="215.0" y="598.5" font-size="12" text-anchor="middle" fill="#000">travel 2x, hoist, fork</text><rect x="330.0" y="560.0" width="190.0" height="54.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="425.0" y="583.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Positioning</text><text x="425.0" y="598.5" font-size="12" text-anchor="middle" fill="#000">laser, bar-code, encoder</text><rect x="540.0" y="560.0" width="190.0" height="54.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="635.0" y="583.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Safety devices</text><text x="635.0" y="598.5" font-size="12" text-anchor="middle" fill="#000">e-stop, door, overspeed</text><rect x="750.0" y="560.0" width="190.0" height="54.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="845.0" y="583.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Conveyor field</text><text x="845.0" y="598.5" font-size="12" text-anchor="middle" fill="#000">scanner, contour, scale</text><rect x="960.0" y="560.0" width="190.0" height="54.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="1055.0" y="583.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Crane sensors</text><text x="1055.0" y="598.5" font-size="12" text-anchor="middle" fill="#000">fork, load, slot ref.</text><line x1="630.0" y1="108.0" x2="460.0" y2="150.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="551.0" y="127.0" font-size="11" text-anchor="start" fill="#000">B2MML via DMZ</text><line x1="630.0" y1="108.0" x2="800.0" y2="150.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="721.0" y="127.0" font-size="11" text-anchor="start" fill="#000">goods receipt, stock</text><line x1="820.0" y1="212.0" x2="650.0" y2="262.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="741.0" y="235.0" font-size="11" text-anchor="start" fill="#000">transport orders</text><line x1="440.0" y1="212.0" x2="560.0" y2="262.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="506.0" y="235.0" font-size="11" text-anchor="start" fill="#000">call-off</text><line x1="560.0" y1="328.0" x2="440.0" y2="382.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="506.0" y="353.0" font-size="11" text-anchor="start" fill="#000">telegram TCP / OPC UA</text><line x1="700.0" y1="328.0" x2="820.0" y2="382.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="766.0" y="353.0" font-size="11" text-anchor="start" fill="#000">conveyor telegrams</text><line x1="440.0" y1="448.0" x2="440.0" y2="470.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><line x1="440.0" y1="520.0" x2="215.0" y2="560.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><line x1="440.0" y1="520.0" x2="425.0" y2="560.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><line x1="440.0" y1="520.0" x2="635.0" y2="560.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="543.5" y="538.0" font-size="11" text-anchor="start" fill="#000">PROFINET</text><line x1="830.0" y1="448.0" x2="845.0" y2="560.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="843.5" y="502.0" font-size="11" text-anchor="start" fill="#000">PROFINET</text><line x1="440.0" y1="520.0" x2="1055.0" y2="560.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><line x1="880.0" y1="295.0" x2="760.0" y2="295.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="40.0" y="650.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Who decides what:</text><text x="40.0" y="672.0" font-size="12" text-anchor="start" fill="#000">WMS = WHAT is where (stock per slot and lot, slotting rule, FIFO, blocked stock).</text><text x="40.0" y="690.0" font-size="12" text-anchor="start" fill="#000">WCS = HOW it moves (crane job, pairing store + retrieve, route, telegram, load-unit tracking on the conveyors).</text><text x="40.0" y="708.0" font-size="12" text-anchor="start" fill="#000">PLC = WHEN each axis moves and IF it is safe (step chain, positioning, interlocks, safety functions, ms cycle).</text><text x="40.0" y="726.0" font-size="12" text-anchor="start" fill="#000">Drive = closes position / speed / current loops (µs – ms), Safety Integrated (STO, SS1, SLS, SBC).</text><text x="40.0" y="744.0" font-size="12" text-anchor="start" fill="#000">Networks (guide 15 §3.13): VLAN 54 OT-L1-LOG-ASRS 10.54.0.0/24, VLAN 30 OT-L3-OPS,</text><text x="40.0" y="762.0" font-size="12" text-anchor="start" fill="#000">VLAN 40 OT-L2-SUP, VLAN 10 ENT-OFFICE.</text>
