<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>HPU – star-delta power + contactor circuit</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="10" y="10" width="1180" height="810" fill="none" stroke="#000" stroke-width="1.4"/><text x="30" y="40" font-size="18" text-anchor="start" fill="#000" font-weight="bold">2 · Pump motor 0M1 – star-delta power circuit, contactor coils, PLC outputs</text><text x="30" y="62" font-size="12.5" text-anchor="start" fill="#333">Power circuit (left) and 24 V DC control circuit (right). The PLC interlock (networks 6 + 7) is doubled by NC auxiliary contacts in the coil lines.</text><line x1="80" y1="100" x2="80" y2="160" stroke="#000" stroke-width="1.5"/><text x="80" y="95" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">L1</text><line x1="110" y1="100" x2="110" y2="160" stroke="#000" stroke-width="1.5"/><text x="110" y="95" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">L2</text><line x1="140" y1="100" x2="140" y2="160" stroke="#000" stroke-width="1.5"/><text x="140" y="95" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">L3</text><rect x="65" y="160" width="90" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="110" y="182" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">-QM1</text><text x="110" y="198" font-size="9" text-anchor="middle" fill="#000">1.6–2.5 A set 2.0</text><line x1="80" y1="210" x2="80" y2="250" stroke="#000" stroke-width="1.5"/><line x1="110" y1="210" x2="110" y2="250" stroke="#000" stroke-width="1.5"/><line x1="140" y1="210" x2="140" y2="250" stroke="#000" stroke-width="1.5"/><rect x="65" y="250" width="90" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="110" y="274" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">-QA1 main</text><line x1="80" y1="290" x2="80" y2="420" stroke="#000" stroke-width="1.5"/><line x1="110" y1="290" x2="110" y2="420" stroke="#000" stroke-width="1.5"/><line x1="140" y1="290" x2="140" y2="420" stroke="#000" stroke-width="1.5"/><circle cx="110" cy="470" r="45" fill="none" stroke="#000" stroke-width="1.5"/><text x="110" y="466" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">0M1</text><text x="110" y="482" font-size="10" text-anchor="middle" fill="#000">1.5 kW</text><text x="110" y="530" font-size="10" text-anchor="middle" fill="#000">U1 V1 W1 / W2 U2 V2</text><line x1="80" y1="420" x2="80" y2="432" stroke="#000" stroke-width="1.5"/><line x1="110" y1="420" x2="110" y2="432" stroke="#000" stroke-width="1.5"/><line x1="140" y1="420" x2="140" y2="432" stroke="#000" stroke-width="1.5"/><line x1="80" y1="330" x2="240" y2="330" stroke="#000" stroke-width="1.5"/><line x1="110" y1="345" x2="260" y2="345" stroke="#000" stroke-width="1.5"/><line x1="140" y1="360" x2="280" y2="360" stroke="#000" stroke-width="1.5"/><line x1="240" y1="330" x2="240" y2="380" stroke="#000" stroke-width="1.5"/><line x1="260" y1="345" x2="260" y2="380" stroke="#000" stroke-width="1.5"/><line x1="280" y1="360" x2="280" y2="380" stroke="#000" stroke-width="1.5"/><rect x="225" y="380" width="70" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="260" y="404" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">-QA2 Δ</text><line x1="240" y1="420" x2="240" y2="560" stroke="#000" stroke-width="1.5"/><line x1="260" y1="420" x2="260" y2="560" stroke="#000" stroke-width="1.5"/><line x1="280" y1="420" x2="280" y2="560" stroke="#000" stroke-width="1.5"/><line x1="240" y1="560" x2="380" y2="560" stroke="#000" stroke-width="1.5"/><line x1="260" y1="575" x2="380" y2="575" stroke="#000" stroke-width="1.5"/><line x1="280" y1="590" x2="380" y2="590" stroke="#000" stroke-width="1.5"/><text x="300" y="552" font-size="10" text-anchor="start" fill="#000">to W2 U2 V2</text><rect x="360" y="600" width="70" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="395" y="624" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">-QA3 Y</text><line x1="380" y1="590" x2="380" y2="600" stroke="#000" stroke-width="1.5"/><line x1="395" y1="575" x2="395" y2="600" stroke="#000" stroke-width="1.5"/><line x1="410" y1="560" x2="410" y2="600" stroke="#000" stroke-width="1.5"/><line x1="375" y1="660" x2="415" y2="660" stroke="#000" stroke-width="2.5"/><line x1="380" y1="640" x2="380" y2="660" stroke="#000" stroke-width="1.5"/><line x1="395" y1="640" x2="395" y2="660" stroke="#000" stroke-width="1.5"/><line x1="410" y1="640" x2="410" y2="660" stroke="#000" stroke-width="1.5"/><text x="395" y="680" font-size="10" text-anchor="middle" fill="#000">star point</text><text x="40" y="720" font-size="11" text-anchor="start" fill="#000">Currents (example, 400 V, I_N 3.4 A): in star I = I_N/3 at start → 1/3 torque; in delta full torque. Pump starts UNLOADED (0V5 open) –</text><text x="40" y="736" font-size="11" text-anchor="start" fill="#000">in star the motor cannot drive the pump against 11.5 MPa. -QA2/-QA3 carry I_N/√3 = 2.0 A (AC-3). For 1.5 kW a direct start is also common;</text><text x="40" y="752" font-size="11" text-anchor="start" fill="#000">star-delta is shown because larger HPUs (≥ 5.5 kW) need it – or a soft starter (Siemens 3RW, Delta / Schneider ATS) with the same PLC signals.</text><line x1="560" y1="100" x2="1140" y2="100" stroke="#b3261e" stroke-width="2.5"/><text x="560" y="92" font-size="11" text-anchor="start" fill="#b3261e">+24 V DC</text><line x1="560" y1="500" x2="1140" y2="500" stroke="#0b5ea8" stroke-width="2.5"/><text x="560" y="518" font-size="11" text-anchor="start" fill="#0b5ea8">0 V</text><rect x="570" y="120" width="560" height="60" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="580" y="142" font-size="10.5" text-anchor="start" fill="#000" font-weight="bold">PLC outputs: Delta AS332P-A (PNP) or AS332T-A + interface relays · Siemens 1215C DC/DC/DC DQ 0.5 A each</text><text x="580" y="160" font-size="10.5" text-anchor="start" fill="#b3261e">safety relay -KF1 output contacts 13-14 / 23-24 in the supply of the contactor coils (stop category 0, IEC 60204-1 §9.2.2)</text><line x1="610" y1="180" x2="610" y2="230" stroke="#000" stroke-width="1.5"/><text x="615" y="206" font-size="9.5" text-anchor="start" fill="#0b5ea8">Y0.0 / %Q0.0</text><rect x="598" y="230" width="24" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="626" y="250" font-size="9" text-anchor="start" fill="#000">-KF1</text><line x1="610" y1="260" x2="610" y2="300" stroke="#000" stroke-width="1.5"/><line x1="610" y1="300" x2="610" y2="380" stroke="#000" stroke-width="1.5"/><rect x="592" y="380" width="36" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="592" y1="380" x2="628" y2="420" stroke="#000" stroke-width="0.8"/><text x="610" y="440" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">-QA1</text><text x="610" y="456" font-size="9.5" text-anchor="middle" fill="#000">KM1</text><line x1="610" y1="420" x2="610" y2="500" stroke="#000" stroke-width="1.5"/><line x1="720" y1="180" x2="720" y2="230" stroke="#000" stroke-width="1.5"/><text x="725" y="206" font-size="9.5" text-anchor="start" fill="#0b5ea8">Y0.1 / %Q0.1</text><rect x="708" y="230" width="24" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="736" y="250" font-size="9" text-anchor="start" fill="#000">-KF1</text><line x1="720" y1="260" x2="720" y2="300" stroke="#000" stroke-width="1.5"/><line x1="720" y1="300" x2="720" y2="320" stroke="#000" stroke-width="1.5"/><line x1="720" y1="320" x2="708" y2="346" stroke="#000" stroke-width="1.5"/><line x1="706" y1="344" x2="724" y2="344" stroke="#000" stroke-width="1.5"/><line x1="720" y1="346" x2="720" y2="380" stroke="#000" stroke-width="1.5"/><text x="726" y="338" font-size="9.5" text-anchor="start" fill="#000" font-weight="bold">-QA2 21/22</text><rect x="702" y="380" width="36" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="702" y1="380" x2="738" y2="420" stroke="#000" stroke-width="0.8"/><text x="720" y="440" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">-QA3</text><text x="720" y="456" font-size="9.5" text-anchor="middle" fill="#000">KM3 star</text><line x1="720" y1="420" x2="720" y2="500" stroke="#000" stroke-width="1.5"/><line x1="830" y1="180" x2="830" y2="230" stroke="#000" stroke-width="1.5"/><text x="835" y="206" font-size="9.5" text-anchor="start" fill="#0b5ea8">Y0.2 / %Q0.2</text><rect x="818" y="230" width="24" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="846" y="250" font-size="9" text-anchor="start" fill="#000">-KF1</text><line x1="830" y1="260" x2="830" y2="300" stroke="#000" stroke-width="1.5"/><line x1="830" y1="300" x2="830" y2="320" stroke="#000" stroke-width="1.5"/><line x1="830" y1="320" x2="818" y2="346" stroke="#000" stroke-width="1.5"/><line x1="816" y1="344" x2="834" y2="344" stroke="#000" stroke-width="1.5"/><line x1="830" y1="346" x2="830" y2="380" stroke="#000" stroke-width="1.5"/><text x="836" y="338" font-size="9.5" text-anchor="start" fill="#000" font-weight="bold">-QA3 21/22</text><rect x="812" y="380" width="36" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="812" y1="380" x2="848" y2="420" stroke="#000" stroke-width="0.8"/><text x="830" y="440" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">-QA2</text><text x="830" y="456" font-size="9.5" text-anchor="middle" fill="#000">KM2 delta</text><line x1="830" y1="420" x2="830" y2="500" stroke="#000" stroke-width="1.5"/><line x1="940" y1="180" x2="940" y2="230" stroke="#000" stroke-width="1.5"/><text x="945" y="206" font-size="9.5" text-anchor="start" fill="#0b5ea8">Y0.3 / %Q0.3</text><line x1="940" y1="230" x2="940" y2="300" stroke="#000" stroke-width="1.5"/><line x1="940" y1="300" x2="940" y2="380" stroke="#000" stroke-width="1.5"/><rect x="922" y="380" width="36" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="922" y1="380" x2="958" y2="420" stroke="#000" stroke-width="0.8"/><text x="940" y="440" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">0Y5</text><text x="940" y="456" font-size="9.5" text-anchor="middle" fill="#000">unloading 0V5</text><line x1="940" y1="420" x2="940" y2="500" stroke="#000" stroke-width="1.5"/><text x="962" y="400" font-size="9" text-anchor="start" fill="#000">diode</text><text x="962" y="412" font-size="9" text-anchor="start" fill="#000">in plug</text><line x1="1050" y1="180" x2="1050" y2="230" stroke="#000" stroke-width="1.5"/><text x="1055" y="206" font-size="9.5" text-anchor="start" fill="#0b5ea8">Y0.4 / %Q0.4</text><line x1="1050" y1="230" x2="1050" y2="300" stroke="#000" stroke-width="1.5"/><line x1="1050" y1="300" x2="1050" y2="380" stroke="#000" stroke-width="1.5"/><rect x="1032" y="380" width="36" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1032" y1="380" x2="1068" y2="420" stroke="#000" stroke-width="0.8"/><text x="1050" y="440" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">0Y6</text><text x="1050" y="456" font-size="9.5" text-anchor="middle" fill="#000">discharge 0V6</text><line x1="1050" y1="420" x2="1050" y2="500" stroke="#000" stroke-width="1.5"/><text x="1072" y="400" font-size="9" text-anchor="start" fill="#000">diode</text><text x="1072" y="412" font-size="9" text-anchor="start" fill="#000">in plug</text><text x="570" y="540" font-size="11" text-anchor="start" fill="#000">Hard-wired interlock: NC auxiliary of -QA2 in the coil line of -QA3 and vice versa (+ mechanical interlock kit).</text><text x="570" y="556" font-size="11" text-anchor="start" fill="#000">If an output transistor fails short-circuit, both contactors can never close together.</text><text x="570" y="580" font-size="11" text-anchor="start" fill="#000">Feedback: auxiliary NO 13/14 of -QA1/-QA2/-QA3 → X0.6/X0.7/X0.8 (%I0.6/%I0.7/%I1.0) → network 8.</text><text x="570" y="604" font-size="11" text-anchor="start" fill="#000">Coils: 24 V DC contactors (e.g. Siemens 3RT2015-1BB41, ≈ 3 W) – check the DQ current (1215C: 0.5 A).</text><text x="570" y="620" font-size="11" text-anchor="start" fill="#000">Valve coils 0Y5/0Y6 ≈ 30 W = 1.25 A → interface relay or a 2 A output module.</text><text x="570" y="644" font-size="11" text-anchor="start" fill="#000" font-weight="bold">Timing (simulated): KM1 + KM3 at 0 · KM3 off 5.06 s · KM3_FB off 5.10 s · KM2 on 5.20 s (gap 0.1 s).</text><rect x="770" y="760" width="420" height="60" fill="#fff" stroke="#000" stroke-width="1"/><line x1="770" y1="782" x2="1190" y2="782" stroke="#000" stroke-width="0.8"/><text x="778" y="776" font-size="12" font-weight="bold">HPU – star-delta power + contactor circuit</text><text x="778" y="798" font-size="10.5">0M1 1.5 kW 400 V Δ · -QA1/-QA2/-QA3 · hard-wired interlock</text><text x="778" y="813" font-size="10.5" fill="#0b5ea8">Guide 37 · page 2 · EXAMPLE – check with your PLC configuration</text></svg>
