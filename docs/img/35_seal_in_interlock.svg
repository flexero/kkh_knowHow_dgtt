<text x="790.0" y="144.0" font-size="11.5" text-anchor="start" fill="#000">Stop button is NC → input = 1 when NOT pressed;</text>
<text x="790.0" y="161.0" font-size="11.5" text-anchor="start" fill="#000">pressing it (or a broken wire!) opens the rung.</text>
