<text x="790.0" y="310.0" font-size="11.5" text-anchor="start" fill="#000">Two locks: the OTHER button (NC) and the OTHER</text>
<text x="790.0" y="327.0" font-size="11.5" text-anchor="start" fill="#000">output (NC). Both directions can never be on together,</text>
<text x="790.0" y="344.0" font-size="11.5" text-anchor="start" fill="#000">even if both buttons are pressed.</text>
<text x="790.0" y="361.0" font-size="11.5" text-anchor="start" fill="#000">For contactors: also a mechanical interlock</text>
<text x="790.0" y="378.0" font-size="11.5" text-anchor="start" fill="#000">and auxiliary-contact interlock in the hardware.</text>
<text x="40.0" y="470.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">(c) Alarm latch: alarm = cause OR (alarm AND NOT acknowledge) – network 16</text>
