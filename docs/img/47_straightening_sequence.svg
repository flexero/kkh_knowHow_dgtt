<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">Straightening press BS-STR – measure, bend at the high point, measure again</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><rect x="30" y="70" width="230" height="46" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="145.0" y="88" font-size="12" text-anchor="middle" font-weight="700" fill="#000">1 clamp</text><text x="145.0" y="104" font-size="12" text-anchor="middle" fill="#000">centres / rollers</text><rect x="30" y="130" width="230" height="46" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="145.0" y="148" font-size="12" text-anchor="middle" font-weight="700" fill="#000">2 measure</text><text x="145.0" y="164" font-size="12" text-anchor="middle" fill="#000">one turn, 72 °/s, 5 s</text><line x1="145" y1="116" x2="145" y2="130" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="30" y="190" width="230" height="46" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="145.0" y="208" font-size="12" text-anchor="middle" font-weight="700" fill="#000">3 decide</text><text x="145.0" y="224" font-size="12" text-anchor="middle" fill="#000">TIR ≤ 100 µm? bends &lt; 3?</text><line x1="145" y1="176" x2="145" y2="190" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="30" y="250" width="230" height="46" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="145.0" y="268" font-size="12" text-anchor="middle" font-weight="700" fill="#000">4 position</text><text x="145.0" y="284" font-size="12" text-anchor="middle" fill="#000">high point under the ram</text><line x1="145" y1="236" x2="145" y2="250" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="30" y="310" width="230" height="46" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="145.0" y="328" font-size="12" text-anchor="middle" font-weight="700" fill="#000">5 press</text><text x="145.0" y="344" font-size="12" text-anchor="middle" fill="#000">contact (≥ 2 kN) + stroke</text><line x1="145" y1="296" x2="145" y2="310" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="30" y="370" width="230" height="46" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="145.0" y="388" font-size="12" text-anchor="middle" font-weight="700" fill="#000">6 ram up</text><text x="145.0" y="404" font-size="12" text-anchor="middle" fill="#000">→ measure again</text><line x1="145" y1="356" x2="145" y2="370" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="30" y="430" width="230" height="46" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="145.0" y="448" font-size="12" text-anchor="middle" font-weight="700" fill="#000">7 unload</text><text x="145.0" y="464" font-size="12" text-anchor="middle" fill="#000">OK / NOK</text><line x1="145" y1="416" x2="145" y2="430" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><path d="M260 333 L300 333 L300 153 L262 153" fill="none" stroke="#000" stroke-width="1.4"/><path d="M270 148 L260 153 L270 158 z" fill="#000"/><text x="306" y="250" font-size="12" text-anchor="start" fill="#000">loop</text><rect x="360" y="90" width="560" height="230" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="360" y="82" font-size="13" text-anchor="start" font-weight="700" fill="#000">Run-out signal over one turn (TIR = max − min)</text><line x1="360" y1="205.0" x2="920" y2="205.0" stroke="#888" stroke-width="0.6"/><path d="M360.0 162.5 L369.3 155.0 L378.7 148.1 L388.0 141.8 L397.3 136.2 L406.7 131.4 L416.0 127.3 L425.3 124.2 L434.7 121.9 L444.0 120.5 L453.3 120.0 L462.7 120.5 L472.0 121.9 L481.3 124.2 L490.7 127.3 L500.0 131.4 L509.3 136.2 L518.7 141.8 L528.0 148.1 L537.3 155.0 L546.7 162.5 L556.0 170.4 L565.3 178.7 L574.7 187.3 L584.0 196.1 L593.3 205.0 L602.7 213.9 L612.0 222.7 L621.3 231.3 L630.7 239.6 L640.0 247.5 L649.3 255.0 L658.7 261.9 L668.0 268.2 L677.3 273.8 L686.7 278.6 L696.0 282.7 L705.3 285.8 L714.7 288.1 L724.0 289.5 L733.3 290.0 L742.7 289.5 L752.0 288.1 L761.3 285.8 L770.7 282.7 L780.0 278.6 L789.3 273.8 L798.7 268.2 L808.0 261.9 L817.3 255.0 L826.7 247.5 L836.0 239.6 L845.3 231.3 L854.7 222.7 L864.0 213.9 L873.3 205.0 L882.7 196.1 L892.0 187.3 L901.3 178.7 L910.7 170.4 L920.0 162.5" fill="none" stroke="#1f6fd1" stroke-width="2.2"/><line x1="453.3333333333333" y1="120.0" x2="453.3333333333333" y2="320" stroke="#000" stroke-width="1.2" stroke-dasharray="4 4"/><text x="457.3333333333333" y="314" font-size="11.5" text-anchor="start" fill="#000">A_MAX = high point</text><line x1="880" y1="120.0" x2="880" y2="290.0" stroke="#000" stroke-width="1.4"/><text x="874" y="205.0" font-size="12" text-anchor="end" font-weight="700" fill="#000">TIR 600 µm</text><line x1="360" y1="120.0" x2="920" y2="120.0" stroke="#888" stroke-width="0.6" stroke-dasharray="2 3"/><line x1="360" y1="290.0" x2="920" y2="290.0" stroke="#888" stroke-width="0.6" stroke-dasharray="2 3"/><text x="360.0" y="336" font-size="11.5" text-anchor="middle" fill="#000">0°</text><text x="500.0" y="336" font-size="11.5" text-anchor="middle" fill="#000">90°</text><text x="640.0" y="336" font-size="11.5" text-anchor="middle" fill="#000">180°</text><text x="780.0" y="336" font-size="11.5" text-anchor="middle" fill="#000">270°</text><text x="920.0" y="336" font-size="11.5" text-anchor="middle" fill="#000">360°</text><rect x="960" y="180" width="200" height="14" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1060" y="220" font-size="12" text-anchor="middle" fill="#000">bar Ø36, span 400 mm</text><path d="M970 212 L985 196 L1000 212 z" fill="#fff" stroke="#000" stroke-width="1.4"/><path d="M1120 212 L1135 196 L1150 212 z" fill="#fff" stroke="#000" stroke-width="1.4"/><rect x="1045" y="120" width="30" height="50" rx="0" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.2"/><line x1="1060" y1="170" x2="1060" y2="178" stroke="#000" stroke-width="1.2" marker-end="url(#aA)"/><text x="1060" y="114" font-size="12" text-anchor="middle" fill="#000">ram</text><text x="960" y="250" font-size="12" text-anchor="start" fill="#000">force ≈ 13 kN/mm × penetration</text><text x="960" y="270" font-size="12" text-anchor="start" fill="#000">(48 E I / L³, elastic)</text><text x="360" y="370" font-size="14" text-anchor="start" font-weight="700" fill="#000">Simple stroke rule (recipe value K = spring-back factor)</text><text x="360" y="396" font-size="12.5" text-anchor="start" fill="#000">stroke beyond contact s = K × TIR / 2   (deflection to remove = TIR / 2)</text><text x="360" y="420" font-size="12.5" text-anchor="start" fill="#1f6fd1">example: TIR 600 µm, K = 6 → s = 6 × 0.300 mm = 1.80 mm (force ≈ 23 – 26 kN)</text><text x="360" y="444" font-size="12.5" text-anchor="start" fill="#000">model of the bar: plastic correction of the TIR = 2 × s / k_true, here k_true = 8 (stiffer than the recipe assumes)</text><text x="360" y="468" font-size="12.5" text-anchor="start" fill="#000">TIR after bend 1 = |600 − 2000 × 1.80 / 8| = 150 µm (+ contact threshold / scan: 102 µm in the simulation)</text><text x="360" y="492" font-size="12.5" text-anchor="start" fill="#000">bend 2: s = 6 × 0.051 = 0.31 mm → TIR ≈ 20 … 40 µm ≤ 100 µm → OK after 2 bends</text><text x="360" y="516" font-size="12.5" text-anchor="start" fill="#000">max. 3 bends, then NOK (QG-BS-3: more bends = crack risk in the hardened state)</text><text x="360" y="540" font-size="12.5" text-anchor="start" fill="#000">learn K: after each bend K_new = K × TIR_before / (TIR_before − TIR_after) × (correction wanted / done) – keep it simple: adjust K per material lot</text><text x="30" y="600" font-size="12.5" text-anchor="start" fill="#000">Registers (press group): runoutBefore_um · runoutAfter_um · force_kN · stroke_mm · bends – one set per part for the MES.</text><text x="30" y="622" font-size="12.5" text-anchor="start" fill="#000">Max / min tracking in ladder: IF RUNOUT &gt; R_MAX THEN R_MAX := RUNOUT, A_MAX := ANGLE (every scan = 1.44° at 72 °/s); TIR := R_MAX − R_MIN after 360°.</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>