<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>2-link arm in a vertical plane – Lagrange equation of motion, worked example</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="eg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#555"/></marker>
<marker id="sg" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#555"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24" y="30" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Link 1 = lower arm (J2), link 2 = forearm + wrist + load (J3), angles q1 from horizontal, q2 relative</text>
<rect x="100" y="572" width="80" height="14" rx="0" stroke="none" stroke-width="0" fill="url(#hatch)"/>
<line x1="100" y1="572" x2="180" y2="572" stroke="#000" stroke-width="1.4"/>
<path d="M140,560 L122,572 L158,572 Z" stroke="#000" stroke-width="1.2" fill="#dcdcdc"/>
<line x1="140" y1="560" x2="370.4" y2="427" stroke="#000" stroke-width="10"/>
<line x1="140" y1="560" x2="370.4" y2="427" stroke="#f2f2f2" stroke-width="7"/>
<line x1="370.4" y1="427" x2="454" y2="115" stroke="#000" stroke-width="10"/>
<line x1="370.4" y1="427" x2="454" y2="115" stroke="#f2f2f2" stroke-width="7"/>
<circle cx="140" cy="560" r="9" stroke="#000" stroke-width="1.6" fill="#fff"/>
<circle cx="370.4" cy="427" r="9" stroke="#000" stroke-width="1.6" fill="#fff"/>
<line x1="140" y1="560" x2="470" y2="560" stroke="#555" stroke-width="0.8" stroke-dasharray="5 3"/>
<line x1="370.4" y1="427" x2="517.6" y2="342" stroke="#555" stroke-width="0.8" stroke-dasharray="5 3"/>
<path d="M200,560 A60,60 0 0 0 192,530" stroke="#1f6fd1" stroke-width="1.5" fill="none" marker-end="url(#ea)"/>
<text x="290" y="552" font-size="13" text-anchor="start" fill="#1f6fd1" font-weight="bold">q1 = 30°</text>
<path d="M431,392 A70,70 0 0 0 388.5,359.4" stroke="#1f6fd1" stroke-width="1.5" fill="none" marker-end="url(#ea)"/>
<text x="442.4" y="375" font-size="13" text-anchor="start" fill="#1f6fd1" font-weight="bold">q2 = 45°</text>
<circle cx="255.2" cy="493.5" r="7" stroke="#000" stroke-width="1.4" fill="#fff"/>
<line x1="248.2" y1="493.5" x2="262.2" y2="493.5" stroke="#000" stroke-width="1"/>
<line x1="255.2" y1="486.5" x2="255.2" y2="500.5" stroke="#000" stroke-width="1"/>
<line x1="255.2" y1="501.5" x2="255.2" y2="563.5" stroke="#000" stroke-width="1.8" marker-end="url(#ek)"/>
<text x="247.2" y="557.5" font-size="12" text-anchor="end" fill="#000" font-weight="bold">m1·g</text>
<text x="269.2" y="517.5" font-size="12" text-anchor="start" fill="#000">m1 = 40.8 kg</text>
<circle cx="414.6" cy="261.8" r="7" stroke="#000" stroke-width="1.4" fill="#fff"/>
<line x1="407.6" y1="261.8" x2="421.6" y2="261.8" stroke="#000" stroke-width="1"/>
<line x1="414.6" y1="254.8" x2="414.6" y2="268.8" stroke="#000" stroke-width="1"/>
<line x1="414.6" y1="269.8" x2="414.6" y2="331.8" stroke="#000" stroke-width="1.8" marker-end="url(#ek)"/>
<text x="422.6" y="325.8" font-size="12" text-anchor="start" fill="#000" font-weight="bold">m2·g</text>
<text x="428.6" y="255.8" font-size="12" text-anchor="start" fill="#000">m2 = 50 kg</text>
<line x1="138.5" y1="557.4" x2="120.5" y2="526.2" stroke="#555" stroke-width="0.7"/>
<line x1="368.9" y1="424.4" x2="350.9" y2="393.2" stroke="#555" stroke-width="0.7"/>
<line x1="123" y1="530.6" x2="353.4" y2="397.6" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="236.2" y="460.6" font-size="11" text-anchor="middle" fill="#000" transform="rotate(-30 236.2 460.6)">l1 = 0.70 m, c1 = 0.35 m</text>
<line x1="367.5" y1="426.2" x2="326.9" y2="415.4" stroke="#555" stroke-width="0.7"/>
<line x1="411.7" y1="261.1" x2="371.2" y2="250.2" stroke="#555" stroke-width="0.7"/>
<line x1="331.7" y1="416.6" x2="376" y2="251.5" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="350" y="333" font-size="11" text-anchor="middle" fill="#000" transform="rotate(-75 350 333)">c2 = 0.45 m</text>
<path d="M102.4,573.7 A40,40 0 0 0 177.6,573.7" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#ek)"/>
<text x="88" y="590" font-size="14" text-anchor="end" fill="#000" font-weight="bold">τ1</text>
<path d="M340.3,437.9 A32,32 0 0 0 400.4,437.9" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#ek)"/>
<text x="410.4" y="457" font-size="14" text-anchor="start" fill="#000" font-weight="bold">τ2</text>
<text x="464" y="115" font-size="11" text-anchor="start" fill="#555">load</text>
<text x="40" y="640" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">State:</text>
<text x="40" y="655.5" font-size="11.5" text-anchor="start" fill="#000">q = (30°, 45°), q̇ = (1.0, 2.0) rad/s, q̈ = (2.0, −1.0) rad/s²</text>
<text x="40" y="671" font-size="11.5" text-anchor="start" fill="#000">I1 = m1·l1²/12 = 1.666 kg·m², I2 = 2.0 kg·m², g = 9.81 m/s²</text>
<rect x="560" y="50" width="626" height="160" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="568" y="66.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Lagrange method (§13.1–13.2)</text>
<text x="568" y="82.6" font-size="11.5" text-anchor="start" fill="#000">L = T − V (kinetic − potential energy),  τ_i = d/dt(∂L/∂q̇_i) − ∂L/∂q_i</text>
<text x="568" y="98.1" font-size="11.5" text-anchor="start" fill="#000">M11 = I1 + I2 + m1·c1² + m2·(l1² + c2² + 2·l1·c2·cos q2)</text>
<text x="568" y="113.6" font-size="11.5" text-anchor="start" fill="#000">M12 = M21 = I2 + m2·(c2² + l1·c2·cos q2),   M22 = I2 + m2·c2²</text>
<text x="568" y="129.2" font-size="11.5" text-anchor="start" fill="#000">h = −m2·l1·c2·sin q2</text>
<text x="568" y="144.7" font-size="11.5" text-anchor="start" fill="#000">C·q̇ = ( h·(2·q̇1·q̇2 + q̇2²) ,  −h·q̇1² )   (Coriolis + centrifugal)</text>
<text x="568" y="160.2" font-size="11.5" text-anchor="start" fill="#000">G1 = (m1·c1 + m2·l1)·g·cos q1 + m2·c2·g·cos(q1 + q2),   G2 = m2·c2·g·cos(q1 + q2)</text>
<text x="568" y="175.8" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">τ = M(q)·q̈ + C(q, q̇)·q̇ + G(q)</text>
<rect x="560" y="222" width="626" height="140" rx="4" stroke="#1f6fd1" stroke-width="1.2" fill="#fff"/>
<text x="568" y="238.5" font-size="12.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Worked example (§13.3)</text>
<text x="568" y="254.6" font-size="11.5" text-anchor="start" fill="#000">M11 = 65.56,  M12 = 23.26,  M22 = 12.13 kg·m²,  h = −11.14 kg·m²</text>
<text x="568" y="270.1" font-size="11.5" text-anchor="start" fill="#000">M·q̈ = (107.86, 34.40) N·m          (inertia)</text>
<text x="568" y="285.6" font-size="11.5" text-anchor="start" fill="#000">C·q̇ = (−89.10, 11.14) N·m          (Coriolis + centrifugal)</text>
<text x="568" y="301.2" font-size="11.5" text-anchor="start" fill="#000">G = (475.80, 57.13) N·m              (gravity)</text>
<text x="568" y="316.7" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">τ = (494.56, 102.66) N·m  – checked numerically ✓</text>
<text x="560" y="392" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Share of each term in the joint torque (N·m)</text>
<text x="700" y="424" font-size="11.5" text-anchor="end" fill="#000">τ1 inertia M·q̈</text>
<rect x="860" y="412" width="56.1" height="18" rx="0" stroke="#000" stroke-width="0.8" fill="#dcdcdc"/>
<text x="922.1" y="425" font-size="11" text-anchor="start" fill="#000">107.86</text>
<text x="700" y="454" font-size="11.5" text-anchor="end" fill="#000">τ1 Coriolis + centrif.</text>
<rect x="813.7" y="442" width="46.3" height="18" rx="0" stroke="#000" stroke-width="0.8" fill="#bbb"/>
<text x="807.7" y="455" font-size="11" text-anchor="end" fill="#000">-89.10</text>
<text x="700" y="484" font-size="11.5" text-anchor="end" fill="#000">τ1 gravity G</text>
<rect x="860" y="472" width="247.4" height="18" rx="0" stroke="#000" stroke-width="0.8" fill="#dcdcdc"/>
<text x="1113.4" y="485" font-size="11" text-anchor="start" fill="#000">475.80</text>
<text x="700" y="514" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">τ1 total</text>
<rect x="860" y="502" width="257.2" height="18" rx="0" stroke="#1f6fd1" stroke-width="0.8" fill="#1f6fd1"/>
<text x="1123.2" y="515" font-size="11" text-anchor="start" fill="#000">494.56</text>
<text x="700" y="556" font-size="11.5" text-anchor="end" fill="#000">τ2 inertia M·q̈</text>
<rect x="860" y="544" width="17.9" height="18" rx="0" stroke="#000" stroke-width="0.8" fill="#dcdcdc"/>
<text x="883.9" y="557" font-size="11" text-anchor="start" fill="#000">34.40</text>
<text x="700" y="586" font-size="11.5" text-anchor="end" fill="#000">τ2 Coriolis + centrif.</text>
<rect x="860" y="574" width="5.8" height="18" rx="0" stroke="#000" stroke-width="0.8" fill="#dcdcdc"/>
<text x="871.8" y="587" font-size="11" text-anchor="start" fill="#000">11.14</text>
<text x="700" y="616" font-size="11.5" text-anchor="end" fill="#000">τ2 gravity G</text>
<rect x="860" y="604" width="29.7" height="18" rx="0" stroke="#000" stroke-width="0.8" fill="#dcdcdc"/>
<text x="895.7" y="617" font-size="11" text-anchor="start" fill="#000">57.13</text>
<text x="700" y="646" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">τ2 total</text>
<rect x="860" y="634" width="53.4" height="18" rx="0" stroke="#1f6fd1" stroke-width="0.8" fill="#1f6fd1"/>
<text x="919.4" y="647" font-size="11" text-anchor="start" fill="#000">102.66</text>
<line x1="860" y1="406" x2="860" y2="662" stroke="#000" stroke-width="1"/>
<text x="560" y="700" font-size="11.5" text-anchor="start" fill="#555">Lesson: gravity is the biggest part for joint 1; at these speeds Coriolis (−89) is as large as inertia (108).</text>
<rect x="540" y="764" width="648" height="54" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="540" y1="790" x2="1188" y2="790" stroke="#000" stroke-width="0.8"/>
<line x1="910" y1="790" x2="910" y2="818" stroke="#000" stroke-width="0.8"/>
<text x="548" y="782" font-size="14" font-weight="bold">2-link arm in a vertical plane – Lagrange equation of motion, worked example</text>
<text x="548" y="809" font-size="12" font-weight="bold" fill="#1f6fd1">EXAMPLE – check the maker's documentation</text>
<text x="918" y="802" font-size="11.5">Dwg 22-04 · guide 22 §13.2–13.3</text>
<text x="918" y="814" font-size="11">values like an IRB 2600 arm (J2 + J3) – example</text>
</svg>
