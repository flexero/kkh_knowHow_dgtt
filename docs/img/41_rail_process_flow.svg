<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Rail – process flow</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="eab" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="20.0" y="30.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Rail LG-25-1000 – routing (C55 cold-drawn profile, raceways induction hardened 58 – 62 HRC, base soft)</text>
<rect x="40.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="47.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 10</text>
<text x="229.0" y="86.0" font-size="11" text-anchor="end" fill="#000">LG-SAW</text>
<text x="47.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Incoming profile check + cut</text>
<text x="47.0" y="117.0" font-size="11" text-anchor="start" fill="#000">to 1 020 mm</text>
<text x="47.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 0.8 min</text>
<rect x="270.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="277.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 20</text>
<text x="459.0" y="86.0" font-size="11" text-anchor="end" fill="#000">LG-STR</text>
<text x="277.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Straighten (soft) ≤ 0.3 mm/m</text>
<text x="277.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 2.0 min</text>
<rect x="500.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="507.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 30</text>
<text x="689.0" y="86.0" font-size="11" text-anchor="end" fill="#000">LG-DRL</text>
<text x="507.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Drill + counterbore 17 holes,</text>
<text x="507.0" y="117.0" font-size="11" text-anchor="start" fill="#000">pitch 60, E 20</text>
<text x="507.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 2.6 min</text>
<rect x="730.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="737.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 40</text>
<text x="919.0" y="86.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">LG-IND</text>
<text x="737.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Induction hardening of</text>
<text x="737.0" y="117.0" font-size="11" text-anchor="start" fill="#000">raceways 30 kHz, 8 mm/s</text>
<text x="737.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 3.1 min</text>
<text x="919.0" y="142.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-LG-1</text>
<rect x="960.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="967.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 50</text>
<text x="1149.0" y="86.0" font-size="11" text-anchor="end" fill="#000">HT-TMP</text>
<text x="967.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Tempering 170 °C (rack 100</text>
<text x="967.0" y="117.0" font-size="11" text-anchor="start" fill="#000">rails)</text>
<text x="967.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 1.5 min</text>
<rect x="960.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="967.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 60</text>
<text x="1149.0" y="256.0" font-size="11" text-anchor="end" fill="#000">LG-STH</text>
<text x="967.0" y="273.0" font-size="11" text-anchor="start" fill="#000">CNC straightening, 2 planes ≤</text>
<text x="967.0" y="287.0" font-size="11" text-anchor="start" fill="#000">0.10 mm/m</text>
<text x="967.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 4.0 min</text>
<rect x="730.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="737.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 70</text>
<text x="919.0" y="256.0" font-size="11" text-anchor="end" fill="#000">LG-SGR</text>
<text x="737.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Grind the base on a magnetic</text>
<text x="737.0" y="287.0" font-size="11" text-anchor="start" fill="#000">chuck</text>
<text x="737.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 1.5 min</text>
<rect x="500.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="507.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 80</text>
<text x="689.0" y="256.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">LG-PGR</text>
<text x="507.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Profile grinding: top, datum,</text>
<text x="507.0" y="287.0" font-size="11" text-anchor="start" fill="#000">4 raceways</text>
<text x="507.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 3.5 min</text>
<text x="689.0" y="312.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-LG-2</text>
<rect x="270.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="277.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 90</text>
<text x="459.0" y="256.0" font-size="11" text-anchor="end" fill="#000">LG-CUT</text>
<text x="277.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Final length cut 1 000, E 20</text>
<text x="277.0" y="287.0" font-size="11" text-anchor="start" fill="#000">both ends</text>
<text x="277.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 1.5 min</text>
<rect x="40.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="47.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 100</text>
<text x="229.0" y="256.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QC-RAL</text>
<text x="47.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Hole pitch + straightness</text>
<text x="47.0" y="287.0" font-size="11" text-anchor="start" fill="#000">check, datum mark</text>
<text x="47.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 3.0 min</text>
<text x="229.0" y="312.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-LG-3</text>
<line x1="236.0" y1="118.0" x2="270.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="466.0" y1="118.0" x2="500.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="696.0" y1="118.0" x2="730.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="926.0" y1="118.0" x2="960.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="1058.0" y1="166.0" x2="1058.0" y2="240.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="960.0" y1="288.0" x2="926.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="730.0" y1="288.0" x2="696.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="500.0" y1="288.0" x2="466.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="270.0" y1="288.0" x2="236.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<rect x="40.0" y="430.0" width="730.0" height="22.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="446.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Item</text>
<line x1="270.0" y1="430.0" x2="270.0" y2="452.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="446.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Value (example)</text>
<rect x="40.0" y="452.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="468.0" font-size="11.5" text-anchor="start" fill="#000">Σ cycle per rail</text>
<line x1="270.0" y1="452.0" x2="270.0" y2="474.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="468.0" font-size="11.5" text-anchor="start" fill="#000">23.5 min (10 ops)</text>
<rect x="40.0" y="474.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="490.0" font-size="11.5" text-anchor="start" fill="#000">Takt (200 rails / day, 900 min)</text>
<line x1="270.0" y1="474.0" x2="270.0" y2="496.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="490.0" font-size="11.5" text-anchor="start" fill="#000">4.5 min per rail</text>
<rect x="40.0" y="496.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="512.0" font-size="11.5" text-anchor="start" fill="#000">Profile grinding of a string</text>
<line x1="270.0" y1="496.0" x2="270.0" y2="518.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="512.0" font-size="11.5" text-anchor="start" fill="#000">4 rails = 4.38 m: 2 × 4.38/10 + 4.38/3 = 2.34 min → 0.58 min per rail</text>
<rect x="40.0" y="518.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="534.0" font-size="11.5" text-anchor="start" fill="#000">Induction scan time</text>
<line x1="270.0" y1="518.0" x2="270.0" y2="540.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="534.0" font-size="11.5" text-anchor="start" fill="#000">1 020 mm / 8 mm/s = 128 s + handling = 3.1 min</text>
<rect x="40.0" y="540.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="556.0" font-size="11.5" text-anchor="start" fill="#000">Machines (200 / day)</text>
<line x1="270.0" y1="540.0" x2="270.0" y2="562.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="556.0" font-size="11.5" text-anchor="start" fill="#000">LG-DRL 1 (86 %) · LG-STH 2 · LG-PGR 2 · QC-RAL 1 (91 %)</text>
<rect x="800.0" y="440.0" width="34.0" height="18.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="842.0" y="454.0" font-size="11.5" text-anchor="start" fill="#000">quality gate (QG-… feeds item 5 – quality)</text>
<rect x="800.0" y="466.0" width="34.0" height="18.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="842.0" y="480.0" font-size="11.5" text-anchor="start" fill="#000">operation: op no. · machine type id · name ·</text>
<text x="842.0" y="496.0" font-size="11.5" text-anchor="start" fill="#000">cycle per piece incl. load / unload (min)</text>
<text x="800.0" y="524.0" font-size="11.5" text-anchor="start" fill="#000">Holes are drilled SOFT before hardening;</text>
<text x="800.0" y="540.0" font-size="11.5" text-anchor="start" fill="#000">the hardened pattern must not reach the</text>
<text x="800.0" y="556.0" font-size="11.5" text-anchor="start" fill="#000">bolt holes (cracks).</text>
<rect x="812.0" y="742.0" width="382.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="812.0" y1="768.0" x2="1194.0" y2="768.0" stroke="#000" stroke-width="0.8"/>
<line x1="812.0" y1="792.0" x2="1194.0" y2="792.0" stroke="#000" stroke-width="0.8"/>
<line x1="1002.0" y1="792.0" x2="1002.0" y2="824.0" stroke="#000" stroke-width="0.8"/>
<text x="820.0" y="760.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Rail – process flow</text>
<text x="820.0" y="785.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the machine maker's data</text>
<text x="820.0" y="812.0" font-size="11.5" text-anchor="start" fill="#000">Drawing 41-03</text>
<text x="1010.0" y="806.0" font-size="11" text-anchor="start" fill="#000">Scale: none (flow)</text>
<text x="1010.0" y="819.0" font-size="11" text-anchor="start" fill="#000">guide 41 §8</text>
</svg>
