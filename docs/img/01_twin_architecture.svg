<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">01 – Digital twin architecture: real factory → data acquisition → twin core → services → users</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" fill="#444">Data flows upwards (black). Commands from the pages change only the twin (red, dashed) – the twin never switches real motors or valves.</text>
