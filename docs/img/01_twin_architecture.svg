<text x="175.0" y="425.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Model (the virtual copy)</text>
<text x="175.0" y="441.2" font-size="12" text-anchor="middle" fill="#111">config/factory.json → model.py</text>
<text x="175.0" y="457.2" font-size="12" text-anchor="middle" fill="#111">16 stations · 30 buffers · 2 AS/RS</text>
<text x="175.0" y="473.2" font-size="12" text-anchor="middle" fill="#111">2 AGVs · 10 fixture pallets</text>
<text x="175.0" y="489.2" font-size="12" text-anchor="middle" fill="#111">3 models VC10 / VC20 / VC30</text>
<rect x="335.0" y="378.0" width="270.0" height="150.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="470.0" y="425.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Simulation engine</text>
<text x="470.0" y="441.2" font-size="12" text-anchor="middle" fill="#111">engine.py, thread "twin-sim"</text>
<text x="470.0" y="457.2" font-size="12" text-anchor="middle" fill="#111">tick 0.1 s real · step ≤ 1 s sim</text>
<text x="470.0" y="473.2" font-size="12" text-anchor="middle" fill="#111">speed 1–600x (default 20x)</text>
<text x="470.0" y="489.2" font-size="12" text-anchor="middle" fill="#111">same seed → same run</text>
<rect x="630.0" y="378.0" width="270.0" height="150.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="765.0" y="425.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">State</text>
<text x="765.0" y="441.2" font-size="12" text-anchor="middle" fill="#111">snapshot JSON ≈ 41 kB</text>
<text x="765.0" y="457.2" font-size="12" text-anchor="middle" fill="#111">published every 0.5 s (SSE)</text>
<text x="765.0" y="473.2" font-size="12" text-anchor="middle" fill="#111">trend 360 points per machine</text>
<text x="765.0" y="489.2" font-size="12" text-anchor="middle" fill="#111">OFFLINE after 30 s no data</text>
<rect x="925.0" y="378.0" width="270.0" height="150.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="1060.0" y="425.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Historian</text>
<text x="1060.0" y="441.2" font-size="12" text-anchor="middle" fill="#111">historian.py · SQLite WAL</text>
<text x="1060.0" y="457.2" font-size="12" text-anchor="middle" fill="#111">samples every 15 s sim</text>
<text x="1060.0" y="473.2" font-size="12" text-anchor="middle" fill="#111">events · units (genealogy)</text>
<text x="1060.0" y="489.2" font-size="12" text-anchor="middle" fill="#111">≈ 12.6 MB per sim day</text>
