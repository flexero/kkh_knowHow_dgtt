<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">Input wiring – PNP (sourcing) sensors, sinking PLC inputs: Delta AS332T-A and Siemens S7-1200 (example addresses of guide 36)</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#666666">A PNP sensor switches +24 V to the input. The input card closes the circuit to 0 V (Delta: S/S terminal to 0 V = sink mode; Siemens: 1M to M).</text>
<text x="30.0" y="96.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Delta AS332T-A (CPU, 16 DI on the CPU)</text>
<text x="30.0" y="114.0" font-size="11" text-anchor="start" fill="#1565c0">S/S → 0 V = SINK mode = PNP sensors</text>
