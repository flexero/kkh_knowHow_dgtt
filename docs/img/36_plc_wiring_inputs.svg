<text x="30.0" y="850.0" font-size="12" text-anchor="start" fill="#000">Rules (example – check the manual of your module):</text>
<text x="30.0" y="866.0" font-size="12" text-anchor="start" fill="#000">• Delta AS series: X words have 16 bits (X0.0 … X0.15). DVP-ES2/ES3 use OCTAL numbers: X0 … X7, X10 … X17 (no X8, no X9).</text>
<text x="30.0" y="882.0" font-size="12" text-anchor="start" fill="#000">• Siemens: a byte has 8 bits → %I20.0 … %I20.7, then %I21.0. %I20.8 does not exist.</text>
<text x="30.0" y="898.0" font-size="12" text-anchor="start" fill="#000">• Input ON level IEC 61131-2 type 1/3: ≥ 15 V, ≥ 2 mA; OFF ≤ 5 V. Input delay (filter) 3.2 ms (Siemens default 6.4 ms) – adds to the reaction.</text>
<text x="30.0" y="914.0" font-size="12" text-anchor="start" fill="#000">• Safety signals (door, curtain, e-stop) are wired to the SAFETY RELAY; the PLC only reads one auxiliary contact as status.</text>
