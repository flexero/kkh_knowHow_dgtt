<text x="60.0" y="84.0" font-size="11.5" text-anchor="start" fill="#000">tack welds 40 mm long, pitch ≈ 300 mm, on all 4 corners, both ends first, then from the middle outward</text>
<text x="710.0" y="155.0" font-size="11" text-anchor="start" fill="#000">diaphragms fitted + welded first</text>
<text x="710.0" y="172.0" font-size="11" text-anchor="start" fill="#000">(open box), then the 4th plate</text>
<text x="24.0" y="230.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">2. Weld order in the section</text>
<rect x="90.0" y="255.0" width="120.0" height="170.0" rx="0" fill="#fff" stroke="#000" stroke-width="4"/>
<circle cx="210.0" cy="255.0" r="13.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="210.0" y="259.5" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<circle cx="90.0" cy="425.0" r="13.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="90.0" y="429.5" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<circle cx="90.0" cy="255.0" r="13.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="90.0" y="259.5" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<circle cx="210.0" cy="425.0" r="13.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="210.0" y="429.5" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<text x="260.0" y="270.0" font-size="11.5" text-anchor="start" fill="#000">weld 1 + 2 = diagonal pair (shrinkage moments cancel)</text>
<text x="260.0" y="289.0" font-size="11.5" text-anchor="start" fill="#000">turn the mast 180° on the positioner, then weld 3 + 4</text>
<text x="260.0" y="308.0" font-size="11.5" text-anchor="start" fill="#000">two welders at the same time on opposite corners = best</text>
<text x="260.0" y="327.0" font-size="11.5" text-anchor="start" fill="#000">all 4 corners: same parameters, same direction, same speed</text>
<text x="24.0" y="470.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">3. Backstep segments along each corner (≈ 500 mm, from the middle outward)</text>
<line x1="60.0" y1="520.0" x2="700.0" y2="520.0" stroke="#000" stroke-width="3"/>
<line x1="380.0" y1="506.0" x2="330.0" y2="506.0" stroke="#1f6fd1" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="355.0" y="498.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1" font-weight="bold">1</text>
<line x1="430.0" y1="506.0" x2="380.0" y2="506.0" stroke="#1f6fd1" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="405.0" y="498.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1" font-weight="bold">2</text>
<line x1="330.0" y1="506.0" x2="280.0" y2="506.0" stroke="#1f6fd1" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="305.0" y="498.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1" font-weight="bold">3</text>
<line x1="480.0" y1="506.0" x2="430.0" y2="506.0" stroke="#1f6fd1" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="455.0" y="498.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1" font-weight="bold">4</text>
<line x1="280.0" y1="506.0" x2="230.0" y2="506.0" stroke="#1f6fd1" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="255.0" y="498.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1" font-weight="bold">5</text>
<line x1="530.0" y1="506.0" x2="480.0" y2="506.0" stroke="#1f6fd1" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="505.0" y="498.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1" font-weight="bold">6</text>
<text x="60.0" y="544.0" font-size="11.5" text-anchor="start" fill="#000">each segment welded against the direction of progress; then 7, 8 … to the ends</text>
<text x="780.0" y="230.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">4. Bow from longitudinal shrinkage</text>
<text x="780.0" y="255.0" font-size="11.5" text-anchor="start" fill="#000">heat input Q = k·U·I / v = 0.8 × 26 V × 240 A / 6 mm/s</text>
<text x="780.0" y="274.0" font-size="11.5" text-anchor="start" fill="#000">  = 832 J/mm (MAG 135, a4)</text>
<text x="780.0" y="293.0" font-size="11.5" text-anchor="start" fill="#000">shrink force (White, rule of thumb)</text>
<text x="780.0" y="312.0" font-size="11.5" text-anchor="start" fill="#000">F_s ≈ 0.2 · Q · E·α / (c·ρ) ≈ 116 kN per corner weld</text>
<text x="780.0" y="331.0" font-size="11.5" text-anchor="start" fill="#000">bow if ONE corner weld alone (e = 250 mm):</text>
<text x="780.0" y="350.0" font-size="11.5" text-anchor="start" fill="#000">δ = F_s · e · L² / (8 E I) ≈ 4.0 mm  &gt; 3 mm limit</text>
<text x="780.0" y="369.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">balanced order 1-2 / 3-4 → moments cancel, δ &lt; 1–2 mm</text>
<text x="780.0" y="388.0" font-size="11.5" text-anchor="start" fill="#000">tolerance after welding ≤ L/3000 ≈ 3 mm (example)</text>
<line x1="780.0" y1="510.0" x2="1160.0" y2="510.0" stroke="#000" stroke-width="0.8"/>
<line x1="780.0" y1="450.0" x2="780.0" y2="570.0" stroke="#000" stroke-width="0.8"/>
