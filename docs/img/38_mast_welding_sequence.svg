<text x="970.0" y="452.0" font-size="11" text-anchor="middle" fill="#000">one corner only: 4.0 mm</text>
<text x="970.0" y="534.0" font-size="11" text-anchor="middle" fill="#1f6fd1">balanced: ≈ 0.8 mm</text>
<text x="780.0" y="586.0" font-size="11" text-anchor="start" fill="#000">bow along the 9.3 m mast (vertical scale exaggerated)</text>
<text x="24.0" y="600.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">5. Measure + straighten</text>
<rect x="60.0" y="640.0" width="640.0" height="34.0" rx="0" fill="url(#hatchA)" stroke="#000" stroke-width="1.2"/>
<polygon points="214.0,674.0 246.0,674.0 230.0,646.0" fill="#fff" stroke="#1f6fd1" stroke-width="1.5"/>
<polygon points="364.0,674.0 396.0,674.0 380.0,646.0" fill="#fff" stroke="#1f6fd1" stroke-width="1.5"/>
<polygon points="514.0,674.0 546.0,674.0 530.0,646.0" fill="#fff" stroke="#1f6fd1" stroke-width="1.5"/>
<text x="60.0" y="700.0" font-size="11.5" text-anchor="start" fill="#000">laser line / taut wire over the full length, readings every 1 m on 2 faces</text>
<text x="60.0" y="718.0" font-size="11.5" text-anchor="start" fill="#000">wedge-shaped heat spots on the convex side, ≤ 650 °C (dull red; S355+N), cool in air – never water</text>
<text x="60.0" y="736.0" font-size="11.5" text-anchor="start" fill="#000">re-measure; record in the inspection report (ITP hold point)</text>
