<text x="761.5" y="342.5" font-size="11.5" text-anchor="middle" fill="#000" transform="rotate(-90 761.5 342.5)">H = 7.95 − 0.75 = 7.2 m</text>
<text x="174.3" y="75.0" font-size="11.5" text-anchor="start" fill="#000">P1 = (L/5, I/O + 2H/3)   P2 = (2L/3, I/O + H/5)</text>
<rect x="60.0" y="640.0" width="90.0" height="24.0" rx="0" fill="#eef3fb" stroke="#000" stroke-width="0.7"/>
<text x="65.0" y="656.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">Move</text>
<rect x="150.0" y="640.0" width="60.0" height="24.0" rx="0" fill="#eef3fb" stroke="#000" stroke-width="0.7"/>
<text x="155.0" y="656.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">Δx m</text>
<rect x="210.0" y="640.0" width="190.0" height="24.0" rx="0" fill="#eef3fb" stroke="#000" stroke-width="0.7"/>
<text x="215.0" y="656.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">t_travel s</text>
<rect x="400.0" y="640.0" width="60.0" height="24.0" rx="0" fill="#eef3fb" stroke="#000" stroke-width="0.7"/>
<text x="405.0" y="656.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">Δz m</text>
<rect x="460.0" y="640.0" width="190.0" height="24.0" rx="0" fill="#eef3fb" stroke="#000" stroke-width="0.7"/>
<text x="465.0" y="656.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">t_hoist s</text>
<rect x="650.0" y="640.0" width="80.0" height="24.0" rx="0" fill="#eef3fb" stroke="#000" stroke-width="0.7"/>
<text x="655.0" y="656.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#000">t_move s</text>
<rect x="60.0" y="664.0" width="90.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="65.0" y="680.0" font-size="11.5" text-anchor="start" fill="#000">I/O → P1</text>
<rect x="150.0" y="664.0" width="60.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="155.0" y="680.0" font-size="11.5" text-anchor="start" fill="#000">5.65</text>
<rect x="210.0" y="664.0" width="190.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="215.0" y="680.0" font-size="11.5" text-anchor="start" fill="#000">2√(5.65/0.5) = 6.72</text>
<rect x="400.0" y="664.0" width="60.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="405.0" y="680.0" font-size="11.5" text-anchor="start" fill="#000">4.80</text>
<rect x="460.0" y="664.0" width="190.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="465.0" y="680.0" font-size="11.5" text-anchor="start" fill="#000">4.8/1 + 1/0.5 = 6.80</text>
<rect x="650.0" y="664.0" width="80.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="655.0" y="680.0" font-size="11.5" text-anchor="start" fill="#000">6.80</text>
<rect x="60.0" y="688.0" width="90.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="65.0" y="704.0" font-size="11.5" text-anchor="start" fill="#000">I/O → P2</text>
<rect x="150.0" y="688.0" width="60.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="155.0" y="704.0" font-size="11.5" text-anchor="start" fill="#000">18.83</text>
<rect x="210.0" y="688.0" width="190.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="215.0" y="704.0" font-size="11.5" text-anchor="start" fill="#000">18.83/3 + 3/0.5 = 12.28</text>
<rect x="400.0" y="688.0" width="60.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="405.0" y="704.0" font-size="11.5" text-anchor="start" fill="#000">1.44</text>
<rect x="460.0" y="688.0" width="190.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="465.0" y="704.0" font-size="11.5" text-anchor="start" fill="#000">2√(1.44/0.5) = 3.39</text>
<rect x="650.0" y="688.0" width="80.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="655.0" y="704.0" font-size="11.5" text-anchor="start" fill="#000">12.28</text>
<rect x="60.0" y="712.0" width="90.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="65.0" y="728.0" font-size="11.5" text-anchor="start" fill="#000">P1 → P2</text>
<rect x="150.0" y="712.0" width="60.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="155.0" y="728.0" font-size="11.5" text-anchor="start" fill="#000">13.18</text>
<rect x="210.0" y="712.0" width="190.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="215.0" y="728.0" font-size="11.5" text-anchor="start" fill="#000">2√(13.18/0.5) = 10.27</text>
<rect x="400.0" y="712.0" width="60.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="405.0" y="728.0" font-size="11.5" text-anchor="start" fill="#000">3.36</text>
<rect x="460.0" y="712.0" width="190.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="465.0" y="728.0" font-size="11.5" text-anchor="start" fill="#000">3.36 + 2 = 5.36</text>
<rect x="650.0" y="712.0" width="80.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/>
<text x="655.0" y="728.0" font-size="11.5" text-anchor="start" fill="#000">10.27</text>
<text x="60.0" y="756.0" font-size="11.5" text-anchor="start" fill="#000">one stop = positioning 3.0 + fork out 2.18 + lift 0.5 + fork in 2.18 = 7.87 s  (fork 1.35 m at 1 m/s, 1.2 m/s²: 1.35/1 + 1/1.2 = 2.18 s)</text>
<text x="750.0" y="658.0" font-size="12" text-anchor="start" fill="#1f6fd1">t_SC = (2·6.80 + 2·12.28)/2 + 2·7.87</text>
<text x="750.0" y="676.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f6fd1">     = 19.08 + 15.73 = 34.8 s → 103 jobs/h</text>
<text x="750.0" y="702.0" font-size="12" text-anchor="start" fill="#1f6fd1">t_DC = 6.80 + 10.27 + 12.28 + 4·4.87 + 3·3.0</text>
<text x="750.0" y="720.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f6fd1">     = 29.35 + 28.47 = 57.8 s → 125 jobs/h</text>
