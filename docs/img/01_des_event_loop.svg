<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" font-family="Arial, Helvetica, sans-serif">
<title>Discrete-event simulation: event list and clock</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1240" height="860" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">01 – Discrete-event simulation (DES): future event list (FEL) + clock – flow chart and hand example</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" fill="#444">Example: one washer, service time 150 s, parts arrive at 0, 120, 200, 500, 560 s (FIFO queue, unlimited buffer).</text>
<rect x="180.0" y="70.0" width="140.0" height="40.0" rx="20" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="250.0" y="96.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">START</text>
<rect x="60.0" y="130.0" width="380.0" height="56.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="70.0" y="150.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">1  Initialise: clock = 0, state = idle,</text>
<text x="86.0" y="168.0" font-size="11" text-anchor="start" fill="#111">queue empty; put first events into the FEL</text>
<rect x="60.0" y="216.0" width="380.0" height="46.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="70.0" y="236.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2  Take the EARLIEST event from the FEL</text>
<rect x="60.0" y="292.0" width="380.0" height="46.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="70.0" y="312.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">3  Advance clock to the event time</text>
<rect x="60.0" y="368.0" width="380.0" height="56.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="70.0" y="388.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">4  Update statistics (areas under</text>
<text x="86.0" y="406.0" font-size="11" text-anchor="start" fill="#111">queue length and busy state × time)</text>
<rect x="60.0" y="454.0" width="380.0" height="96.0" rx="0" fill="#f4f4f4" stroke="#111" stroke-width="1.2"/>
<text x="70.0" y="474.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">5  Execute the event routine</text>
<text x="86.0" y="492.0" font-size="11" text-anchor="start" fill="#111">ARRIVAL: if idle → start service, else queue +1</text>
<text x="86.0" y="510.0" font-size="11" text-anchor="start" fill="#111">END: if queue &gt; 0 → start next, else idle</text>
<text x="86.0" y="528.0" font-size="11" text-anchor="start" fill="#111">FAILURE / REPAIR: change state</text>
<rect x="60.0" y="580.0" width="380.0" height="46.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="70.0" y="600.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">6  Schedule new events into the FEL</text>
<path d="M70.0,684.0 L250.0,648 L430.0,684.0 L250.0,720 Z" stroke="#111" stroke-width="1.4" fill="#f4f4f4"/>
<text x="250.0" y="689.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">7  clock ≥ end time  or  FEL empty ?</text>
<rect x="60.0" y="770.0" width="380.0" height="46.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="70.0" y="790.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">8  Report: means, utilisation, CI</text>
<line x1="250.0" y1="110.0" x2="250.0" y2="130.0" stroke="#111" stroke-width="1.2" marker-end="url(#ak)"/>
<line x1="250.0" y1="186.0" x2="250.0" y2="216.0" stroke="#111" stroke-width="1.2" marker-end="url(#ak)"/>
<line x1="250.0" y1="262.0" x2="250.0" y2="292.0" stroke="#111" stroke-width="1.2" marker-end="url(#ak)"/>
<line x1="250.0" y1="338.0" x2="250.0" y2="368.0" stroke="#111" stroke-width="1.2" marker-end="url(#ak)"/>
<line x1="250.0" y1="424.0" x2="250.0" y2="454.0" stroke="#111" stroke-width="1.2" marker-end="url(#ak)"/>
<line x1="250.0" y1="550.0" x2="250.0" y2="580.0" stroke="#111" stroke-width="1.2" marker-end="url(#ak)"/>
<line x1="250.0" y1="626.0" x2="250.0" y2="648.0" stroke="#111" stroke-width="1.2" marker-end="url(#ak)"/>
<line x1="250.0" y1="720.0" x2="250.0" y2="770.0" stroke="#111" stroke-width="1.2" marker-end="url(#ak)"/>
<text x="260.0" y="748.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">yes</text>
<path d="M70,684 L30,684 L30,239 L60,239" stroke="#111" stroke-width="1.4" fill="none" marker-end="url(#ak)"/>
<text x="34.0" y="470.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">no</text>
<text x="520.0" y="86.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Event trace of the hand example (the FEL holds at most 2 events here)</text>
<rect x="520.0" y="100.0" width="675.0" height="24.0" rx="0" fill="#f4f4f4" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="117.0" font-size="11" text-anchor="start" font-weight="bold" fill="#111">clock s</text>
<text x="596.0" y="117.0" font-size="11" text-anchor="start" font-weight="bold" fill="#111">event</text>
<text x="666.0" y="117.0" font-size="11" text-anchor="start" font-weight="bold" fill="#111">action</text>
<text x="876.0" y="117.0" font-size="11" text-anchor="start" font-weight="bold" fill="#111">queue</text>
<text x="931.0" y="117.0" font-size="11" text-anchor="start" font-weight="bold" fill="#111">busy</text>
<text x="981.0" y="117.0" font-size="11" text-anchor="start" font-weight="bold" fill="#111">FEL after the event</text>
<rect x="520.0" y="124.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="141.0" font-size="11" text-anchor="start" fill="#111">0</text>
<text x="596.0" y="141.0" font-size="11" text-anchor="start" fill="#111">A1</text>
<text x="666.0" y="141.0" font-size="11" text-anchor="start" fill="#111">start part 1 → E1 at 150</text>
<text x="876.0" y="141.0" font-size="11" text-anchor="start" fill="#111">0</text>
<text x="931.0" y="141.0" font-size="11" text-anchor="start" fill="#111">yes</text>
<text x="981.0" y="141.0" font-size="11" text-anchor="start" fill="#111">A2 120 · E1 150</text>
<rect x="520.0" y="148.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="165.0" font-size="11" text-anchor="start" fill="#111">120</text>
<text x="596.0" y="165.0" font-size="11" text-anchor="start" fill="#111">A2</text>
<text x="666.0" y="165.0" font-size="11" text-anchor="start" fill="#111">busy → wait</text>
<text x="876.0" y="165.0" font-size="11" text-anchor="start" fill="#111">1</text>
<text x="931.0" y="165.0" font-size="11" text-anchor="start" fill="#111">yes</text>
<text x="981.0" y="165.0" font-size="11" text-anchor="start" fill="#111">E1 150 · A3 200</text>
<rect x="520.0" y="172.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="189.0" font-size="11" text-anchor="start" fill="#111">150</text>
<text x="596.0" y="189.0" font-size="11" text-anchor="start" fill="#c0392b">E1</text>
<text x="666.0" y="189.0" font-size="11" text-anchor="start" fill="#111">start part 2 → E2 at 300</text>
<text x="876.0" y="189.0" font-size="11" text-anchor="start" fill="#111">0</text>
<text x="931.0" y="189.0" font-size="11" text-anchor="start" fill="#111">yes</text>
<text x="981.0" y="189.0" font-size="11" text-anchor="start" fill="#111">A3 200 · E2 300</text>
<rect x="520.0" y="196.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="213.0" font-size="11" text-anchor="start" fill="#111">200</text>
<text x="596.0" y="213.0" font-size="11" text-anchor="start" fill="#111">A3</text>
<text x="666.0" y="213.0" font-size="11" text-anchor="start" fill="#111">busy → wait</text>
<text x="876.0" y="213.0" font-size="11" text-anchor="start" fill="#111">1</text>
<text x="931.0" y="213.0" font-size="11" text-anchor="start" fill="#111">yes</text>
<text x="981.0" y="213.0" font-size="11" text-anchor="start" fill="#111">E2 300 · A4 500</text>
<rect x="520.0" y="220.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="237.0" font-size="11" text-anchor="start" fill="#111">300</text>
<text x="596.0" y="237.0" font-size="11" text-anchor="start" fill="#c0392b">E2</text>
<text x="666.0" y="237.0" font-size="11" text-anchor="start" fill="#111">start part 3 → E3 at 450</text>
<text x="876.0" y="237.0" font-size="11" text-anchor="start" fill="#111">0</text>
<text x="931.0" y="237.0" font-size="11" text-anchor="start" fill="#111">yes</text>
<text x="981.0" y="237.0" font-size="11" text-anchor="start" fill="#111">E3 450 · A4 500</text>
<rect x="520.0" y="244.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="261.0" font-size="11" text-anchor="start" fill="#111">450</text>
<text x="596.0" y="261.0" font-size="11" text-anchor="start" fill="#c0392b">E3</text>
<text x="666.0" y="261.0" font-size="11" text-anchor="start" fill="#111">queue empty → idle</text>
<text x="876.0" y="261.0" font-size="11" text-anchor="start" fill="#111">0</text>
<text x="931.0" y="261.0" font-size="11" text-anchor="start" fill="#111">no</text>
<text x="981.0" y="261.0" font-size="11" text-anchor="start" fill="#111">A4 500</text>
<rect x="520.0" y="268.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="285.0" font-size="11" text-anchor="start" fill="#111">500</text>
<text x="596.0" y="285.0" font-size="11" text-anchor="start" fill="#111">A4</text>
<text x="666.0" y="285.0" font-size="11" text-anchor="start" fill="#111">start part 4 → E4 at 650</text>
<text x="876.0" y="285.0" font-size="11" text-anchor="start" fill="#111">0</text>
<text x="931.0" y="285.0" font-size="11" text-anchor="start" fill="#111">yes</text>
<text x="981.0" y="285.0" font-size="11" text-anchor="start" fill="#111">A5 560 · E4 650</text>
<rect x="520.0" y="292.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="309.0" font-size="11" text-anchor="start" fill="#111">560</text>
<text x="596.0" y="309.0" font-size="11" text-anchor="start" fill="#111">A5</text>
<text x="666.0" y="309.0" font-size="11" text-anchor="start" fill="#111">busy → wait</text>
<text x="876.0" y="309.0" font-size="11" text-anchor="start" fill="#111">1</text>
<text x="931.0" y="309.0" font-size="11" text-anchor="start" fill="#111">yes</text>
<text x="981.0" y="309.0" font-size="11" text-anchor="start" fill="#111">E4 650</text>
<rect x="520.0" y="316.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="333.0" font-size="11" text-anchor="start" fill="#111">650</text>
<text x="596.0" y="333.0" font-size="11" text-anchor="start" fill="#c0392b">E4</text>
<text x="666.0" y="333.0" font-size="11" text-anchor="start" fill="#111">start part 5 → E5 at 800</text>
<text x="876.0" y="333.0" font-size="11" text-anchor="start" fill="#111">0</text>
<text x="931.0" y="333.0" font-size="11" text-anchor="start" fill="#111">yes</text>
<text x="981.0" y="333.0" font-size="11" text-anchor="start" fill="#111">E5 800</text>
<rect x="520.0" y="340.0" width="675.0" height="24.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<text x="526.0" y="357.0" font-size="11" text-anchor="start" fill="#111">800</text>
<text x="596.0" y="357.0" font-size="11" text-anchor="start" fill="#c0392b">E5</text>
<text x="666.0" y="357.0" font-size="11" text-anchor="start" fill="#111">idle, FEL empty → stop</text>
<text x="876.0" y="357.0" font-size="11" text-anchor="start" fill="#111">0</text>
<text x="931.0" y="357.0" font-size="11" text-anchor="start" fill="#111">no</text>
<text x="981.0" y="357.0" font-size="11" text-anchor="start" fill="#111">–</text>
<text x="520.0" y="394.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Results (observation statistics and time-weighted statistics)</text>
<text x="520.0" y="416.0" font-size="12" text-anchor="start" fill="#111">waits: 0, 30, 100, 0, 90 s  →  mean wait Wq = 220 / 5 = 44 s</text>
<text x="520.0" y="436.0" font-size="12" text-anchor="start" fill="#111">time-weighted queue: area 30 + 100 + 90 = 220 part·s over 800 s  →  Lq = 0.275</text>
<text x="520.0" y="456.0" font-size="12" text-anchor="start" fill="#111">Little's law check: λ × Wq = (5 / 800 s) × 44 s = 0.275  ✔</text>
<text x="520.0" y="476.0" font-size="12" text-anchor="start" fill="#111">busy time 5 × 150 = 750 s of 800 s  →  utilisation 93.75 %</text>
<rect x="520.0" y="514.0" width="680.0" height="150.0" rx="0" fill="#f4f4f4" stroke="#c0392b" stroke-width="1.4"/>
<text x="532.0" y="536.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">This twin is TIME-STEPPED, not event-driven:</text>
<text x="532.0" y="558.0" font-size="11" text-anchor="start" fill="#111">every physics step (≤ 1 s) ALL machines are updated in order downstream → upstream;</text>
<text x="532.0" y="578.0" font-size="11" text-anchor="start" fill="#111">events (part done, failure) are found when a counter crosses zero inside a step;</text>
<text x="532.0" y="598.0" font-size="11" text-anchor="start" fill="#111">error ≤ 1 step per event ≈ 1.3 % of the shortest model cycle (75 s HONE VC10).</text>
<text x="532.0" y="618.0" font-size="11" text-anchor="start" fill="#111">Advantage: continuous values (temperature, battery, vibration) and live data are easy.</text>
<text x="532.0" y="638.0" font-size="11" text-anchor="start" fill="#111">DES jumps 0 → 120 → 150 → 200 …: only 10 event executions for 800 s (time-step: 800 steps).</text>
<rect x="798.0" y="774.0" width="430.0" height="74.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<line x1="798.0" y1="800.0" x2="1228.0" y2="800.0" stroke="#111" stroke-width="1.2"/>
<line x1="1048.0" y1="800.0" x2="1048.0" y2="848.0" stroke="#111" stroke-width="1.2"/>
<text x="806.0" y="792.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">EXAMPLE – check the maker's documentation</text>
