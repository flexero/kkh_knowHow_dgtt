<line x1="378.0" y1="592.0" x2="402.0" y2="568.0" stroke="#c0392b" stroke-width="2"/>
<line x1="270.0" y1="440.0" x2="270.0" y2="476.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arA)"/>
<text x="278.0" y="458.0" font-size="11" text-anchor="start" fill="#c0392b">side clamp into B1/B2</text>
<line x1="480.0" y1="620.0" x2="434.0" y2="620.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arA)"/>
<text x="438.0" y="640.0" font-size="11" text-anchor="start" fill="#c0392b">end clamp into C1</text>
<text x="50.0" y="732.0" font-size="11" text-anchor="start" fill="#c0392b">red X = vertical clamp directly over A1, A2, A3</text>
<rect x="560.0" y="76.0" width="525.0" height="300.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="568.0" y="94.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Clamping force – worked example (§23.2)</text>
<text x="568.0" y="113.0" font-size="12" text-anchor="start" fill="#000">Cutting load: Ft = 2 · M / D = 2 · 99 / 0.100 = 1 980 N</text>
<text x="568.0" y="130.0" font-size="12" text-anchor="start" fill="#000">Resultant in the plane Fr ≈ 1.2 · Ft = 2 380 N (estimate)</text>
<text x="568.0" y="147.0" font-size="12" text-anchor="start" fill="#000">Case 1 – friction only (worst case, no locator in the way):</text>
<text x="568.0" y="164.0" font-size="12" text-anchor="start" fill="#000">  ΣFcl ≥ S · Fr / (μ1 + μ2) = 2.5 · 2 380 / (0.15 + 0.15)</text>
<text x="568.0" y="181.0" font-size="12" text-anchor="start" fill="#000">       = 19.8 kN   (μ1 base pads, μ2 clamp face)</text>
<text x="568.0" y="198.0" font-size="12" text-anchor="start" fill="#000">Case 2 – force into B / C locators: clamps only keep contact</text>
<text x="568.0" y="215.0" font-size="12" text-anchor="start" fill="#000">  (better design: the locators take the cutting force)</text>
<text x="568.0" y="232.0" font-size="12" text-anchor="start" fill="#000">Swing clamp, piston Ø25 at 250 bar:</text>
<text x="568.0" y="249.0" font-size="12" text-anchor="start" fill="#000">  F = p · A = 25 N/mm² · 491 mm² = 12.3 kN (theoretical)</text>
<text x="568.0" y="266.0" font-size="12" text-anchor="start" fill="#000">  ≈ 9.8 kN at the arm (factor 0.8 – read the datasheet curve)</text>
<text x="568.0" y="283.0" font-size="12" text-anchor="start" fill="#000">3 vertical clamps = 29 kN ≥ 19.8 kN OK (S real ≈ 3.7)</text>
<text x="568.0" y="300.0" font-size="12" text-anchor="start" fill="#000">Clamp always over a support – no bending of the casting</text>
<rect x="560.0" y="388.0" width="525.0" height="150.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="568.0" y="406.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Locating holes for OP30 (round + diamond pin)</text>
<text x="568.0" y="425.0" font-size="12" text-anchor="start" fill="#000">Hole Ø10 H7 = 10.000…10.015, pin Ø10 g6 = 9.986…9.995</text>
<text x="568.0" y="442.0" font-size="12" text-anchor="start" fill="#000">Clearance 0.005…0.029 mm; holes 200 mm apart</text>
<text x="568.0" y="459.0" font-size="12" text-anchor="start" fill="#000">Max rotation ≈ 0.029 / 200 = 0.145 mrad = 0.0083°</text>
<text x="568.0" y="476.0" font-size="12" text-anchor="start" fill="#000">Diamond pin: free along the line of the two holes</text>
<text x="568.0" y="493.0" font-size="12" text-anchor="start" fill="#000">  (takes the hole-distance tolerance, stops rotation)</text>
<rect x="560.0" y="550.0" width="525.0" height="120.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="568.0" y="568.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Hydraulics (guide 30 circuits 4 / 6, guide 09)</text>
<text x="568.0" y="587.0" font-size="12" text-anchor="start" fill="#000">Sequence: side + end clamps first, then vertical clamps</text>
<text x="568.0" y="604.0" font-size="12" text-anchor="start" fill="#000">Pressure switch per circuit -&gt; NC start interlock</text>
<text x="568.0" y="621.0" font-size="12" text-anchor="start" fill="#000">Accumulator on the pallet keeps pressure when uncoupled</text>
<rect x="656.0" y="694.0" width="430.0" height="52.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<line x1="656.0" y1="720.0" x2="1086.0" y2="720.0" stroke="#000" stroke-width="1"/>
<text x="664.0" y="712.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">EXAMPLE – check the maker's documentation</text>
<text x="664.0" y="738.0" font-size="12" text-anchor="start" fill="#000">Guide 08 – CNC / G-code · 08_fixture_321</text>
</svg>