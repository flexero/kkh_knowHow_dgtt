<text x="288.0" y="128.0" font-size="11" text-anchor="start" fill="#000">face mill</text>
<text x="40.0" y="450.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Top view</text>
<rect x="110.0" y="480.0" width="320.0" height="200.0" rx="0" fill="#e6e6e6" stroke="#000" stroke-width="2"/>
<circle cx="150.0" cy="520.0" r="8.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<text x="162.0" y="524.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">A1</text>
<circle cx="150.0" cy="640.0" r="8.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<text x="162.0" y="644.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">A3</text>
<circle cx="390.0" cy="580.0" r="8.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<text x="402.0" y="584.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">A2</text>
