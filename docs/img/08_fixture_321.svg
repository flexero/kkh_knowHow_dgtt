<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">Fixture 3-2-1 for the crankcase – locating points, clamps and clamping force (OP20, HMC pallet)</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#000">3 points (A) fix the plane: 3 DOF; 2 points (B) on the long side: 2 DOF; 1 point (C) on the end: 1 DOF. Clamps push the part INTO the locators.</text>
