<line x1="150.0" y1="166.0" x2="150.0" y2="198.0" stroke="#c0392b" stroke-width="3" marker-end="url(#arA)"/>
<text x="116.0" y="164.0" font-size="11" text-anchor="end" fill="#000">swing clamp</text>
<rect x="360.0" y="154.0" width="60.0" height="12.0" rx="0" fill="#bbb" stroke="#000" stroke-width="1.5"/>
<line x1="390.0" y1="166.0" x2="390.0" y2="198.0" stroke="#c0392b" stroke-width="3" marker-end="url(#arA)"/>
<text x="424.0" y="164.0" font-size="11" text-anchor="start" fill="#000">swing clamp</text>
<text x="158.0" y="188.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">Fcl</text>
<rect x="88.0" y="260.0" width="22.0" height="16.0" rx="0" fill="#000" stroke="#000" stroke-width="1.5"/>
<text x="84.0" y="256.0" font-size="12" text-anchor="end" fill="#000" font-weight="bold">C1</text>
<line x1="500.0" y1="240.0" x2="434.0" y2="240.0" stroke="#c0392b" stroke-width="3" marker-end="url(#arA)"/>
<text x="440.0" y="230.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">Fr ≈ 2.4 kN</text>
<text x="440.0" y="262.0" font-size="11" text-anchor="start" fill="#000">(face mill Ø100,</text>
<text x="440.0" y="276.0" font-size="11" text-anchor="start" fill="#000">deck, §20.3)</text>
<rect x="230.0" y="152.0" width="80.0" height="16.0" rx="0" fill="#ddd" stroke="#000" stroke-width="1.5"/>
