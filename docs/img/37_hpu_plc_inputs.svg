<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>HPU – PLC inputs + analog wiring</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="10" y="10" width="1180" height="810" fill="none" stroke="#000" stroke-width="1.4"/><text x="30" y="40" font-size="18" text-anchor="start" fill="#000" font-weight="bold">1 · HPU – PLC input wiring (PNP sensors, NC stop button, 4–20 mA transmitter)</text><text x="30" y="62" font-size="12.5" text-anchor="start" fill="#333">Delta AS332T-A (X0.x, S/S common) and Siemens CPU 1215C (%Ix.y, 1M common) are wired the same way: sensor switches +24 V to the input, common = 0 V.</text><line x1="60" y1="110" x2="1140" y2="110" stroke="#b3261e" stroke-width="2.5"/><text x="64" y="104" font-size="11" text-anchor="start" fill="#b3261e">+24 V DC (L+) from -TB1 (PULS / Phoenix power supply), fuse -FC1 2 A</text><line x1="60" y1="560" x2="1140" y2="560" stroke="#0b5ea8" stroke-width="2.5"/><text x="64" y="578" font-size="11" text-anchor="start" fill="#0b5ea8">0 V (M) – connected to PE once at the power supply (PELV)</text><line x1="90" y1="110" x2="90" y2="170" stroke="#000" stroke-width="1.5"/><line x1="90" y1="170" x2="90" y2="200" stroke="#000" stroke-width="1.5"/><line x1="90" y1="200" x2="76" y2="230" stroke="#000" stroke-width="1.5"/><line x1="76" y1="228" x2="94" y2="228" stroke="#000" stroke-width="1.5"/><line x1="90" y1="230" x2="90" y2="330" stroke="#000" stroke-width="1.5"/><line x1="90" y1="230" x2="90" y2="230" stroke="#000" stroke-width="1.5"/><text x="98" y="160" font-size="11" text-anchor="start" fill="#000" font-weight="bold">-SF1</text><text x="98" y="270" font-size="9.5" text-anchor="start" fill="#000">stop NC</text><rect x="60" y="330" width="60" height="48" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="90" y="348" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">X0.0</text><text x="90" y="366" font-size="11" text-anchor="middle" fill="#0b5ea8">%I0.0</text><line x1="185" y1="110" x2="185" y2="170" stroke="#000" stroke-width="1.5"/><line x1="185" y1="170" x2="185" y2="200" stroke="#000" stroke-width="1.5"/><line x1="185" y1="200" x2="199" y2="228" stroke="#000" stroke-width="1.5"/><line x1="185" y1="230" x2="185" y2="330" stroke="#000" stroke-width="1.5"/><text x="193" y="160" font-size="11" text-anchor="start" fill="#000" font-weight="bold">-SF2</text><text x="193" y="270" font-size="9.5" text-anchor="start" fill="#000">start NO</text><rect x="155" y="330" width="60" height="48" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="185" y="348" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">X0.1</text><text x="185" y="366" font-size="11" text-anchor="middle" fill="#0b5ea8">%I0.1</text><line x1="280" y1="110" x2="280" y2="170" stroke="#000" stroke-width="1.5"/><line x1="280" y1="170" x2="280" y2="200" stroke="#000" stroke-width="1.5"/><line x1="280" y1="200" x2="294" y2="228" stroke="#000" stroke-width="1.5"/><line x1="280" y1="230" x2="280" y2="330" stroke="#000" stroke-width="1.5"/><text x="288" y="160" font-size="11" text-anchor="start" fill="#000" font-weight="bold">-KF1</text><text x="288" y="270" font-size="9.5" text-anchor="start" fill="#000">safety relay 13/14</text><rect x="250" y="330" width="60" height="48" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="280" y="348" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">X0.3</text><text x="280" y="366" font-size="11" text-anchor="middle" fill="#0b5ea8">%I0.3</text><line x1="375" y1="110" x2="375" y2="170" stroke="#000" stroke-width="1.5"/><line x1="375" y1="170" x2="375" y2="200" stroke="#000" stroke-width="1.5"/><line x1="375" y1="200" x2="389" y2="228" stroke="#000" stroke-width="1.5"/><line x1="375" y1="230" x2="375" y2="330" stroke="#000" stroke-width="1.5"/><text x="383" y="160" font-size="11" text-anchor="start" fill="#000" font-weight="bold">-QM1</text><text x="383" y="270" font-size="9.5" text-anchor="start" fill="#000">aux 13/14</text><rect x="345" y="330" width="60" height="48" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="375" y="348" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">X0.4</text><text x="375" y="366" font-size="11" text-anchor="middle" fill="#0b5ea8">%I0.4</text><line x1="470" y1="110" x2="470" y2="170" stroke="#000" stroke-width="1.5"/><line x1="470" y1="170" x2="470" y2="200" stroke="#000" stroke-width="1.5"/><line x1="470" y1="200" x2="484" y2="228" stroke="#000" stroke-width="1.5"/><line x1="470" y1="230" x2="470" y2="330" stroke="#000" stroke-width="1.5"/><text x="478" y="160" font-size="11" text-anchor="start" fill="#000" font-weight="bold">-QA1</text><text x="478" y="270" font-size="9.5" text-anchor="start" fill="#000">aux 13/14</text><rect x="440" y="330" width="60" height="48" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="470" y="348" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">X0.6</text><text x="470" y="366" font-size="11" text-anchor="middle" fill="#0b5ea8">%I0.6</text><line x1="565" y1="110" x2="565" y2="170" stroke="#000" stroke-width="1.5"/><rect x="543" y="170" width="44" height="70" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="565" y="196" font-size="10" text-anchor="middle" fill="#000" font-weight="bold">PNP</text><text x="565" y="210" font-size="9" text-anchor="middle" fill="#000">3-wire</text><line x1="587" y1="230" x2="597" y2="230" stroke="#000" stroke-width="1.5"/><line x1="597" y1="230" x2="597" y2="560" stroke="#0b5ea8" stroke-width="1"/><text x="541" y="186" font-size="8.5" text-anchor="end" fill="#000">BN</text><text x="589" y="236" font-size="8.5" text-anchor="start" fill="#000">BU</text><text x="565" y="252" font-size="8.5" text-anchor="middle" fill="#000">BK</text><line x1="565" y1="240" x2="565" y2="330" stroke="#000" stroke-width="1.5"/><text x="573" y="160" font-size="11" text-anchor="start" fill="#000" font-weight="bold">0S3</text><text x="573" y="270" font-size="9.5" text-anchor="start" fill="#000">level PNP</text><rect x="535" y="330" width="60" height="48" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="565" y="348" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">X0.9</text><text x="565" y="366" font-size="11" text-anchor="middle" fill="#0b5ea8">%I1.1</text><line x1="660" y1="110" x2="660" y2="170" stroke="#000" stroke-width="1.5"/><line x1="660" y1="170" x2="660" y2="200" stroke="#000" stroke-width="1.5"/><line x1="660" y1="200" x2="646" y2="230" stroke="#000" stroke-width="1.5"/><line x1="646" y1="228" x2="664" y2="228" stroke="#000" stroke-width="1.5"/><line x1="660" y1="230" x2="660" y2="330" stroke="#000" stroke-width="1.5"/><line x1="660" y1="230" x2="660" y2="230" stroke="#000" stroke-width="1.5"/><text x="668" y="160" font-size="11" text-anchor="start" fill="#000" font-weight="bold">0Z1</text><text x="668" y="270" font-size="9.5" text-anchor="start" fill="#000">filter NC</text><rect x="630" y="330" width="60" height="48" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="660" y="348" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">X0.10</text><text x="660" y="366" font-size="11" text-anchor="middle" fill="#0b5ea8">%I1.2</text><line x1="755" y1="110" x2="755" y2="170" stroke="#000" stroke-width="1.5"/><line x1="755" y1="170" x2="755" y2="200" stroke="#000" stroke-width="1.5"/><line x1="755" y1="200" x2="769" y2="228" stroke="#000" stroke-width="1.5"/><line x1="755" y1="230" x2="755" y2="330" stroke="#000" stroke-width="1.5"/><text x="763" y="160" font-size="11" text-anchor="start" fill="#000" font-weight="bold">CNC</text><text x="763" y="270" font-size="9.5" text-anchor="start" fill="#000">relay -KF6</text><rect x="725" y="330" width="60" height="48" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="755" y="348" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">X0.11</text><text x="755" y="366" font-size="11" text-anchor="middle" fill="#0b5ea8">%I1.3</text><rect x="55" y="320" width="790" height="160" rx="0" fill="none" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="6 4"/><text x="60" y="400" font-size="11" text-anchor="start" fill="#000">Digital inputs: Delta X0.0 … X0.15 (AS332T-A on-board, 16 DI) · Siemens %I0.0 … %I0.7, %I1.0 … %I1.5 (1215C on-board, 14 DI)</text><text x="60" y="416" font-size="11" text-anchor="start" fill="#000">Commons: Delta S/S → 0 V for PNP (sink input) · Siemens 1M → 0 V. ON ≥ 15 V, OFF ≤ 5 V (IEC 61131-2 type 1/3) – see manual.</text><text x="60" y="432" font-size="11" text-anchor="start" fill="#000">NC stop (-SF1) and NC filter switch (0Z1): wire break = signal 0 = safe state. %I0.8 does not exist: after %I0.7 comes %I1.0.</text><text x="60" y="448" font-size="11" text-anchor="start" fill="#000">Input filter: Delta 10 ms default (HWCONFIG), Siemens 6.4 ms default (device configuration) – adds to the reaction time.</text><text x="60" y="464" font-size="11" text-anchor="start" fill="#b3261e">The e-stop is NOT a PLC input for the safety function: -KF1 switches -QA1 hard-wired; X0.3 / %I0.3 is only its status.</text><text x="870" y="135" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Analog: 0B2 transmitter 0–16 MPa</text><rect x="890" y="170" width="70" height="90" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="925" y="200" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">0B2</text><text x="925" y="216" font-size="10" text-anchor="middle" fill="#000">4–20 mA</text><text x="925" y="230" font-size="10" text-anchor="middle" fill="#000">2-wire</text><line x1="925" y1="110" x2="925" y2="170" stroke="#b3261e" stroke-width="1.5"/><text x="930" y="160" font-size="9.5" text-anchor="start" fill="#000">+ (pin 1)</text><line x1="925" y1="260" x2="925" y2="330" stroke="#000" stroke-width="1.5"/><text x="930" y="290" font-size="9.5" text-anchor="start" fill="#000">− (pin 3), shielded cable</text><rect x="880" y="330" width="230" height="70" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="995" y="350" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Delta AS04AD-A ch1 → D100</text><text x="995" y="367" font-size="11" text-anchor="middle" fill="#0b5ea8" font-weight="bold">Siemens SM 1231 AI4 ch0 → %IW96</text><text x="995" y="384" font-size="9.5" text-anchor="middle" fill="#000">range set to 4–20 mA (module config)</text><line x1="995" y1="400" x2="995" y2="560" stroke="#0b5ea8" stroke-width="1.5"/><text x="880" y="430" font-size="11" text-anchor="start" fill="#000" font-weight="bold">Scaling (network 1):</text><text x="880" y="446" font-size="11" text-anchor="start" fill="#000">4 mA = 0 counts = 0 MPa</text><text x="880" y="462" font-size="11" text-anchor="start" fill="#000">20 mA = 27648 (Siemens) / 32000 (Delta)</text><text x="880" y="478" font-size="11" text-anchor="start" fill="#000" font-weight="bold">p = raw · 16 / 27648</text><text x="880" y="494" font-size="11" text-anchor="start" fill="#000">11.5 MPa → 19872 counts</text><text x="880" y="510" font-size="11" text-anchor="start" fill="#b3261e">wire break (&lt; 3.6 mA) → 32767 → AL_SENS</text><text x="880" y="526" font-size="11" text-anchor="start" fill="#000">shield on the cabinet side only (EMC)</text><text x="30" y="620" font-size="11.5" text-anchor="start" fill="#000">Why PNP: in Europe sensors are mostly PNP ('switch the plus'). A broken 0 V wire then cannot make a false 1. Delta 'T' CPUs (AS332T-A) have NPN</text><text x="30" y="637" font-size="11.5" text-anchor="start" fill="#000">transistor OUTPUTS – choose AS332P-A for PNP outputs, or use relays. Inputs of both CPUs accept sink or source wiring via the common terminal.</text><text x="30" y="662" font-size="11.5" text-anchor="start" fill="#000">Check list: every input LED lights when the sensor is actuated (I/O check, guide 37 §14); 0B2 shows 0.0 MPa with the pump off and the accumulator dumped.</text><rect x="770" y="760" width="420" height="60" fill="#fff" stroke="#000" stroke-width="1"/><line x1="770" y1="782" x2="1190" y2="782" stroke="#000" stroke-width="0.8"/><text x="778" y="776" font-size="12" font-weight="bold">HPU – PLC inputs + analog wiring</text><text x="778" y="798" font-size="10.5">24 V DC PNP (sourcing sensors, sinking inputs) · 4–20 mA 2-wire</text><text x="778" y="813" font-size="10.5" fill="#0b5ea8">Guide 37 · page 1 · EXAMPLE – check with your PLC configuration</text></svg>
