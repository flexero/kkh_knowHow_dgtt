<text x="834.0" y="230.0" font-size="11" text-anchor="end" fill="#000">gauge</text>
<text x="624.0" y="580.0" font-size="12" text-anchor="start" fill="#000">EN ISO 4413: accumulators must discharge automatically (solenoid valve NO) or be isolated safely</text>
<text x="624.0" y="599.0" font-size="12" text-anchor="start" fill="#000">when the machine is switched off; warning label on the machine; gauge must show 0 before work.</text>
<text x="624.0" y="618.0" font-size="12" text-anchor="start" fill="#000">Relief setting ≤ PS (max allowable pressure) of the vessel. The relief is a PED safety accessory.</text>
<text x="624.0" y="637.0" font-size="12" text-anchor="start" fill="#000">PED category by PS · V (N₂ = group 2): ≤ 50 bar·L SEP · 50–200 I · 200–1000 II · 1000–3000 III · &gt; 3000 IV.</text>
<text x="624.0" y="656.0" font-size="12" text-anchor="start" fill="#000">Example: 5 L × 330 bar = 1 650 bar·L → category III · 2.5 L × 330 bar = 825 bar·L → category II.</text>
<text x="30.0" y="790.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Sizing (guide 29 §12.4, guide-25 job): V0 = ΔV / [ (p0/p1)^(1/n) − (p0/p2)^(1/n) ], absolute pressures</text>
<text x="30.0" y="810.0" font-size="12" text-anchor="start" fill="#000">ΔV 0.62 L, p0 7.1, p1 7.9, p2 10.1 MPa abs, n 1.4:  0.62 / (0.927 − 0.777) = 4.2 L → 5 L bladder   (isothermal n = 1 would give 3.2 L – too small).</text>
<text x="30.0" y="828.0" font-size="12" text-anchor="start" fill="#000">A 5 L bladder then gives ΔV = 5 · 0.149 = 0.75 L usable oil (fast cycles).</text>
