<text x="30.0" y="36.0" font-size="18" text-anchor="start" fill="#000" font-weight="bold">Bladder accumulator (section) + accumulator safety and shut-off block (EN ISO 4413, PED 2014/68/EU)</text>
<text x="30.0" y="58.0" font-size="12" text-anchor="start" fill="#555">Nitrogen in the bladder is the spring; oil is stored outside the bladder. An accumulator stays charged when the pump stops – the safety block makes it safe.</text>
