<text x="380.0" y="500.0" font-size="12" text-anchor="start" fill="#000">0 = no oil, p0</text>
<text x="380.0" y="515.6" font-size="12" text-anchor="start" fill="#000">1 = gas V1 at p1</text>
<text x="380.0" y="531.2" font-size="12" text-anchor="start" fill="#000">2 = gas V2 at p2</text>
<text x="380.0" y="546.8" font-size="12" text-anchor="start" fill="#000">useful oil ΔV = V1 − V2</text>
<text x="44.0" y="690.0" font-size="12" text-anchor="start" fill="#000">Rules: p0 ≈ 0.9 · p1 (energy storage) · p2 / p0 ≤ 4 (bladder) · use n = 1.4 for cycles &lt; 1 min.</text>
<text x="44.0" y="708.0" font-size="12" text-anchor="start" fill="#000">Example: Hydac SB330 (check size list), Parker / Olaer EHV, Rexroth HAB.</text>
<text x="624.0" y="100.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">2  Safety and shut-off block (ISO 1219 symbols)</text>
