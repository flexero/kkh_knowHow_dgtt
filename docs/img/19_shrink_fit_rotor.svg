<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="Arial, Helvetica, sans-serif">
<title>Rotor sleeve shrink fit heating and calculation</title>
<rect x="0" y="0" width="1180" height="720" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000" >Rotor sleeve shrink fit (step 9): heating set-up, mounting and the temperature / interference calculation</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Example: rotor bore Ø65, interference i = 0.060 ±0.015 mm, α = 11.5·10⁻⁶ /K – the MOTOR MAKER decides the method and the maximum temperature (magnets!).</text>
<rect x="20.0" y="70.0" width="300.0" height="420.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="30.0" y="92.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >A  Heat (oven E14 or induction)</text>
<rect x="50.0" y="120.0" width="240.0" height="220.0" fill="#f2f2f2" stroke="#000" stroke-width="1.4" />
<rect x="64.0" y="134.0" width="212.0" height="170.0" fill="#fff" stroke="#000" stroke-width="1" />
<rect x="110.0" y="200.0" width="120.0" height="90.0" fill="#b3b3b3" stroke="#000" stroke-width="1.2" />
<rect x="150.0" y="200.0" width="40.0" height="90.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="170.0" y="194.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >rotor Ø148 / Ø65 × 160</text>
<line x1="230.0" y1="230.0" x2="262.0" y2="160.0" stroke="#0b6fb8" stroke-width="1.5" />
<circle cx="230.0" cy="230.0" r="3.0" fill="#0b6fb8" stroke="#000" stroke-width="1" />
<text x="200.0" y="152.0" font-size="11" text-anchor="start" font-weight="normal" fill="#0b6fb8" >thermocouple</text>
<rect x="64.0" y="314.0" width="212.0" height="18.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="170.0" y="327.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#0b6fb8" >display: 231 °C (set ≤ maker limit)</text>
<text x="30.0" y="368.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Energy</text>
<text x="30.0" y="385.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >m ≈ 17.3 kg (solid estimate)</text>
<text x="30.0" y="402.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Q = m·c·ΔT = 17.3 × 460 × 211</text>
<text x="30.0" y="419.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >   = 1.68 MJ</text>
<text x="30.0" y="436.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >oven: 2–3 h soak</text>
<text x="30.0" y="453.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >induction 5 kW (η 0.8): ≈ 7 min</text>
<text x="30.0" y="470.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >flame / hot plate: NOT allowed</text>
<rect x="330.0" y="70.0" width="330.0" height="420.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="340.0" y="92.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >B  Mount (≤ 30 s, shaft nose down in J1)</text>
<rect x="475.0" y="380.0" width="40.0" height="60.0" fill="#fff" stroke="#000" stroke-width="1" />
<rect x="435.0" y="380.0" width="120.0" height="60.0" fill="#d9d9d9" stroke="#000" stroke-width="1" />
<text x="495.0" y="455.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >front set + housing (steps 6–8)</text>
<rect x="478.0" y="300.0" width="34.0" height="80.0" fill="#fff" stroke="#000" stroke-width="1" />
<rect x="478.8" y="170.0" width="32.5" height="130.0" fill="#fff" stroke="#000" stroke-width="1" />
<rect x="479.3" y="120.0" width="31.4" height="50.0" fill="#fff" stroke="#000" stroke-width="1" />
<rect x="483.0" y="104.0" width="24.0" height="16.0" fill="#fff" stroke="#000" stroke-width="1" />
<line x1="495.0" y1="100.0" x2="495.0" y2="445.0" stroke="#000" stroke-width="0.6" stroke-dasharray="10,3,2,3"/>
<text x="517.0" y="312.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >shoulder Ø68 = stop</text>
<line x1="615.0" y1="300.0" x2="519.0" y2="300.0" stroke="#000" stroke-width="0.8" />
<polygon points="519.0,300.0 525.4,297.3 525.4,302.7" fill="#000" stroke="#000" stroke-width="0.5" />
<polygon points="481.0,120.0 509.0,120.0 505.0,100.0 485.0,100.0" fill="#fff" stroke="#0b6fb8" stroke-width="1.4" />
<text x="515.0" y="112.0" font-size="11" text-anchor="start" font-weight="normal" fill="#0b6fb8" >cone J5</text>
<rect x="421.0" y="140.0" width="41.0" height="100.0" fill="#b3b3b3" stroke="#0b6fb8" stroke-width="2.2" />
<rect x="528.0" y="140.0" width="41.0" height="100.0" fill="#b3b3b3" stroke="#0b6fb8" stroke-width="2.2" />
<text x="442.0" y="195.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#0b6fb8" >HOT</text>
<text x="548.0" y="195.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#0b6fb8" >HOT</text>
<line x1="421.0" y1="150.0" x2="395.0" y2="130.0" stroke="#0b6fb8" stroke-width="2" />
<line x1="569.0" y1="150.0" x2="595.0" y2="130.0" stroke="#0b6fb8" stroke-width="2" />
<text x="355.0" y="124.0" font-size="11" text-anchor="start" font-weight="normal" fill="#0b6fb8" >tongs J4</text>
<line x1="605.0" y1="160.0" x2="605.0" y2="280.0" stroke="#0b6fb8" stroke-width="2" />
<polygon points="605.0,280.0 602.3,273.6 607.7,273.6" fill="#0b6fb8" stroke="#0b6fb8" stroke-width="0.5" />
<text x="611.0" y="220.0" font-size="11" text-anchor="start" font-weight="normal" fill="#0b6fb8" >slide</text>
<text x="611.0" y="234.0" font-size="11" text-anchor="start" font-weight="normal" fill="#0b6fb8" >down</text>
<text x="345.0" y="478.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >hold 1 min axially, cool in air; gap at shoulder ≤ 0.05 mm</text>
<rect x="670.0" y="70.0" width="490.0" height="420.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="680.0" y="92.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >C  Calculation</text>
<text x="680.0" y="116.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >ΔT = (i + 0.0015·d) / (α·d)</text>
<text x="680.0" y="134.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >    = (0.060 + 0.0975) / (11.5·10⁻⁶ × 65) = 211 K</text>
<text x="680.0" y="152.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >T = 20 + 211 = 231 °C  (check the magnet limit!)</text>
<text x="680.0" y="186.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Minimum interference budget (µm on Ø):</text>
<rect x="690.0" y="210.0" width="10.9" height="30.0" fill="#f2f2f2" stroke="#000" stroke-width="1" />
<text x="694.0" y="266.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >torque 2 × 140 N·m: 3.4 µm</text>
<rect x="700.9" y="210.0" width="59.6" height="30.0" fill="#d9d9d9" stroke="#000" stroke-width="1" />
<text x="694.0" y="282.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >rotation 10 000 rpm: 11.0 µm</text>
<rect x="760.5" y="210.0" width="56.2" height="30.0" fill="#b3b3b3" stroke="#000" stroke-width="1" />
<text x="694.0" y="298.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >rotor 20 K warmer: 15.0 µm</text>
<rect x="816.8" y="210.0" width="19.5" height="30.0" fill="#888" stroke="#000" stroke-width="1" />
<text x="694.0" y="314.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >smoothing Rz: 5.2 µm</text>
<text x="690.0" y="200.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Σ ≈ 35 µm needed</text>
<line x1="858.8" y1="204.0" x2="858.8" y2="250.0" stroke="#0b6fb8" stroke-width="1.6" />
<text x="858.8" y="200.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#0b6fb8" >min 45</text>
<line x1="915.0" y1="204.0" x2="915.0" y2="250.0" stroke="#0b6fb8" stroke-width="1.6" />
<text x="915.0" y="200.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#0b6fb8" >nominal 60</text>
<line x1="971.2" y1="204.0" x2="971.2" y2="250.0" stroke="#0b6fb8" stroke-width="1.6" />
<text x="971.2" y="200.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#0b6fb8" >max 75</text>
<line x1="690.0" y1="250.0" x2="990.0" y2="250.0" stroke="#000" stroke-width="0.8" />
<text x="680.0" y="340.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Lamé (sleeve Ø65/Ø85, shaft bore Ø41, μ 0.15):</text>
<text x="680.0" y="358.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >p = 31.6 MPa → torque 5 030 N·m, axial 155 kN</text>
<text x="680.0" y="376.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >hoop stress sleeve bore 121 MPa, shaft bore −105 MPa</text>
<text x="680.0" y="394.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >twin fault rotor: i = 0.028 mm &lt; 35 µm → slips at speed</text>
<text x="680.0" y="412.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >(models – the motor maker gives the real minimum)</text>
<rect x="20.0" y="500.0" width="640.0" height="200.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="30.0" y="524.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Safety (risk assessment VC-ASM-RA-0201)</text>
<text x="30.0" y="546.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >• hot part 231 °C: heat gloves EN 407, face shield, apron, marked HOT cooling place</text>
<text x="30.0" y="568.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >• strong magnet: steel tools away, pinch risk between rotor and steel parts, pacemaker warning</text>
<text x="30.0" y="590.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >• induction coil: no metal jewellery; only the trained person switches it on</text>
<text x="30.0" y="612.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >• crane / tongs J4 with WLL; two people; practise the move with a COLD rotor first</text>
<text x="30.0" y="634.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >• rotor stuck half way: do NOT hammer – let it cool, oil-injection dismounting (motor maker)</text>
<text x="30.0" y="656.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >• after cooling: gap ≤ 0.05 mm, rotor OD runout, re-check the shaft seats</text>
<rect x="670.0" y="600.0" width="490.0" height="74.0" fill="#fff" stroke="#000" stroke-width="1.2" />
<line x1="670.0" y1="624.0" x2="1160.0" y2="624.0" stroke="#000" stroke-width="1" />
<text x="678.0" y="617.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >Fig. 19-6  Rotor sleeve shrink fit</text>
<text x="678.0" y="641.0" font-size="12" text-anchor="start" font-weight="bold" fill="#0b6fb8" >EXAMPLE – check the maker&#x27;s documentation</text>
<text x="678.0" y="658.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >docs/img/19_shrink_fit_rotor.svg</text>
<text x="1152.0" y="658.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000" >Digital twin – guide 19</text>
</svg>
