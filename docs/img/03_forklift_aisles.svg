<text x="1082.5" y="432.0" font-size="12" text-anchor="middle" fill="#000">Ast = 2 400</text>
<text x="1082.5" y="462.0" font-size="11" text-anchor="middle" fill="#000">bay depth: 2 × 1 200 + Ast = 4.80 m</text>
<text x="1082.5" y="478.0" font-size="11" text-anchor="middle" fill="#000">m² of floor per 2 rack rows: 4.80 × length</text>
<rect x="24.0" y="560.0" width="760.0" height="300.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="36.0" y="584.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="36.0" y="606.0" font-size="12" text-anchor="start" fill="#000">Counterbalance, pallet carried lengthwise (VDI 2198 datasheet formula):</text>
<text x="36.0" y="628.0" font-size="12" text-anchor="start" fill="#000">   Ast = Wa + √((l6 + x)² + (b12/2)²) + a</text>
<text x="36.0" y="650.0" font-size="12" text-anchor="start" fill="#000">   Wa = turning radius, x = load axle centre to fork face, l6 = load length,</text>
<text x="36.0" y="672.0" font-size="12" text-anchor="start" fill="#000">   b12 = load width, a = safety clearance 2 × 100 mm = 200 mm</text>
<text x="36.0" y="694.0" font-size="12" text-anchor="start" fill="#000">Example 1.6 t truck (example values): Wa = 1 950, x = 400 mm</text>
<text x="36.0" y="716.0" font-size="12" text-anchor="start" fill="#000">   Ast = 1.95 + √((1.2 + 0.4)² + 0.4²) + 0.2 = 1.95 + 1.649 + 0.2 = 3.80 m</text>
<text x="36.0" y="738.0" font-size="12" text-anchor="start" fill="#000">   pallet crosswise (l6 = 0.8, b12 = 1.2): 1.95 + 1.342 + 0.2 = 3.49 m</text>
<text x="36.0" y="760.0" font-size="12" text-anchor="start" fill="#000">Floor use per pallet place (5 levels, bay 2 places of 0.8 m + gaps 0.95 m each):</text>
<text x="36.0" y="782.0" font-size="12" text-anchor="start" fill="#000">   A: (1.2 + 3.80/2) × 0.95 / 5 = 0.59 m²   C: (1.2 + 1.75/2) × 0.95 / 5 = 0.39 m²</text>
<text x="36.0" y="804.0" font-size="12" text-anchor="start" fill="#000">   → VNA stores about 50 % more pallets on the same floor, but needs a guided floor</text>
<text x="36.0" y="826.0" font-size="12" text-anchor="start" fill="#000">      (flatness class per EN 15620), transfer aisles and a man-up rescue plan.</text>
<text x="36.0" y="584.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Aisle width formula and floor use</text>
