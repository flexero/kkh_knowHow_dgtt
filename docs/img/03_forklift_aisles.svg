<circle cx="1130.0" cy="733.0" r="4.0" fill="#c62828" stroke="#c62828" stroke-width="1"/>
<line x1="1030.0" y1="792.0" x2="1030.0" y2="808.0" stroke="#000" stroke-width="0.8"/>
<line x1="1050.0" y1="780.0" x2="1050.0" y2="808.0" stroke="#000" stroke-width="0.8"/>
<line x1="1130.0" y1="740.0" x2="1130.0" y2="808.0" stroke="#000" stroke-width="0.8"/>
