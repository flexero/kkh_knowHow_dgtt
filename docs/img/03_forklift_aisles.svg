<text x="1040.0" y="800.0" font-size="11" text-anchor="middle" fill="#000"></text>
<text x="1000.0" y="822.0" font-size="11" text-anchor="start" fill="#000">a = 400 (front axle → fork face)</text>
<line x1="1050.0" y1="790.0" x2="1130.0" y2="790.0" stroke="#000" stroke-width="0.9" marker-end="url(#ak)" marker-start="url(#ak)"/>
<text x="1090.0" y="786.0" font-size="11" text-anchor="middle" fill="#000">c = 500</text>
<line x1="1130.0" y1="730.0" x2="1130.0" y2="766.0" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="1138.0" y="700.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">Q</text>
<text x="1240.0" y="620.0" font-size="12" text-anchor="start" fill="#000">Tipping about the front axle:</text>
<text x="1240.0" y="642.0" font-size="12" text-anchor="start" fill="#000">Q · (c + a) = constant</text>
<text x="1240.0" y="664.0" font-size="12" text-anchor="start" fill="#000">Q' = Q · (c + a) / (c' + a)</text>
<text x="1240.0" y="686.0" font-size="12" text-anchor="start" fill="#000">Q = 1 600 kg at c = 500 mm:</text>
<text x="1240.0" y="708.0" font-size="12" text-anchor="start" fill="#000">  c' = 600 mm → Q' = 1 440 kg</text>
<text x="1240.0" y="730.0" font-size="12" text-anchor="start" fill="#000">  c' = 700 mm → Q' = 1 309 kg</text>
<text x="1240.0" y="752.0" font-size="12" text-anchor="start" fill="#000">(packed VC30 crate with high</text>
<text x="1240.0" y="774.0" font-size="12" text-anchor="start" fill="#000"> centre of mass: check c and</text>
<text x="1240.0" y="796.0" font-size="12" text-anchor="start" fill="#000"> residual capacity at height)</text>
<rect x="1116.0" y="852.0" width="470.0" height="74.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="1116.0" y1="876.0" x2="1586.0" y2="876.0" stroke="#000" stroke-width="1"/>
