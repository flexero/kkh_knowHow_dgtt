<text x="24.0" y="52.0" font-size="12" text-anchor="start" fill="#444">Ast = aisle between the load faces needed to turn 90° and put the pallet in the rack. Values are typical examples from maker datasheets (VDI 2198 sheet) – the datasheet of the truck you buy decides.</text>
