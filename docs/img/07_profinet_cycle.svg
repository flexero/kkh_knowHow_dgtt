<text x="20.0" y="500.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">2 ms × 3 = 6 ms</text>
<text x="20.0" y="516.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">(own scale 0 – 8 ms)</text>
<line x1="170.0" y1="492.0" x2="1330.0" y2="492.0" stroke="#000" stroke-width="1"/>
