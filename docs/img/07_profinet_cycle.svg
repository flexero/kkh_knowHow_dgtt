<line x1="315.0" y1="487.0" x2="315.0" y2="497.0" stroke="#000" stroke-width="1"/>
<text x="315.0" y="524.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1 ms</text>
<line x1="460.0" y1="487.0" x2="460.0" y2="497.0" stroke="#000" stroke-width="1"/>
<text x="460.0" y="524.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">2 ms</text>
