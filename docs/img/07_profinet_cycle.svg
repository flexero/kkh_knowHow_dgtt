<text x="1185.0" y="524.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">7 ms</text>
<line x1="1330.0" y1="487.0" x2="1330.0" y2="497.0" stroke="#000" stroke-width="1"/>
<text x="1330.0" y="524.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">8 ms</text>
<rect x="160.0" y="478.0" width="20.0" height="28.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1.2"/>
<rect x="450.0" y="478.0" width="20.0" height="28.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1.2"/>
<text x="474.0" y="474.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">last frame received</text>
<text x="750.0" y="474.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#0b62c4">missing</text>
<text x="1040.0" y="474.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#0b62c4">missing</text>
<line x1="460.0" y1="454.0" x2="1330.0" y2="454.0" stroke="#0b62c4" stroke-width="2" marker-end="url(#ara)"/>
<text x="1326.0" y="448.0" font-size="12" text-anchor="end" font-weight="bold" fill="#0b62c4">no frame for 6 ms → outputs to safe state, station failure</text>
<rect x="20.0" y="550.0" width="640.0" height="200.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="30.0" y="572.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">Formulas (22.1)</text>
<text x="30.0" y="596.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">send clock = 31.25 µs × SendClockFactor   (32 → 1 ms; RT 8 … 128 = 250 µs … 4 ms)</text>
<text x="30.0" y="617.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">update time = send clock × reduction ratio (1, 2, 4 … 512)</text>
<text x="30.0" y="638.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">watchdog = update time × accepted missed cycles (default 3)</text>
<text x="30.0" y="659.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">PLC-01: send clock 1 ms, ratio 2 → update 2 ms, watchdog 6 ms</text>
<text x="30.0" y="680.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">cyclic load per direction = Σ (bytes on the wire × 8) / update time</text>
<text x="30.0" y="701.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">12 devices: (9 × 88 B + 3 × 128 B) × 8 / 2 ms = 4.70 Mbit/s = 4.7 %</text>
<text x="30.0" y="722.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">MRP recovery 200 ms &gt; 6 ms → raise to 2 ms × 100 = 200 ms or use MRPD (19.3)</text>
<rect x="690.0" y="550.0" width="690.0" height="200.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="700.0" y="572.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">RT without reserved slots: worst case behind one big NRT frame per hop</text>
<rect x="710.0" y="600.0" width="400.0" height="34.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="1.2"/>
<text x="910.0" y="622.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">NRT frame 1 538 B already sending: 123 µs @ 100 Mbit/s</text>
<rect x="1110.0" y="600.0" width="60.0" height="34.0" rx="0" fill="#0b62c4" stroke="#000" stroke-width="1.2"/>
<text x="1140.0" y="622.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">RT</text>
<text x="1180.0" y="622.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">88 B: 7.0 µs</text>
<text x="710.0" y="664.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">strict priority: RT waits for at most ONE frame per switch (no preemption)</text>
<text x="710.0" y="685.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">6 hops × 123 µs = 0.74 ms extra jitter → OK for 2 ms update, not for 250 µs</text>
<text x="710.0" y="706.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">→ IRT (red phase), TSN preemption / Qbv (24), or 1 Gbit/s (12.3 µs per hop)</text>
<text x="710.0" y="727.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">office switches without priority queues: forbidden in cells</text>
<text x="20.0" y="785.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Conformance classes: CC-A RT basic · CC-B + SNMP, LLDP topology, MRP (minimum for this factory) · CC-C + IRT, MRPD · CC-D PROFINET over TSN</text>
<text x="20.0" y="805.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Frame: EtherType 0x8892, FrameID, C_SDU ≥ 40 B (IO data + IOPS/IOCS), APDU status 4 B (cycle counter, data status, transfer status)</text>
<rect x="948.0" y="810.0" width="440.0" height="78.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<line x1="948.0" y1="836.0" x2="1388.0" y2="836.0" stroke="#000" stroke-width="1"/>
<text x="956.0" y="828.0" font-size="13" text-anchor="start" font-weight="bold" fill="#0b62c4">EXAMPLE – check the maker's documentation</text>
