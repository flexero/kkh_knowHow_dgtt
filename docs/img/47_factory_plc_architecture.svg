<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">PLC architecture of the factory – every machine a Modbus TCP server, HTTP above the gateway</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><rect x="420" y="66" width="360" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="600.0" y="84.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Level 3 – MES / ERP / historian (VLAN 620)</text><text x="600.0" y="100.5" font-size="12.5" text-anchor="middle" fill="#000">HTTP REST + JSON only</text><rect x="140" y="150" width="300" height="56" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="290.0" y="168.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Gateway gw01 + standby gw02</text><text x="290.0" y="184.5" font-size="12.5" text-anchor="middle" fill="#000">Modbus TCP CLIENT · HTTP server</text><rect x="470" y="150" width="250" height="56" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="595.0" y="168.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Digital twin · andon</text><text x="595.0" y="184.5" font-size="12.5" text-anchor="middle" fill="#000">HTTP + SSE</text><rect x="750" y="150" width="300" height="56" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="900.0" y="168.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">AGV fleet manager</text><text x="900.0" y="184.5" font-size="12.5" text-anchor="middle" fill="#000">HTTP API (VDA 5050 ideas)</text><line x1="600" y1="116" x2="600" y2="150" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><line x1="290" y1="150" x2="520" y2="116" stroke="#000" stroke-width="1.2" marker-end="url(#aA)"/><text x="612" y="138" font-size="12" text-anchor="start" fill="#000">HTTP</text><text x="300" y="136" font-size="12" text-anchor="start" fill="#1f6fd1">HTTP (events, commands)</text><rect x="30" y="236" width="1140" height="34" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="600" y="258" font-size="13" text-anchor="middle" fill="#000">Managed switches · machine VLANs 641 soft · 642 heat treatment · 643 grinding · 644 QC · 645 assembly · Modbus TCP port 502, poll 100 ms – 10 s</text><line x1="290" y1="206" x2="290" y2="236" stroke="#000" stroke-width="1.2" marker-end="url(#aA)"/><line x1="140" y1="270" x2="140" y2="300" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="30" y="300" width="220" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="140.0" y="318.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Soft machining (641)</text><text x="140.0" y="334.5" font-size="12.5" text-anchor="middle" fill="#000">CNC lathes, MC, rolling:</text><text x="140.0" y="351.0" font-size="12.5" text-anchor="middle" fill="#000">maker's CNC PLC</text><text x="140.0" y="367.5" font-size="12.5" text-anchor="middle" fill="#000">map V1.1 by the maker</text><text x="140.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#000">BS-STR press: OUR PLC</text><text x="140.0" y="400.5" font-size="12.5" text-anchor="middle" fill="#000">(program 3)</text><rect x="50" y="486" width="180" height="46" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="140" y="505" font-size="12" text-anchor="middle" font-weight="700" fill="#000">safety relay / F-CPU</text><text x="140" y="522" font-size="11" text-anchor="middle" fill="#000">hard-wired, NOT on the network</text><line x1="140" y1="450" x2="140" y2="486" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="370" y1="270" x2="370" y2="300" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="260" y="300" width="220" height="150" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="370.0" y="318.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Heat treatment (642)</text><text x="370.0" y="334.5" font-size="12.5" text-anchor="middle" fill="#000">BS-IND / LG-IND:</text><text x="370.0" y="351.0" font-size="12.5" text-anchor="middle" fill="#000">S7-1500F or Delta AS</text><text x="370.0" y="367.5" font-size="12.5" text-anchor="middle" fill="#000">+ safety controller</text><text x="370.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#000">(program 2)</text><text x="370.0" y="400.5" font-size="12.5" text-anchor="middle" fill="#000">HT-TMP / HT-CAR: maker</text><rect x="280" y="486" width="180" height="46" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="370" y="505" font-size="12" text-anchor="middle" font-weight="700" fill="#000">safety relay / F-CPU</text><text x="370" y="522" font-size="11" text-anchor="middle" fill="#000">hard-wired, NOT on the network</text><line x1="370" y1="450" x2="370" y2="486" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="600" y1="270" x2="600" y2="300" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="490" y="300" width="220" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="600.0" y="318.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Grinding room (643)</text><text x="600.0" y="334.5" font-size="12.5" text-anchor="middle" fill="#000">CNC grinders: maker PLC</text><text x="600.0" y="351.0" font-size="12.5" text-anchor="middle" fill="#000">BS-TGR / BN-ITG:</text><text x="600.0" y="367.5" font-size="12.5" text-anchor="middle" fill="#000">+ OUR cell PLC</text><text x="600.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#000">loader, chiller, mist</text><text x="600.0" y="400.5" font-size="12.5" text-anchor="middle" fill="#000">(program 4)</text><rect x="510" y="486" width="180" height="46" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="600" y="505" font-size="12" text-anchor="middle" font-weight="700" fill="#000">safety relay / F-CPU</text><text x="600" y="522" font-size="11" text-anchor="middle" fill="#000">hard-wired, NOT on the network</text><line x1="600" y1="450" x2="600" y2="486" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="270" x2="830" y2="300" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="720" y="300" width="220" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="830.0" y="318.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Metrology (644)</text><text x="830.0" y="334.5" font-size="12.5" text-anchor="middle" fill="#000">lead / rail benches:</text><text x="830.0" y="351.0" font-size="12.5" text-anchor="middle" fill="#000">OUR PLC + PC software</text><text x="830.0" y="367.5" font-size="12.5" text-anchor="middle" fill="#000">QC-MAT force stand</text><text x="830.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#000">(program 5 style)</text><text x="830.0" y="400.5" font-size="12.5" text-anchor="middle" fill="#000"></text><rect x="740" y="486" width="180" height="46" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="830" y="505" font-size="12" text-anchor="middle" font-weight="700" fill="#000">safety relay / F-CPU</text><text x="830" y="522" font-size="11" text-anchor="middle" fill="#000">hard-wired, NOT on the network</text><line x1="830" y1="450" x2="830" y2="486" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="1060" y1="270" x2="1060" y2="300" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="950" y="300" width="220" height="150" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="1060.0" y="318.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">Assembly (645)</text><text x="1060.0" y="334.5" font-size="12.5" text-anchor="middle" fill="#000">AS-BSA torque stand</text><text x="1060.0" y="351.0" font-size="12.5" text-anchor="middle" fill="#000">(program 5)</text><text x="1060.0" y="367.5" font-size="12.5" text-anchor="middle" fill="#000">AS-RUN run-in + AGV port</text><text x="1060.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#000">(program 6)</text><text x="1060.0" y="400.5" font-size="12.5" text-anchor="middle" fill="#000">benches: OUR PLC</text><rect x="970" y="486" width="180" height="46" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1060" y="505" font-size="12" text-anchor="middle" font-weight="700" fill="#000">safety relay / F-CPU</text><text x="1060" y="522" font-size="11" text-anchor="middle" fill="#000">hard-wired, NOT on the network</text><line x1="1060" y1="450" x2="1060" y2="486" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/><text x="30" y="570" font-size="15" text-anchor="start" font-weight="700" fill="#000">Rules</text><text x="30" y="596" font-size="13" text-anchor="start" fill="#000">1  Every machine offers a Modbus TCP server with the register map V1.1 (holding registers 0 – 226, REAL ABCD) – our PLCs and the makers' PLCs.</text><text x="30" y="620" font-size="13" text-anchor="start" fill="#000">2  Only the gateway talks Modbus to the machines; everything above talks HTTP. No OPC UA, no MQTT, no vendor cloud.</text><text x="30" y="644" font-size="13" text-anchor="start" fill="#000">3  One standard interface FB in every PLC: status word, counters, heartbeat, toggle-bit order handshake (program 1 = template).</text><text x="30" y="668" font-size="13" text-anchor="start" fill="#000">4  Our PLC family: Delta AS300 (AS332T-A) OR Siemens S7-1200 (1215C) – one family per plant; S7-1500F for the induction lines.</text><text x="30" y="692" font-size="13" text-anchor="start" fill="#000">5  Safety functions (e-stop, guards, STO, generator HV) are hard-wired to the safety relay / F-CPU – the PLC program only reads the status.</text><text x="30" y="716" font-size="13" text-anchor="start" fill="#000">6  73 machines, about 38 with our PLC, the rest with the maker's control – the map is part of every purchase specification (guide 43 §8.6).</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>