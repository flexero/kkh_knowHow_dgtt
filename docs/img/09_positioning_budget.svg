<text x="766.0" y="500.0" font-size="11" text-anchor="start" fill="#c62828">typical HMC pallet-change spec ±0.01 mm (example)</text>
<rect x="24.0" y="790.0" width="800.0" height="190.0" rx="0" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="36.0" y="812.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">How to use the budget</text>
<text x="36.0" y="834.0" font-size="11" text-anchor="start" fill="#000">• Capture: use WORST CASE (collision / crash question). Reduce the biggest term first (backlash 0.42 → mechanical index</text>
<text x="36.0" y="856.0" font-size="11" text-anchor="start" fill="#000">  or measured split 0.27 mm). A floor-mounted station (0.50) alone would push the sum to 1.21 mm &gt; ±1 → not allowed.</text>
<text x="36.0" y="878.0" font-size="11" text-anchor="start" fill="#000">• Final position: RSS is the realistic scatter, worst case the guarantee. Tilt is extra: a 0.02 mm gap under one module</text>
<text x="36.0" y="900.0" font-size="11" text-anchor="start" fill="#000">  (pitch 400) tilts the pallet 0.05 mm/m → 0.015 mm at 300 mm fixture height, 0.03 mm at 600 mm → seating check needed.</text>
<text x="36.0" y="922.0" font-size="11" text-anchor="start" fill="#000">• Arm deflection 0.055 mm is vertical and the same each change (taught at commissioning) – not in the horizontal chain.</text>
<text x="36.0" y="944.0" font-size="11" text-anchor="start" fill="#000">• Verify: probe a reference bore after 20 changes (§5.8) and measure backlash at r (§5.7 step 6).</text>
<rect x="848.0" y="896.0" width="540.0" height="92.0" rx="0" stroke="#000" stroke-width="1.5" fill="#fff"/>
<line x1="848.0" y1="922.0" x2="1388.0" y2="922.0" stroke="#000" stroke-width="1"/>
