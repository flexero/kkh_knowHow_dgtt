<text x="20.0" y="600.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Load % = effective time ÷ (takt × OEE) at 300 units/day. Three groups (FINAL, VMC, ASSY) are above 90 %: near-bottlenecks, the bottleneck moves</text>
<text x="20.0" y="618.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">with the mix. Design capacity (ideal, no losses) = 3600 ÷ 209 s = 17.2 units/h (twin KPI). Twin 24 h run: 14.4 units/h.</text>
<text x="20.0" y="636.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555">Values: guide 13 §5.3 (verified with Python). Single series – the title and axis name it; accent = load ≥ 90 %. Growth case 450/day: 9 groups need one more machine (§5.3).</text>
