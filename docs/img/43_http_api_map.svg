<text x="76" y="530" font-size="11" text-anchor="start" font-weight="normal" fill="#000">api, health</text><rect x="254" y="220" width="222" height="194" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="264" y="242" font-size="12" text-anchor="start" font-weight="bold" fill="#000">MES  /mes</text><line x1="600" y1="186" x2="365" y2="220" stroke="#000" stroke-width="1.2"/><text x="264" y="266" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="306" y="266" font-size="11" text-anchor="start" font-weight="normal" fill="#000">workorders</text><text x="264" y="288" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">POST</text><text x="306" y="288" font-size="11" text-anchor="start" font-weight="normal" fill="#000">workorders</text><text x="264" y="310" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="306" y="310" font-size="11" text-anchor="start" font-weight="normal" fill="#000">workorders/{id}</text><text x="264" y="332" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">POST</text><text x="306" y="332" font-size="11" text-anchor="start" font-weight="normal" fill="#000">workorders/{id}/release</text><text x="264" y="354" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="306" y="354" font-size="11" text-anchor="start" font-weight="normal" fill="#000">dispatch?machine=</text><text x="264" y="376" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">POST</text><text x="306" y="376" font-size="11" text-anchor="start" font-weight="normal" fill="#000">confirmations</text><text x="264" y="398" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="306" y="398" font-size="11" text-anchor="start" font-weight="normal" fill="#000">trace?serial=</text><rect x="484" y="220" width="222" height="150" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="494" y="242" font-size="12" text-anchor="start" font-weight="bold" fill="#000">ERP  /erp</text><line x1="600" y1="186" x2="595" y2="220" stroke="#000" stroke-width="1.2"/><text x="494" y="266" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="536" y="266" font-size="11" text-anchor="start" font-weight="normal" fill="#000">salesorders</text><text x="494" y="288" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">POST</text><text x="536" y="288" font-size="11" text-anchor="start" font-weight="normal" fill="#000">salesorders</text><text x="494" y="310" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">POST</text><text x="536" y="310" font-size="11" text-anchor="start" font-weight="normal" fill="#000">productionorders/{id}/release</text><text x="494" y="332" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">POST</text><text x="536" y="332" font-size="11" text-anchor="start" font-weight="normal" fill="#000">goodsmovements</text><text x="494" y="354" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="536" y="354" font-size="11" text-anchor="start" font-weight="normal" fill="#000">stock?material=</text><rect x="714" y="220" width="222" height="128" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="724" y="242" font-size="12" text-anchor="start" font-weight="bold" fill="#000">AGV fleet  /agv</text><line x1="600" y1="186" x2="825" y2="220" stroke="#000" stroke-width="1.2"/><text x="724" y="266" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">POST</text><text x="766" y="266" font-size="11" text-anchor="start" font-weight="normal" fill="#000">transportorders</text><text x="724" y="288" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="766" y="288" font-size="11" text-anchor="start" font-weight="normal" fill="#000">transportorders</text><text x="724" y="310" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="766" y="310" font-size="11" text-anchor="start" font-weight="normal" fill="#000">transportorders/{id}</text><text x="724" y="332" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="766" y="332" font-size="11" text-anchor="start" font-weight="normal" fill="#000">vehicles</text><rect x="944" y="220" width="222" height="84" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="954" y="242" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Label printer  /printer</text><line x1="600" y1="186" x2="1055" y2="220" stroke="#000" stroke-width="1.2"/><text x="954" y="266" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">POST</text><text x="996" y="266" font-size="11" text-anchor="start" font-weight="normal" fill="#000">jobs</text><text x="954" y="288" font-size="11" text-anchor="start" font-weight="bold" fill="#000">GET</text><text x="996" y="288" font-size="11" text-anchor="start" font-weight="normal" fill="#000">jobs/{id}</text><rect x="24" y="570" width="800" height="160" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="592" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Status codes used</text><text x="36" y="616" font-size="11" text-anchor="start" font-weight="normal" fill="#000">200 OK · 201 Created · 400 bad request · 401 / 403 no / wrong key · 404 unknown id · 405 method</text><text x="36" y="640" font-size="11" text-anchor="start" font-weight="normal" fill="#000">409 conflict (state does not allow it, gateway not running) · 422 business rule failed (e.g. handshake result ≠ 0)</text><text x="36" y="664" font-size="11" text-anchor="start" font-weight="normal" fill="#000">429 too many requests · 500 internal error · 503 not available (maintenance) – body always JSON</text><text x="36" y="688" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Error body: {"type": "…", "title": "wrong state", "status": 409, "detail": "WO-00003 is 'running'"}</text><text x="36" y="712" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Write = POST with Idempotency-Key: &lt;uuid&gt;; repeat after a time-out → same answer, "replay": true</text><text x="850" y="600" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Live push without MQTT:</text><text x="850" y="618" font-size="11" text-anchor="start" font-weight="normal" fill="#000">SSE /stream (1 s) or long poll /events</text><text x="850" y="636" font-size="11" text-anchor="start" font-weight="normal" fill="#000">AGV: VDA 5050 ideas mapped to REST</text><text x="850" y="654" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Printer: HTTP job → print server → printer</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">HTTP API map</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-08  ·  guide 43 §10</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
