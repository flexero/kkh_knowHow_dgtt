<title>Cutter radius compensation G41 / G42 – outside contour 140 × 100 R10, end mill Ø16 (T2, D2)</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1100" height="720" fill="#ffffff"/>
<rect x="6" y="6" width="1088" height="708" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">Cutter radius compensation G41 / G42 – outside contour 140 × 100 R10, end mill Ø16 (T2, D2)</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#000">Top view (X right, Y up). Programmed path = part edge; the control adds the tool radius from register D2.</text>
<rect x="90.0" y="220.0" width="320.0" height="240.0" rx="0.0" fill="none" stroke="#000" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="94.0" y="234.0" font-size="11" text-anchor="start" fill="#000">raw stock 160 × 120</text>
<rect x="110.0" y="240.0" width="280.0" height="200.0" rx="20.0" fill="#e6e6e6" stroke="#000" stroke-width="2"/>
<text x="250.0" y="332.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">PART</text>
<text x="250.0" y="350.0" font-size="11" text-anchor="middle" fill="#000">programmed contour = part edge</text>
<text x="250.0" y="366.0" font-size="11" text-anchor="middle" fill="#000">140 × 100, corners R10</text>
<rect x="94.0" y="224.0" width="312.0" height="232.0" rx="36.0" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 4"/>
<line x1="430.0" y1="220.0" x2="406.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arA)"/>
<line x1="406.0" y1="280.0" x2="430.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arA)"/>
<circle cx="430.0" cy="220.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="436.0" y="216.0" font-size="11" text-anchor="start" fill="#c0392b">start X90 Y60</text>
<text x="436.0" y="324.0" font-size="11" text-anchor="start" fill="#c0392b">G40 X90 Y10</text>
<text x="436.0" y="246.0" font-size="11" text-anchor="start" fill="#c0392b">N40 G41 D2: comp.</text>
<text x="436.0" y="260.0" font-size="11" text-anchor="start" fill="#c0392b">switches on in a line</text>
<line x1="406.0" y1="320.0" x2="406.0" y2="360.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arA)"/>
<line x1="270.0" y1="456.0" x2="230.0" y2="456.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arA)"/>
<line x1="94.0" y1="360.0" x2="94.0" y2="320.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arA)"/>
<line x1="230.0" y1="224.0" x2="270.0" y2="224.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arA)"/>
<circle cx="406.0" cy="380.0" r="16.0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<circle cx="406.0" cy="380.0" r="2.5" fill="#000" stroke="#000" stroke-width="1.5"/>
<path d="M416.0,374.0 A11,11 0 1,1 412.0,390.0" fill="none" stroke="#000" stroke-width="1" marker-end="url(#ar)"/>
