<circle cx="250.0" cy="456.0" r="2.5" fill="#000" stroke="#000" stroke-width="1.5"/>
<path d="M260.0,450.0 A11,11 0 1,1 256.0,466.0" fill="none" stroke="#000" stroke-width="1" marker-end="url(#ar)"/>
<text x="430.0" y="384.0" font-size="11" text-anchor="start" fill="#000">tool Ø16, M3 (clockwise)</text>
<text x="430.0" y="398.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">tool LEFT of path = G41</text>
<text x="430.0" y="412.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">= climb milling</text>
<line x1="370.0" y1="420.0" x2="395.5" y2="445.5" stroke="#000" stroke-width="1" marker-end="url(#ar)"/>
<circle cx="370.0" cy="420.0" r="2.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<text x="403.5" y="465.5" font-size="11" text-anchor="start" fill="#000">tool centre arc R18 = 10 + 8</text>
<line x1="390.0" y1="300.0" x2="406.0" y2="300.0" stroke="#000" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="410.0" y="294.0" font-size="11" text-anchor="start" fill="#000">R = 8 (D2)</text>
<text x="94.0" y="190.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">tool centre path (dashed) = contour + R</text>
<text x="94.0" y="205.0" font-size="11" text-anchor="start" fill="#c0392b">arrows = feed direction (clockwise)</text>
<rect x="40.0" y="560.0" width="520.0" height="96.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="48.0" y="578.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Size control with the wear offset (worked example §14.6 / §18.6)</text>
<text x="48.0" y="597.0" font-size="12" text-anchor="start" fill="#000">D2 = 8.000: first part 140.056 (tool bends away, 10.7)</text>
<text x="48.0" y="614.0" font-size="12" text-anchor="start" fill="#000">D2 wear −0.028 -&gt; effective R 7.972 -&gt; part 140.056 − 2 · 0.028 = 140.000</text>
<text x="48.0" y="631.0" font-size="12" text-anchor="start" fill="#000">Rule: correct the OFFSET, not the program (Step 7.7)</text>
<rect x="600.0" y="70.0" width="485.0" height="330.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="610.0" y="90.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Fanuc program (part-edge programming)</text>
<text x="612" y="112" font-size="12.5" font-family="Courier New, monospace" fill="#000">N10 G0 G90 G54 X90. Y60. S2984 M3</text>
<text x="612" y="131" font-size="12.5" font-family="Courier New, monospace" fill="#000">N20 G43 H2 Z50. M8</text>
<text x="612" y="150" font-size="12.5" font-family="Courier New, monospace" fill="#000">N30 Z-4.</text>
<text x="612" y="169" font-size="12.5" font-family="Courier New, monospace" fill="#000">N40 G1 G41 D2 X70. Y40. F955.</text>
<text x="612" y="188" font-size="12.5" font-family="Courier New, monospace" fill="#000">N50 Y-40.</text>
<text x="612" y="207" font-size="12.5" font-family="Courier New, monospace" fill="#000">N60 G2 X60. Y-50. R10.</text>
<text x="612" y="226" font-size="12.5" font-family="Courier New, monospace" fill="#000">N70 G1 X-60.</text>
<text x="612" y="245" font-size="12.5" font-family="Courier New, monospace" fill="#000">N80 G2 X-70. Y-40. R10.</text>
<text x="612" y="264" font-size="12.5" font-family="Courier New, monospace" fill="#000">N90 G1 Y40.</text>
<text x="612" y="283" font-size="12.5" font-family="Courier New, monospace" fill="#000">N100 G2 X-60. Y50. R10.</text>
<text x="612" y="302" font-size="12.5" font-family="Courier New, monospace" fill="#000">N110 G1 X60.</text>
<text x="612" y="321" font-size="12.5" font-family="Courier New, monospace" fill="#000">N120 G2 X70. Y40. R10.</text>
<text x="612" y="340" font-size="12.5" font-family="Courier New, monospace" fill="#000">N130 G1 Y30.  (overlap)</text>
<text x="612" y="359" font-size="12.5" font-family="Courier New, monospace" fill="#000">N140 G40 X90. Y10.</text>
<text x="612" y="378" font-size="12.5" font-family="Courier New, monospace" fill="#000">N150 G0 Z50.</text>
<rect x="600.0" y="410.0" width="485.0" height="196.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="608.0" y="428.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Rules</text>
<text x="608.0" y="447.0" font-size="12" text-anchor="start" fill="#000">G41 = tool left of the path, G42 = right, G40 = off</text>
<text x="608.0" y="464.0" font-size="12" text-anchor="start" fill="#000">M3 + G41 = climb; outside contour clockwise, pocket CCW</text>
<text x="608.0" y="481.0" font-size="12" text-anchor="start" fill="#000">Switch on/off only in a G0/G1 line, length ≥ tool R</text>
<text x="608.0" y="498.0" font-size="12" text-anchor="start" fill="#000">Inside corner radius ≥ tool radius, else alarm/gouge</text>
<text x="608.0" y="515.0" font-size="12" text-anchor="start" fill="#000">Siemens: G41/G42 + D1; NORM/KONT approach</text>
<text x="608.0" y="532.0" font-size="12" text-anchor="start" fill="#000">CAM 'wear mode': CAM writes the tool centre path,</text>
<text x="608.0" y="549.0" font-size="12" text-anchor="start" fill="#000">D holds only the wear (e.g. −0.028)</text>
<text x="608.0" y="566.0" font-size="12" text-anchor="start" fill="#000">Twin simulator: G41/G42 only warned (not simulated)</text>
<rect x="656.0" y="654.0" width="430.0" height="52.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<line x1="656.0" y1="680.0" x2="1086.0" y2="680.0" stroke="#000" stroke-width="1"/>
<text x="664.0" y="672.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">EXAMPLE – check the maker's documentation</text>
<text x="664.0" y="698.0" font-size="12" text-anchor="start" fill="#000">Guide 08 – CNC / G-code · 08_cutter_compensation</text>
</svg>