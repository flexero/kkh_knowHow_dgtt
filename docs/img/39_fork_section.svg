<text x="24.0" y="765.0" font-size="12" text-anchor="start" fill="#000">Overlap o = L − s_mid = 1 000 − 675 = 325 mm (≥ L/4). Roller spacing in the overlap e = 325 − 2 × 12.5 = 300 mm.</text>
<text x="24.0" y="785.0" font-size="12" text-anchor="start" fill="#000">Shorter stages or longer stroke → shorter overlap → larger roller loads and more tilt from play (§8).</text>
