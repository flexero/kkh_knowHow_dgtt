<text x="40.0" y="808.0" font-size="12" text-anchor="start" fill="#111">mean real 285.6 · mean twin 288.2 · difference d = real − twin: mean −2.6, s_d = 8.67, SE = 2.74</text>
<text x="40.0" y="828.0" font-size="12" text-anchor="start" fill="#111">paired t = −2.6 / 2.74 = −0.95;  |t| &lt; t(0.975; 9) = 2.262  → no significant bias;  95 % CI of d: −8.8 … +3.6 (−0.9 % of output)</text>
