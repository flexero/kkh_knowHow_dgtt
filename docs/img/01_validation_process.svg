<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">01 – Verification and validation (V&amp;V) of the digital twin – process, tests and worked numbers</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" fill="#444">After Sargent's model of the simulation life cycle and VDI 3633. Verification = the model is built right. Validation = it is the right model for the decision.</text>
