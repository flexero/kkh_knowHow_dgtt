<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#000">Order to cash – from the customer enquiry to the payment</text>
<line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/>
<rect x="30" y="110" width="200" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="130.0" y="151.9" font-size="14" text-anchor="middle" font-weight="700" fill="#000">Enquiry</text>
<text x="130.0" y="169.9" font-size="14" text-anchor="middle" fill="#000">customer HTTP API</text>
<text x="130.0" y="187.9" font-size="14" text-anchor="middle" fill="#000">or e-mail</text>
<line x1="230" y1="165" x2="260" y2="165" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="262" y="110" width="200" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="362.0" y="151.9" font-size="14" text-anchor="middle" font-weight="700" fill="#000">Configurator</text>
<text x="362.0" y="169.9" font-size="14" text-anchor="middle" fill="#000">d, lead, length,</text>
<text x="362.0" y="187.9" font-size="14" text-anchor="middle" fill="#000">grade, preload → code</text>
<line x1="462" y1="165" x2="492" y2="165" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="494" y="110" width="200" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="594.0" y="151.9" font-size="14" text-anchor="middle" font-weight="700" fill="#000">Quotation QT</text>
<text x="594.0" y="169.9" font-size="14" text-anchor="middle" fill="#000">price × price group</text>
<text x="594.0" y="187.9" font-size="14" text-anchor="middle" fill="#000">valid 30 days</text>
<line x1="694" y1="165" x2="724" y2="165" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="726" y="110" width="200" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="826.0" y="151.9" font-size="14" text-anchor="middle" font-weight="700" fill="#000">Sales order SO</text>
<text x="826.0" y="169.9" font-size="14" text-anchor="middle" fill="#000">accept / order</text>
<text x="826.0" y="187.9" font-size="14" text-anchor="middle" fill="#000">credit check</text>
<line x1="926" y1="165" x2="956" y2="165" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="958" y="110" width="200" height="110" rx="6" fill="#fff" stroke="#1f6fd1" stroke-width="2.4"/>
<text x="1058.0" y="151.9" font-size="14" text-anchor="middle" font-weight="700" fill="#1f6fd1">ATP / CTP</text>
<text x="1058.0" y="169.9" font-size="14" text-anchor="middle" fill="#000">stock + MPS, else</text>
<text x="1058.0" y="187.9" font-size="14" text-anchor="middle" fill="#000">free BS-TGR minutes</text>
<rect x="30" y="340" width="200" height="110" rx="6" fill="#fff" stroke="#1f6fd1" stroke-width="2.4"/>
<text x="130.0" y="381.9" font-size="14" text-anchor="middle" font-weight="700" fill="#1f6fd1">Confirmation</text>
<text x="130.0" y="399.9" font-size="14" text-anchor="middle" fill="#000">date per line</text>
<text x="130.0" y="417.9" font-size="14" text-anchor="middle" fill="#000">to the customer (HTTP)</text>
<line x1="230" y1="395" x2="260" y2="395" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="262" y="340" width="200" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="362.0" y="381.9" font-size="14" text-anchor="middle" font-weight="700" fill="#000">Production</text>
<text x="362.0" y="399.9" font-size="14" text-anchor="middle" fill="#000">MRP → production</text>
<text x="362.0" y="417.9" font-size="14" text-anchor="middle" fill="#000">order → MES</text>
<line x1="462" y1="395" x2="492" y2="395" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="494" y="340" width="200" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="594.0" y="381.9" font-size="14" text-anchor="middle" font-weight="700" fill="#000">Delivery DN</text>
<text x="594.0" y="399.9" font-size="14" text-anchor="middle" fill="#000">goods issue FG</text>
<text x="594.0" y="417.9" font-size="14" text-anchor="middle" fill="#000">label SSCC</text>
<line x1="694" y1="395" x2="724" y2="395" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="726" y="340" width="200" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="826.0" y="381.9" font-size="14" text-anchor="middle" font-weight="700" fill="#000">Invoice INV</text>
<text x="826.0" y="399.9" font-size="14" text-anchor="middle" fill="#000">net + 19 % VAT</text>
<text x="826.0" y="417.9" font-size="14" text-anchor="middle" fill="#000">due = terms</text>
<line x1="926" y1="395" x2="956" y2="395" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="958" y="340" width="200" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="1058.0" y="381.9" font-size="14" text-anchor="middle" font-weight="700" fill="#000">Payment</text>
<text x="1058.0" y="399.9" font-size="14" text-anchor="middle" fill="#000">bank file</text>
<text x="1058.0" y="417.9" font-size="14" text-anchor="middle" fill="#000">open item closed</text>
<path d="M 1060,220 L 1060,280 L 130,280 L 130,338" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#aK)"/>
<rect x="30" y="520" width="560" height="200" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="38.0" y="577.8" font-size="15" text-anchor="start" font-weight="700" fill="#000">Example SO for C-1001: 40 × FABS-3210-1000-C5</text>
<text x="38.0" y="596.8" font-size="15" text-anchor="start" fill="#000">list price 640 € × price group OEM-1 0.92 = 588.80 €</text>
<text x="38.0" y="615.8" font-size="15" text-anchor="start" fill="#000">value 23 552 € net · VAT 19 % 4 474.88 € · gross 28 026.88 €</text>
<text x="38.0" y="634.8" font-size="15" text-anchor="start" fill="#000">ATP from stock → promise = next working day + 1</text>
<text x="38.0" y="653.8" font-size="15" text-anchor="start" fill="#000">terms 60 days → invoice due 60 calendar days later</text>
<text x="38.0" y="672.8" font-size="15" text-anchor="start" fill="#000">on time if delivered ≤ confirmed date (OTD KPI)</text>
<rect x="620" y="520" width="550" height="200" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="628.0" y="577.8" font-size="15" text-anchor="start" font-weight="700" fill="#000">HTTP endpoints (all POST with Idempotency-Key)</text>
<text x="628.0" y="596.8" font-size="15" text-anchor="start" fill="#000">POST /api/bsf/erp/quotations · /quotations/{id}/accept</text>
<text x="628.0" y="615.8" font-size="15" text-anchor="start" fill="#000">POST /api/bsf/erp/salesorders · /salesorders/{id}/confirm</text>
<text x="628.0" y="634.8" font-size="15" text-anchor="start" fill="#000">POST /salesorders/{id}/deliver · /salesorders/{id}/invoice</text>
<text x="628.0" y="653.8" font-size="15" text-anchor="start" fill="#000">POST /api/bsf/erp/invoices/{id}/pay</text>
<text x="628.0" y="672.8" font-size="15" text-anchor="start" fill="#000">errors: 400 / 404 / 409 / 422 problem+json</text>
<rect x="770" y="766" width="406" height="48" fill="#fff" stroke="#000" stroke-width="1.4"/><line x1="770" y1="790" x2="1176" y2="790" stroke="#000" stroke-width="1"/>
<text x="778" y="783" font-size="12" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your ERP team</text>
<text x="778" y="807" font-size="11" fill="#000">Ball screw + guide factory · item 7 ERP · guide 46 · 46_order_to_cash.svg</text></svg>