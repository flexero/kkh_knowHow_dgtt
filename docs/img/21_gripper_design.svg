<text x="743" y="221" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">N</text>
<line x1="737" y1="377" x2="709" y2="349" stroke="#000" stroke-width="1.5" marker-end="url(#ek)"/>
<text x="743" y="387" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">N</text>
<line x1="854" y1="300" x2="798" y2="300" stroke="#1f6fd1" stroke-width="2.4" marker-end="url(#ea)"/>
<text x="826" y="292" font-size="12" text-anchor="middle" fill="#1f6fd1" font-weight="bold">F_G</text>
<path d="M586.9547981021892,279 A30,30 0 0 1 586.9547981021892,321" stroke="#1f6fd1" stroke-width="1.3" fill="none"/>
<text x="602" y="305" font-size="13" text-anchor="start" fill="#1f6fd1" font-weight="bold">α</text>
<text x="540" y="420" font-size="11.5" text-anchor="start" fill="#000">each jaw touches on 2 lines:</text>
<text x="540" y="435.5" font-size="11.5" text-anchor="start" fill="#000">N = F_G / (2 · sin(α/2))</text>
<text x="540" y="451.1" font-size="11.5" text-anchor="start" fill="#000">friction per jaw = 2 · μ · N = μ · F_G / sin(α/2)</text>
<text x="540" y="466.6" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">μ' = μ / sin(α/2) = 0.1 / 0.707 = 0.141</text>
<text x="24" y="530" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Gripper parts – catalogue examples (buy list 24.4, check datasheets)</text>
<rect x="24" y="538" width="524" height="20" rx="0" stroke="#000" stroke-width="0.9" fill="#dcdcdc"/>
<text x="28" y="552" font-size="11" text-anchor="start" fill="#000" font-weight="bold">Pos</text>
<text x="62" y="552" font-size="11" text-anchor="start" fill="#000" font-weight="bold">Part</text>
<text x="292" y="552" font-size="11" text-anchor="start" fill="#000" font-weight="bold">Example maker – model</text>
<rect x="24" y="558" width="524" height="20" rx="0" stroke="#000" stroke-width="0.5" fill="#fff"/>
<text x="28" y="572" font-size="11" text-anchor="start" fill="#000">1</text>
<text x="62" y="572" font-size="11" text-anchor="start" fill="#000">Gripper 2-jaw (or 3-jaw)</text>
<text x="292" y="572" font-size="11" text-anchor="start" fill="#000">SCHUNK PGN-plus-P · Zimmer GPP5000</text>
<rect x="24" y="578" width="524" height="20" rx="0" stroke="#000" stroke-width="0.5" fill="#f7f7f7"/>
<text x="28" y="592" font-size="11" text-anchor="start" fill="#000">2</text>
<text x="62" y="592" font-size="11" text-anchor="start" fill="#000">Fingers + V-inserts, 2 sets</text>
<text x="292" y="592" font-size="11" text-anchor="start" fill="#000">in-house (hardened steel, POM)</text>
<rect x="24" y="598" width="524" height="20" rx="0" stroke="#000" stroke-width="0.5" fill="#fff"/>
<text x="28" y="612" font-size="11" text-anchor="start" fill="#000">3</text>
<text x="62" y="612" font-size="11" text-anchor="start" fill="#000">Adapter plate ISO 9409-1</text>
<text x="292" y="612" font-size="11" text-anchor="start" fill="#000">in-house</text>
<rect x="24" y="618" width="524" height="20" rx="0" stroke="#000" stroke-width="0.5" fill="#f7f7f7"/>
<text x="28" y="632" font-size="11" text-anchor="start" fill="#000">4</text>
<text x="62" y="632" font-size="11" text-anchor="start" fill="#000">Jaw / part sensors</text>
<text x="292" y="632" font-size="11" text-anchor="start" fill="#000">SCHUNK MMS · ifm · Balluff</text>
<rect x="24" y="638" width="524" height="20" rx="0" stroke="#000" stroke-width="0.5" fill="#fff"/>
<text x="28" y="652" font-size="11" text-anchor="start" fill="#000">5</text>
<text x="62" y="652" font-size="11" text-anchor="start" fill="#000">Valve terminal, pressure retention</text>
<text x="292" y="652" font-size="11" text-anchor="start" fill="#000">Festo VTUG / MPA-L · SMC SY</text>
<rect x="24" y="658" width="524" height="20" rx="0" stroke="#000" stroke-width="0.5" fill="#f7f7f7"/>
<text x="28" y="672" font-size="11" text-anchor="start" fill="#000">6</text>
<text x="62" y="672" font-size="11" text-anchor="start" fill="#000">Compliance unit (optional)</text>
<text x="292" y="672" font-size="11" text-anchor="start" fill="#000">SCHUNK AGE · ATI</text>
<rect x="24" y="678" width="524" height="20" rx="0" stroke="#000" stroke-width="0.5" fill="#fff"/>
<text x="28" y="692" font-size="11" text-anchor="start" fill="#000">7</text>
<text x="62" y="692" font-size="11" text-anchor="start" fill="#000">Collision sensor (optional)</text>
<text x="292" y="692" font-size="11" text-anchor="start" fill="#000">ATI · SCHUNK OPR</text>
<line x1="58" y1="538" x2="58" y2="698" stroke="#000" stroke-width="0.5"/>
<line x1="288" y1="538" x2="288" y2="698" stroke="#000" stroke-width="0.5"/>
<rect x="24" y="538" width="524" height="160" rx="0" stroke="#000" stroke-width="1.1" fill="none"/>
<rect x="870" y="60" width="316" height="108" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="878" y="76.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Friction grip (13.2)</text>
<text x="878" y="92.6" font-size="11.5" text-anchor="start" fill="#000">2 · μ · F_G ≥ m · (g + a) · S</text>
<text x="878" y="108.1" font-size="11.5" text-anchor="start" fill="#000">F_G = m (g + a) S / (2 μ)</text>
<text x="878" y="123.6" font-size="11.5" text-anchor="start" fill="#000">10 × (9.81 + 10) × 2 / (2 × 0.1)</text>
<text x="878" y="139.2" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">= 1981 N per jaw (flat jaws, wet)</text>
<rect x="870" y="178" width="316" height="74" rx="4" stroke="#1f6fd1" stroke-width="1.2" fill="#fff"/>
<text x="878" y="194.5" font-size="12.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">With V-jaws, α = 90°</text>
<text x="878" y="210.6" font-size="11.5" text-anchor="start" fill="#000">μ' = 0.1 / 0.707 = 0.141</text>
<text x="878" y="226.1" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">F_G = 1401 N per jaw</text>
<rect x="870" y="262" width="316" height="92" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="878" y="278.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Pneumatic jaw force</text>
<text x="878" y="294.6" font-size="11.5" text-anchor="start" fill="#000">F = p · A · η = 0.5·10⁶ × π × 0.0315² × 0.9</text>
<text x="878" y="310.1" font-size="11.5" text-anchor="start" fill="#000">= 1403 N (Ø63) · Ø50 → 884 · Ø40 → 565 N</text>
<text x="878" y="325.7" font-size="11.5" text-anchor="start" fill="#000">≥ 1401 N → Ø63 class gripper</text>
<rect x="870" y="364" width="316" height="92" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="878" y="380.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Assumptions</text>
<text x="878" y="396.6" font-size="11.5" text-anchor="start" fill="#000">a = 10 m/s² (E-stop can be 10 – 30)</text>
<text x="878" y="412.1" font-size="11.5" text-anchor="start" fill="#000">S ≥ 2, μ = 0.1 (machined, coolant)</text>
<text x="878" y="427.7" font-size="11.5" text-anchor="start" fill="#000">load 3 + 10 = 13 kg → load diagram</text>
<text x="878" y="443.2" font-size="11.5" text-anchor="start" fill="#000">TCP 180 → J5 inertia check (8.4)</text>
<rect x="870" y="466" width="316" height="158" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="878" y="482.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Check in the datasheet</text>
<text x="878" y="498.6" font-size="11.5" text-anchor="start" fill="#000">force at YOUR finger length (curve)</text>
<text x="878" y="514.1" font-size="11.5" text-anchor="start" fill="#000">force per jaw or sum of both jaws?</text>
<text x="878" y="529.6" font-size="11.5" text-anchor="start" fill="#000">allowed jaw moments Mx / My / Mz</text>
<text x="878" y="545.2" font-size="11.5" text-anchor="start" fill="#000">stroke ≥ part tolerance + 2 – 5 mm / jaw</text>
<text x="878" y="560.7" font-size="11.5" text-anchor="start" fill="#000">air loss: spring / check valve keeps</text>
<text x="878" y="576.2" font-size="11.5" text-anchor="start" fill="#000">the part (ISO/TR 20218-1)</text>
<text x="878" y="591.8" font-size="11.5" text-anchor="start" fill="#000">gripper mass, IP class for coolant</text>
<rect x="540" y="764" width="648" height="54" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="540" y1="790" x2="1188" y2="790" stroke="#000" stroke-width="0.8"/>
<line x1="910" y1="790" x2="910" y2="818" stroke="#000" stroke-width="0.8"/>
<text x="548" y="782" font-size="14" font-weight="bold">2-finger gripper with V-jaws – forces, friction, form fit (compressor housing)</text>
<text x="548" y="809" font-size="12" font-weight="bold" fill="#1f6fd1">EXAMPLE – check the maker's documentation</text>
<text x="918" y="802" font-size="11.5">Dwg 21-05 · guide 21 §13.2–13.7 · ≈ 1 : 1</text>
