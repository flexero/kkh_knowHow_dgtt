<text x="494" y="292" font-size="12" text-anchor="middle" fill="#1f6fd1" font-weight="bold">F_G</text>
<path d="M796,230 L684,230 L754,300 L684,370 L796,370 Z" stroke="#000" stroke-width="1.4" fill="url(#hatch)"/>
