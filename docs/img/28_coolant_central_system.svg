<text x="40.0" y="380.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Example values (from docs/28)</text>
<text x="40.0" y="402.0" font-size="12" text-anchor="start" fill="#000">Individual sump (one HMC): 800 L, first fill 56 L concentrate + 744 L water</text>
<text x="40.0" y="421.0" font-size="12" text-anchor="start" fill="#000">Concentration 7 %: refractometer target 7 / 1.1 = 6.36 °Bx</text>
<text x="40.0" y="440.0" font-size="12" text-anchor="start" fill="#000">Correction: reading 3.8 °Bx → 4.18 % → add 24.3 L concentrate</text>
<text x="40.0" y="459.0" font-size="12" text-anchor="start" fill="#000">Chips: 225 parts/shift × 1.5 kg = 337.5 kg = 0.225 m³ bulk (cast iron)</text>
<text x="40.0" y="478.0" font-size="12" text-anchor="start" fill="#000">Carry-out on chips ≈ 0.1 L/kg → ≈ 101 L/day, 7.1 L concentrate/day</text>
<text x="40.0" y="497.0" font-size="12" text-anchor="start" fill="#000">Top-up premix ≈ 5 % when 40 L/day evaporates (only water leaves)</text>
<text x="40.0" y="516.0" font-size="12" text-anchor="start" fill="#000">Mist: 6 m³ × 5 /min × 60 = 1 800 m³/h per HMC, 5 400 m³/h total</text>
<text x="40.0" y="535.0" font-size="12" text-anchor="start" fill="#000">Filtration for 70 bar TSC: 10–25 µm (ask the spindle maker)</text>
<text x="40.0" y="554.0" font-size="12" text-anchor="start" fill="#000">Daily: concentration, pH; weekly: nitrite (&lt; 20 mg/L), bacteria</text>
<text x="40.0" y="573.0" font-size="12" text-anchor="start" fill="#000">Waste emulsion: EWC 12 01 09* – licensed disposal / splitting</text>
