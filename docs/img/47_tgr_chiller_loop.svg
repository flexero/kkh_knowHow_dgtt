<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">Thread grinder BS-TGR – grinding-oil chiller loop, ± 0.5 K band and the CNC interface</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><rect x="30" y="80" width="170" height="70" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="115.0" y="98.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">oil tank</text><text x="115.0" y="114.5" font-size="12.5" text-anchor="middle" fill="#000">≈ 300 l grinding oil</text><rect x="260" y="80" width="170" height="70" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="345.0" y="98.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">pump -QA1</text><text x="345.0" y="114.5" font-size="12.5" text-anchor="middle" fill="#000">Y_PUMP</text><rect x="490" y="80" width="200" height="70" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="590.0" y="98.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">thread grinder</text><text x="590.0" y="114.5" font-size="12.5" text-anchor="middle" fill="#000">wheel + screw (heat in)</text><rect x="260" y="220" width="170" height="70" rx="4" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.6"/><text x="345.0" y="238.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">oil chiller</text><text x="345.0" y="254.5" font-size="12.5" text-anchor="middle" fill="#000">Y_CHILL, CH_RUN, CH_FLT</text><rect x="490" y="220" width="200" height="70" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="590.0" y="238.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">PT100 -BT1 (4-wire)</text><text x="590.0" y="254.5" font-size="12.5" text-anchor="middle" fill="#000">OIL_T → RTD module</text><line x1="200" y1="115" x2="258" y2="115" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><line x1="430" y1="115" x2="488" y2="115" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><line x1="590" y1="150" x2="590" y2="218" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><line x1="490" y1="255" x2="432" y2="255" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><line x1="260" y1="255" x2="115" y2="255" stroke="#000" stroke-width="1.2"/><line x1="115" y1="255" x2="115" y2="152" stroke="#000" stroke-width="1.2" marker-end="url(#aK)"/><rect x="780" y="80" width="380" height="210" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="970.0" y="98.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#000">PLC (cell PLC, program 4)</text><text x="970.0" y="114.5" font-size="12.5" text-anchor="middle" fill="#000">chiller ON &gt; 20.2 °C, OFF &lt; 19.9 °C</text><text x="970.0" y="131.0" font-size="12.5" text-anchor="middle" fill="#000">|Δ| &gt; 0.5 K → warning 213: no finish pass</text><text x="970.0" y="147.5" font-size="12.5" text-anchor="middle" fill="#000">|Δ| &gt; 1.0 K for 10 s → alarm 213, feed hold</text><text x="970.0" y="164.0" font-size="12.5" text-anchor="middle" fill="#000">chiller trip → warning, temperature drifts</text><text x="970.0" y="180.5" font-size="12.5" text-anchor="middle" fill="#000">Δ = OIL_T − 20.0 °C</text><line x1="690" y1="255" x2="778" y2="200" stroke="#000" stroke-width="1.2" marker-end="url(#aK)" stroke-dasharray="4 3"/><line x1="778" y1="140" x2="432" y2="236" stroke="#000" stroke-width="1.2" marker-end="url(#aA)" stroke-dasharray="4 3"/><rect x="60" y="360" width="540" height="250" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="60" y="352" font-size="13" text-anchor="start" font-weight="700" fill="#000">Chiller trip at t = 0 (oil 20.00 °C, + 0.02 K/s – simulated fast)</text><line x1="60" y1="560.0" x2="600" y2="560.0" stroke="#888" stroke-width="0.7" stroke-dasharray="4 4"/><text x="606" y="564.0" font-size="11.5" text-anchor="start" fill="#000">20.0 set</text><line x1="60" y1="510.0" x2="600" y2="510.0" stroke="#888" stroke-width="0.7" stroke-dasharray="4 4"/><text x="606" y="514.0" font-size="11.5" text-anchor="start" fill="#000">+0.5 K warning</text><line x1="60" y1="460.0" x2="600" y2="460.0" stroke="#888" stroke-width="0.7" stroke-dasharray="4 4"/><text x="606" y="464.0" font-size="11.5" text-anchor="start" fill="#000">+1.0 K hold limit</text><line x1="60.0" y1="560.0" x2="600.0" y2="399.9999999999999" stroke="#1f6fd1" stroke-width="2.4"/><line x1="228.75" y1="360" x2="228.75" y2="610" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/><text x="232.75" y="376.0" font-size="11.5" text-anchor="start" fill="#000">25 s: no finish pass (M61 waits)</text><line x1="397.5" y1="360" x2="397.5" y2="610" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/><text x="401.5" y="404.57142857142856" font-size="11.5" text-anchor="start" fill="#000">50 s: &gt; 1 K</text><line x1="465.0" y1="360" x2="465.0" y2="610" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/><text x="469.0" y="416.0" font-size="11.5" text-anchor="start" fill="#000">60 s: alarm 213 + feed hold</text><text x="60.0" y="626" font-size="11.5" text-anchor="middle" fill="#000">0 s</text><text x="195.0" y="626" font-size="11.5" text-anchor="middle" fill="#000">20 s</text><text x="330.0" y="626" font-size="11.5" text-anchor="middle" fill="#000">40 s</text><text x="465.0" y="626" font-size="11.5" text-anchor="middle" fill="#000">60 s</text><text x="600.0" y="626" font-size="11.5" text-anchor="middle" fill="#000">80 s</text><text x="780" y="350" font-size="14" text-anchor="start" font-weight="700" fill="#000">CNC interface (24 V bits)</text><text x="780" y="376" font-size="12" text-anchor="start" fill="#000">CNC → PLC: CNC_RDY, CNC_CYC, CNC_FINREQ (M61),</text><text x="780" y="396" font-size="12" text-anchor="start" fill="#000">   CNC_END (M30), CNC_DRESSED</text><text x="780" y="416" font-size="12" text-anchor="start" fill="#000">PLC → CNC: Y_CYSTART, Y_FINOK (MFIN of M61),</text><text x="780" y="436" font-size="12" text-anchor="start" fill="#000">   Y_FHOLD, Y_DRESS (M62)</text><text x="780" y="456" font-size="12" text-anchor="start" fill="#000">M61 in the NC program: 'finish pass – permission?'</text><text x="780" y="476" font-size="12" text-anchor="start" fill="#000">the CNC waits until FIN_OK = 1 (only inside ± 0.5 K, no alarm)</text><text x="780" y="496" font-size="12" text-anchor="start" fill="#000">dressing every 5 parts (CTU), wheel Ø − 0.05 mm</text><text x="780" y="516" font-size="12" text-anchor="start" fill="#000">mist extractor: with the cycle + 60 s run-on (TOF)</text><text x="780" y="568" font-size="14" text-anchor="start" font-weight="700" fill="#000">Why ± 0.5 K? (thermal lead error)</text><text x="780" y="594" font-size="12.5" text-anchor="start" fill="#000">ΔL = α × L × ΔT = 11.5 µm/(m·K) × 1 m × 0.5 K ≈ 5.8 µm</text><text x="780" y="616" font-size="12.5" text-anchor="start" fill="#000">C5 lead tolerance: e_p ± 35 µm, v_300 18 µm (item 5) →</text><text x="780" y="638" font-size="12.5" text-anchor="start" fill="#000">the oil temperature must be stable during the finish pass</text><text x="780" y="660" font-size="12.5" text-anchor="start" fill="#000">item 5 NCR: chiller trip at night → 40 screws blocked</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>