<text x="1150.0" y="410.0" font-size="11" text-anchor="start" fill="#000">TP700 Comfort / KTP700 Basic</text>
<line x1="854.0" y1="418.0" x2="1380.0" y2="418.0" stroke="#ccc" stroke-width="0.8"/>
<text x="860.0" y="440.0" font-size="11" text-anchor="start" fill="#000">SW</text>
<text x="920.0" y="440.0" font-size="11" text-anchor="start" fill="#000">ISPSoft + DOPSoft (free)</text>
<text x="1150.0" y="440.0" font-size="11" text-anchor="start" fill="#000">TIA Portal STEP 7 Basic + WinCC</text>
<line x1="854.0" y1="448.0" x2="1380.0" y2="448.0" stroke="#ccc" stroke-width="0.8"/>
<text x="860.0" y="500.0" font-size="12" text-anchor="start" fill="#000">Notes (example):</text>
<text x="860.0" y="518.0" font-size="12" text-anchor="start" fill="#000">• Heat: CPU + I/O ≈ 25 W, servo drive ≈ 60 W,</text>
<text x="860.0" y="536.0" font-size="12" text-anchor="start" fill="#000">  PSU loss ≈ 25 W → fan with filter (IEC 61439).</text>
<text x="860.0" y="554.0" font-size="12" text-anchor="start" fill="#000">• 24 V PELV, 0 V earthed once at -XD2.</text>
<text x="860.0" y="572.0" font-size="12" text-anchor="start" fill="#000">• Safety relay outputs feed the motion valves</text>
<text x="860.0" y="590.0" font-size="12" text-anchor="start" fill="#000">  and the servo STO (guide 36 §7).</text>
<text x="860.0" y="608.0" font-size="12" text-anchor="start" fill="#000">• Spare: 20 % space, 20 % I/O, 30 % PSU current.</text>
<text x="860.0" y="626.0" font-size="12" text-anchor="start" fill="#000">• Labels: same tags as on the circuit, I/O list,</text>
<text x="860.0" y="644.0" font-size="12" text-anchor="start" fill="#000">  device and program (guide 15).</text>
