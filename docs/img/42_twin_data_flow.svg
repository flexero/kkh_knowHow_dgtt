<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#111"/></marker><marker id="arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#1f6fd1"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs><rect width="1200" height="830" fill="#fff"/><text x="20.0" y="30.0" font-size="20" font-weight="700">Twin data flow – Modbus TCP → gateway → HTTP</text><text x="20.0" y="50.0" font-size="12" fill="#666">Item 4 builds the register maps from SIGFIELDS (web/bsfsim.js); the live twin of item 3 gives the same JSON in simulation mode</text><rect x="40.0" y="90.0" width="280.0" height="72.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="180.0" y="112.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">CNC lathes + machining centres</text><text x="180.0" y="132.0" font-size="11" text-anchor="middle">signal groups std + cnc</text><text x="180.0" y="149.0" font-size="11" text-anchor="middle">Modbus TCP server, unit id</text><line x1="320.0" y1="126.0" x2="400.0" y2="126.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="40.0" y="182.0" width="280.0" height="72.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="180.0" y="204.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Grinders (thread, cyl., profile)</text><text x="180.0" y="224.0" font-size="11" text-anchor="middle">std + grind + tgr</text><text x="180.0" y="241.0" font-size="11" text-anchor="middle">Modbus TCP server, unit id</text><line x1="320.0" y1="218.0" x2="400.0" y2="218.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="40.0" y="274.0" width="280.0" height="72.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="180.0" y="296.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Furnaces + induction</text><text x="180.0" y="316.0" font-size="11" text-anchor="middle">std + furn / ind</text><text x="180.0" y="333.0" font-size="11" text-anchor="middle">Modbus TCP server, unit id</text><line x1="320.0" y1="310.0" x2="400.0" y2="310.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="40.0" y="366.0" width="280.0" height="72.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="180.0" y="388.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Presses + measuring machines</text><text x="180.0" y="408.0" font-size="11" text-anchor="middle">std + press / meas</text><text x="180.0" y="425.0" font-size="11" text-anchor="middle">Modbus TCP server, unit id</text><line x1="320.0" y1="402.0" x2="400.0" y2="402.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="40.0" y="458.0" width="280.0" height="72.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="180.0" y="480.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Assembly + test stands</text><text x="180.0" y="500.0" font-size="11" text-anchor="middle">std + torque</text><text x="180.0" y="517.0" font-size="11" text-anchor="middle">Modbus TCP server, unit id</text><line x1="320.0" y1="494.0" x2="400.0" y2="494.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="40.0" y="550.0" width="280.0" height="72.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="180.0" y="572.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Energy meters, utilities, doors</text><text x="180.0" y="592.0" font-size="11" text-anchor="middle">kW, kWh, air, oil temp.</text><text x="180.0" y="609.0" font-size="11" text-anchor="middle">Modbus TCP server, unit id</text><line x1="320.0" y1="586.0" x2="400.0" y2="586.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="400.0" y="90.0" width="170.0" height="534.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="485.0" y="112.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Managed switch</text><text x="485.0" y="132.0" font-size="11" text-anchor="middle">machine VLAN</text><text x="485.0" y="149.0" font-size="11" text-anchor="middle">1 Gbit star</text><text x="485.0" y="166.0" font-size="11" text-anchor="middle">port 502 only</text><text x="485.0" y="183.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="200.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="217.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="234.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="251.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="268.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="285.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="302.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="319.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="336.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="353.0" font-size="11" text-anchor="middle"></text><text x="485.0" y="370.0" font-size="11" text-anchor="middle">Modbus TCP</text><text x="485.0" y="387.0" font-size="11" text-anchor="middle">holding regs 4xxxx</text><text x="485.0" y="404.0" font-size="11" text-anchor="middle">REAL = 2 regs ABCD</text><text x="485.0" y="421.0" font-size="11" text-anchor="middle">ASCII 2 ch / reg</text><line x1="570.0" y1="300.0" x2="640.0" y2="300.0" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/><rect x="640.0" y="200.0" width="230.0" height="210.0" fill="none" stroke="#1f6fd1" stroke-width="2" rx="4"/><text x="755.0" y="222.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f6fd1">Gateway (stdlib Python)</text><text x="755.0" y="242.0" font-size="11" text-anchor="middle">Modbus TCP client</text><text x="755.0" y="259.0" font-size="11" text-anchor="middle">poll 100 ms status</text><text x="755.0" y="276.0" font-size="11" text-anchor="middle">1 s counters</text><text x="755.0" y="293.0" font-size="11" text-anchor="middle">10 s energy</text><text x="755.0" y="310.0" font-size="11" text-anchor="middle">register map = SIGFIELDS</text><text x="755.0" y="327.0" font-size="11" text-anchor="middle">→ JSON</text><line x1="870.0" y1="300.0" x2="930.0" y2="300.0" stroke="#111" stroke-width="2" marker-end="url(#arA)"/><text x="900.0" y="290.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f6fd1">HTTP</text><rect x="930.0" y="90.0" width="240.0" height="80.0" fill="none" stroke="#1f6fd1" stroke-width="2" rx="4"/><text x="1050.0" y="112.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f6fd1">Twin server (item 3)</text><text x="1050.0" y="132.0" font-size="11" text-anchor="middle">GET /api/bsf/state · SSE</text><text x="1050.0" y="149.0" font-size="11" text-anchor="middle">REST + JSON</text><rect x="930.0" y="198.0" width="240.0" height="80.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="1050.0" y="220.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">MES (item 6)</text><text x="1050.0" y="240.0" font-size="11" text-anchor="middle">orders, dispatch, OEE</text><text x="1050.0" y="257.0" font-size="11" text-anchor="middle">REST + JSON</text><rect x="930.0" y="306.0" width="240.0" height="80.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="1050.0" y="328.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">ERP (item 7)</text><text x="1050.0" y="348.0" font-size="11" text-anchor="middle">MRP, cost, sales orders</text><text x="1050.0" y="365.0" font-size="11" text-anchor="middle">REST + JSON</text><rect x="930.0" y="414.0" width="240.0" height="80.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="1050.0" y="436.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">Browser / andon screens</text><text x="1050.0" y="456.0" font-size="11" text-anchor="middle">this page, HTTP only</text><text x="1050.0" y="473.0" font-size="11" text-anchor="middle">REST + JSON</text><rect x="930.0" y="522.0" width="240.0" height="80.0" fill="none" stroke="#111" stroke-width="1.2" rx="4"/><text x="1050.0" y="544.0" font-size="13" text-anchor="middle" font-weight="700" fill="#111">AGV fleet manager</text><text x="1050.0" y="564.0" font-size="11" text-anchor="middle">transport orders over HTTP</text><text x="1050.0" y="581.0" font-size="11" text-anchor="middle">REST + JSON</text><rect x="40.0" y="650.0" width="830.0" height="46.0" fill="none" stroke="#1f6fd1" stroke-width="1" stroke-dasharray="6 4"/><text x="52.0" y="670.0" font-size="12" font-weight="700">Safety is hard-wired (safety relays / F-PLC, E-stop, light curtains, door switches) – never over Modbus or HTTP.</text><text x="52.0" y="688.0" font-size="12">No MQTT, no OPC UA: machines ↔ gateway = Modbus TCP only; everything above the gateway = HTTP (REST, Server-Sent Events).</text><g><rect x="800.0" y="756.0" width="390.0" height="64.0" fill="none" stroke="#111" stroke-width="1.2"/><line x1="800.0" y1="780.0" x2="1190.0" y2="780.0" stroke="#111" stroke-width="1"/><text x="808.0" y="773.0" font-size="13" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your planner</text><text x="808.0" y="796.0" font-size="11">Ball screw + guide factory · item 3 · guide 42</text><text x="808.0" y="812.0" font-size="11" fill="#666">Drawing 42-10 · all values are examples · 2026</text></g></svg>