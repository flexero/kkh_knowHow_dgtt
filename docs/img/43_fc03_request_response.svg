y="143" font-size="15" text-anchor="middle" font-weight="bold" fill="#1565c0">00</text><text x="398.0" y="176" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">8</text><rect x="420" y="112" width="44" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="442.0" y="143" font-size="15" text-anchor="middle" font-weight="bold" fill="#1565c0">00</text><text x="442.0" y="176" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">9</text><rect x="464" y="112" width="44" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="486.0" y="143" font-size="15" text-anchor="middle" font-weight="bold" fill="#1565c0">00</text><text x="486.0" y="176" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">10</text><rect x="508" y="112" width="44" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="530.0" y="143" font-size="15" text-anchor="middle" font-weight="bold" fill="#1565c0">0C</text><text x="530.0" y="176" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">11</text><text x="572" y="132" font-size="12" text-anchor="start" font-weight="normal" fill="#000">tid 0x00E8 · proto 0 · len 6 · unit 15</text><text x="572" y="150" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">FC 03 · start 0 · quantity 12</text><text x="24" y="210" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Response (33 bytes): header 9 bytes, then 24 data bytes = 12 registers</text><rect x="24" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="46.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">00</text><text x="46.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0</text><rect x="68" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="90.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">E8</text><text x="90.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1</text><rect x="112" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="134.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">00</text><text x="134.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">2</text><rect x="156" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="178.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">00</text><text x="178.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">3</text><rect x="200" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="222.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">00</text><text x="222.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">4</text><rect x="244" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="266.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">1B</text><text x="266.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">5</text><rect x="288" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="310.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">0F</text><text x="310.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">6</text><rect x="332" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="354.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#1565c0">03</text><text x="354.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">7</text><rect x="376" y="218" width="44" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="398.0" y="249" font-size="15" text-anchor="middle" font-weight="bold" fill="#1565c0">18</text><text x="398.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">8</text><text x="440" y="238" font-size="12" text-anchor="start" font-weight="normal" fill="#000">tid 0x00E8 (same) · len 27 = 1 + 1 + 1 + 24</text><text x="440" y="256" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">FC 03 · byte count 0x18 = 24</text><rect x="24" y="310" width="790" height="26" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="32" y="328" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Offset</text><text x="102" y="328" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Bytes</text><text x="192" y="328" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Field</text><text x="352" y="328" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Value</text><text x="462" y="328" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Meaning</text><rect x="24" y="336" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="354" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0</text><text x="102" y="354" font-size="12" text-anchor="start" font-weight="normal" fill="#000">01 01</text><text x="192" y="354" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hdr.mapVersion</text><text x="352" y="354" font-size="12" text-anchor="start" font-weight="normal" fill="#000">257 (0x0101)</text><text x="462" y="354" font-size="12" text-anchor="start" font-weight="normal" fill="#000">map version 1.1 (V1.1)</text><rect x="24" y="362" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="380" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1</text><text x="102" y="380" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 0C</text><text x="192" y="380" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hdr.typeCode</text><text x="352" y="380" font-size="12" text-anchor="start" font-weight="normal" fill="#000">12 (0x000C)</text><text x="462" y="380" font-size="12" text-anchor="start" font-weight="normal" fill="#000">type code 12 = BS-TGR</text><rect x="24" y="388" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="406" font-size="12" text-anchor="start" font-weight="normal" fill="#000">2</text><text x="102" y="406" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 0F</text><text x="192" y="406" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hdr.unitId</text><text x="352" y="406" font-size="12" text-anchor="start" font-weight="normal" fill="#000">15 (0x000F)</text><text x="462" y="406" font-size="12" text-anchor="start" font-weight="normal" fill="#000">unit id check</text><rect x="24" y="414" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="432" font-size="12" text-anchor="start" font-weight="normal" fill="#000">3</text><text x="102" y="432" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 24</text><text x="192" y="432" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hdr.heartbeat</text><text x="352" y="432" font-size="12" text-anchor="start" font-weight="normal" fill="#000">36 (0x0024)</text><text x="462" y="432" font-size="12" text-anchor="start" font-weight="normal" fill="#000">+1 per second</text><rect x="24" y="440" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="458" font-size="12" text-anchor="start" font-weight="normal" fill="#000">4</text><text x="102" y="458" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 01</text><text x="192" y="458" font-size="12" text-anchor="start" font-weight="bold" fill="#000">std.status</text><text x="352" y="458" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1</text><text x="462" y="458" font-size="12" text-anchor="start" font-weight="normal" fill="#000">bit0 = RUN</text><rect x="24" y="466" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="484" font-size="12" text-anchor="start" font-weight="normal" fill="#000">5</text><text x="102" y="484" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 01</text><text x="192" y="484" font-size="12" text-anchor="start" font-weight="bold" fill="#000">std.mode</text><text x="352" y="484" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1</text><text x="462" y="484" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 = auto</text><rect x="24" y="492" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="510" font-size="12" text-anchor="start" font-weight="normal" fill="#000">6</text><text x="102" y="510" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 02</text><text x="192" y="510" font-size="12" text-anchor="start" font-weight="bold" fill="#000">std.stateCode</text><text x="352" y="510" font-size="12" text-anchor="start" font-weight="normal" fill="#000">2</text><text x="462" y="510" font-size="12" text-anchor="start" font-weight="normal" fill="#000">2 = RUN</text><rect x="24" y="518" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="536" font-size="12" text-anchor="start" font-weight="normal" fill="#000">7</text><text x="102" y="536" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 00</text><text x="192" y="536" font-size="12" text-anchor="start" font-weight="bold" fill="#000">std.alarm</text><text x="352" y="536" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0</text><text x="462" y="536" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0 = no alarm</text><rect x="24" y="544" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="562" font-size="12" text-anchor="start" font-weight="normal" fill="#000">8</text><text x="102" y="562" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 10</text><text x="192" y="562" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.status</text><text x="352" y="562" font-size="12" text-anchor="start" font-weight="normal" fill="#000">16 (0x0010)</text><text x="462" y="562" font-size="12" text-anchor="start" font-weight="normal" fill="#000">bit4 READY for an order</text><rect x="24" y="570" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="588" font-size="12" text-anchor="start" font-weight="normal" fill="#000">9</text><text x="102" y="588" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 00</text><text x="192" y="588" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.ackSeq</text><text x="352" y="588" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0</text><text x="462" y="588" font-size="12" text-anchor="start" font-weight="normal" fill="#000">last command seq</text><rect x="24" y="596" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="614" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10</text><text x="102" y="614" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 00</text><text x="192" y="614" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.result</text><text x="352" y="614" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0</text><text x="462" y="614" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0 = OK</text><rect x="24" y="622" width="790" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="640" font-size="12" text-anchor="start" font-weight="normal" fill="#000">11</text><text x="102" y="640" font-size="12" text-anchor="start" font-weight="normal" fill="#000">00 00</text><text x="192" y="640" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.lotDone</text><text x="352" y="640" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0</text><text x="462" y="640" font-size="12" text-anchor="start" font-weight="normal" fill="#000">MES lot pieces</text><rect x="840" y="310" width="336" height="300" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="852" y="334" font-size="13" text-anchor="start" font-weight="bold" fill="#1565c0">Exception example</text><text x="852" y="358" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Request: read 4 registers from 300</text><text x="852" y="378" font-size="12" text-anchor="start" font-weight="bold" fill="#000">00 E9 00 00 00 06 0F 03 01 2C 00 04</text><text x="852" y="404" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Response (9 bytes):</text><text x="852" y="424" font-size="13" text-anchor="start" font-weight="bold" fill="#1565c0">00 E9 00 00 00 03 0F 83 02</text><text x="852" y="450" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x83 = 0x03 + 0x80 (error flag)</text><text x="852" y="470" font-size="12" text-anchor="start" font-weight="bold" fill="#000">02 = ILLEGAL DATA ADDRESS</text><text x="852" y="490" font-size="11" text-anchor="start" font-weight="normal" fill="#000">(map V1.1 ends at 226; 300 does not exist)</text><text x="852" y="520" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">01 illegal function</text><text x="852" y="536" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">02 illegal data address</text><text x="852" y="552" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">03 illegal data value (qty 0 / &gt; 125)</text><text x="852" y="568" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">04 server device failure</text><text x="852" y="584" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">0B gateway target failed to respond</text><text x="852" y="600" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">    (unknown unit id)</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">FC03 request + response</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-04  ·  guide 43 §6.4</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
