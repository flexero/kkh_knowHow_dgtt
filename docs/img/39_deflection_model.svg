<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Deflection model – 3 cantilevers in series + roller play</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="32.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">One tine, load F = 300 × 9.81 / 2 = 1 471 N at a = 1 350 mm from the crane axis (full stroke)</text>
<line x1="120.0" y1="80.0" x2="120.0" y2="330.0" stroke="#000" stroke-width="2"/>
<text x="112.0" y="100.0" font-size="12" text-anchor="end" fill="#000">fixed (carriage)</text>
<line x1="108.0" y1="90.0" x2="120.0" y2="100.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="114.0" x2="120.0" y2="124.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="138.0" x2="120.0" y2="148.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="162.0" x2="120.0" y2="172.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="186.0" x2="120.0" y2="196.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="210.0" x2="120.0" y2="220.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="234.0" x2="120.0" y2="244.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="258.0" x2="120.0" y2="268.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="282.0" x2="120.0" y2="292.0" stroke="#000" stroke-width="1"/>
<line x1="108.0" y1="306.0" x2="120.0" y2="316.0" stroke="#000" stroke-width="1"/>
<rect x="120.0" y="217.0" width="300.0" height="26.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="270.0" y="270.0" font-size="11.5" text-anchor="middle" fill="#000">zone 1 base, I = 3.0 × 10⁶ mm⁴</text>
<rect x="420.0" y="221.0" width="405.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="622.5" y="270.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1">zone 2 middle, I = 1.2 × 10⁶ mm⁴</text>
<rect x="825.0" y="224.0" width="105.0" height="12.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="877.5" y="270.0" font-size="11.5" text-anchor="middle" fill="#000">zone 3 top, I = 0.6 × 10⁶</text>
<line x1="930.0" y1="140.0" x2="930.0" y2="214.0" stroke="#1f6fd1" stroke-width="3" marker-end="url(#ea)"/>
<text x="938.0" y="160.0" font-size="12.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">F = 1 471 N</text>
<line x1="120.0" y1="300.0" x2="930.0" y2="300.0" stroke="#777" stroke-width="0.8" stroke-dasharray="5 4"/>
<path d="M 120.0 300.0 L 135.0 300.0 L 150.0 300.1 L 165.0 300.2 L 180.0 300.3 L 195.0 300.4 L 210.0 300.6 L 225.0 300.8 L 240.0 301.1 L 255.0 301.4 L 270.0 301.7 L 285.0 302.0 L 300.0 302.4 L 315.0 302.8 L 330.0 303.2 L 345.0 303.6 L 360.0 304.1 L 375.0 304.6 L 390.0 305.1 L 405.0 305.7 L 420.0 306.2 L 435.0 306.8 L 450.0 307.5 L 465.0 308.2 L 480.0 309.0 L 495.0 309.8 L 510.0 310.6 L 525.0 311.5 L 540.0 312.5 L 555.0 313.5 L 570.0 314.5 L 585.0 315.6 L 600.0 316.7 L 615.0 317.9 L 630.0 319.0 L 645.0 320.2 L 660.0 321.5 L 675.0 322.8 L 690.0 324.0 L 705.0 325.4 L 720.0 326.8 L 735.0 328.1 L 750.0 329.6 L 765.0 331.0 L 780.0 332.4 L 795.0 333.8 L 810.0 335.3 L 825.0 336.8 L 840.0 338.3 L 855.0 339.8 L 870.0 341.3 L 885.0 342.9 L 900.0 344.4 L 915.0 346.0 L 930.0 347.6" fill="none" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="938.0" y="351.6" font-size="12" text-anchor="start" fill="#1f6fd1">elastic 2.64 mm (× 18 scale)</text>
<text x="24.0" y="400.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Elastic part:  δ = Σ F/(3·E·I) · [(a − x₀)³ − (a − x₁)³]</text>
<text x="24.0" y="424.0" font-size="12" text-anchor="start" fill="#000">zone 1: 1.437 mm · zone 2: 1.185 mm · zone 3: 0.021 mm → 2.64 mm</text>
<text x="24.0" y="448.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Play part: 2 overlaps × 0.4 mm / 300 mm roller spacing × (1 350 − 500) = 2.27 mm</text>
<text x="24.0" y="472.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">tip deflection = 2.64 + 2.27 = 4.9 mm ≤ 5 mm (z budget, guide 31 §9) – pre-camber the stages ≈ 2 mm up</text>
<text x="24.0" y="496.0" font-size="12" text-anchor="start" fill="#000">The play part is as big as the elastic part: roller adjustment matters as much as steel size.</text>
<text x="24.0" y="520.0" font-size="12" text-anchor="start" fill="#000">Stress middle stage at x = 500: σ = F · 850 / (I / 32) = 33 MPa (S690QL: stiffness decides, not strength)</text>
<text x="24.0" y="570.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Roller reaction couple in the overlap (rollers 12.5 mm in from the stage ends, spacing e = 300 mm)</text>
<rect x="80.0" y="720.0" width="360.0" height="16.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<rect x="323.0" y="700.0" width="360.0" height="16.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="566.0" y="680.0" width="360.0" height="16.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<line x1="435.5" y1="768.0" x2="435.5" y2="722.0" stroke="#1f6fd1" stroke-width="2.5" marker-end="url(#ea)"/>
<text x="441.5" y="758.0" font-size="12" text-anchor="start" fill="#1f6fd1">R1f = 5.70 kN</text>
<line x1="327.5" y1="652.0" x2="327.5" y2="694.0" stroke="#1f6fd1" stroke-width="2.5" marker-end="url(#ea)"/>
<text x="333.5" y="666.0" font-size="12" text-anchor="start" fill="#1f6fd1">R1r = 4.23 kN</text>
<line x1="678.5" y1="748.0" x2="678.5" y2="702.0" stroke="#1f6fd1" stroke-width="2.5" marker-end="url(#ea)"/>
<text x="684.5" y="738.0" font-size="12" text-anchor="start" fill="#1f6fd1">R2f = 2.39 kN</text>
<line x1="570.5" y1="632.0" x2="570.5" y2="674.0" stroke="#1f6fd1" stroke-width="2.5" marker-end="url(#ea)"/>
<text x="576.5" y="646.0" font-size="12" text-anchor="start" fill="#1f6fd1">R2r = 0.92 kN</text>
<line x1="746.0" y1="610.0" x2="746.0" y2="676.0" stroke="#000" stroke-width="2.5" marker-end="url(#ek)"/>
<text x="752.0" y="624.0" font-size="12" text-anchor="start" fill="#000">F 1.47 kN</text>
<text x="24.0" y="594.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">R_front = F · (a − x_rear) / e ;  R_rear = F · (a − x_front) / e  (front roller pushes up, rear roller holds down)</text>
<text x="24.0" y="616.0" font-size="12" text-anchor="start" fill="#000">2 rollers per row → 2.85 kN per roller max. Choose cam followers with C₀ ≥ 2 × this (datasheet).</text>
<rect x="774" y="752" width="414" height="66" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="774" y1="774" x2="1188" y2="774" stroke="#000" stroke-width="0.8"/><line x1="844" y1="752" x2="844" y2="774" stroke="#000" stroke-width="0.8"/>
<text x="782" y="768" font-size="12.5" fill="#000" font-weight="bold">39-07</text>
<text x="852" y="768" font-size="12" fill="#000" font-weight="bold">Deflection model – 3 cantilevers in series + roller play</text>
<text x="782" y="791" font-size="12" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the fork maker's documentation</text>
<text x="782" y="809" font-size="11" fill="#000">Digital twin · ASRS-RAW telescopic fork · guide 39 · not to scale · mm</text>
</svg>
