<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Arial, Helvetica, sans-serif">
<title>Spindle assembly cell layout</title>
<rect x="0" y="0" width="1180" height="760" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000" >Spindle assembly cell – top view (example: 1 spindle per 2 days, 2 fitters + 1 inspector)</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Clean room 8 × 6 m, ISO 14644-1 class 7 (bench class 5), 20 ±1 °C, +10–15 Pa; separate run-in / test room 4 × 4 m. Scale 1 m = 75 px.</text>
