<text x="46.0" y="396.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >A  Lock + gowning</text>
<text x="46.0" y="412.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >unpack (no cardboard in)</text>
<text x="46.0" y="426.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >ESD tester, coats</text>
