<text x="196.0" y="412.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >washer E2, ultrasonic</text>
<text x="196.0" y="426.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >soak rack E3 (≥ 12 h)</text>
<rect x="40.0" y="80.0" width="225.0" height="150.0" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="6,4"/>
