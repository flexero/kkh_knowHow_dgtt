<text x="271.0" y="126.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >J1 stand, J2–J6</text>
<text x="271.0" y="140.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >heater E9, press E12</text>
