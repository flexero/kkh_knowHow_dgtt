<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" font-family="Arial, Helvetica, sans-serif">
<title>IEC 81346 reference designations – three aspects</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>
<text x="24" y="34" font-size="17" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">IEC 81346 reference designation – one device seen from three aspects (function =, product -, location +)</text>
<text x="24" y="56" font-size="12" text-anchor="start" fill="#555" xml:space="preserve">Example: the &#x27;arm up&#x27; proximity sensor of the pallet changer on HMC-01 and its cable to the main cabinet. Two-letter classes per IEC 81346-2:2019.</text>
<rect x="30" y="90" width="420" height="30" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="1.6"/>
<text x="40" y="110" font-size="14" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">= FUNCTION aspect (what it does)</text>
<text x="40" y="150" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">=MCH</text>
<text x="280" y="150" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">machining area</text>
<line x1="50" y1="152" x2="50" y2="171" stroke="#000" stroke-width="1"/>
<line x1="50" y1="171" x2="64" y2="171" stroke="#000" stroke-width="1"/>
<text x="68" y="176" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">=MCH.L2</text>
<text x="280" y="176" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">crankcase FMS cell</text>
<line x1="78" y1="178" x2="78" y2="197" stroke="#000" stroke-width="1"/>
<line x1="78" y1="197" x2="92" y2="197" stroke="#000" stroke-width="1"/>
<text x="96" y="202" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">=MCH.L2.HMC01</text>
<text x="280" y="202" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">machine HMC-01</text>
<line x1="106" y1="204" x2="106" y2="223" stroke="#000" stroke-width="1"/>
<line x1="106" y1="223" x2="120" y2="223" stroke="#000" stroke-width="1"/>
<text x="124" y="228" font-size="13" text-anchor="start" fill="#c62828" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">=MCH.L2.APCHMC01</text>
<text x="280" y="228" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">pallet changer</text>
<line x1="134" y1="230" x2="134" y2="249" stroke="#000" stroke-width="1"/>
<line x1="134" y1="249" x2="148" y2="249" stroke="#000" stroke-width="1"/>
<text x="152" y="254" font-size="13" text-anchor="start" fill="#c62828" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">…-BG12</text>
<text x="280" y="254" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">arm up sensor</text>
<line x1="134" y1="256" x2="134" y2="275" stroke="#000" stroke-width="1"/>
<line x1="134" y1="275" x2="148" y2="275" stroke="#000" stroke-width="1"/>
<text x="152" y="280" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">…-MB4 / -QM4</text>
<text x="280" y="280" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">lift valve coil / valve</text>
<line x1="78" y1="282" x2="78" y2="301" stroke="#000" stroke-width="1"/>
<line x1="78" y1="301" x2="92" y2="301" stroke="#000" stroke-width="1"/>
<text x="96" y="306" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">=MCH.L2.LOADCC</text>
<text x="280" y="306" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">load station</text>
<line x1="50" y1="308" x2="50" y2="327" stroke="#000" stroke-width="1"/>
<line x1="50" y1="327" x2="64" y2="327" stroke="#000" stroke-width="1"/>
<text x="68" y="332" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">=MCH.L3</text>
<text x="280" y="332" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">cylinder line</text>
<text x="40" y="358" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">=LOG.L0.ASRSRAW</text>
<text x="280" y="358" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">raw AS/RS</text>
<rect x="490" y="90" width="420" height="30" rx="0" fill="#fbe9e9" stroke="#c62828" stroke-width="1.6"/>
<text x="500" y="110" font-size="14" text-anchor="start" fill="#c62828" font-weight="bold" xml:space="preserve">- PRODUCT aspect (what it is)</text>
<text x="500" y="150" font-size="13" text-anchor="start" fill="#c62828" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-BG12</text>
<text x="740" y="150" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">inductive sensor M18</text>
<line x1="510" y1="152" x2="510" y2="171" stroke="#000" stroke-width="1"/>
<line x1="510" y1="171" x2="524" y2="171" stroke="#000" stroke-width="1"/>
<text x="528" y="176" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-BG12:1 (BN)</text>
<text x="740" y="176" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">+24 V</text>
<line x1="510" y1="178" x2="510" y2="197" stroke="#000" stroke-width="1"/>
<line x1="510" y1="197" x2="524" y2="197" stroke="#000" stroke-width="1"/>
<text x="528" y="202" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-BG12:3 (BU)</text>
<text x="740" y="202" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">0 V</text>
<line x1="510" y1="204" x2="510" y2="223" stroke="#000" stroke-width="1"/>
<line x1="510" y1="223" x2="524" y2="223" stroke="#000" stroke-width="1"/>
<text x="528" y="228" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-BG12:4 (BK)</text>
<text x="740" y="228" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">signal</text>
<text x="500" y="254" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-KF2</text>
<text x="740" y="254" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">DI module in ET 200SP</text>
<text x="500" y="280" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-XD2</text>
<text x="740" y="280" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">terminal strip 24 V DC</text>
<text x="500" y="306" font-size="13" text-anchor="start" fill="#c62828" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-W0123</text>
<text x="740" y="306" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">signal cable 4 × 0.34</text>
<text x="500" y="332" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-QA3</text>
<text x="740" y="332" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">contactor</text>
<text x="500" y="358" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-FC1</text>
<text x="740" y="358" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">circuit breaker</text>
<rect x="950" y="90" width="420" height="30" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="1.6"/>
<text x="960" y="110" font-size="14" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">+ LOCATION aspect (where it is)</text>
<text x="960" y="150" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+HALL1</text>
<text x="1200" y="150" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">production hall</text>
<line x1="970" y1="152" x2="970" y2="171" stroke="#000" stroke-width="1"/>
<line x1="970" y1="171" x2="984" y2="171" stroke="#000" stroke-width="1"/>
<text x="988" y="176" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+CAB01</text>
<text x="1200" y="176" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">main cabinet HMC-01</text>
<line x1="998" y1="178" x2="998" y2="197" stroke="#000" stroke-width="1"/>
<line x1="998" y1="197" x2="1012" y2="197" stroke="#000" stroke-width="1"/>
<text x="1016" y="202" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+CAB01.R1</text>
<text x="1200" y="202" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">mounting rail 1</text>
<line x1="970" y1="204" x2="970" y2="223" stroke="#000" stroke-width="1"/>
