<text x="988" y="228" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+JB01</text>
<text x="1200" y="228" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">junction box</text>
<line x1="970" y1="230" x2="970" y2="249" stroke="#000" stroke-width="1"/>
