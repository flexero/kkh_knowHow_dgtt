<text x="988" y="254" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+OP01</text>
<text x="1200" y="254" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">operator panel</text>
<line x1="970" y1="256" x2="970" y2="275" stroke="#000" stroke-width="1"/>
<line x1="970" y1="275" x2="984" y2="275" stroke="#000" stroke-width="1"/>
<text x="988" y="280" font-size="13" text-anchor="start" fill="#c62828" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+FLD.APC</text>
<text x="1200" y="280" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">field, on the APC</text>
<text x="960" y="306" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">+CAB51</text>
<text x="1200" y="306" font-size="11" text-anchor="start" fill="#333" xml:space="preserve">network cabinet cell 51</text>
<text x="30" y="400" font-size="15" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Full designation and what is printed where</text>
<text x="30" y="434" font-size="24" text-anchor="start" fill="#c62828" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">=MCH.L2.APCHMC01 +FLD.APC -BG12</text>
<text x="30" y="460" font-size="13" text-anchor="start" fill="#555" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">function            location   product</text>
<text x="30" y="492" font-size="12" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Schematic page</text>
<text x="290" y="492" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">full designation in the page header; device shows -BG12</text>
<text x="30" y="514" font-size="12" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Device label at sensor</text>
<text x="290" y="514" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">-BG12  (short form; function and location are known from the place)</text>
<text x="30" y="536" font-size="12" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">I/O list VC-ELE-IOL-0001</text>
<text x="290" y="536" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">tag MCH_L2_APCHMC01_ArmUp_Fb · %I20.3 · -XD2:4 · -W0123</text>
<text x="30" y="558" font-size="12" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Cable label both ends</text>
<text x="290" y="558" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">-W0123 → +FLD.APC-BG12   and   -W0123 → +CAB01-XD2:31…34</text>
<text x="30" y="580" font-size="12" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Hydraulic diagram (ISO 1219-2)</text>
<text x="290" y="580" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">1V1 lift valve = electrical -QM4 with coil -MB4 (verify class codes)</text>
<text x="30" y="640" font-size="15" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Connection: field device to cabinet terminal</text>
<rect x="40" y="660" width="220" height="110" rx="0" fill="#fff" stroke="#000" stroke-width="1.3" stroke-dasharray="6,3"/>
<text x="50" y="680" font-size="13" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">+FLD.APC</text>
<rect x="80" y="700" width="110" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="135" y="730" font-size="14" text-anchor="middle" fill="#000" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-BG12</text>
<rect x="620" y="660" width="360" height="140" rx="0" fill="#fff" stroke="#000" stroke-width="1.3" stroke-dasharray="6,3"/>
<text x="630" y="680" font-size="13" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">+CAB01</text>
<rect x="650" y="700" width="130" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="715" y="725" font-size="13" text-anchor="middle" fill="#000" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-XD2</text>
<text x="670" y="745" font-size="11" text-anchor="start" fill="#000" xml:space="preserve"></text>
<text x="670" y="745" font-size="11" text-anchor="start" fill="#000" xml:space="preserve"></text>
<text x="670" y="745" font-size="11" text-anchor="start" fill="#000" xml:space="preserve"></text>
<text x="670" y="745" font-size="11" text-anchor="start" fill="#000" xml:space="preserve"></text>
<text x="715" y="745" font-size="11" text-anchor="middle" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">:31 :32 :33 :34</text>
<rect x="820" y="700" width="130" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="885" y="725" font-size="13" text-anchor="middle" fill="#000" font-weight="bold" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">-KF2</text>
<text x="885" y="745" font-size="11" text-anchor="middle" fill="#000" xml:space="preserve">DI ch 3</text>
<text x="885" y="762" font-size="11" text-anchor="middle" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">%I20.3</text>
<line x1="190" y1="725" x2="650" y2="725" stroke="#c62828" stroke-width="2.2"/>
<text x="420" y="715" font-size="12" text-anchor="middle" fill="#c62828" xml:space="preserve">-W0123  4 × 0.34 mm² PUR, M12, 8 m</text>
<line x1="780" y1="740" x2="820" y2="740" stroke="#000" stroke-width="1.4"/>
<text x="420" y="750" font-size="11" text-anchor="middle" fill="#000" xml:space="preserve">wire markers: 23.4 / 23.4a (page.column)</text>
<text x="30" y="830" font-size="13" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Comparison – KKS / RDS-PP (power plants):</text>
<text x="30" y="852" font-size="12" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1 LAB10 AP001 -M01  = unit 1 · system LAB10 (feed-water piping) · equipment AP001 (pump unit) · component M01 (motor) – typical, check</text>
<text x="30" y="874" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">KKS codes are fixed letter tables for plants; for a machine factory IEC 81346 with the project codes of guide 15 is simpler.</text>
