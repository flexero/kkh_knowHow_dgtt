<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Traceability data model – drawing 44-11</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.6"/></pattern></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24.0" y="36.0" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Traceability data model – from the steel heat to the shipped serial</text><text x="24.0" y="58.0" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Each box = one record type (owner in brackets). Lines = link (one to many). Serial format examples: BS3210-YYMMDD-NNNN, LG25-YYMMDD-NNNN, A-BS-YYMMDD-NNNN</text><rect x="40.0" y="90.0" width="220.0" height="90.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="40.0" y1="114.0" x2="260.0" y2="114.0" stroke="#000" stroke-width="0.8"/><text x="50.0" y="107.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Heat lot (ERP)</text><text x="50.0" y="132.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">heat no., mill</text><text x="50.0" y="149.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">EN 10204 3.1 cert.</text><text x="50.0" y="166.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">chemistry, cleanliness</text><rect x="320.0" y="90.0" width="220.0" height="90.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="320.0" y1="114.0" x2="540.0" y2="114.0" stroke="#000" stroke-width="0.8"/><text x="330.0" y="107.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Production lot (MES)</text><text x="330.0" y="132.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">lot id, work order</text><text x="330.0" y="149.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">route, qty</text><text x="330.0" y="166.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">heat lot, furnace load</text><rect x="600.0" y="90.0" width="220.0" height="90.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><line x1="600.0" y1="114.0" x2="820.0" y2="114.0" stroke="#000" stroke-width="0.8"/><text x="610.0" y="107.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Serial (MES + QA)</text><text x="610.0" y="132.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">BS3210-261118-0042</text><text x="610.0" y="149.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">part, lot, order</text><text x="610.0" y="166.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">grade / class, status</text><rect x="900.0" y="90.0" width="220.0" height="90.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="900.0" y1="114.0" x2="1120.0" y2="114.0" stroke="#000" stroke-width="0.8"/><text x="910.0" y="107.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Shipment (ERP)</text><text x="910.0" y="132.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">delivery note, customer</text><text x="910.0" y="149.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">serials in the box</text><text x="910.0" y="166.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">lead curve, torque chart</text><rect x="320.0" y="300.0" width="220.0" height="107.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="320.0" y1="324.0" x2="540.0" y2="324.0" stroke="#000" stroke-width="0.8"/><text x="330.0" y="317.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Operation record (MES)</text><text x="330.0" y="342.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">serial / lot, op no.</text><text x="330.0" y="359.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">machine id, operator badge</text><text x="330.0" y="376.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">start / end, recipe</text><text x="330.0" y="393.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">process values (Modbus)</text><rect x="600.0" y="300.0" width="220.0" height="107.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><line x1="600.0" y1="324.0" x2="820.0" y2="324.0" stroke="#000" stroke-width="0.8"/><text x="610.0" y="317.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Measurement record (QA)</text><text x="610.0" y="342.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">serial, char. id, value</text><text x="610.0" y="359.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">unit, LSL / USL, decision</text><text x="610.0" y="376.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">gauge id, operator, time</text><text x="610.0" y="393.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">raw data file (curve)</text><rect x="900.0" y="300.0" width="220.0" height="90.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="900.0" y1="324.0" x2="1120.0" y2="324.0" stroke="#000" stroke-width="0.8"/><text x="910.0" y="317.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Gauge (QA)</text><text x="910.0" y="342.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">gauge id, type</text><text x="910.0" y="359.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">cal. date, due date</text><text x="910.0" y="376.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">certificate, MSA result</text><rect x="600.0" y="510.0" width="220.0" height="107.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="600.0" y1="534.0" x2="820.0" y2="534.0" stroke="#000" stroke-width="0.8"/><text x="610.0" y="527.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">NCR / 8D (QA)</text><text x="610.0" y="552.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">NCR no., serial(s)</text><text x="610.0" y="569.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">characteristic</text><text x="610.0" y="586.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">disposition, root cause</text><text x="610.0" y="603.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">actions</text><line x1="260.0" y1="130.0" x2="320.0" y2="130.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="290.0" y="124.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1 : n</text><line x1="540.0" y1="130.0" x2="600.0" y2="130.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="570.0" y="124.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1 : n</text><line x1="820.0" y1="130.0" x2="900.0" y2="130.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="860.0" y="124.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">n : 1</text><line x1="430.0" y1="180.0" x2="430.0" y2="300.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="436.0" y="244.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">1 : n</text><line x1="710.0" y1="180.0" x2="710.0" y2="300.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="716.0" y="244.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">1 : n</text><line x1="710.0" y1="407.0" x2="710.0" y2="510.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="716.0" y="462.5" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0 : 1</text><line x1="900.0" y1="340.0" x2="820.0" y2="340.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="860.0" y="334.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">n : 1</text><line x1="540.0" y1="360.0" x2="600.0" y2="360.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="4 3"/><text x="570.0" y="380.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">same</text><text x="570.0" y="394.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">serial</text><text x="40.0" y="660.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Data paths (only Modbus TCP below the gateway, only HTTP above)</text><rect x="40.0" y="676.0" width="180.0" height="46.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="130.0" y="695.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">measuring machine / PLC</text><text x="130.0" y="709.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">QC-LED, AS-BSA, QC-MAT</text><line x1="220.0" y1="699.0" x2="240.0" y2="699.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="260.0" y="676.0" width="180.0" height="46.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="350.0" y="695.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Modbus TCP :502</text><text x="350.0" y="709.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">group meas / torque</text><line x1="440.0" y1="699.0" x2="460.0" y2="699.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="460.0" y="676.0" width="180.0" height="46.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="550.0" y="695.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">gateway</text><text x="550.0" y="709.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">decode, quality, stale</text><line x1="640.0" y1="699.0" x2="660.0" y2="699.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="660.0" y="676.0" width="180.0" height="46.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="750.0" y="695.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">HTTP JSON</text><text x="750.0" y="709.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">POST /api/bsf/qa/results</text><line x1="840.0" y1="699.0" x2="860.0" y2="699.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="860.0" y="676.0" width="180.0" height="46.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="950.0" y="695.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">MES + QA service</text><text x="950.0" y="709.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">records, SPC, trace</text><text x="40.0" y="748.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Instrument PCs without Modbus (CMM, contour, roughness) post HTTP JSON directly.</text><text x="40.0" y="764.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">The serial is laser marked (data-matrix) after the first operation that can carry a mark.</text><rect x="825.0" y="738.0" width="360.0" height="80.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825.0" y1="768.0" x2="1185.0" y2="768.0" stroke="#000" stroke-width="1.2"/><line x1="825.0" y1="792.0" x2="1185.0" y2="792.0" stroke="#000" stroke-width="1.2"/><text x="835.0" y="759.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Traceability data model</text><text x="835.0" y="785.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 44-11  ·  guide 44 §18</text><text x="835.0" y="810.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the standard</text></svg>
