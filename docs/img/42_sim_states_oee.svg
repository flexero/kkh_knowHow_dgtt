<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#111"/></marker><marker id="arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#1f6fd1"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs><rect width="1200" height="830" fill="#fff"/><text x="20.0" y="30.0" font-size="20" font-weight="700">Machine states, OEE and Little's law in the simulation</text><text x="20.0" y="50.0" font-size="12" fill="#666">State machine of every machine in web/bsfsim.js; the KPI panel shows the same numbers live</text><rect x="80.0" y="140.0" width="160.0" height="64.0" fill="none" stroke="#111" stroke-width="1.4" rx="8"/><text x="160.0" y="168.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">OFF</text><text x="160.0" y="188.0" font-size="11" text-anchor="middle">no shift</text><rect x="300.0" y="140.0" width="160.0" height="64.0" fill="none" stroke="#111" stroke-width="1.4" rx="8"/><text x="380.0" y="168.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">IDLE</text><text x="380.0" y="188.0" font-size="11" text-anchor="middle">no order</text><rect x="520.0" y="140.0" width="160.0" height="64.0" fill="none" stroke="#111" stroke-width="1.4" rx="8"/><text x="600.0" y="168.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">STARVED</text><text x="600.0" y="188.0" font-size="11" text-anchor="middle">no parts</text><rect x="300.0" y="300.0" width="160.0" height="64.0" fill="none" stroke="#111" stroke-width="1.4" rx="8"/><text x="380.0" y="328.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">SETUP</text><text x="380.0" y="348.0" font-size="11" text-anchor="middle">change-over</text><rect x="520.0" y="300.0" width="160.0" height="64.0" fill="none" stroke="#1f6fd1" stroke-width="2.4" rx="8"/><text x="600.0" y="328.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f6fd1">RUN</text><text x="600.0" y="348.0" font-size="11" text-anchor="middle">producing</text><rect x="740.0" y="300.0" width="160.0" height="64.0" fill="none" stroke="#111" stroke-width="1.4" rx="8"/><text x="820.0" y="328.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">BLOCKED</text><text x="820.0" y="348.0" font-size="11" text-anchor="middle">out-buffer full</text><rect x="520.0" y="460.0" width="160.0" height="64.0" fill="none" stroke="#111" stroke-width="1.4" rx="8"/><text x="600.0" y="488.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">DOWN</text><text x="600.0" y="508.0" font-size="11" text-anchor="middle">alarm / repair</text><line x1="240.0" y1="172.0" x2="300.0" y2="172.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><line x1="460.0" y1="172.0" x2="520.0" y2="172.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><line x1="380.0" y1="204.0" x2="380.0" y2="300.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><line x1="460.0" y1="332.0" x2="520.0" y2="332.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><line x1="600.0" y1="204.0" x2="600.0" y2="300.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><line x1="680.0" y1="332.0" x2="740.0" y2="332.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><line x1="600.0" y1="364.0" x2="600.0" y2="460.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><line x1="560.0" y1="460.0" x2="420.0" y2="364.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><text x="270.0" y="165.0" font-size="11" text-anchor="middle">shift</text><text x="490.0" y="165.0" font-size="11" text-anchor="middle">order</text><text x="390.0" y="255.0" font-size="11">lot, new op</text><text x="610.0" y="255.0" font-size="11">lot</text><text x="612.0" y="420.0" font-size="11">failure</text><text x="470.0" y="430.0" font-size="11">repaired</text><rect x="925.0" y="80.0" width="260.0" height="560.0" fill="none" stroke="#1f6fd1" stroke-width="1"/><text x="937.0" y="104.0" font-size="12" font-weight="700" fill="#1f6fd1">OEE (ISO 22400 style, per machine):</text><text x="937.0" y="127.0" font-size="12" fill="#111">A = run / (run + set-up + down)</text><text x="937.0" y="150.0" font-size="12" fill="#111">P = Σ ideal cycle × pieces / run</text><text x="937.0" y="173.0" font-size="12" fill="#111">Q = good / (good + scrap)</text><text x="937.0" y="196.0" font-size="12" fill="#111">OEE = A × P × Q</text><text x="937.0" y="219.0" font-size="12" fill="#111">e.g. 0.95 × 0.78 × 0.99 = 0.73</text><text x="937.0" y="242.0" font-size="12" fill="#111">starved / blocked / idle = losses</text><text x="937.0" y="265.0" font-size="12" fill="#111">of the LINE (utilisation)</text><text x="937.0" y="288.0" font-size="12" fill="#111"></text><text x="937.0" y="311.0" font-size="12" font-weight="700" fill="#1f6fd1">Little's law (stable system):</text><text x="937.0" y="334.0" font-size="12" fill="#111">WIP = throughput × lead time</text><text x="937.0" y="357.0" font-size="12" fill="#111">L = λ · W, e.g. 1.39 lots/h × 53 h</text><text x="937.0" y="380.0" font-size="12" fill="#111">= 74 lots in the plant</text><text x="937.0" y="403.0" font-size="12" fill="#111"></text><text x="937.0" y="426.0" font-size="12" font-weight="700" fill="#1f6fd1">Bottleneck:</text><text x="937.0" y="449.0" font-size="12" fill="#111">highest (run + set-up + down)</text><text x="937.0" y="472.0" font-size="12" fill="#111">/ shift time</text><text x="937.0" y="495.0" font-size="12" fill="#111"></text><text x="937.0" y="518.0" font-size="12" font-weight="700" fill="#1f6fd1">Kingman (waiting in a queue):</text><text x="937.0" y="541.0" font-size="12" fill="#111">≈ (ca² + cs²)/2 · u/(1 − u) · t</text><text x="937.0" y="564.0" font-size="12" fill="#111">u &gt; 0.9 → queues explode</text><text x="60.0" y="600.0" font-size="12">Every machine of the twin has exactly one of these 7 states at any time; item 4 sends it as stateCode 0 … 6 + status bits (Modbus TCP).</text><g><rect x="800.0" y="756.0" width="390.0" height="64.0" fill="none" stroke="#111" stroke-width="1.2"/><line x1="800.0" y1="780.0" x2="1190.0" y2="780.0" stroke="#111" stroke-width="1"/><text x="808.0" y="773.0" font-size="13" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your planner</text><text x="808.0" y="796.0" font-size="11">Ball screw + guide factory · item 3 · guide 42</text><text x="808.0" y="812.0" font-size="11" fill="#666">Drawing 42-12 · all values are examples · 2026</text></g></svg>