<text x="20.0" y="30.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Hard whirling of the ball-screw thread (option W) – a fast ring with 6 inserts orbits the slowly turning hardened shaft</text>
<text x="30.0" y="58.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">A  Front view (shaft axis into the page)</text>
