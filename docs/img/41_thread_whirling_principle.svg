<line x1="640.0" y1="295.0" x2="1000.0" y2="295.0" stroke="#1f6fd1" stroke-width="2" marker-end="url(#eab)"/>
<text x="820.0" y="315.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1">axial feed = Ph × n_w = 10 × 6 = 60 mm/min (one pass, full depth)</text>
<rect x="640.0" y="340.0" width="530.0" height="22.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="356.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Item</text>
<line x1="790.0" y1="340.0" x2="790.0" y2="362.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="356.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Value (example)</text>
<rect x="640.0" y="362.0" width="530.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="378.0" font-size="11.5" text-anchor="start" fill="#000">Ring speed</text>
<line x1="790.0" y1="362.0" x2="790.0" y2="384.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="378.0" font-size="11.5" text-anchor="start" fill="#000">1 500 min⁻¹ (vc ≈ 150 – 200 m/min on 60 HRC)</text>
<rect x="640.0" y="384.0" width="530.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="400.0" font-size="11.5" text-anchor="start" fill="#000">Work speed</text>
<line x1="790.0" y1="384.0" x2="790.0" y2="406.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="400.0" font-size="11.5" text-anchor="start" fill="#000">6 min⁻¹</text>
<rect x="640.0" y="406.0" width="530.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="422.0" font-size="11.5" text-anchor="start" fill="#000">Time</text>
<line x1="790.0" y1="406.0" x2="790.0" y2="428.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="422.0" font-size="11.5" text-anchor="start" fill="#000">(850 + 50) / (10 × 6) = 15 min, 1 pass</text>
<rect x="640.0" y="428.0" width="530.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="444.0" font-size="11.5" text-anchor="start" fill="#000">Cooling</text>
<line x1="790.0" y1="428.0" x2="790.0" y2="450.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="444.0" font-size="11.5" text-anchor="start" fill="#000">dry or MQL – chips carry the heat away</text>
<rect x="640.0" y="450.0" width="530.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="466.0" font-size="11.5" text-anchor="start" fill="#000">Result</text>
<line x1="790.0" y1="450.0" x2="790.0" y2="472.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="466.0" font-size="11.5" text-anchor="start" fill="#000">C7 directly; C5 with 2 finish grinding passes (18 min)</text>
<rect x="640.0" y="472.0" width="530.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="488.0" font-size="11.5" text-anchor="start" fill="#000">Machine</text>
<line x1="790.0" y1="472.0" x2="790.0" y2="494.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="488.0" font-size="11.5" text-anchor="start" fill="#000">BS-WHL, e.g. Leistritz (check type)</text>
<rect x="640.0" y="494.0" width="530.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="510.0" font-size="11.5" text-anchor="start" fill="#000">Check</text>
<line x1="790.0" y1="494.0" x2="790.0" y2="516.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="510.0" font-size="11.5" text-anchor="start" fill="#000">profile + pitch Ø over balls first + 1 in 10</text>
<rect x="640.0" y="516.0" width="530.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="645.0" y="532.0" font-size="11.5" text-anchor="start" fill="#000">Typical mistake</text>
<line x1="790.0" y1="516.0" x2="790.0" y2="538.0" stroke="#000" stroke-width="0.8"/>
<text x="795.0" y="532.0" font-size="11.5" text-anchor="start" fill="#000">chipped insert not detected → form error, white layer</text>
<rect x="640.0" y="548.0" width="530.0" height="110.0" rx="0" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="652.0" y="570.0" font-size="11.5" text-anchor="start" fill="#000">Why whirl? One whirling pass removes the full groove (≈ 3 mm deep)</text>
<text x="652.0" y="588.0" font-size="11.5" text-anchor="start" fill="#000">in 15 min. Thread grinding from solid needs 7 passes = 33.75 min.</text>
<text x="652.0" y="606.0" font-size="11.5" text-anchor="start" fill="#000">W route: whirl 17 + finish grind 22 min (cycles) → 8 thread grinders</text>
<text x="652.0" y="624.0" font-size="11.5" text-anchor="start" fill="#000">become 5, plus 4 whirling machines (84 % at 120 screws / day).</text>
<rect x="812.0" y="742.0" width="382.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="812.0" y1="768.0" x2="1194.0" y2="768.0" stroke="#000" stroke-width="0.8"/>
<line x1="812.0" y1="792.0" x2="1194.0" y2="792.0" stroke="#000" stroke-width="0.8"/>
<line x1="1002.0" y1="792.0" x2="1002.0" y2="824.0" stroke="#000" stroke-width="0.8"/>
<text x="820.0" y="760.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Thread whirling principle</text>
<text x="820.0" y="785.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the machine maker's data</text>
<text x="820.0" y="812.0" font-size="11.5" text-anchor="start" fill="#000">Drawing 41-06</text>
