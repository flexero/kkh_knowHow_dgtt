<text x="980.0" y="240.0" font-size="11.5" text-anchor="start" fill="#000">solid (OD ground)</text>
<polygon points="702.2,128.7 731.7,123.5 757.8,271.3 728.3,276.5" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.8"/>
