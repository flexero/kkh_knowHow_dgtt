<text x="300.0" y="500.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1">n_w = 6 min⁻¹</text>
<circle cx="300.0" cy="478.0" r="2.0" fill="#000" stroke="#000" stroke-width="1.2"/>
