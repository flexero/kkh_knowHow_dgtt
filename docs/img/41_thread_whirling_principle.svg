<text x="308.0" y="410.0" font-size="11.5" text-anchor="start" fill="#000">eccentricity e</text>
<path d="M495,350 A 195 195 0 0 1 480,470" fill="none" stroke="#1f6fd1" stroke-width="2" marker-end="url(#eab)"/>
<text x="500.0" y="410.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">ring</text>
<path d="M372,448 A 75 75 0 0 1 350,530" fill="none" stroke="#1f6fd1" stroke-width="1.6" marker-end="url(#ea)"/>
<text x="388.0" y="498.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">work</text>
<text x="150.0" y="408.0" font-size="11.5" text-anchor="middle" fill="#000">comma-shaped chip</text>
<path d="M200,416 q 10 -14 22 -6 q -6 6 -22 6 Z" fill="#000" stroke="#000" stroke-width="1.2"/>
<text x="30.0" y="650.0" font-size="11.5" text-anchor="start" fill="#000">Ring and work turn in the same direction. The ring centre is offset by e,</text>
<text x="30.0" y="667.0" font-size="11.5" text-anchor="start" fill="#000">so each insert touches the shaft only on a short arc: one comma-shaped chip</text>
<text x="30.0" y="684.0" font-size="11.5" text-anchor="start" fill="#000">per insert and ring turn – interrupted cut, low heat in the part, 6 inserts</text>
<text x="30.0" y="701.0" font-size="11.5" text-anchor="start" fill="#000">share the wear.</text>
<text x="640.0" y="58.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">B  Side view – ring tilted by the lead angle</text>
