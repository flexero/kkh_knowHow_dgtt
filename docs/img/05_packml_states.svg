<text x="1000" y="752" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Twin state → PackML state (proposal)</text>
<text x="1000" y="774" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">RUNNING</text>
<text x="1160" y="774" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">→ Execute</text>
<text x="1000" y="793" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">STARVED / BLOCKED</text>
<text x="1160" y="793" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">→ Suspended</text>
<text x="1000" y="812" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">SETUP (changeover)</text>
<text x="1160" y="812" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">→ Held / Idle in mode Changeover</text>
<text x="1000" y="831" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">DOWN (fault)</text>
<text x="1160" y="831" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">→ Aborted (or Held)</text>
<text x="1000" y="850" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">STOPPED</text>
<text x="1160" y="850" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">→ Stopped</text>
<text x="1000" y="869" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">MAINTENANCE</text>
<text x="1160" y="869" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">→ Stopped, mode Maintenance</text>
<text x="30" y="868" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Modes (unit modes): Production, Maintenance, Manual (+ user modes, e.g. Changeover, Clean).</text>
<text x="30" y="886" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Each mode allows a subset of the states. PackTags: Command (CntrlCmd, UnitMode),</text>
<text x="30" y="904" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Status (StateCurrent, MachSpeed), Admin (alarms, counters) – OPC UA companion spec OPC 30050.</text>
