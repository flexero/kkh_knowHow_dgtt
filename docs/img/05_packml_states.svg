<text x="838" y="933" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#000">PackML state model (ISA-TR88.00.02)</text>
<text x="838" y="962" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">17 states, commands, state-complete (SC); twin state mapping</text>
<text x="838" y="980" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0b62c4">EXAMPLE – check the maker's documentation</text>
