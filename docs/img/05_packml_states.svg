<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="start" fill="#000" font-weight="bold">PackML state model – ISA-TR88.00.02 (OMAC) – one model for every machine in the line</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#000">Blue = wait states (wait for a command). White = acting states (end with SC = state complete). Bold = Execute (producing; SC when the order quantity is done).</text>
