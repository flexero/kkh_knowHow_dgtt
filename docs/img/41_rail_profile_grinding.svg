<text x="835.0" y="406.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Value (example)</text>
<rect x="700.0" y="412.0" width="470.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="705.0" y="428.0" font-size="11.5" text-anchor="start" fill="#000">Wheels</text>
<line x1="830.0" y1="412.0" x2="830.0" y2="434.0" stroke="#000" stroke-width="0.8"/>
<text x="835.0" y="428.0" font-size="11.5" text-anchor="start" fill="#000">vitrified corundum form wheels Ø350, vs 35 m/s</text>
<rect x="700.0" y="434.0" width="470.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="705.0" y="450.0" font-size="11.5" text-anchor="start" fill="#000">Passes</text>
<line x1="830.0" y1="434.0" x2="830.0" y2="456.0" stroke="#000" stroke-width="0.8"/>
<text x="835.0" y="450.0" font-size="11.5" text-anchor="start" fill="#000">2 rough (10 m/min) + 1 finish (3 m/min)</text>
<rect x="700.0" y="456.0" width="470.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="705.0" y="472.0" font-size="11.5" text-anchor="start" fill="#000">String</text>
<line x1="830.0" y1="456.0" x2="830.0" y2="478.0" stroke="#000" stroke-width="0.8"/>
<text x="835.0" y="472.0" font-size="11.5" text-anchor="start" fill="#000">4 × 1 020 mm + gaps = 4.38 m</text>
<rect x="700.0" y="478.0" width="470.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="705.0" y="494.0" font-size="11.5" text-anchor="start" fill="#000">Grinding time</text>
<line x1="830.0" y1="478.0" x2="830.0" y2="500.0" stroke="#000" stroke-width="0.8"/>
<text x="835.0" y="494.0" font-size="11.5" text-anchor="start" fill="#000">2·4.38/10 + 4.38/3 = 2.34 min per string</text>
<rect x="700.0" y="500.0" width="470.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="705.0" y="516.0" font-size="11.5" text-anchor="start" fill="#000">Per rail</text>
<line x1="830.0" y1="500.0" x2="830.0" y2="522.0" stroke="#000" stroke-width="0.8"/>
<text x="835.0" y="516.0" font-size="11.5" text-anchor="start" fill="#000">0.58 min grinding; cycle 3.5 min incl. load, dress, gauge</text>
<rect x="700.0" y="522.0" width="470.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="705.0" y="538.0" font-size="11.5" text-anchor="start" fill="#000">Machines</text>
<line x1="830.0" y1="522.0" x2="830.0" y2="544.0" stroke="#000" stroke-width="0.8"/>
<text x="835.0" y="538.0" font-size="11.5" text-anchor="start" fill="#000">LG-PGR 2 at 200 rails / day (61.7 %)</text>
<rect x="700.0" y="544.0" width="470.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="705.0" y="560.0" font-size="11.5" text-anchor="start" fill="#000">Check QG-LG-2</text>
<line x1="830.0" y1="544.0" x2="830.0" y2="566.0" stroke="#000" stroke-width="0.8"/>
<text x="835.0" y="560.0" font-size="11.5" text-anchor="start" fill="#000">height + width over gauge balls vs master rail 100 %</text>
<rect x="30.0" y="520.0" width="640.0" height="140.0" rx="0" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="42.0" y="542.0" font-size="11.5" text-anchor="start" fill="#000">Why one set-up for all 4 raceways? The raceways must be parallel to each other and</text>
<text x="42.0" y="561.0" font-size="11.5" text-anchor="start" fill="#000">to the datum side within a few µm. Grinding them in one clamping avoids set-up errors.</text>
<text x="42.0" y="580.0" font-size="11.5" text-anchor="start" fill="#000">Typical mistakes: dressing roll worn → wrong raceway radius → contact angle + preload wrong;</text>
<text x="42.0" y="599.0" font-size="11.5" text-anchor="start" fill="#000">rail bent before clamping → the magnet pulls it flat, after unclamping it springs back.</text>
<text x="42.0" y="618.0" font-size="11.5" text-anchor="start" fill="#000">Remedy: straighten to ≤ 0.10 mm/m before grinding (op 60), grind the base first (op 70).</text>
<rect x="812.0" y="742.0" width="382.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="812.0" y1="768.0" x2="1194.0" y2="768.0" stroke="#000" stroke-width="0.8"/>
<line x1="812.0" y1="792.0" x2="1194.0" y2="792.0" stroke="#000" stroke-width="0.8"/>
<line x1="1002.0" y1="792.0" x2="1002.0" y2="824.0" stroke="#000" stroke-width="0.8"/>
<text x="820.0" y="760.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Rail profile grinding</text>
<text x="820.0" y="785.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the machine maker's data</text>
<text x="820.0" y="812.0" font-size="11.5" text-anchor="start" fill="#000">Drawing 41-09</text>
<text x="1010.0" y="806.0" font-size="11" text-anchor="start" fill="#000">Scale: none</text>
<text x="1010.0" y="819.0" font-size="11" text-anchor="start" fill="#000">guide 41 §15</text>
