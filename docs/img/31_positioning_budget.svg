<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Positioning accuracy budget – x and z (example tolerances)</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="30.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#000">Each error as ± mm; RSS = √Σe² (independent errors), worst case = Σe; both must fit the free space</text>
<text x="40.0" y="80.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#000">x – along the aisle (free gap crate ↔ upright 75 mm)</text>
<text x="330.0" y="115.0" font-size="11.5" text-anchor="end" fill="#000">crane travel positioning (laser / BPS)</text>
<rect x="340.0" y="103.0" width="27.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="372.0" y="116.0" font-size="11.5" text-anchor="start" fill="#000">± 3</text>
<text x="330.0" y="145.0" font-size="11.5" text-anchor="end" fill="#000">mast sway left at the fork</text>
<rect x="340.0" y="133.0" width="18.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="363.0" y="146.0" font-size="11.5" text-anchor="start" fill="#000">± 2</text>
<text x="330.0" y="175.0" font-size="11.5" text-anchor="end" fill="#000">rack bay position vs nominal</text>
<rect x="340.0" y="163.0" width="45.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="390.0" y="176.0" font-size="11.5" text-anchor="start" fill="#000">± 5</text>
<text x="330.0" y="205.0" font-size="11.5" text-anchor="end" fill="#000">upright straightness + beam position</text>
<rect x="340.0" y="193.0" width="27.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="372.0" y="206.0" font-size="11.5" text-anchor="start" fill="#000">± 3</text>
<text x="330.0" y="235.0" font-size="11.5" text-anchor="end" fill="#000">load position on the fork</text>
<rect x="340.0" y="223.0" width="18.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="363.0" y="236.0" font-size="11.5" text-anchor="start" fill="#000">± 2</text>
<text x="330.0" y="265.0" font-size="11.5" text-anchor="end" fill="#000">crate deformation / overhang</text>
<rect x="340.0" y="253.0" width="45.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="390.0" y="266.0" font-size="11.5" text-anchor="start" fill="#000">± 5</text>
<text x="330.0" y="301.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000">RSS</text>
<rect x="340.0" y="289.0" width="78.5" height="18.0" rx="0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="423.5" y="302.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">± 8.7</text>
<text x="330.0" y="331.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000">worst case Σ</text>
<rect x="340.0" y="319.0" width="180.0" height="18.0" rx="0" fill="#555" stroke="#555" stroke-width="1.2"/>
<text x="525.0" y="332.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">± 20</text>
<line x1="1015.0" y1="90.0" x2="1015.0" y2="344.0" stroke="#b00000" stroke-width="1.6" stroke-dasharray="6 3"/>
<text x="1020.0" y="102.0" font-size="11.5" text-anchor="start" fill="#b00000">free space 75 mm</text>
<text x="40.0" y="440.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#000">z – vertical (half the lift stroke 100 mm = 50 mm)</text>
<text x="330.0" y="475.0" font-size="11.5" text-anchor="end" fill="#000">hoist positioning</text>
<rect x="340.0" y="463.0" width="18.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="363.0" y="476.0" font-size="11.5" text-anchor="start" fill="#000">± 2</text>
<text x="330.0" y="505.0" font-size="11.5" text-anchor="end" fill="#000">carriage tilt on the mast</text>
<rect x="340.0" y="493.0" width="9.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="354.0" y="506.0" font-size="11.5" text-anchor="start" fill="#000">± 1</text>
<text x="330.0" y="535.0" font-size="11.5" text-anchor="end" fill="#000">beam level tolerance</text>
<rect x="340.0" y="523.0" width="45.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="390.0" y="536.0" font-size="11.5" text-anchor="start" fill="#000">± 5</text>
<text x="330.0" y="565.0" font-size="11.5" text-anchor="end" fill="#000">rail / floor level</text>
<rect x="340.0" y="553.0" width="27.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="372.0" y="566.0" font-size="11.5" text-anchor="start" fill="#000">± 3</text>
<text x="330.0" y="595.0" font-size="11.5" text-anchor="end" fill="#000">beam deflection under load</text>
<rect x="340.0" y="583.0" width="18.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="363.0" y="596.0" font-size="11.5" text-anchor="start" fill="#000">± 2</text>
<text x="330.0" y="625.0" font-size="11.5" text-anchor="end" fill="#000">fork deflection under load</text>
<rect x="340.0" y="613.0" width="45.0" height="18.0" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1"/>
<text x="390.0" y="626.0" font-size="11.5" text-anchor="start" fill="#000">± 5</text>
<text x="330.0" y="661.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000">RSS</text>
<rect x="340.0" y="649.0" width="74.2" height="18.0" rx="0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="419.2" y="662.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">± 8.2</text>
<text x="330.0" y="691.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000">worst case Σ</text>
<rect x="340.0" y="679.0" width="162.0" height="18.0" rx="0" fill="#555" stroke="#555" stroke-width="1.2"/>
<text x="507.0" y="692.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">± 18</text>
<line x1="790.0" y1="450.0" x2="790.0" y2="704.0" stroke="#b00000" stroke-width="1.6" stroke-dasharray="6 3"/>
<text x="795.0" y="462.0" font-size="11.5" text-anchor="start" fill="#b00000">free space 50 mm</text>
<text x="40.0" y="790.0" font-size="11.5" text-anchor="start" fill="#000">Values are planning examples – the crane maker states the positioning accuracy; the rack maker the tolerance class (EN 15620 / FEM 9.831).</text>
<rect x="774" y="764" width="414" height="54" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="774" y1="786" x2="1188" y2="786" stroke="#000" stroke-width="0.8"/><text x="782" y="780" font-size="12" font-weight="bold" fill="#000">Positioning accuracy budget – x and z (example tolerances)</text><text x="782" y="801" font-size="11.5" font-weight="bold" fill="#b00000">EXAMPLE – check the AS/RS supplier's documentation</text><text x="782" y="814" font-size="11" fill="#000">Digital twin · ASRS-RAW · guide 31 · dimensions in mm unless stated</text>
</svg>
