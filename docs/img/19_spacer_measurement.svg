<line x1="410.0" y1="330.0" x2="694.0" y2="330.0" stroke="#000" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>
<text x="664.0" y="346.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >axis</text>
<text x="410.0" y="380.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Clamping the inner rings closes the gap Lo − Li:</text>
<text x="410.0" y="398.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >longer gap (inner spacer shorter) = more preload.</text>
<text x="410.0" y="416.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Tandem pair = one bearing: use the pair mean.</text>
<text x="410.0" y="434.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Δs = (e1 + e2)/2 + (e3 + e4)/2</text>
<rect x="780.0" y="70.0" width="380.0" height="400.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="790.0" y="92.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >C  Worked example (chapter 14 / 21.3)</text>
<line x1="790.0" y1="128.0" x2="1150.0" y2="128.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="120.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >stand-outs e1 … e4</text>
<text x="1148.0" y="120.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >1.4 / 0.4 / 0.4 / 1.7 µm</text>
<line x1="790.0" y1="154.0" x2="1150.0" y2="154.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="146.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >pair A mean</text>
<text x="1148.0" y="146.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >(1.4 + 0.4)/2 = 0.90 µm</text>
<line x1="790.0" y1="180.0" x2="1150.0" y2="180.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >pair B mean</text>
<text x="1148.0" y="172.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >(0.4 + 1.7)/2 = 1.05 µm</text>
<line x1="790.0" y1="206.0" x2="1150.0" y2="206.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="198.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >required Δs</text>
<text x="1148.0" y="198.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000" >1.95 ≈ 1.9 µm</text>
<line x1="790.0" y1="232.0" x2="1150.0" y2="232.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="224.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >outer spacer Lo (4 points)</text>
<text x="1148.0" y="224.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >15.0000 mm</text>
<line x1="790.0" y1="258.0" x2="1150.0" y2="258.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="250.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >inner spacer target</text>
<text x="1148.0" y="250.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >15.0000 − 0.0019 = 14.9981</text>
<line x1="790.0" y1="284.0" x2="1150.0" y2="284.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="276.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >inner spacer lapped Li</text>
<text x="1148.0" y="276.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >14.9986 mm</text>
<line x1="790.0" y1="310.0" x2="1150.0" y2="310.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="302.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >actual Lo − Li</text>
<text x="1148.0" y="302.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >1.4 µm</text>
<line x1="790.0" y1="336.0" x2="1150.0" y2="336.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="328.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >ε = actual − required</text>
<text x="1148.0" y="328.0" font-size="12" text-anchor="end" font-weight="bold" fill="#0b6fb8" >1.4 − 1.9 = −0.5 µm</text>
<line x1="790.0" y1="362.0" x2="1150.0" y2="362.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="354.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >preload F = 400(1 + ε/8)^1.5</text>
<text x="1148.0" y="354.0" font-size="12" text-anchor="end" font-weight="bold" fill="#0b6fb8" >363 N</text>
<line x1="790.0" y1="388.0" x2="1150.0" y2="388.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="380.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >limit |ε| ≤ 1 µm</text>
<text x="1148.0" y="380.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >OK</text>
<line x1="790.0" y1="414.0" x2="1150.0" y2="414.0" stroke="#ddd" stroke-width="0.8" />
<text x="795.0" y="406.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >parallelism ≤ 1 µm</text>
<text x="1148.0" y="406.0" font-size="12" text-anchor="end" font-weight="normal" fill="#000" >0.2 µm OK</text>
<text x="790.0" y="448.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >Too long → lap again. Too short → NEW inner spacer (no shims).</text>
<rect x="20.0" y="480.0" width="750.0" height="220.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="30.0" y="502.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >D  Spacer comparison on the comparator</text>
