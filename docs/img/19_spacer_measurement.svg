<rect x="320.0" y="611.0" width="90.0" height="39.0" fill="#9a9a9a" stroke="#000" stroke-width="1" />
<text x="365.0" y="634.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >inner Li</text>
<line x1="245.0" y1="540.0" x2="245.0" y2="608.0" stroke="#000" stroke-width="2" />
<rect x="232.0" y="510.0" width="26.0" height="30.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="262.0" y="524.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >probe 0.1 µm</text>
<text x="480.0" y="530.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >1 zero on the 15 mm block (grade 0 / K)</text>
<text x="480.0" y="549.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >2 measure Lo at 4 points (0/90/180/270°)</text>
<text x="480.0" y="568.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >3 measure Li at the same 4 points</text>
<text x="480.0" y="587.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >4 Lo − Li = mean difference, parallelism = max − min</text>
<text x="480.0" y="606.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >5 uncertainty target ≤ 0.3 µm</text>
<text x="480.0" y="625.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >6 mark: serial + I / O + nose side (on the OD)</text>
<rect x="780.0" y="600.0" width="380.0" height="74.0" fill="#fff" stroke="#000" stroke-width="1.2" />
