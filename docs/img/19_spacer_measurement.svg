<text x="70.0" y="306.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" ></text>
<text x="30.0" y="250.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000" >e = offset</text>
<text x="30.0" y="264.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >inner-ring face</text>
<text x="30.0" y="278.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >to outer-ring face</text>
<text x="30.0" y="292.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >(drawn larger)</text>
<text x="30.0" y="120.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >1 soak bearing + master ≥ 12 h</text>
<text x="30.0" y="137.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >2 zero the probe on the master</text>
<text x="30.0" y="154.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >3 load the inner ring, turn it 3 ×</text>
<text x="30.0" y="171.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >4 read at 3 positions (120°), average</text>
<text x="30.0" y="188.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >5 e &gt; 0 = less preload than nominal</text>
