<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="Arial, Helvetica, sans-serif">
<title>Stand-out measurement and spacer calculation</title>
<rect x="0" y="0" width="1180" height="720" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000" >Spacer calculation: measure the stand-out of each bearing, calculate Δs = Lo − Li, lap the inner spacer, check ε</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Back-to-back (TBT) set: the lock nut clamps the INNER rings – an inner spacer SHORTER than the outer gives MORE preload (DF: the other way – check).</text>
