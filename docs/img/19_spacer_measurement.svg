<text x="260.0" y="665.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >lapped anvil</text>
<rect x="90.0" y="610.0" width="60.0" height="40.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="120.0" y="634.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >15 mm</text>
<text x="120.0" y="602.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >gauge block</text>
