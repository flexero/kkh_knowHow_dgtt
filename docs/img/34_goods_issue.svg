<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a5fb4"/></marker></defs>
<rect x="0" y="0" width="1200" height="830" fill="#ffffff"/>
<text x="14.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="bold" fill="#111111">Goods issue / line call-off – kanban signal → MES → WMS → WCS → crane → outfeed → AGV → line</text>
<text x="14.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#666666">one crate of 12 cylinder castings to VMC-01; times are examples (crane single cycle ≈ 35 s, outfeed 6 m at 0.2 m/s = 30 s, AGV trip ≈ 4 min)</text>
<rect x="1" y="803" width="1198" height="26" fill="none" stroke="#111111"/>
<text x="10.0" y="821.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#111111">EXAMPLE – check the AS/RS supplier's documentation</text>
<text x="1190.0" y="821.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" fill="#666666">Guide 34 · AS/RS raw materials – WMS / ERP / MES · values = examples (ASRS-RAW, V-compressor factory)</text>
<rect x="30.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="38.0" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">1 Kanban signal</text>
<text x="38.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">B_CYL supermarket</text>
<text x="38.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">falls to 6 (trigger)</text>
<text x="38.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">line PLC → MES</text>
<text x="105.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#0a5fb4">t = 0 s</text>
<line x1="180.0" y1="136.0" x2="197.0" y2="136.0" stroke="#111111" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="197.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="205.0" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">2 MES call-off</text>
<text x="205.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">POST /calloffs</text>
<text x="205.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">material CYL-CAST,</text>
<text x="205.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">dest VMC-01, 1 HU</text>
<text x="272.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#0a5fb4">+1 s</text>
<line x1="347.0" y1="136.0" x2="364.0" y2="136.0" stroke="#111111" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="364.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#0a5fb4" stroke-width="2"/>
<text x="372.0" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">3 WMS slot choice</text>
<text x="372.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">FIFO: oldest lot,</text>
<text x="372.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">then shortest move,</text>
<text x="372.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">reserve the quant</text>
<text x="439.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#0a5fb4">+1 s</text>
<line x1="514.0" y1="136.0" x2="531.0" y2="136.0" stroke="#111111" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="531.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#0a5fb4" stroke-width="2"/>
<text x="539.0" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">4 Transport order</text>
<text x="539.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">TO telegram RT</text>
<text x="539.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">src A01R-L2-S07</text>
<text x="539.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">dst OUT01</text>
<text x="606.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#0a5fb4">+2 s (+ queue)</text>
<line x1="681.0" y1="136.0" x2="698.0" y2="136.0" stroke="#111111" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="698.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="706.0" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">5 Crane retrieval</text>
<text x="706.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">travel + hoist,</text>
<text x="706.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">fork, lift, return</text>
<text x="706.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">single cycle ≈ 35 s</text>
<text x="773.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#0a5fb4">+40 s</text>
<line x1="848.0" y1="136.0" x2="865.0" y2="136.0" stroke="#111111" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="865.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="873.0" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">6 Outfeed + AGV</text>
<text x="873.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">conveyor 30 s,</text>
<text x="873.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">AGV pick-up,</text>
<text x="873.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">VDA 5050 order</text>
<text x="940.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#0a5fb4">+5 min</text>
<line x1="1015.0" y1="136.0" x2="1032.0" y2="136.0" stroke="#111111" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="1032.0" y="90.0" width="150.0" height="92.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="1040.0" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">7 Line + postings</text>
<text x="1040.0" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">crate at B_CYL0</text>
<text x="1040.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">MES: lot ↔ serials</text>
<text x="1040.0" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">GM 261 to ERP</text>
<text x="1107.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#0a5fb4">≈ 6 – 10 min</text>
<text x="30.0" y="245.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">Replenishment lead time RLT and kanban sizing</text>
<text x="30.0" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">RLT = MES + WMS (≈ 2 s) + queue wait (0 – 2 jobs × 35 s) + crane 35 s + outfeed 30 s + AGV trip and hand-over ≈ 6 – 10 min (example)</text>
<text x="30.0" y="288.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" xml:space="preserve" fill="#111111">number of crates in the loop  N = D × RLT × (1 + α) ÷ C</text>
<text x="30.0" y="308.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">cylinders: D = 34.4 pcs/h, RLT = 0.5 h (with reserve), α = 0.2, C = 12  →  N = 34.4 × 0.5 × 1.2 ÷ 12 = 1.72  →  2 crates</text>
<text x="30.0" y="328.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">crankshafts: D = 17.2 pcs/h, C = 6  →  N = 1.72  →  2 crates;   crankcases VC20: D = 8.6 pcs/h, C = 4  →  N = 1.29  →  2 crates</text>
<text x="30.0" y="348.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">rule: retrievals have priority over put-away (a line stop costs more than a late put-away); queue sorted by priority, then request time</text>
<text x="30.0" y="400.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">Time line of one call-off (example)</text>
<text x="30.0" y="434.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">MES + WMS + TO</text>
<rect x="300.0" y="420.0" width="6.6" height="18.0" rx="2" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
<text x="312.6" y="434.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">0 – 3 s</text>
<text x="30.0" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">queue wait (1 job ahead)</text>
<rect x="306.6" y="448.0" width="77.0" height="18.0" rx="2" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
<text x="389.6" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">3 – 38 s</text>
<text x="30.0" y="490.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">crane retrieval cycle</text>
<rect x="383.6" y="476.0" width="77.0" height="18.0" rx="2" fill="#eef3fa" stroke="#0a5fb4" stroke-width="1.2"/>
<text x="466.6" y="490.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">38 – 73 s</text>
<text x="30.0" y="518.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">outfeed conveyor 6 m</text>
<rect x="460.6" y="504.0" width="66.0" height="18.0" rx="2" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
<text x="532.6" y="518.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">73 – 103 s</text>
<text x="30.0" y="546.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">AGV pick-up + trip + drop</text>
<rect x="526.6" y="532.0" width="528.0" height="18.0" rx="2" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
<text x="1060.6" y="546.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#111111">103 – 343 s</text>
<line x1="300.0" y1="562.0" x2="300.0" y2="568.0" stroke="#111111" stroke-width="1.3"/>
<text x="300.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">0 s</text>
<line x1="432.0" y1="562.0" x2="432.0" y2="568.0" stroke="#111111" stroke-width="1.3"/>
<text x="432.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">60 s</text>
<line x1="564.0" y1="562.0" x2="564.0" y2="568.0" stroke="#111111" stroke-width="1.3"/>
<text x="564.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">120 s</text>
<line x1="696.0" y1="562.0" x2="696.0" y2="568.0" stroke="#111111" stroke-width="1.3"/>
<text x="696.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">180 s</text>
<line x1="828.0" y1="562.0" x2="828.0" y2="568.0" stroke="#111111" stroke-width="1.3"/>
<text x="828.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">240 s</text>
<line x1="960.0" y1="562.0" x2="960.0" y2="568.0" stroke="#111111" stroke-width="1.3"/>
<text x="960.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">300 s</text>
<line x1="1092.0" y1="562.0" x2="1092.0" y2="568.0" stroke="#111111" stroke-width="1.3"/>
<text x="1092.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#111111">360 s</text>
<rect x="30.0" y="610.0" width="1140.0" height="170.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="42.0" y="632.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">Errors and what the WMS does (example)</text>
<text x="42.0" y="655.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">• no stock of the material (TC 22)  → MES gets 'not available', ERP MRP gets a shortage, the planner decides (other variant / expedite)</text>
<text x="42.0" y="677.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">• crane fault / e-stop  → jobs stay queued, MES sees the growing RLT; after 10 min the shift leader starts the manual emergency retrieval plan</text>
<text x="42.0" y="699.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">• outfeed jam  → the WCS holds the next retrievals, no new TO until the conveyor is free</text>
<text x="42.0" y="721.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">• wrong crate at the line (RFID check at the AGV station)  → no hand-over, crate goes back, deviation in the WMS (stock accuracy KPI)</text>
<text x="42.0" y="743.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">• blocked lot (quality hold)  → never chosen; FIFO takes the next free lot</text>
</svg>