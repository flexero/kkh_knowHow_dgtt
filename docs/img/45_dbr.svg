<text x="380" y="92" font-size="14" text-anchor="start" font-weight="700" fill="#1f6fd1">ROPE: release a bar lot only when the drum schedule needs it</text>
<text x="380" y="112" font-size="13" text-anchor="start" fill="#1f6fd1">release time = drum start − (upstream work + buffer)</text>
<text x="60" y="400" font-size="13" text-anchor="start" fill="#000">Why: the plant can only make what the bottleneck makes. Lots released earlier only wait (WIP, lead time, damage risk).</text>
<text x="60" y="424" font-size="13" text-anchor="start" fill="#000">Drum = the sequence on the bottleneck (here with set-up families, rule FAM or EDD).</text>
<text x="60" y="448" font-size="13" text-anchor="start" fill="#000">Buffer = a time buffer in front of the drum (example 16 h = 2 shifts) so that a breakdown upstream does not starve the drum.</text>
<text x="60" y="472" font-size="13" text-anchor="start" fill="#000">Rope = the release signal: MES releases lot i at  r_i = S_drum,i − (Σ p_upstream,i + B).</text>
<text x="60" y="496" font-size="13" text-anchor="start" fill="#000">Example: drum start in 40 h, upstream work 9 h, buffer 16 h → release in 40 − 9 − 16 = 15 h (not now).</text>
<text x="60" y="520" font-size="13" text-anchor="start" fill="#000">The MES runs the schedule twice: pass 1 finds the drum starts, pass 2 schedules with the new release times.</text>
<text x="60" y="544" font-size="13" text-anchor="start" fill="#000">Check in the page (section 3): DBR on → 'lots released later', mean WIP falls, BS-TGR utilisation stays.</text>
<rect x="770" y="766" width="406" height="48" fill="#fff" stroke="#000" stroke-width="1.4"/>
