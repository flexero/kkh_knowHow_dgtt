ext x="330" y="646" font-size="12.5" text-anchor="start" fill="#000">U16 / U32</text><text x="410" y="646" font-size="12.5" text-anchor="start" fill="#000">gateway FC16</text><text x="700" y="646" font-size="12.5" text-anchor="start" fill="#000">D223 – D225</text><text x="820" y="646" font-size="12.5" text-anchor="start" fill="#000">…</text><text x="1040" y="646" font-size="12.5" text-anchor="start" fill="#000"></text><rect x="24" y="660" width="1150" height="38" rx="0" fill="#f3f3f3" stroke="#000" stroke-width="0.8"/><text x="30" y="684" font-size="13" text-anchor="start" font-weight="700" fill="#000">226</text><text x="110" y="684" font-size="13" text-anchor="start" fill="#000">cmd.gwHeartbeat (V1.1)</text><text x="330" y="684" font-size="12.5" text-anchor="start" fill="#000">UINT16</text><text x="410" y="684" font-size="12.5" text-anchor="start" fill="#1f6fd1">GATEWAY FC06 +1 per s → I1 watchdog</text><text x="700" y="684" font-size="12.5" text-anchor="start" fill="#000">D226</text><text x="820" y="684" font-size="12.5" text-anchor="start" fill="#000">…cmd_gwHeartbeat</text><text x="1040" y="684" font-size="12.5" text-anchor="start" fill="#000">1 s (write)</text><text x="30" y="716" font-size="13" text-anchor="start" fill="#000">Blocks: FAST 0 – 11 (light blue) · COUNTERS + PROCESS 20 – 99 · ENERGY 100 – 103 · COMMAND 200 – 226 (grey, the only writable block).</text><text x="30" y="736" font-size="13" text-anchor="start" fill="#000">Gaps (12 – 19, 104 – 199) read as 0. 32-bit values start on EVEN offsets. 0-based offsets: offset 0 = 400001 in 1-based tools.</text><text x="30" y="756" font-size="13" text-anchor="start" fill="#000">Delta: the D register number IS the offset – keep D0 … D226 for the image. Siemens: "MB_HR" non-optimized DB = MB_HOLD_REG of MB_SERVER.</text><text x="30" y="778" font-size="13" text-anchor="start" fill="#1f6fd1">Accent = typical traps: bit numbering, toggle bits, rung order, word swap, watchdog.</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>