<text x="564" y="556" font-size="12" font-family="Courier New, monospace" fill="#000">F = S × pitch = 382 × 1.5</text>
<text x="564" y="575" font-size="12" fill="#000">spindle reverses at Z</text>
<text x="564" y="594" font-size="12" fill="#000">Siemens: CYCLE84 / G331-G332</text>
