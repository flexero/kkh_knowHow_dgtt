<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" width="1180" height="740" font-family="Arial, Helvetica, sans-serif">
<title>Runout test with test mandrel and two-plane balancing set-up</title>
<rect x="0" y="0" width="1180" height="740" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#000" >Runout check with the test mandrel (step 20) and two-plane balancing of the rotor unit (step 12)</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Example limits: taper ≤ 2 µm, 300 mm ≤ 5 µm (check ISO 10791-1 / contract); balance G 1.0 at 12 000 rpm, m = 16 kg → U_per 12.73 g·mm.</text>
<rect x="20.0" y="70.0" width="560.0" height="400.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="30.0" y="92.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >A  Test mandrel HSK-A63 × 300 mm + probes on frame J11</text>
<rect x="40.0" y="180.0" width="170.0" height="140.0" fill="#d9d9d9" stroke="#000" stroke-width="1" />
<text x="125.0" y="210.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >spindle (nose right)</text>
<rect x="210.0" y="210.0" width="14.0" height="80.0" fill="#b3b3b3" stroke="#000" stroke-width="1" />
<rect x="224.0" y="234.0" width="330.0" height="32.0" fill="#fff" stroke="#000" stroke-width="1.4" />
<line x1="30.0" y1="250.0" x2="570.0" y2="250.0" stroke="#000" stroke-width="0.6" stroke-dasharray="10,3,2,3"/>
<text x="390.0" y="254.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >test mandrel</text>
<line x1="240.0" y1="234.0" x2="240.0" y2="180.0" stroke="#0b6fb8" stroke-width="2" />
<rect x="232.0" y="154.0" width="16.0" height="26.0" fill="#fff" stroke="#0b6fb8" stroke-width="1.5" />
<text x="240.0" y="146.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b6fb8" >A  z ≈ 10 mm</text>
<line x1="530.0" y1="234.0" x2="530.0" y2="180.0" stroke="#0b6fb8" stroke-width="2" />
<rect x="522.0" y="154.0" width="16.0" height="26.0" fill="#fff" stroke="#0b6fb8" stroke-width="1.5" />
<text x="530.0" y="146.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b6fb8" >B  z = 300 mm</text>
<rect x="232.0" y="120.0" width="310.0" height="10.0" fill="#f2f2f2" stroke="#000" stroke-width="1" />
<text x="390.0" y="114.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >frame J11 (stiff, short)</text>
<line x1="381.0" y1="290.0" x2="232.0" y2="290.0" stroke="#000" stroke-width="0.8" />
<polygon points="232.0,290.0 236.6,288.1 236.6,291.9" fill="#000" stroke="#000" stroke-width="0.5" />
<line x1="381.0" y1="290.0" x2="530.0" y2="290.0" stroke="#000" stroke-width="0.8" />
<polygon points="530.0,290.0 525.4,291.9 525.4,288.1" fill="#000" stroke="#000" stroke-width="0.5" />
<text x="381.0" y="286.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >300 mm</text>
<text x="30.0" y="340.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Procedure</text>
<text x="30.0" y="359.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >1 clean taper + mandrel, clamp with the spindle clamping</text>
<text x="30.0" y="378.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >2 turn slowly, TIR = max − min at A and at B</text>
<text x="30.0" y="397.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >3 index the mandrel 0 / 90 / 180 / 270° in the taper, average</text>
<text x="30.0" y="416.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >4 tilt = (TIR_B − TIR_A) / 2 / 300 mm, e.g. (4.5 − 1.5)/2/300 = 5 µrad</text>
<text x="30.0" y="435.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >5 probe ≤ 1/10 of the tolerance (0.1–0.2 µm), 20 °C</text>
<rect x="590.0" y="70.0" width="570.0" height="190.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="600.0" y="92.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >B  Runout budget at the taper (example)</text>
<text x="600.0" y="124.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >taper to bearing seats (shaft)</text>
<rect x="830.0" y="112.0" width="90.0" height="16.0" fill="#f2f2f2" stroke="#000" stroke-width="1" />
<text x="926.0" y="124.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >1.0 µm</text>
<text x="600.0" y="148.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >mounted bearing set</text>
<rect x="830.0" y="136.0" width="108.0" height="16.0" fill="#d9d9d9" stroke="#000" stroke-width="1" />
<text x="944.0" y="148.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >1.2 µm</text>
<text x="600.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >nut face residual → tilt</text>
<rect x="830.0" y="160.0" width="54.0" height="16.0" fill="#b3b3b3" stroke="#000" stroke-width="1" />
<text x="890.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >0.6 µm</text>
<text x="600.0" y="196.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >measurement</text>
<rect x="830.0" y="184.0" width="45.0" height="16.0" fill="#888" stroke="#000" stroke-width="1" />
<text x="881.0" y="196.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >0.5 µm</text>
<rect x="830.0" y="208.0" width="157.5" height="16.0" fill="#0b6fb8" stroke="#000" stroke-width="1" />
<text x="600.0" y="220.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >RSS = √(Σ c²)</text>
<text x="993.5" y="220.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >1.75 µm  (worst case 3.3)</text>
<line x1="1010.0" y1="106.0" x2="1010.0" y2="204.0" stroke="#000" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="1014.0" y="116.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >limit 2 µm</text>
<rect x="590.0" y="270.0" width="570.0" height="200.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="600.0" y="292.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000" >C  Balancing machine E16 – rotor unit in its own bearings</text>
<rect x="620.0" y="360.0" width="70.0" height="60.0" fill="#d9d9d9" stroke="#000" stroke-width="1" />
<rect x="690.0" y="378.0" width="300.0" height="24.0" fill="#fff" stroke="#000" stroke-width="1" />
<rect x="770.0" y="354.0" width="130.0" height="72.0" fill="#b3b3b3" stroke="#000" stroke-width="1" />
<rect x="990.0" y="372.0" width="40.0" height="36.0" fill="#f2f2f2" stroke="#000" stroke-width="1" />
