<polygon points="137.5,649.6 138.4,642.7 143.1,645.4" fill="#0b6fb8" stroke="#0b6fb8" stroke-width="0.5" />
<text x="202.0" y="576.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" stroke="#ffffff" stroke-width="4" paint-order="stroke">heavy spot</text>
<text x="30.0" y="716.0" font-size="11" text-anchor="start" font-weight="bold" fill="#0b6fb8" >blue: 1.28 g ∠210°</text>
<text x="144.0" y="678.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#0b6fb8" >0.65 g</text>
<text x="270.0" y="530.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >U0 = 71 g·mm ∠40° (heavy spot)</text>
<text x="270.0" y="550.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >m = U / r = 71 / 38 = 1.87 g at 220°</text>
<text x="270.0" y="570.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >holes every 30° → use 210° and 240°:</text>
<text x="270.0" y="590.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >m1 = m·sin β2 / sin(β1+β2) = 1.28 g ∠210°</text>
<text x="270.0" y="610.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >m2 = m·sin β1 / sin(β1+β2) = 0.65 g ∠240°</text>
<text x="270.0" y="630.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >(β1 = 10°, β2 = 20°) – resultant 1.87 g ∠220°</text>
<text x="270.0" y="650.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Plane allocation (ISO 21940-11):</text>
<text x="270.0" y="670.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >U_A = 12.73 × 169 / 326.5 = 6.59 g·mm</text>
<text x="270.0" y="690.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >U_B = 12.73 × 157.5 / 326.5 = 6.14 g·mm</text>
