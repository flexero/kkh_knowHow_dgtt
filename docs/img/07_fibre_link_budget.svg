<text x="720.0" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">budget 7.5 dB · loss 4.2 dB · margin 3.3 dB ≥ 3 dB → OK but tight</text>
<rect x="20.0" y="580.0" width="900.0" height="190.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="30.0" y="604.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">Formulas</text>
<text x="30.0" y="630.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">power budget  P_B = P_Tx,min − P_Rx,sensitivity            (SFP datasheet; IEEE values used here)</text>
<text x="30.0" y="651.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">link loss         A = α × L + n_c × a_c + n_s × a_s</text>
<text x="30.0" y="672.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">margin           M = P_B − A ≥ 3 dB design reserve (ageing, repairs, dirty connectors)</text>
<text x="30.0" y="693.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">planning values: a_c = 0.75 dB per mated connector pair · a_s = 0.3 dB (fusion splice, typical 0.1)</text>
<text x="30.0" y="714.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">α: OM3 3.5 dB/km @ 850 nm · OS2 0.4 dB/km @ 1 310 nm · also check the max. length of the standard</text>
<text x="30.0" y="735.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">acceptance (T-N2): measured loss with light source + power meter must be &lt; calculated A</text>
<rect x="950.0" y="580.0" width="430.0" height="190.0" rx="4" fill="#e3eefb" stroke="#000" stroke-width="1.2"/>
<text x="960.0" y="604.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">Values used</text>
<text x="960.0" y="630.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1000BASE-SX: Tx min −9.5 dBm, sens. −17 dBm</text>
<text x="960.0" y="651.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1000BASE-LX: Tx min −11.5 dBm, sens. −19 dBm</text>
<text x="960.0" y="672.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">→ both 7.5 dB budget (check your SFP)</text>
<text x="960.0" y="693.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">100BASE-FX MM 2 km: 2 × 1.5 + 2 × 0.75 = 4.5 dB</text>
<text x="960.0" y="714.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">POF ≤ 50 m · PCF ≤ 100 m (PROFINET)</text>
<text x="960.0" y="735.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">clean every connector before plugging</text>
