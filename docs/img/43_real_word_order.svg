<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Word order + data types – drawing 43-05</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Data types on 16-bit registers – REAL word order ABCD vs CDAB, UINT32, ASCII</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Modbus only knows 16-bit registers. A 32-bit value needs 2 registers – and both sides must agree on the ORDER</text><text x="24" y="100" font-size="14" text-anchor="start" font-weight="bold" fill="#000">REAL (IEEE 754, 32 bit): lastCycle_s = 570.8 s  →  0x440EB333  (bytes A B C D)</text><rect x="60" y="116" width="90" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="105" y="140" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">44</text><text x="105" y="158" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">A</text><rect x="150" y="116" width="90" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="195" y="140" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">0E</text><text x="195" y="158" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">B</text><rect x="240" y="116" width="90" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="285" y="140" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">B3</text><text x="285" y="158" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">C</text><rect x="330" y="116" width="90" height="50" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="375" y="140" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">33</text><text x="375" y="158" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">D</text><text x="440" y="136" font-size="12" text-anchor="start" font-weight="normal" fill="#000">sign 0 · exponent 0x88 = 136 → 2^9 · mantissa 1.1148…</text><text x="440" y="156" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1.11484375 × 512 = 570.8 (float32 keeps ≈ 7 digits)</text><rect x="24" y="210" width="560" height="230" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="36" y="234" font-size="13" text-anchor="start" font-weight="bold" fill="#1565c0">Our map: ABCD (big-endian words, high word first)</text><rect x="60" y="256" width="200" height="52" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.2"/><text x="160" y="288" font-size="20" text-anchor="middle" font-weight="bold" fill="#1565c0">0x440E</text><text x="160" y="326" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">register 24 = A B</text><rect x="290" y="256" width="200" height="52" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.2"/><text x="390" y="288" font-size="20" text-anchor="middle" font-weight="bold" fill="#1565c0">0xB333</text><text x="390" y="326" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">register 25 = C D</text><text x="36" y="360" font-size="14" text-anchor="start" font-weight="bold" fill="#000">gateway reads A B C D → 570.8  ✓</text><text x="36" y="386" font-size="12" text-anchor="start" font-weight="normal" fill="#000">State it in the register map: "REAL, 2 registers, ABCD".</text><text x="36" y="406" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Many PLCs call it big-endian / no swap; others need a swap flag.</text><rect x="616" y="210" width="560" height="230" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="628" y="234" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Wrong setting: device sends CDAB (word swap)</text><rect x="652" y="256" width="200" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="752" y="288" font-size="20" text-anchor="middle" font-weight="bold" fill="#000">0xB333</text><text x="752" y="326" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">register 24 = C D</text><rect x="882" y="256" width="200" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="982" y="288" font-size="20" text-anchor="middle" font-weight="bold" fill="#000">0x440E</text><text x="982" y="326" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">register 25 = A B</text><text x="628" y="360" font-size="14" text-anchor="start" font-weight="bold" fill="#000">gateway reads as ABCD → -4.174e-08  ✗ garbage</text><text x="628" y="386" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Typical signs: tiny numbers (1e-41), huge numbers (4e8),</text><text x="628" y="406" font-size="12" text-anchor="start" font-weight="normal" fill="#000">values that jump wildly. Test with a known value (e.g. 20.0 °C).</text><rect x="24" y="470" width="560" height="150" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="494" font-size="13" text-anchor="start" font-weight="bold" fill="#000">UINT32: good = 2120 pcs (registers 20 – 21)</text><text x="36" y="524" font-size="12" text-anchor="start" font-weight="normal" fill="#000">2120 = 0x00000848 → register 20 = 0x0000 (high), 21 = 0x0848 (low)</text><text x="36" y="548" font-size="12" text-anchor="start" font-weight="normal" fill="#000">value = reg20 × 65 536 + reg21 = 0 × 65 536 + 2120</text><text x="36" y="572" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Counter rolls over at 4 294 967 295 – compute differences modulo 2^32.</text><text x="36" y="596" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Read both registers in ONE request, so both words belong together.</text><rect x="616" y="470" width="560" height="150" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="628" y="494" font-size="13" text-anchor="start" font-weight="bold" fill="#000">ASCII20: order "WO-00001-L01" (registers 26 – 35)</text><text x="628" y="524" font-size="12" text-anchor="start" font-weight="normal" fill="#000">2 characters per register, first character in the HIGH byte:</text><text x="628" y="548" font-size="12" text-anchor="start" font-weight="bold" fill="#000" xml:space="preserve">574F  2D30  3030  3031  2D4C  3031  0000 …</text><text x="628" y="572" font-size="12" text-anchor="start" font-weight="normal" fill="#000">'W' = 0x57, 'O' = 0x4F → register 26 = 0x574F; pad with 0x00</text><text x="628" y="596" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Some devices swap the bytes ("OW") – test with a known text.</text><text x="24" y="660" font-size="12" text-anchor="start" font-weight="normal" fill="#000">UINT16 = 1 register (0 … 65 535) · INT16 = two's complement · scaled integers (e.g. 0.1 °C units) are an</text><text x="24" y="678" font-size="12" text-anchor="start" font-weight="normal" fill="#000">alternative to REAL – then the map must state the scale. REAL / UINT32 start at an EVEN offset in our map.</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Word order + data types</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-05  ·  guide 43 §7</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
