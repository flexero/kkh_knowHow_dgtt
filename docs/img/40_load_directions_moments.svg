<text x="94.0" y="140.0" font-size="11.5" text-anchor="start" fill="#000">z rail axis (travel)</text>
<text x="700.0" y="70.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Equivalent load of ONE block (catalogue form)</text>
<text x="700.0" y="94.0" font-size="12" text-anchor="start" fill="#000">P = |F_r| + |F_l| + C0 · ( |M_R|/M0R + |M_P|/M0P + |M_Y|/M0Y )</text>
<text x="700.0" y="113.0" font-size="12" text-anchor="start" fill="#000">size 25: C0 = 52.8 kN, M0R = 640, M0P = M0Y = 470 N·m</text>
<text x="700.0" y="132.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="700.0" y="151.0" font-size="12" text-anchor="start" fill="#000">Example: F_r = 2 000 N, F_l = 500 N,</text>
<text x="700.0" y="170.0" font-size="12" text-anchor="start" fill="#000">M_R = 20, M_P = 15, M_Y = 10 N·m:</text>
<text x="700.0" y="189.0" font-size="12" text-anchor="start" fill="#000">P = 2 000 + 500 + 52 800 · (0.03125 + 0.0319 + 0.0213)</text>
<text x="700.0" y="208.0" font-size="12" text-anchor="start" fill="#000">  = 2 500 + 4 459 = 6 959 N</text>
<text x="700.0" y="227.0" font-size="12" text-anchor="start" fill="#000">Life (ball, 50 km basis), fw = 1.2:</text>
<text x="700.0" y="246.0" font-size="12" text-anchor="start" fill="#000">L = (C / (fw·P))³ · 50 = (34 900 / 8 350)³ · 50 = 3 651 km</text>
<text x="700.0" y="290.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Two rails × two blocks: moments become forces</text>
<text x="700.0" y="314.0" font-size="12" text-anchor="start" fill="#000">Weight W = m·g centred: each block W/4</text>
<text x="700.0" y="333.0" font-size="12" text-anchor="start" fill="#000">  600 · 9.81 / 4 = 1 472 N  (radial)</text>
<text x="700.0" y="352.0" font-size="12" text-anchor="start" fill="#000">Lateral force F_L at height h, rail spacing a:</text>
<text x="700.0" y="371.0" font-size="12" text-anchor="start" fill="#000">  ± F_L·h / (2a) = 3 000 · 350 / 1 000 = ± 1 050 N</text>
<text x="700.0" y="390.0" font-size="12" text-anchor="start" fill="#000">Axial force F_x at height h, block spacing b:</text>
<text x="700.0" y="409.0" font-size="12" text-anchor="start" fill="#000">  ± F_x·h / (2b) = 4 000 · 350 / 800 = ± 1 750 N</text>
<text x="700.0" y="428.0" font-size="12" text-anchor="start" fill="#000">  lateral per block F_L/4 = 750 N</text>
<text x="700.0" y="447.0" font-size="12" text-anchor="start" fill="#000">Worst block: P = 1 472 + 1 050 + 1 750 + 750 = 5 022 N</text>
<text x="700.0" y="466.0" font-size="12" text-anchor="start" fill="#000">Static safety fs = C0 / P0 = 52 800 / 5 022 = 10.5</text>
<text x="700.0" y="520.0" font-size="12" text-anchor="start" fill="#000">Rules:</text>
<text x="700.0" y="539.0" font-size="12" text-anchor="start" fill="#000">• Single block or 2 blocks close together: moments act</text>
<text x="700.0" y="558.0" font-size="12" text-anchor="start" fill="#000">  on the block itself → use the M0 terms (+ contact factor fc).</text>
<text x="700.0" y="577.0" font-size="12" text-anchor="start" fill="#000">• Blocks far apart on 2 rails: compute the block forces</text>
<text x="700.0" y="596.0" font-size="12" text-anchor="start" fill="#000">  from statics (above) – no M0 terms needed.</text>
<text x="700.0" y="615.0" font-size="12" text-anchor="start" fill="#000">• Load factor fw: 1.0 – 1.2 smooth, 1.2 – 1.5 normal,</text>
<text x="700.0" y="634.0" font-size="12" text-anchor="start" fill="#000">  1.5 – 3.0 impact / vibration (example values).</text>
