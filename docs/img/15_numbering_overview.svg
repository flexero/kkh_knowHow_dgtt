<text x="24" y="56" font-size="12" text-anchor="start" fill="#555" xml:space="preserve">Arrows = links stored in MES / ERP / PDM records. Formats from guide 15 chapter 3; all values are examples (GS1 prefix 952 = demo only).</text>
