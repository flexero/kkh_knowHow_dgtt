<rect x="313.4" y="508" width="153.2" height="16" rx="0" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="390" y="520" font-size="12" text-anchor="middle" fill="#c62828" xml:space="preserve">made from (lot → heat)</text>
<line x1="700" y1="480" x2="700" y2="558" stroke="#000" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="649.8" y="508" width="100.39999999999999" height="16" rx="0" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="700" y="520" font-size="12" text-anchor="middle" fill="#000" xml:space="preserve">processed with</text>
<line x1="800" y1="480" x2="1100" y2="558" stroke="#000" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="966.4" y="508" width="87.19999999999999" height="16" rx="0" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="1010" y="520" font-size="12" text-anchor="middle" fill="#000" xml:space="preserve">processed on</text>
<text x="40" y="790" font-size="13" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">Trace back in one line (guide 15 §3.18):</text>
<text x="40" y="812" font-size="13" text-anchor="start" fill="#c62828" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">VC20-2546-00123 → WO-2546-0004 → LOT-CC20-2546-003 → PO-2545-0011 → batch F-88213 → heat H41137</text>
<text x="40" y="834" font-size="13" text-anchor="start" fill="#000" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Trace forward: heat H41137 → all lots with this heat → all serials → shipments (SSCC) → customers</text>
<text x="40" y="862" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">Rule: one thing = one ID, fixed for life, same text in every system. Equipment ID (HMC-01 = role) ≠ serial of the machine (HMC-2546-00001).</text>
