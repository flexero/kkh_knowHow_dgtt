<path d="M260.216,118.08000000000004 A14.783999999999999,14.783999999999999 0 0 1 289.784,118.08000000000004" fill="none" stroke="#1f6fd1" stroke-width="1.6"/>
<line x1="289.8" y1="118.1" x2="289.8" y2="353.7" stroke="#1f6fd1" stroke-width="1.6"/>
<rect x="257.0" y="353.7" width="120.0" height="66.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="317.0" y="386.7" font-size="11" text-anchor="middle" fill="#000">lifting carriage</text>
<rect x="257.0" y="417.7" width="170.0" height="6.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<line x1="393.0" y1="403.2" x2="393.0" y2="463.2" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<text x="401.0" y="443.2" font-size="11.5" text-anchor="start" fill="#1f6fd1">m (g + a) = 900 × 10.31 = 9 279 N</text>
<text x="293.0" y="244.8" font-size="11.5" text-anchor="start" fill="#1f6fd1">2 ropes Ø8, 4 640 N each</text>
<text x="600.0" y="70.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Rope + drum (example)</text>
<text x="600.0" y="89.0" font-size="11.5" text-anchor="start" fill="#000">rope force total F = m (g + a) = 900 × (9.81 + 0.5) = 9 279 N</text>
<text x="600.0" y="108.0" font-size="11.5" text-anchor="start" fill="#000">per rope 4 640 N; MBF ≥ 40 kN each</text>
<text x="600.0" y="127.0" font-size="11.5" text-anchor="start" fill="#000">safety factor Z_p = 2 × 40 000 / 9 279 = 8.6</text>
<text x="600.0" y="146.0" font-size="11.5" text-anchor="start" fill="#000">(min. 4.5 for group M5 per ISO 16625 / FEM 1.001 –</text>
<text x="600.0" y="165.0" font-size="11.5" text-anchor="start" fill="#000"> check EN 528 + the crane maker; many use ≥ 6–8)</text>
<text x="600.0" y="184.0" font-size="11.5" text-anchor="start" fill="#000">D/d drum = 250 / 8 = 31   ·   D/d pulley = 320 / 8 = 40</text>
<text x="600.0" y="203.0" font-size="11.5" text-anchor="start" fill="#000">drum speed n = 1.0 / (π × 0.25) × 60 = 76 rpm</text>
<text x="600.0" y="222.0" font-size="11.5" text-anchor="start" fill="#000">drum torque = 9 279 × 0.125 = 1 160 N·m</text>
<text x="600.0" y="241.0" font-size="11.5" text-anchor="start" fill="#000">lift 7.7 m → 7.7 / (π × 0.25) + 3 dead turns = 12.8 turns</text>
<text x="600.0" y="260.0" font-size="11.5" text-anchor="start" fill="#000">groove pitch 9 → 115 mm grooved section per rope</text>
<text x="600.0" y="279.0" font-size="11.5" text-anchor="start" fill="#000">fleet angle ≈ 58 mm / 8.5 m = 0.4° (limit 1.5–4°)</text>
<text x="600.0" y="298.0" font-size="11.5" text-anchor="start" fill="#000">hoist power P = 900 × 9.81 × 1.0 / 0.85 = 10.4 kW → 11 kW</text>
<text x="600.0" y="317.0" font-size="11.5" text-anchor="start" fill="#000">drum shaft Ø80 42CrMo4: σ_v ≈ 34 MPa</text>
<text x="600.0" y="355.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Safety devices</text>
<text x="600.0" y="374.0" font-size="11.5" text-anchor="start" fill="#000">2 ropes (one can hold the load), load pins → overload</text>
<text x="600.0" y="393.0" font-size="11.5" text-anchor="start" fill="#000">+ slack rope, safety catch on the carriage, brake test</text>
<text x="600.0" y="412.0" font-size="11.5" text-anchor="start" fill="#000">rope inspection + discard per ISO 4309</text>
<rect x="600.0" y="470.0" width="560.0" height="260.0" rx="0" fill="none" stroke="#000" stroke-width="1.0" stroke-dasharray="6 3"/>
<text x="612.0" y="492.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Alternative: steel-cord PU toothed belt</text>
<circle cx="680.0" cy="600.0" r="34.0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="680.0" y="604.0" font-size="11" text-anchor="middle" fill="#000">pinion</text>
