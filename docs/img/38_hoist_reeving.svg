<text x="170.0" y="729.6" font-size="11" text-anchor="middle" fill="#000">drum Ø250</text>
<rect x="60.0" y="680.4" width="70.0" height="19.8" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="95.0" y="674.4" font-size="11" text-anchor="middle" fill="#000">11 kW + brake</text>
