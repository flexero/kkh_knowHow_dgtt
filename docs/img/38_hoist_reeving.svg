<line x1="667.0" y1="631.4" x2="664.7" y2="637.0" stroke="#000" stroke-width="2"/>
<line x1="656.0" y1="624.0" x2="651.7" y2="628.3" stroke="#000" stroke-width="2"/>
<line x1="648.6" y1="613.0" x2="643.0" y2="615.3" stroke="#000" stroke-width="2"/>
