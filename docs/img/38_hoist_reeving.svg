<line x1="656.0" y1="576.0" x2="651.7" y2="571.7" stroke="#000" stroke-width="2"/>
<line x1="667.0" y1="568.6" x2="664.7" y2="563.0" stroke="#000" stroke-width="2"/>
<line x1="680.0" y1="566.0" x2="680.0" y2="560.0" stroke="#000" stroke-width="2"/>
<line x1="693.0" y1="568.6" x2="695.3" y2="563.0" stroke="#000" stroke-width="2"/>
<line x1="704.0" y1="576.0" x2="708.3" y2="571.7" stroke="#000" stroke-width="2"/>
<line x1="711.4" y1="587.0" x2="717.0" y2="584.7" stroke="#000" stroke-width="2"/>
<rect x="716.0" y="520.0" width="8.0" height="190.0" rx="0" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="732.0" y="530.0" font-size="11" text-anchor="start" fill="#000">belt fixed at both ends (top + carriage),</text>
<text x="732.0" y="548.0" font-size="11" text-anchor="start" fill="#000">pinion drive on the bottom carriage</text>
<text x="740.0" y="590.0" font-size="11" text-anchor="start" fill="#000">+ no lubrication, no drum, low stretch, quiet</text>
<text x="740.0" y="608.0" font-size="11" text-anchor="start" fill="#000">+ no rope discard inspection per ISO 4309</text>
<text x="740.0" y="626.0" font-size="11" text-anchor="start" fill="#000">– own inspection rules (cord breaks, tooth wear)</text>
<text x="740.0" y="644.0" font-size="11" text-anchor="start" fill="#000">– sensitive to oil, heat, sharp edges</text>
<text x="740.0" y="662.0" font-size="11" text-anchor="start" fill="#000">the page example uses ROPES (classic, widely</text>
<text x="740.0" y="680.0" font-size="11" text-anchor="start" fill="#000">known); ask the maker which one they use</text>
<rect x="774.0" y="752.0" width="414.0" height="66.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="774.0" y1="774.0" x2="1188.0" y2="774.0" stroke="#000" stroke-width="0.8"/>
<line x1="844.0" y1="752.0" x2="844.0" y2="774.0" stroke="#000" stroke-width="0.8"/>
<text x="782.0" y="768.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">38-06</text>
<text x="852.0" y="768.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Hoist – rope reeving 1:1 and toothed-belt option</text>
<text x="782.0" y="791.0" font-size="12" text-anchor="start" fill="#b00000" font-weight="bold">EXAMPLE – check the crane maker's drawings</text>
<text x="782.0" y="809.0" font-size="11" text-anchor="start" fill="#000">Digital twin · ASRS-RAW stacker crane · guide 38 · not to scale · mm</text>
