<text x="800.0" y="226.0" font-size="11.5" text-anchor="start" fill="#000">H, W: height and width of the assembly against</text>
<text x="800.0" y="244.0" font-size="11.5" text-anchor="start" fill="#000">the rail datum faces (tolerance of one block).</text>
<text x="800.0" y="262.0" font-size="11.5" text-anchor="start" fill="#000">ΔH, ΔW: variation between blocks on the same</text>
<text x="800.0" y="280.0" font-size="11.5" text-anchor="start" fill="#000">rail / on the matched rails of one machine.</text>
<text x="800.0" y="298.0" font-size="11.5" text-anchor="start" fill="#000">Use: N – handling, H – general machine tools,</text>
<text x="800.0" y="316.0" font-size="11.5" text-anchor="start" fill="#000">P – precision MT / grinding, SP / UP – measuring.</text>
<text x="800.0" y="334.0" font-size="11.5" text-anchor="start" fill="#000">Matched sets: order rails of one machine as a</text>
<text x="800.0" y="352.0" font-size="11.5" text-anchor="start" fill="#000">pair with the same class + preload (marked).</text>
<text x="20.0" y="530.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">How running parallelism is measured (item 5 quality)</text>
<rect x="60.0" y="700.0" width="640.0" height="24.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="66.0" y="742.0" font-size="11.5" text-anchor="start" fill="#000">surface plate / bed</text>
<rect x="80.0" y="676.0" width="600.0" height="24.0" rx="0" fill="url(#hatch2)" stroke="#000" stroke-width="1.2"/>
<text x="86.0" y="670.0" font-size="11.5" text-anchor="start" fill="#000">rail (bolted, datum side towards the viewer)</text>
<rect x="330.0" y="644.0" width="90.0" height="32.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="375.0" y="664.0" font-size="11.5" text-anchor="middle" fill="#000">block</text>
<rect x="352.0" y="590.0" width="46.0" height="54.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="375.0" cy="590.0" r="16.0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="375.0" y1="590.0" x2="383.0" y2="580.0" stroke="#000" stroke-width="1.2"/>
<text x="410.0" y="590.0" font-size="11.5" text-anchor="start" fill="#000">dial gauge / probe on the block</text>
<line x1="420.0" y1="660.0" x2="560.0" y2="660.0" stroke="#1f6fd1" stroke-width="2" marker-end="url(#eab)"/>
<text x="566.0" y="664.0" font-size="11.5" text-anchor="start" fill="#1f6fd1">move over the length</text>
<line x1="375.0" y1="606.0" x2="375.0" y2="700.0" stroke="#000" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="740.0" y="560.0" font-size="11.5" text-anchor="start" fill="#000">C: change of the block TOP height over the travel</text>
<text x="740.0" y="578.0" font-size="11.5" text-anchor="start" fill="#000">(probe on the rail-bottom reference / plate).</text>
<text x="740.0" y="596.0" font-size="11.5" text-anchor="start" fill="#000">D: change of the block SIDE over the travel</text>
<text x="740.0" y="614.0" font-size="11.5" text-anchor="start" fill="#000">(probe on the rail datum side).</text>
<text x="740.0" y="632.0" font-size="11.5" text-anchor="start" fill="#000">Running parallelism = max − min of C and of D.</text>
<text x="740.0" y="650.0" font-size="11.5" text-anchor="start" fill="#000">It depends on the rail length (rail straightness</text>
<text x="740.0" y="668.0" font-size="11.5" text-anchor="start" fill="#000">after bolting follows the bed!).</text>
