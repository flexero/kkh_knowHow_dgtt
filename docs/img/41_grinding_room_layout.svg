<text x="20.0" y="660.0" font-size="11.5" text-anchor="start" fill="#000">Rules (example): no doors directly to the outside; parts soak ≥ 4 h before thread grinding and lead measurement;</text>
<text x="20.0" y="678.0" font-size="11.5" text-anchor="start" fill="#000">machines with own oil cooling; no sun, no hot hydraulic units in the room; temperature logged (Modbus TCP → MES).</text>
