<text x="280" y="150" font-size="20" text-anchor="start" font-weight="700" fill="#000">BS-3210-1000-C5</text>
<text x="280" y="180" font-size="16" text-anchor="start" fill="#000">SN BS3210-261113-0042</text>
<text x="280" y="205" font-size="15" text-anchor="start" fill="#000">LOT WO-00012-BS-01</text>
<text x="280" y="230" font-size="15" text-anchor="start" fill="#000">C5 · 2026-11-13</text>
<text x="90" y="320" font-size="12" text-anchor="start" fill="#000">(01)09501101000001(11)261113(21)BS3210-261113-0042</text>
<text x="90" y="338" font-size="12" text-anchor="start" fill="#000">(10)WO-00012-BS-01(240)BS-3210-1000-C5</text>
<rect x="660" y="90" width="500" height="260" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="668" y="165.05" font-size="13" text-anchor="start" font-weight="700" fill="#000">GS1 application identifiers (AI)</text>
<text x="668" y="182.05" font-size="13" text-anchor="start" fill="#000">(01) GTIN-14 – product (needs own GS1 prefix!)</text>
<text x="668" y="199.05" font-size="13" text-anchor="start" fill="#000">(11) production date YYMMDD</text>
<text x="668" y="216.05" font-size="13" text-anchor="start" fill="#000">(21) serial number – variable, end with &lt;GS&gt;</text>
<text x="668" y="233.05" font-size="13" text-anchor="start" fill="#000">(10) batch / lot – variable, end with &lt;GS&gt;</text>
<text x="668" y="250.05" font-size="13" text-anchor="start" fill="#000">(240) additional product id = our code</text>
<text x="668" y="267.05" font-size="13" text-anchor="start" fill="#000">FNC1 first → GS1 mode of ECC 200 Data Matrix</text>
<text x="668" y="284.05" font-size="13" text-anchor="start" fill="#000">Example GTIN 0950110100000 + check digit 1</text>
<text x="60" y="400" font-size="13" text-anchor="start" fill="#000">Check digit (GTIN-13 body 0950110100000): weights 3,1,3,1,… from the right → sum 29 → (10 − 29 mod 10) mod 10 = 1.</text>
<text x="60" y="424" font-size="13" text-anchor="start" fill="#000">Raw string: 0109501101000001 11261113 21BS3210-261113-0042&lt;GS&gt; 10WO-00012-BS-01&lt;GS&gt; 240BS-3210-1000-C5 (spaces only for reading).</text>
<text x="60" y="448" font-size="13" text-anchor="start" fill="#000">Where: laser mark on the part (screw end face, nut flange OD, rail end, block side) = DPM code; paper label on the box / tube.</text>
<text x="60" y="472" font-size="13" text-anchor="start" fill="#000">Flow: MES → POST /api/bsf/printer/jobs {template, data} → print server builds ZPL (^BX… Data Matrix) → printer (TCP 9100 inside the print server).</text>
<text x="60" y="496" font-size="13" text-anchor="start" fill="#000">Scan back: terminal scanner reads the label → GET /api/bsf/mes/trace?serial=… (genealogy) or POST /genealogy/link at assembly.</text>
<text x="60" y="520" font-size="13" text-anchor="start" fill="#000">Pattern in this drawing = illustration only – a real symbol has Reed–Solomon error correction (ISO/IEC 16022).</text>
<rect x="770" y="766" width="406" height="48" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="770" y1="790" x2="1176" y2="790" stroke="#000" stroke-width="1"/>
<text x="778" y="783" font-size="12" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your MES team</text>
<text x="778" y="807" font-size="11" fill="#000">Ball screw + guide factory · item 6 MES · guide 45 · 45_gs1_label.svg</text>
