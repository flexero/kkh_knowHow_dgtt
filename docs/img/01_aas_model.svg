<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">01 – Asset Administration Shell (AAS, IEC 63278-1) of machining centre HMC-01 with submodels</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" fill="#444">One AAS per asset. Submodels are standard templates (IDTA numbers – check the current version). Values from config/factory.json; maker data = see datasheet.</text>
