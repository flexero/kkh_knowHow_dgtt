<rect x="640.0" y="90.0" width="380.0" height="80.0" rx="0" stroke="#666666" stroke-width="1" fill="#fff"/>
<text x="650.0" y="110.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">dv/dt = 565 V / 200 ns = 2.825 kV/µs</text>
<text x="650.0" y="125.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">I_cm = C · dv/dt = 6 nF × 2.825 kV/µs = 16.95 A peak</text>
<text x="650.0" y="140.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">pulses: 3 phases × 2 edges × 8 kHz = 48 000 /s</text>
<text x="650.0" y="155.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">U_cm steps of U_DC/3 = 188 V (peak ±U_DC/2 = ±282.5 V)</text>
<text x="1020.0" y="380.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000"></text>
<text x="1170.0" y="460.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">U_cm (staircase)</text>
<polyline points="1180.0,520.0 1200.0,520.0 1200.0,505.0 1215.0,505.0 1215.0,490.0 1235.0,490.0 1235.0,505.0 1250.0,505.0 1250.0,520.0 1270.0,520.0 1270.0,535.0 1285.0,535.0 1285.0,520.0 1300.0,520.0" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="1176.0" y1="520.0" x2="1310.0" y2="520.0" stroke="#666666" stroke-width="0.6"/>
<text x="60.0" y="760.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Remedies (reduce I_cm or give it a short planned path)</text>
<text x="60.0" y="780.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• shielded symmetric motor cable, 360° at both ends (planned path)</text>
<text x="60.0" y="796.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• common-mode cores (nanocrystalline) at the drive output: 16.95 A → ≈ 2 A example</text>
<text x="60.0" y="812.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• dv/dt filter / sine filter for long cables (l &gt; l_c = 15 m → 1045 V at the motor)</text>
<text x="60.0" y="828.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• bond motor frame to the machine bed and bed to the mesh with short, wide straps</text>
<text x="720.0" y="780.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• line filter on bare plate; filter input and output apart</text>
<text x="720.0" y="796.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• insulated bearing / shaft grounding ring (maker's choice)</text>
<text x="720.0" y="812.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• encoder cable apart from motor cable (≥ 300 mm or divider)</text>
<text x="720.0" y="828.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• lower PWM frequency / slower edges only if the drive maker allows</text>
