<rect x="950.0" y="650.0" width="150.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="1100.0" y="650.0" width="20.0" height="26.0" rx="0" fill="#fde0dc" stroke="#c62828" stroke-width="1.2"/>
<text x="935.0" y="667.0" font-size="9" text-anchor="middle" fill="#000">IN</text>
