<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
<rect width="1200" height="830" fill="#fff"/>
<text x="40.0" y="40.0" font-size="15" text-anchor="start" font-weight="bold" fill="#000">PLC scan cycle – read inputs, run the networks, write outputs (example: scan 20 ms)</text>
<text x="1160.0" y="815.0" font-size="10" text-anchor="end" fill="#666">Example drawing – guide 35 · check every address and value with your PLC configuration</text>
<g transform="translate(70,0)">
<rect x="180.0" y="80.0" width="240.0" height="80.0" rx="8" fill="#f3f6fb" stroke="#1565c0" stroke-width="1.6"/>
<text x="300.0" y="106.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">1  Read inputs</text>
<text x="300.0" y="126.0" font-size="11.5" text-anchor="middle" fill="#000">terminals → process image</text>
<text x="300.0" y="143.0" font-size="11" text-anchor="middle" fill="#666">Delta X0.0 …   Siemens %I0.0 …</text>
<rect x="400.0" y="290.0" width="240.0" height="80.0" rx="8" fill="#f3f6fb" stroke="#1565c0" stroke-width="1.6"/>
<text x="520.0" y="316.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">2  Run the program</text>
<text x="520.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#000">network 1 → network 18, top to bottom,</text>
<text x="520.0" y="353.0" font-size="11" text-anchor="middle" fill="#666">left to right inside a rung</text>
<rect x="180.0" y="500.0" width="240.0" height="80.0" rx="8" fill="#f3f6fb" stroke="#1565c0" stroke-width="1.6"/>
<text x="300.0" y="526.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">3  Write outputs</text>
<text x="300.0" y="546.0" font-size="11.5" text-anchor="middle" fill="#000">process image → terminals</text>
<text x="300.0" y="563.0" font-size="11" text-anchor="middle" fill="#666">Delta Y0.0 …   Siemens %Q0.0 …</text>
<rect x="-40.0" y="290.0" width="240.0" height="80.0" rx="8" fill="#f3f6fb" stroke="#1565c0" stroke-width="1.6"/>
<text x="80.0" y="316.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">4  Housekeeping</text>
<text x="80.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#000">communication (WCS, HMI),</text>
<text x="80.0" y="353.0" font-size="11" text-anchor="middle" fill="#666">diagnostics, self-test</text>
<path d="M420 120 Q520 140 520 285" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#ara)"/>
<path d="M520 375 Q520 520 425 540" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#ara)"/>
<path d="M180 540 Q80 520 80 375" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#ara)"/>
<path d="M80 285 Q80 140 175 120" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#ara)"/>
<text x="300.0" y="330.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">one scan = 1 + 2 + 3 + 4</text>
<text x="300.0" y="350.0" font-size="11.5" text-anchor="middle" fill="#666">repeats for ever in RUN</text>
</g>
<text x="740.0" y="100.0" font-size="12.5" text-anchor="start" fill="#000">Why the process image?</text>
<text x="740.0" y="117.0" font-size="12.5" text-anchor="start" fill="#000">• all networks see the SAME input values in one scan</text>
<text x="740.0" y="134.0" font-size="12.5" text-anchor="start" fill="#000">• an input that changes in the middle of the scan is</text>
<text x="740.0" y="151.0" font-size="12.5" text-anchor="start" fill="#000">   seen only in the NEXT scan</text>
<text x="740.0" y="168.0" font-size="12.5" text-anchor="start" fill="#000">• the LAST write of an output in the scan wins</text>
<text x="740.0" y="185.0" font-size="12.5" text-anchor="start" fill="#000">   (two OUT coils for one output = 'double coil' mistake)</text>
<text x="740.0" y="202.0" font-size="12.5" text-anchor="start" fill="#000"></text>
<text x="740.0" y="219.0" font-size="12.5" text-anchor="start" fill="#000">Scan time (example AS/RS program, 18 networks, 112 rungs):</text>
<text x="740.0" y="236.0" font-size="12.5" text-anchor="start" fill="#000">• logic itself: a few µs … 1 ms on a modern CPU</text>
<text x="740.0" y="253.0" font-size="12.5" text-anchor="start" fill="#000">• fixed cyclic task chosen here: 20 ms</text>
<text x="740.0" y="270.0" font-size="12.5" text-anchor="start" fill="#000">  (Siemens: cyclic OB / OB1 min. cycle, Delta: fixed scan time)</text>
<text x="740.0" y="287.0" font-size="12.5" text-anchor="start" fill="#000">• timers count in steps of one scan → accuracy ± 1 scan</text>
<text x="40.0" y="620.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Worst-case reaction time – input changes just after the input image was read</text>
<rect x="120.0" y="650.0" width="30.0" height="26.0" rx="0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
<rect x="150.0" y="650.0" width="150.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="300.0" y="650.0" width="20.0" height="26.0" rx="0" fill="#fde0dc" stroke="#c62828" stroke-width="1.2"/>
