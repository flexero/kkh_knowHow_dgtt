<text x="425.0" y="667.0" font-size="10" text-anchor="middle" fill="#000">scan 2: program</text>
<text x="510.0" y="667.0" font-size="8" text-anchor="middle" fill="#000">OUT</text>
<rect x="520.0" y="650.0" width="30.0" height="26.0" rx="0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
<rect x="550.0" y="650.0" width="150.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="700.0" y="650.0" width="20.0" height="26.0" rx="0" fill="#fde0dc" stroke="#c62828" stroke-width="1.2"/>
<text x="535.0" y="667.0" font-size="9" text-anchor="middle" fill="#000">IN</text>
<text x="625.0" y="667.0" font-size="10" text-anchor="middle" fill="#000">scan 3: program</text>
<text x="710.0" y="667.0" font-size="8" text-anchor="middle" fill="#000">OUT</text>
<rect x="720.0" y="650.0" width="30.0" height="26.0" rx="0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
<rect x="750.0" y="650.0" width="150.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="900.0" y="650.0" width="20.0" height="26.0" rx="0" fill="#fde0dc" stroke="#c62828" stroke-width="1.2"/>
