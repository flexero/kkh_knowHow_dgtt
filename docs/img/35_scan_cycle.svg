<text x="1110.0" y="667.0" font-size="8" text-anchor="middle" fill="#000">OUT</text>
<line x1="160.0" y1="642.0" x2="160.0" y2="720.0" stroke="#c62828" stroke-width="2"/>
<text x="164.0" y="734.0" font-size="11" text-anchor="start" fill="#c62828">input changes (+ filter 3 ms)</text>
<line x1="320.0" y1="690.0" x2="320.0" y2="705.0" stroke="#000" stroke-width="1.4"/>
<text x="325.0" y="702.0" font-size="10.5" text-anchor="start" fill="#000">read in scan 2</text>
<line x1="520.0" y1="690.0" x2="520.0" y2="720.0" stroke="#2e7d32" stroke-width="2"/>
<text x="524.0" y="734.0" font-size="11" text-anchor="start" fill="#2e7d32">output written end of scan 2</text>
<line x1="160.0" y1="750.0" x2="520.0" y2="750.0" stroke="#000" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="340.0" y="766.0" font-size="11.5" text-anchor="middle" fill="#000">t_react ≤ t_filter + 2 · t_scan + t_out = 3 + 2·20 + 0.5 ≈ 44 ms (transistor output; relay output + 10 ms)</text>
<text x="340.0" y="784.0" font-size="11" text-anchor="middle" fill="#666">a pulse must last ≥ t_scan + t_filter = 23 ms, else the PLC may miss it (use a fast input / interrupt or a latch in the sensor)</text>
</svg>