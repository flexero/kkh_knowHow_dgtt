<text x="20.0" y="630.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Inside step 5 – route of one VC20 unit (cycle times from config, s):</text>
<rect x="20.0" y="642.0" width="49.5" height="34.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="44.8" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">LOAD</text>
<text x="44.8" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">90</text>
<rect x="75.5" y="642.0" width="198.0" height="34.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="174.5" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">HMC</text>
<text x="174.5" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">360</text>
<rect x="279.5" y="642.0" width="82.5" height="34.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="320.8" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">WASH</text>
<text x="320.8" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">150</text>
<rect x="368.0" y="642.0" width="110.0" height="34.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="423.0" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">ASSY</text>
<text x="423.0" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">200</text>
<rect x="484.0" y="642.0" width="60.5" height="34.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="514.2" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">ROBOT</text>
<text x="514.2" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">110</text>
<rect x="550.5" y="642.0" width="198.0" height="34.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="649.5" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">TEST</text>
<text x="649.5" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">360</text>
<rect x="754.5" y="642.0" width="88.0" height="34.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="798.5" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">PAINT</text>
<text x="798.5" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">160</text>
<rect x="848.5" y="642.0" width="115.5" height="34.0" rx="0" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="906.2" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">FINAL</text>
<text x="906.2" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">210</text>
<rect x="970.0" y="642.0" width="66.0" height="34.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="1003.0" y="657.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">PACK</text>
<text x="1003.0" y="671.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">120</text>
<text x="1050.0" y="657.0" font-size="11" text-anchor="start" font-weight="bold" fill="#111">= 1 760 s process time</text>
<text x="1050.0" y="672.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">(HMC 345 + 15 s pallet change)</text>
<text x="20.0" y="696.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Cylinders (VMC → HONE) and crankshafts (LATHE → GRIND) come from kanban supermarkets – they are not on the order's critical path.</text>
<text x="20.0" y="722.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Lead time of the order (bar to scale, hours):</text>
<rect x="20.0" y="742.0" width="9.4" height="30.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="20.0" y="738.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">entry 0.25 h</text>
<rect x="29.4" y="742.0" width="156.7" height="30.0" rx="0" fill="url(#hatch)" stroke="#222" stroke-width="1.2"/>
<text x="107.7" y="761.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">queue before LOAD 4.17 h</text>
<rect x="186.1" y="742.0" width="105.2" height="30.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="238.6" y="761.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">first unit 2.8 h</text>
<rect x="291.2" y="742.0" width="41.7" height="30.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="312.1" y="738.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">rest 1.11 h</text>
<rect x="332.9" y="742.0" width="225.4" height="30.0" rx="0" fill="url(#hatch)" stroke="#222" stroke-width="1.2"/>
<text x="445.7" y="761.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">truck wait 6 h</text>
<rect x="558.4" y="742.0" width="901.6" height="30.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="1009.2" y="761.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">transport 24 h</text>
<text x="20.0" y="790.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">order → last unit in FG = 0.25 + 4.17 + 2.8 + 1.11 = 8.33 h;  to the customer = 8.33 + 6 + 24 = 38.33 h.  Hatched = pure waiting (10.17 h of the 14.33 h inside the factory and dock).</text>
<text x="20.0" y="806.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Biggest levers: release less work ahead of the order (queue), more trucks per day, MTO priority. Machining speed is a small part of the lead time.</text>
