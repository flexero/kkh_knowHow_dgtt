<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">02 – Order flow end to end: one make-to-order order 20 × VC20 through the systems (automatic mode, busy factory)</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444">Swimlanes = who does the step. Numbers in brackets = lead time of the step (example values; queue from Little's law with the twin's 14.4 units/h and WIP 40).</text>
