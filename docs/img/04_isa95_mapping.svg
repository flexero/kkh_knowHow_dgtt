<text x="1090.0" y="365.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Simple rule (chapter 3.1):</text>
<text x="1090.0" y="383.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">ERP says WHAT and WHEN (23 × VC20 by Wed).</text>
<text x="1090.0" y="401.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">MES says HOW and WHERE (HMC-02, program,</text>
<text x="1090.0" y="419.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">sequence). The PLC DOES it.</text>
<text x="1090.0" y="445.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Firewall / DMZ between L4 (IT) and L3 (OT):</text>
<text x="1090.0" y="463.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">guide 07 ch. 13, IEC 62443 zones.</text>
