<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">04 – ISA-95 / IEC 62264 levels mapped to the V-compressor factory: systems, activities and data flows</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444">Orders go down, results go up. Each level talks only to its neighbours. Volumes per day at 300 compressors/day (example values).</text>
