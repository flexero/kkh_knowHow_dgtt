<text x="1090.0" y="95.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Data flows between levels (examples, per day)</text>
<text x="1090.0" y="175.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111">▼ Work orders: B2MML ProcessProductionSchedule</text>
<text x="1090.0" y="191.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">   ≈ 15 WOs/day (300 units ÷ lot 20)</text>
<text x="1090.0" y="215.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111">▲ Confirmations: ProcessProductionPerformance</text>
<text x="1090.0" y="231.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">   ≈ 300 unit + 15 order messages/day</text>
<text x="1090.0" y="255.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111">▼ Item / BOM / routing: MaterialDefinition,</text>
<text x="1090.0" y="271.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">   ProductDefinition (only on change)</text>
<text x="1090.0" y="295.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111">▲ Lot consumption: MaterialLot / backflush</text>
<text x="1090.0" y="311.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">   ≈ 6 component lots per unit</text>
<text x="1090.0" y="520.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111">▼ OPC UA methods: StartOrder, HoldOrder, recipe</text>
<text x="1090.0" y="536.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">   ▲ events: unit start, part done, test result</text>
<text x="1090.0" y="560.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111">▲ ≈ 35 MES events per unit ≈ 10 500/day</text>
<text x="1090.0" y="576.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">   (start, 26 route events, 6 genealogy, test, FG)</text>
<text x="1090.0" y="680.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111">▼ setpoints, NC program select, release</text>
<text x="1090.0" y="696.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">   ▲ states, counters, alarms (PROFINET etc.)</text>
<text x="1090.0" y="820.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111">▼ 24 V I/O, IO-Link, 4–20 mA, drives</text>
<text x="1090.0" y="836.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">   ▲ measured values in ms</text>
