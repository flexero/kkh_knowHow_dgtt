<text x="1070.0" y="508.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">EOQ = √(2·D·S / H),  S = 120 $ per order</text>
<text x="1070.0" y="524.0" font-size="11" text-anchor="start" fill="#c62828">black: holding only; red: + 600 $ slot × 15 %/yr ÷ 4</text>
<rect x="24.0" y="610.0" width="980.0" height="270.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="36.0" y="634.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="36.0" y="660.0" font-size="12" text-anchor="start" fill="#000">SS = z · √(LT · σ_d² + d² · σ_LT²) = 1.645 × √(16 × 4² + 8.6² × 4²) = 1.645 × 37.9 = 62 castings</text>
<text x="36.0" y="686.0" font-size="12" text-anchor="start" fill="#000">ROP = d · LT + SS = 8.6 × 16 + 62 = 200      (order when stock + open orders ≤ ROP)</text>
<text x="36.0" y="712.0" font-size="12" text-anchor="start" fill="#000">Config safety stock 100 = 2.64 σ → about 99.6 % cycle service level (§20.3)</text>
<text x="36.0" y="738.0" font-size="12" text-anchor="start" fill="#000">Average stock = SS + Q/2 = 182 castings = 45.5 crates;  maximum = 302 = 75.5 crates → AS/RS slots</text>
<text x="36.0" y="764.0" font-size="12" text-anchor="start" fill="#000">Orders per year = D / Q = 34 400 / 240 = 143;  one receipt every 27.9 operating hours</text>
<text x="36.0" y="790.0" font-size="12" text-anchor="start" fill="#000">Yearly cost Q = 240: ordering 17 200 $ + holding 2 850 $ = 20 050 $ (config Q = 120: 35 825 $)</text>
<text x="36.0" y="816.0" font-size="12" text-anchor="start" fill="#000">Rule: choose Q near the EOQ, then check slots, crane peak (Q/4 crates × cycle) and supplier lot rules.</text>
<text x="36.0" y="842.0" font-size="12" text-anchor="start" fill="#000">The real curve is not a perfect saw-tooth: usage varies (work orders of 20 units) – the SS absorbs it.</text>
<text x="36.0" y="634.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Formulas with the numbers of this example (verified in Python, §31)</text>
