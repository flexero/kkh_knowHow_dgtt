<rect x="428.3" y="160" width="40.300000000000004" height="56" rx="0" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="448.45" y="193" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#000">comm</text>
<text x="304.29999999999995" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000">cycle 1: 0.0 – 5.3 ms</text>
<rect x="468.59999999999997" y="160" width="9.299999999999999" height="56" rx="0" stroke="#000" stroke-width="1.2" fill="#e3eefb"/>
