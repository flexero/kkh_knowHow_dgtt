<text x="706.0" y="299.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">d2 = D2  pitch diameter = d − 0.6495·P</text>
<line x1="130.0" y1="338.3" x2="700.0" y2="338.3" stroke="#000" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>
<text x="706.0" y="342.3" font-size="12" text-anchor="start" fill="#000" font-weight="bold">D1  nut minor diameter = d − 1.0825·P</text>
