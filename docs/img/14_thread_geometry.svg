<path d="M580.5 343.6 Q602.5 351.6 624.5 343.6" stroke="#000" stroke-width="1" fill="none"/>
<text x="502.5" y="198.3" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">crest flat P/8</text>
<text x="402.5" y="314.3" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">root flat P/4</text>
<text x="410.0" y="411.6" font-size="11" text-anchor="middle" fill="#c62828">bolt root radius R ≥ 0.125·P (rounded, to d3)</text>
<text x="150.0" y="433.6" font-size="11" text-anchor="start" fill="#555">thread axis is far below (diameters are measured through the axis). At the pitch diameter d2: tooth width = groove width = P/2.</text>
<text x="30.0" y="500.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Formulas (ISO 68-1, ISO 898-1)</text>
<text x="30.0" y="524.0" font-size="12" text-anchor="start" fill="#000">H = 0.866025·P  |  d2 = d − 0.649519·P  |  d3 = d − 1.226869·P  |  D1 = d − 1.082532·P</text>
<text x="30.0" y="544.0" font-size="12" text-anchor="start" fill="#000">Stress area As = (π/4)·((d2 + d3)/2)²  |  tensile stress σ = F / As  |  tap drill (cutting tap) ≈ d − P</text>
<text x="30.0" y="564.0" font-size="12" text-anchor="start" fill="#000">Example M12: P = 1.75 → d2 = 10.863, d3 = 9.853, As = (π/4)·10.358² = 84.3 mm²; 8.8 bolt: F at Rp0.2 = 640 · 84.3 = 54 kN</text>
