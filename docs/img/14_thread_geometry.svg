<text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#000" font-weight="bold">Metric ISO thread (ISO 68-1 basic profile, ISO 724 dimensions) – pitch, diameters, stress area</text>
<text x="30.0" y="58.0" font-size="12" text-anchor="start" fill="#555">Basic profile = common contour of bolt and nut. Bolt material below the line (light red), nut material above (hatched). Flank angle 60°.</text>
