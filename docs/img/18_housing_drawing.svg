<text x="120.0" y="766.0" font-size="11" text-anchor="start" fill="#1565c0">bores finished AFTER shrink + pressure test (otherwise oval by several µm)</text>
<rect x="1000.0" y="170.0" width="385.0" height="470.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="1010.0" y="192.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Notes (housing)</text>
<text x="1010.0" y="214.0" font-size="12" text-anchor="start" fill="#000">1. 42CrMo4 +QT 280–340 HB, 3.1 certificate.</text>
<text x="1010.0" y="232.0" font-size="12" text-anchor="start" fill="#000">2. Stress relieve 580 °C / 2 h after roughing.</text>
<text x="1010.0" y="250.0" font-size="12" text-anchor="start" fill="#000">3. Datums A = front bore, B = rear bore,</text>
<text x="1010.0" y="268.0" font-size="12" text-anchor="start" fill="#000">    common axis A-B.</text>
<text x="1010.0" y="286.0" font-size="12" text-anchor="start" fill="#000">4. Bores Ø110 / Ø120 finished in ONE clamping</text>
<text x="1010.0" y="304.0" font-size="12" text-anchor="start" fill="#000">    from both sides (B-axis 180°) – fine boring</text>
<text x="1010.0" y="322.0" font-size="12" text-anchor="start" fill="#000">    + internal grinding or honing (chapter 22).</text>
<text x="1010.0" y="340.0" font-size="12" text-anchor="start" fill="#000">5. B-axis reversal 2″ at 200 mm = 1.9 µm:</text>
<text x="1010.0" y="358.0" font-size="12" text-anchor="start" fill="#000">    probe both bores and correct.</text>
<text x="1010.0" y="376.0" font-size="12" text-anchor="start" fill="#000">6. Fits from the bearing maker (JS4 / K5 front,</text>
<text x="1010.0" y="394.0" font-size="12" text-anchor="start" fill="#000">    H5 rear floating sleeve) – check.</text>
<text x="1010.0" y="412.0" font-size="12" text-anchor="start" fill="#000">7. Measure at 20 °C after ≥ 8 h soak (CMM /</text>
<text x="1010.0" y="430.0" font-size="12" text-anchor="start" fill="#000">    roundness tester with long column).</text>
<text x="1010.0" y="448.0" font-size="12" text-anchor="start" fill="#000">8. Cross holes (coolant, oil-air, sensors)</text>
<text x="1010.0" y="466.0" font-size="12" text-anchor="start" fill="#000">    deburred, cleanliness per 26.3.</text>
<text x="1010.0" y="484.0" font-size="12" text-anchor="start" fill="#000">9. O-ring grooves per ISO 3601-2 / seal maker.</text>
<text x="1010.0" y="502.0" font-size="12" text-anchor="start" fill="#000">10. Mark serial SPH-YYWW-nnnnn on the flange OD.</text>
<text x="1010.0" y="520.0" font-size="12" text-anchor="start" fill="#000">11. Front: 3rd frame (runout 0.002 A-B) = bearing</text>
<text x="1010.0" y="538.0" font-size="12" text-anchor="start" fill="#000">    shoulder face in the front bore.</text>
<rect x="1010.0" y="548.0" width="30.0" height="14.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1"/>
<text x="1048.0" y="560.0" font-size="11" text-anchor="start" fill="#000">= housing section</text>
<rect x="1010.0" y="572.0" width="30.0" height="14.0" rx="0" fill="url(#hatA)" stroke="#1565c0" stroke-width="1"/>
<text x="1048.0" y="584.0" font-size="11" text-anchor="start" fill="#000">= cooling sleeve (shrunk)</text>
<text x="1010.0" y="610.0" font-size="11" text-anchor="start" fill="#000">◎ = coaxiality, ⊥ = perpendicularity,</text>
<text x="1010.0" y="626.0" font-size="11" text-anchor="start" fill="#000">single arrow = circular runout</text>
<rect x="905.0" y="790.0" width="485.0" height="96.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
