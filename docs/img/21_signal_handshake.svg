<text x="22" y="502" font-size="12" text-anchor="start" fill="#000" font-weight="bold">doClampClose</text>
<text x="288" y="502" font-size="11" text-anchor="end" fill="#1f6fd1">R → CNC</text>
<path d="M300,507 L822,507 L822,489 L856.8,489 L856.8,507 L1170,507" stroke="#000" stroke-width="1.7" fill="none"/>
<text x="22" y="539" font-size="12" text-anchor="start" fill="#000" font-weight="bold">diClampClosed</text>
<text x="288" y="539" font-size="11" text-anchor="end" fill="#555">CNC → R</text>
<path d="M300,526 L526.2,526 L526.2,544 L848.1,544 L848.1,526 L1170,526" stroke="#000" stroke-width="1.7" fill="none"/>
