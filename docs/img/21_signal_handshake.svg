<text x="22" y="354" font-size="12" text-anchor="start" fill="#000" font-weight="bold">doRobotOutside  (safety!)</text>
<text x="288" y="354" font-size="11" text-anchor="end" fill="#1f6fd1">R → CNC</text>
<path d="M300,341 L439.2,341 L439.2,359 L621.9,359 L621.9,341 L787.2,341 L787.2,359 L969.9,359 L969.9,341 L1170,341" stroke="#000" stroke-width="1.7" fill="none"/>
<text x="22" y="391" font-size="12" text-anchor="start" fill="#000" font-weight="bold">gripper closed (part held)</text>
<text x="288" y="391" font-size="11" text-anchor="end" fill="#555">robot</text>
