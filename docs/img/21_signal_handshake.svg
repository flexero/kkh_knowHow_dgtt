<text x="22" y="132" font-size="12" text-anchor="start" fill="#000" font-weight="bold">diMachReady</text>
<text x="288" y="132" font-size="11" text-anchor="end" fill="#555">CNC → R</text>
<path d="M300,119 L1170,119" stroke="#000" stroke-width="1.7" fill="none"/>
<text x="22" y="169" font-size="12" text-anchor="start" fill="#000" font-weight="bold">diMachDone</text>
<text x="288" y="169" font-size="11" text-anchor="end" fill="#555">CNC → R</text>
