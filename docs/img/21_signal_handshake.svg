<line x1="421.8" y1="92" x2="421.8" y2="628" stroke="#555" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="630.6" y1="92" x2="630.6" y2="628" stroke="#555" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="778.5" y1="92" x2="778.5" y2="628" stroke="#555" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="978.6" y1="92" x2="978.6" y2="628" stroke="#555" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="1083" y1="92" x2="1083" y2="628" stroke="#555" stroke-width="0.6" stroke-dasharray="3 3"/>
<path d="M360.9,193 C370.9,211.5 394.4,211.5 404.4,228" stroke="#1f6fd1" stroke-width="1.3" fill="none" marker-end="url(#ea)"/>
<text x="412.4" y="243" font-size="11" text-anchor="start" fill="#1f6fd1">wait door open ≤ 5 s, else alarm</text>
<path d="M987.3,267 C997.3,285.5 1029.5,285.5 1039.5,302" stroke="#1f6fd1" stroke-width="1.3" fill="none" marker-end="url(#ea)"/>
<text x="1047.5" y="317" font-size="11" text-anchor="start" fill="#1f6fd1">wait ≤ 5 s</text>
<path d="M508.8,415 C518.8,433.5 524.9,433.5 534.9,450" stroke="#1f6fd1" stroke-width="1.3" fill="none" marker-end="url(#ea)"/>
<text x="542.9" y="465" font-size="11" text-anchor="start" fill="#1f6fd1">wait clamp open</text>
<path d="M822.0,489 C832.0,507.5 838.1,507.5 848.1,524" stroke="#1f6fd1" stroke-width="1.3" fill="none" marker-end="url(#ea)"/>
<text x="856.1" y="539" font-size="11" text-anchor="start" fill="#1f6fd1">wait clamped + part seated</text>
<text x="1094.4" y="169" font-size="11" text-anchor="end" fill="#1f6fd1">reset by cycle start</text>
<text x="22" y="652" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Rules (19.1 – 19.3):</text>
<text x="22" y="668" font-size="11.5" text-anchor="start" fill="#000">· every wait has a timeout and a message; each step can be repeated after an alarm (state machine on both sides)</text>
<text x="22" y="684" font-size="11.5" text-anchor="start" fill="#000">· cycle start only with doRobotOutside = 1 (robot clear); door and robot-in-machine signals are safety-related:</text>
<text x="22" y="700" font-size="11.5" text-anchor="start" fill="#000">  safe I/O or safety bus (PROFIsafe, CIP Safety) – never normal I/O; data (counters, IDs) via OPC UA / umati</text>
