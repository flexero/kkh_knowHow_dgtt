<text x="22" y="576" font-size="12" text-anchor="start" fill="#000" font-weight="bold">diPartSeated</text>
<text x="288" y="576" font-size="11" text-anchor="end" fill="#555">CNC → R</text>
<path d="M300,563 L526.2,563 L526.2,581 L865.5,581 L865.5,563 L1170,563" stroke="#000" stroke-width="1.7" fill="none"/>
<text x="22" y="613" font-size="12" text-anchor="start" fill="#000" font-weight="bold">doCycleStart</text>
<text x="288" y="613" font-size="11" text-anchor="end" fill="#1f6fd1">R → CNC</text>
<path d="M300,618 L1091.7,618 L1091.7,600 L1117.8,600 L1117.8,618 L1170,618" stroke="#000" stroke-width="1.7" fill="none"/>
