<text x="288" y="465" font-size="11" text-anchor="end" fill="#555">CNC → R</text>
<path d="M300,470 L534.9,470 L534.9,452 L839.4,452 L839.4,470 L1170,470" stroke="#000" stroke-width="1.7" fill="none"/>
