<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Load path – from the crate to the floor</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
<pattern id="grout" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff"/><circle cx="3" cy="3" r="1" fill="#777"/><circle cx="8" cy="7" r="0.8" fill="#777"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="30.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Forces with the 300 kg crate at the top level, crane accelerating (normal) / braking hard (emergency)</text>
<rect x="176.4" y="700.0" width="307.2" height="22.0" rx="0" fill="url(#grout)" stroke="#000" stroke-width="1.2"/>
<text x="486.8" y="716.0" font-size="11" text-anchor="start" fill="#000">grout + slab</text>
<rect x="176.4" y="698.1" width="307.2" height="3.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<rect x="250.0" y="682.1" width="185.6" height="10.2" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<circle cx="262.8" cy="687.2" r="12.8" fill="#fff" stroke="#000" stroke-width="1.2"/>
<circle cx="416.4" cy="687.2" r="12.8" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="266.0" y="124.0" width="32.0" height="558.1" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="176.4" y="101.0" width="307.2" height="5.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<rect x="298.0" y="132.3" width="7.7" height="64.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="298.0" y="193.1" width="61.4" height="4.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<rect x="304.4" y="152.8" width="51.2" height="38.4" rx="0" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="330.0" y1="172.0" x2="330.0" y2="187.2" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<circle cx="342.8" cy="172.0" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="0.5"/>
<line x1="342.8" y1="172.0" x2="432.4" y2="127.2" stroke="#1f6fd1" stroke-width="0.7"/>
<text x="436.4" y="131.2" font-size="11.5" text-anchor="start" fill="#1f6fd1">1 load 300 kg → 2.94 kN</text>
<line x1="323.6" y1="199.2" x2="303.1" y2="199.2" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<circle cx="355.6" cy="191.2" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="0.5"/>
<line x1="355.6" y1="191.2" x2="432.4" y2="229.6" stroke="#1f6fd1" stroke-width="0.7"/>
<text x="436.4" y="233.6" font-size="11.5" text-anchor="start" fill="#1f6fd1">2 fork + carriage: W 8.83 kN at e = 0.55 m</text>
<line x1="317.2" y1="140.0" x2="299.9" y2="140.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<circle cx="301.2" cy="152.8" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="0.5"/>
<line x1="301.2" y1="152.8" x2="432.4" y2="172.0" stroke="#1f6fd1" stroke-width="0.7"/>
<text x="436.4" y="176.0" font-size="11.5" text-anchor="start" fill="#1f6fd1">3 rollers: 6.07 kN per level (couple)</text>
<line x1="282.0" y1="229.6" x2="282.0" y2="636.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<text x="259.6" y="412.0" font-size="11.5" text-anchor="end" fill="#1f6fd1">4 mast: N 20.6 kN + bending</text>
<text x="259.6" y="429.0" font-size="11" text-anchor="end" fill="#1f6fd1">a = 0.5 m/s²: δ_top 1.86 mm</text>
<path d="M250.0,655.2 A 26 26 0 1 1 314.0,655.2" fill="none" stroke="#1f6fd1" stroke-width="2" marker-end="url(#ea)"/>
<text x="246.8" y="629.6" font-size="11.5" text-anchor="end" fill="#1f6fd1" font-weight="bold">5 mast foot: M 12.55 kN·m normal,</text>
<text x="246.8" y="646.6" font-size="11.5" text-anchor="end" fill="#1f6fd1">18.47 kN·m emergency; 12 × M24 bolts</text>
<text x="246.8" y="663.6" font-size="11" text-anchor="end" fill="#1f6fd1">(5.5 kN tension each ≪ 247 kN preload)</text>
<line x1="304.4" y1="687.2" x2="394.0" y2="687.2" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<circle cx="381.2" cy="687.2" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="0.5"/>
<line x1="381.2" y1="687.2" x2="451.6" y2="636.0" stroke="#1f6fd1" stroke-width="0.7"/>
<text x="455.6" y="640.0" font-size="11.5" text-anchor="start" fill="#1f6fd1">6 bottom carriage beam: M 21.9 kN·m, σ 25 MPa</text>
<line x1="262.8" y1="698.0" x2="262.8" y2="730.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<line x1="416.4" y1="698.0" x2="416.4" y2="730.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<text x="262.8" y="748.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1">7 drive wheel 23.4 kN static</text>
<text x="446.4" y="748.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1">idler 20.7 kN</text>
<circle cx="285.2" cy="104.2" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="0.5"/>
<line x1="285.2" y1="104.2" x2="432.4" y2="86.2" stroke="#1f6fd1" stroke-width="0.7"/>
<text x="436.4" y="90.2" font-size="11.5" text-anchor="start" fill="#1f6fd1">8 top guide rail: takes cross-aisle forces only (fork out)</text>
<line x1="189.2" y1="380.0" x2="240.4" y2="380.0" stroke="#000" stroke-width="1.6" marker-end="url(#ek)"/>
<text x="189.2" y="372.0" font-size="11" text-anchor="start" fill="#000">travel a = 0.5 m/s²</text>
<text x="780.0" y="70.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Numbers (example, guide 38 §6)</text>
<text x="780.0" y="89.0" font-size="11.5" text-anchor="start" fill="#000">masses: frame 1 600, mast 1 000, carriage 600,</text>
<text x="780.0" y="108.0" font-size="11.5" text-anchor="start" fill="#000">cabinet etc. 800, top 200, load 300 = 4 500 kg</text>
<text x="780.0" y="146.0" font-size="11.5" text-anchor="start" fill="#000">mast foot moment</text>
<text x="780.0" y="165.0" font-size="11.5" text-anchor="start" fill="#000">  eccentric 900 kg × 9.81 × 0.75 m = 6.62 kN·m</text>
<text x="780.0" y="184.0" font-size="11.5" text-anchor="start" fill="#000">  inertia q·H²/2 + P·h = 5.93 kN·m</text>
<text x="780.0" y="203.0" font-size="11.5" text-anchor="start" fill="#000">  normal 12.55 · emergency (2 × inertia) 18.47</text>
<text x="780.0" y="222.0" font-size="11.5" text-anchor="start" fill="#000">mast stress 2.05 + 12.4 + 3.2 = 17.7 MPa (5 %)</text>
<text x="780.0" y="260.0" font-size="11.5" text-anchor="start" fill="#000">wheel loads</text>
<text x="780.0" y="279.0" font-size="11.5" text-anchor="start" fill="#000">  static 23.4 / 20.7 kN, tilt ΔR = 3.3 kN</text>
<text x="780.0" y="298.0" font-size="11.5" text-anchor="start" fill="#000">  R_max = 1.15 × 23.4 + 3.3 = 30.2 kN</text>
<text x="780.0" y="317.0" font-size="11.5" text-anchor="start" fill="#000">rail line load on grout ≈ 30.2 / 0.5 m ≈ 60 kN/m</text>
<text x="780.0" y="355.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Rule: the force must always find a stiff,</text>
<text x="780.0" y="374.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">short way down – every joint on the way</text>
<text x="780.0" y="393.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">(roller, bolt, weld, bearing) is checked.</text>
<rect x="774.0" y="752.0" width="414.0" height="66.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="774.0" y1="774.0" x2="1188.0" y2="774.0" stroke="#000" stroke-width="0.8"/>
<line x1="844.0" y1="752.0" x2="844.0" y2="774.0" stroke="#000" stroke-width="0.8"/>
<text x="782.0" y="768.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">38-11</text>
<text x="852.0" y="768.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Load path – from the crate to the floor</text>
<text x="782.0" y="791.0" font-size="12" text-anchor="start" fill="#b00000" font-weight="bold">EXAMPLE – check the crane maker's drawings</text>
<text x="782.0" y="809.0" font-size="11" text-anchor="start" fill="#000">Digital twin · ASRS-RAW stacker crane · guide 38 · not to scale · mm</text>
</svg>
