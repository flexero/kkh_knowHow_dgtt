<text x="972.0" y="634.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Key data (example – guide 4.1, 10, 11, 14)</text>
<text x="972.0" y="662.0" font-size="12" text-anchor="start" fill="#000">Mass empty 187 kg · payload 300 kg · total 487 kg</text>
<text x="972.0" y="685.0" font-size="12" text-anchor="start" fill="#000">Speed 1.2 m/s (real 1.18) · stations 0.3 · creep 0.05 m/s</text>
<text x="972.0" y="708.0" font-size="12" text-anchor="start" fill="#000">Drive 2 × 200 W BLDC 48 V, planetary i = 20, Ø150 PU</text>
<text x="972.0" y="731.0" font-size="12" text-anchor="start" fill="#000">Peak drive force 363 N · motor 0.76 Nm peak, 0.27 Nm RMS</text>
<text x="972.0" y="754.0" font-size="12" text-anchor="start" fill="#000">Wheel loads: 458 N empty / 1916 N loaded per drive wheel</text>
<text x="972.0" y="777.0" font-size="12" text-anchor="start" fill="#000">Castors 4 × Ø100, spring 15 N/mm, preload 229 N each</text>
<text x="972.0" y="800.0" font-size="12" text-anchor="start" fill="#000">Lift: 2 cams e = 25 mm, worm i = 120, 1.2 s, 4147 N design</text>
<text x="972.0" y="823.0" font-size="12" text-anchor="start" fill="#000">Battery LFP 16s 51.2 V 60 Ah = 3.07 kWh · 168 W average</text>
