<text x="780.0" y="390.0" font-size="11.5" text-anchor="start" fill="#000">Why a box?</text>
<text x="780.0" y="408.0" font-size="11.5" text-anchor="start" fill="#000">closed section = high bending + torsion stiffness</text>
<text x="780.0" y="426.0" font-size="11.5" text-anchor="start" fill="#000">per kg; diaphragms keep the thin 6 mm walls</text>
<text x="780.0" y="444.0" font-size="11.5" text-anchor="start" fill="#000">square and stop local buckling / drumming;</text>
<text x="780.0" y="462.0" font-size="11.5" text-anchor="start" fill="#000">they also carry the guide-rail pad loads</text>
<text x="780.0" y="480.0" font-size="11.5" text-anchor="start" fill="#000">into all 4 walls.</text>
<text x="780.0" y="516.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">stress σ ≈ 17.7 MPa (5 %) → stiffness decides</text>
