<text x="1022" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Formulas</text>
<text x="1022" y="153" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">I   = 4 + 16·(v − lo)/(hi − lo)  [mA]</text>
<text x="1022" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">raw = 27648·(v − lo)/(hi − lo)</text>
<text x="1022" y="191" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">v   = lo + (hi − lo)·raw/27648</text>
<text x="1022" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1022" y="229" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Example 41.2 °C, 0–150 °C:</text>
<text x="1022" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">I = 4 + 16·41.2/150 = 8.39 mA</text>
<text x="1022" y="267" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">raw = 27648·41.2/150 = 7594</text>
<text x="1022" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">1 count = 150/27648 = 0.0054 °C</text>
<text x="1022" y="305" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1022" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">NE 43 in Siemens counts:</text>
<text x="1022" y="343" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">3.6 mA → −691 · 3.8 mA → −346</text>
<text x="1022" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">20.5 mA → 28512 · 21 mA → 29376</text>
<rect x="1010" y="480" width="370" height="270" rx="0" stroke="#000" stroke-width="1.2" fill="#e3eefb"/>
<text x="1022" y="504" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Same 41.2 °C in other systems</text>
<text x="1022" y="523" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Beckhoff EL30xx 4–20 mA: 0…32767 → 9000</text>
<text x="1022" y="542" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">12-bit card 0…4095 → 1125 (0.037 °C/count)</text>
<text x="1022" y="561" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Analog output, valve 35 %:</text>
<text x="1022" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">raw = 27648·0.35 = 9677 → 9.6 mA</text>
<text x="1022" y="599" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1022" y="618" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Program a 'Bad value' alarm for raw &gt; 32511</text>
<text x="1022" y="637" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">or &lt; −4864 (HMC01_A5103); keep the last</text>
<text x="1022" y="656" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">good value and set quality = Bad.</text>
<text x="1022" y="675" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000">Check the limits in YOUR module manual.</text>
<rect x="830" y="822" width="560" height="78" fill="#fff" stroke="#000" stroke-width="1.5"/>
<line x1="830" y1="852" x2="1390" y2="852" stroke="#000" stroke-width="1"/>
<line x1="1230" y1="852" x2="1230" y2="900" stroke="#000" stroke-width="1"/>
