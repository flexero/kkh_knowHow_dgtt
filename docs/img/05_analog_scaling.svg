<text x="191.5" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">fault</text>
<text x="898.75" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">fault</text>
