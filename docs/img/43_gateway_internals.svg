<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Gateway internals – drawing 43-07</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Gateway internals – threads, time-outs, data quality, report-by-exception, HTTP</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">twin/bsf_comm.py (inside server.py) or tools/bsf_gateway.py (own PC vc-bsf-sup-gw01) – the same code, standard library only</text><rect x="24" y="90" width="180" height="520" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="114" y="112" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">73 machines</text><text x="114" y="128" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">Modbus TCP servers</text><text x="114" y="142" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">port 502, unit 1 … 73</text><rect x="40" y="160" width="148" height="50" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="114" y="182" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">MS-SAW-01  unit 1</text><text x="114" y="198" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">registers 0 – 226</text><rect x="40" y="230" width="148" height="50" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="114" y="252" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">BS-TGR-03  unit 15</text><text x="114" y="268" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">registers 0 – 226</text><rect x="40" y="300" width="148" height="50" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="114" y="322" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">HT-CAR-01  unit 31</text><text x="114" y="338" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">registers 0 – 226</text><rect x="40" y="370" width="148" height="50" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="114" y="392" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">LB-MC-05  unit 54</text><text x="114" y="408" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">registers 0 – 226</text><rect x="40" y="440" width="148" height="50" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="114" y="462" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">AS-RUN-02  unit 68</text><text x="114" y="478" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">registers 0 – 226</text><rect x="40" y="510" width="148" height="50" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="114" y="532" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">QC-LAB-01  unit 73</text><text x="114" y="548" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">registers 0 – 226</text><rect x="260" y="110" width="250" height="92" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="270" y="130" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Worker thread 1</text><text x="270" y="148" font-size="11" text-anchor="start" font-weight="normal" fill="#000">devices 1, 5, 9 … (18 – 19 devices)</text><text x="270" y="164" font-size="11" text-anchor="start" font-weight="normal" fill="#000">schedule per device: fast · counters · energy</text><text x="270" y="180" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ModbusClient: 1 TCP connection per host</text><text x="270" y="196" font-size="11" text-anchor="start" font-weight="normal" fill="#000">next due = last due + period</text><line x1="204" y1="156" x2="258" y2="156" stroke="#1565c0" stroke-width="1.8" marker-end="url(#aa)" marker-start="url(#aas)"/><rect x="260" y="220" width="250" height="92" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="270" y="240" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Worker thread 2</text><text x="270" y="258" font-size="11" text-anchor="start" font-weight="normal" fill="#000">devices 2, 6, 10 … (18 – 19 devices)</text><text x="270" y="274" font-size="11" text-anchor="start" font-weight="normal" fill="#000">schedule per device: fast · counters · energy</text><text x="270" y="290" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ModbusClient: 1 TCP connection per host</text><text x="270" y="306" font-size="11" text-anchor="start" font-weight="normal" fill="#000">next due = last due + period</text><line x1="204" y1="266" x2="258" y2="266" stroke="#1565c0" stroke-width="1.8" marker-end="url(#aa)" marker-start="url(#aas)"/><rect x="260" y="330" width="250" height="92" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="270" y="350" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Worker thread 3</text><text x="270" y="368" font-size="11" text-anchor="start" font-weight="normal" fill="#000">devices 3, 7, 11 … (18 – 19 devices)</text><text x="270" y="384" font-size="11" text-anchor="start" font-weight="normal" fill="#000">schedule per device: fast · counters · energy</text><text x="270" y="400" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ModbusClient: 1 TCP connection per host</text><text x="270" y="416" font-size="11" text-anchor="start" font-weight="normal" fill="#000">next due = last due + period</text><line x1="204" y1="376" x2="258" y2="376" stroke="#1565c0" stroke-width="1.8" marker-end="url(#aa)" marker-start="url(#aas)"/><rect x="260" y="440" width="250" height="92" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="270" y="460" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Worker thread 4</text><text x="270" y="478" font-size="11" text-anchor="start" font-weight="normal" fill="#000">devices 4, 8, 12 … (18 – 19 devices)</text><text x="270" y="494" font-size="11" text-anchor="start" font-weight="normal" fill="#000">schedule per device: fast · counters · energy</text><text x="270" y="510" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ModbusClient: 1 TCP connection per host</text><text x="270" y="526" font-size="11" text-anchor="start" font-weight="normal" fill="#000">next due = last due + period</text><line x1="204" y1="486" x2="258" y2="486" stroke="#1565c0" stroke-width="1.8" marker-end="url(#aa)" marker-start="url(#aas)"/><text x="212" y="98" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">FC03</text><rect x="260" y="560" width="250" height="120" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="270" y="578" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0" xml:space="preserve">Robust polling</text><text x="270" y="593" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">time-out 300 ms, 1 retry</text><text x="270" y="608" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">time-out → close + reconnect</text><text x="270" y="623" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">  (a late answer is never mixed up)</text><text x="270" y="638" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">transaction id must match</text><text x="270" y="653" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">back-off after 3 failures:</text><text x="270" y="668" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">  fast ≥ 2 s, others ≥ 10 s</text><rect x="560" y="110" width="230" height="60" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="675.0" y="129.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Decode (register map)</text><text x="675.0" y="143.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">UINT16 / UINT32 / REAL ABCD / ASCII</text><text x="675.0" y="157.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">-&gt; JSON values per device</text><line x1="510" y1="156" x2="558" y2="140" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="560" y="200" width="230" height="120" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="570" y="220" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Value store + quality</text><text x="570" y="236" font-size="11" text-anchor="start" font-weight="normal" fill="#000">values of 73 devices</text><text x="570" y="252" font-size="11" text-anchor="start" font-weight="normal" fill="#000">status online / timeout /</text><text x="570" y="268" font-size="11" text-anchor="start" font-weight="normal" fill="#000">exception / offline / stale</text><text x="570" y="284" font-size="11" text-anchor="start" font-weight="normal" fill="#000">age = now – last good fast read</text><text x="570" y="300" font-size="11" text-anchor="start" font-weight="normal" fill="#000">stale if age &gt; 3 × fast + time-outs</text><line x1="675" y1="170" x2="675" y2="198" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="560" y="350" width="230" height="92" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="570" y="370" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">Report-by-exception</text><text x="570" y="388" font-size="11" text-anchor="start" font-weight="normal" fill="#000">change &gt; dead-band (e.g. 0.2 °C,</text><text x="570" y="406" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0.5 µm, 1 %) → event with seq no.</text><text x="570" y="424" font-size="11" text-anchor="start" font-weight="normal" fill="#000">event ring 3 000 entries</text><line x1="675" y1="320" x2="675" y2="348" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="560" y="470" width="230" height="54" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="675.0" y="493.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Frame ring (last 400)</text><text x="675.0" y="507.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">request + response hex, RTT, text</text><rect x="560" y="546" width="230" height="54" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="675.0" y="569.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Statistics thread 1 Hz</text><text x="675.0" y="583.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">req/s, bytes/s, RTT avg / max, errors</text><line x1="510" y1="500" x2="558" y2="497" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="850" y="90" width="326" height="300" rx="3" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="862" y="112" font-size="13" text-anchor="start" font-weight="bold" fill="#000">HTTP server (REST + JSON)</text><text x="862" y="136" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">GET /api/bsf/status</text><text x="862" y="160" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">GET /api/bsf/machines</text><text x="862" y="184" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">GET /api/bsf/machine?id=…</text><text x="862" y="208" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">GET /api/bsf/frames?n=40</text><text x="862" y="232" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0" xml:space="preserve">GET /api/bsf/events?since=N&amp;wait=20 (long poll)</text><text x="862" y="256" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0" xml:space="preserve">GET /api/bsf/stream  (SSE every 1 s)</text><text x="862" y="280" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">GET /api/bsf/map | map.csv</text><text x="862" y="304" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">POST /api/bsf/command</text><text x="862" y="328" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">POST /api/bsf/control (start / stop / faults)</text><text x="862" y="352" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">POST /api/bsf/snapshot (from the twin)</text><line x1="790" y1="260" x2="848" y2="240" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><line x1="790" y1="396" x2="848" y2="300" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><line x1="790" y1="497" x2="848" y2="340" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="850" y="410" width="326" height="150" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="862" y="430" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0" xml:space="preserve">Command path (MES → machine)</text><text x="862" y="448" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">POST /api/bsf/command {id, cmd, msgId}</text><text x="862" y="466" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">1 idempotency cache: same msgId →</text><text x="862" y="484" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">   same answer, no second write</text><text x="862" y="502" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">2 own TCP connection, FC03 / FC16 / FC06</text><text x="862" y="520" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">3 poll until ACK = REQ (max 3 s)</text><text x="862" y="538" font-size="11" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">4 200 OK or 422 + steps with all frames</text><rect x="24" y="692" width="486" height="96" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="34" y="712" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Store-and-forward (production recommendation)</text><text x="34" y="730" font-size="11" text-anchor="start" font-weight="normal" fill="#000">If MES / historian is down, the gateway writes events and lot</text><text x="34" y="748" font-size="11" text-anchor="start" font-weight="normal" fill="#000">confirmations to a disk queue and sends them later with the SAME</text><text x="34" y="766" font-size="11" text-anchor="start" font-weight="normal" fill="#000">msgId – the receiver ignores duplicates (idempotent).</text><text x="560" y="632" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Consumers: MES, twin page, andon,</text><text x="560" y="650" font-size="12" text-anchor="start" font-weight="normal" fill="#000">historian – all over HTTP only.</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Gateway internals</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-07  ·  guide 43 §9</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
