<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Toggle-bit handshake – drawing 43-11</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Toggle-bit handshake MES → machine – timing diagram</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">REQ (cmd.ctl bit0, register 202) is written LAST · the PLC answers ACK = REQ (hs.status bit0, register 8) · DONE toggles at lot end</text><line x1="290" y1="92" x2="290" y2="600" stroke="#000" stroke-width="0.8" stroke-dasharray="3 4"/><text x="290" y="88" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">t0</text><line x1="380" y1="92" x2="380" y2="600" stroke="#000" stroke-width="0.8" stroke-dasharray="3 4"/><text x="380" y="88" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">t1</text><line x1="470" y1="92" x2="470" y2="600" stroke="#000" stroke-width="0.8" stroke-dasharray="3 4"/><text x="470" y="88" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">t2</text><line x1="560" y1="92" x2="560" y2="600" stroke="#000" stroke-width="0.8" stroke-dasharray="3 4"/><text x="560" y="88" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">t3</text><line x1="900" y1="92" x2="900" y2="600" stroke="#000" stroke-width="0.8" stroke-dasharray="3 4"/><text x="900" y="88" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">t4</text><line x1="1000" y1="92" x2="1000" y2="600" stroke="#000" stroke-width="0.8" stroke-dasharray="3 4"/><text x="1000" y="88" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">t5</text><text x="24" y="136" font-size="12" text-anchor="start" font-weight="bold" fill="#000">cmd 200 – 225 data</text><path d="M256,118 L284,118 L290,132 L284,146 L256,146 L250,132 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="264" y="137" font-size="11" text-anchor="start" font-weight="normal" fill="#000">old</text><path d="M296,118 L1144,118 L1150,132 L1144,146 L296,146 L290,132 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="304" y="137" font-size="11" text-anchor="start" font-weight="normal" fill="#000">code 1, seq 8, order WO-…, qty 20</text><text x="24" y="188" font-size="12" text-anchor="start" font-weight="bold" fill="#000">cmd.ctl REQ (reg 202 b0)</text><path d="M250,196 L380,196 L380,172 L1150,172" stroke="#1565c0" stroke-width="2.2" fill="none"/><text x="24" y="240" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.status ACK (reg 8 b0)</text><path d="M250,248 L470,248 L470,224 L1150,224" stroke="#1565c0" stroke-width="2.2" fill="none"/><text x="24" y="292" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.ackSeq (reg 9)</text><path d="M256,274 L464,274 L470,288 L464,302 L256,302 L250,288 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="264" y="293" font-size="11" text-anchor="start" font-weight="normal" fill="#000">7</text><path d="M476,274 L1144,274 L1150,288 L1144,302 L476,302 L470,288 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="484" y="293" font-size="11" text-anchor="start" font-weight="normal" fill="#000">8</text><text x="24" y="344" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.result (reg 10)</text><path d="M256,326 L464,326 L470,340 L464,354 L256,354 L250,340 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="264" y="345" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0</text><path d="M476,326 L1144,326 L1150,340 L1144,354 L476,354 L470,340 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="484" y="345" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0 = OK  (1 unknown · 2 not ready · 3 bad data · 4 busy)</text><text x="24" y="396" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.status BUSY (b1)</text><path d="M250,404 L560,404 L560,380 L900,380 L900,404 L1150,404" stroke="#1565c0" stroke-width="2.2" fill="none"/><text x="24" y="448" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.lotDone (reg 11)</text><path d="M256,430 L554,430 L560,444 L554,458 L256,458 L250,444 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="264" y="449" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0</text><path d="M566,430 L894,430 L900,444 L894,458 L566,458 L560,444 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="574" y="449" font-size="11" text-anchor="start" font-weight="normal" fill="#000">1 … 19 (pieces)</text><path d="M906,430 L1144,430 L1150,444 L1144,458 L906,458 L900,444 Z" stroke="#000" stroke-width="1.2" fill="none"/><text x="914" y="449" font-size="11" text-anchor="start" font-weight="normal" fill="#000">20</text><text x="24" y="500" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.status DONE (b2)</text><path d="M250,508 L900,508 L900,484 L1150,484" stroke="#1565c0" stroke-width="2.2" fill="none"/><text x="24" y="552" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hs.status READY (b4)</text><path d="M250,536 L470,536 L470,560 L900,560 L900,536 L1150,536" stroke="#1565c0" stroke-width="2.2" fill="none"/><line x1="380" y1="588" x2="710" y2="588" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)" marker-start="url(#aas)"/><text x="545" y="582" font-size="11" text-anchor="middle" font-weight="bold" fill="#1565c0">time-out 3 s: no ACK → 422 to the MES</text><text x="24" y="618" font-size="11" text-anchor="start" font-weight="bold" fill="#000">t0</text><text x="54" y="618" font-size="11" text-anchor="start" font-weight="normal" fill="#000">gateway writes the data block 200 – 225 with FC16; REQ is NOT changed yet</text><text x="24" y="636" font-size="11" text-anchor="start" font-weight="bold" fill="#000">t1</text><text x="54" y="636" font-size="11" text-anchor="start" font-weight="normal" fill="#000">gateway toggles REQ with FC06 on 202 (0 → 1, next time 1 → 0)</text><text x="24" y="654" font-size="11" text-anchor="start" font-weight="bold" fill="#000">t2</text><text x="54" y="654" font-size="11" text-anchor="start" font-weight="normal" fill="#000">PLC sees REQ ≠ ACK, checks mode + data, copies them, sets result + ackSeq, then ACK = REQ</text><text x="24" y="672" font-size="11" text-anchor="start" font-weight="bold" fill="#000">t3</text><text x="54" y="672" font-size="11" text-anchor="start" font-weight="normal" fill="#000">lot starts: BUSY = 1, READY = 0, lotDone counts the good pieces</text><text x="24" y="690" font-size="11" text-anchor="start" font-weight="bold" fill="#000">t4</text><text x="54" y="690" font-size="11" text-anchor="start" font-weight="normal" fill="#000">lot finished: BUSY = 0, DONE toggles → gateway event → MES confirmation</text><text x="24" y="708" font-size="11" text-anchor="start" font-weight="bold" fill="#000">t5</text><text x="54" y="708" font-size="11" text-anchor="start" font-weight="normal" fill="#000">the next command is allowed (REQ = ACK); a new toggle starts the next cycle</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Toggle-bit handshake</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-11  ·  guide 43 §8.4</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
