<text x="40.0" y="44.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">Plan view of the aisle with the safety functions (EN 528, ISO 13849-1) – example layout</text><rect x="110.0" y="100.0" width="990.0" height="30.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="1"/><text x="600.0" y="120.0" font-size="12" text-anchor="middle" fill="#000">rack side L</text><rect x="110.0" y="210.0" width="990.0" height="30.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="1"/><text x="600.0" y="230.0" font-size="12" text-anchor="middle" fill="#000">rack side R</text><line x1="110.0" y1="170.0" x2="1100.0" y2="170.0" stroke="#000" stroke-width="2"/><text x="1096.0" y="164.0" font-size="11" text-anchor="end" fill="#000">rail</text><rect x="110.0" y="132.0" width="260.0" height="76.0" rx="0" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="116.0" y="200.0" font-size="12" text-anchor="start" fill="#1565c0">SLS zone 8 m: v ≤ 1.0 m/s</text><rect x="840.0" y="132.0" width="260.0" height="76.0" rx="0" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="846.0" y="200.0" font-size="12" text-anchor="start" fill="#1565c0">SLS zone 8 m: v ≤ 1.0 m/s</text><rect x="84.0" y="158.0" width="16.0" height="26.0" rx="0" fill="#000" stroke="#000" stroke-width="1"/><text x="30.0" y="158.0" font-size="12" text-anchor="start" fill="#000">buffer</text><rect x="1110.0" y="158.0" width="16.0" height="26.0" rx="0" fill="#000" stroke="#000" stroke-width="1"/><text x="1130.0" y="174.0" font-size="12" text-anchor="start" fill="#000">buffer</text><line x1="120.0" y1="128.0" x2="120.0" y2="210.0" stroke="#000" stroke-width="1.4"/><text x="124.0" y="124.0" font-size="11" text-anchor="start" fill="#000">end limit (safety switch)</text><rect x="560.0" y="148.0" width="70.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="595.0" y="175.0" font-size="12" text-anchor="middle" fill="#000">crane</text><line x1="630.0" y1="170.0" x2="700.0" y2="170.0" stroke="#1565c0" stroke-width="1.6"/><text x="640.0" y="164.0" font-size="11" text-anchor="start" fill="#1565c0">v = 3 m/s</text><rect x="20.0" y="100.0" width="70.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="55.0" y="120.0" font-size="11" text-anchor="middle" fill="#000">infeed</text><rect x="20.0" y="210.0" width="70.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="55.0" y="230.0" font-size="11" text-anchor="middle" fill="#000">outfeed</text><line x1="92.0" y1="94.0" x2="92.0" y2="136.0" stroke="#1565c0" stroke-width="3"/><line x1="92.0" y1="204.0" x2="92.0" y2="246.0" stroke="#1565c0" stroke-width="3"/><text x="20.0" y="88.0" font-size="11" text-anchor="start" fill="#1565c0">light curtains + muting</text><rect x="1060.0" y="242.0" width="40.0" height="12.0" rx="0" fill="#000" stroke="#000" stroke-width="1"/><text x="940.0" y="272.0" font-size="11" text-anchor="start" fill="#000">aisle door with guard locking</text><circle cx="300" cy="262" r="7" fill="#fff" stroke="#000" stroke-width="1.4"/><circle cx="700" cy="262" r="7" fill="#fff" stroke="#000" stroke-width="1.4"/><circle cx="900" cy="262" r="7" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="310.0" y="266.0" font-size="11" text-anchor="start" fill="#000">e-stops along the fence + on the crane + HMI</text><text x="40.0" y="320.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">ID</text><text x="90.0" y="320.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Safety function</text><text x="420.0" y="320.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Reaction</text><text x="660.0" y="320.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">PLr</text><text x="700.0" y="320.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Stop cat.</text><text x="40.0" y="340.0" font-size="12" text-anchor="start" fill="#000">SF1</text><text x="90.0" y="340.0" font-size="12" text-anchor="start" fill="#000">Emergency stop</text><text x="420.0" y="340.0" font-size="12" text-anchor="start" fill="#000">SS1 → STO + SBC</text><text x="660.0" y="340.0" font-size="12" text-anchor="start" fill="#000">d</text><text x="712.0" y="340.0" font-size="12" text-anchor="start" fill="#000">1</text><text x="40.0" y="359.0" font-size="12" text-anchor="start" fill="#000">SF2</text><text x="90.0" y="359.0" font-size="12" text-anchor="start" fill="#000">Aisle door interlock + access permission</text><text x="420.0" y="359.0" font-size="12" text-anchor="start" fill="#000">crane to safe pos., SS1, STO, unlock</text><text x="660.0" y="359.0" font-size="12" text-anchor="start" fill="#000">d</text><text x="712.0" y="359.0" font-size="12" text-anchor="start" fill="#000">1</text><text x="40.0" y="378.0" font-size="12" text-anchor="start" fill="#000">SF3</text><text x="90.0" y="378.0" font-size="12" text-anchor="start" fill="#000">Safe reduced speed in the end zones (SLS)</text><text x="420.0" y="378.0" font-size="12" text-anchor="start" fill="#000">SS1 if v &gt; 1.0 m/s</text><text x="660.0" y="378.0" font-size="12" text-anchor="start" fill="#000">d</text><text x="712.0" y="378.0" font-size="12" text-anchor="start" fill="#000">1</text><text x="40.0" y="397.0" font-size="12" text-anchor="start" fill="#000">SF4</text><text x="90.0" y="397.0" font-size="12" text-anchor="start" fill="#000">End-of-aisle overrun (limit + buffers)</text><text x="420.0" y="397.0" font-size="12" text-anchor="start" fill="#000">Stop Cat 0 + brakes</text><text x="660.0" y="397.0" font-size="12" text-anchor="start" fill="#000">d</text><text x="712.0" y="397.0" font-size="12" text-anchor="start" fill="#000">0</text><text x="40.0" y="416.0" font-size="12" text-anchor="start" fill="#000">SF5</text><text x="90.0" y="416.0" font-size="12" text-anchor="start" fill="#000">Hoist overspeed (+ safety gear 130 %)</text><text x="420.0" y="416.0" font-size="12" text-anchor="start" fill="#000">Stop Cat 0 + SBC</text><text x="660.0" y="416.0" font-size="12" text-anchor="start" fill="#000">d</text><text x="712.0" y="416.0" font-size="12" text-anchor="start" fill="#000">0</text><text x="40.0" y="435.0" font-size="12" text-anchor="start" fill="#000">SF6</text><text x="90.0" y="435.0" font-size="12" text-anchor="start" fill="#000">Slack rope / belt</text><text x="420.0" y="435.0" font-size="12" text-anchor="start" fill="#000">Stop Cat 0 + SBC</text><text x="660.0" y="435.0" font-size="12" text-anchor="start" fill="#000">c</text><text x="712.0" y="435.0" font-size="12" text-anchor="start" fill="#000">0</text><text x="40.0" y="454.0" font-size="12" text-anchor="start" fill="#000">SF7</text><text x="90.0" y="454.0" font-size="12" text-anchor="start" fill="#000">Hoist overload (load cell 110 %)</text><text x="420.0" y="454.0" font-size="12" text-anchor="start" fill="#000">no lift, Stop Cat 1</text><text x="660.0" y="454.0" font-size="12" text-anchor="start" fill="#000">c</text><text x="712.0" y="454.0" font-size="12" text-anchor="start" fill="#000">1</text><text x="40.0" y="473.0" font-size="12" text-anchor="start" fill="#000">SF8</text><text x="90.0" y="473.0" font-size="12" text-anchor="start" fill="#000">Fork centre check before travel / hoist</text><text x="420.0" y="473.0" font-size="12" text-anchor="start" fill="#000">STO travel + hoist</text><text x="660.0" y="473.0" font-size="12" text-anchor="start" fill="#000">d</text><text x="712.0" y="473.0" font-size="12" text-anchor="start" fill="#000">1</text><text x="40.0" y="492.0" font-size="12" text-anchor="start" fill="#000">SF9</text><text x="90.0" y="492.0" font-size="12" text-anchor="start" fill="#000">Light curtain I/O with muting</text><text x="420.0" y="492.0" font-size="12" text-anchor="start" fill="#000">conveyor STO</text><text x="660.0" y="492.0" font-size="12" text-anchor="start" fill="#000">d</text><text x="712.0" y="492.0" font-size="12" text-anchor="start" fill="#000">0</text><text x="40.0" y="511.0" font-size="12" text-anchor="start" fill="#000">SF10</text><text x="90.0" y="511.0" font-size="12" text-anchor="start" fill="#000">PROFIsafe watchdog (optical link)</text><text x="420.0" y="511.0" font-size="12" text-anchor="start" fill="#000">SS1 → STO</text><text x="660.0" y="511.0" font-size="12" text-anchor="start" fill="#000">d</text><text x="712.0" y="511.0" font-size="12" text-anchor="start" fill="#000">1</text><line x1="40.0" y1="326.0" x2="760.0" y2="326.0" stroke="#000" stroke-width="1"/><text x="800.0" y="320.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Stopping distance at 3 m/s</text><text x="800.0" y="342.0" font-size="12" text-anchor="start" fill="#000">s = v·t_r + v² / (2a)</text><text x="800.0" y="361.0" font-size="12" text-anchor="start" fill="#000">Cat 1 (SS1, drive ramp 1.0 m/s², t_r 0.15 s):</text><text x="800.0" y="380.0" font-size="12" text-anchor="start" fill="#000">  3·0.15 + 9/2 = 4.95 m, 3.15 s</text><text x="800.0" y="399.0" font-size="12" text-anchor="start" fill="#000">Cat 0 (brake, a ≤ μ·g·share = 0.15·9.81·0.5</text><text x="800.0" y="418.0" font-size="12" text-anchor="start" fill="#000">  = 0.74 → 0.7 m/s², t_r 0.3 s): 7.33 m</text><text x="800.0" y="437.0" font-size="12" text-anchor="start" fill="#000">→ slow down before the end: 3 → 1 m/s</text><text x="800.0" y="456.0" font-size="12" text-anchor="start" fill="#000">  at 0.5 m/s² needs (9 − 1)/(2·0.5) = 8 m</text><text x="800.0" y="475.0" font-size="12" text-anchor="start" fill="#000">Buffer at 1 m/s, 4 500 kg: E = 2 250 J,</text><text x="800.0" y="494.0" font-size="12" text-anchor="start" fill="#000">  stroke 1/(2·5) = 0.10 m (5 m/s²)</text><text x="800.0" y="513.0" font-size="12" text-anchor="start" fill="#000">(full 3 m/s: 20 250 J, 0.9 m)</text><text x="800.0" y="532.0" font-size="12" text-anchor="start" fill="#000">Light curtain distance ISO 13855:</text><text x="800.0" y="551.0" font-size="12" text-anchor="start" fill="#000">  S = 1600·T + 850 = 1600·0.335 + 850</text><text x="800.0" y="570.0" font-size="12" text-anchor="start" fill="#000">  = 1 386 mm (T = 15 + 20 + 300 ms)</text><text x="40.0" y="640.0" font-size="12" text-anchor="start" fill="#000">Stop categories (IEC 60204-1): Cat 0 = remove power at once (STO) + brake · Cat 1 = controlled ramp, then STO (SS1) · Cat 2 = controlled stop, power stays (SOS).</text><text x="40.0" y="660.0" font-size="12" text-anchor="start" fill="#000">STO = Safe Torque Off (pulses blocked), SBC = Safe Brake Control (brake supply cut, 2 channels), SLS = Safely Limited Speed, SOS = Safe Operating Stop.</text><text x="40.0" y="680.0" font-size="12" text-anchor="start" fill="#000">Reset after a trip: manual, from outside the aisle, only when the cause is gone; never an automatic restart (ISO 13849-1).</text>
