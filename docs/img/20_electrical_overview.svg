<text x="490.0" y="700.0" font-size="11" text-anchor="start" fill="#000">Design notes (example – the electrical designer and the risk assessment decide):</text>
<text x="490.0" y="721.0" font-size="11" text-anchor="start" fill="#000">• The twin is NOT a safety function. Speed limit, guard locking and STO/SS1 are in the drive + safety PLC (ISO 13849-1 / IEC 62061).</text>
<text x="490.0" y="742.0" font-size="11" text-anchor="start" fill="#000">• Door unlock only at safe standstill (SSM, e.g. &lt; 10 rpm); opening while turning → SS1 → STO.</text>
<text x="490.0" y="763.0" font-size="11" text-anchor="start" fill="#000">• Overspeed: SLS set to nmax of the spindle on test (e.g. 12 000 rpm + 5 %); set by the recipe, checked by a 2nd channel.</text>
<text x="490.0" y="784.0" font-size="11" text-anchor="start" fill="#000">• Braking: Smart Line Module cannot feed back → braking module + resistor, or Active Line Module (regenerative).</text>
<text x="490.0" y="805.0" font-size="11" text-anchor="start" fill="#000">• E = ½·J·ω² ≈ 10 kJ at 12 000 rpm (J ≈ 0.0128 kg·m²) – size the brake resistor and the guard for this energy.</text>
<text x="490.0" y="826.0" font-size="11" text-anchor="start" fill="#000">• EMC: shielded motor cable, 360° shield clamps, separate trays for power / signals, PE star point (see guide 27).</text>
<text x="490.0" y="847.0" font-size="11" text-anchor="start" fill="#000">• Insulation test before the first run: 500 V DC ≥ 100 MΩ (step 13, example – motor maker value first).</text>
