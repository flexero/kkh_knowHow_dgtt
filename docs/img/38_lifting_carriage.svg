<text x="110.0" y="80.0" font-size="11" text-anchor="middle" fill="#000">mast</text>
<rect x="208.0" y="218.0" width="43.2" height="360.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="208.0" y="574.4" width="345.6" height="36.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="524.0" y="236.0" width="21.6" height="342.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<circle cx="226.0" cy="560.0" r="18.0" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.2"/>
<circle cx="226.0" cy="560.0" r="4.0" fill="#000" stroke="#000" stroke-width="1.2"/>
<circle cx="189.2" cy="560.0" r="10.8" fill="#fff" stroke="#000" stroke-width="1.2"/>
<circle cx="226.0" cy="272.0" r="18.0" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.2"/>
<circle cx="226.0" cy="272.0" r="4.0" fill="#000" stroke="#000" stroke-width="1.2"/>
<circle cx="189.2" cy="272.0" r="10.8" fill="#fff" stroke="#000" stroke-width="1.2"/>
<circle cx="226.0" cy="254.0" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="226.0" y1="254.0" x2="320.0" y2="182.0" stroke="#000" stroke-width="0.7"/>
<text x="324.0" y="186.0" font-size="11.5" text-anchor="start" fill="#000">load roller Ø100, 42CrMo4 hardened, eccentric axle</text>
<circle cx="189.2" cy="571.0" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="189.2" y1="571.0" x2="228.8" y2="678.8" stroke="#000" stroke-width="0.7"/>
<text x="232.8" y="682.8" font-size="11.5" text-anchor="start" fill="#000">counter / side rollers (behind the rail)</text>
<line x1="183.8" y1="272.0" x2="149.2" y2="272.0" stroke="#555" stroke-width="0.6"/>
<line x1="183.8" y1="560.0" x2="149.2" y2="560.0" stroke="#555" stroke-width="0.6"/>
<line x1="153.2" y1="272.0" x2="153.2" y2="560.0" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="147.2" y="416.0" font-size="11.5" text-anchor="middle" fill="#000" transform="rotate(-90 147.2 416.0)">800</text>
<rect x="210.8" y="581.6" width="360.0" height="12.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<rect x="254.0" y="365.6" width="288.0" height="216.0" rx="0" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="398.0" y1="452.0" x2="398.0" y2="522.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<text x="390.0" y="492.0" font-size="11.5" text-anchor="end" fill="#1f6fd1">W = (600 + 300) × 9.81 = 8.83 kN</text>
<line x1="226.0" y1="591.6" x2="226.0" y2="637.6" stroke="#555" stroke-width="0.6"/>
<line x1="398.0" y1="591.6" x2="398.0" y2="637.6" stroke="#555" stroke-width="0.6"/>
<line x1="226.0" y1="633.6" x2="398.0" y2="633.6" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="312.0" y="647.6" font-size="11.5" text-anchor="middle" fill="#000">e = 550</text>
<line x1="286.0" y1="272.0" x2="232.0" y2="272.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<line x1="171.2" y1="560.0" x2="187.0" y2="560.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<text x="295.0" y="276.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">F = 6.07 kN</text>
<text x="167.6" y="550.0" font-size="11.5" text-anchor="end" fill="#1f6fd1" font-weight="bold">F = 6.07 kN</text>
<line x1="221.6" y1="60.0" x2="221.6" y2="218.0" stroke="#000" stroke-width="1.4"/>
<rect x="211.6" y="216.0" width="20.0" height="14.0" rx="0" fill="#fff" stroke="#1f6fd1" stroke-width="1.2"/>
<circle cx="231.6" cy="223.0" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="231.6" y1="223.0" x2="272.0" y2="110.0" stroke="#000" stroke-width="0.7"/>
<text x="276.0" y="114.0" font-size="11.5" text-anchor="start" fill="#000">rope anchor with load pin (overload + slack rope), 1 per rope</text>
<polygon points="208.0,387.2 228.0,380.0 228.0,408.8 208.0,401.6" fill="#000" stroke="#000" stroke-width="1.2"/>
<circle cx="218.0" cy="394.4" r="2.0" fill="#000" stroke="#000" stroke-width="0.5"/>
<line x1="218.0" y1="394.4" x2="272.0" y2="308.0" stroke="#000" stroke-width="0.7"/>
<text x="276.0" y="312.0" font-size="11.5" text-anchor="start" fill="#000">safety catch: wedge clamps on the mast rail (overspeed / rope break)</text>
<text x="640.0" y="110.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Moment from the eccentric load</text>
<text x="640.0" y="129.0" font-size="11.5" text-anchor="start" fill="#000">M = W · e = 8.83 kN × 0.55 m = 4.86 kN·m</text>
<text x="640.0" y="148.0" font-size="11.5" text-anchor="start" fill="#000">roller force per level F = M / h = 4.86 / 0.80 = 6.07 kN</text>
<text x="640.0" y="167.0" font-size="11.5" text-anchor="start" fill="#000">2 rollers per level → 3.04 kN per roller</text>
<text x="640.0" y="186.0" font-size="11.5" text-anchor="start" fill="#000">allowed (steel, p_lim·b·D = 5 × 40 × 100) = 20 kN → 15 %</text>
<text x="640.0" y="224.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Fork extended sideways (300 kg × 1.35 m)</text>
<text x="640.0" y="243.0" font-size="11.5" text-anchor="start" fill="#000">M_side = 2.94 kN × 1.35 m = 3.97 kN·m</text>
<text x="640.0" y="262.0" font-size="11.5" text-anchor="start" fill="#000">side roller force = 3.97 / 0.80 = 4.97 kN</text>
<text x="640.0" y="300.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Safety catch (example)</text>
<text x="640.0" y="319.0" font-size="11.5" text-anchor="start" fill="#000">trip at 1.15 × 1.0 = 1.15 m/s, stop in 0.15 m</text>
<text x="640.0" y="338.0" font-size="11.5" text-anchor="start" fill="#000">a = v² / 2s = 4.4 m/s² → F = 900 × (9.81 + 4.4) = 12.8 kN</text>
<text x="640.0" y="357.0" font-size="11.5" text-anchor="start" fill="#000">≈ 1.45 g – catch + mast rails sized for it, test at FAT</text>
<text x="640.0" y="395.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Adjust: eccentric axles set the roller play</text>
<text x="640.0" y="414.0" font-size="11.5" text-anchor="start" fill="#000">0.1–0.3 mm on the rail; too tight = flats, too loose = tilt</text>
<rect x="774.0" y="752.0" width="414.0" height="66.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="774.0" y1="774.0" x2="1188.0" y2="774.0" stroke="#000" stroke-width="0.8"/>
<line x1="844.0" y1="752.0" x2="844.0" y2="774.0" stroke="#000" stroke-width="0.8"/>
<text x="782.0" y="768.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">38-05</text>
<text x="852.0" y="768.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Lifting carriage – rollers, forces, safety devices</text>
<text x="782.0" y="791.0" font-size="12" text-anchor="start" fill="#b00000" font-weight="bold">EXAMPLE – check the crane maker's drawings</text>
<text x="782.0" y="809.0" font-size="11" text-anchor="start" fill="#000">Digital twin · ASRS-RAW stacker crane · guide 38 · not to scale · mm</text>
