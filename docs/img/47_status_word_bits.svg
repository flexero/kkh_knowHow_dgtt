<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">Status word std.status (offset 4) and handshake word hs.status (offset 8) – bit map</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><text x="30" y="78" font-size="15" text-anchor="start" font-weight="700" fill="#000">std.status – example value 1 = RUN (exactly one state bit + optional bit 4 copy)</text><rect x="1080" y="90" width="62" height="46" rx="0" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.8"/><text x="1111" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 0</text><text x="1111" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#1f6fd1">1</text><text x="1111" y="154" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">RUN</text><text x="1111" y="169" font-size="11" text-anchor="middle" fill="#000">1</text><rect x="1014" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="1045" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 1</text><text x="1045" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="1045" y="154" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">IDLE</text><text x="1045" y="169" font-size="11" text-anchor="middle" fill="#000">2</text><rect x="948" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="979" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 2</text><text x="979" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="979" y="154" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">SET-UP</text><text x="979" y="169" font-size="11" text-anchor="middle" fill="#000">4</text><rect x="882" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="913" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 3</text><text x="913" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="913" y="154" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">ALARM</text><text x="913" y="169" font-size="11" text-anchor="middle" fill="#000">8</text><rect x="816" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="847" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 4</text><text x="847" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="847" y="154" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">E-STOP</text><text x="847" y="169" font-size="11" text-anchor="middle" fill="#000">16</text><rect x="750" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="781" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 5</text><text x="781" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="781" y="154" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">BLOCKED</text><text x="781" y="169" font-size="11" text-anchor="middle" fill="#000">32</text><rect x="684" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="715" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 6</text><text x="715" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="715" y="154" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">STARVED</text><text x="715" y="169" font-size="11" text-anchor="middle" fill="#000">64</text><rect x="618" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="649" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 7</text><text x="649" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="649" y="154" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">NO SHIFT</text><text x="649" y="169" font-size="11" text-anchor="middle" fill="#000">128</text><rect x="552" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="583" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 8</text><text x="583" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="486" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="517" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 9</text><text x="517" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="420" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="451" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 10</text><text x="451" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="354" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="385" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 11</text><text x="385" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="288" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="319" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 12</text><text x="319" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="222" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="253" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 13</text><text x="253" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="156" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="187" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 14</text><text x="187" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="90" y="90" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="121" y="108" font-size="11.5" text-anchor="middle" fill="#000">bit 15</text><text x="121" y="127" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="30" y="196" font-size="13" text-anchor="start" fill="#000">Values: idle 2 · run 1 · set-up 4 · alarm 8 · alarm + e-stop copy 8 + 16 = 24 · blocked 32 · starved 64 · key switch off 128.</text><text x="30" y="298" font-size="15" text-anchor="start" font-weight="700" fill="#000">hs.status – example value 3 = ACK + BUSY (order accepted, lot running; READY is 0 while BUSY)</text><rect x="1080" y="310" width="62" height="46" rx="0" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.8"/><text x="1111" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 0</text><text x="1111" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#1f6fd1">1</text><text x="1111" y="374" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">ACK</text><text x="1111" y="389" font-size="11" text-anchor="middle" fill="#000">1</text><rect x="1014" y="310" width="62" height="46" rx="0" fill="#eef4fc" stroke="#1f6fd1" stroke-width="1.8"/><text x="1045" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 1</text><text x="1045" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#1f6fd1">1</text><text x="1045" y="374" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">BUSY</text><text x="1045" y="389" font-size="11" text-anchor="middle" fill="#000">2</text><rect x="948" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="979" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 2</text><text x="979" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="979" y="374" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">DONE</text><text x="979" y="389" font-size="11" text-anchor="middle" fill="#000">4</text><rect x="882" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="913" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 3</text><text x="913" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="913" y="374" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">REJECT</text><text x="913" y="389" font-size="11" text-anchor="middle" fill="#000">8</text><rect x="816" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="847" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 4</text><text x="847" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="847" y="374" font-size="11.5" text-anchor="middle" font-weight="700" fill="#000">READY</text><text x="847" y="389" font-size="11" text-anchor="middle" fill="#000">16</text><rect x="750" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="781" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 5</text><text x="781" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="684" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="715" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 6</text><text x="715" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="618" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="649" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 7</text><text x="649" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="552" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="583" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 8</text><text x="583" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="486" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="517" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 9</text><text x="517" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="420" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="451" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 10</text><text x="451" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="354" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="385" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 11</text><text x="385" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="288" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="319" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 12</text><text x="319" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="222" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="253" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 13</text><text x="253" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="156" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="187" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 14</text><text x="187" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><rect x="90" y="310" width="62" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="121" y="328" font-size="11.5" text-anchor="middle" fill="#000">bit 15</text><text x="121" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#000">0</text><text x="30" y="416" font-size="13" text-anchor="start" fill="#000">Values: ready for an order 16 · order accepted 1 + 2 = 3 (ACK toggled to 1, BUSY) · lot done 4 (+ ACK 0/1) · rejected 8 + ACK.</text><text x="30" y="560" font-size="15" text-anchor="start" font-weight="700" fill="#000">Bit numbering – the classic trap</text><text x="30" y="588" font-size="12.5" text-anchor="start" fill="#000">Modbus register value: bit 0 = least significant bit (value 1), bit 15 = value 32768. The gateway reads the WORD, then tests (word &gt;&gt; b) &amp; 1.</text><text x="30" y="612" font-size="12.5" text-anchor="start" fill="#000">Delta AS: D4.0 = bit 0 of D4 (value 1) – coils on D4.0 … D4.7 build the word by themselves (check bit-of-word support in your AS firmware).</text><text x="30" y="636" font-size="12.5" text-anchor="start" fill="#000">Siemens: "MB_HR".std_status.%X0 = bit 0 of the WORD VALUE (slice access). Careful with %M / DB BYTE addressing: in a Word at DBW4 the LOW byte is DBB5,</text><text x="30" y="660" font-size="12.5" text-anchor="start" fill="#000">so DBX5.0 = bit 0 and DBX4.0 = bit 8 (big-endian). Use slice access or a typed Bool struct in the right order – never guess.</text><text x="30" y="684" font-size="12.5" text-anchor="start" fill="#000">Status word value is NOT the state code: state code (offset 6) 0 OFF 1 IDLE 2 RUN 3 SETUP 4 DOWN 5 BLOCKED 6 STARVED; RUN = status 1 but state 2.</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>