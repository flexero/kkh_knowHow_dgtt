<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Clearances at the slot – section + plan</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="32.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">A  Section across the fork at the slot (approach height, before the lift)</text>
<rect x="54.8" y="400.0" width="470.4" height="40.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="290.0" y="426.0" font-size="12" text-anchor="middle" fill="#000">front beam (box 120 × 50)</text>
<rect x="122.0" y="124.0" width="336.0" height="138.0" rx="0" fill="#eef3fa" stroke="#000" stroke-width="1.2"/>
<text x="290.0" y="181.5" font-size="12" text-anchor="middle" fill="#000">crate floor + castings</text>
<rect x="122.0" y="262.0" width="21.0" height="138.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<rect x="437.0" y="262.0" width="21.0" height="138.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<rect x="155.6" y="337.9" width="58.8" height="29.9" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="161.9" y="308.0" width="46.2" height="29.9" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<rect x="102.1" y="319.5" width="8.4" height="80.5" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="365.6" y="337.9" width="58.8" height="29.9" rx="0" fill="url(#hatchA)" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="371.9" y="308.0" width="46.2" height="29.9" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<rect x="469.5" y="319.5" width="8.4" height="80.5" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="185.0" y="300.0" font-size="11.5" text-anchor="middle" fill="#000">tine (top 110 / middle 140)</text>
<line x1="355.0" y1="262.0" x2="355.0" y2="308.0" stroke="#1f6fd1" stroke-width="1" marker-end="url(#ea)" marker-start="url(#sa)"/>
<text x="349.0" y="289.0" font-size="11.5" text-anchor="end" fill="#1f6fd1">40</text>
<line x1="355.0" y1="367.8" x2="355.0" y2="400.0" stroke="#1f6fd1" stroke-width="1" marker-end="url(#ea)" marker-start="url(#sa)"/>
<text x="349.0" y="387.9" font-size="11.5" text-anchor="end" fill="#1f6fd1">28</text>
<line x1="424.4" y1="388.5" x2="437.0" y2="388.5" stroke="#1f6fd1" stroke-width="1" marker-end="url(#ea)" marker-start="url(#sa)"/>
<text x="430.7" y="383.5" font-size="11.5" text-anchor="middle" fill="#1f6fd1">30</text>
<line x1="458.0" y1="216.0" x2="469.5" y2="216.0" stroke="#1f6fd1" stroke-width="1" marker-end="url(#ea)" marker-start="url(#sa)"/>
<text x="463.8" y="211.0" font-size="11.5" text-anchor="middle" fill="#1f6fd1">27.5</text>
<text x="481.8" y="304.0" font-size="11.5" text-anchor="start" fill="#000">load guide</text>
<text x="132.5" y="456.0" font-size="12" text-anchor="middle" fill="#000">runner 50 × 120 at ± 375</text>
<text x="24.0" y="470.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Height budget (runner height 120 mm)</text>
<text x="24.0" y="496.0" font-size="12" text-anchor="start" fill="#000">120 = 40 (under the floor) + 52 (middle + top stage under the crate) + 28 (over the beam)</text>
<text x="24.0" y="518.0" font-size="12" text-anchor="start" fill="#000">40 mm ≥ fork tip deflection 4.9 + z budget RSS 8.2 + crate floor sag (≤ 5) + margin</text>
<text x="24.0" y="540.0" font-size="12" text-anchor="start" fill="#000">28 mm ≥ worst case z 18 mm (guide 31 §9: hoist 2, tilt 1, beam level 5, rail 3, beam sag 2, fork 5)</text>
<text x="24.0" y="562.0" font-size="12" text-anchor="start" fill="#000">side 30 mm ≥ worst case x 20 mm (guide 31 §9) – runners guide the tines like a channel</text>
<text x="24.0" y="584.0" font-size="12" text-anchor="start" fill="#000">lift 100 mm = 40 to touch + 60 free over the beams (the load guides stand beside the crate, see plan B)</text>
<text x="640.0" y="32.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">B  Plan of the slot (from above)</text>
<rect x="690.0" y="100.0" width="365.0" height="5.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<text x="1061.0" y="104.0" font-size="11.5" text-anchor="start" fill="#000">front beam</text>
<rect x="690.0" y="316.0" width="365.0" height="5.0" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/>
<text x="1061.0" y="320.0" font-size="11.5" text-anchor="start" fill="#000">rear beam</text>
<rect x="705.0" y="100.0" width="160.0" height="240.0" rx="0" fill="#eef3fa" stroke="#000" stroke-width="1.2"/>
<rect x="695.5" y="92.0" width="4.0" height="60.0" rx="0" fill="#fff" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="870.5" y="92.0" width="4.0" height="60.0" rx="0" fill="#fff" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="765.0" y="346.0" width="40.0" height="4.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="880.0" y="100.0" width="160.0" height="240.0" rx="0" fill="#eef3fa" stroke="#000" stroke-width="1.2"/>
<rect x="870.5" y="92.0" width="4.0" height="60.0" rx="0" fill="#fff" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="1045.5" y="92.0" width="4.0" height="60.0" rx="0" fill="#fff" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="940.0" y="346.0" width="40.0" height="4.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="785.0" y="220.0" font-size="11.5" text-anchor="middle" fill="#000">crate 800 × 1 200</text>
<text x="684.0" y="88.0" font-size="11.5" text-anchor="start" fill="#1f6fd1">aisle side – the fork comes from here</text>
<text x="872.4" y="358.0" font-size="11.5" text-anchor="middle" fill="#000">rear stop (30 mm behind the crate)</text>
<line x1="705.0" y1="368.0" x2="865.0" y2="368.0" stroke="#000" stroke-width="1" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="785.0" y="383.0" font-size="11.5" text-anchor="middle" fill="#000">800</text>
<text x="640.0" y="430.0" font-size="12" text-anchor="start" fill="#000">Load guides: 20 mm wide, 45° lead-in, 70 mm high, in the 75 mm gap between</text>
<text x="640.0" y="452.0" font-size="12" text-anchor="start" fill="#000">2 crates → 27.5 mm free each side; they centre a crate that is up to ≈ 25 mm off.</text>
<text x="640.0" y="474.0" font-size="12" text-anchor="start" fill="#000">After the lift the crate runners are 60 mm over the beam top – the load guides</text>
<text x="640.0" y="496.0" font-size="12" text-anchor="start" fill="#000">stand on the front beam only, beside the crate, so the crate does not touch them.</text>
<text x="24.0" y="640.0" font-size="12" text-anchor="start" fill="#000">Deposit position: crate centre at 1 350 mm ± 5 mm (depth); tine position error RSS ≈ 1.6 mm (encoder, backlash, chain).</text>
<text x="24.0" y="662.0" font-size="12" text-anchor="start" fill="#000">Pallet instead of a crate: the tines go into the pallet openings (≈ 100 mm high) – 25 + 52 + 23 mm, tight; tine spacing must fit the pallet.</text>
<rect x="774" y="752" width="414" height="66" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="774" y1="774" x2="1188" y2="774" stroke="#000" stroke-width="0.8"/><line x1="844" y1="752" x2="844" y2="774" stroke="#000" stroke-width="0.8"/>
<text x="782" y="768" font-size="12.5" fill="#000" font-weight="bold">39-05</text>
<text x="852" y="768" font-size="12" fill="#000" font-weight="bold">Clearances at the slot – section + plan</text>
<text x="782" y="791" font-size="12" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the fork maker's documentation</text>
<text x="782" y="809" font-size="11" fill="#000">Digital twin · ASRS-RAW telescopic fork · guide 39 · not to scale · mm</text>
</svg>
