<text x="60.0" y="590.0" font-size="11" text-anchor="start" fill="#000">Y output switches to 0 V (C0 common).</text>
<text x="60.0" y="606.0" font-size="11" text-anchor="start" fill="#000">Free-wheel diode on every DC coil (or a valve plug</text>
<text x="60.0" y="622.0" font-size="11" text-anchor="start" fill="#000">with LED + suppressor) protects the transistor.</text>
<text x="60.0" y="644.0" font-size="11" text-anchor="start" fill="#c62828">Sourcing wanted? → AS332P-A (PNP) – check.</text>
<text x="700.0" y="92.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Siemens SM 1222 DQ 16 × 24 V DC – source output (right)</text>
