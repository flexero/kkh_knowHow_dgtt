<text x="1170.0" y="436.0" font-size="10" text-anchor="start" fill="#666666">24 V DC, contact 230 V AC</text>
<text x="1170.0" y="452.0" font-size="10" text-anchor="start" fill="#666666">→ -QA1 contactor 1.5 kW pump</text>
<line x1="1140.0" y1="460.0" x2="1140.0" y2="700.0" stroke="#1565c0" stroke-width="1.5"/>
<circle cx="1140.0" cy="700.0" r="3.0" stroke="#1565c0" stroke-width="1" fill="#1565c0"/>
<rect x="700.0" y="540.0" width="640.0" height="130.0" rx="0" stroke="#000" stroke-width="1.2" fill="#fff" stroke-dasharray="5 3"/>
<text x="712.0" y="562.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Servo drive (Delta ASDA-B3 / Siemens SINAMICS V90 PN or S210):</text>
<text x="712.0" y="582.0" font-size="11" text-anchor="start" fill="#000">Delta: Y0.8 SON, Y0.9 CTRG, Y0.10 POS0 → drive DI (24 V, opto); drive DO TPOS / ALRM → X1.7 / X1.8.</text>
<text x="712.0" y="597.0" font-size="11" text-anchor="start" fill="#000">Siemens: no wires – PROFINET telegram 111 with the library block SINA_POS (EnableAxis, Position, ExecuteMode,</text>
<text x="712.0" y="612.0" font-size="11" text-anchor="start" fill="#000">AxisPosOk, Error). STO is NEVER a PLC output of the standard program: STO terminals ← safety relay / F-DQ.</text>
<text x="712.0" y="627.0" font-size="11" text-anchor="start" fill="#000">Outputs max. 0.5 A each (check): a contactor coil &gt; 0.5 A or 230 V AC always via a coupling relay.</text>
<text x="40.0" y="760.0" font-size="12" text-anchor="start" fill="#000">Rules (example):</text>
<text x="40.0" y="776.0" font-size="12" text-anchor="start" fill="#000">• One output → one load. Never parallel two outputs. Check the group current (e.g. SM 1222: 8 A per group of 8 outputs – check the manual).</text>
<text x="40.0" y="792.0" font-size="12" text-anchor="start" fill="#000">• Lift up / lift down: interlocked in the program (Network 12) AND by the 4/3 valve spool (only one position at a time).</text>
<text x="40.0" y="808.0" font-size="12" text-anchor="start" fill="#000">• The safety relay cuts the +24 V of the motion valves (lift, door) and the servo STO – the PLC output alone is never the safety function.</text>
<text x="40.0" y="824.0" font-size="12" text-anchor="start" fill="#000">• Unclamp valve 2V1: spring return = clamped without power (fail-safe for the pallet).</text>
