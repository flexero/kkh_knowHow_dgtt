<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">Output wiring – solenoid valves, coupling relay for the pump contactor, servo inputs (example)</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#666666">Delta AS332T-A = transistor SINK (NPN) outputs: load between +24 V and Y. Siemens 1215C DC/DC/DC and SM 1222 = SOURCE (PNP) outputs: load between Q and M.</text>
