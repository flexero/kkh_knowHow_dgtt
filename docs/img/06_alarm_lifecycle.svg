<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="Arial, Helvetica, sans-serif">
<title>ISA-18.2 alarm management life cycle and alarm states</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">06 – ISA-18.2 / IEC 62682: alarm management life cycle (left) and alarm states (right)</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444">Left: the 10 stages of the programme. Right: what happens to ONE alarm (the twin implements the four main states).</text>
<line x1="377.3" y1="233.7" x2="425.4" y2="253.6" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="506.4" y1="334.6" x2="526.3" y2="382.7" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="526.3" y1="497.3" x2="506.4" y2="545.4" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="425.4" y1="626.4" x2="377.3" y2="646.3" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="262.7" y1="646.3" x2="214.6" y2="626.4" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="133.6" y1="545.4" x2="113.7" y2="497.3" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<line x1="113.7" y1="382.7" x2="133.6" y2="334.6" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<rect x="235.0" y="188.0" width="170.0" height="44.0" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="1.6"/>
<text x="320.0" y="215.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">A Philosophy</text>
<rect x="397.6" y="255.4" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="482.6" y="282.4" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">B Identification</text>
<rect x="465.0" y="418.0" width="170.0" height="44.0" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="1.6"/>
<text x="550.0" y="445.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">C Rationalisation</text>
<rect x="397.6" y="580.6" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="482.6" y="607.6" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">D Detailed design</text>
<rect x="235.0" y="648.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="320.0" y="675.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">E Implementation</text>
<rect x="72.4" y="580.6" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="157.4" y="607.6" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">F Operation</text>
<rect x="5.0" y="418.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="90.0" y="445.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">G Maintenance</text>
<rect x="62.4" y="255.4" width="190.0" height="44.0" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="1.6"/>
<text x="157.4" y="282.4" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">H Monitoring + assessment</text>
<line x1="177.4" y1="255.4" x2="235.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="30.0" y="222.0" font-size="11" text-anchor="start" font-weight="bold" fill="#c0392b">feedback: bad actors, KPIs</text>
<rect x="200.0" y="388.0" width="240.0" height="44.0" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="320.0" y="415.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#c0392b">I Management of change</text>
<rect x="200.0" y="448.0" width="240.0" height="44.0" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="320.0" y="475.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#c0392b">J Audit (whole programme)</text>
<text x="320.0" y="740.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">A, C, H are where most work is (shaded). Every change of a limit or priority goes through I.</text>
<rect x="820.0" y="80.0" width="200.0" height="58.0" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="920.0" y="104.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">NORMAL</text>
<text x="920.0" y="124.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">process OK · alarm ack'ed</text>
<rect x="650.0" y="230.0" width="200.0" height="58.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="750.0" y="254.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#c0392b">UNACK (active)</text>
<text x="750.0" y="274.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">flashing · horn</text>
<rect x="990.0" y="230.0" width="200.0" height="58.0" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="1090.0" y="254.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">ACK (active)</text>
<text x="1090.0" y="274.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">steady colour, no horn</text>
<rect x="820.0" y="380.0" width="200.0" height="58.0" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="920.0" y="404.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">RTN UNACK</text>
<text x="920.0" y="424.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">cleared, not yet ack'ed</text>
<line x1="870.0" y1="138.0" x2="760.0" y2="230.0" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="750.0" y="175.0" font-size="11" text-anchor="end" font-weight="normal" fill="#111">value ≥ limit</text>
<text x="750.0" y="189.0" font-size="11" text-anchor="end" font-weight="normal" fill="#111">(for on-delay)</text>
<line x1="850.0" y1="260.0" x2="990.0" y2="260.0" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="920.0" y="252.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">operator Ack</text>
<line x1="1090.0" y1="230.0" x2="980.0" y2="138.0" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="1050.0" y="175.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">value &lt; limit − deadband</text>
<line x1="750.0" y1="288.0" x2="860.0" y2="380.0" stroke="#111" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="720.0" y="340.0" font-size="11" text-anchor="end" font-weight="normal" fill="#111">value &lt; limit − deadband</text>
<text x="720.0" y="354.0" font-size="11" text-anchor="end" font-weight="normal" fill="#111">before Ack</text>
<line x1="970.0" y1="380.0" x2="970.0" y2="138.0" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ak)"/>
<text x="976.0" y="330.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Ack</text>
<line x1="850.0" y1="398.0" x2="770.0" y2="290.0" stroke="#111" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#ak)"/>
<text x="940.0" y="456.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">comes back before Ack: same record, count + 1</text>
<text x="640.0" y="520.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Special states (remove the alarm from the operator's view – every use is logged):</text>
<rect x="610.0" y="534.0" width="205.0" height="58.0" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="712.5" y="558.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">SHELVED</text>
<text x="712.5" y="578.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">operator · max 24 h (twin 0.25–24 h)</text>
<rect x="825.0" y="534.0" width="195.0" height="58.0" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="922.5" y="558.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">SUPPRESSED</text>
<text x="922.5" y="578.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">by design · e.g. machine state 5</text>
<rect x="1030.0" y="534.0" width="195.0" height="58.0" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="1127.5" y="558.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">OUT OF SERVICE</text>
<text x="1127.5" y="578.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">maintenance · permit + MOC</text>
<text x="640.0" y="620.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Twin (twin/scada.py): UNACK → ACK → gone; UNACK → RTN UNACK → Ack → gone;</text>
<text x="640.0" y="636.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">shelve 0.25–24 h with reason; HIGH-HIGH hides HIGH (vibration) = suppression by design.</text>
<text x="640.0" y="652.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Not in the twin: on/off delay, out-of-service, latched alarms, flood suppression.</text>
<rect x="798.0" y="826.0" width="430.0" height="62.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<line x1="798.0" y1="848.0" x2="1228.0" y2="848.0" stroke="#111" stroke-width="0.8"/>
<line x1="1048.0" y1="848.0" x2="1048.0" y2="888.0" stroke="#111" stroke-width="0.8"/>
<text x="806.0" y="842.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">EXAMPLE – check the maker's documentation</text>
<text x="806.0" y="866.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Drawing 06-04  alarm life cycle + states</text>
<text x="806.0" y="882.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Guide 06 SCADA · V-compressor factory</text>
<text x="1056.0" y="866.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">no scale</text>
<text x="1056.0" y="882.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">rev A · 2026-11-12</text>
