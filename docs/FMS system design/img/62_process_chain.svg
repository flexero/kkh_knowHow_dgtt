<text x="470.0" y="385.0" font-size="12" text-anchor="middle" fill="#222">z_i = z_min,i + T_(i-1)/2 per side:  z1 = 0.30 + 2.000/2 = 1.300   z2 = 0.10 + 0.190/2 = 0.195   z3 = 0.05 + 0.074/2 = 0.087</text>
