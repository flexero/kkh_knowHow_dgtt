<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Arial, Helvetica, sans-serif">
<title>Safety zones of the FMS cell and the cause and effect idea</title>
<rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#111" font-weight="bold">Safety zones of cell FMS1 – a safety event stops only its zone (cause &amp; effect matrix, JSON zones)</text>
<text x="24" y="54" font-size="12" fill="#555">Rows Z1–Z5 act on 12 outputs; ranks RUN 0 &lt; SLS 1 &lt; SS1 2 &lt; STO 3; the highest active action wins. KPI = outputs still RUN.</text>
<!-- layout -->
<rect x="40" y="80" width="680" height="400" fill="#fafafa" stroke="#333" stroke-width="2"/>
<text x="52" y="100" font-size="12" fill="#555">cell fence</text>
<!-- machines -->
<g font-size="12" fill="#111" text-anchor="middle">
<rect x="80" y="120" width="120" height="90" fill="#f4f4f4" stroke="#333"/><text x="140" y="160" font-weight="bold">MC01</text><text x="140" y="178">own safety</text>
<rect x="250" y="120" width="120" height="90" fill="#f4f4f4" stroke="#333"/><text x="310" y="160" font-weight="bold">MC02</text><text x="310" y="178">own safety</text>
<rect x="420" y="120" width="120" height="90" fill="#f4f4f4" stroke="#333"/><text x="480" y="160" font-weight="bold">MC03</text><text x="480" y="178">own safety</text>
<rect x="100" y="212" width="80" height="22" fill="#fff" stroke="#333"/><text x="140" y="228">APC01</text>
<rect x="270" y="212" width="80" height="22" fill="#fff" stroke="#333"/><text x="310" y="228">APC02</text>
<rect x="440" y="212" width="80" height="22" fill="#fff" stroke="#333"/><text x="480" y="228">APC03</text>
</g>
<rect x="70" y="244" width="560" height="110" fill="#eef4fa" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="8 4"/>
<text x="84" y="266" font-size="12" fill="#1f6fb2" font-weight="bold">Z-POOL: aisle, stacker crane (TRAVEL / HOIST / FORK), APC pool side</text>
<rect x="120" y="290" width="70" height="40" fill="#fff" stroke="#333"/><text x="155" y="315" font-size="12" text-anchor="middle">crane</text>
<line x1="90" y1="330" x2="610" y2="330" stroke="#333" stroke-width="2"/>
<rect x="630" y="276" width="18" height="50" fill="#333"/><text x="655" y="300" font-size="11" fill="#111">pool door</text><text x="655" y="314" font-size="11" fill="#111">+ guard locking</text>
<rect x="70" y="372" width="250" height="90" fill="#f3e6e4" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 4"/>
<text x="84" y="394" font-size="12" fill="#c0392b" font-weight="bold">Z-LS: load station LS01</text>
<text x="84" y="414" font-size="12" fill="#111">rotary table, clamp (holding!)</text>
<line x1="330" y1="372" x2="330" y2="462" stroke="#1f6fb2" stroke-width="4"/><text x="336" y="440" font-size="11" fill="#1f6fb2">light curtain</text>
<rect x="430" y="372" width="200" height="90" fill="#f4f4f4" stroke="#333" stroke-width="2" stroke-dasharray="8 4"/>
<text x="444" y="394" font-size="12" fill="#111" font-weight="bold">Z-AGV: dock + transfer</text>
<path d="M630,400 L700,380 L700,460 L630,440 z" fill="#eef4fa" stroke="#1f6fb2"/><text x="640" y="476" font-size="11" fill="#1f6fb2">scanner field</text>
<circle cx="690" cy="110" r="14" fill="#c0392b"/><text x="690" y="114" font-size="10" fill="#fff" text-anchor="middle">E</text><text x="620" y="140" font-size="11" fill="#111">e-stops (whole cell)</text>
<!-- matrix -->
<g font-size="12" fill="#111">
<text x="750" y="96" font-weight="bold">Scenario → active rows → outputs still RUN</text>
<rect x="750" y="106" width="410" height="26" fill="#eeeeee" stroke="#ccc"/>
<text x="760" y="124" font-weight="bold">Scenario</text><text x="1010" y="124" font-weight="bold">rows</text><text x="1090" y="124" font-weight="bold">RUN</text>
<text x="760" y="152">1 Normal automatic</text><text x="1010" y="152">–</text><text x="1100" y="152" font-weight="bold">12</text>
<text x="760" y="176">2 Operator reaches into LS01</text><text x="1010" y="176">Z2</text><text x="1100" y="176" font-weight="bold">10</text>
<text x="760" y="200">3 Pool door opened in automatic</text><text x="1010" y="200">Z3</text><text x="1104" y="200" font-weight="bold">6</text>
<text x="760" y="224">4 Maintenance with enabling</text><text x="1010" y="224">Z4</text><text x="1104" y="224" font-weight="bold">6</text>
<text x="760" y="248">5 Maintenance + AGV dock</text><text x="1010" y="248">Z4, Z5</text><text x="1104" y="248" font-weight="bold">5</text>
<text x="760" y="272">6 E-stop during maintenance</text><text x="1010" y="272">Z1, Z4</text><text x="1104" y="272" font-weight="bold" fill="#c0392b">1</text>
<line x1="750" y1="284" x2="1160" y2="284" stroke="#ccc"/>
<text x="750" y="310" font-weight="bold">Rows</text>
<text x="750" y="332">Z1 e-stop (latched): SS1 drives, STO AGV + MC01–03, clamp "-"</text>
<text x="750" y="354">Z2 light curtain: LS01_ROT STO, POOL_FORK SS1</text>
<text x="750" y="376">Z3 door, no enabling: pool SS1, APC01–03 STO</text>
<text x="750" y="398">Z4 door + enabling: pool SLS, APC01–03 STO</text>
<text x="750" y="420">Z5 AGV dock field: AGV_TRANSFER STO</text>
<text x="750" y="452" fill="#c0392b">LS01_CLAMP stays RUN in every scenario: releasing</text>
<text x="750" y="470" fill="#c0392b">the clamp would drop the pallet (holding function).</text>
</g>
<rect x="40" y="500" width="1120" height="120" fill="#f7f7f7" stroke="#ccc"/>
<g font-size="12" fill="#111">
<text x="56" y="524" font-weight="bold">Scenario 6 explained (Z1 + Z4 active)</text>
<text x="56" y="546">POOL_TRAVEL: Z1 SS1 (2) vs Z4 SLS (1) → SS1 · APC01: Z1 SS1 (2) vs Z4 STO (3) → STO · MC01–03: STO via hard-wired coupling · LS01_CLAMP: no action → RUN</text>
<text x="56" y="570">Zones keep production running: an operator at LS01 stops 2 outputs, maintenance in the pool keeps all three machines machining.</text>
<text x="56" y="594" fill="#777" font-size="11">Teaching model of item7_examples.json; the real safety program uses certified function blocks and is validated per ISO 13849-2.</text>
</g>
</svg>
