<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Arial, Helvetica, sans-serif">
<title>Library engineering - from a change request to a released library version</title>
<rect x="0" y="0" width="1200" height="470" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">Library engineering - from a change request to a released library version</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Semantic version MAJOR.MINOR.PATCH. Every release passes the unit tests with the soft PLC (st_sim.py) against the reference logs, the static checks and a code review.</text>
<rect x="30" y="110" width="150" height="100" rx="8" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="105.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">1 Change request</text>
<text x="105.0" y="163.66666666666666" font-size="11" text-anchor="middle" fill="#111">issue + reason</text>
<text x="105.0" y="177.66666666666666" font-size="11" text-anchor="middle" fill="#111">field fault / new need</text>
<polyline points="180,160 195,160" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="195,160 186.00,156.00 186.00,164.00" fill="#111"/>
<rect x="195" y="110" width="150" height="100" rx="8" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="270.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">2 Branch + code</text>
<text x="270.0" y="163.66666666666666" font-size="11" text-anchor="middle" fill="#111">ST source in Git</text>
<text x="270.0" y="177.66666666666666" font-size="11" text-anchor="middle" fill="#111">plc_lib/*.st</text>
<polyline points="345,160 360,160" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="360,160 351.00,156.00 351.00,164.00" fill="#111"/>
<rect x="360" y="110" width="150" height="100" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="435.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">3 Unit tests</text>
<text x="435.0" y="163.66666666666666" font-size="11" text-anchor="middle" fill="#111">st_sim.py --test</text>
<text x="435.0" y="177.66666666666666" font-size="11" text-anchor="middle" fill="#111">test vectors = logs</text>
<polyline points="510,160 525,160" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="525,160 516.00,156.00 516.00,164.00" fill="#111"/>
<rect x="525" y="110" width="150" height="100" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="600.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">4 Static checks</text>
<text x="600.0" y="163.66666666666666" font-size="11" text-anchor="middle" fill="#111">plc_lib_check.py</text>
<text x="600.0" y="177.66666666666666" font-size="11" text-anchor="middle" fill="#111">naming, one writer</text>
<polyline points="675,160 690,160" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="690,160 681.00,156.00 681.00,164.00" fill="#111"/>
<rect x="690" y="110" width="150" height="100" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="765.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">5 Review</text>
<text x="765.0" y="163.66666666666666" font-size="11" text-anchor="middle" fill="#111">4-eyes checklist</text>
<text x="765.0" y="177.66666666666666" font-size="11" text-anchor="middle" fill="#111">E3 list</text>
<polyline points="840,160 855,160" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="855,160 846.00,156.00 846.00,164.00" fill="#111"/>
<rect x="855" y="110" width="150" height="100" rx="8" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="930.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">6 Release</text>
<text x="930.0" y="163.66666666666666" font-size="11" text-anchor="middle" fill="#111">tag vX.Y.Z</text>
<text x="930.0" y="177.66666666666666" font-size="11" text-anchor="middle" fill="#111">change log, export</text>
<polyline points="1005,160 1020,160" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="1020,160 1011.00,156.00 1011.00,164.00" fill="#111"/>
<rect x="1020" y="110" width="150" height="100" rx="8" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1095.0" y="149.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">7 Roll-out</text>
<text x="1095.0" y="163.66666666666666" font-size="11" text-anchor="middle" fill="#111">projects update</text>
<text x="1095.0" y="177.66666666666666" font-size="11" text-anchor="middle" fill="#111">regression + FAT</text>
<polyline points="477,210 477,260 152,260 152,210" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="152,210 148.00,219.00 156.00,219.00" fill="#c0392b"/>
<text x="315" y="278" font-size="11" text-anchor="middle" fill="#c0392b">test fails -&gt; back to code</text>
<rect x="30" y="310" width="1140" height="130" rx="8" fill="#ffffff" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
<text x="50" y="335" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Version rule (example)</text>
<text x="50" y="358" font-size="11" text-anchor="start" fill="#111">PATCH  1.2.3 -&gt; 1.2.4 : bug fix, same interface, same behaviour for correct inputs (e.g. timer counted one call too late).</text>
<text x="50" y="378" font-size="11" text-anchor="start" fill="#111">MINOR  1.2.4 -&gt; 1.3.0 : new optional input/output with a default that keeps the old behaviour (e.g. cfg tLost_ms added, default = old).</text>
<text x="50" y="398" font-size="11" text-anchor="start" fill="#111">MAJOR  1.3.0 -&gt; 2.0.0 : interface or behaviour change that needs a project change (e.g. Valve error now switches outputs off, alarm codes renumbered).</text>
<text x="50" y="420" font-size="11" text-anchor="start" fill="#555">A project freezes its library version at FAT; an upgrade is a change with a regression test (all FB tests + module tests + the affected FAT steps).</text>
</svg>
