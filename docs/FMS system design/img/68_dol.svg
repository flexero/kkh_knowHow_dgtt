<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Arial, Helvetica, sans-serif">
<title>DOL starter pattern: MPCB + contactor AC-3 + motor (example: washer spray pump 7.5 kW)</title>
<rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">DOL starter pattern: MPCB + contactor AC-3 + motor (example: washer spray pump 7.5 kW)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">In = 7 500 / (√3 · 400 · 0.88 · 0.82) = 15.00 A → contactor 18 A (AC-3), MPCB set to 15.00 A; motor cable 4G1.5 default – check Iz.</text>
<text x="120" y="90" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">POWER PATH</text>
<line x1="60" y1="110" x2="260" y2="110" stroke="#111" stroke-width="1.5"/>
<text x="40" y="114" font-size="11" text-anchor="start" fill="#111">L1</text>
<line x1="60" y1="124" x2="260" y2="124" stroke="#111" stroke-width="1.5"/>
<text x="40" y="128" font-size="11" text-anchor="start" fill="#111">L2</text>
<line x1="60" y1="138" x2="260" y2="138" stroke="#111" stroke-width="1.5"/>
<text x="40" y="142" font-size="11" text-anchor="start" fill="#111">L3</text>
<line x1="120" y1="138" x2="120" y2="160" stroke="#111" stroke-width="1.5"/>
<line x1="120" y1="160" x2="120" y2="168" stroke="#111" stroke-width="1.5"/>
<line x1="120" y1="186" x2="120" y2="194" stroke="#111" stroke-width="1.5"/>
<line x1="120" y1="186" x2="110" y2="169" stroke="#111" stroke-width="1.5"/>
<line x1="116" y1="164" x2="124" y2="172" stroke="#111" stroke-width="1.5"/>
<line x1="124" y1="164" x2="116" y2="172" stroke="#111" stroke-width="1.5"/>
<rect x="128" y="172" width="10" height="8" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="142" y="182" font-size="11" text-anchor="start" fill="#111">-FC1 MPCB (thermal I&gt; + magnetic I&gt;&gt;), set 15.00 A</text>
<line x1="120" y1="194" x2="120" y2="230" stroke="#111" stroke-width="1.5"/>
<line x1="120" y1="230" x2="120" y2="238" stroke="#111" stroke-width="1.5"/>
<line x1="120" y1="252" x2="120" y2="260" stroke="#111" stroke-width="1.5"/>
<line x1="120" y1="252" x2="111" y2="239" stroke="#111" stroke-width="1.5"/>
<text x="128" y="249" font-size="11" text-anchor="start" fill="#111">-QA1 main contacts 1-2 / 3-4 / 5-6 (AC-3 18 A)</text>
<line x1="120" y1="260" x2="120" y2="300" stroke="#111" stroke-width="1.5"/>
<circle cx="120" cy="304" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="128" y="308" font-size="11" text-anchor="start" fill="#111">-XD1:1–3 + PE</text>
<line x1="120" y1="308" x2="120" y2="360" stroke="#111" stroke-width="1.5"/>
<text x="130" y="340" font-size="11" text-anchor="start" fill="#111">-WD1 motor cable 4G1.5, 15 m</text>
<circle cx="120" cy="384" r="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="120" y="382" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">M</text>
<text x="120" y="396" font-size="11" text-anchor="middle" fill="#111">3~</text>
<text x="146" y="388" font-size="11" text-anchor="start" fill="#111">-MA1 7.5 kW</text>
<line x1="80" y1="384" x2="80" y2="392" stroke="#4a8a3a" stroke-width="1.5"/>
<line x1="71" y1="392" x2="89" y2="392" stroke="#4a8a3a" stroke-width="1.5"/>
<line x1="74" y1="396" x2="86" y2="396" stroke="#4a8a3a" stroke-width="1.5"/>
<line x1="77" y1="400" x2="83" y2="400" stroke="#4a8a3a" stroke-width="1.5"/>
<text x="640" y="90" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">CONTROL PATH (24 V DC)</text>
<line x1="460" y1="110" x2="1140" y2="110" stroke="#111" stroke-width="1.5"/>
<text x="1150" y="114" font-size="11" text-anchor="start" fill="#111">+24V</text>
<line x1="460" y1="520" x2="1140" y2="520" stroke="#111" stroke-width="1.5"/>
<text x="1150" y="524" font-size="11" text-anchor="start" fill="#111">0 V</text>
<text x="520" y="135" font-size="11" text-anchor="middle" fill="#111">DO card</text>
<rect x="475" y="140" width="90" height="40" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="520" y="158" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">DO1.00</text>
<text x="520" y="174" font-size="11" text-anchor="middle" fill="#111">Run</text>
<line x1="520" y1="180" x2="520" y2="300" stroke="#111" stroke-width="1.5"/>
<rect x="503" y="300" width="34" height="18" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="543" y="313" font-size="11" text-anchor="start" fill="#111">-QA1 coil A1/A2 (+ RC suppressor)</text>
<line x1="520" y1="318" x2="520" y2="520" stroke="#111" stroke-width="1.5"/>
<text x="480" y="345" font-size="11" text-anchor="start" fill="#666">contact image -QA1:</text>
<text x="480" y="360" font-size="11" text-anchor="start" fill="#666">1-2/3-4/5-6 → 12.1 · 13-14 → 12.6</text>
<line x1="820" y1="110" x2="820" y2="230" stroke="#111" stroke-width="1.5"/>
<line x1="820" y1="230" x2="820" y2="238" stroke="#111" stroke-width="1.5"/>
<line x1="820" y1="252" x2="820" y2="260" stroke="#111" stroke-width="1.5"/>
<line x1="820" y1="252" x2="811" y2="239" stroke="#111" stroke-width="1.5"/>
<text x="828" y="249" font-size="11" text-anchor="start" fill="#111">-QA1 13-14</text>
<line x1="820" y1="260" x2="820" y2="330" stroke="#111" stroke-width="1.5"/>
<rect x="775" y="330" width="90" height="40" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="820" y="348" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">DI1.00</text>
<text x="820" y="364" font-size="11" text-anchor="middle" fill="#111">RunFb</text>
<line x1="1020" y1="110" x2="1020" y2="230" stroke="#111" stroke-width="1.5"/>
<line x1="1020" y1="230" x2="1020" y2="238" stroke="#111" stroke-width="1.5"/>
<line x1="1020" y1="252" x2="1020" y2="260" stroke="#111" stroke-width="1.5"/>
<line x1="1020" y1="252" x2="1011" y2="239" stroke="#111" stroke-width="1.5"/>
<text x="1028" y="249" font-size="11" text-anchor="start" fill="#111">-FC1 tripped</text>
<line x1="1020" y1="260" x2="1020" y2="330" stroke="#111" stroke-width="1.5"/>
<rect x="975" y="330" width="90" height="40" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1020" y="348" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">DI1.01</text>
<text x="1020" y="364" font-size="11" text-anchor="middle" fill="#111">Tripped</text>
<rect x="470" y="410" width="680" height="80" rx="0" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
<text x="485" y="432" font-size="11" text-anchor="start" fill="#111">PLC side: Run in Execute; RunFb must follow within 0.5 s else alarm + Aborting; Tripped → alarm.</text>
<text x="485" y="450" font-size="11" text-anchor="start" fill="#c0392b">Safety (if the motor is a hazard): coil supply through a zone F-DO or CONT_PAIR_EDM (e.g. washer SF6).</text>
<text x="485" y="468" font-size="11" text-anchor="start" fill="#111">FAT: MPCB setting = In · force Run → RunFb · test trip → Tripped · rotation direction at site.</text>
<text x="24" y="626" font-size="11" text-anchor="start" fill="#666">Teaching example – not for construction. Real circuits: qualified engineers, IEC 60204-1, ISO 13849, maker data.</text>
</svg>
