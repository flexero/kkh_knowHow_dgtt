<text x="90.0" y="462.0" font-size="12.5" text-anchor="start" fill="#111111" font-weight="bold">Total 39 alarms = 4.88 per hour (target &lt;= 6 acceptable) - peak 15 per 10 min - 1 of 48 windows in flood (2.1 %).</text>
<text x="90.0" y="482.0" font-size="12.5" text-anchor="start" fill="#111111">Priorities: low 22 (56.4 %), medium 13 (33.3 %), high 4 (10.3 %)  vs target 80 / 15 / 5 %  -&gt; too many medium and high alarms.</text>
<text x="90.0" y="502.0" font-size="12.5" text-anchor="start" fill="#111111">Top bad actors: WASH1.LevelHigh 6, MC01.CoolantLow 3, MC02.SpindleTemp 3, POOL1.ForkPos 3, LS1.LightCurtain 2.</text>
