<line x1="146" y1="276" x2="420" y2="276" stroke="#c0392b" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="146" y1="299" x2="420" y2="299" stroke="#c0392b" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="146" y1="322" x2="420" y2="322" stroke="#c0392b" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="146" y1="345" x2="420" y2="345" stroke="#c0392b" stroke-width="1" stroke-dasharray="6 4"/>
<text x="283" y="95" font-size="11" text-anchor="middle" fill="#c0392b">protective field (resolution 14 / 30 mm)</text>
<rect x="230" y="300" width="110" height="70" rx="0" fill="#fff" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
