<text x="780" y="294" font-size="11" text-anchor="middle" fill="#111">+24 V receiver</text>
<line x1="446" y1="180" x2="560" y2="324" stroke="#666" stroke-width="1"/>
<circle cx="570" cy="324" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="580" y="318" font-size="11" text-anchor="start" fill="#111">-XD2:7</text>
<line x1="574" y1="324" x2="680" y2="324" stroke="#111" stroke-width="1.5"/>
<rect x="680" y="310" width="200" height="28" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="780" y="328" font-size="11" text-anchor="middle" fill="#111">0 V receiver</text>
<rect x="910" y="100" width="250" height="250" rx="0" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
<text x="925" y="125" font-size="11" text-anchor="start" font-weight="bold" fill="#111">Safety program:</text>
<text x="925" y="149" font-size="11" text-anchor="start" fill="#c0392b">OSSD off → STO Rotary (FDO1.00)</text>
<text x="925" y="173" font-size="11" text-anchor="start" fill="#c0392b">+ pool fork stop (POOL01)</text>
<text x="925" y="197" font-size="11" text-anchor="start" fill="#111">clamp keeps holding</text>
<text x="925" y="221" font-size="11" text-anchor="start" fill="#111">module Held / Suspended</text>
<text x="925" y="245" font-size="11" text-anchor="start" fill="#111">reset outside, view into zone</text>
<text x="925" y="269" font-size="11" text-anchor="start" fill="#111">Warn → &quot;clean lens&quot; alarm</text>
<text x="925" y="293" font-size="11" text-anchor="start" fill="#111">data block M04 word 20 bit1</text>
<text x="925" y="317" font-size="11" text-anchor="start" fill="#111">LightCurtainOK</text>
<text x="80" y="500" font-size="11" text-anchor="start" fill="#111">FAT: test rod through the whole field (edges, centre) → OSSDs off each time; stopping-time measurement; emitter disconnected → fault.</text>
<text x="80" y="518" font-size="11" text-anchor="start" fill="#111">Typical faults: distance too small · stepping behind the curtain (needs presence detection / restart interlock) · F-DI test pulses on OSSD inputs.</text>
<text x="24" y="586" font-size="11" text-anchor="start" fill="#666">Teaching example – not for construction. Real circuits: qualified engineers, IEC 60204-1, ISO 13849, maker data.</text>
</svg>
