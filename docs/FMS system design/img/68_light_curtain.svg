<polygon points="146,410 154.29,406.495 154.29,413.505" fill="#111"/>
<text x="285" y="428" font-size="11" text-anchor="middle" fill="#111">safety distance S = K·T + C (guide 67 H4: 370 / 498 / 608 mm)</text>
<text x="80" y="470" font-size="11" text-anchor="start" fill="#111">-WD1 emitter M12 5-pole (5x0.34) · -WD2 receiver M12 8-pole (8x0.25), 10 m each</text>
