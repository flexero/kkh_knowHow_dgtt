<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>LC: light curtain type 4 with OSSD pair at the load station (module M04, SF2)</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">LC: light curtain type 4 with OSSD pair at the load station (module M04, SF2)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">OSSD1 / OSSD2 → F-DI (F-DI test pulses OFF for OSSD inputs), warning → DI, emitter + receiver supply = 4 extra terminals (tx 4).</text>
