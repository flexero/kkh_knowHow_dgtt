<rect x="680" y="174" width="200" height="28" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="780" y="192" font-size="11" text-anchor="middle" fill="#111">DI1.00 Warn</text>
<line x1="446" y1="180" x2="560" y2="222" stroke="#666" stroke-width="1"/>
<circle cx="570" cy="222" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
