<text x="24" y="32" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">FMS network architecture - zones, VLANs, firewalls (example site 1)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555555">One VLAN / subnet per zone and per cell. Real-time fieldbus stays inside the cell. Gateway .1 of each cell = cell firewall. All addresses are examples.</text>
