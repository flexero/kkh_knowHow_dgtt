<text x="640" y="590" font-size="12" text-anchor="start" fill="#111111">Rules (Part G): default deny - conduits only between neighbour zones</text>
<text x="640" y="610" font-size="12" text-anchor="start" fill="#111111">- office never directly to a cell</text>
<text x="640" y="630" font-size="12" text-anchor="start" fill="#111111">- remote service only via the jump host</text>
<text x="640" y="650" font-size="12" text-anchor="start" fill="#111111">- nothing in a cell talks to the internet (offline factory)</text>
