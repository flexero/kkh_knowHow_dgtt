<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" style="font-family:Arial,Helvetica,sans-serif">
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<text x="480.0" y="24.0" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Opitz-style form code of the crankshaft blank: 2 5 0 3 3 (simplified, example)</text>
<rect x="120.0" y="92.0" width="64.0" height="36.0" fill="#e8eef7" stroke="#335" stroke-width="1.5" rx="0" opacity="1"/>
<rect x="184.0" y="86.0" width="96.0" height="48.0" fill="#e8eef7" stroke="#335" stroke-width="1.5" rx="0" opacity="1"/>
<rect x="280.0" y="80.0" width="192.0" height="60.0" fill="#e8eef7" stroke="#335" stroke-width="1.5" rx="0" opacity="1"/>
<rect x="472.0" y="86.0" width="96.0" height="48.0" fill="#e8eef7" stroke="#335" stroke-width="1.5" rx="0" opacity="1"/>
<rect x="568.0" y="92.0" width="64.0" height="36.0" fill="#e8eef7" stroke="#335" stroke-width="1.5" rx="0" opacity="1"/>
<rect x="344.0" y="80.0" width="48.0" height="8.0" fill="#fff" stroke="#335" stroke-width="1" rx="0" opacity="1"/>
<text x="368.0" y="74.0" font-size="10" text-anchor="middle" fill="#222">keyway</text>
<line x1="408.0" y1="80.0" x2="408.0" y2="118.0" stroke="#c8322f" stroke-width="2"/>
<line x1="440.0" y1="80.0" x2="440.0" y2="118.0" stroke="#c8322f" stroke-width="2"/>
<text x="424.0" y="134.0" font-size="10" text-anchor="middle" fill="#c8322f">2 radial oil holes</text>
<polyline points="124.0,106.0 114.0,110.0 124.0,114.0" fill="none" stroke="#335" stroke-width="1"/>
<polyline points="628.0,106.0 638.0,110.0 628.0,114.0" fill="none" stroke="#335" stroke-width="1"/>
<text x="130.0" y="150.0" font-size="10" text-anchor="start" fill="#222">thread</text>
<text x="640.0" y="150.0" font-size="10" text-anchor="end" fill="#222">thread</text>
<line x1="120.0" y1="162.0" x2="632.0" y2="162.0" stroke="#333" stroke-width="1"/>
<text x="376.0" y="176.0" font-size="11" text-anchor="middle" fill="#222">L = 320 mm,  D = 60 mm,  L/D = 5.33</text>
<rect x="40.0" y="200.0" width="164.0" height="60.0" fill="#fff" stroke="#2f6db5" stroke-width="2.5" rx="6" opacity="1"/>
<text x="122.0" y="244.0" font-size="34" text-anchor="middle" fill="#2f6db5" font-weight="bold">2</text>
<text x="122.0" y="280.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Digit 1</text>
<text x="122.0" y="296.0" font-size="11" text-anchor="middle" fill="#222">part class</text>
<text x="122.0" y="318.0" font-size="10" text-anchor="middle" fill="#444">L/D = 5.33 &gt;= 3 -&gt;</text>
<text x="122.0" y="332.0" font-size="10" text-anchor="middle" fill="#444">rotational, long</text>
<rect x="216.0" y="200.0" width="164.0" height="60.0" fill="#fff" stroke="#3c9a5f" stroke-width="2.5" rx="6" opacity="1"/>
<text x="298.0" y="244.0" font-size="34" text-anchor="middle" fill="#3c9a5f" font-weight="bold">5</text>
<text x="298.0" y="280.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Digit 2</text>
<text x="298.0" y="296.0" font-size="11" text-anchor="middle" fill="#222">external shape</text>
<text x="298.0" y="318.0" font-size="10" text-anchor="middle" fill="#444">stepped to both ends,</text>
<text x="298.0" y="332.0" font-size="10" text-anchor="middle" fill="#444">with screw thread</text>
<rect x="392.0" y="200.0" width="164.0" height="60.0" fill="#fff" stroke="#e08a1e" stroke-width="2.5" rx="6" opacity="1"/>
<text x="474.0" y="244.0" font-size="34" text-anchor="middle" fill="#e08a1e" font-weight="bold">0</text>
<text x="474.0" y="280.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Digit 3</text>
<text x="474.0" y="296.0" font-size="11" text-anchor="middle" fill="#222">internal shape</text>
<text x="474.0" y="318.0" font-size="10" text-anchor="middle" fill="#444">no bore (centre holes do</text>
<text x="474.0" y="332.0" font-size="10" text-anchor="middle" fill="#444">not count)</text>
<rect x="568.0" y="200.0" width="164.0" height="60.0" fill="#fff" stroke="#8a4fbf" stroke-width="2.5" rx="6" opacity="1"/>
<text x="650.0" y="244.0" font-size="34" text-anchor="middle" fill="#8a4fbf" font-weight="bold">3</text>
<text x="650.0" y="280.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Digit 4</text>
<text x="650.0" y="296.0" font-size="11" text-anchor="middle" fill="#222">plane surface machining</text>
<text x="650.0" y="318.0" font-size="10" text-anchor="middle" fill="#444">external groove / slot</text>
<text x="650.0" y="332.0" font-size="10" text-anchor="middle" fill="#444">(keyway)</text>
<rect x="744.0" y="200.0" width="164.0" height="60.0" fill="#fff" stroke="#c8322f" stroke-width="2.5" rx="6" opacity="1"/>
<text x="826.0" y="244.0" font-size="34" text-anchor="middle" fill="#c8322f" font-weight="bold">3</text>
<text x="826.0" y="280.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Digit 5</text>
<text x="826.0" y="296.0" font-size="11" text-anchor="middle" fill="#222">auxiliary holes / teeth</text>
<text x="826.0" y="318.0" font-size="10" text-anchor="middle" fill="#444">radial holes, not related</text>
<text x="826.0" y="332.0" font-size="10" text-anchor="middle" fill="#444">by a pattern</text>
<text x="480.0" y="362.0" font-size="11" text-anchor="middle" fill="#555">Digits 1-5 = form code (shape). Opitz adds a supplementary code (digits 6-9: size, material, raw form, accuracy). Always use the original tables.</text>
</svg>