<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Arial, Helvetica, sans-serif">
<title>TN-S earthing system and the fault loop</title>
<defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker></defs>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#111" font-weight="bold">TN-S system – separate PE and N from the transformer, and the fault loop of automatic disconnection</text>
<text x="24" y="54" font-size="12" fill="#555">T = star point earthed · N = frames connected to the star point by PE · S = PE and N separate. No current on PE in normal operation.</text>
<!-- transformer secondary -->
<text x="70" y="96" font-size="13" fill="#111" font-weight="bold">Transformer</text>
<g stroke="#333" stroke-width="2" fill="none">
<path d="M90,140 l20,-8 l-20,-8 l20,-8"/><path d="M90,220 l20,-8 l-20,-8 l20,-8"/><path d="M90,300 l20,-8 l-20,-8 l20,-8"/>
<line x1="90" y1="140" x2="90" y2="380"/>
</g>
<circle cx="90" cy="380" r="5" fill="#333"/>
<text x="40" y="400" font-size="12" fill="#111">star point</text>
<line x1="90" y1="380" x2="90" y2="440" stroke="#333" stroke-width="2"/>
<g stroke="#333" stroke-width="2"><line x1="70" y1="440" x2="110" y2="440"/><line x1="76" y1="448" x2="104" y2="448"/><line x1="83" y1="456" x2="97" y2="456"/></g>
<text x="120" y="452" font-size="12" fill="#111">system earth</text>
<!-- conductors -->
<g stroke-width="2.5">
<line x1="110" y1="124" x2="1000" y2="124" stroke="#333"/><text x="1010" y="128" font-size="13" fill="#111">L1</text>
<line x1="110" y1="204" x2="1000" y2="204" stroke="#333"/><text x="1010" y="208" font-size="13" fill="#111">L2</text>
<line x1="110" y1="284" x2="1000" y2="284" stroke="#333"/><text x="1010" y="288" font-size="13" fill="#111">L3</text>
<line x1="90" y1="330" x2="1000" y2="330" stroke="#6aa0d8"/><text x="1010" y="334" font-size="13" fill="#111">N (light blue)</text>
<line x1="90" y1="380" x2="1000" y2="380" stroke="#4a8a3a" stroke-dasharray="14 6"/><text x="1010" y="384" font-size="13" fill="#111">PE (green-yellow)</text>
</g>
<!-- machine -->
<rect x="640" y="410" width="240" height="100" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
<text x="760" y="440" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Machine frame (MC02)</text>
<text x="760" y="460" font-size="12" fill="#111" text-anchor="middle">exposed conductive part</text>
<line x1="840" y1="380" x2="840" y2="410" stroke="#4a8a3a" stroke-width="2.5"/>
<!-- breaker -->
<rect x="300" y="112" width="40" height="24" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="320" y="104" font-size="12" fill="#111" text-anchor="middle">80 A C (Ia = 800 A)</text>
<!-- fault -->
<line x1="700" y1="124" x2="700" y2="410" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="708" y="250" font-size="12" fill="#c0392b">insulation fault L1 → frame</text>
<!-- loop arrow -->
<path d="M160,112 L680,112" stroke="#1f6fb2" stroke-width="2" fill="none" marker-end="url(#aa)"/>
<path d="M720,395 L860,395" stroke="#1f6fb2" stroke-width="0" fill="none"/>
<path d="M820,372 L120,372" stroke="#1f6fb2" stroke-width="2" fill="none" marker-end="url(#aa)"/>
<text x="400" y="364" font-size="12" fill="#1f6fb2">fault current returns on PE to the star point</text>
<rect x="160" y="470" width="440" height="72" fill="#eef4fa" stroke="#1f6fb2"/>
<text x="172" y="492" font-size="12" fill="#111">Zs = Z_ext + L·ρ·(1/A + 1/A_pe) = 0.15 + 0.1229 = 0.2729 Ω</text>
<text x="172" y="512" font-size="12" fill="#111">Ik1 = U0 / Zs = 230 / 0.2729 = 842.7 A ≥ Ia = 800 A → trips &lt; 0.1 s</text>
<text x="172" y="532" font-size="12" fill="#111">Rule: one PEN→PE+N split point only; never bridge N and PE again.</text>
<text x="900" y="530" font-size="11" fill="#777">Example values (JSON cable case).</text>
</svg>
