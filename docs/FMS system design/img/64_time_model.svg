<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Arial, Helvetica, sans-serif">
<title>Time model of one machine for one week (JSON oee example, minutes)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">Time model of one machine for one week (JSON oee example, minutes)</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#52514e">Each bar is a part of the bar above it. The text on the right is the loss that makes the next bar shorter.</text>
<text x="220.0" y="108.0" font-size="13" text-anchor="end" fill="#111111" font-weight="bold">Calendar time</text>
<rect x="230.0" y="88.0" width="440.0" height="30.0" rx="3" fill="#9a9890" stroke="none" stroke-width="1"/>
<text x="678.0" y="108.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">10 080 min</text>
<text x="678.0" y="130.0" font-size="11.5" text-anchor="start" fill="#52514e">non-planned 5580 min (no shift, weekend)</text>
<text x="220.0" y="180.0" font-size="13" text-anchor="end" fill="#111111" font-weight="bold">Planned production time</text>
<rect x="230.0" y="160.0" width="196.4" height="30.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/>
<text x="434.4" y="180.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">4 500 min</text>
<text x="434.4" y="202.0" font-size="11.5" text-anchor="start" fill="#52514e">breakdowns 270 + set-ups 360 = 630 min -&gt; A = 86.0 %</text>
<text x="220.0" y="252.0" font-size="13" text-anchor="end" fill="#111111" font-weight="bold">Run (operating) time</text>
<rect x="230.0" y="232.0" width="168.9" height="30.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/>
<text x="406.9" y="252.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">3 870 min</text>
<text x="406.9" y="274.0" font-size="11.5" text-anchor="start" fill="#52514e">minor stops 150 + speed loss 420 = 570 min -&gt; P = 85.3 %</text>
<text x="220.0" y="324.0" font-size="13" text-anchor="end" fill="#111111" font-weight="bold">Net run time</text>
<rect x="230.0" y="304.0" width="144.0" height="30.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/>
<text x="382.0" y="324.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">3 300 min</text>
<text x="382.0" y="346.0" font-size="11.5" text-anchor="start" fill="#52514e">scrap / rework 80 min -&gt; Q = 97.6 %</text>
<text x="220.0" y="396.0" font-size="13" text-anchor="end" fill="#111111" font-weight="bold">Fully productive time</text>
<rect x="230.0" y="376.0" width="140.6" height="30.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1"/>
<text x="378.6" y="396.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">3 220 min</text>
<text x="378.6" y="418.0" font-size="11.5" text-anchor="start" fill="#52514e">OEE = 3220 / 4500 = 71.6 %  ·  TEEP = 3220 / 10080 = 31.9 %</text>
<text x="24.0" y="455.0" font-size="12" text-anchor="start" fill="#52514e">A = run / planned · P = ideal cycle x parts made / run · Q = good / made · OEE = A·P·Q = fully productive / planned · TEEP = OEE · planned / calendar</text>
</svg>