<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Arial, Helvetica, sans-serif">
<title>Message flow cell controller &lt;-&gt; MES and &lt;-&gt; module with the five error paths (Part F)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">Message flow cell controller &lt;-&gt; MES and &lt;-&gt; module with the five error paths (Part F)</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#52514e">Solid = message, dashed = reply. Every message has an ID, a sequence number and a time-out. Red = error path and the reaction.</text>
<rect x="30.0" y="72.0" width="180.0" height="40.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="120.0" y="96.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">MES</text>
<line x1="120.0" y1="112.0" x2="120.0" y2="680.0" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="330.0" y="72.0" width="180.0" height="40.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="420.0" y="96.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Cell controller</text>
<line x1="420.0" y1="112.0" x2="420.0" y2="680.0" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="630.0" y="72.0" width="180.0" height="40.0" rx="6" fill="#f8dcd3" stroke="#333" stroke-width="1.5"/>
<text x="720.0" y="96.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Stacker PLC</text>
<line x1="720.0" y1="112.0" x2="720.0" y2="680.0" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="930.0" y="72.0" width="180.0" height="40.0" rx="6" fill="#f8dcd3" stroke="#333" stroke-width="1.5"/>
<text x="1020.0" y="96.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">MC02 CNC</text>
<line x1="1020.0" y1="112.0" x2="1020.0" y2="680.0" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="120.0" y1="140.0" x2="416.0" y2="140.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="270.0" y="134.0" font-size="11.5" text-anchor="middle" fill="#111111">JOB msgId=M-1001 seq=57 WO-4711-10 O2010C</text>
<line x1="420.0" y1="168.0" x2="124.0" y2="168.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="6,4"/>
<text x="270.0" y="162.0" font-size="11.5" text-anchor="middle" fill="#111111">ACK M-1001 (accepted, stored in local buffer)</text>
<line x1="420.0" y1="200.0" x2="716.0" y2="200.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="570.0" y="194.0" font-size="11.5" text-anchor="middle" fill="#111111">MOVE P07 LS1 -&gt; MC02 (CntrlCmd Start, Job.Id)</text>
<line x1="720.0" y1="228.0" x2="424.0" y2="228.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="6,4"/>
<text x="570.0" y="222.0" font-size="11.5" text-anchor="middle" fill="#111111">Done (PackML Complete)</text>
<line x1="420.0" y1="260.0" x2="1016.0" y2="260.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="720.0" y="254.0" font-size="11.5" text-anchor="middle" fill="#111111">Request(program O2010C, pallet P07)</text>
<line x1="1020.0" y1="288.0" x2="424.0" y2="288.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="6,4"/>
<text x="720.0" y="282.0" font-size="11.5" text-anchor="middle" fill="#111111">Ready -&gt; Busy -&gt; Execute</text>
<text x="30.0" y="334.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">1 Machine fault</text>
<line x1="1020.0" y1="348.0" x2="424.0" y2="348.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ahr)"/>
<text x="720.0" y="342.0" font-size="11.5" text-anchor="middle" fill="#c0392b">Aborted / Held, AlarmNo 1203</text>
<text x="160.0" y="374.0" font-size="11.5" text-anchor="start" fill="#333">Reaction: cell: stop routing to MC02, re-route waiting pallets, operator alarm, job stays OPEN</text>
<text x="30.0" y="404.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">2 MES down</text>
<line x1="420.0" y1="418.0" x2="124.0" y2="418.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ahr)"/>
<text x="270.0" y="412.0" font-size="11.5" text-anchor="middle" fill="#c0392b">CONF J03 -&gt; no answer</text>
<text x="160.0" y="444.0" font-size="11.5" text-anchor="start" fill="#333">Reaction: keep CONF in outbox (store-and-forward), run from local buffer, resend in order when link is back</text>
<text x="30.0" y="474.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">3 Time-out</text>
<line x1="420.0" y1="488.0" x2="716.0" y2="488.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ahr)"/>
<text x="570.0" y="482.0" font-size="11.5" text-anchor="middle" fill="#c0392b">MOVE P05, no Done in 120 s</text>
<text x="160.0" y="514.0" font-size="11.5" text-anchor="start" fill="#333">Reaction: retry once if state allows, else alarm 'move time-out', no second move on the same place</text>
<text x="30.0" y="544.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">4 Wrong pallet ID</text>
<line x1="720.0" y1="558.0" x2="424.0" y2="558.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ahr)"/>
<text x="570.0" y="552.0" font-size="11.5" text-anchor="middle" fill="#c0392b">RFID read P09, expected P07</text>
<text x="160.0" y="584.0" font-size="11.5" text-anchor="start" fill="#333">Reaction: reject: do not start; pallet to load station for check; alarm + event log</text>
<text x="30.0" y="614.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">5 Duplicate message</text>
<line x1="120.0" y1="628.0" x2="416.0" y2="628.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ahr)"/>
<text x="270.0" y="622.0" font-size="11.5" text-anchor="middle" fill="#c0392b">JOB msgId=M-1001 again (seq 57)</text>
<text x="160.0" y="654.0" font-size="11.5" text-anchor="start" fill="#333">Reaction: idempotent: already known -&gt; ACK again, no second job created</text>
</svg>
