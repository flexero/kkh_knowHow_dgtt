<text x="1044.0" y="578.0" font-size="11" text-anchor="middle" fill="#111">8</text>
<text x="1140.0" y="578.0" font-size="11" text-anchor="middle" fill="#111">10</text>
<text x="652.0" y="564.0" font-size="11" text-anchor="end" fill="#111">0</text>
<text x="652.0" y="504.0" font-size="11" text-anchor="end" fill="#111">0.5</text>
<text x="652.0" y="444.0" font-size="11" text-anchor="end" fill="#111">1</text>
<text x="652.0" y="384.0" font-size="11" text-anchor="end" fill="#111">1.5</text>
<text x="652.0" y="324.0" font-size="11" text-anchor="end" fill="#111">2</text>
<text x="652.0" y="264.0" font-size="11" text-anchor="end" fill="#111">2.5</text>
<text x="652.0" y="204.0" font-size="11" text-anchor="end" fill="#111">3</text>
<line x1="660.0" y1="320.0" x2="1140.0" y2="320.0" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>
<text x="668.0" y="312.0" font-size="11" text-anchor="start" fill="#c62828" font-weight="bold">reject limit 2 mbar in 10 s (= 0.1 mbar·l/s = 6 cm³/min)</text>
<line x1="660.0" y1="560.0" x2="1140.0" y2="320.0" stroke="#7c3aed" stroke-width="2.5"/>
<text x="956.0" y="442.0" font-size="11" text-anchor="start" fill="#7c3aed">real leak 0.1 mbar·l/s: 2.00 mbar</text>
<line x1="660.0" y1="560.0" x2="1140.0" y2="272.9" stroke="#d97706" stroke-width="2.5"/>
<text x="670.0" y="230.0" font-size="11.5" text-anchor="start" fill="#d97706" font-weight="bold">tight part cooling 0.1 K: 2.39 mbar → false reject</text>
<line x1="660.0" y1="560.0" x2="1140.0" y2="531.3" stroke="#059669" stroke-width="2.5"/>
<text x="1136.0" y="523.3" font-size="11" text-anchor="end" fill="#059669">after settling / compensation (0.01 K): 0.24 mbar</text>
<text x="660.0" y="92.0" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">Δp_T = p_abs·ΔT / T = 7013·0.1 / 293.15 = 2.39 mbar</text>
<text x="660.0" y="112.0" font-size="12" text-anchor="start" fill="#111">Fixes: equalise part temperature (wash → buffer), longer stabilisation,</text>
<text x="660.0" y="128.0" font-size="12" text-anchor="start" fill="#111">differential test against a reference volume, temperature compensation,</text>
<text x="660.0" y="144.0" font-size="12" text-anchor="start" fill="#111">master part + calibrated leak at every shift start.</text>
</svg>