<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="1150" height="620" font-family="Arial, Helvetica, sans-serif">
<title>Robot wrist load check: moment 31.4 N m and inertia 0.69 kg m2 inside the 80 percent limits</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1150" height="620" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Robot wrist load check – moment M and inertia J against the allowed values (JSON "robot_inertia")</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#444">Allowed values are examples (take them from the maker's datasheet): M_allow = 50 N·m, J_allow = 1.6 kg·m². Design rule: both ≤ 80 % of allowed.</text>
<line x1="110.0" y1="540.0" x2="690.0" y2="540.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<line x1="110.0" y1="540.0" x2="110.0" y2="80.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<line x1="110.0" y1="540.0" x2="110.0" y2="545.0" stroke="#333" stroke-width="1"/>
<text x="110.0" y="560.0" font-size="11" text-anchor="middle" fill="#111">0</text>
<line x1="203.3" y1="540.0" x2="203.3" y2="545.0" stroke="#333" stroke-width="1"/>
<text x="203.3" y="560.0" font-size="11" text-anchor="middle" fill="#111">10</text>
<line x1="296.7" y1="540.0" x2="296.7" y2="545.0" stroke="#333" stroke-width="1"/>
<text x="296.7" y="560.0" font-size="11" text-anchor="middle" fill="#111">20</text>
<line x1="390.0" y1="540.0" x2="390.0" y2="545.0" stroke="#333" stroke-width="1"/>
<text x="390.0" y="560.0" font-size="11" text-anchor="middle" fill="#111">30</text>
<line x1="483.3" y1="540.0" x2="483.3" y2="545.0" stroke="#333" stroke-width="1"/>
<text x="483.3" y="560.0" font-size="11" text-anchor="middle" fill="#111">40</text>
<line x1="576.7" y1="540.0" x2="576.7" y2="545.0" stroke="#333" stroke-width="1"/>
<text x="576.7" y="560.0" font-size="11" text-anchor="middle" fill="#111">50</text>
<line x1="670.0" y1="540.0" x2="670.0" y2="545.0" stroke="#333" stroke-width="1"/>
<text x="670.0" y="560.0" font-size="11" text-anchor="middle" fill="#111">60</text>
<line x1="105.0" y1="540.0" x2="110.0" y2="540.0" stroke="#333" stroke-width="1"/>
<text x="100.0" y="544.0" font-size="11" text-anchor="end" fill="#111">0.0</text>
<line x1="105.0" y1="452.0" x2="110.0" y2="452.0" stroke="#333" stroke-width="1"/>
<text x="100.0" y="456.0" font-size="11" text-anchor="end" fill="#111">0.4</text>
<line x1="105.0" y1="364.0" x2="110.0" y2="364.0" stroke="#333" stroke-width="1"/>
<text x="100.0" y="368.0" font-size="11" text-anchor="end" fill="#111">0.8</text>
<line x1="105.0" y1="276.0" x2="110.0" y2="276.0" stroke="#333" stroke-width="1"/>
<text x="100.0" y="280.0" font-size="11" text-anchor="end" fill="#111">1.2</text>
<line x1="105.0" y1="188.0" x2="110.0" y2="188.0" stroke="#333" stroke-width="1"/>
<text x="100.0" y="192.0" font-size="11" text-anchor="end" fill="#111">1.6</text>
<line x1="105.0" y1="100.0" x2="110.0" y2="100.0" stroke="#333" stroke-width="1"/>
<text x="100.0" y="104.0" font-size="11" text-anchor="end" fill="#111">2.0</text>
<text x="390.0" y="584.0" font-size="13" text-anchor="middle" fill="#111">wrist moment M [N·m]</text>
<text x="50.0" y="320.0" font-size="13" text-anchor="middle" fill="#111" transform="rotate(-90 50 320.0)">load inertia J [kg·m²]</text>
<rect x="110.0" y="188.0" width="466.7" height="352.0" rx="0" fill="#fee2e2" stroke="#c62828" stroke-width="1.5"/>
<rect x="110.0" y="258.4" width="373.3" height="281.6" rx="0" fill="#dcfce7" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="570.7" y="204.0" font-size="11" text-anchor="end" fill="#c62828">100 % limit (50 N·m, 1.6 kg·m²)</text>
<text x="477.3" y="274.4" font-size="11" text-anchor="end" fill="#059669">80 % design limit (40 N·m, 1.28 kg·m²)</text>
<circle cx="403.0" cy="388.2" r="8" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
<text x="393.0" y="374.2" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="bold">gripper + part: M = 31.4 N·m (63 %), J = 0.69 kg·m² (43 %)</text>
<line x1="329.7" y1="540.0" x2="329.7" y2="513.6" stroke="#d97706" stroke-width="3"/>
<text x="329.7" y="505.6" font-size="11" text-anchor="middle" fill="#d97706">basic calculator (one offset 120 mm): 23.5 N·m</text>
<text x="720.0" y="130.0" font-size="12.5" text-anchor="start" fill="#111">J = m_g·e_g² + m_p·(a² + b²)/12 + m_p·e_p²</text>
<text x="720.0" y="154.0" font-size="12.5" text-anchor="start" fill="#111">   = 8·0.10² + 12·(0.30² + 0.20²)/12 + 12·0.20²</text>
<text x="720.0" y="178.0" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">   = 0.080 + 0.130 + 0.480 = 0.690 kg·m²</text>
<text x="720.0" y="202.0" font-size="12.5" text-anchor="start" fill="#111"></text>
<text x="720.0" y="226.0" font-size="12.5" text-anchor="start" fill="#111">M = (m_g·e_g + m_p·e_p)·g</text>
<text x="720.0" y="250.0" font-size="12.5" text-anchor="start" fill="#111">   = (8·0.10 + 12·0.20)·9.81</text>
<text x="720.0" y="274.0" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">   = 3.20·9.81 = 31.4 N·m</text>
<text x="720.0" y="298.0" font-size="12.5" text-anchor="start" fill="#111"></text>
<text x="720.0" y="322.0" font-size="12.5" text-anchor="start" fill="#111">Use: J 0.690 / 1.6 = 43 %  ·  M 31.4 / 50 = 63 %</text>
<text x="720.0" y="346.0" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">Both ≤ 80 % → OK (payload 20 / 25 kg = 80 %)</text>
<text x="720.0" y="370.0" font-size="12.5" text-anchor="start" fill="#111"></text>
<text x="720.0" y="394.0" font-size="12.5" text-anchor="start" fill="#111">Lesson: the part CoG at 200 mm gives 70 % of J.</text>
<text x="720.0" y="418.0" font-size="12.5" text-anchor="start" fill="#111">The basic calculator with e = 120 mm gives</text>
<text x="720.0" y="442.0" font-size="12.5" text-anchor="start" fill="#111">23.5 N·m – the real combined CoG is at 160 mm.</text>
</svg>