<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Arial, Helvetica, sans-serif">
<title>Mirror principle - the safety function is in the F-program, the standard FB only mirrors it</title>
<rect x="0" y="0" width="1200" height="500" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">Mirror principle - the safety function is in the F-program, the standard FB only mirrors it</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Example e-stop (pattern ESTOP, guide 68 B2): two channels to F-inputs; the certified block switches the F-outputs; the standard program gets read-only copies for HMI, alarms and PackML.</text>
<rect x="40" y="120" width="180" height="90" rx="8" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="130.0" y="154.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">E-stop -S1</text>
<text x="130.0" y="168.66666666666666" font-size="11" text-anchor="middle" fill="#111">2 NC channels</text>
<text x="130.0" y="182.66666666666666" font-size="11" text-anchor="middle" fill="#111">(Cat. 3 / PL d, example)</text>
<rect x="300" y="100" width="330" height="140" rx="8" fill="#fff7e6" stroke="#b9770e" stroke-width="1.5"/>
<text x="465.0" y="145.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#b9770e">F-program (safety PLC)</text>
<text x="465.0" y="159.66666666666666" font-size="11" text-anchor="middle" fill="#111">certified block e.g. ESTOP1 / SF_EmergencyStop</text>
<text x="465.0" y="173.66666666666666" font-size="11" text-anchor="middle" fill="#111">discrepancy, test pulses, reset</text>
<text x="465.0" y="187.66666666666666" font-size="11" text-anchor="middle" fill="#111">-&gt; F-DO: STO, zone release, valve supply</text>
<text x="465.0" y="201.66666666666666" font-size="11" text-anchor="middle" fill="#111">F-signature, validated (ISO 13849-2)</text>
<rect x="720" y="100" width="200" height="140" rx="8" fill="#fff7e6" stroke="#b9770e" stroke-width="1.5"/>
<text x="820.0" y="145.66666666666666" font-size="12" text-anchor="middle" font-weight="bold" fill="#b9770e">F-outputs</text>
<text x="820.0" y="159.66666666666666" font-size="11" text-anchor="middle" fill="#111">STO drive</text>
<text x="820.0" y="173.66666666666666" font-size="11" text-anchor="middle" fill="#111">zone contactors</text>
<text x="820.0" y="187.66666666666666" font-size="11" text-anchor="middle" fill="#111">safe valve</text>
<text x="820.0" y="201.66666666666666" font-size="11" text-anchor="middle" fill="#111">(hard energy removal)</text>
<polyline points="220,165 300,165" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="300,165 291.00,161.00 291.00,169.00" fill="#111"/>
<polyline points="630,170 720,170" fill="none" stroke="#b9770e" stroke-width="1.5"/>
<polygon points="720,170 711.00,166.00 711.00,174.00" fill="#b9770e"/>
<rect x="300" y="320" width="330" height="120" rx="8" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="465.0" y="362.6666666666667" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Standard program: FB_Estop (= FB_Safe2Ch)</text>
<text x="465.0" y="376.6666666666667" font-size="11" text-anchor="middle" fill="#111">reads F-copies xCh1, xCh2</text>
<text x="465.0" y="390.6666666666667" font-size="11" text-anchor="middle" fill="#111">xOk, xResetReq (lamp), xDiscErr</text>
<text x="465.0" y="404.6666666666667" font-size="11" text-anchor="middle" fill="#111">-&gt; alarm text, HMI, internal Abort trigger</text>
<polyline points="465,240 465,320" fill="none" stroke="#b9770e" stroke-width="1.5" stroke-dasharray="6,4"/>
<polygon points="465,320 469.00,311.00 461.00,311.00" fill="#b9770e"/>
<text x="475" y="285" font-size="11" text-anchor="start" fill="#b9770e">read-only copies</text>
<rect x="720" y="320" width="420" height="120" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="930.0" y="362.6666666666667" font-size="12" text-anchor="middle" font-weight="bold" fill="#c0392b">NEVER in the standard program</text>
<text x="930.0" y="376.6666666666667" font-size="11" text-anchor="middle" fill="#111">write an F-output / STO / unlock signal</text>
<text x="930.0" y="390.6666666666667" font-size="11" text-anchor="middle" fill="#111">bridge, simulate or 'repair' a safety signal</text>
<text x="930.0" y="404.6666666666667" font-size="11" text-anchor="middle" fill="#111">decide a safety reaction as the only protection</text>
<text x="40" y="480" font-size="11" text-anchor="start" fill="#555">If the standard PLC crashes or a standard FB has a bug, the F-program still stops the machine. If the F-program trips, the mirror explains WHY on the HMI.</text>
</svg>
