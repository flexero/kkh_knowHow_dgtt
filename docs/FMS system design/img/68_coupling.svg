<line x1="700" y1="239" x2="740" y2="239" stroke="#666" stroke-width="1"/>
<polygon points="740,239 731.71,242.505 731.71,235.495" fill="#666"/>
<line x1="260" y1="257" x2="300" y2="257" stroke="#666" stroke-width="2"/>
<line x1="300" y1="257" x2="312" y2="249" stroke="#666" stroke-width="2"/>
<line x1="316" y1="257" x2="740" y2="257" stroke="#666" stroke-width="2"/>
<line x1="700" y1="257" x2="740" y2="257" stroke="#666" stroke-width="1"/>
<polygon points="740,257 731.71,260.505 731.71,253.495" fill="#666"/>
<rect x="760" y="227" width="180" height="40" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="850" y="245" font-size="11" text-anchor="middle" font-weight="bold" fill="#c0392b">ZoneFree / ZoneFree2</text>
<text x="850" y="261" font-size="11" text-anchor="middle" fill="#111">FDI1.02 / 1.03</text>
<text x="80" y="300" font-size="11" text-anchor="start" fill="#111">cell e-stop OK (cell → machine)</text>
<line x1="740" y1="314" x2="330" y2="314" stroke="#c0392b" stroke-width="2"/>
<line x1="330" y1="314" x2="318" y2="306" stroke="#c0392b" stroke-width="2"/>
<line x1="314" y1="314" x2="260" y2="314" stroke="#c0392b" stroke-width="2"/>
<line x1="300" y1="314" x2="260" y2="314" stroke="#c0392b" stroke-width="1"/>
<polygon points="260,314 268.29,310.495 268.29,317.505" fill="#c0392b"/>
<line x1="740" y1="332" x2="330" y2="332" stroke="#c0392b" stroke-width="2"/>
<line x1="330" y1="332" x2="318" y2="324" stroke="#c0392b" stroke-width="2"/>
<line x1="314" y1="332" x2="260" y2="332" stroke="#c0392b" stroke-width="2"/>
<line x1="300" y1="332" x2="260" y2="332" stroke="#c0392b" stroke-width="1"/>
<polygon points="260,332 268.29,328.495 268.29,335.505" fill="#c0392b"/>
<rect x="760" y="302" width="180" height="40" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="850" y="320" font-size="11" text-anchor="middle" font-weight="bold" fill="#c0392b">EstopOut</text>
<text x="850" y="336" font-size="11" text-anchor="middle" fill="#111">FDO1.00 → 2 × NO</text>
<text x="80" y="375" font-size="11" text-anchor="start" fill="#111">cell zone safe, may load (cell → machine)</text>
<line x1="740" y1="389" x2="330" y2="389" stroke="#c0392b" stroke-width="2"/>
<line x1="330" y1="389" x2="318" y2="381" stroke="#c0392b" stroke-width="2"/>
<line x1="314" y1="389" x2="260" y2="389" stroke="#c0392b" stroke-width="2"/>
<line x1="300" y1="389" x2="260" y2="389" stroke="#c0392b" stroke-width="1"/>
<polygon points="260,389 268.29,385.495 268.29,392.505" fill="#c0392b"/>
<line x1="740" y1="407" x2="330" y2="407" stroke="#c0392b" stroke-width="2"/>
<line x1="330" y1="407" x2="318" y2="399" stroke="#c0392b" stroke-width="2"/>
<line x1="314" y1="407" x2="260" y2="407" stroke="#c0392b" stroke-width="2"/>
<line x1="300" y1="407" x2="260" y2="407" stroke="#c0392b" stroke-width="1"/>
<polygon points="260,407 268.29,403.495 268.29,410.505" fill="#c0392b"/>
<rect x="760" y="377" width="180" height="40" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="850" y="395" font-size="11" text-anchor="middle" font-weight="bold" fill="#c0392b">EnableOut</text>
<text x="850" y="411" font-size="11" text-anchor="middle" fill="#111">FDO1.01 → 2 × NO</text>
<rect x="480" y="140" width="240" height="290" rx="0" fill="#fff" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="600" y="160" font-size="11" text-anchor="middle" fill="#111">-KF1 coupling terminal set</text>
<text x="600" y="176" font-size="11" text-anchor="middle" fill="#111">-WD2 12x0.75 shielded, 20 m</text>
<text x="600" y="460" font-size="11" text-anchor="middle" fill="#666">grey = contacts of the machine (orange wires: live from the machine side)</text>
<rect x="60" y="490" width="1080" height="70" rx="0" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
<text x="75" y="512" font-size="11" text-anchor="start" fill="#111">PL across the coupling = combination of both sides (guide 67 G8); the interface sheet fixes terminals, contact ratings (gold, 24 V / 5 mA), reaction time, reset.</text>
<text x="75" y="530" font-size="11" text-anchor="start" fill="#111">FAT with a two-channel simulator box; at site: e-stop at the machine stops the cell zone and the cell e-stop stops the machine – witnessed by both parties.</text>
<text x="75" y="548" font-size="11" text-anchor="start" fill="#666">Machine contacts read by the cell are excepted circuits when supplied from outside: orange wires (IEC 60204-1) and a warning at the main switch.</text>
<text x="24" y="586" font-size="11" text-anchor="start" fill="#666">Teaching example – not for construction. Real circuits: qualified engineers, IEC 60204-1, ISO 13849, maker data.</text>
</svg>
