<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>COUPLING: hard-wired safety coupling machine tool ↔ cell safety PLC (module M01)</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">COUPLING: hard-wired safety coupling machine tool ↔ cell safety PLC (module M01)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Two channels in each direction, potential-free contacts, each side supplies its own 24 V (no common 0 V); machine-supplied circuits wired orange; terminal set -KF1.</text>
<rect x="60" y="90" width="400" height="380" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="260" y="112" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Machine tool MC01 (machine builder)</text>
<rect x="740" y="90" width="400" height="380" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="940" y="112" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Cell module MC01 (cell side) → SAFE01</text>
<text x="80" y="150" font-size="11" text-anchor="start" fill="#111">e-stop OK (machine → cell)</text>
<line x1="260" y1="164" x2="300" y2="164" stroke="#666" stroke-width="2"/>
<line x1="300" y1="164" x2="312" y2="156" stroke="#666" stroke-width="2"/>
<line x1="316" y1="164" x2="740" y2="164" stroke="#666" stroke-width="2"/>
<line x1="700" y1="164" x2="740" y2="164" stroke="#666" stroke-width="1"/>
<polygon points="740,164 731.71,167.505 731.71,160.495" fill="#666"/>
<line x1="260" y1="182" x2="300" y2="182" stroke="#666" stroke-width="2"/>
<line x1="300" y1="182" x2="312" y2="174" stroke="#666" stroke-width="2"/>
<line x1="316" y1="182" x2="740" y2="182" stroke="#666" stroke-width="2"/>
<line x1="700" y1="182" x2="740" y2="182" stroke="#666" stroke-width="1"/>
<polygon points="740,182 731.71,185.505 731.71,178.495" fill="#666"/>
<rect x="760" y="152" width="180" height="40" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="850" y="170" font-size="11" text-anchor="middle" font-weight="bold" fill="#c0392b">EstopIn / EstopIn2</text>
<text x="850" y="186" font-size="11" text-anchor="middle" fill="#111">FDI1.00 / 1.01</text>
<text x="80" y="225" font-size="11" text-anchor="start" fill="#111">loading zone free (machine → cell)</text>
<line x1="260" y1="239" x2="300" y2="239" stroke="#666" stroke-width="2"/>
<line x1="300" y1="239" x2="312" y2="231" stroke="#666" stroke-width="2"/>
