<text x="24" y="700" font-size="11" text-anchor="start" fill="#111">Read: TON.Q needs IN TRUE for &gt;= PT (k 2..6 -&gt; Q at k 7); TOF.Q stays TRUE PT after IN falls (k 30 -&gt; FALSE at k 35); TP gives a fixed 50 ms pulse, not retriggerable;</text>
<text x="24" y="716" font-size="11" text-anchor="start" fill="#111">R_TRIG / F_TRIG = one-scan pulses; SR (set dominant) stays 1 at k 6-7 when A and B are both TRUE, RS (reset dominant) goes 0. CTU counts rising edges of A: 1, 2, 3 -&gt; Q at k 15.</text>
<text x="24" y="746" font-size="11" text-anchor="start" fill="#666">Teaching example - not for construction. Real PLC code: written, reviewed and validated by qualified people (IEC 61131-3, IEC 62061 / ISO 13849).</text>
