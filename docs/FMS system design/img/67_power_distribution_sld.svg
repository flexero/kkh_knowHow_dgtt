<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Arial, Helvetica, sans-serif">
<title>Single-line diagram of the FMS power distribution (example values)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#111" font-weight="bold">Single-line diagram of cell FMS1 – from the plant transformer to the module cabinets</text>
<text x="24" y="54" font-size="12" fill="#555">Example values from item7_examples.json. Dashed lines = responsibility boundaries (IEC 60364 plant | IEC 61439 assemblies | IEC 60204-1 machines).</text>
<!-- transformer -->
<circle cx="120" cy="120" r="26" fill="none" stroke="#333" stroke-width="2"/>
<circle cx="120" cy="155" r="26" fill="none" stroke="#333" stroke-width="2"/>
<text x="160" y="120" font-size="12" fill="#111">Plant transformer 1000 kVA</text>
<text x="160" y="136" font-size="12" fill="#111">20 kV / 400 V Dyn11, uk 6 %, TN-S</text>
<text x="160" y="156" font-size="12" fill="#1f6fb2" font-weight="bold">Ik3 = 24 056 A (≈ 24 kA)</text>
<line x1="120" y1="181" x2="120" y2="220" stroke="#333" stroke-width="2"/>
<!-- MDB busbar -->
<line x1="60" y1="220" x2="420" y2="220" stroke="#333" stroke-width="5"/>
<text x="60" y="210" font-size="12" fill="#111" font-weight="bold">Main LV board (MDB)</text>
<line x1="300" y1="220" x2="300" y2="300" stroke="#333" stroke-width="2"/>
<rect x="286" y="245" width="28" height="22" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="322" y="261" font-size="12" fill="#111">-QA21 MCCB 250 A (LSI), Icu ≥ 25 kA</text>
<text x="322" y="290" font-size="12" fill="#555">cable 4×120 + PE 70 mm², 50 m (scratch)</text>
<line x1="300" y1="300" x2="300" y2="340" stroke="#333" stroke-width="2"/>
<line x1="20" y1="318" x2="1180" y2="318" stroke="#999" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="1176" y="312" font-size="11" fill="#777" text-anchor="end">plant (IEC 60364) ↑ | ↓ integrator (IEC 61439 / IEC 60204-1)</text>
<!-- CDB -->
<rect x="60" y="340" width="1080" height="70" fill="#eef4fa" stroke="#1f6fb2" stroke-width="2"/>
<text x="76" y="362" font-size="13" fill="#1f6fb2" font-weight="bold">Cell distribution board =FMS1 +HALL1.A1 – busbar 250 A, Icc 25 kA, IP54</text>
<text x="76" y="382" font-size="12" fill="#111">-QB1 switch-disconnector 250 A (lockable) · -FC1 surge protection type 2 · -PG1 energy meter · load list: S 115.8 kVA, I 167.1 A,</text>
<text x="76" y="400" font-size="12" fill="#111">with growth 144.7 kVA → 208.9 A (dedicated transformer would be 250 kVA, loading 0.463)</text>
<!-- feeders -->
<g font-size="11" fill="#111" text-anchor="middle">
<line x1="130" y1="410" x2="130" y2="470" stroke="#333" stroke-width="2"/><rect x="118" y="428" width="24" height="18" fill="#fff" stroke="#333"/>
<text x="130" y="488">80 A C</text><text x="130" y="503">35/16 mm², 60 m</text><rect x="90" y="512" width="80" height="34" fill="#f4f4f4" stroke="#333"/><text x="130" y="534">MC01–MC03</text>
<line x1="270" y1="410" x2="270" y2="470" stroke="#333" stroke-width="2"/><rect x="258" y="428" width="24" height="18" fill="#fff" stroke="#333"/>
<text x="270" y="488">32 A C</text><rect x="230" y="512" width="80" height="34" fill="#f4f4f4" stroke="#333"/><text x="270" y="534">POOL01</text>
<line x1="400" y1="410" x2="400" y2="470" stroke="#333" stroke-width="2"/><rect x="388" y="428" width="24" height="18" fill="#fff" stroke="#333"/>
<text x="400" y="488">10 A C</text><rect x="360" y="512" width="80" height="34" fill="#f4f4f4" stroke="#333"/><text x="400" y="534">LS01 / LS02</text>
<line x1="530" y1="410" x2="530" y2="470" stroke="#333" stroke-width="2"/><rect x="518" y="428" width="24" height="18" fill="#fff" stroke="#333"/>
<text x="530" y="488">50 A C</text><rect x="490" y="512" width="80" height="34" fill="#f4f4f4" stroke="#333"/><text x="530" y="534">WASH01</text>
<line x1="660" y1="410" x2="660" y2="470" stroke="#333" stroke-width="2"/><rect x="648" y="428" width="24" height="18" fill="#fff" stroke="#333"/>
<text x="660" y="488">16 A C</text><rect x="620" y="512" width="80" height="34" fill="#f4f4f4" stroke="#333"/><text x="660" y="534">CMM01</text>
<line x1="790" y1="410" x2="790" y2="470" stroke="#333" stroke-width="2"/><rect x="778" y="428" width="24" height="18" fill="#fff" stroke="#333"/>
<text x="790" y="488">25 A C</text><rect x="750" y="512" width="80" height="34" fill="#f4f4f4" stroke="#333"/><text x="790" y="534">chips/coolant</text>
<line x1="920" y1="410" x2="920" y2="470" stroke="#333" stroke-width="2"/><rect x="908" y="428" width="24" height="18" fill="#fff" stroke="#333"/>
<text x="920" y="488">16 A C</text><rect x="880" y="512" width="80" height="34" fill="#f4f4f4" stroke="#333"/><text x="920" y="534">CC01 + UPS</text>
<line x1="1050" y1="410" x2="1050" y2="470" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1050" y="488" fill="#777">reserve</text><text x="1050" y="503" fill="#777">2 × 63 A</text>
</g>
<line x1="20" y1="558" x2="1180" y2="558" stroke="#999" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="24" y="580" font-size="12" fill="#111">Below the dashed line: module cabinets of the module suppliers (each: main switch -QB1, own IEC 61439 verification, IEC 60204-1).</text>
<text x="24" y="600" font-size="12" fill="#111">Each module states: kW, kVA, upstream In, Icc / SCCR ≥ 25 kA, terminal range. Every feeder: Ib ≤ In ≤ Iz, Icu ≥ Ik3, Ik1 ≥ Ia (Part C).</text>
<text x="24" y="622" font-size="11" fill="#777">Breaker ratings except MC feeders are drawing examples. Examples only – a qualified electrical engineer signs the real design.</text>
</svg>
