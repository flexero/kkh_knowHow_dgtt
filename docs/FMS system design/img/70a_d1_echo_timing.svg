<text x="24" y="452" font-size="11" text-anchor="start" fill="#555">tick 2 Start in Stopped -&gt; rejected (WarningNo 2902 for M02) ; tick 6 Reset in Stopped -&gt; accepted, iCmdExec = 1 for one call ; tick 14 Start in Idle -&gt; accepted ;</text>
<text x="24" y="470" font-size="11" text-anchor="start" fill="#555">tick 20 Hold in Execute but mode 3 Manual -&gt; rejected (Hold not allowed in Manual) ; tick 24 Stop in Execute/Manual -&gt; accepted. CmdAck/CmdRej fall one call after the request is cleared.</text>
