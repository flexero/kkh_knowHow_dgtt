<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 502" width="1200" height="502" font-family="Arial, Helvetica, sans-serif">
<title>D1 - 4-phase command echo between cell controller and module (FB_CmdIf test C1)</title>
<rect x="0" y="0" width="1200" height="502" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">D1 - 4-phase command echo between cell controller and module (FB_CmdIf test C1)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Blue = written by the cell controller (words 2-3), black = written by the module (word 4 bits 8/9, internal iCmdExec). Each command: (1) CC sets CntrlCmd + CmdChangeRequest in one FC16 write,</text>
<text x="24" y="70" font-size="12" text-anchor="start" fill="#555">(2) module echoes CmdAck or CmdRej, (3) CC clears the request, (4) module clears the echo. iState / iMode come from the PackML core of the module.</text>
