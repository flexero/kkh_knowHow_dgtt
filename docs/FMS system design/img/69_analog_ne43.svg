<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>Analog input: raw value -&gt; mA -&gt; engineering value, NAMUR NE 43 signal status</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
