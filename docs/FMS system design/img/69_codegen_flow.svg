<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>From the item 8 library to Structured Text: code generation and the module program structure</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">From the item 8 library to Structured Text: code generation and the module program structure</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">One source of truth: the same instance list gives the IO list (item 8), the global symbols with addresses and the device-FB layer (item 9); item 10 adds the module logic.</text>
<rect x="40" y="100" width="230" height="90" rx="0" fill="#e8eef8" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="155" y="127.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">item8_examples.json</text>
<text x="155" y="141.85" font-size="11" text-anchor="middle" fill="#111">patterns (31) + modules (22)</text>
<text x="155" y="155.85" font-size="11" text-anchor="middle" fill="#111">M02 = Rotate, Clamp, PalSideA,</text>
<text x="155" y="169.85" font-size="11" text-anchor="middle" fill="#111">PalSideB, ClampPress</text>
<line x1="270" y1="145" x2="330" y2="145" stroke="#111" stroke-width="1.5"/>
<polygon points="330,145 321.00,141.22 321.00,148.78" fill="#111"/>
<rect x="330" y="100" width="230" height="90" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="445" y="127.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">Expansion (item 8 rules)</text>
<text x="445" y="141.85" font-size="11" text-anchor="middle" fill="#111">IO list in order, tags,</text>
<text x="445" y="155.85" font-size="11" text-anchor="middle" fill="#111">card addresses DI1.00 ...</text>
<text x="445" y="169.85" font-size="11" text-anchor="middle" fill="#111">cards with 20 % reserve</text>
<line x1="560" y1="145" x2="620" y2="145" stroke="#111" stroke-width="1.5"/>
<polygon points="620,145 611.00,141.22 611.00,148.78" fill="#111"/>
<rect x="620" y="100" width="230" height="90" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="735" y="127.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">st_codegen.py (rule codegen)</text>
<text x="735" y="141.85" font-size="11" text-anchor="middle" fill="#111">symbol = unit_group_signal</text>
<text x="735" y="155.85" font-size="11" text-anchor="middle" fill="#111">%IX / %QX / %IW / %QW</text>
<text x="735" y="169.85" font-size="11" text-anchor="middle" fill="#111">FDI / FDO: no address</text>
<line x1="850" y1="145" x2="910" y2="145" stroke="#111" stroke-width="1.5"/>
<polygon points="910,145 901.00,141.22 901.00,148.78" fill="#111"/>
<rect x="910" y="100" width="250" height="90" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="1035" y="127.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">gen_M02.st  32 lines</text>
<text x="1035" y="141.85" font-size="11" text-anchor="middle" fill="#111">1830 chars, Adler-32 0f66079f</text>
<text x="1035" y="155.85" font-size="11" text-anchor="middle" fill="#111">VAR_GLOBAL + FB_APC01_Devices</text>
<text x="1035" y="169.85" font-size="11" text-anchor="middle" fill="#111">5 FB instances</text>
<rect x="40" y="230" width="1120" height="48" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="56" y="250" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Layer 4  Cell interface</text>
<text x="56" y="268" font-size="12" text-anchor="start" fill="#111">FB_ModuleHandshake: data block words 0-19 (+20...), heartbeat, CntrlCmd / CmdChangeRequest</text>
<rect x="40" y="288" width="1120" height="48" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="56" y="308" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Layer 3  Module logic (item 10)</text>
<text x="56" y="326" font-size="12" text-anchor="start" fill="#111">FB_APC01: PackML state machine + step chain S10..S40 + module alarms 10..13 + interlocks</text>
<rect x="40" y="346" width="1120" height="48" rx="0" fill="#e8f5e9" stroke="#111" stroke-width="1.5"/>
<text x="56" y="366" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Layer 2  Device FBs (generated)</text>
<text x="56" y="384" font-size="12" text-anchor="start" fill="#111">FB_APC01_Devices: Rotate FB_Valve2, Clamp FB_Valve1, PalSideA/B FB_Sensor, ClampPress FB_AnalogIn</text>
<rect x="40" y="404" width="1120" height="48" rx="0" fill="#e8f5e9" stroke="#111" stroke-width="1.5"/>
<text x="56" y="424" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Layer 1  IO image (generated)</text>
<text x="56" y="442" font-size="12" text-anchor="start" fill="#111">VAR_GLOBAL APC01_Rotate_SolA AT %QX0.0 ... APC01_ClampPress_Value AT %IW2</text>
<rect x="40" y="462" width="1120" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="56" y="482" font-size="13" text-anchor="start" font-weight="bold" fill="#c0392b">Layer 0  F-program (separate)</text>
<text x="56" y="500" font-size="12" text-anchor="start" fill="#111">certified safety blocks: e-stop, doors, STO, zone release - standard code reads copies only</text>
<text x="40" y="540" font-size="11" text-anchor="start" fill="#111">Kit 'FMS (3 HMCs + pool + AGV)' = 18 modules -&gt; 95 generated FB instances (M01 3 x 3, M02 3 x 5, M03 13, M04 2 x 9, M06 6, M10 10, M11 3, M12 5, M17 5, M18 9, M19 1, M22 1).</text>
<text x="40" y="558" font-size="11" text-anchor="start" fill="#c0392b">Regenerate after every change of the library; never edit generated files by hand (header line 2). Check the checksum in the design review.</text>
<text x="24" y="586" font-size="11" text-anchor="start" fill="#666">Teaching example - not for construction. Real PLC code: written, reviewed and validated by qualified people (IEC 61131-3, IEC 62061 / ISO 13849).</text>
</svg>
