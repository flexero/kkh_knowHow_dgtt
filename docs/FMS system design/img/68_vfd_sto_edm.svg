<rect x="960" y="310" width="190" height="42" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1055" y="328" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">DI1.00 / DI1.01</text>
<text x="1055" y="344" font-size="11" text-anchor="middle" fill="#111">Travel.Ready / Fault</text>
<rect x="960" y="362" width="190" height="42" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1055" y="380" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">DI1.02 / DI1.03</text>
<text x="1055" y="396" font-size="11" text-anchor="middle" fill="#111">Hoist.Ready / Fault</text>
<rect x="960" y="414" width="190" height="42" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1055" y="432" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">DI1.04 / DI1.05</text>
<text x="1055" y="448" font-size="11" text-anchor="middle" fill="#111">Fork.Ready / Fault</text>
<rect x="620" y="480" width="540" height="120" rx="0" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
<text x="635" y="502" font-size="11" text-anchor="start" fill="#111">Stop category 1 (SS1-t): PLC ramps the drives down over PROFINET,</text>
<text x="635" y="518" font-size="11" text-anchor="start" fill="#111">then the safety PLC removes STO; DriveSup.Enable drops = power backup.</text>
<text x="635" y="538" font-size="11" text-anchor="start" fill="#c0392b">EDM: before ON both mirror contacts closed (EDM = 1); after ON EDM = 0</text>
<text x="635" y="554" font-size="11" text-anchor="start" fill="#c0392b">within the monitoring time – a welded contactor blocks the restart.</text>
<text x="635" y="574" font-size="11" text-anchor="start" fill="#111">Mirror contacts per IEC 60947-4-1 Annex F; B10d at the real load → T10d.</text>
<text x="24" y="686" font-size="11" text-anchor="start" fill="#666">Teaching example – not for construction. Real circuits: qualified engineers, IEC 60204-1, ISO 13849, maker data.</text>
