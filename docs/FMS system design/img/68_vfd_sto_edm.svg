<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Arial, Helvetica, sans-serif">
<title>VFD_STO + CONT_PAIR_EDM: three inverters with STO behind a safety contactor pair (module M03)</title>
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">VFD_STO + CONT_PAIR_EDM: three inverters with STO behind a safety contactor pair (module M03)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Travel 11 kW / Hoist 7.5 kW / Fork 1.5 kW · inverter loss 3 % = 330 + 225 + 45 W · STO by F-DO, EDM = mirror contacts in series to F-DI.</text>
