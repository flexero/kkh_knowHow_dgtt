<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 434" width="1200" height="434" font-family="Arial, Helvetica, sans-serif">
<title>FB_SignalTower - test T1: colours from PackML state and alarm class (IEC 60204-1 10.3 / IEC 60073)</title>
<rect x="0" y="0" width="1200" height="434" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">FB_SignalTower - test T1: colours from PackML state and alarm class (IEC 60204-1 10.3 / IEC 60073)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Red = class A alarm or Aborting/Aborted ; yellow = class B/C alarm or Stopped/Suspended/Held ; green steady = Starting/Execute/Unholding/Unsuspending/Completing,</text>
<text x="24" y="70" font-size="12" text-anchor="start" fill="#555">green flashing 1 Hz = Idle/Complete (ready, waiting) ; buzzer on each new class A/B, off with horn acknowledge or when no alarm is active.</text>
