<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Arial, Helvetica, sans-serif">
<title>ISO 13849-1 risk graph with the six JSON safety functions</title>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#111" font-weight="bold">Risk graph (ISO 13849-1 Annex A) – required performance level PLr</text>
<text x="24" y="54" font-size="12" fill="#555">S severity (S1 slight, S2 serious) · F exposure (F1 seldom/short, F2 frequent/long) · P avoidance (P1 possible, P2 scarcely possible)</text>
<g stroke="#333" stroke-width="2" fill="none">
<path d="M80,290 L180,170"/><path d="M80,290 L180,410"/>
<path d="M180,170 L320,110"/><path d="M180,170 L320,230"/>
<path d="M180,410 L320,350"/><path d="M180,410 L320,470"/>
<path d="M320,110 L480,85"/><path d="M320,110 L480,135"/>
<path d="M320,230 L480,205"/><path d="M320,230 L480,255"/>
<path d="M320,350 L480,325"/><path d="M320,350 L480,375"/>
<path d="M320,470 L480,445"/><path d="M320,470 L480,495"/>
</g>
<g font-size="13" fill="#111">
<circle cx="80" cy="290" r="6" fill="#333"/><text x="40" y="276">start</text>
<text x="112" y="214">S1</text><text x="112" y="376">S2</text>
<text x="236" y="128">F1</text><text x="236" y="222">F2</text><text x="236" y="368">F1</text><text x="236" y="462">F2</text>
<text x="384" y="88">P1</text><text x="384" y="140">P2</text><text x="384" y="208">P1</text><text x="384" y="260">P2</text>
<text x="384" y="328">P1</text><text x="384" y="380">P2</text><text x="384" y="448">P1</text><text x="384" y="500">P2</text>
</g>
<g font-size="15" font-weight="bold" fill="#111">
<rect x="484" y="72" width="34" height="26" fill="#f4f4f4" stroke="#333"/><text x="495" y="91">a</text>
<rect x="484" y="122" width="34" height="26" fill="#f4f4f4" stroke="#333"/><text x="495" y="141">b</text>
<rect x="484" y="192" width="34" height="26" fill="#f4f4f4" stroke="#333"/><text x="495" y="211">b</text>
<rect x="484" y="242" width="34" height="26" fill="#f4f4f4" stroke="#333"/><text x="495" y="261">c</text>
<rect x="484" y="312" width="34" height="26" fill="#eef4fa" stroke="#1f6fb2"/><text x="495" y="331">c</text>
<rect x="484" y="362" width="34" height="26" fill="#eef4fa" stroke="#1f6fb2"/><text x="495" y="381">d</text>
<rect x="484" y="432" width="34" height="26" fill="#eef4fa" stroke="#1f6fb2"/><text x="495" y="451">d</text>
<rect x="484" y="482" width="34" height="26" fill="#eef4fa" stroke="#1f6fb2"/><text x="495" y="501">e</text>
</g>
<g font-size="12" fill="#1f6fb2">
<text x="530" y="211">← SF4 AGV dock scanner (S1 F2 P1)</text>
<text x="530" y="331">← SF5 enabling + SLS (S2 F1 P1)</text>
<text x="530" y="381">← SF3 e-stop of the cell (S2 F1 P2)</text>
<text x="530" y="451">← SF1 pool door, SF2 light curtain LS01, SF6 washer door (S2 F2 P1)</text>
</g>
<rect x="820" y="80" width="340" height="250" fill="#f7f7f7" stroke="#ccc"/>
<g font-size="12" fill="#111">
<text x="834" y="104" font-weight="bold">Result of the six JSON functions</text>
<text x="834" y="128">SF1 PLr d → PL d  OK</text>
<text x="834" y="150">SF2 PLr d → PL d  OK</text>
<text x="834" y="172">SF3 PLr d → PL d  OK</text>
<text x="834" y="194">SF4 PLr b → PL c  OK</text>
<text x="834" y="216">SF5 PLr c → PL d  OK</text>
<text x="834" y="238" fill="#c0392b" font-weight="bold">SF6 PLr d → PL c  NOT OK (Cat 1)</text>
<text x="834" y="262">Fix: Cat 3 – second diverse switch +</text>
<text x="834" y="280">second contactor with EDM → PL d</text>
<text x="834" y="310" fill="#777" font-size="11">Choose S for the worst credible injury;</text>
<text x="834" y="324" fill="#777" font-size="11">F2 and P2 when in doubt; C-standard wins.</text>
</g>
</svg>
