<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 720" width="1250" height="720" font-family="Arial, Helvetica, sans-serif">
<title>Pallet change sequence between CNC, APC and cell controller with handshake signals</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1250" height="720" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Automatic pallet change – step chain and handshake (example: rotary APC, 15 s change)</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#444">Lanes = devices; blue arrows = signals between devices, orange loops = internal APC steps (tags PLT1.MACH.FMS1.MC01 / APC01). Times are examples.</text>
<rect x="25.0" y="70.0" width="250.0" height="32.0" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
<text x="150.0" y="91.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">Cell controller M19 (CC01)</text>
<line x1="150.0" y1="102.0" x2="150.0" y2="690.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="325.0" y="70.0" width="250.0" height="32.0" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
<text x="450.0" y="91.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">CNC M01 (MC01)</text>
<line x1="450.0" y1="102.0" x2="450.0" y2="690.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="625.0" y="70.0" width="250.0" height="32.0" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
<text x="750.0" y="91.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">APC M02 (APC01)</text>
<line x1="750.0" y1="102.0" x2="750.0" y2="690.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="925.0" y="70.0" width="250.0" height="32.0" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
<text x="1050.0" y="91.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">Set-up side / stacker M03–M04</text>
<line x1="1050.0" y1="102.0" x2="1050.0" y2="690.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="150.0" y1="138.0" x2="1050.0" y2="138.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="160.0" y="131.0" font-size="12" text-anchor="start" fill="#111">1  Job.PalletId + move order: next pallet to the APC set-up side</text>
<line x1="1050.0" y1="184.0" x2="750.0" y2="184.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="760.0" y="177.0" font-size="12" text-anchor="start" fill="#111">2  PalletAtSetup = 1, pallet ID read OK, ClampOK of the new pallet</text>
<line x1="450.0" y1="230.0" x2="750.0" y2="230.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="460.0" y="223.0" font-size="12" text-anchor="start" fill="#111">3  M60 / program end: ChangeRequest = 1 (spindle stopped, table at change position)</text>
<line x1="750.0" y1="276.0" x2="450.0" y2="276.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="460.0" y="269.0" font-size="12" text-anchor="start" fill="#111">4  Door open request → CNC opens door, DoorOpen = 1  (≈ 2 s)</text>
<path d="M750,314 h36 v18 h-34" fill="none" stroke="#d97706" stroke-width="1.6"/>
<line x1="756.0" y1="332.0" x2="752.0" y2="332.0" stroke="#d97706" stroke-width="1" marker-end="url(#ah)"/>
<text x="796.0" y="328.0" font-size="12" text-anchor="start" fill="#111">5  Unclamp machine pallet, UnclampedOK  (≈ 2 s)</text>
<path d="M750,360 h36 v18 h-34" fill="none" stroke="#d97706" stroke-width="1.6"/>
<line x1="756.0" y1="378.0" x2="752.0" y2="378.0" stroke="#d97706" stroke-width="1" marker-end="url(#ah)"/>
<text x="796.0" y="374.0" font-size="12" text-anchor="start" fill="#111">6  Lift arm / table, LiftUp  (≈ 2 s)</text>
<path d="M750,406 h36 v18 h-34" fill="none" stroke="#d97706" stroke-width="1.6"/>
<line x1="756.0" y1="424.0" x2="752.0" y2="424.0" stroke="#d97706" stroke-width="1" marker-end="url(#ah)"/>
<text x="796.0" y="420.0" font-size="12" text-anchor="start" fill="#111">7  Rotate 180°, RotateDone (both end switches)  (≈ 4 s)</text>
<path d="M750,452 h36 v18 h-34" fill="none" stroke="#d97706" stroke-width="1.6"/>
<line x1="756.0" y1="470.0" x2="752.0" y2="470.0" stroke="#d97706" stroke-width="1" marker-end="url(#ah)"/>
<text x="796.0" y="466.0" font-size="12" text-anchor="start" fill="#111">8  Lower onto cones, air-sensing seat check SeatOK  (≈ 3 s)</text>
<line x1="750.0" y1="506.0" x2="450.0" y2="506.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="460.0" y="499.0" font-size="12" text-anchor="start" fill="#111">9  Clamp: ClampOK + pressure switch; door closes, DoorClosed  (≈ 2 s)</text>
<line x1="750.0" y1="552.0" x2="450.0" y2="552.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="460.0" y="545.0" font-size="12" text-anchor="start" fill="#111">10  ChangeDone = 1, PalletIdAtTable = new ID</text>
<line x1="450.0" y1="598.0" x2="150.0" y2="598.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="160.0" y="591.0" font-size="12" text-anchor="start" fill="#111">11  CycleStart with NC.ProgramNo of this pallet ID → Execute (PackML 6)</text>
<line x1="750.0" y1="644.0" x2="1050.0" y2="644.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="760.0" y="637.0" font-size="12" text-anchor="start" fill="#111">12  Old pallet on set-up side: ReadyToGive → stacker takes it to rack / load station</text>
<text x="24.0" y="712.0" font-size="11.5" text-anchor="start" fill="#444">Timeouts (examples): each APC step 10 s → alarm 02xx with the step number; ChangeDone missing 60 s after ChangeRequest → cell controller sets the machine to Held and calls the operator.</text>
</svg>