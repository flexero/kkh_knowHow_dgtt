<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Arial, Helvetica, sans-serif">
<title>Tolerance stack AGV to station: worst case 15.5 mm, RSS 8.96 mm, capture 12 mm</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Hand-over tolerance stack AGV → station (JSON "stack"): worst case ± 15.5 mm, RSS ± 8.96 mm, capture ± 12 mm → RISK</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#444">Bars to scale (1 mm = 40 px). Variance share = t_i² / Σ t_i². Verdict rule: capture ≥ WC safe · RSS ≤ capture &lt; WC risk · capture &lt; RSS not OK.</text>
<text x="420.0" y="107.0" font-size="12.5" text-anchor="end" fill="#111">AGV stop position (navigation)  (79.8 % of variance)</text>
<rect x="430.0" y="90.0" width="320.0" height="24.0" rx="0" fill="#94a3b8" stroke="none" stroke-width="1"/>
<text x="758.0" y="107.0" font-size="12" text-anchor="start" fill="#111">± 8 mm</text>
<text x="420.0" y="147.0" font-size="12.5" text-anchor="end" fill="#111">Floor unevenness effect  (11.2 % of variance)</text>
<rect x="430.0" y="130.0" width="120.0" height="24.0" rx="0" fill="#94a3b8" stroke="none" stroke-width="1"/>
<text x="558.0" y="147.0" font-size="12" text-anchor="start" fill="#111">± 3 mm</text>
<text x="420.0" y="187.0" font-size="12.5" text-anchor="end" fill="#111">Load position on the AGV deck  (5.0 % of variance)</text>
<rect x="430.0" y="170.0" width="80.0" height="24.0" rx="0" fill="#94a3b8" stroke="none" stroke-width="1"/>
<text x="518.0" y="187.0" font-size="12" text-anchor="start" fill="#111">± 2 mm</text>
<text x="420.0" y="227.0" font-size="12.5" text-anchor="end" fill="#111">Pallet / carrier tolerance  (1.2 % of variance)</text>
<rect x="430.0" y="210.0" width="40.0" height="24.0" rx="0" fill="#94a3b8" stroke="none" stroke-width="1"/>
<text x="478.0" y="227.0" font-size="12" text-anchor="start" fill="#111">± 1 mm</text>
<text x="420.0" y="267.0" font-size="12.5" text-anchor="end" fill="#111">Station installation error  (2.8 % of variance)</text>
<rect x="430.0" y="250.0" width="60.0" height="24.0" rx="0" fill="#94a3b8" stroke="none" stroke-width="1"/>
<text x="498.0" y="267.0" font-size="12" text-anchor="start" fill="#111">± 1.5 mm</text>
<line x1="40.0" y1="292.0" x2="1160.0" y2="292.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="420.0" y="317.0" font-size="13" text-anchor="end" fill="#111" font-weight="bold">Worst case = Σ |t_i|</text>
<rect x="430.0" y="300.0" width="620.0" height="24.0" rx="0" fill="#c62828" stroke="none" stroke-width="1" fill-opacity="0.8"/>
<text x="1058.0" y="317.0" font-size="13" text-anchor="start" fill="#111" font-weight="bold">± 15.5 mm</text>
<text x="420.0" y="357.0" font-size="13" text-anchor="end" fill="#111" font-weight="bold">RSS = √(Σ t_i²) = √80.25</text>
<rect x="430.0" y="340.0" width="358.3" height="24.0" rx="0" fill="#2563eb" stroke="none" stroke-width="1" fill-opacity="0.8"/>
<text x="796.3" y="357.0" font-size="13" text-anchor="start" fill="#111" font-weight="bold">± 8.96 mm</text>
<line x1="910.0" y1="80.0" x2="910.0" y2="390.0" stroke="#059669" stroke-width="3" stroke-dasharray="8 5"/>
<text x="916.0" y="408.0" font-size="13" text-anchor="start" fill="#059669" font-weight="bold">capture range of the guide ± 12 mm</text>
<rect x="40.0" y="430.0" width="1120.0" height="80.0" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
<text x="56.0" y="454.0" font-size="12.5" text-anchor="start" fill="#111">Verdict: RSS 8.96 ≤ capture 12 &lt; worst case 15.5 → RISK: works statistically, rare misses possible (normal model, ± t as 3σ: about 6 misses per 100 000 dockings).</text>
<text x="56.0" y="476.0" font-size="12.5" text-anchor="start" fill="#111">Actions: (1) reduce the largest contributor – AGV stop ± 8 mm is 79.8 % of the variance; ± 4.5 mm makes WC = 12.0 → safe; (2) or widen the guide to ± 16 mm;</text>
<text x="56.0" y="498.0" font-size="12.5" text-anchor="start" fill="#111">(3) always add an in-position sensor + retry (back off, approach again) and a fault message after 2 retries.</text>
</svg>