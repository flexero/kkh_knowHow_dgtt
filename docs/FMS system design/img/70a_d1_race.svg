<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Arial, Helvetica, sans-serif">
<title>D1 problem - a race when both partners write data block word 3</title>
<rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">D1 problem - a race when both partners write data block word 3</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Item 9 variant: the module clears word 3 after reading it. The cell controller writes the whole word 3 every poll (it also carries HS.Request, HS.Ack). Modbus has no 'write once'.</text>
<text x="80" y="120" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Cell controller</text>
<text x="80" y="300" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Module PLC</text>
<line x1="160" y1="130" x2="1140" y2="130" stroke="#1f5fa8" stroke-width="2"/>
<line x1="160" y1="310" x2="1140" y2="310" stroke="#111" stroke-width="2"/>
<polyline points="160,130 220,310" fill="none" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="220,310 220.95,300.20 213.36,302.73" fill="#1f5fa8"/>
<text x="160" y="115" font-size="10" text-anchor="start" fill="#1f5fa8">CC: FC16 w2=2, w3=1</text>
<rect x="326" y="302" width="8" height="16" rx="0" fill="#111" stroke="#111" stroke-width="1.5"/>
<text x="330" y="353" font-size="10" text-anchor="start" fill="#111">PLC reads w3=1 -&gt; Start executed</text>
<rect x="496" y="302" width="8" height="16" rx="0" fill="#111" stroke="#111" stroke-width="1.5"/>
<text x="500" y="335" font-size="10" text-anchor="start" fill="#111">PLC writes w3=0 (clears)</text>
<polyline points="670,130 730,310" fill="none" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="730,310 730.95,300.20 723.36,302.73" fill="#1f5fa8"/>
<text x="670" y="97" font-size="10" text-anchor="start" fill="#1f5fa8">CC poll: writes w3 from its OLD image = 1 (HS.Request change)</text>
<rect x="836" y="302" width="8" height="16" rx="0" fill="#111" stroke="#111" stroke-width="1.5"/>
<text x="840" y="335" font-size="10" text-anchor="start" fill="#111">PLC sees w3: 0 -&gt; 1 = NEW edge</text>
<rect x="1006" y="302" width="8" height="16" rx="0" fill="#111" stroke="#111" stroke-width="1.5"/>
<text x="1010" y="353" font-size="10" text-anchor="start" fill="#111">Start executed AGAIN (or rejected)</text>
<rect x="40" y="390" width="1120" height="100" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="60" y="415" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">Result: the same command is evaluated twice, or a new command is lost when the module's clear arrives after the CC's next write.</text>
<text x="60" y="440" font-size="11" text-anchor="start" fill="#111">Root cause: TWO writers for one word. The arrival order of the two writes is random (poll time, task time, network). No program trick makes it deterministic.</text>
<text x="60" y="462" font-size="11" text-anchor="start" fill="#111">Fix (decision D1): each word has exactly ONE writer. The module answers in ITS word 4 (bit8 CmdAck, bit9 CmdRej). The CC clears its own request after the echo.</text>
<text x="60" y="482" font-size="11" text-anchor="start" fill="#555">Same principle as the item 6 job handshake: request / echo / remove request / remove echo = 4 phases, all level signals.</text>
</svg>
