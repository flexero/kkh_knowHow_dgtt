<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Arial, Helvetica, sans-serif">
<title>Availability of the cell control chain (JSON availability) - series and parallel blocks</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">Availability of the cell control chain (JSON availability) - series and parallel blocks</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#52514e">A = MTBF / (MTBF + MTTR). Series: multiply. Parallel (redundant, independent): 1 - product(1 - A_i). Downtime = (1 - A) x 8 760 h.</text>
<text x="40.0" y="96.0" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">Single cell controller, single switch</text>
<line x1="30.0" y1="155.0" x2="58.0" y2="155.0" stroke="#333" stroke-width="1.5"/>
<rect x="60.0" y="125.0" width="230.0" height="60.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="175.0" y="151.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Core switch</text>
<text x="175.0" y="168.0" font-size="11" text-anchor="middle" fill="#52514e">A = 99.9960 %</text>
<line x1="290.0" y1="155.0" x2="310.0" y2="155.0" stroke="#333" stroke-width="1.5"/>
<rect x="310.0" y="125.0" width="230.0" height="60.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="425.0" y="151.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Cell controller PC</text>
<text x="425.0" y="168.0" font-size="11" text-anchor="middle" fill="#52514e">A = 99.9600 %</text>
<line x1="540.0" y1="155.0" x2="560.0" y2="155.0" stroke="#333" stroke-width="1.5"/>
<rect x="560.0" y="125.0" width="230.0" height="60.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="675.0" y="151.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Cell PLC</text>
<text x="675.0" y="168.0" font-size="11" text-anchor="middle" fill="#52514e">A = 99.9960 %</text>
<line x1="790.0" y1="155.0" x2="810.0" y2="155.0" stroke="#333" stroke-width="1.5"/>
<rect x="870.0" y="115.0" width="300.0" height="80.0" rx="6" fill="#ffffff" stroke="#3d7ac4" stroke-width="2"/>
<text x="1020.0" y="144.0" font-size="15" text-anchor="middle" fill="#3d7ac4" font-weight="bold">A chain = 99.9520 %</text>
<text x="1020.0" y="168.0" font-size="12" text-anchor="middle" fill="#111111">downtime 4.20 h/year = 252 min/year</text>
<text x="40.0" y="296.0" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">Redundant cell controller pair + switch ring</text>
<line x1="30.0" y1="385.0" x2="58.0" y2="385.0" stroke="#333" stroke-width="1.5"/>
<line x1="60.0" y1="385.0" x2="75.0" y2="385.0" stroke="#333" stroke-width="1.5"/>
<line x1="75.0" y1="345.0" x2="75.0" y2="425.0" stroke="#333" stroke-width="1.5"/>
