<text x="735.0" y="381.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Cell PLC</text>
<text x="735.0" y="398.0" font-size="11" text-anchor="middle" fill="#52514e">A = 99.9960 %</text>
<line x1="850.0" y1="385.0" x2="870.0" y2="385.0" stroke="#333" stroke-width="1.5"/>
<rect x="870.0" y="345.0" width="300.0" height="80.0" rx="6" fill="#ffffff" stroke="#3d7ac4" stroke-width="2"/>
<text x="1020.0" y="374.0" font-size="15" text-anchor="middle" fill="#3d7ac4" font-weight="bold">A chain = 99.9960 %</text>
<text x="1020.0" y="398.0" font-size="12" text-anchor="middle" fill="#111111">downtime 0.35 h/year = 21 min/year</text>
<text x="40.0" y="520.0" font-size="12.5" text-anchor="start" fill="#111111" font-weight="bold">MES outages (not in the chain - covered by the local job buffer): f = 8 760 / (8 000 + 4) = 1.0945 per year, mean duration 4 h.</text>
<text x="40.0" y="542.0" font-size="12.5" text-anchor="start" fill="#111111">Expected production loss L(b) = f x MTTR x exp(-b / MTTR) for a job buffer of b hours:</text>
<rect x="60.0" y="561.9" width="60.0" height="68.1" rx="2" fill="#e34948" stroke="none" stroke-width="0"/>
<text x="90.0" y="557.9" font-size="11.5" text-anchor="middle" fill="#111111" font-weight="bold">4.38 h</text>
<text x="200.0" y="560.0" font-size="1" text-anchor="start" fill="#111111"></text>
<text x="90.0" y="644.0" font-size="11" text-anchor="middle" fill="#52514e">b = 0 h</text>
<rect x="190.0" y="577.0" width="60.0" height="53.0" rx="2" fill="#e34948" stroke="none" stroke-width="0"/>
