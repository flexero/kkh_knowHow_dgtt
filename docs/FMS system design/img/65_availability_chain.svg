<rect x="450.0" y="604.9" width="60.0" height="25.1" rx="2" fill="#e34948" stroke="none" stroke-width="0"/>
<text x="480.0" y="600.9" font-size="11.5" text-anchor="middle" fill="#111111" font-weight="bold">1.61 h</text>
<text x="590.0" y="560.0" font-size="1" text-anchor="start" fill="#111111"></text>
<text x="480.0" y="644.0" font-size="11" text-anchor="middle" fill="#52514e">b = 4 h</text>
<rect x="580.0" y="620.8" width="60.0" height="9.2" rx="2" fill="#e34948" stroke="none" stroke-width="0"/>
<text x="610.0" y="616.8" font-size="11.5" text-anchor="middle" fill="#111111" font-weight="bold">0.59 h</text>
<text x="720.0" y="560.0" font-size="1" text-anchor="start" fill="#111111"></text>
<text x="610.0" y="644.0" font-size="11" text-anchor="middle" fill="#52514e">b = 8 h</text>
<text x="760.0" y="590.0" font-size="12" text-anchor="start" fill="#111111">A buffer of one shift (8 h) cuts the MES-caused</text>
<text x="760.0" y="608.0" font-size="12" text-anchor="start" fill="#111111">loss from 4.38 h to 0.59 h per year (-86 %).</text>
</svg>
