<text x="470.0" y="421.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Cell controller PC</text>
<text x="470.0" y="438.0" font-size="11" text-anchor="middle" fill="#52514e">A = 99.9600 %</text>
<line x1="355.0" y1="425.0" x2="365.0" y2="425.0" stroke="#333" stroke-width="1.5"/>
<line x1="575.0" y1="425.0" x2="585.0" y2="425.0" stroke="#333" stroke-width="1.5"/>
<text x="470.0" y="465.0" font-size="11.5" text-anchor="middle" fill="#3d7ac4" font-weight="bold">pair: 1 - A = 1.6e-07</text>
