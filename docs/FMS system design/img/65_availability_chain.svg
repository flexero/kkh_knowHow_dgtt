<rect x="85.0" y="320.0" width="210.0" height="50.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="190.0" y="341.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Core switch</text>
<text x="190.0" y="358.0" font-size="11" text-anchor="middle" fill="#52514e">A = 99.9960 %</text>
<line x1="75.0" y1="345.0" x2="85.0" y2="345.0" stroke="#333" stroke-width="1.5"/>
<line x1="295.0" y1="345.0" x2="305.0" y2="345.0" stroke="#333" stroke-width="1.5"/>
<rect x="85.0" y="400.0" width="210.0" height="50.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="190.0" y="421.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Core switch</text>
<text x="190.0" y="438.0" font-size="11" text-anchor="middle" fill="#52514e">A = 99.9960 %</text>
<line x1="75.0" y1="425.0" x2="85.0" y2="425.0" stroke="#333" stroke-width="1.5"/>
<line x1="295.0" y1="425.0" x2="305.0" y2="425.0" stroke="#333" stroke-width="1.5"/>
<text x="190.0" y="465.0" font-size="11.5" text-anchor="middle" fill="#3d7ac4" font-weight="bold">pair: 1 - A = 1.6e-09</text>
<line x1="320.0" y1="385.0" x2="340.0" y2="385.0" stroke="#333" stroke-width="1.5"/>
<line x1="340.0" y1="385.0" x2="355.0" y2="385.0" stroke="#333" stroke-width="1.5"/>
