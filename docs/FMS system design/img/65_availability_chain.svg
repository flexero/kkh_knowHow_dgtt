<line x1="585.0" y1="345.0" x2="585.0" y2="425.0" stroke="#333" stroke-width="1.5"/>
<rect x="365.0" y="320.0" width="210.0" height="50.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="470.0" y="341.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Cell controller PC</text>
<text x="470.0" y="358.0" font-size="11" text-anchor="middle" fill="#52514e">A = 99.9600 %</text>
