<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Arial, Helvetica, sans-serif">
<title>One function in the five IEC 61131-3 languages: start / stop latch of a pump</title>
<rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">One function in the five IEC 61131-3 languages: start / stop latch of a pump</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Run := (Start OR Run) AND NOT Stop AND NOT Tripped  (Start NO push-button, Stop NC wired, evaluated TRUE = pressed). IL is deprecated in ed. 3 and removed in ed. 4.</text>
<text x="40" y="92" font-size="13" text-anchor="start" font-weight="bold" fill="#111">LD - Ladder Diagram</text>
<line x1="50" y1="110" x2="50" y2="230" stroke="#111" stroke-width="3"/>
<line x1="560" y1="110" x2="560" y2="230" stroke="#111" stroke-width="3"/>
<line x1="50" y1="140" x2="90" y2="140" stroke="#111" stroke-width="1.5"/>
<line x1="90" y1="128" x2="90" y2="152" stroke="#111" stroke-width="2"/>
<line x1="104" y1="128" x2="104" y2="152" stroke="#111" stroke-width="2"/>
<text x="97" y="122" font-size="11" text-anchor="middle" fill="#111">Start</text>
<line x1="104" y1="140" x2="200" y2="140" stroke="#111" stroke-width="1.5"/>
<line x1="200" y1="128" x2="200" y2="152" stroke="#111" stroke-width="2"/>
<line x1="214" y1="128" x2="214" y2="152" stroke="#111" stroke-width="2"/>
<line x1="198" y1="152" x2="216" y2="128" stroke="#111" stroke-width="1.5"/>
<text x="207" y="122" font-size="11" text-anchor="middle" fill="#111">Stop</text>
<line x1="214" y1="140" x2="300" y2="140" stroke="#111" stroke-width="1.5"/>
<line x1="300" y1="128" x2="300" y2="152" stroke="#111" stroke-width="2"/>
<line x1="314" y1="128" x2="314" y2="152" stroke="#111" stroke-width="2"/>
<line x1="298" y1="152" x2="316" y2="128" stroke="#111" stroke-width="1.5"/>
<text x="307" y="122" font-size="11" text-anchor="middle" fill="#111">Tripped</text>
<line x1="314" y1="140" x2="470" y2="140" stroke="#111" stroke-width="1.5"/>
<path d="M 470 128 A 14 14 0 0 0 470 152" fill="none" stroke="#111" stroke-width="2"/>
<path d="M 490 128 A 14 14 0 0 1 490 152" fill="none" stroke="#111" stroke-width="2"/>
<text x="480" y="122" font-size="11" text-anchor="middle" fill="#111">Run</text>
<line x1="490" y1="140" x2="560" y2="140" stroke="#111" stroke-width="1.5"/>
<line x1="70" y1="140" x2="70" y2="195" stroke="#111" stroke-width="1.5"/>
<line x1="70" y1="195" x2="90" y2="195" stroke="#111" stroke-width="1.5"/>
<line x1="90" y1="183" x2="90" y2="207" stroke="#111" stroke-width="2"/>
<line x1="104" y1="183" x2="104" y2="207" stroke="#111" stroke-width="2"/>
<text x="97" y="177" font-size="11" text-anchor="middle" fill="#111">Run</text>
<line x1="104" y1="195" x2="150" y2="195" stroke="#111" stroke-width="1.5"/>
<line x1="150" y1="195" x2="150" y2="140" stroke="#111" stroke-width="1.5"/>
<text x="620" y="92" font-size="13" text-anchor="start" font-weight="bold" fill="#111">FBD - Function Block Diagram</text>
<rect x="720" y="115" width="60" height="60" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="750" y="150" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">&gt;=1</text>
<rect x="860" y="115" width="60" height="90" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="890" y="165" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">&amp;</text>
<text x="640" y="132" font-size="12" text-anchor="start" fill="#111">Start</text>
<line x1="680" y1="128" x2="720" y2="128" stroke="#111" stroke-width="1.5"/>
<text x="640" y="166" font-size="12" text-anchor="start" fill="#111">Run</text>
<line x1="680" y1="162" x2="720" y2="162" stroke="#111" stroke-width="1.5"/>
<line x1="780" y1="145" x2="860" y2="128" stroke="#111" stroke-width="1.5"/>
<text x="796" y="182" font-size="12" text-anchor="start" fill="#111">Stop</text>
<line x1="828" y1="178" x2="852" y2="178" stroke="#111" stroke-width="1.5"/>
<circle cx="856" cy="178" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="790" y="204" font-size="12" text-anchor="start" fill="#111">Tripped</text>
<line x1="840" y1="196" x2="852" y2="196" stroke="#111" stroke-width="1.5"/>
<circle cx="856" cy="196" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<line x1="920" y1="160" x2="980" y2="160" stroke="#111" stroke-width="1.5"/>
<text x="985" y="164" font-size="12" text-anchor="start" fill="#111">Run</text>
<text x="40" y="270" font-size="13" text-anchor="start" font-weight="bold" fill="#111">ST - Structured Text</text>
<rect x="40" y="282" width="520" height="70" rx="0" fill="#fafafa" stroke="#666" stroke-width="1"/>
<text x="56" y="308" font-size="13" text-anchor="start" fill="#111">Run := (Start OR Run) AND NOT Stop AND NOT Tripped;</text>
<text x="56" y="334" font-size="11" text-anchor="start" fill="#666">(* or with the standard RS block: rsRun(S := Start, R1 := Stop OR Tripped); *)</text>
<text x="620" y="270" font-size="13" text-anchor="start" font-weight="bold" fill="#111">IL - Instruction List (deprecated)</text>
<rect x="620" y="282" width="300" height="150" rx="0" fill="#fafafa" stroke="#666" stroke-width="1"/>
<text x="636" y="306" font-size="13" text-anchor="start" fill="#111">LD    Start</text>
<text x="636" y="330" font-size="13" text-anchor="start" fill="#111">OR    Run</text>
<text x="636" y="354" font-size="13" text-anchor="start" fill="#111">ANDN  Stop</text>
<text x="636" y="378" font-size="13" text-anchor="start" fill="#111">ANDN  Tripped</text>
<text x="636" y="402" font-size="13" text-anchor="start" fill="#111">ST    Run</text>
<text x="940" y="306" font-size="11" text-anchor="start" fill="#666">accumulator machine,</text>
<text x="940" y="322" font-size="11" text-anchor="start" fill="#666">removed in IEC 61131-3</text>
<text x="940" y="338" font-size="11" text-anchor="start" fill="#c0392b">ed. 4 (2025) - do not use</text>
<text x="940" y="354" font-size="11" text-anchor="start" fill="#c0392b">for new projects</text>
<text x="40" y="385" font-size="13" text-anchor="start" font-weight="bold" fill="#111">SFC - Sequential Function Chart</text>
<rect x="80" y="400" width="90" height="34" rx="0" fill="#fff" stroke="#111" stroke-width="3"/>
<rect x="84" y="404" width="82" height="26" rx="0" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="125" y="422" font-size="12" text-anchor="middle" fill="#111">S0 Off</text>
<line x1="125" y1="434" x2="125" y2="470" stroke="#111" stroke-width="1.5"/>
<line x1="105" y1="452" x2="145" y2="452" stroke="#111" stroke-width="3"/>
<text x="155" y="456" font-size="11" text-anchor="start" fill="#111">Start AND NOT Stop AND NOT Tripped</text>
<rect x="80" y="470" width="90" height="34" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="125" y="492" font-size="12" text-anchor="middle" fill="#111">S1 Running</text>
<rect x="170" y="474" width="110" height="26" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="225" y="491" font-size="12" text-anchor="middle" fill="#111">N   Run</text>
<line x1="125" y1="504" x2="125" y2="540" stroke="#111" stroke-width="1.5"/>
<line x1="105" y1="522" x2="145" y2="522" stroke="#111" stroke-width="3"/>
<text x="155" y="526" font-size="11" text-anchor="start" fill="#111">Stop OR Tripped</text>
<line x1="125" y1="540" x2="125" y2="552" stroke="#111" stroke-width="1.5"/>
<line x1="125" y1="552" x2="60" y2="552" stroke="#111" stroke-width="1.5"/>
<line x1="60" y1="552" x2="60" y2="390" stroke="#111" stroke-width="1.5"/>
<line x1="60" y1="390" x2="125" y2="390" stroke="#111" stroke-width="1.5"/>
<polygon points="125,390 116.00,386.22 116.00,393.78" fill="#111"/>
<line x1="125" y1="390" x2="125" y2="400" stroke="#111" stroke-width="1.5"/>
<text x="620" y="470" font-size="13" text-anchor="start" font-weight="bold" fill="#111">When to use which (typical FMS practice)</text>
<text x="630" y="494" font-size="12" text-anchor="start" fill="#111">LD: interlocks, simple bit logic, electricians on site</text>
<text x="630" y="514" font-size="12" text-anchor="start" fill="#111">FBD: signal flow, analog chains, safety programs (F-FBD)</text>
<text x="630" y="534" font-size="12" text-anchor="start" fill="#111">ST: device FBs, calculations, state machines, generated code</text>
<text x="630" y="554" font-size="12" text-anchor="start" fill="#111">SFC: visible step chains (or a CASE step chain in ST)</text>
<text x="630" y="574" font-size="12" text-anchor="start" fill="#111">IL: legacy only - translate to ST</text>
<text x="24" y="606" font-size="11" text-anchor="start" fill="#666">Teaching example - not for construction. Real PLC code: written, reviewed and validated by qualified people (IEC 61131-3, IEC 62061 / ISO 13849).</text>
</svg>
