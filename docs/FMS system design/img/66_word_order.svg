<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Arial, Helvetica, sans-serif">
<title>Word order of 32-bit values in two Modbus registers - ABCD, CDAB, BADC, DCBA</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker></defs>
<rect x="0" y="0" width="1200" height="470" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">Word order of 32-bit values in two Modbus registers - ABCD, CDAB, BADC, DCBA</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555555">Bytes A B C D = the value in big-endian. What a reader that expects ABCD (this standard) sees when the sender uses another order.</text>
<text x="30" y="95" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Order sent</text>
<text x="190" y="95" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">DINT 70001 (bytes)</text>
<text x="400" y="95" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">read as DINT (ABCD reader)</text>
<text x="690" y="95" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">REAL 1834.5 (bytes)</text>
<text x="900" y="95" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">read as REAL (ABCD reader)</text>
<rect x="20" y="108" width="1160" height="40" rx="2" fill="#dbe9f6" stroke="#1f6fb2" stroke-width="1"/>
<text x="30" y="133" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">ABCD (standard)</text>
<text x="190" y="133" font-size="13" text-anchor="start" fill="#111111">00 01 11 71</text>
<text x="400" y="133" font-size="13" text-anchor="start" fill="#111111">70001</text>
<text x="690" y="133" font-size="13" text-anchor="start" fill="#111111">44 E5 50 00</text>
<text x="900" y="133" font-size="13" text-anchor="start" fill="#111111">1834.5</text>
<rect x="20" y="158" width="1160" height="40" rx="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
<text x="30" y="183" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">CDAB (word swap)</text>
<text x="190" y="183" font-size="13" text-anchor="start" fill="#111111">11 71 00 01</text>
<text x="400" y="183" font-size="13" text-anchor="start" fill="#111111">292 618 241</text>
<text x="690" y="183" font-size="13" text-anchor="start" fill="#111111">50 00 44 E5</text>
<text x="900" y="183" font-size="13" text-anchor="start" fill="#111111">8.608e9</text>
<rect x="20" y="208" width="1160" height="40" rx="2" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
<text x="30" y="233" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">BADC (byte swap)</text>
<text x="190" y="233" font-size="13" text-anchor="start" fill="#111111">01 00 71 11</text>
<text x="400" y="233" font-size="13" text-anchor="start" fill="#111111">16 806 161</text>
<text x="690" y="233" font-size="13" text-anchor="start" fill="#111111">E5 44 00 50</text>
<text x="900" y="233" font-size="13" text-anchor="start" fill="#111111">-5.785e22</text>
<rect x="20" y="258" width="1160" height="40" rx="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
<text x="30" y="283" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">DCBA (both)</text>
<text x="190" y="283" font-size="13" text-anchor="start" fill="#111111">71 11 01 00</text>
<text x="400" y="283" font-size="13" text-anchor="start" fill="#111111">1 896 939 776</text>
<text x="690" y="283" font-size="13" text-anchor="start" fill="#111111">00 50 E5 44</text>
<text x="900" y="283" font-size="13" text-anchor="start" fill="#111111">7.43e-39</text>
<text x="30" y="345" font-size="12" text-anchor="start" fill="#111111">Register view of the standard (ABCD): DINT 70001 -&gt; word n = 0x0001 = 1, word n+1 = 0x1171 = 4465 ; REAL 1834.5 -&gt; 0x44E5, 0x5000.</text>
<text x="30" y="368" font-size="12" text-anchor="start" fill="#111111">How to recognise: a counter that jumps by 65 536 per step or reads millions -&gt; word swap ; REAL like 8.6e9 or 7e-39 for a cycle time -&gt; wrong order.</text>
<text x="30" y="391" font-size="12" text-anchor="start" fill="#1f6fb2">Fix in the reader (byte / word swap option of the driver) - never in two places. Test at FAT with a value whose 4 bytes are all different.</text>
<text x="30" y="420" font-size="12" text-anchor="start" fill="#555555">Good test values: DINT 16909060 = 0x01020304 ; REAL 1834.5 = 0x44E55000 (word 2 = 0x5000 is not zero, so a word swap is visible).</text>
</svg>