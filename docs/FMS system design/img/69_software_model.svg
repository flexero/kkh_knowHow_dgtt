<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>IEC 61131-3 software model: configuration, resource, task, program, POU</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">IEC 61131-3 software model: configuration, resource, task, program, POU</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">A configuration = one PLC; a resource = one CPU / runtime; tasks call programs; programs call FB instances; FBs call functions and other FBs.</text>
<rect x="40" y="80" width="1120" height="470" rx="0" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="56" y="102" font-size="13" text-anchor="start" font-weight="bold" fill="#111">CONFIGURATION  PLT1_MACH_FMS1_PLC1  (global variables, access paths, IO configuration)</text>
<rect x="60" y="118" width="1080" height="420" rx="0" fill="#fafafa" stroke="#111" stroke-width="1.5"/>
<text x="76" y="140" font-size="13" text-anchor="start" font-weight="bold" fill="#111">RESOURCE  CPU1  (one processor / runtime)</text>
<rect x="80" y="158" width="240" height="46" rx="0" fill="#f2f2f2" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="200" y="177.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">TASK Fast_Motion</text>
<text x="200" y="192.7" font-size="12" text-anchor="middle" fill="#111">cyclic 2 ms, prio 1</text>
<line x1="200" y1="204" x2="200" y2="226" stroke="#111" stroke-width="1.5"/>
<polygon points="200,226 203.78,217.00 196.22,217.00" fill="#111"/>
<rect x="80" y="226" width="240" height="34" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="200" y="247.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">PROGRAM PRG_Motion</text>
<rect x="345" y="158" width="240" height="46" rx="0" fill="#f2f2f2" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="465" y="177.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">TASK Main</text>
<text x="465" y="192.7" font-size="12" text-anchor="middle" fill="#111">cyclic 10 ms, prio 2</text>
<line x1="465" y1="204" x2="465" y2="226" stroke="#111" stroke-width="1.5"/>
<polygon points="465,226 468.78,217.00 461.22,217.00" fill="#111"/>
<rect x="345" y="226" width="240" height="34" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="465" y="247.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">PROGRAM PRG_Main</text>
<rect x="610" y="158" width="240" height="46" rx="0" fill="#f2f2f2" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="730" y="177.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">TASK Comm</text>
<text x="730" y="192.7" font-size="12" text-anchor="middle" fill="#111">cyclic 100 ms, prio 3</text>
<line x1="730" y1="204" x2="730" y2="226" stroke="#111" stroke-width="1.5"/>
<polygon points="730,226 733.78,217.00 726.22,217.00" fill="#111"/>
<rect x="610" y="226" width="240" height="34" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="730" y="247.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">PROGRAM PRG_Comm</text>
<rect x="875" y="158" width="240" height="46" rx="0" fill="#f2f2f2" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="995" y="177.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">TASK Diag</text>
<text x="995" y="192.7" font-size="12" text-anchor="middle" fill="#111">cyclic 1 s, prio 4</text>
<line x1="995" y1="204" x2="995" y2="226" stroke="#111" stroke-width="1.5"/>
<polygon points="995,226 998.78,217.00 991.22,217.00" fill="#111"/>
<rect x="875" y="226" width="240" height="34" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="995" y="247.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">PROGRAM PRG_Diag</text>
<line x1="465" y1="260" x2="465" y2="290" stroke="#111" stroke-width="1.5"/>
<rect x="300" y="290" width="330" height="40" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="465" y="306.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">FB_APC01 (module FB, instance APC01)</text>
<text x="465" y="320.85" font-size="11" text-anchor="middle" fill="#111">PackML + sequence + data block</text>
<line x1="465" y1="330" x2="465" y2="350" stroke="#111" stroke-width="1.5"/>
<line x1="170" y1="350" x2="760" y2="350" stroke="#111" stroke-width="1.5"/>
<line x1="170" y1="350" x2="170" y2="368" stroke="#111" stroke-width="1.5"/>
<rect x="90" y="368" width="160" height="40" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="170" y="384.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">FB_APC01_Devices</text>
<text x="170" y="398.85" font-size="11" text-anchor="middle" fill="#111">generated (G1)</text>
<line x1="360" y1="350" x2="360" y2="368" stroke="#111" stroke-width="1.5"/>
<rect x="280" y="368" width="160" height="40" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="360" y="384.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">FB_PackML</text>
<text x="360" y="398.85" font-size="11" text-anchor="middle" fill="#111">state machine</text>
<line x1="550" y1="350" x2="550" y2="368" stroke="#111" stroke-width="1.5"/>
<rect x="470" y="368" width="160" height="40" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="550" y="384.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">FB_AlarmHandler</text>
<text x="550" y="398.85" font-size="11" text-anchor="middle" fill="#111">ISA-18.2 + AlarmNo</text>
<line x1="740" y1="350" x2="740" y2="368" stroke="#111" stroke-width="1.5"/>
<rect x="660" y="368" width="160" height="40" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="740" y="384.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">FB_ModuleHandshake</text>
<text x="740" y="398.85" font-size="11" text-anchor="middle" fill="#111">words 0-19</text>
<line x1="170" y1="408" x2="170" y2="428" stroke="#111" stroke-width="1.5"/>
<line x1="80" y1="428" x2="470" y2="428" stroke="#111" stroke-width="1.5"/>
<line x1="125" y1="428" x2="125" y2="444" stroke="#111" stroke-width="1.5"/>
<rect x="80" y="444" width="92" height="38" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="126" y="460" font-size="10" text-anchor="middle" font-weight="bold" fill="#111">Rotate</text>
<text x="126" y="473" font-size="10" text-anchor="middle" fill="#111">FB_Valve2</text>
<line x1="225" y1="428" x2="225" y2="444" stroke="#111" stroke-width="1.5"/>
<rect x="180" y="444" width="92" height="38" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="226" y="460" font-size="10" text-anchor="middle" font-weight="bold" fill="#111">Clamp</text>
<text x="226" y="473" font-size="10" text-anchor="middle" fill="#111">FB_Valve1</text>
<line x1="325" y1="428" x2="325" y2="444" stroke="#111" stroke-width="1.5"/>
<rect x="280" y="444" width="92" height="38" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="326" y="460" font-size="10" text-anchor="middle" font-weight="bold" fill="#111">PalSideA/B</text>
<text x="326" y="473" font-size="10" text-anchor="middle" fill="#111">FB_Sensor</text>
<line x1="425" y1="428" x2="425" y2="444" stroke="#111" stroke-width="1.5"/>
<rect x="380" y="444" width="92" height="38" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="426" y="460" font-size="10" text-anchor="middle" font-weight="bold" fill="#111">ClampPress</text>
<text x="426" y="473" font-size="10" text-anchor="middle" fill="#111">FB_AnalogIn</text>
<rect x="470" y="444" width="170" height="38" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="555" y="460" font-size="10" text-anchor="middle" fill="#111">FUNCTION Scale</text>
<text x="555" y="473" font-size="10" text-anchor="middle" fill="#111">FUNCTION LimitHyst</text>
<text x="80" y="505" font-size="11" text-anchor="start" fill="#111">POU types: PROGRAM, FUNCTION_BLOCK (has memory, one instance per device), FUNCTION (no memory),</text>
<text x="80" y="521" font-size="11" text-anchor="start" fill="#111">METHOD / INTERFACE / PROPERTY (ed. 3 OOP), NAMESPACE (ed. 4). Data: VAR, VAR_INPUT/OUTPUT/IN_OUT, VAR_GLOBAL, RETAIN, PERSISTENT.</text>
<rect x="850" y="270" width="280" height="230" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="990" y="292" font-size="13" text-anchor="middle" font-weight="bold" fill="#c0392b">Safety program (F-runtime)</text>
<text x="870" y="318" font-size="12" text-anchor="start" fill="#111">own F-task, e.g. 10 ms</text>
<text x="870" y="342" font-size="12" text-anchor="start" fill="#111">certified F-blocks only (ESTOP,</text>
<text x="870" y="366" font-size="12" text-anchor="start" fill="#111">door, STO, EDM, mode)</text>
<text x="870" y="390" font-size="12" text-anchor="start" fill="#111">writes FDO, reads FDI</text>
<text x="870" y="414" font-size="12" text-anchor="start" fill="#c0392b">standard program: READ-ONLY</text>
<text x="870" y="438" font-size="12" text-anchor="start" fill="#111">copies of F-signals (item 7)</text>
<text x="870" y="462" font-size="12" text-anchor="start" fill="#c0392b">change = new F-signature + validation</text>
<text x="24" y="586" font-size="11" text-anchor="start" fill="#666">Teaching example - not for construction. Real PLC code: written, reviewed and validated by qualified people (IEC 61131-3, IEC 62061 / ISO 13849).</text>
</svg>
