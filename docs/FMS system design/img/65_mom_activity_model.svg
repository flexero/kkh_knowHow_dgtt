<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Arial, Helvetica, sans-serif">
<title>IEC 62264-3 activity model of manufacturing operations management (one of four categories)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">IEC 62264-3 activity model of manufacturing operations management (one of four categories)</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#52514e">The same 8 activities exist for production, maintenance, quality and inventory operations. Arrows = main information flow.</text>
<rect x="40.0" y="76.0" width="1120.0" height="44.0" rx="6" fill="#dbe7f5" stroke="#333" stroke-width="1.5"/>
<text x="600.0" y="104.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Level 4: ERP - product definitions, capability requests, schedules  /  performance, capability, confirmations</text>
<rect x="40.0" y="560.0" width="1120.0" height="44.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="600.0" y="588.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Level 2 / 1: cell controller, SCADA, PLC, CNC - commands down, states and data up</text>
<rect x="60.0" y="160.0" width="220.0" height="70.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="170.0" y="191.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Resource management</text>
<text x="170.0" y="208.0" font-size="11" text-anchor="middle" fill="#52514e">people, machines, material</text>
<rect x="930.0" y="160.0" width="220.0" height="70.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="1040.0" y="191.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Definition management</text>
<text x="1040.0" y="208.0" font-size="11" text-anchor="middle" fill="#52514e">routings, NC programs</text>
<rect x="360.0" y="160.0" width="220.0" height="70.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="470.0" y="191.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Detailed scheduling</text>
<text x="470.0" y="208.0" font-size="11" text-anchor="middle" fill="#52514e">sequence per machine</text>
<rect x="360.0" y="290.0" width="220.0" height="70.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="470.0" y="321.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Dispatching</text>
<text x="470.0" y="338.0" font-size="11" text-anchor="middle" fill="#52514e">release jobs to the cell</text>
<rect x="360.0" y="420.0" width="220.0" height="70.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="470.0" y="451.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Execution management</text>
<text x="470.0" y="468.0" font-size="11" text-anchor="middle" fill="#52514e">start, follow, finish</text>
<rect x="650.0" y="420.0" width="220.0" height="70.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="760.0" y="451.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Data collection</text>
<text x="760.0" y="468.0" font-size="11" text-anchor="middle" fill="#52514e">states, counts, values</text>
<rect x="650.0" y="290.0" width="220.0" height="70.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="760.0" y="321.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Tracking</text>
<text x="760.0" y="338.0" font-size="11" text-anchor="middle" fill="#52514e">WIP, genealogy, confirm</text>
<rect x="650.0" y="160.0" width="220.0" height="70.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="760.0" y="191.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Performance analysis</text>
<text x="760.0" y="208.0" font-size="11" text-anchor="middle" fill="#52514e">OEE, KPIs, reports</text>
<line x1="470.0" y1="230.0" x2="470.0" y2="288.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="470.0" y1="360.0" x2="470.0" y2="418.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="580.0" y1="455.0" x2="648.0" y2="455.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="760.0" y1="420.0" x2="760.0" y2="362.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="760.0" y1="290.0" x2="760.0" y2="232.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="650.0" y1="195.0" x2="582.0" y2="195.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="650.0" y1="325.0" x2="582.0" y2="325.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="280.0" y1="195.0" x2="358.0" y2="195.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="930.0" y1="195.0" x2="872.0" y2="195.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="1040.0" y1="230.0" x2="1040.0" y2="330.0" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="1040.0" y1="330.0" x2="582.0" y2="455.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="4,3"/>
<text x="940.0" y="300.0" font-size="11" text-anchor="start" fill="#52514e">programs / routings to execution</text>
<line x1="470.0" y1="120.0" x2="470.0" y2="158.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="760.0" y1="158.0" x2="760.0" y2="122.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="470.0" y1="490.0" x2="470.0" y2="558.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="760.0" y1="558.0" x2="760.0" y2="492.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="60.0" y="280.0" font-size="12" text-anchor="start" fill="#111111" font-weight="bold">Four categories, same model:</text>
<text x="70.0" y="300.0" font-size="12" text-anchor="start" fill="#111111">- production operations</text>
<text x="70.0" y="318.0" font-size="12" text-anchor="start" fill="#111111">- maintenance operations</text>
<text x="70.0" y="336.0" font-size="12" text-anchor="start" fill="#111111">- quality operations</text>
<text x="70.0" y="354.0" font-size="12" text-anchor="start" fill="#111111">- inventory operations</text>
</svg>
