<text x="40.0" y="750.0" font-size="11.5" text-anchor="start" fill="#444">Tag rule: PLT1.MACH.FMS1.&lt;UNIT&gt;.&lt;Signal&gt;, e.g. PLT1.MACH.FMS1.HMC01.Status.StateCurrent (guide 65 §5).</text>
