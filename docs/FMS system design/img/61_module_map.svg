<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="Arial, Helvetica, sans-serif">
<title>Map of the 22 standard modules M01 to M22 around the cell network; FMS starting kit highlighted</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1400" height="820" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">The module standard: 22 modules around the cell network (orange fill = modules of the machining FMS starting kit)</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#444">Every module has the same 9 faces. Modules talk only through their FB interface + handshake; M19 coordinates; safety runs on its own hard-wired / safety-bus layer (M18).</text>
<text x="40.0" y="92.0" font-size="13" text-anchor="start" fill="#1e3a8a" font-weight="bold">Control layer (ISA-95 level 3 / 2)</text>
