<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Arial, Helvetica, sans-serif">
<title>PROFINET topologies - line, ring with MRP, star</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker></defs>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">PROFINET topologies - line, ring with MRP, star</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555555">Device names after the Part F rule (lower case). Line: a cable break cuts all downstream devices. Ring + MRP: recovery &lt;= 200 ms (MRP default class).</text>
<text x="30" y="90" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">1  Line (2-port switch in every device)</text>
<rect x="30" y="110" width="160" height="50" rx="4" fill="#dbe9f6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="110.0" y="131.66666666666666" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">IO controller</text>
<text x="110.0" y="145.66666666666666" font-size="11" text-anchor="middle" fill="#111111">fms1-mc01-plc-machine</text>
<line x1="190" y1="135" x2="240" y2="135" stroke="#333" stroke-width="2"/>
<rect x="240" y="110" width="160" height="50" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="320.0" y="131.66666666666666" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">Remote IO</text>
<text x="320.0" y="145.66666666666666" font-size="11" text-anchor="middle" fill="#111111">fms1-mc01-io1</text>
<line x1="400" y1="135" x2="420" y2="135" stroke="#333" stroke-width="2"/>
<rect x="420" y="110" width="160" height="50" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="500.0" y="131.66666666666666" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">Drive X</text>
<text x="500.0" y="145.66666666666666" font-size="11" text-anchor="middle" fill="#111111">fms1-mc01-drv-x</text>
<line x1="580" y1="135" x2="600" y2="135" stroke="#333" stroke-width="2"/>
<rect x="600" y="110" width="160" height="50" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="680.0" y="131.66666666666666" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">Valve terminal</text>
<text x="680.0" y="145.66666666666666" font-size="11" text-anchor="middle" fill="#111111">fms1-mc01-vt1</text>
<line x1="760" y1="135" x2="780" y2="135" stroke="#333" stroke-width="2"/>
<rect x="780" y="110" width="160" height="50" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="860.0" y="131.66666666666666" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">IO-Link master</text>
<text x="860.0" y="145.66666666666666" font-size="11" text-anchor="middle" fill="#111111">fms1-mc01-iol1</text>
<line x1="404" y1="126" x2="412" y2="144" stroke="#1f6fb2" stroke-width="3"/>
<line x1="412" y1="126" x2="404" y2="144" stroke="#1f6fb2" stroke-width="3"/>
<text x="420" y="190" font-size="12" text-anchor="start" fill="#1f6fb2">break between remote IO and drive -&gt; drive, valves and IO-Link master lost</text>
<text x="30" y="232" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">2  Ring with MRP (one manager MRM, the others clients MRC)</text>
<rect x="70" y="255" width="190" height="48" rx="4" fill="#dbe9f6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="165.0" y="275.6666666666667" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">MRM: cell switch</text>
<text x="165.0" y="289.6666666666667" font-size="11" text-anchor="middle" fill="#111111">fms1-net01-core-switch</text>
<rect x="290" y="255" width="190" height="48" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="385.0" y="275.6666666666667" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">MC01 PLC</text>
<text x="385.0" y="289.6666666666667" font-size="11" text-anchor="middle" fill="#111111">fms1-mc01-plc-machine</text>
<line x1="260" y1="279" x2="290" y2="279" stroke="#333" stroke-width="2"/>
<rect x="510" y="255" width="190" height="48" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="605.0" y="275.6666666666667" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">MC02 PLC</text>
<text x="605.0" y="289.6666666666667" font-size="11" text-anchor="middle" fill="#111111">fms1-mc02-plc-machine</text>
<line x1="480" y1="279" x2="510" y2="279" stroke="#333" stroke-width="2"/>
<rect x="730" y="255" width="190" height="48" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="825.0" y="275.6666666666667" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">MC03 PLC</text>
<text x="825.0" y="289.6666666666667" font-size="11" text-anchor="middle" fill="#111111">fms1-mc03-plc-machine</text>
<line x1="700" y1="279" x2="730" y2="279" stroke="#333" stroke-width="2"/>
<rect x="950" y="255" width="190" height="48" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="1045.0" y="275.6666666666667" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">POOL01 PLC</text>
<text x="1045.0" y="289.6666666666667" font-size="11" text-anchor="middle" fill="#111111">fms1-pool01-plc-stacker</text>
<line x1="920" y1="279" x2="950" y2="279" stroke="#333" stroke-width="2"/>
<path d="M 1140 279 L 1170 279 L 1170 335 L 40 335 L 40 279 L 70 279" stroke="#333" stroke-width="2" fill="none"/>
<text x="52" y="330" font-size="11" text-anchor="start" fill="#1f6fb2">ring port blocked by the MRM in normal state</text>
<text x="30" y="360" font-size="12" text-anchor="start" fill="#555555">The MRM sends test frames around the ring; when they do not come back it opens the blocked port -&gt; traffic flows the other way round.</text>
<text x="30" y="405" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">3  Star (central switch) - typical between the modules of a cell (cell VLAN, Modbus TCP / OPC UA / PN controller-controller)</text>
<rect x="480" y="425" width="220" height="44" rx="4" fill="#dbe9f6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="590.0" y="443.6666666666667" font-size="11" text-anchor="middle" fill="#111111" font-weight="bold">Managed cell switch</text>
<text x="590.0" y="457.6666666666667" font-size="11" text-anchor="middle" fill="#111111">IGMP snooping, storm control</text>
<rect x="60" y="500" width="110" height="36" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="115.0" y="522.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">CC01</text>
<line x1="590" y1="469" x2="115" y2="500" stroke="#555555" stroke-width="1.2"/>
<rect x="220" y="500" width="110" height="36" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="275.0" y="522.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">MC01</text>
<line x1="590" y1="469" x2="275" y2="500" stroke="#555555" stroke-width="1.2"/>
<rect x="380" y="500" width="110" height="36" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="435.0" y="522.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">MC02</text>
<line x1="590" y1="469" x2="435" y2="500" stroke="#555555" stroke-width="1.2"/>
<rect x="540" y="500" width="110" height="36" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="595.0" y="522.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">MC03</text>
<line x1="590" y1="469" x2="595" y2="500" stroke="#555555" stroke-width="1.2"/>
<rect x="700" y="500" width="110" height="36" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="755.0" y="522.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">POOL01</text>
<line x1="590" y1="469" x2="755" y2="500" stroke="#555555" stroke-width="1.2"/>
<rect x="860" y="500" width="110" height="36" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="915.0" y="522.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">LS01</text>
<line x1="590" y1="469" x2="915" y2="500" stroke="#555555" stroke-width="1.2"/>
<rect x="1020" y="500" width="110" height="36" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1075.0" y="522.0" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">SAFE01</text>
<line x1="590" y1="469" x2="1075" y2="500" stroke="#555555" stroke-width="1.2"/>
</svg>