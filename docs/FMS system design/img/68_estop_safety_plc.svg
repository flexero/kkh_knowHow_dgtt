<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">ESTOP (2 NC, test pulses) → safety PLC (M18) → zone outputs: STO, safety contactors, couplings</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Every e-stop has its own two F-DI (location known, no series masking). Discrepancy monitoring, manual reset (blue button, falling edge).</text>
