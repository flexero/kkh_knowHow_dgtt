<text x="825" y="314" font-size="11" text-anchor="middle" fill="#111">drives SS1 → STO (POOL01, LS01)</text>
<line x1="540" y1="316" x2="700" y2="360" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="700,360 691.078,361.181 692.936,354.423" fill="#c0392b"/>
