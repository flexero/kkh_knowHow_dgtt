<text x="825" y="374" font-size="11" text-anchor="middle" fill="#111">safety contactor pairs (EDM)</text>
<line x1="540" y1="322" x2="700" y2="420" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="700,420 691.1,418.659 694.762,412.682" fill="#c0392b"/>
<rect x="700" y="400" width="250" height="44" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="825" y="418" font-size="11" text-anchor="middle" font-weight="bold" fill="#c0392b">FDO EstopOut</text>
<text x="825" y="434" font-size="11" text-anchor="middle" fill="#111">coupling to MC01–MC03 (machine e-stop)</text>
<line x1="540" y1="328" x2="700" y2="480" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="700,480 691.576,476.832 696.404,471.75" fill="#c0392b"/>
<rect x="700" y="460" width="250" height="44" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="825" y="478" font-size="11" text-anchor="middle" font-weight="bold" fill="#c0392b">zone F-DO</text>
<text x="825" y="494" font-size="11" text-anchor="middle" fill="#111">valve / contactor supplies of a zone</text>
<rect x="990" y="290" width="170" height="60" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1075" y="308" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">Reset -SF (blue)</text>
<text x="1075" y="324" font-size="11" text-anchor="middle" fill="#111">SAFE01.Reset.Pb</text>
<text x="1075" y="340" font-size="11" text-anchor="middle" fill="#111">outside the zone</text>
<rect x="60" y="420" width="1100" height="120" rx="0" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
<text x="75" y="442" font-size="11" text-anchor="start" fill="#111">FAT: press → both channels 0, zone outputs off, PackML Aborted · release without reset → stays off · reset → restart allowed (no automatic restart)</text>
<text x="75" y="460" font-size="11" text-anchor="start" fill="#111">open one core only → discrepancy fault · short T1 to T2 channel → cross-circuit detected by the test pulses</text>
<text x="75" y="482" font-size="11" text-anchor="start" fill="#111">PL: input Cat 3, DC 99 %, MTTFd from B10d (guide 67 SF3: PLr d → PL d); combination with logic (PL e) and output subsystem (guide 67 G8).</text>
<text x="75" y="504" font-size="11" text-anchor="start" fill="#c0392b">Stop category 1: drives decelerate under control, then STO; clamps are NOT de-energised (holding function, guide 67 I7.4).</text>
<text x="24" y="606" font-size="11" text-anchor="start" fill="#666">Teaching example – not for construction. Real circuits: qualified engineers, IEC 60204-1, ISO 13849, maker data.</text>
</svg>
