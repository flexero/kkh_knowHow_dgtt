<text x="620" y="110" font-size="11" text-anchor="start" fill="#666">Designations count per module: in LS01 the Release push-button</text>
<text x="620" y="126" font-size="11" text-anchor="start" fill="#666">is -SF1, so the e-stop is -SF2 (B0.3).</text>
<rect x="60" y="290" width="480" height="70" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="300" y="308" font-size="11" text-anchor="middle" font-weight="bold" fill="#c0392b">Safety PLC CPU  =FMS1.SAFE01-KF1  (PROFIsafe over PROFINET)</text>
<text x="300" y="324" font-size="11" text-anchor="middle" fill="#111">safety program: e-stop = Ok AND Ok2 (discrepancy) · zone matrix · reset</text>
<text x="300" y="340" font-size="11" text-anchor="middle" fill="#111">F-monitoring time in the reaction time</text>
<line x1="540" y1="310" x2="700" y2="300" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="700,300 691.945,304.015 691.508,297.019" fill="#c0392b"/>
