<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>ISA-18.2 / IEC 62682 alarm state machine (as implemented by the alarm rule)</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">ISA-18.2 / IEC 62682 alarm state machine (as implemented by the alarm rule)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">NORM -&gt; UNACK on 'act' (annunciation: horn + flashing). Acknowledge and return to normal in any order. Shelving and out-of-service suppress the alarm under control.</text>
<rect x="65" y="192" width="190" height="56" rx="12" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<text x="160" y="216" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">NORM</text>
<text x="160" y="234" font-size="11" text-anchor="middle" fill="#111">normal</text>
<rect x="425" y="112" width="190" height="56" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="520" y="136" font-size="14" text-anchor="middle" font-weight="bold" fill="#c0392b">UNACK</text>
<text x="520" y="154" font-size="11" text-anchor="middle" fill="#111">active, unacknowledged</text>
<rect x="785" y="192" width="190" height="56" rx="12" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<text x="880" y="216" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ACKED</text>
<text x="880" y="234" font-size="11" text-anchor="middle" fill="#111">active, acknowledged</text>
<rect x="425" y="302" width="190" height="56" rx="12" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<text x="520" y="326" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">RTNUN</text>
<text x="520" y="344" font-size="11" text-anchor="middle" fill="#111">returned, unacknowledged</text>
<rect x="205" y="452" width="190" height="56" rx="12" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="6,4"/>
<text x="300" y="476" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">SHLVD</text>
<text x="300" y="494" font-size="11" text-anchor="middle" fill="#111">shelved</text>
<rect x="665" y="452" width="190" height="56" rx="12" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="6,4"/>
<text x="760" y="476" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">OOS</text>
<text x="760" y="494" font-size="11" text-anchor="middle" fill="#111">out of service</text>
<polyline points="255,205 425,150" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="425,150 415.27,149.17 417.60,156.37" fill="#c0392b"/>
<text x="330" y="165" font-size="12" text-anchor="middle" fill="#c0392b">act (ANN)</text>
<polyline points="615,150 790,205" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="790,205 782.55,198.70 780.28,205.91" fill="#111"/>
<text x="720" y="165" font-size="12" text-anchor="middle" fill="#111">ack</text>
<polyline points="785,235 255,235" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="255,235 264.00,238.78 264.00,231.22" fill="#111"/>
<text x="520" y="228" font-size="12" text-anchor="middle" fill="#111">clr</text>
<polyline points="500,168 500,302" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="500,302 503.78,293.00 496.22,293.00" fill="#111"/>
<text x="490" y="245" font-size="12" text-anchor="end" fill="#111">clr</text>
<polyline points="545,302 545,168" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="545,168 541.22,177.00 548.78,177.00" fill="#c0392b"/>
<text x="555" y="270" font-size="12" text-anchor="start" fill="#c0392b">act (ANN)</text>
<polyline points="425,345 200,250" fill="none" stroke="#111" stroke-width="1.5"/>
<polygon points="200,250 206.82,256.98 209.76,250.02" fill="#111"/>
<text x="300" y="315" font-size="12" text-anchor="middle" fill="#111">ack</text>
<polyline points="160,248 240,452" fill="none" stroke="#666" stroke-width="1.5"/>
<polygon points="240,452 240.23,442.24 233.20,445.00" fill="#666"/>
<text x="140" y="360" font-size="11" text-anchor="middle" fill="#666">shelve (shelvable only)</text>
<polyline points="395,480 520,480 520,358" fill="none" stroke="#666" stroke-width="1.5"/>
<polygon points="520,358 516.22,367.00 523.78,367.00" fill="#666"/>
<text x="400" y="500" font-size="11" text-anchor="start" fill="#666">unshelve -&gt; UNACK if active, else NORM</text>
<polyline points="1000,230 1100,230 1100,480 855,480" fill="none" stroke="#666" stroke-width="1.5"/>
<polygon points="855,480 864.00,483.78 864.00,476.22" fill="#666"/>
<text x="1090" y="380" font-size="11" text-anchor="end" fill="#666">oos from any state</text>
<polyline points="700,452 560,168" fill="none" stroke="#666" stroke-width="1.5"/>
<polygon points="560,168 560.59,177.74 567.37,174.40" fill="#666"/>
<text x="640" y="410" font-size="11" text-anchor="start" fill="#666">ios -&gt; UNACK if active, else NORM</text>
<text x="40" y="530" font-size="11" text-anchor="start" fill="#111">Example log: A2 (POOL01.Travel.Fault, priority 1) is NOT shelvable -&gt; 'shelve' at 310 s: no effect. A4 (WASH01.LevelHigh) chatters: act at 200, 212, 224 s (3 acts within 60 s).</text>
<text x="40" y="548" font-size="11" text-anchor="start" fill="#111">First-out per group: first alarm into UNACK while the group is armed; group re-arms when all its alarms are NORM. Standing at the end: A3, A5 (ACKED).</text>
<text x="24" y="586" font-size="11" text-anchor="start" fill="#666">Teaching example - not for construction. Real PLC code: written, reviewed and validated by qualified people (IEC 61131-3, IEC 62061 / ISO 13849).</text>
</svg>
