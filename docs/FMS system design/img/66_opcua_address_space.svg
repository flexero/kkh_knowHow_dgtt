<text x="820" y="105" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">NodeId = namespace + identifier</text>
<text x="820" y="128" font-size="12" text-anchor="start" fill="#111111">ns=2;s=MC02.Status.StateCurrent  (string)</text>
<text x="820" y="148" font-size="12" text-anchor="start" fill="#111111">ns=0;i=2258  (numeric: Server CurrentTime)</text>
<text x="820" y="168" font-size="12" text-anchor="start" fill="#111111">g=... (GUID) - b=... (opaque)</text>
<text x="820" y="188" font-size="12" text-anchor="start" fill="#111111">Browse path: Objects/MC02/Status/StateCurrent</text>
<rect x="820" y="225" width="360" height="205" rx="4" fill="#fff" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="835" y="248" font-size="13" text-anchor="start" fill="#1f6fb2" font-weight="bold">Subscription of the cell controller CC01</text>
<text x="835" y="273" font-size="12" text-anchor="start" fill="#111111">MonitoredItem StateCurrent: sampling 250 ms</text>
<text x="835" y="294" font-size="12" text-anchor="start" fill="#111111">  deadband none, queue size 1, discard oldest</text>
<text x="835" y="315" font-size="12" text-anchor="start" fill="#111111">MonitoredItem Heartbeat: sampling 1000 ms</text>
<text x="835" y="336" font-size="12" text-anchor="start" fill="#111111">Publishing interval 500 ms</text>
<text x="835" y="357" font-size="12" text-anchor="start" fill="#111111">Max keep-alive count 10 -&gt; keep-alive after 5 s</text>
<text x="835" y="378" font-size="12" text-anchor="start" fill="#111111">Lifetime count 30 -&gt; 15 s without client = deleted</text>
<text x="835" y="399" font-size="12" text-anchor="start" fill="#111111">Notification = only changed values</text>
<text x="820" y="462" font-size="12" text-anchor="start" fill="#111111">Node classes: Object, Variable, Method, ObjectType,</text>
<text x="820" y="482" font-size="12" text-anchor="start" fill="#111111">VariableType, ReferenceType, DataType, View</text>
<text x="820" y="502" font-size="12" text-anchor="start" fill="#111111">References: Organizes, HasComponent, HasProperty,</text>
<text x="820" y="522" font-size="12" text-anchor="start" fill="#111111">HasTypeDefinition, HasSubtype ...</text>
