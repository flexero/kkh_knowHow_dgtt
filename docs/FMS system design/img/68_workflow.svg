<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>From library to project: the ten engineering steps (Part E)</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">From library to project: the ten engineering steps (Part E)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">One data source (library JSON + project parameters) → generated lists → drawings → cabinet → FAT → site → SAT; changes go back to the source.</text>
<rect x="50" y="110" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="145" y="128" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">1 Choose modules</text>
<text x="145" y="144" font-size="12" text-anchor="middle" fill="#111">kit list (layout)</text>
<line x1="240" y1="140" x2="275" y2="140" stroke="#111" stroke-width="1.5"/>
<polygon points="275,140 266.71,143.505 266.71,136.495" fill="#111"/>
<rect x="275" y="110" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="370" y="128" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">2 Instantiate</text>
<text x="370" y="144" font-size="12" text-anchor="middle" fill="#111">parameters kW, len</text>
<line x1="465" y1="140" x2="500" y2="140" stroke="#111" stroke-width="1.5"/>
<polygon points="500,140 491.71,143.505 491.71,136.495" fill="#111"/>
<rect x="500" y="110" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="595" y="128" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">3 Generate</text>
<text x="595" y="144" font-size="12" text-anchor="middle" fill="#111">IO, terminals, cables, BOM</text>
<line x1="690" y1="140" x2="725" y2="140" stroke="#111" stroke-width="1.5"/>
<polygon points="725,140 716.71,143.505 716.71,136.495" fill="#111"/>
<rect x="725" y="110" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="820" y="128" font-size="12" text-anchor="middle" font-weight="bold" fill="#c0392b">4 Check rules</text>
<text x="820" y="144" font-size="12" text-anchor="middle" fill="#111">library_check.py</text>
<line x1="915" y1="140" x2="950" y2="140" stroke="#111" stroke-width="1.5"/>
<polygon points="950,140 941.71,143.505 941.71,136.495" fill="#111"/>
<rect x="950" y="110" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1045" y="128" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">5 Draw sheets</text>
<text x="1045" y="144" font-size="12" text-anchor="middle" fill="#111">ECAD / SVG</text>
<line x1="1045" y1="170" x2="1045" y2="310" stroke="#111" stroke-width="1.5"/>
<polygon points="1045,310 1041.5,301.71 1048.5,301.71" fill="#111"/>
<rect x="950" y="310" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1045" y="328" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">6 Cabinet + heat</text>
<text x="1045" y="344" font-size="12" text-anchor="middle" fill="#111">layout, IEC TR 60890</text>
<line x1="950" y1="340" x2="915" y2="340" stroke="#111" stroke-width="1.5"/>
<polygon points="915,340 923.29,336.495 923.29,343.505" fill="#111"/>
<rect x="725" y="310" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="820" y="328" font-size="12" text-anchor="middle" font-weight="bold" fill="#c0392b">7 Design review</text>
<text x="820" y="344" font-size="12" text-anchor="middle" fill="#111">signed record</text>
<line x1="725" y1="340" x2="690" y2="340" stroke="#111" stroke-width="1.5"/>
<polygon points="690,340 698.29,336.495 698.29,343.505" fill="#111"/>
<rect x="500" y="310" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="595" y="328" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">8 Manufacture</text>
<text x="595" y="344" font-size="12" text-anchor="middle" fill="#111">IEC 61439 routine test</text>
<line x1="500" y1="340" x2="465" y2="340" stroke="#111" stroke-width="1.5"/>
<polygon points="465,340 473.29,336.495 473.29,343.505" fill="#111"/>
<rect x="275" y="310" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="370" y="328" font-size="12" text-anchor="middle" font-weight="bold" fill="#c0392b">9 Cabinet FAT</text>
<text x="370" y="344" font-size="12" text-anchor="middle" fill="#111">P2P, IO per tag, safety</text>
<line x1="275" y1="340" x2="240" y2="340" stroke="#111" stroke-width="1.5"/>
<polygon points="240,340 248.29,336.495 248.29,343.505" fill="#111"/>
<rect x="50" y="310" width="190" height="60" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="145" y="328" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">10 Site + SAT</text>
<text x="145" y="344" font-size="12" text-anchor="middle" fill="#111">loop check, validation, as-built</text>
<rect x="420" y="420" width="360" height="70" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="600" y="438" font-size="11" text-anchor="middle" font-weight="bold" fill="#111">Library JSON + project definitions</text>
<text x="600" y="454" font-size="11" text-anchor="middle" fill="#111">(version control: every revision regenerates</text>
<text x="600" y="470" font-size="11" text-anchor="middle" fill="#111">identical lists for electrical, PLC, FAT)</text>
<line x1="600" y1="420" x2="600" y2="375" stroke="#666" stroke-width="1.5"/>
<polygon points="600,375 603.505,383.29 596.495,383.29" fill="#666"/>
<line x1="600" y1="420" x2="600" y2="175" stroke="#666" stroke-width="1.5"/>
<polygon points="600,175 603.505,183.29 596.495,183.29" fill="#666"/>
<text x="800" y="455" font-size="11" text-anchor="start" fill="#c0392b">change request → update source → regenerate</text>
<text x="800" y="472" font-size="11" text-anchor="start" fill="#c0392b">→ mark revised sheets (E10)</text>
<text x="50" y="530" font-size="11" text-anchor="start" fill="#111">Red boxes = gates where the owner checks: rules check, design review, cabinet FAT. Item 10 (PLC) uses the same tags and IO list from step 3.</text>
<text x="24" y="586" font-size="11" text-anchor="start" fill="#666">Teaching example – not for construction. Real circuits: qualified engineers, IEC 60204-1, ISO 13849, maker data.</text>
</svg>
