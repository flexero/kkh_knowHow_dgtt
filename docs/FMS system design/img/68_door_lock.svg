<circle cx="390" cy="120" r="4" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="400" y="114" font-size="11" text-anchor="start" fill="#111">-XD2:12</text>
<line x1="394" y1="120" x2="520" y2="120" stroke="#c0392b" stroke-width="1.5"/>
<rect x="520" y="106" width="150" height="28" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="595" y="124" font-size="11" text-anchor="middle" fill="#c0392b">FDI1.01  Closed</text>
<line x1="340" y1="250" x2="380" y2="152" stroke="#666" stroke-width="1"/>
<circle cx="390" cy="152" r="4" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
