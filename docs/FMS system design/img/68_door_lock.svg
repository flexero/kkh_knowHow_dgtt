<line x1="394" y1="216" x2="520" y2="216" stroke="#c0392b" stroke-width="1.5"/>
<rect x="520" y="202" width="150" height="28" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
