<rect x="520" y="170" width="150" height="28" rx="0" fill="#f2f2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="595" y="188" font-size="11" text-anchor="middle" fill="#c0392b">FDI1.03  Locked</text>
<line x1="340" y1="250" x2="380" y2="216" stroke="#666" stroke-width="1"/>
<circle cx="390" cy="216" r="4" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
