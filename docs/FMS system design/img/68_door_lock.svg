<text x="595" y="316" font-size="11" text-anchor="middle" fill="#111">supply  +24 V</text>
<line x1="340" y1="250" x2="380" y2="344" stroke="#666" stroke-width="1"/>
<circle cx="390" cy="344" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="400" y="338" font-size="11" text-anchor="start" fill="#111">-XD2:19</text>
