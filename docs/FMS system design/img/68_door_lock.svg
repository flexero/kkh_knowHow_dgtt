<rect x="520" y="330" width="150" height="28" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="595" y="348" font-size="11" text-anchor="middle" fill="#111">supply  0 V</text>
<text x="860" y="100" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Unlock sequence (PackML + safety program)</text>
<rect x="720" y="120" width="290" height="30" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="732" y="140" font-size="11" text-anchor="start" fill="#111">1  operator presses Request (DI1.06)</text>
<line x1="865" y1="150" x2="865" y2="160" stroke="#666" stroke-width="1"/>
<polygon points="865,160 861.495,151.71 868.505,151.71" fill="#666"/>
<rect x="720" y="160" width="290" height="30" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="732" y="180" font-size="11" text-anchor="start" fill="#111">2  module: Holding → Held (safe point)</text>
<line x1="865" y1="190" x2="865" y2="200" stroke="#666" stroke-width="1"/>
<polygon points="865,200 861.495,191.71 868.505,191.71" fill="#666"/>
<rect x="720" y="200" width="290" height="30" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="732" y="220" font-size="11" text-anchor="start" fill="#111">3  safety: drives STO, standstill</text>
<line x1="865" y1="230" x2="865" y2="240" stroke="#666" stroke-width="1"/>
<polygon points="865,240 861.495,231.71 868.505,231.71" fill="#666"/>
<rect x="720" y="240" width="290" height="30" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="732" y="260" font-size="11" text-anchor="start" fill="#111">4  FDO2.00 LockCmd → lock released</text>
<line x1="865" y1="270" x2="865" y2="280" stroke="#666" stroke-width="1"/>
<polygon points="865,280 861.495,271.71 868.505,271.71" fill="#666"/>
<rect x="720" y="280" width="290" height="30" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="732" y="300" font-size="11" text-anchor="start" fill="#111">5  Locked = 0 → door may open</text>
<line x1="865" y1="310" x2="865" y2="320" stroke="#666" stroke-width="1"/>
<polygon points="865,320 861.495,311.71 868.505,311.71" fill="#666"/>
<rect x="720" y="320" width="290" height="30" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="732" y="340" font-size="11" text-anchor="start" fill="#111">6  Closed = 0 → zone stays safe</text>
<line x1="865" y1="350" x2="865" y2="360" stroke="#666" stroke-width="1"/>
<polygon points="865,360 861.495,351.71 868.505,351.71" fill="#666"/>
<rect x="720" y="360" width="290" height="30" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="732" y="380" font-size="11" text-anchor="start" fill="#111">7  close + lock + reset at the zone</text>
<line x1="865" y1="390" x2="865" y2="400" stroke="#666" stroke-width="1"/>
<polygon points="865,400 861.495,391.71 868.505,391.71" fill="#666"/>
<rect x="720" y="400" width="290" height="30" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="732" y="420" font-size="11" text-anchor="start" fill="#111">8  Unholding → Execute</text>
<rect x="60" y="450" width="1100" height="100" rx="0" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
<text x="75" y="472" font-size="11" text-anchor="start" fill="#111">Guard locking because the crane run-down time is longer than the access time (guide 67 H5). Power-to-unlock is the normal choice (ISO 14119 5.7).</text>
<text x="75" y="490" font-size="11" text-anchor="start" fill="#111">Escape release inside the aisle; coding type 4 high (a spare actuator must not work); one switch per door with its own F-DI pair.</text>
<text x="75" y="508" font-size="11" text-anchor="start" fill="#111">FAT: request in Execute → Held → unlock only after standstill · door cannot open while locked · open one channel → discrepancy.</text>
<text x="75" y="526" font-size="11" text-anchor="start" fill="#c0392b">PL: input Cat 3 (guard-locking switch + monitoring), MTTFd 100 y, DCavg 97.5 % → d (guide 67 G9.1 SF1).</text>
<text x="24" y="606" font-size="11" text-anchor="start" fill="#666">Teaching example – not for construction. Real circuits: qualified engineers, IEC 60204-1, ISO 13849, maker data.</text>
</svg>
