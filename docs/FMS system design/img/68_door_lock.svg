<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Arial, Helvetica, sans-serif">
<title>DOOR_LOCK: guard door with guard locking, coded switch, access request (module M03, SF1)</title>
<rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">DOOR_LOCK: guard door with guard locking, coded switch, access request (module M03, SF1)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Door closed (2 ch) + locked (2 ch) → F-DI; lock solenoid ← F-DO; request button → DI. Unlock only after standstill of the zone drives.</text>
<rect x="60" y="90" width="200" height="300" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="160" y="112" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">pool door</text>
<rect x="200" y="220" width="50" height="60" rx="0" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="225" y="300" font-size="11" text-anchor="middle" fill="#c0392b">-BG1</text>
<text x="225" y="315" font-size="11" text-anchor="middle" fill="#111">guard locking</text>
<rect x="90" y="240" width="40" height="30" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="110" y="290" font-size="11" text-anchor="middle" fill="#111">actuator</text>
<circle cx="120" cy="160" r="14" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="140" y="165" font-size="11" text-anchor="start" fill="#111">-SF1 request (lamp)</text>
