<text x="40" y="700" font-size="11" text-anchor="start" fill="#111">Rule: terminals = 31 io + 11 tx = 42 (B0.6). Red = safety signals (F-DI / F-DO). Core numbers are an example assignment; the device data sheet fixes the M12 pins.</text>
<text x="24" y="746" font-size="11" text-anchor="start" fill="#666">Teaching example – not for construction. Real circuits: qualified engineers, IEC 60204-1, ISO 13849, maker data.</text>
