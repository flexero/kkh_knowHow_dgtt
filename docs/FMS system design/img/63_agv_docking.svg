<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 620" width="1250" height="620" font-family="Arial, Helvetica, sans-serif">
<title>AGV docking at a roller conveyor station: funnel guides, end stop, sensors and handshake</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1250" height="620" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">AGV docking at a station – mechanical catching + handshake (example: roller-deck AGV, capture ± 12 mm)</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#444">Top view, not to scale. The AGV stops within ± 8 mm (navigation); the funnel catches the load, side guides and the end stop centre it, sensors confirm the position.</text>
<rect x="560.0" y="120.0" width="300.0" height="240.0" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
<text x="710.0" y="140.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">Station conveyor (AGVST01)</text>
<line x1="580.0" y1="160.0" x2="580.0" y2="320.0" stroke="#94a3b8" stroke-width="3"/>
<line x1="616.0" y1="160.0" x2="616.0" y2="320.0" stroke="#94a3b8" stroke-width="3"/>
<line x1="652.0" y1="160.0" x2="652.0" y2="320.0" stroke="#94a3b8" stroke-width="3"/>
<line x1="688.0" y1="160.0" x2="688.0" y2="320.0" stroke="#94a3b8" stroke-width="3"/>
<line x1="724.0" y1="160.0" x2="724.0" y2="320.0" stroke="#94a3b8" stroke-width="3"/>
<line x1="760.0" y1="160.0" x2="760.0" y2="320.0" stroke="#94a3b8" stroke-width="3"/>
<line x1="796.0" y1="160.0" x2="796.0" y2="320.0" stroke="#94a3b8" stroke-width="3"/>
<line x1="832.0" y1="160.0" x2="832.0" y2="320.0" stroke="#94a3b8" stroke-width="3"/>
<rect x="860.0" y="150.0" width="14.0" height="180.0" rx="0" fill="#c62828" stroke="#c62828" stroke-width="1" fill-opacity="0.7"/>
<text x="896.0" y="240.0" font-size="11" text-anchor="middle" fill="#111" transform="rotate(-90 896 240)">end stop</text>
<path d="M560,150 L520,118 M560,330 L520,362" fill="none" stroke="#059669" stroke-width="5"/>
<text x="452.0" y="110.0" font-size="11" text-anchor="start" fill="#059669">funnel / lead-in</text>
<line x1="560.0" y1="150.0" x2="860.0" y2="150.0" stroke="#059669" stroke-width="4"/>
<line x1="560.0" y1="330.0" x2="860.0" y2="330.0" stroke="#059669" stroke-width="4"/>
<text x="710.0" y="350.0" font-size="11" text-anchor="middle" fill="#059669">side guides (± 1 mm after the funnel)</text>
<rect x="160.0" y="140.0" width="340.0" height="200.0" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="330.0" y="165.0" font-size="13" text-anchor="middle" fill="#065f46" font-weight="bold">AGV with roller deck (M06)</text>
<line x1="190.0" y1="180.0" x2="190.0" y2="325.0" stroke="#6ee7b7" stroke-width="3"/>
<line x1="234.0" y1="180.0" x2="234.0" y2="325.0" stroke="#6ee7b7" stroke-width="3"/>
<line x1="278.0" y1="180.0" x2="278.0" y2="325.0" stroke="#6ee7b7" stroke-width="3"/>
<line x1="322.0" y1="180.0" x2="322.0" y2="325.0" stroke="#6ee7b7" stroke-width="3"/>
<line x1="366.0" y1="180.0" x2="366.0" y2="325.0" stroke="#6ee7b7" stroke-width="3"/>
<line x1="410.0" y1="180.0" x2="410.0" y2="325.0" stroke="#6ee7b7" stroke-width="3"/>
<line x1="454.0" y1="180.0" x2="454.0" y2="325.0" stroke="#6ee7b7" stroke-width="3"/>
<rect x="300.0" y="200.0" width="180.0" height="110.0" rx="0" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
<text x="390.0" y="260.0" font-size="12" text-anchor="middle" fill="#111">load / pallet</text>
<line x1="480.0" y1="255.0" x2="555.0" y2="255.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="492.0" y="246.0" font-size="11" text-anchor="start" fill="#111">transfer</text>
<line x1="330.0" y1="372.0" x2="330.0" y2="345.0" stroke="#c62828" stroke-width="1" marker-end="url(#ahr)"/>
<line x1="330.0" y1="372.0" x2="330.0" y2="399.0" stroke="#c62828" stroke-width="1" marker-end="url(#ahr)"/>
<text x="342.0" y="390.0" font-size="11" text-anchor="start" fill="#c62828">stop error ± 8 mm</text>
<circle cx="600.0" cy="376.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="610.0" y="380.0" font-size="11" text-anchor="start" fill="#111">B1 load at entry</text>
<circle cx="780.0" cy="376.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="790.0" y="380.0" font-size="11" text-anchor="start" fill="#111">B2 load in position</text>
<circle cx="560.0" cy="404.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="570.0" y="408.0" font-size="11" text-anchor="start" fill="#111">B3 AGV present (reflector / inductive)</text>
<rect x="40.0" y="430.0" width="1170.0" height="170.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="56.0" y="452.0" font-size="13" text-anchor="start" fill="#111" font-weight="bold">Handshake (module part of the M06 data block, words 20 / 21 – guide 66 §8; optical / IR link or Wi-Fi via the fleet manager):</text>
<text x="56.0" y="478.0" font-size="12" text-anchor="start" fill="#111">1  AGV arrives: AGVPresent = 1 (word 21 bit 0); station checks free space: ReadyToTake = 1 (word 20 bit 1)</text>
<text x="56.0" y="502.0" font-size="12" text-anchor="start" fill="#111">2  AGV: AGVReadyToTransfer = 1 (word 21 bit 1) → both start rollers, TransferActive = 1 (word 20 bit 2), same conveyor speed (e.g. 0.3 m/s)</text>
<text x="56.0" y="526.0" font-size="12" text-anchor="start" fill="#111">3  B2 load in position → station stops rollers, TransferDone = 1 (word 20 bit 3) → AGV stops rollers, drops its bits and leaves</text>
<text x="56.0" y="550.0" font-size="12" text-anchor="start" fill="#111">4  Timeout 20 s without B2 → both stop, alarm 06xx "transfer not complete"; retry only after acknowledge by the operator</text>
<text x="56.0" y="574.0" font-size="12" text-anchor="start" fill="#111">Safety: AGV personnel detection fields stay active (ISO 3691-4); station roller drive in safe torque off while no AGV is docked.</text>
</svg>