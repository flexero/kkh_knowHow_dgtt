<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>Device function block standard: one interface for every device type</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">Device function block standard: one interface for every device type</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">Prefixes: x BOOL input from the field, i INT raw analog input, q BOOL output to the field, w INT analog output. Cmd / Sts / Alm / Cfg structures for program and HMI.</text>
<rect x="420" y="110" width="360" height="380" rx="0" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="600" y="134" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">FB_Valve2  (instance APC01.Rotate)</text>
<line x1="420" y1="146" x2="780" y2="146" stroke="#666" stroke-width="1"/>
<text x="430" y="176" font-size="12" text-anchor="start" fill="#111">xPosA : BOOL   (field, DI1.00)</text>
<line x1="250" y1="172" x2="420" y2="172" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="420,172 411.00,168.22 411.00,175.78" fill="#1f5fa8"/>
<text x="430" y="210" font-size="12" text-anchor="start" fill="#111">xPosB : BOOL   (field, DI1.01)</text>
<line x1="250" y1="206" x2="420" y2="206" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="420,206 411.00,202.22 411.00,209.78" fill="#1f5fa8"/>
<text x="430" y="244" font-size="12" text-anchor="start" fill="#111">Cmd : ST_ValveCmd (program)</text>
<line x1="250" y1="240" x2="420" y2="240" stroke="#111" stroke-width="1.5"/>
<polygon points="420,240 411.00,236.22 411.00,243.78" fill="#111"/>
<text x="430" y="278" font-size="12" text-anchor="start" fill="#111">  .xToA .xToB .xManual .xReset</text>
<text x="430" y="312" font-size="12" text-anchor="start" fill="#111">Cfg : ST_ValveCfg</text>
<line x1="250" y1="308" x2="420" y2="308" stroke="#111" stroke-width="1.5"/>
<polygon points="420,308 411.00,304.22 411.00,311.78" fill="#111"/>
<text x="430" y="346" font-size="12" text-anchor="start" fill="#111">  .tMove T#5S .xHoldOnStop</text>
<text x="770" y="176" font-size="12" text-anchor="end" fill="#111">qSolA : BOOL  (field, DO1.00)</text>
<line x1="780" y1="172" x2="950" y2="172" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="950,172 941.00,168.22 941.00,175.78" fill="#1f5fa8"/>
<text x="770" y="210" font-size="12" text-anchor="end" fill="#111">qSolB : BOOL  (field, DO1.01)</text>
<line x1="780" y1="206" x2="950" y2="206" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="950,206 941.00,202.22 941.00,209.78" fill="#1f5fa8"/>
<text x="770" y="244" font-size="12" text-anchor="end" fill="#111">Sts : ST_ValveSts</text>
<line x1="780" y1="240" x2="950" y2="240" stroke="#111" stroke-width="1.5"/>
<polygon points="950,240 941.00,236.22 941.00,243.78" fill="#111"/>
<text x="770" y="278" font-size="12" text-anchor="end" fill="#111">  .xAtA .xAtB .xMoving .xFault</text>
<text x="770" y="312" font-size="12" text-anchor="end" fill="#111">Alm : ST_DevAlarm</text>
<line x1="780" y1="308" x2="950" y2="308" stroke="#111" stroke-width="1.5"/>
<polygon points="950,308 941.00,304.22 941.00,311.78" fill="#111"/>
<text x="770" y="346" font-size="12" text-anchor="end" fill="#111">  .iNo .xActive .xUnack</text>
<text x="430" y="400" font-size="11" text-anchor="start" fill="#666">inside: mode logic (auto / manual), end-position</text>
<text x="430" y="416" font-size="11" text-anchor="start" fill="#666">monitoring, move timeout, both-ends fault, alarm</text>
<text x="430" y="432" font-size="11" text-anchor="start" fill="#666">numbers; no knowledge of the module sequence</text>
<text x="430" y="466" font-size="11" text-anchor="start" fill="#c0392b">one writer per output: only this FB writes qSolA/qSolB</text>
<rect x="40" y="130" width="200" height="60" rx="0" fill="#e8eef8" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="140" y="156.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Field (item 8 IO list)</text>
<text x="140" y="171.7" font-size="12" text-anchor="middle" fill="#111">%IX0.0 / %IX0.1</text>
<rect x="40" y="230" width="200" height="80" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="140" y="259.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Module sequence</text>
<text x="140" y="274.2" font-size="12" text-anchor="middle" fill="#111">FB_APC01 step S20:</text>
<text x="140" y="289.2" font-size="12" text-anchor="middle" fill="#111">Rotate.Cmd.xToB := TRUE</text>
<rect x="960" y="130" width="200" height="60" rx="0" fill="#e8eef8" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="1060" y="156.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Field (item 8 IO list)</text>
<text x="1060" y="171.7" font-size="12" text-anchor="middle" fill="#111">%QX0.0 / %QX0.1</text>
<rect x="960" y="230" width="200" height="80" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1060" y="259.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Module logic</text>
<text x="1060" y="274.2" font-size="12" text-anchor="middle" fill="#111">transition S20 -&gt; S30:</text>
<text x="1060" y="289.2" font-size="12" text-anchor="middle" fill="#111">Rotate.Sts.xAtB</text>
<rect x="960" y="350" width="200" height="80" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="1060" y="379.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Alarm handler</text>
<text x="1060" y="394.2" font-size="12" text-anchor="middle" fill="#111">Alm.iNo -&gt; Admin.AlarmNo</text>
<text x="1060" y="409.2" font-size="12" text-anchor="middle" fill="#111">ISA-18.2 states</text>
<rect x="40" y="360" width="330" height="170" rx="0" fill="#fafafa" stroke="#111" stroke-width="1.5"/>
<text x="55" y="382" font-size="12" text-anchor="start" font-weight="bold" fill="#111">HMI faceplate (same for every FB_Valve2)</text>
<rect x="55" y="395" width="90" height="26" rx="0" fill="#e8f5e9" stroke="#111" stroke-width="1"/>
<text x="100" y="412" font-size="11" text-anchor="middle" fill="#111">at A</text>
<rect x="155" y="395" width="90" height="26" rx="0" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="200" y="412" font-size="11" text-anchor="middle" fill="#111">at B</text>
<rect x="255" y="395" width="100" height="26" rx="0" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="305" y="412" font-size="11" text-anchor="middle" fill="#111">moving</text>
<rect x="55" y="430" width="140" height="26" rx="0" fill="#f2f2f2" stroke="#111" stroke-width="1"/>
<text x="125" y="447" font-size="11" text-anchor="middle" fill="#111">Manual: to A | to B</text>
<rect x="205" y="430" width="150" height="26" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="280" y="447" font-size="11" text-anchor="middle" fill="#c0392b">Alarm 12 rotate timeout</text>
<text x="55" y="480" font-size="11" text-anchor="start" fill="#111">tag base: PLT1.MACH.FMS1.APC01.Rotate</text>
<text x="55" y="498" font-size="11" text-anchor="start" fill="#666">manual only in mode Manual + permission;</text>
<text x="55" y="514" font-size="11" text-anchor="start" fill="#c0392b">safety never via faceplate</text>
<text x="24" y="586" font-size="11" text-anchor="start" fill="#666">Teaching example - not for construction. Real PLC code: written, reviewed and validated by qualified people (IEC 61131-3, IEC 62061 / ISO 13849).</text>
</svg>
