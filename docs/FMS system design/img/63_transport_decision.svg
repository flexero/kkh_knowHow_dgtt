<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 700" width="1250" height="700" font-family="Arial, Helvetica, sans-serif">
<title>Decision tree for choosing transport and handling equipment, followed by weighted scoring</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1250" height="700" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Transport / handling decision – knock-out questions first, then weighted scoring (JSON "transport_select")</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#444">Typical answers (examples). After the tree, score the remaining 2–4 options with your own weights – section A4.</text>
<rect x="470.0" y="76.0" width="310.0" height="52.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="625.0" y="98.0" font-size="12" text-anchor="middle" fill="#111">Q1  Is the path fixed for years</text>
<text x="625.0" y="114.0" font-size="12" text-anchor="middle" fill="#111">and the flow high (&gt; 60 loads/h)?</text>
<rect x="80.0" y="180.0" width="300.0" height="52.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="230.0" y="202.0" font-size="12" text-anchor="middle" fill="#111">Q2  Pallets go to machines</text>
<text x="230.0" y="218.0" font-size="12" text-anchor="middle" fill="#111">from a central pallet store?</text>
<rect x="870.0" y="180.0" width="330.0" height="52.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="1035.0" y="202.0" font-size="12" text-anchor="middle" fill="#111">Q4  Euro pallets on the floor or in racks</text>
<text x="1035.0" y="218.0" font-size="12" text-anchor="middle" fill="#111">(fork handling needed)?</text>
<line x1="625.0" y1="128.0" x2="230.0" y2="180.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="390.0" y="150.0" font-size="12" text-anchor="start" fill="#059669" font-weight="bold">yes</text>
<line x1="625.0" y1="128.0" x2="1035.0" y2="180.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="850.0" y="150.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">no</text>
<rect x="20.0" y="300.0" width="200.0" height="56.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="120.0" y="322.0" font-size="12" text-anchor="middle" fill="#111">Pallet pool with stacker</text>
<text x="120.0" y="338.0" font-size="12" text-anchor="middle" fill="#111">crane or RGV on rail</text>
<rect x="240.0" y="300.0" width="250.0" height="56.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="365.0" y="322.0" font-size="12" text-anchor="middle" fill="#111">Q3  Precise locating needed</text>
<text x="365.0" y="338.0" font-size="12" text-anchor="middle" fill="#111">at stations (≤ ± 0.1 mm)?</text>
<line x1="230.0" y1="232.0" x2="120.0" y2="300.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="150.0" y="272.0" font-size="12" text-anchor="start" fill="#059669" font-weight="bold">yes</text>
<line x1="230.0" y1="232.0" x2="365.0" y2="300.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="310.0" y="272.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">no</text>
<rect x="200.0" y="420.0" width="200.0" height="56.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="300.0" y="442.0" font-size="12" text-anchor="middle" fill="#111">Pallet transfer system</text>
<text x="300.0" y="458.0" font-size="12" text-anchor="middle" fill="#111">with carriers + locating</text>
<rect x="420.0" y="420.0" width="200.0" height="56.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="520.0" y="442.0" font-size="12" text-anchor="middle" fill="#111">Roller / chain</text>
<text x="520.0" y="458.0" font-size="12" text-anchor="middle" fill="#111">conveyor</text>
<line x1="365.0" y1="356.0" x2="300.0" y2="420.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="312.0" y="396.0" font-size="12" text-anchor="start" fill="#059669" font-weight="bold">yes</text>
<line x1="365.0" y1="356.0" x2="520.0" y2="420.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="458.0" y="396.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">no</text>
<rect x="740.0" y="300.0" width="210.0" height="56.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="845.0" y="322.0" font-size="12" text-anchor="middle" fill="#111">Forklift AGV</text>
<text x="845.0" y="338.0" font-size="12" text-anchor="middle" fill="#111">(manual forklift if rare)</text>
<rect x="980.0" y="300.0" width="250.0" height="56.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="1105.0" y="322.0" font-size="12" text-anchor="middle" fill="#111">Q5  Station has a conveyor</text>
<text x="1105.0" y="338.0" font-size="12" text-anchor="middle" fill="#111">for automatic transfer?</text>
<line x1="1035.0" y1="232.0" x2="845.0" y2="300.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="915.0" y="272.0" font-size="12" text-anchor="start" fill="#059669" font-weight="bold">yes</text>
<line x1="1035.0" y1="232.0" x2="1105.0" y2="300.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="1078.0" y="272.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">no</text>
<rect x="760.0" y="420.0" width="210.0" height="56.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="865.0" y="442.0" font-size="12" text-anchor="middle" fill="#111">AGV with roller /</text>
<text x="865.0" y="458.0" font-size="12" text-anchor="middle" fill="#111">chain deck</text>
<rect x="1000.0" y="420.0" width="230.0" height="56.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="1115.0" y="442.0" font-size="12" text-anchor="middle" fill="#111">Q6  Layout changes often,</text>
<text x="1115.0" y="458.0" font-size="12" text-anchor="middle" fill="#111">small loads, people around?</text>
<line x1="1105.0" y1="356.0" x2="865.0" y2="420.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="975.0" y="396.0" font-size="12" text-anchor="start" fill="#059669" font-weight="bold">yes</text>
<line x1="1105.0" y1="356.0" x2="1115.0" y2="420.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="1120.0" y="398.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">no</text>
<rect x="900.0" y="540.0" width="160.0" height="56.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="980.0" y="562.0" font-size="12" text-anchor="middle" fill="#111">AMR (natural</text>
<text x="980.0" y="578.0" font-size="12" text-anchor="middle" fill="#111">navigation)</text>
<rect x="1075.0" y="540.0" width="165.0" height="56.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="1157.5" y="562.0" font-size="12" text-anchor="middle" fill="#111">Latent / tunnel</text>
<text x="1157.5" y="578.0" font-size="12" text-anchor="middle" fill="#111">AGV with carts</text>
<line x1="1115.0" y1="476.0" x2="980.0" y2="540.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="1030.0" y="514.0" font-size="12" text-anchor="start" fill="#059669" font-weight="bold">yes</text>
<line x1="1115.0" y1="476.0" x2="1157.0" y2="540.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="1150.0" y="514.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">no</text>
<rect x="20.0" y="500.0" width="860.0" height="180.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="36.0" y="524.0" font-size="12.5" text-anchor="start" fill="#111" font-weight="bold">Weighted scores of the JSON example (score = Σ w·s / Σ w; investment stars inverted: 6 − s):</text>
<text x="36.0" y="548.0" font-size="12" text-anchor="start" fill="#111">Need 1 – FMS pallet pool, 3 machines, fixed line (w 2/4/5/3): RGV on rail 3.86 · conveyor 3.57 · AGV roller deck 3.14 → RGV</text>
<text x="36.0" y="572.0" font-size="12" text-anchor="start" fill="#111">Need 2 – kitting to 8 assembly stations, layout changes yearly (w 5/2/2/4): AMR 3.77 · AGV roller deck 3.38 → AMR</text>
<text x="36.0" y="596.0" font-size="12" text-anchor="start" fill="#111">Need 3 – warehouse to lines, Euro pallets, 150 m (w 4/2/2/3): AMR 3.64 · AGV roller deck 3.36 · forklift AGV 3.18 · RGV 3.18</text>
<text x="36.0" y="624.0" font-size="12" text-anchor="start" fill="#c62828">The score alone picks the AMR for need 3, but knock-out question Q4 (fork handling of Euro pallets) comes first:</text>
<text x="36.0" y="644.0" font-size="12" text-anchor="start" fill="#c62828">forklift AGV – or an AMR / AGV type that is rated for Euro pallets. Always apply knock-outs before scores.</text>
</svg>