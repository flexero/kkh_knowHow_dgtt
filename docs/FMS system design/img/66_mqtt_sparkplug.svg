<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Arial, Helvetica, sans-serif">
<title>MQTT + Sparkplug B - report by exception through a broker at level 3 / DMZ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker></defs>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">MQTT + Sparkplug B - report by exception through a broker at level 3 / DMZ</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555555">Edge nodes publish, consumers subscribe. No consumer talks to a PLC. Topic: spBv1.0/&lt;group&gt;/&lt;message type&gt;/&lt;edge node&gt;/&lt;device&gt;.</text>
<rect x="500" y="240" width="200" height="70" rx="4" fill="#dbe9f6" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="600.0" y="271.5" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">MQTT broker</text>
<text x="600.0" y="286.5" font-size="12" text-anchor="middle" fill="#111111">TLS 8883 - ACL per client</text>
<rect x="40" y="100" width="300" height="60" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="190.0" y="126.5" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Edge node CC1</text>
<text x="190.0" y="141.5" font-size="12" text-anchor="middle" fill="#111111">cell FMS1 (OPC UA / Modbus -&gt; MQTT)</text>
<line x1="340" y1="130" x2="500" y2="275" stroke="#1f6fb2" stroke-width="2" marker-end="url(#aa)"/>
<rect x="40" y="240" width="300" height="60" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="190.0" y="266.5" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Edge node CC2</text>
<text x="190.0" y="281.5" font-size="12" text-anchor="middle" fill="#111111">cell ASM1</text>
<line x1="340" y1="270" x2="500" y2="275" stroke="#1f6fb2" stroke-width="2" marker-end="url(#aa)"/>
<rect x="40" y="380" width="300" height="60" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="190.0" y="406.5" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Edge node UTIL</text>
<text x="190.0" y="421.5" font-size="12" text-anchor="middle" fill="#111111">compressed air, energy</text>
<line x1="340" y1="410" x2="500" y2="275" stroke="#1f6fb2" stroke-width="2" marker-end="url(#aa)"/>
<rect x="860" y="100" width="300" height="60" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1010.0" y="126.5" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Historian</text>
<text x="1010.0" y="141.5" font-size="12" text-anchor="middle" fill="#111111">subscribes spBv1.0/PLT1/#</text>
<line x1="700" y1="275" x2="860" y2="130" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="860" y="240" width="300" height="60" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1010.0" y="266.5" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Dashboards / OEE</text>
<text x="1010.0" y="281.5" font-size="12" text-anchor="middle" fill="#111111">DDATA only</text>
<line x1="700" y1="275" x2="860" y2="270" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="860" y="380" width="300" height="60" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1010.0" y="406.5" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Primary host (SCADA)</text>
<text x="1010.0" y="421.5" font-size="12" text-anchor="middle" fill="#111111">publishes STATE</text>
<line x1="700" y1="275" x2="860" y2="410" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="40" y="470" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Message types:</text>
<text x="40" y="492" font-size="12" text-anchor="start" fill="#111111">NBIRTH / NDEATH = edge node online / offline (NDEATH is the MQTT last will) - DBIRTH / DDEATH = device online / offline (all metrics, aliases)</text>
<text x="40" y="512" font-size="12" text-anchor="start" fill="#111111">NDATA / DDATA = changed values only - NCMD / DCMD = commands (in an FMS normally NOT used for control) - STATE = primary host online</text>
<text x="40" y="532" font-size="12" text-anchor="start" fill="#555555">Example topic of the JSON: spBv1.0/PLT1/DDATA/CC1/MC01 (27 characters) - seq 0-255 per message, bdSeq per MQTT session</text>
</svg>