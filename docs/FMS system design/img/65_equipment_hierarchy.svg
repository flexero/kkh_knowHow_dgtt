<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>Role-based equipment hierarchy (IEC 62264-1 / IEC 61512-1) for the example FMS</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">Role-based equipment hierarchy (IEC 62264-1 / IEC 61512-1) for the example FMS</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#52514e">Upper levels are ISA-95 (enterprise to work centre), lower levels are ISA-88 style (unit, equipment module, control module).</text>
<rect x="40.0" y="76.0" width="300.0" height="50.0" rx="6" fill="#dbe7f5" stroke="#333" stroke-width="1.5"/>
<text x="190.0" y="97.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Enterprise</text>
<text x="190.0" y="114.0" font-size="11" text-anchor="middle" fill="#52514e">Example Compressors Ltd</text>
<rect x="70.0" y="140.0" width="300.0" height="50.0" rx="6" fill="#dbe7f5" stroke="#333" stroke-width="1.5"/>
<text x="220.0" y="161.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Site</text>
<text x="220.0" y="178.0" font-size="11" text-anchor="middle" fill="#52514e">PLT1 - Plant 1</text>
<line x1="55.0" y1="126.0" x2="55.0" y2="165.0" stroke="#333" stroke-width="1.5"/>
<line x1="55.0" y1="165.0" x2="68.0" y2="165.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100.0" y="204.0" width="300.0" height="50.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="250.0" y="225.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Area</text>
<text x="250.0" y="242.0" font-size="11" text-anchor="middle" fill="#52514e">MACH - machining</text>
<line x1="85.0" y1="190.0" x2="85.0" y2="229.0" stroke="#333" stroke-width="1.5"/>
<line x1="85.0" y1="229.0" x2="98.0" y2="229.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="130.0" y="268.0" width="300.0" height="50.0" rx="6" fill="#dcefe0" stroke="#333" stroke-width="1.5"/>
<text x="280.0" y="289.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Work centre (cell)</text>
<text x="280.0" y="306.0" font-size="11" text-anchor="middle" fill="#52514e">FMS1 - crankcase FMS</text>
<line x1="115.0" y1="254.0" x2="115.0" y2="293.0" stroke="#333" stroke-width="1.5"/>
<line x1="115.0" y1="293.0" x2="128.0" y2="293.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160.0" y="332.0" width="300.0" height="50.0" rx="6" fill="#fbf0d4" stroke="#333" stroke-width="1.5"/>
<text x="310.0" y="353.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Work unit</text>
<text x="310.0" y="370.0" font-size="11" text-anchor="middle" fill="#52514e">MC02 - HMC (M01)</text>
<line x1="145.0" y1="318.0" x2="145.0" y2="357.0" stroke="#333" stroke-width="1.5"/>
<line x1="145.0" y1="357.0" x2="158.0" y2="357.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="190.0" y="396.0" width="300.0" height="50.0" rx="6" fill="#f8dcd3" stroke="#333" stroke-width="1.5"/>
<text x="340.0" y="417.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Equipment module</text>
<text x="340.0" y="434.0" font-size="11" text-anchor="middle" fill="#52514e">APC - pallet changer (M02)</text>
<line x1="175.0" y1="382.0" x2="175.0" y2="421.0" stroke="#333" stroke-width="1.5"/>
<line x1="175.0" y1="421.0" x2="188.0" y2="421.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="220.0" y="460.0" width="300.0" height="50.0" rx="6" fill="#ece8f5" stroke="#333" stroke-width="1.5"/>
<text x="370.0" y="481.0" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Control module</text>
<text x="370.0" y="498.0" font-size="11" text-anchor="middle" fill="#52514e">Y1 clamp valve + B3 pressure switch</text>
<line x1="205.0" y1="446.0" x2="205.0" y2="485.0" stroke="#333" stroke-width="1.5"/>
<line x1="205.0" y1="485.0" x2="218.0" y2="485.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="600.0" y="100.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Siblings of the example (same work centre FMS1):</text>
<text x="610.0" y="124.0" font-size="12" text-anchor="start" fill="#111111">- MC01, MC02, MC03 - machining centres (M01)</text>
<text x="610.0" y="143.0" font-size="12" text-anchor="start" fill="#111111">- APC01..APC03 - pallet changers (M02)</text>
<text x="610.0" y="162.0" font-size="12" text-anchor="start" fill="#111111">- POOL01 - pallet pool + stacker (M03)</text>
<text x="610.0" y="181.0" font-size="12" text-anchor="start" fill="#111111">- LS01, LS02 - load stations (M04)</text>
<text x="610.0" y="200.0" font-size="12" text-anchor="start" fill="#111111">- AGVST01 - AGV station (M06)</text>
<text x="610.0" y="219.0" font-size="12" text-anchor="start" fill="#111111">- ASRS01 - AS/RS (M08)</text>
<text x="610.0" y="238.0" font-size="12" text-anchor="start" fill="#111111">- TOOL01 - tool management (M09)</text>
<text x="610.0" y="257.0" font-size="12" text-anchor="start" fill="#111111">- WASH01 - washer (M10)</text>
<text x="610.0" y="276.0" font-size="12" text-anchor="start" fill="#111111">- CMM01 - measuring (M11)</text>
<text x="610.0" y="295.0" font-size="12" text-anchor="start" fill="#111111">- MARK01 - marking (M12)</text>
<text x="610.0" y="314.0" font-size="12" text-anchor="start" fill="#111111">- UTIL01 - utilities (M17)</text>
<text x="610.0" y="333.0" font-size="12" text-anchor="start" fill="#111111">- SAFE01 - cell safety controller (M18)</text>
<text x="610.0" y="352.0" font-size="12" text-anchor="start" fill="#111111">- CC01 - cell controller (M19)</text>
<rect x="600.0" y="390.0" width="560.0" height="150.0" rx="6" fill="#fafaf7" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="616.0" y="414.0" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Tag = path through the tree (guide 65 B1):</text>
<text x="616.0" y="440.0" font-size="15" text-anchor="start" fill="#3d7ac4" font-weight="bold">PLT1 . MACH . FMS1 . MC02 . APC . ClampOK</text>
<text x="616.0" y="466.0" font-size="12" text-anchor="start" fill="#52514e">site . area . cell . unit . equipment . signal</text>
<text x="616.0" y="492.0" font-size="12" text-anchor="start" fill="#111111">Data-block tag: PLT1.MACH.FMS1.MC02.Status.StateCurrent</text>
<text x="616.0" y="514.0" font-size="12" text-anchor="start" fill="#111111">IEC 81346: =FMS1.MC02  +HALL1.A3  -KF1</text>
</svg>
