<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>IEC 62443 zones and conduits - example with SL-T from the risk assessment</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker></defs>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" fill="#111111" font-weight="bold">IEC 62443 zones and conduits - example with SL-T from the risk assessment</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555555">Boxes = zones (SL-T = highest SL-T of the threats in the zone, Part G5). Lines = conduits with the allowed services. Everything else: default deny.</text>
<line x1="190.0" y1="123.0" x2="590.0" y2="123.0" stroke="#333" stroke-width="2.5"/>
<text x="350.0" y="115.0" font-size="11" text-anchor="start" fill="#111111">https (R01)</text>
<line x1="590.0" y1="123.0" x2="590.0" y2="263.0" stroke="#333" stroke-width="2.5"/>
<text x="600.0" y="193.0" font-size="11" text-anchor="start" fill="#111111">https, rdp via jump host, repl out (R02 R03 R11)</text>
<line x1="590.0" y1="263.0" x2="390.0" y2="413.0" stroke="#333" stroke-width="2.5"/>
<text x="30.0" y="366.0" font-size="11" text-anchor="start" fill="#111111">opcua, modbus-read, ntp, syslog (R05 R06 R12 R13)</text>
<line x1="590.0" y1="263.0" x2="790.0" y2="413.0" stroke="#333" stroke-width="2.5"/>
<text x="750.0" y="358.0" font-size="11" text-anchor="start" fill="#111111">opcua, modbus</text>
<line x1="990.0" y1="263.0" x2="390.0" y2="413.0" stroke="#333" stroke-width="2.5"/>
<text x="700.0" y="318.0" font-size="11" text-anchor="start" fill="#111111">s7 in a window (R08)</text>
<line x1="390.0" y1="413.0" x2="390.0" y2="538.0" stroke="#333" stroke-width="2.5"/>
<text x="400.0" y="475.5" font-size="11" text-anchor="start" fill="#111111">modbus-read from CC01 only (R09)</text>
<rect x="40" y="90" width="300" height="66" rx="8" fill="#f7f7f7" stroke="#555555" stroke-width="1.8"/>
<text x="52" y="114" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Enterprise (L4)</text>
<text x="52" y="136" font-size="12" text-anchor="start" fill="#555555">no threat assessed here</text>
<rect x="440" y="90" width="300" height="66" rx="8" fill="#f7f7f7" stroke="#555555" stroke-width="1.8"/>
<text x="452" y="114" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Industrial DMZ (L3.5)</text>
<text x="452" y="136" font-size="12" text-anchor="start" fill="#555555">SL-T 1</text>
<rect x="840" y="90" width="300" height="66" rx="8" fill="#f7f7f7" stroke="#555555" stroke-width="1.8"/>
<text x="852" y="114" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Internet / supplier</text>
<text x="852" y="136" font-size="12" text-anchor="start" fill="#555555">untrusted</text>
<rect x="440" y="230" width="300" height="66" rx="8" fill="#eef5fc" stroke="#1f6fb2" stroke-width="1.8"/>
<text x="452" y="254" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Manufacturing (L3)</text>
<text x="452" y="276" font-size="12" text-anchor="start" fill="#1f6fb2">SL-T 3</text>
<rect x="840" y="230" width="300" height="66" rx="8" fill="#f7f7f7" stroke="#555555" stroke-width="1.8"/>
<text x="852" y="254" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Engineering</text>
<text x="852" y="276" font-size="12" text-anchor="start" fill="#555555">SL-T 2</text>
<rect x="240" y="380" width="300" height="66" rx="8" fill="#eef5fc" stroke="#1f6fb2" stroke-width="1.8"/>
<text x="252" y="404" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Cell FMS1 (L1-2)</text>
<text x="252" y="426" font-size="12" text-anchor="start" fill="#1f6fb2">SL-T 3</text>
<rect x="640" y="380" width="300" height="66" rx="8" fill="#f7f7f7" stroke="#555555" stroke-width="1.8"/>
<text x="652" y="404" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Cell ASM1 (L1-2)</text>
<text x="652" y="426" font-size="12" text-anchor="start" fill="#555555">not assessed in the example</text>
<rect x="240" y="505" width="300" height="66" rx="8" fill="#eef5fc" stroke="#1f6fb2" stroke-width="1.8"/>
<text x="252" y="529" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Safety FMS1</text>
<text x="252" y="551" font-size="12" text-anchor="start" fill="#1f6fb2">SL-T 3</text>
<rect x="30" y="230" width="360" height="110" rx="4" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="42" y="252" font-size="12" text-anchor="start" fill="#111111" font-weight="bold">Audit findings (Part G7):</text>
<text x="42" y="274" font-size="12" text-anchor="start" fill="#111111">R04 jump host (dmz) -&gt; cell c1: crosses zones</text>
<text x="42" y="294" font-size="12" text-anchor="start" fill="#111111">R15 engineering WS -&gt; c1: any service</text>
<text x="42" y="316" font-size="12" text-anchor="start" fill="#1f6fb2">Fix: delete R04; replace R15 by named services</text>
<text x="42" y="334" font-size="12" text-anchor="start" fill="#1f6fb2">with a time window</text>
<text x="840" y="180" font-size="12" text-anchor="start" fill="#1f6fb2">R14: anything -&gt; internet = deny (logged)</text>
</svg>