<text x="110" y="109" font-size="11" text-anchor="end" fill="#111">9</text>
<text x="40" y="96" font-size="11" text-anchor="start" fill="#111">v [bar]</text>
<line x1="120" y1="150" x2="1070" y2="150" stroke="#c0392b" stroke-width="1.5"/>
