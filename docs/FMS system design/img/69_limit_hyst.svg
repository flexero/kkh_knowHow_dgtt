<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
<title>Limit alarms with hysteresis and on-delay (H 8.0, L 3.0, hyst 0.2, delay 2 samples of 1 s)</title>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">Limit alarms with hysteresis and on-delay (H 8.0, L 3.0, hyst 0.2, delay 2 samples of 1 s)</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">ON after the condition was TRUE for 2 consecutive samples; OFF immediately when v &lt; H - hyst (7.8) or v &gt; L + hyst (3.2).</text>
