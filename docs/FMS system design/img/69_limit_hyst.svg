<text x="24" y="556" font-size="11" text-anchor="start" fill="#111">Events: 1 L on, 3 L off, 7 H on (8.0 at 6 and 8.1 at 7), 11 H off (7.75 &lt; 7.8), 14 L on (3.0, 2.95), 15 L off (3.25 &gt; 3.2). Sample 6 alone (8.0) does not alarm.</text>
<text x="24" y="586" font-size="11" text-anchor="start" fill="#666">Teaching example - not for construction. Real PLC code: written, reviewed and validated by qualified people (IEC 61131-3, IEC 62061 / ISO 13849).</text>
