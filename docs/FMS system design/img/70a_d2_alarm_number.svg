<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Arial, Helvetica, sans-serif">
<title>D2 - alarm number formula AlarmNo = M x 1000 + 10 x i + a</title>
<rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#111">D2 - alarm number formula AlarmNo = M x 1000 + 10 x i + a</text>
<text x="24" y="54" font-size="12" text-anchor="start" fill="#555">M = module number (M02 -&gt; 2), i = instance number of the device FB in the item 8 expansion order (1..89 usable, 0 = module level), a = local alarm code of the FB (1..9).</text>
<rect x="120" y="100" width="260" height="110" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="250.0" y="135.33333333333334" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f5fa8">M x 1000</text>
<text x="250.0" y="151.33333333333334" font-size="13" text-anchor="middle" fill="#111">module type</text>
<text x="250.0" y="167.33333333333334" font-size="13" text-anchor="middle" fill="#111">M02 APC -&gt; 2000</text>
<text x="250.0" y="183.33333333333334" font-size="13" text-anchor="middle" fill="#111">M22 -&gt; 22000</text>
<rect x="470" y="100" width="260" height="110" rx="8" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
<text x="600.0" y="135.33333333333334" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">10 x i</text>
<text x="600.0" y="151.33333333333334" font-size="13" text-anchor="middle" fill="#111">device instance</text>
<text x="600.0" y="167.33333333333334" font-size="13" text-anchor="middle" fill="#111">1 Rotate, 2 Clamp, 3 PalSideA,</text>
<text x="600.0" y="183.33333333333334" font-size="13" text-anchor="middle" fill="#111">4 PalSideB, 5 ClampPress</text>
<rect x="820" y="100" width="260" height="110" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="950.0" y="135.33333333333334" font-size="14" text-anchor="middle" font-weight="bold" fill="#c0392b">a</text>
<text x="950.0" y="151.33333333333334" font-size="13" text-anchor="middle" fill="#111">local alarm of the FB</text>
<text x="950.0" y="167.33333333333334" font-size="13" text-anchor="middle" fill="#111">FB_Valve2: 1 not reached,</text>
<text x="950.0" y="183.33333333333334" font-size="13" text-anchor="middle" fill="#111">2 lost, 3 both switches</text>
<text x="425" y="160" font-size="28" text-anchor="middle" font-weight="bold" fill="#111">+</text>
<text x="775" y="160" font-size="28" text-anchor="middle" font-weight="bold" fill="#111">+</text>
<text x="60" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#111">AlarmNo</text>
<text x="160" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#111">M</text>
<text x="230" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#111">i (instance)</text>
<text x="470" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#111">a</text>
<text x="520" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#111">text (example)</text>
<text x="960" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#111">class</text>
<rect x="50" y="258" width="1100" height="24" rx="0" fill="#f7f7f7" stroke="none" stroke-width="0"/>
<text x="60" y="274" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2011</text>
<text x="160" y="274" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="230" y="274" font-size="12" text-anchor="start" fill="#111">1 Rotate (FB_Valve2)</text>
<text x="470" y="274" font-size="12" text-anchor="start" fill="#111">1</text>
<text x="520" y="274" font-size="12" text-anchor="start" fill="#111">rotation did not reach end position</text>
<text x="960" y="274" font-size="12" text-anchor="start" fill="#c0392b">A</text>
<text x="60" y="298" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2021</text>
<text x="160" y="298" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="230" y="298" font-size="12" text-anchor="start" fill="#111">2 Clamp (FB_Valve1)</text>
<text x="470" y="298" font-size="12" text-anchor="start" fill="#111">1</text>
<text x="520" y="298" font-size="12" text-anchor="start" fill="#111">clamp end position not reached</text>
<text x="960" y="298" font-size="12" text-anchor="start" fill="#b7950b">B</text>
<rect x="50" y="306" width="1100" height="24" rx="0" fill="#f7f7f7" stroke="none" stroke-width="0"/>
<text x="60" y="322" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2022</text>
<text x="160" y="322" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="230" y="322" font-size="12" text-anchor="start" fill="#111">2 Clamp (FB_Valve1)</text>
<text x="470" y="322" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="520" y="322" font-size="12" text-anchor="start" fill="#111">clamp left end position without command</text>
<text x="960" y="322" font-size="12" text-anchor="start" fill="#c0392b">A</text>
<text x="60" y="346" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2051</text>
<text x="160" y="346" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="230" y="346" font-size="12" text-anchor="start" fill="#111">5 ClampPress (FB_AnalogIn)</text>
<text x="470" y="346" font-size="12" text-anchor="start" fill="#111">1</text>
<text x="520" y="346" font-size="12" text-anchor="start" fill="#111">clamp pressure not reached in clamp step</text>
<text x="960" y="346" font-size="12" text-anchor="start" fill="#b7950b">B</text>
<rect x="50" y="354" width="1100" height="24" rx="0" fill="#f7f7f7" stroke="none" stroke-width="0"/>
<text x="60" y="370" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2052</text>
<text x="160" y="370" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="230" y="370" font-size="12" text-anchor="start" fill="#111">5 ClampPress (FB_AnalogIn)</text>
<text x="470" y="370" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="520" y="370" font-size="12" text-anchor="start" fill="#111">clamp pressure lost while machining</text>
<text x="960" y="370" font-size="12" text-anchor="start" fill="#c0392b">A</text>
<text x="60" y="394" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2053</text>
<text x="160" y="394" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="230" y="394" font-size="12" text-anchor="start" fill="#111">5 ClampPress (FB_AnalogIn)</text>
<text x="470" y="394" font-size="12" text-anchor="start" fill="#111">3</text>
<text x="520" y="394" font-size="12" text-anchor="start" fill="#111">pressure signal quality bad/uncertain</text>
<text x="960" y="394" font-size="12" text-anchor="start" fill="#b7950b">C</text>
<rect x="50" y="402" width="1100" height="24" rx="0" fill="#f7f7f7" stroke="none" stroke-width="0"/>
<text x="60" y="418" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2001</text>
<text x="160" y="418" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="230" y="418" font-size="12" text-anchor="start" fill="#111">0 module</text>
<text x="470" y="418" font-size="12" text-anchor="start" fill="#111">1</text>
<text x="520" y="418" font-size="12" text-anchor="start" fill="#111">not in home position (D4)</text>
<text x="960" y="418" font-size="12" text-anchor="start" fill="#b7950b">B</text>
<text x="60" y="442" font-size="12" text-anchor="start" font-weight="bold" fill="#111">2902</text>
<text x="160" y="442" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="230" y="442" font-size="12" text-anchor="start" fill="#111">module, 900 + command</text>
<text x="470" y="442" font-size="12" text-anchor="start" fill="#111">2</text>
<text x="520" y="442" font-size="12" text-anchor="start" fill="#111">command Start rejected (warning)</text>
<text x="960" y="442" font-size="12" text-anchor="start" fill="#b7950b">C</text>
<text x="60" y="500" font-size="12" text-anchor="start" fill="#555">Decoding: 2052 -&gt; M = 2052 div 1000 = 2 ; i = (2052 mod 1000) div 10 = 5 ; a = 2052 mod 10 = 2. INT is enough: max 22999 &lt; 32767.</text>
</svg>
