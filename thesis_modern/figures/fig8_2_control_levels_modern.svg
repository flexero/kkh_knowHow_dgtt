<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="715" viewBox="0 0 1180 715" font-family="Arial, Helvetica, sans-serif"><title>Control hierarchy with OPC UA and MQTT</title><rect width="1180" height="715" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f5e57"/></marker></defs><rect x="15" y="15" width="1150" height="110" rx="10" fill="none" stroke="#9a988f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="25" y="32" font-size="12" fill="#5f5e57" text-anchor="start" font-weight="bold">Level 3-4: MES / ERP (office zone)</text><rect x="60" y="45" width="300" height="60" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="210.0" y="71.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">ERP</text><text x="210.0" y="87.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">orders, material, shipping</text><rect x="420" y="45" width="300" height="60" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="570.0" y="71.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">MES</text><text x="570.0" y="87.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">work orders -&gt; cell controller</text><rect x="780" y="45" width="340" height="60" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="950.0" y="71.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Digital twin (read-only)</text><text x="950.0" y="87.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Sparkplug primary host, Ch. 4-6</text><rect x="15" y="145" width="1150" height="250" rx="10" fill="none" stroke="#9a988f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="25" y="162" font-size="12" fill="#5f5e57" text-anchor="start" font-weight="bold">Level 2: FMS control PC (Python, offline) - OPC UA client + MQTT client</text><rect x="40" y="180" width="260" height="120" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="170.0" y="220.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Cell controller</text><text x="170.0" y="236.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">dispatching (EDD / FIFO),</text><text x="170.0" y="252.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">pallet + job state, SQLite</text><text x="170.0" y="268.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">unchanged fmsctl code</text><rect x="320" y="180" width="240" height="120" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="440.0" y="220.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Tool management</text><text x="440.0" y="236.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">tool list from subscription,</text><text x="440.0" y="252.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Eq. (8.1) check,</text><text x="440.0" y="268.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">WriteToolData method</text><rect x="580" y="180" width="260" height="120" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="710.0" y="220.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Logistics</text><text x="710.0" y="236.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">AS/RS: Store / Retrieve methods</text><text x="710.0" y="252.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">AGV: Transport / Charge methods</text><text x="710.0" y="268.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">or VDA 5050 order over MQTT</text><rect x="860" y="180" width="280" height="198" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="1000.0" y="235.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Edge gateway</text><text x="1000.0" y="251.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">OPC UA subscriptions -&gt;</text><text x="1000.0" y="267.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Sparkplug B (unified namespace)</text><text x="1000.0" y="283.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">store-and-forward + replay</text><text x="1000.0" y="299.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle"></text><text x="1000.0" y="315.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">publishes via the MQTT broker</text><text x="1000.0" y="331.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">(TLS, spBv1.0/fms/#, STATE)</text><rect x="40" y="318" width="800" height="60" rx="8" fill="#fdf5e0" stroke="#5f5e57" stroke-width="1.2"/><text x="440.0" y="344.4" font-size="12.5" fill="#1f1f1e" text-anchor="middle">UaDeviceLink adapter: one OPC UA session per server; status = subscription image (no polling);</text><text x="440.0" y="359.9" font-size="11.0" fill="#1f1f1e" text-anchor="middle">job = method call with JobId (idempotent retry), result = FmsJobFinishedEvent / GetJobResult</text><rect x="15" y="415" width="1150" height="230" rx="10" fill="none" stroke="#9a988f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="25" y="432" font-size="12" fill="#5f5e57" text-anchor="start" font-weight="bold">Level 1: 21 machine controllers, each an OPC UA server (embedded or retrofit) - zone Z1</text><rect x="35" y="450" width="132" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="101.0" y="481.5" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">LOAD-CC</text><text x="101.0" y="496.5" font-size="10.5" fill="#1f1f1e" text-anchor="middle">load station</text><rect x="177" y="450" width="132" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="243.0" y="481.5" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">PPS-1</text><text x="243.0" y="496.5" font-size="10.5" fill="#1f1f1e" text-anchor="middle">pallet system</text><rect x="319" y="450" width="132" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="385.0" y="481.5" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">HMC-01..03</text><text x="385.0" y="496.5" font-size="10.5" fill="#1f1f1e" text-anchor="middle">3 HMC + pallet changer</text><rect x="461" y="450" width="132" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="527.0" y="481.5" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">VMC, HONE,</text><text x="527.0" y="496.5" font-size="10.5" fill="#1f1f1e" text-anchor="middle">LATHE, GRIND</text><rect x="603" y="450" width="132" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="669.0" y="481.5" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">WASH, ASSY, ROBOT,</text><text x="669.0" y="496.5" font-size="10.5" fill="#1f1f1e" text-anchor="middle">PAINT, FINAL, PACK</text><rect x="745" y="450" width="132" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="811.0" y="481.5" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">TEST-01/02</text><text x="811.0" y="496.5" font-size="10.5" fill="#1f1f1e" text-anchor="middle">test benches</text><rect x="887" y="450" width="132" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="953.0" y="481.5" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">AGV-01/02</text><text x="953.0" y="496.5" font-size="10.5" fill="#1f1f1e" text-anchor="middle">Wi-Fi</text><rect x="1029" y="450" width="132" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="1095.0" y="481.5" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">ASRS-RAW/FG</text><text x="1095.0" y="496.5" font-size="10.5" fill="#1f1f1e" text-anchor="middle">cranes</text><text x="590" y="560" font-size="12.5" fill="#5f5e57" text-anchor="middle">each: Machines/&lt;Device&gt; object (Fig. 5.2), events FmsStateChanged / FmsJobFinished, job methods</text><text x="590" y="582" font-size="12.5" fill="#5f5e57" text-anchor="middle">security: Basic256Sha256 SignAndEncrypt, trust list with the control PC certificate only</text><text x="590" y="604" font-size="12.5" fill="#5f5e57" text-anchor="middle">watchdog: no active controller session -&gt; no new jobs (replaces register 226 heartbeat)</text><rect x="15" y="660" width="1150" height="40" rx="10" fill="none" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="7 5"/><text x="25" y="677" font-size="12" fill="#5f5e57" text-anchor="start" font-weight="bold">Level 0: safety hard-wired per machine (e-stop, guards, light curtains, STO) - never over the network</text><line x1="590" y1="105" x2="590" y2="178" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="598" y="150" font-size="11.5" fill="#5f5e57" text-anchor="start">work orders</text><line x1="640" y1="378" x2="640" y2="448" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="648" y="441" font-size="11.5" fill="#5f5e57" text-anchor="start">OPC UA methods + subscriptions</text><line x1="1000" y1="448" x2="1000" y2="380" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="992" y="441" font-size="11.5" fill="#5f5e57" text-anchor="end">OPC UA events + data changes</text><line x1="1000" y1="180" x2="1000" y2="108" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="1008" y="140" font-size="11.5" fill="#5f5e57" text-anchor="start">Sparkplug B over MQTT</text></svg>