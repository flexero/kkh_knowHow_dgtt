<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="Arial, Helvetica, sans-serif"><title>Information model of the compressor FMS</title><rect width="1180" height="720" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f5e57"/></marker></defs><text x="30" y="30" font-size="13" fill="#1f1f1e" text-anchor="start" font-weight="bold">Node (browse path)</text><text x="400" y="30" font-size="13" fill="#1f1f1e" text-anchor="start" font-weight="bold">Content</text><text x="1150" y="30" font-size="13" fill="#1f1f1e" text-anchor="end" font-weight="bold">Replaces register(s) V1.2</text><rect x="24" y="43" width="350" height="22" rx="5" fill="#eaf2fc" stroke="#5f5e57" stroke-width="0.8"/><text x="30" y="58" font-size="12.5" fill="#1f1f1e" text-anchor="start" font-weight="bold">Objects / Machines</text><text x="400" y="58" font-size="11.8" fill="#1f1f1e" text-anchor="start">folder (OPC 40001-1 entry point)</text><text x="1150" y="58" font-size="11.5" fill="#5f5e57" text-anchor="end"></text><rect x="46" y="79" width="328" height="22" rx="5" fill="#eaf7f1" stroke="#5f5e57" stroke-width="0.8"/><text x="52" y="94" font-size="12.5" fill="#1f1f1e" text-anchor="start" font-weight="bold">HMC-01   : FmsMachineToolType</text><line x1="36" y1="90" x2="46" y2="90" stroke="#5f5e57"/><text x="400" y="94" font-size="11.8" fill="#1f1f1e" text-anchor="start">one object per device; type = device class</text><text x="1150" y="94" font-size="11.5" fill="#5f5e57" text-anchor="end">hdr.typeCode</text><rect x="68" y="115" width="306" height="22" rx="5" fill="#f4f3ef" stroke="#5f5e57" stroke-width="0.8"/><text x="74" y="130" font-size="12.5" fill="#1f1f1e" text-anchor="start">Identification</text><line x1="58" y1="126" x2="68" y2="126" stroke="#5f5e57"/><text x="400" y="130" font-size="11.8" fill="#1f1f1e" text-anchor="start">Manufacturer, Model, SerialNumber, ProductInstanceUri, DeviceClass, Location</text><text x="1150" y="130" font-size="11.5" fill="#5f5e57" text-anchor="end">hdr.unitId</text><rect x="68" y="151" width="306" height="22" rx="5" fill="#f4f3ef" stroke="#5f5e57" stroke-width="0.8"/><text x="74" y="166" font-size="12.5" fill="#1f1f1e" text-anchor="start">MachineryItemState / CurrentState</text><line x1="58" y1="162" x2="68" y2="162" stroke="#5f5e57"/><text x="400" y="166" font-size="11.8" fill="#1f1f1e" text-anchor="start">NotAvailable | OutOfService | NotExecuting | Executing</text><text x="1150" y="166" font-size="11.5" fill="#5f5e57" text-anchor="end">std.status</text><rect x="68" y="187" width="306" height="22" rx="5" fill="#f4f3ef" stroke="#5f5e57" stroke-width="0.8"/><text x="74" y="202" font-size="12.5" fill="#1f1f1e" text-anchor="start">MachineryOperationMode / CurrentState</text><line x1="58" y1="198" x2="68" y2="198" stroke="#5f5e57"/><text x="400" y="202" font-size="11.8" fill="#1f1f1e" text-anchor="start">None | Maintenance | Setup | Processing</text><text x="1150" y="202" font-size="11.5" fill="#5f5e57" text-anchor="end">std.mode</text><rect x="68" y="223" width="306" height="22" rx="5" fill="#f4f3ef" stroke="#5f5e57" stroke-width="0.8"/><text x="74" y="238" font-size="12.5" fill="#1f1f1e" text-anchor="start">Monitoring</text><line x1="58" y1="234" x2="68" y2="234" stroke="#5f5e57"/><text x="400" y="238" font-size="11.8" fill="#1f1f1e" text-anchor="start">FmsState (0-6), AlarmCode, StateChangeCounter, ElectricalPower, EnergyConsumption, Spindle, Channel</text><text x="1150" y="238" font-size="11.5" fill="#5f5e57" text-anchor="end">4-7, 100-107</text><rect x="68" y="259" width="306" height="22" rx="5" fill="#f4f3ef" stroke="#5f5e57" stroke-width="0.8"/><text x="74" y="274" font-size="12.5" fill="#1f1f1e" text-anchor="start">Production</text><line x1="58" y1="270" x2="68" y2="270" stroke="#5f5e57"/><text x="400" y="274" font-size="11.8" fill="#1f1f1e" text-anchor="start">ActiveJob/{Identifier, RunsCompleted}, ActiveProgram/ProgramNo, LastJob/{JobId, Result, Duration},</text><text x="1150" y="274" font-size="11.5" fill="#5f5e57" text-anchor="end">11, 20-45, 300, 390-395</text><text x="400" y="310" font-size="11.8" fill="#1f1f1e" text-anchor="start">PartsGood, PartsScrap, LastCycleTime, JobActive, ReadyForJob</text><text x="1150" y="310" font-size="11.5" fill="#5f5e57" text-anchor="end"></text><rect x="68" y="331" width="306" height="22" rx="5" fill="#f4f3ef" stroke="#5f5e57" stroke-width="0.8"/><text x="74" y="346" font-size="12.5" fill="#1f1f1e" text-anchor="start">Equipment / Tools</text><line x1="58" y1="342" x2="68" y2="342" stroke="#5f5e57"/><text x="400" y="346" font-size="11.8" fill="#1f1f1e" text-anchor="start">Pocket01..30/RemainingLife [%],  LastToolData/{Pocket, Length, Radius}</text><text x="1150" y="346" font-size="11.5" fill="#5f5e57" text-anchor="end">310-345</text><rect x="68" y="367" width="306" height="22" rx="5" fill="#f4f3ef" stroke="#5f5e57" stroke-width="0.8"/><text x="74" y="382" font-size="12.5" fill="#1f1f1e" text-anchor="start">Equipment / PalletChanger</text><line x1="58" y1="378" x2="68" y2="378" stroke="#5f5e57"/><text x="400" y="382" font-size="11.8" fill="#1f1f1e" text-anchor="start">WorkPallet, SetupPallet</text><text x="1150" y="382" font-size="11.5" fill="#5f5e57" text-anchor="end">301-302</text><rect x="68" y="403" width="306" height="22" rx="5" fill="#f4f3ef" stroke="#5f5e57" stroke-width="0.8"/><text x="74" y="418" font-size="12.5" fill="#1f1f1e" text-anchor="start">Methods</text><line x1="58" y1="414" x2="68" y2="414" stroke="#5f5e57"/><text x="400" y="418" font-size="11.8" fill="#1f1f1e" text-anchor="start">StartJob(JobId, ProgramNo, Variant, Quantity, PalletId) -&gt; (Status, Message)</text><text x="1150" y="418" font-size="11.5" fill="#5f5e57" text-anchor="end">cmd 200-226 + job 400-449</text><text x="400" y="454" font-size="11.8" fill="#1f1f1e" text-anchor="start">WriteToolData(JobId, Pocket, Length, Radius, LifeSet),  AckAlarm(),  GetJobResult(JobId)</text><text x="1150" y="454" font-size="11.5" fill="#5f5e57" text-anchor="end">+ toggle-bit handshake</text><rect x="46" y="475" width="328" height="22" rx="5" fill="#eaf7f1" stroke="#5f5e57" stroke-width="0.8"/><text x="52" y="490" font-size="12.5" fill="#1f1f1e" text-anchor="start" font-weight="bold">PPS-1 : FmsPalletSystemType</text><line x1="36" y1="486" x2="46" y2="486" stroke="#5f5e57"/><text x="400" y="490" font-size="11.8" fill="#1f1f1e" text-anchor="start">PalletSystem/Locations/Location01..16/PalletId, Pallets/Pallet01..16/Content, Shuttle;  MovePallet(...)</text><text x="1150" y="490" font-size="11.5" fill="#5f5e57" text-anchor="end">300-345</text><rect x="46" y="511" width="328" height="22" rx="5" fill="#eaf7f1" stroke="#5f5e57" stroke-width="0.8"/><text x="52" y="526" font-size="12.5" fill="#1f1f1e" text-anchor="start" font-weight="bold">AGV-01 : FmsAgvType</text><line x1="36" y1="522" x2="46" y2="522" stroke="#5f5e57"/><text x="400" y="526" font-size="11.8" fill="#1f1f1e" text-anchor="start">Vehicle/{CurrentNode, TargetNode, BatteryCharge, Loaded, VehicleState};  Transport(...), Charge(...)</text><text x="1150" y="526" font-size="11.5" fill="#5f5e57" text-anchor="end">300-304</text><rect x="46" y="547" width="328" height="22" rx="5" fill="#eaf7f1" stroke="#5f5e57" stroke-width="0.8"/><text x="52" y="562" font-size="12.5" fill="#1f1f1e" text-anchor="start" font-weight="bold">... 18 further devices</text><line x1="36" y1="558" x2="46" y2="558" stroke="#5f5e57"/><text x="400" y="562" font-size="11.8" fill="#1f1f1e" text-anchor="start">LoadStation, Station, TestBench (LastResult/...), AsrsCrane (Crane/...)</text><text x="1150" y="562" font-size="11.5" fill="#5f5e57" text-anchor="end"></text><rect x="24" y="583" width="350" height="22" rx="5" fill="#eaf2fc" stroke="#5f5e57" stroke-width="0.8"/><text x="30" y="598" font-size="12.5" fill="#1f1f1e" text-anchor="start" font-weight="bold">Events (via Server object)</text><text x="400" y="598" font-size="11.8" fill="#1f1f1e" text-anchor="start">FmsStateChangedEventType {NewStateCode, OldStateCode, StateChangeCounter, MachineryItemState}</text><text x="1150" y="598" font-size="11.5" fill="#5f5e57" text-anchor="end">event ring 108-131</text><text x="400" y="634" font-size="11.8" fill="#1f1f1e" text-anchor="start">FmsJobFinishedEventType {JobId, Result, Duration};  Time = source time stamp of the machine</text><text x="1150" y="634" font-size="11.5" fill="#5f5e57" text-anchor="end">evt.tLast_ms</text><text x="30" y="702" font-size="11.5" fill="#5f5e57" text-anchor="start" font-style="italic">Browse names follow OPC 40001-1 / OPC 40501-1; FMS-specific nodes in namespace urn:compressor-fms:ua:fms (model version 2.0.0).</text></svg>