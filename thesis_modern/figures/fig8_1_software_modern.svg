<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif"><title>Software layers of the implementation, edition 2</title><rect width="900" height="520" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f5e57"/></marker></defs><rect x="40" y="20" width="820" height="58" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="450.0" y="45.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">User entities</text><text x="450.0" y="61.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">ERP · MES · browser displays · twin users · engineering</text><line x1="450" y1="78" x2="450" y2="104" stroke="#5f5e57" stroke-width="1.6"/><text x="462" y="96" font-size="11.5" fill="#5f5e57" text-anchor="start">HTTP/JSON, Server-Sent Events, MQTT topics</text><rect x="40" y="104" width="820" height="58" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="450.0" y="129.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Twin core + FMS control (offline industrial PC)</text><text x="450.0" y="145.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">server.py + twin/ (factory model, MES, ERP, historian) · thesis/code (bayes, flowline, staging) · fmsctl</text><line x1="450" y1="162" x2="450" y2="188" stroke="#5f5e57" stroke-width="1.6"/><text x="462" y="180" font-size="11.5" fill="#5f5e57" text-anchor="start">MQTT 3.1.1 / 5.0 over TLS (Sparkplug B payloads)</text><rect x="40" y="188" width="820" height="58" rx="8" fill="#fdf5e0" stroke="#5f5e57" stroke-width="1.2"/><text x="450.0" y="213.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Unified namespace</text><text x="450.0" y="229.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">MQTT broker, Sparkplug B topics spBv1.0/fms/... (TLS) · twin = primary host</text><line x1="450" y1="246" x2="450" y2="272" stroke="#5f5e57" stroke-width="1.6"/><text x="462" y="264" font-size="11.5" fill="#5f5e57" text-anchor="start">MQTT publish / subscribe (QoS 1)</text><rect x="40" y="272" width="820" height="58" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="450.0" y="297.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Edge gateway / controller adapter</text><text x="450.0" y="313.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">OPC UA client: subscriptions + events -&gt; Sparkplug, store-and-forward, replay · UaDeviceLink: methods</text><line x1="450" y1="330" x2="450" y2="356" stroke="#5f5e57" stroke-width="1.6"/><text x="462" y="348" font-size="11.5" fill="#5f5e57" text-anchor="start">OPC UA binary, SignAndEncrypt, one session per server</text><rect x="40" y="356" width="820" height="58" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="450.0" y="381.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Machines (L1)</text><text x="450.0" y="397.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">PLC / CNC with OPC UA server (embedded or retrofit) · information model V2.0 · job methods</text><line x1="450" y1="414" x2="450" y2="440" stroke="#5f5e57" stroke-width="1.6"/><text x="462" y="432" font-size="11.5" fill="#5f5e57" text-anchor="start">I/O</text><rect x="40" y="440" width="820" height="58" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="450.0" y="465.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Field (L0)</text><text x="450.0" y="481.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">sensors, drives, safety - hard-wired, not on the network</text></svg>