<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Arial, Helvetica, sans-serif"><title>Reference architecture with OPC UA and MQTT</title><rect width="1180" height="760" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f5e57"/></marker></defs><rect x="15" y="15" width="1150" height="120" rx="10" fill="none" stroke="#9a988f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="25" y="32" font-size="12" fill="#5f5e57" text-anchor="start" font-weight="bold">Levels 3-4  Enterprise / office zone (IEC 62443 zone Z3)</text><rect x="40" y="45" width="200" height="70" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="140.0" y="76.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">ERP</text><text x="140.0" y="92.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">orders, stock, costs</text><rect x="270" y="45" width="210" height="70" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="375.0" y="76.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">MES</text><text x="375.0" y="92.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">work orders, bookings, OEE</text><rect x="510" y="45" width="250" height="70" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="635.0" y="68.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Digital twin (Ch. 4, 6)</text><text x="635.0" y="84.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Sparkplug primary host</text><text x="635.0" y="100.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Bayesian update, prediction</text><rect x="790" y="45" width="170" height="70" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="875.0" y="76.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Historian</text><text x="875.0" y="92.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">SQLite / time series</text><rect x="985" y="45" width="160" height="70" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="1065.0" y="76.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Engineering</text><text x="1065.0" y="92.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">browser screens</text><rect x="15" y="160" width="1150" height="210" rx="10" fill="none" stroke="#9a988f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="25" y="177" font-size="12" fill="#5f5e57" text-anchor="start" font-weight="bold">Level 2  FMS control / site operations zone (Z2) - one industrial PC + cold spare, offline</text><rect x="40" y="195" width="330" height="150" rx="8" fill="#fdf5e0" stroke="#5f5e57" stroke-width="1.2"/><text x="205.0" y="242.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">MQTT broker (unified namespace)</text><text x="205.0" y="258.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Mosquitto recommended; amqtt in the lab</text><text x="205.0" y="274.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">spBv1.0/fms/{NBIRTH|DBIRTH|DDATA|...}/gw1/&lt;device&gt;</text><text x="205.0" y="290.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">spBv1.0/STATE/twin   TLS 1.3, port 8883</text><text x="205.0" y="306.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">retained STATE, last will NDEATH</text><rect x="410" y="195" width="330" height="150" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="575.0" y="242.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Edge gateway (OPC UA client -&gt; Sparkplug)</text><text x="575.0" y="258.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">subscriptions: events + data changes</text><text x="575.0" y="274.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">store-and-forward, seq / bdSeq, aliases</text><text x="575.0" y="290.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">replay buffer 4096 events / device</text><text x="575.0" y="306.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">one session per OPC UA server</text><rect x="780" y="195" width="365" height="150" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="962.5" y="242.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">FMS control (Ch. 8)</text><text x="962.5" y="258.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">cell controller, tool management, logistics</text><text x="962.5" y="274.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">OPC UA client: subscriptions for status,</text><text x="962.5" y="290.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">METHOD calls for jobs (JobId = idempotency key)</text><text x="962.5" y="306.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">AGV fleet: VDA 5050 over MQTT (option)</text><rect x="15" y="395" width="1150" height="350" rx="10" fill="none" stroke="#9a988f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="25" y="412" font-size="12" fill="#5f5e57" text-anchor="start" font-weight="bold">Levels 0-1  Machine zones (Z1, one VLAN per area) - conduits only through the level-2 firewall</text><rect x="40" y="430" width="250" height="130" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="165.0" y="475.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Embedded OPC UA server</text><text x="165.0" y="491.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">new machines: CNC option (e.g.</text><text x="165.0" y="507.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">OPC UA for Machine Tools), PLC</text><text x="165.0" y="523.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">server (e.g. S7-1500) - ask supplier</text><rect x="320" y="430" width="250" height="130" rx="8" fill="#fdeee6" stroke="#5f5e57" stroke-width="1.2"/><text x="445.0" y="475.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Retrofit OPC UA server</text><text x="445.0" y="491.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">old CNC / small PLC:</text><text x="445.0" y="507.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">(edge box) reads Modbus / vendor</text><text x="445.0" y="523.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">protocol, exposes the same model</text><rect x="600" y="430" width="260" height="130" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="730.0" y="475.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Information model V2.0</text><text x="730.0" y="491.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Machines/&lt;Device&gt;: Identification,</text><text x="730.0" y="507.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">MachineryItemState, OperationMode,</text><text x="730.0" y="523.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Monitoring, Production, Equipment</text><rect x="890" y="430" width="255" height="130" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="1017.5" y="475.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">21 devices of the case FMS</text><text x="1017.5" y="491.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">7 CNC (3 HMC), pallet system,</text><text x="1017.5" y="507.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">load station, 7 stations, 2 test</text><text x="1017.5" y="523.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">benches, 2 AGV, 2 AS/RS cranes</text><rect x="40" y="590" width="530" height="130" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="305.0" y="635.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Background: OPC UA PubSub (Part 14)</text><text x="305.0" y="651.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">JSON over MQTT = implementable variant of this design;</text><text x="305.0" y="667.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">UADP over UDP / TSN for deterministic cyclic data</text><text x="305.0" y="683.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">(motion, safety-related coordination stays in the PLC)</text><rect x="600" y="590" width="545" height="130" rx="8" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="872.5" y="635.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Safety is not networked</text><text x="872.5" y="651.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">e-stop chains, guards, light curtains, STO hard-wired per machine;</text><text x="872.5" y="667.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">lost network = "no new jobs", never a hazard;</text><text x="872.5" y="683.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">machine accepts jobs only while a controller session is alive</text><line x1="575" y1="430" x2="575" y2="345" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="582" y="395" font-size="11.5" fill="#5f5e57" text-anchor="start">OPC UA SignAndEncrypt</text><line x1="165" y1="430" x2="520" y2="348" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><line x1="445" y1="430" x2="560" y2="348" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><line x1="410" y1="270" x2="372" y2="270" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="375" y="262" font-size="11" fill="#5f5e57" text-anchor="start">publish</text><line x1="205" y1="195" x2="560" y2="117" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="395" y="150" font-size="11" fill="#5f5e57" text-anchor="start">subscribe (primary host)</text><line x1="900" y1="345" x2="900" y2="432" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="906" y="395" font-size="11.5" fill="#5f5e57" text-anchor="start">methods + subscriptions</text><line x1="860" y1="195" x2="640" y2="117" stroke="#5f5e57" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="800" y="150" font-size="11" fill="#5f5e57" text-anchor="start">MQTT (status, plans)</text><line x1="375" y1="117" x2="300" y2="193" stroke="#5f5e57" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="325" y="150" font-size="11" fill="#5f5e57" text-anchor="end">MES/ERP topics</text></svg>