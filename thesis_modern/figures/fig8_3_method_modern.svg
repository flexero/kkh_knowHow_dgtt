<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Arial, Helvetica, sans-serif"><title>Job command: method call versus toggle-bit handshake</title><rect width="1180" height="560" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f5e57"/></marker></defs><text x="30" y="28" font-size="14" fill="#1f1f1e" text-anchor="start" font-weight="bold">a) Edition 1: toggle-bit handshake over Modbus TCP</text><text x="30" y="48" font-size="12" fill="#5f5e57" text-anchor="start">fmsctl DeviceLink.command(): 11 request/response transactions per job [measured]</text><line x1="130" y1="70" x2="130" y2="520" stroke="#1f1f1e" stroke-width="1.6"/><line x1="470" y1="70" x2="470" y2="520" stroke="#1f1f1e" stroke-width="1.6"/><rect x="70" y="60" width="120" height="30" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="130.0" y="79.0" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">FMS controller</text><rect x="410" y="60" width="120" height="30" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="470.0" y="79.0" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">PLC (V1.2 map)</text><line x1="132" y1="112" x2="466" y2="120" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="109" font-size="11" fill="#1f1f1e" text-anchor="middle">FC03 read cmd.ctl</text><line x1="468" y1="126" x2="134" y2="134" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="148" x2="466" y2="156" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="145" font-size="11" fill="#1f1f1e" text-anchor="middle">FC03 read hs.status</text><line x1="468" y1="162" x2="134" y2="170" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="184" x2="466" y2="192" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="181" font-size="11" fill="#1f1f1e" text-anchor="middle">FC16 job id (400-401)</text><line x1="468" y1="198" x2="134" y2="206" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="220" x2="466" y2="228" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="217" font-size="11" fill="#1f1f1e" text-anchor="middle">FC16 parameters (404-405)</text><line x1="468" y1="234" x2="134" y2="242" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="256" x2="466" y2="264" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="253" font-size="11" fill="#1f1f1e" text-anchor="middle">FC16 serial (410-419)</text><line x1="468" y1="270" x2="134" y2="278" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="292" x2="466" y2="300" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="289" font-size="11" fill="#1f1f1e" text-anchor="middle">FC03 read hs.ackSeq</text><line x1="468" y1="306" x2="134" y2="314" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="328" x2="466" y2="336" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="325" font-size="11" fill="#1f1f1e" text-anchor="middle">FC16 cmd.code + seq (200-201)</text><line x1="468" y1="342" x2="134" y2="350" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="364" x2="466" y2="372" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="361" font-size="11" fill="#1f1f1e" text-anchor="middle">FC06 flip REQ (202) - last</text><line x1="468" y1="378" x2="134" y2="386" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="400" x2="466" y2="408" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="397" font-size="11" fill="#1f1f1e" text-anchor="middle">FC03 hs.status: ACK = REQ ?</text><line x1="468" y1="414" x2="134" y2="422" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="436" x2="466" y2="444" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="433" font-size="11" fill="#1f1f1e" text-anchor="middle">FC03 hs.ackSeq = seq ?</text><line x1="468" y1="450" x2="134" y2="458" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="132" y1="472" x2="466" y2="480" stroke="#5f5e57" stroke-width="1.3" marker-end="url(#ah)"/><text x="300" y="469" font-size="11" fill="#1f1f1e" text-anchor="middle">FC03 hs.result</text><line x1="468" y1="486" x2="134" y2="494" stroke="#5f5e57" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="620" y="28" font-size="14" fill="#1f1f1e" text-anchor="start" font-weight="bold">b) Edition 2: OPC UA method call</text><text x="620" y="48" font-size="12" fill="#5f5e57" text-anchor="start">one Call service request/response; JobId = idempotency key</text><line x1="720" y1="70" x2="720" y2="520" stroke="#1f1f1e" stroke-width="1.6"/><line x1="1060" y1="70" x2="1060" y2="520" stroke="#1f1f1e" stroke-width="1.6"/><rect x="660" y="60" width="120" height="30" rx="8" fill="#eaf2fc" stroke="#5f5e57" stroke-width="1.2"/><text x="720.0" y="79.0" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">FMS controller</text><rect x="1000" y="60" width="120" height="30" rx="8" fill="#eaf7f1" stroke="#5f5e57" stroke-width="1.2"/><text x="1060.0" y="79.0" font-size="12" fill="#1f1f1e" text-anchor="middle" font-weight="bold">OPC UA server</text><line x1="722" y1="120" x2="1056" y2="132" stroke="#5f5e57" stroke-width="1.6" marker-end="url(#ah)"/><text x="890" y="114" font-size="11.5" fill="#1f1f1e" text-anchor="middle">Call StartJob(JobId, ProgramNo, Variant, Qty, PalletId)</text><text x="1068" y="150" font-size="11" fill="#5f5e57" text-anchor="start">validate, start job</text><line x1="1058" y1="160" x2="724" y2="172" stroke="#5f5e57" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="890" y="182" font-size="11.5" fill="#1f1f1e" text-anchor="middle">(Status = 0 OK | 2 not ready | 3 bad data | 4 busy, Message)</text><line x1="722" y1="230" x2="1056" y2="242" stroke="#eb6834" stroke-width="1.3" marker-end="url(#ah)"/><text x="890" y="224" font-size="11.5" fill="#eb6834" text-anchor="middle">reply lost? -&gt; repeat with the SAME JobId</text><line x1="1058" y1="255" x2="724" y2="267" stroke="#eb6834" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="890" y="282" font-size="11.5" fill="#eb6834" text-anchor="middle">Status 0 "duplicate": job is not started twice</text><line x1="1058" y1="380" x2="724" y2="392" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#ah)"/><text x="890" y="374" font-size="11.5" fill="#1baf7a" text-anchor="middle">FmsJobFinishedEvent {JobId, Result, Duration} (subscription)</text><text x="890" y="420" font-size="11.5" fill="#5f5e57" text-anchor="middle">or GetJobResult(JobId) after a restart (reconciliation)</text><rect x="640" y="450" width="500" height="70" rx="8" fill="#fdf5e0" stroke="#5f5e57" stroke-width="1.2"/><text x="890.0" y="473.7" font-size="12.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Measured command time (loopback, median / p99) [ms]</text><text x="890.0" y="489.2" font-size="11.0" fill="#1f1f1e" text-anchor="middle">Modbus handshake 0.31 / 0.46   OPC UA call 0.33 / 0.58</text><text x="890.0" y="504.7" font-size="11.0" fill="#1f1f1e" text-anchor="middle">OPC UA SignAndEncrypt 0.39 / 0.63</text></svg>