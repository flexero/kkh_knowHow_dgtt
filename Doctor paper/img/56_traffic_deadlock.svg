<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Node reservation example and a deadlock case</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a5a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#222">Traffic control – (a) node reservation as in fmsctl, (b) a deadlock that node reservation alone cannot prevent</text>
<rect x="20" y="50" width="520" height="500" fill="#fafafa" stroke="#ccc"/>
<text x="35.0" y="75.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">(a) node reservation (fmsctl today)</text>
<line x1="90" y1="160" x2="190" y2="420" stroke="#bbb" stroke-width="6"/>
<line x1="470" y1="200" x2="330" y2="120" stroke="#bbb" stroke-width="6"/>
<circle cx="90" cy="160" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="90.0" y="165.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">1</text>
<circle cx="190" cy="420" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="190.0" y="425.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">2</text>
<circle cx="470" cy="200" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="470.0" y="205.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">7</text>
<circle cx="330" cy="120" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="330.0" y="125.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">8</text>
<rect x="66" y="130" width="48" height="14" fill="#2a78d6"/>
<text x="120.0" y="128.0" font-size="11" text-anchor="start" font-weight="normal" fill="#2a78d6">AGV-01 transport 1 -&gt; 2</text>
<text x="120.0" y="144.0" font-size="11" text-anchor="start" font-weight="normal" fill="#2a78d6">reserves nodes {1, 2}</text>
<rect x="446" y="170" width="48" height="14" fill="#1b8a5a"/>
<text x="330.0" y="168.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1b8a5a">AGV-02 7 -&gt; 8: {7, 8}</text>
<text x="35.0" y="470.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">New kanban order 1 -&gt; 2 while AGV-01 holds {1, 2}: skipped until done.</text>
<text x="35.0" y="488.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">An FG order 7 -&gt; 8 does not share a node: assigned in parallel.</text>
<text x="35.0" y="506.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Not covered: crossing paths between nodes, an idle AGV that</text>
<text x="35.0" y="524.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">stands on a node (no reservation), two AGVs meeting head-on.</text>
<rect x="560" y="50" width="520" height="500" fill="#fafafa" stroke="#ccc"/>
<text x="575.0" y="75.0" font-size="14" text-anchor="start" font-weight="bold" fill="#222">(b) deadlock: circular wait on a single-lane spur</text>
<rect x="600" y="230" width="380" height="40" fill="#eee" stroke="#999"/>
<text x="790.0" y="225.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">single-lane spur to the load station (one AGV wide)</text>
<circle cx="1000" cy="250" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1000.0" y="255.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">2</text>
<circle cx="600" cy="250" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="600.0" y="255.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">J</text>
<text x="600.0" y="290.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">junction</text>
<rect x="940" y="238" width="44" height="24" fill="#2a78d6"/>
<text x="962.0" y="304.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#2a78d6">AGV-01 idle at node 2</text>
<text x="962.0" y="320.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#2a78d6">(after drop, needs to leave via J)</text>
<rect x="660" y="238" width="44" height="24" fill="#c0392b"/>
<text x="682.0" y="340.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#c0392b">AGV-02 enters to deliver to 2</text>
<line x1="706" y1="250" x2="930" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
<path d="M940,262 C900,300 760,300 712,266" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arb)"/>
<text x="575.0" y="390.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">AGV-02 holds the spur and waits for node 2; AGV-01 holds node 2 and</text>
<text x="575.0" y="408.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">waits for the spur: circular wait. All 4 Coffman conditions hold:</text>
<text x="575.0" y="428.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">1 mutual exclusion  2 hold and wait  3 no pre-emption  4 circular wait</text>
<text x="575.0" y="452.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Avoidance: reserve the WHOLE path (spur + dock) before entry;</text>
<text x="575.0" y="470.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">send idle AGVs to a park node off the spur; one-way loops;</text>
<text x="575.0" y="488.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">a dock is free only if no vehicle stands on it (occupancy).</text>
<text x="20.0" y="580.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Code today: _reserved_nodes() = {frm, too} of transports in status assigned + charger targets of active cmd 21. Values: schematic example.</text>
</svg>