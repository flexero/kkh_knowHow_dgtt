<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Arial, Helvetica, sans-serif">
<title>Tool data flow from presetter through tool manager and setter screen to the CNC with command 14</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">Tool data flow – presetter → tool manager → setter → CNC (command 14, Modbus TCP) → remaining life back (registers 310–339)</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#444">Only Ethernet, Modbus TCP and HTTP. No cloud. The CNC counts the uses; the tool manager knows which physical tool (serial, offsets) sits in which pocket.</text>
<rect x="30.0" y="100.0" width="220.0" height="110.0" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
<text x="140.0" y="136.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">1 Presetter</text>
<text x="140.0" y="151.7" font-size="12" text-anchor="middle" fill="#111">measures L and R</text>
<text x="140.0" y="166.7" font-size="12" text-anchor="middle" fill="#111">of the assembled tool</text>
<text x="140.0" y="181.7" font-size="12" text-anchor="middle" fill="#111">export CSV / label</text>
<rect x="330.0" y="100.0" width="260.0" height="110.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="460.0" y="136.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">2 Tool manager (fmsctl)</text>
<text x="460.0" y="151.7" font-size="12" text-anchor="middle" fill="#111">POST /api/tools/import</text>
<text x="460.0" y="166.7" font-size="12" text-anchor="middle" fill="#111">tool_item: serial, type, L, R,</text>
<text x="460.0" y="181.7" font-size="12" text-anchor="middle" fill="#111">measured, status = store</text>
<rect x="670.0" y="100.0" width="240.0" height="110.0" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.2"/>
<text x="790.0" y="136.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">3 Setter screen /tools</text>
<text x="790.0" y="151.7" font-size="12" text-anchor="middle" fill="#111">change request → choose</text>
<text x="790.0" y="166.7" font-size="12" text-anchor="middle" fill="#111">serial → press "Mounted"</text>
<text x="790.0" y="181.7" font-size="12" text-anchor="middle" fill="#111">POST /api/tools/complete</text>
<rect x="960.0" y="100.0" width="210.0" height="110.0" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
<text x="1065.0" y="136.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">4 Mount tool</text>
<text x="1065.0" y="151.7" font-size="12" text-anchor="middle" fill="#111">in the magazine pocket</text>
<text x="1065.0" y="166.7" font-size="12" text-anchor="middle" fill="#111">(RFID read = option,</text>
<text x="1065.0" y="181.7" font-size="12" text-anchor="middle" fill="#111">chapter 13)</text>
<line x1="250.0" y1="155.0" x2="328.0" y2="155.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="289.0" y="146.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">CSV</text>
<line x1="590.0" y1="155.0" x2="668.0" y2="155.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="629.0" y="146.0" font-size="11" text-anchor="middle" fill="#111">store list</text>
<line x1="910.0" y1="155.0" x2="958.0" y2="155.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="140.0" y="232.0" font-size="12" text-anchor="middle" fill="#1565c0">serial;type;length;radius</text>
<text x="140.0" y="248.0" font-size="12" text-anchor="middle" fill="#1565c0">T10-0101;T10;142.315;4.000</text>
<rect x="330.0" y="290.0" width="580.0" height="250.0" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.2"/>
<text x="345.0" y="312.0" font-size="13" text-anchor="start" fill="#111" font-weight="bold">5 Command 14 "tool data" – cell controller → CNC gateway (Modbus TCP, FC16 / FC06)</text>
<text x="345.0" y="336.0" font-size="11" text-anchor="start" fill="#555" font-weight="bold">register</text>
<text x="420.0" y="336.0" font-size="11" text-anchor="start" fill="#555" font-weight="bold">name</text>
<text x="560.0" y="336.0" font-size="11" text-anchor="start" fill="#555" font-weight="bold">type</text>
<text x="620.0" y="336.0" font-size="11" text-anchor="start" fill="#555" font-weight="bold">meaning</text>
<text x="345.0" y="361.0" font-size="12" text-anchor="start" fill="#111">400–401</text>
<text x="420.0" y="361.0" font-size="12" text-anchor="start" fill="#1565c0">job.id</text>
<text x="560.0" y="361.0" font-size="12" text-anchor="start" fill="#111">UINT32</text>
<text x="620.0" y="361.0" font-size="12" text-anchor="start" fill="#111">job number (echo in job.idDone 390)</text>
<text x="345.0" y="386.0" font-size="12" text-anchor="start" fill="#111">402</text>
<text x="420.0" y="386.0" font-size="12" text-anchor="start" fill="#1565c0">tool.pocket</text>
<text x="560.0" y="386.0" font-size="12" text-anchor="start" fill="#111">UINT16</text>
<text x="620.0" y="386.0" font-size="12" text-anchor="start" fill="#111">magazine pocket 1–30</text>
<text x="345.0" y="411.0" font-size="12" text-anchor="start" fill="#111">404–405</text>
<text x="420.0" y="411.0" font-size="12" text-anchor="start" fill="#1565c0">tool.length_mm</text>
<text x="560.0" y="411.0" font-size="12" text-anchor="start" fill="#111">REAL</text>
<text x="620.0" y="411.0" font-size="12" text-anchor="start" fill="#111">length offset from the presetter</text>
<text x="345.0" y="436.0" font-size="12" text-anchor="start" fill="#111">406–407</text>
<text x="420.0" y="436.0" font-size="12" text-anchor="start" fill="#1565c0">tool.radius_mm</text>
<text x="560.0" y="436.0" font-size="12" text-anchor="start" fill="#111">REAL</text>
<text x="620.0" y="436.0" font-size="12" text-anchor="start" fill="#111">radius offset from the presetter</text>
<text x="345.0" y="461.0" font-size="12" text-anchor="start" fill="#111">408</text>
<text x="420.0" y="461.0" font-size="12" text-anchor="start" fill="#1565c0">tool.lifeSet</text>
<text x="560.0" y="461.0" font-size="12" text-anchor="start" fill="#111">UINT16</text>
<text x="620.0" y="461.0" font-size="12" text-anchor="start" fill="#111">remaining life, 1000 = 100 % (new)</text>
<text x="345.0" y="486.0" font-size="12" text-anchor="start" fill="#111">200 / 201</text>
<text x="420.0" y="486.0" font-size="12" text-anchor="start" fill="#1565c0">cmd.code / cmd.seq</text>
<text x="560.0" y="486.0" font-size="12" text-anchor="start" fill="#111">UINT16</text>
<text x="620.0" y="486.0" font-size="12" text-anchor="start" fill="#111">14 / sequence number</text>
<text x="345.0" y="511.0" font-size="12" text-anchor="start" fill="#111">202</text>
<text x="420.0" y="511.0" font-size="12" text-anchor="start" fill="#1565c0">cmd.ctl bit0</text>
<text x="560.0" y="511.0" font-size="12" text-anchor="start" fill="#111">REQ</text>
<text x="620.0" y="511.0" font-size="12" text-anchor="start" fill="#111">toggle LAST → ACK, BUSY, DONE</text>
<line x1="790.0" y1="210.0" x2="790.0" y2="288.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="798.0" y="255.0" font-size="11" text-anchor="start" fill="#111">on "Mounted"</text>
<rect x="980.0" y="300.0" width="190.0" height="230.0" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="1075.0" y="366.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">6 CNC + PMC/PLC</text>
<text x="1075.0" y="381.7" font-size="12" text-anchor="middle" fill="#111">gateway logic:</text>
<text x="1075.0" y="396.7" font-size="12" text-anchor="middle" fill="#111">write length offset</text>
<text x="1075.0" y="411.7" font-size="12" text-anchor="middle" fill="#111">write radius offset</text>
<text x="1075.0" y="426.7" font-size="12" text-anchor="middle" fill="#111">reset life counter</text>
<text x="1075.0" y="441.7" font-size="12" text-anchor="middle" fill="#111">of the pocket</text>
<text x="1075.0" y="456.7" font-size="12" text-anchor="middle" fill="#111">echo 340 / 342 / 344</text>
<text x="1075.0" y="471.7" font-size="12" text-anchor="middle" fill="#111">DONE toggle</text>
<line x1="910.0" y1="415.0" x2="978.0" y2="415.0" stroke="#c62828" stroke-width="2.5" marker-end="url(#ahr)"/>
<text x="944.0" y="405.0" font-size="11" text-anchor="middle" fill="#c62828">Modbus</text>
<rect x="330.0" y="580.0" width="580.0" height="120.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="345.0" y="602.0" font-size="13" text-anchor="start" fill="#111" font-weight="bold">7 Polling every loop (cell controller): registers 310–339 → toolLife[1..30] (0.1 %)</text>
<text x="345.0" y="624.0" font-size="12" text-anchor="start" fill="#111">• check(machine, program, qty) before every job: group life ≥ ΔL + 2 % reserve</text>
<text x="345.0" y="644.0" font-size="12" text-anchor="start" fill="#111">• forecast: pockets that reach the warning limit within 20 parts</text>
<text x="345.0" y="664.0" font-size="12" text-anchor="start" fill="#111">• snapshot for the setter screen; echo 340–345 = proof that the data arrived</text>
<text x="345.0" y="684.0" font-size="12" text-anchor="start" fill="#111">• on_job_done: tool_item.uses += uses × qty</text>
<line x1="1075.0" y1="530.0" x2="1075.0" y2="640.0" stroke="#2e7d32" stroke-width="2"/>
<line x1="1075.0" y1="640.0" x2="912.0" y2="640.0" stroke="#2e7d32" stroke-width="2" marker-end="url(#ah)"/>
<text x="1083.0" y="590.0" font-size="11" text-anchor="start" fill="#2e7d32">FC03 read</text>
<text x="30.0" y="300.0" font-size="13" text-anchor="start" fill="#111" font-weight="bold">Tool item states (tool_item.status)</text>
<rect x="30.0" y="320.0" width="120.0" height="50.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="90.0" y="341.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">store</text>
<text x="90.0" y="356.7" font-size="12" text-anchor="middle" fill="#111">measured, ready</text>
<rect x="30.0" y="410.0" width="120.0" height="50.0" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.2"/>
<text x="90.0" y="431.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">machine</text>
<text x="90.0" y="446.7" font-size="12" text-anchor="middle" fill="#111">in pocket</text>
<rect x="30.0" y="500.0" width="120.0" height="50.0" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="90.0" y="521.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">regrind</text>
<text x="90.0" y="536.7" font-size="12" text-anchor="middle" fill="#111">removed</text>
<rect x="180.0" y="410.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#777" stroke-width="1.2"/>
<text x="240.0" y="431.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">scrap</text>
<text x="240.0" y="446.7" font-size="12" text-anchor="middle" fill="#111">(gap: missing)</text>
<line x1="90.0" y1="370.0" x2="90.0" y2="408.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="98.0" y="394.0" font-size="11" text-anchor="start" fill="#111">complete()</text>
<line x1="90.0" y1="460.0" x2="90.0" y2="498.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="98.0" y="484.0" font-size="11" text-anchor="start" fill="#111">replaced</text>
<path d="M30.0,525.0 L14.0,525.0 L14.0,345.0 L28.0,345.0" stroke="#333" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
<line x1="14" y1="346" x2="28" y2="346" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="18.0" y="600.0" font-size="11" text-anchor="start" fill="#111">re-measure +</text>
<text x="18.0" y="615.0" font-size="11" text-anchor="start" fill="#111">import (resets</text>
<text x="18.0" y="630.0" font-size="11" text-anchor="start" fill="#111">history – gap)</text>
<line x1="150.0" y1="525.0" x2="238.0" y2="462.0" stroke="#777" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ah)"/>
<text x="24.0" y="740.0" font-size="12" text-anchor="start" fill="#444">Command 14 shares addresses 402–408 with command 10 (job.palletId, programNo, variant, qty, fixtureId): the PLC interprets them by cmd.code.</text>
</svg>