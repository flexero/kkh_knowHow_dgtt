<text x="642" y="206.5" font-size="12" text-anchor="start" font-weight="bold" fill="#6a1b9a">HTTP / JSON</text>
<line x1="630" y1="295" x2="630" y2="325" stroke="#6a1b9a" stroke-width="2" marker-end="url(#av)" marker-start="url(#av)"/>
<text x="642" y="314.0" font-size="12" text-anchor="start" font-weight="bold" fill="#6a1b9a">HTTP / JSON</text>
<line x1="630" y1="505" x2="630" y2="570" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)" marker-start="url(#ab)"/>
<text x="642" y="541.5" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Modbus TCP (FC03/04/06/16)</text>
<line x1="630" y1="700" x2="630" y2="775" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="642" y="741.5" font-size="12" text-anchor="start" font-weight="bold" fill="#2e7d32">hard-wired I/O, drives, fieldbus inside the machine</text>
<rect x="1080" y="95" width="290" height="110" rx="0" fill="#f5f5f5" stroke="#000" stroke-width="1.2"/>
<text x="1225.0" y="130.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Digital twin (separate)</text>
<text x="1225.0" y="146.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">reads HTTP snapshots</text>
<text x="1225.0" y="162.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">simulates – never commands</text>
<text x="1225.0" y="178.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">the real machines</text>
<line x1="1080" y1="150" x2="1040" y2="400" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#av)" stroke-dasharray="6 4"/>
<text x="1050" y="270" font-size="12" text-anchor="start" font-weight="normal" fill="#6a1b9a">HTTP</text>
<rect x="1080" y="230" width="290" height="120" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="1225.0" y="262.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Responsibilities</text>
<text x="1225.0" y="278.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L3/L4: what and when (orders)</text>
<text x="1225.0" y="294.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L2: which pallet, which machine,</text>
<text x="1225.0" y="310.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">which program, which tool</text>
<text x="1225.0" y="326.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L1: how – motion, interlocks</text>
<rect x="1080" y="380" width="290" height="400" rx="0" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="1225" y="410" font-size="15" text-anchor="middle" font-weight="bold" fill="#c62828">SAFETY – hard-wired</text>
<text x="1225" y="440" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">e-stop chains, guard doors,</text>
<text x="1225" y="462" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">light curtains, STO,</text>
<text x="1225" y="484" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">safety relays / F-CPU per machine</text>
<text x="1225" y="506" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">(ISO 13849-1, IEC 60204-1)</text>
<text x="1225" y="528" font-size="12" text-anchor="middle" font-weight="normal" fill="#000"></text>
<text x="1225" y="550" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">NEVER over Modbus or HTTP.</text>
<text x="1225" y="572" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">Register 4 bit 4 = e-stop COPY</text>
<text x="1225" y="594" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">for display only.</text>
<text x="1225" y="616" font-size="12" text-anchor="middle" font-weight="normal" fill="#000"></text>
<text x="1225" y="638" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">A lost network = no new jobs,</text>
<text x="1225" y="660" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">running cycles finish safely,</text>
<text x="1225" y="682" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">PLC watchdog on register 226</text>
<text x="1225" y="704" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">(5 s) – never a hazard.</text>
<line x1="1080" y1="640" x2="1040" y2="640" stroke="#c62828" stroke-width="2" stroke-dasharray="5 3"/>
<text x="40" y="880" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Item numbers: 1 interface (this guide), 2 cell controller, 3 tool management, 4 AGV + AS/RS, 5 MES, 6 ERP – see the overview table in chapter 1.</text>
