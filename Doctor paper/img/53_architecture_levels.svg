<rect x="831" y="362" width="190" height="62" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="926.0" y="381.85" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">HTTP server</text>
<text x="926.0" y="396.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">REST + JSON</text>
<text x="926.0" y="411.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">operator screens</text>
<rect x="240" y="436" width="781" height="56" rx="0" fill="#fffde7" stroke="#000" stroke-width="1.2"/>
<text x="630.5" y="460.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">ITEM 1 (this guide): register map V1.2 · Modbus TCP driver (core/modbus.py) · DeviceLink + toggle-bit handshake</text>
<text x="630.5" y="476.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">(core/device.py) · device list + IP plan (spec/plant.py) · virtual plant (sim/virtual_plant.py)</text>
<rect x="220" y="570" width="820" height="130" rx="0" fill="#e8f5e9" stroke="#000" stroke-width="1.2"/>
<text x="240" y="592" font-size="13" text-anchor="start" font-weight="bold" fill="#000">21 Modbus TCP servers (port 502, unit id 1) – each runs the standard interface FB V1.2</text>
