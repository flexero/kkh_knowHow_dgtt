<text x="516.0" y="664.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">operator station</text>
<rect x="577" y="605" width="108" height="82" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
