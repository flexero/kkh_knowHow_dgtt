<text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Control hierarchy of the compressor FMS – who does what, over which protocol</text>
<text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">ISA-95 / IEC 62264 levels, ISO 23247 entities · only Ethernet, Modbus TCP and HTTP · safety never over the network</text>
