<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" font-family="Arial, Helvetica, sans-serif">
<title>Flowchart of the tool check before every HMC job as implemented in fmsctl ToolManager.check</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
<rect x="0" y="0" width="1100" height="900" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Tool check before every HMC job – ToolManager.check(machine, program, qty) exactly as implemented</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#444">Units: 0.1 % (register unit). RESERVE = 20 (= 2 %). Life per pocket from CNC registers 310–339.</text>
<rect x="230.0" y="80.0" width="300.0" height="50.0" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
<text x="380.0" y="101.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">start: dispatcher wants to send job</text>
<text x="380.0" y="116.7" font-size="12" text-anchor="middle" fill="#111">pallet at HMC, machine READY</text>
<line x1="380.0" y1="130.0" x2="380.0" y2="160.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<path d="M380.0,160.0 L530.0,205.0 L380.0,250.0 L230.0,205.0 Z" stroke="#ef6c00" stroke-width="1.5" fill="#fff8e1"/>
<text x="380.0" y="201.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">life list from CNC empty?</text>
<text x="380.0" y="217.0" font-size="12" text-anchor="middle" fill="#111">(machine offline / not polled)</text>
<line x1="530.0" y1="205.0" x2="720.0" y2="205.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="560.0" y="197.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">yes</text>
<rect x="720.0" y="180.0" width="330.0" height="50.0" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="885.0" y="201.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">BLOCK: "no tool data from the CNC"</text>
<text x="885.0" y="216.7" font-size="12" text-anchor="middle" fill="#111">no job</text>
<line x1="380.0" y1="250.0" x2="380.0" y2="280.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="388.0" y="270.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">no</text>
<rect x="210.0" y="280.0" width="340.0" height="60.0" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.2"/>
<text x="380.0" y="306.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">for every (tool type, uses/part)</text>
<text x="380.0" y="321.7" font-size="12" text-anchor="middle" fill="#111">in PROGRAM_TOOLS[program]</text>
<line x1="380.0" y1="340.0" x2="380.0" y2="365.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<rect x="190.0" y="365.0" width="380.0" height="80.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="380.0" y="394.2" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">need = 1000 · uses · qty / life + 20</text>
<text x="380.0" y="409.2" font-size="12" text-anchor="middle" fill="#111">have = Σ remaining life of all pockets</text>
<text x="380.0" y="424.2" font-size="12" text-anchor="middle" fill="#111">of this type (sister group)</text>
<line x1="380.0" y1="445.0" x2="380.0" y2="470.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<path d="M380.0,470.0 L510.0,515.0 L380.0,560.0 L250.0,515.0 Z" stroke="#ef6c00" stroke-width="1.5" fill="#fff8e1"/>
<text x="380.0" y="519.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">have &lt; need ?</text>
<line x1="510.0" y1="515.0" x2="640.0" y2="515.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="560.0" y="507.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">yes</text>
<rect x="640.0" y="470.0" width="410.0" height="95.0" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="845.0" y="499.2" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">add reason "T10 Tap M8: 3.0 % left in group,</text>
<text x="845.0" y="514.2" font-size="12" text-anchor="middle" fill="#111">job needs 3.1 %"</text>
<text x="845.0" y="529.2" font-size="12" text-anchor="middle" fill="#111">request(machine, worst pocket, type)</text>
<text x="845.0" y="544.2" font-size="12" text-anchor="middle" fill="#111">(no duplicate if the pocket has an open request)</text>
<line x1="380.0" y1="560.0" x2="380.0" y2="600.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="388.0" y="585.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">no</text>
<line x1="845.0" y1="565.0" x2="845.0" y2="620.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<line x1="845.0" y1="620.0" x2="520.0" y2="620.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<path d="M380.0,600.0 L520.0,640.0 L380.0,680.0 L240.0,640.0 Z" stroke="#ef6c00" stroke-width="1.5" fill="#fff8e1"/>
<text x="380.0" y="644.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">more tool types?</text>
<path d="M240.0,640.0 L120.0,640.0 L120.0,310.0 L208.0,310.0" stroke="#333" stroke-width="1.2" fill="none"/>
<line x1="120" y1="310" x2="208" y2="310" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="128.0" y="630.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">yes</text>
<line x1="380.0" y1="680.0" x2="380.0" y2="710.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="388.0" y="700.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">no</text>
<path d="M380.0,710.0 L510.0,750.0 L380.0,790.0 L250.0,750.0 Z" stroke="#ef6c00" stroke-width="1.5" fill="#fff8e1"/>
<text x="380.0" y="754.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">any reasons?</text>
<line x1="510.0" y1="750.0" x2="640.0" y2="750.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="560.0" y="742.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">yes</text>
<rect x="640.0" y="715.0" width="410.0" height="75.0" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="845.0" y="741.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">BLOCK: return (False, reasons)</text>
<text x="845.0" y="756.7" font-size="12" text-anchor="middle" fill="#111">event "tool check blocks O1020 …" (once per</text>
<text x="845.0" y="771.7" font-size="12" text-anchor="middle" fill="#111">new set of reasons) → pallet goes to another HMC</text>
<line x1="380.0" y1="790.0" x2="380.0" y2="815.0" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
<text x="388.0" y="806.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">no</text>
<rect x="210.0" y="815.0" width="340.0" height="50.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="380.0" y="836.7" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">OK: return (True, []) → send command 10</text>
<text x="380.0" y="851.7" font-size="12" text-anchor="middle" fill="#111">after the job: on_job_done adds uses</text>
<text x="640.0" y="830.0" font-size="12" text-anchor="start" fill="#333">Worked numbers (test_item3): pocket 11 = 0, pocket 12 = 30</text>
<text x="640.0" y="848.0" font-size="12" text-anchor="start" fill="#333" font-weight="bold">need = 1000 · 16 · 1 / 1500 + 20 = 30.67;  have = 30 → BLOCK</text>
</svg>