<text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Example design: managed L2 cell switches, L3 core + firewall, no internet · VLAN id = 700 + zone (example) · Modbus TCP port 502 only from 10.70.1.10</text>
