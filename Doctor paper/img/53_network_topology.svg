<text x="55" y="838" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Rules (example design): static IPs, no DHCP for machines · one VLAN = one subnet = one zone · machines only answer TCP 502 (+ engineering</text>
<text x="55" y="858" font-size="12" text-anchor="start" font-weight="normal" fill="#000">protocol from 10.70.1.20 during a maintenance window) · port security / unused ports shut · LLDP on · fibre between core and cell</text>
<text x="55" y="878" font-size="12" text-anchor="start" font-weight="normal" fill="#000">switches &gt; 90 m or across the hall, Cat6A S/FTP for copper · AGVs are Modbus servers on Wi-Fi (WPA2/3-Enterprise or PSK, separate SSID, hidden).</text>
