<text x="46.0" y="608.0" font-size="11" text-anchor="start" fill="#c62828">1 open request: machine, pocket, type, reason (raised by the tool check or the</text>
<text x="60.0" y="622.0" font-size="11" text-anchor="start" fill="#c62828">forecast)</text>
<text x="46.0" y="638.0" font-size="11" text-anchor="start" fill="#c62828">2 serial list = measured tools of the same type in store; "Mounted" → command 14 → CNC</text>
<text x="60.0" y="652.0" font-size="11" text-anchor="start" fill="#c62828">life 100 %, offsets</text>
<text x="46.0" y="668.0" font-size="11" text-anchor="start" fill="#c62828">3 forecast: work list for the coming shift – prepare these tools BEFORE they block a</text>
<text x="60.0" y="682.0" font-size="11" text-anchor="start" fill="#c62828">job</text>
<text x="46.0" y="698.0" font-size="11" text-anchor="start" fill="#c62828">4 presetter CSV: serial;type;length;radius, "," or ";" accepted, header optional</text>
<text x="46.0" y="714.0" font-size="11" text-anchor="start" fill="#c62828">5 bar = CNC registers 310–339 (polled), not a calculation in the PC</text>
<text x="46.0" y="730.0" font-size="11" text-anchor="start" fill="#c62828">6 pocket 12 at 0 % stays in the magazine – its sister 11 carries the group (CNC</text>
<text x="60.0" y="744.0" font-size="11" text-anchor="start" fill="#c62828">switches)</text>
