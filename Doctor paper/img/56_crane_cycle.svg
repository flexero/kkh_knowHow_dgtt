<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Crane single and dual command cycle with FEM 9.851 reference points</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a5a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#222">Stacker crane cycle – FEM 9.851 reference points P1 (L/5, 2H/3) and P2 (2L/3, H/5), ASRS-RAW example data</text>
<rect x="80" y="70" width="560" height="260" fill="#f4f6f8" stroke="#555"/>
<line x1="141.9" y1="70" x2="141.9" y2="330" stroke="#ddd"/>
<line x1="180.1" y1="70" x2="180.1" y2="330" stroke="#ddd"/>
<line x1="218.3" y1="70" x2="218.3" y2="330" stroke="#ddd"/>
<line x1="256.4" y1="70" x2="256.4" y2="330" stroke="#ddd"/>
<line x1="294.6" y1="70" x2="294.6" y2="330" stroke="#ddd"/>
<line x1="332.7" y1="70" x2="332.7" y2="330" stroke="#ddd"/>
<line x1="370.9" y1="70" x2="370.9" y2="330" stroke="#ddd"/>
<line x1="409.1" y1="70" x2="409.1" y2="330" stroke="#ddd"/>
<line x1="447.2" y1="70" x2="447.2" y2="330" stroke="#ddd"/>
<line x1="485.4" y1="70" x2="485.4" y2="330" stroke="#ddd"/>
<line x1="523.5" y1="70" x2="523.5" y2="330" stroke="#ddd"/>
<line x1="561.7" y1="70" x2="561.7" y2="330" stroke="#ddd"/>
<line x1="599.9" y1="70" x2="599.9" y2="330" stroke="#ddd"/>
<line x1="638.0" y1="70" x2="638.0" y2="330" stroke="#ddd"/>
<circle cx="80" cy="330" r="8" fill="#c47f00"/>
<text x="70.0" y="354.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c47f00">I/O (0, 0)</text>
<circle cx="192.0" cy="156.7" r="8" fill="#2a78d6"/>
<text x="204.0" y="148.7" font-size="12" text-anchor="start" font-weight="bold" fill="#2a78d6">P1 (5.65 m, 4.80 m)</text>
<circle cx="453.3" cy="278.0" r="8" fill="#1b8a5a"/>
<text x="465.3" y="270.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1b8a5a">P2 (18.83 m, 1.44 m)</text>
<line x1="80" y1="330" x2="192.0" y2="156.7" stroke="#2a78d6" stroke-width="2" marker-end="url(#arb)"/>
<line x1="192.0" y1="156.7" x2="453.3" y2="278.0" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="453.3" y1="278.0" x2="86" y2="328" stroke="#1b8a5a" stroke-width="2" marker-end="url(#arg)"/>
<text x="360.0" y="354.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">L = 1.2 + 27.05 = 28.25 m (I/O transfer point to the last crate position)</text>
<text x="660" y="200.0" font-size="12" transform="rotate(90 660 200.0)" text-anchor="middle">H = 7.95 - 0.75 = 7.2 m</text>
<text x="690.0" y="80.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Move table (travel and hoist together, slower axis decides)</text>
<text x="690.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">Move</text>
<text x="756.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">dx m</text>
<text x="822.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">t_x s</text>
<text x="888.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">dz m</text>
<text x="954.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">t_z s</text>
<text x="1020.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">move s</text>
<text x="690.0" y="128.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">I/O to P1</text>
<text x="756.0" y="128.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">5.65</text>
<text x="822.0" y="128.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">6.72</text>
<text x="888.0" y="128.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">4.80</text>
<text x="954.0" y="128.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">6.80</text>
<text x="1020.0" y="128.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">6.80</text>
<text x="690.0" y="150.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">I/O to P2</text>
<text x="756.0" y="150.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">18.83</text>
<text x="822.0" y="150.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">12.28</text>
<text x="888.0" y="150.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">1.44</text>
<text x="954.0" y="150.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">3.39</text>
<text x="1020.0" y="150.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">12.28</text>
<text x="690.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">P1 to P2</text>
<text x="756.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">13.18</text>
<text x="822.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">10.27</text>
<text x="888.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">3.36</text>
<text x="954.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">5.36</text>
<text x="1020.0" y="172.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">10.27</text>
<text x="690.0" y="210.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">t(d) = d/v + v/a if d &gt;= v²/a, else 2·sqrt(d/a)</text>
<text x="690.0" y="230.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">travel: v 3 m/s, a 0.5 m/s² (full speed only if d &gt;= 18 m)</text>
<text x="690.0" y="250.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">hoist: v 1 m/s, a 0.5 m/s² (full speed if d &gt;= 2 m)</text>
<text x="690.0" y="270.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">stop = position 3.0 + fork out 2.18 + lift 0.5 + fork in 2.18 = 7.87 s</text>
<text x="690.0" y="290.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">load handling (LHD) = 4.87 s</text>
<text x="20.0" y="415.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Single cycle to P1</text>
<rect x="200.0" y="400" width="57.8" height="22" fill="#2a78d6" stroke="#fff"/>
<text x="228.9" y="415.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">to P1</text>
<rect x="257.8" y="400" width="66.9" height="22" fill="#f2c14e" stroke="#fff"/>
<text x="291.2" y="415.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">stop</text>
<rect x="324.7" y="400" width="57.8" height="22" fill="#2a78d6" stroke="#fff"/>
<text x="353.6" y="415.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">back</text>
<rect x="382.5" y="400" width="66.9" height="22" fill="#f2c14e" stroke="#fff"/>
<text x="415.9" y="415.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">stop</text>
<text x="457.4" y="415.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">29.3 s</text>
<text x="20.0" y="451.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Single cycle to P2</text>
<rect x="200.0" y="436" width="104.4" height="22" fill="#1b8a5a" stroke="#fff"/>
<text x="252.2" y="451.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">to P2</text>
<rect x="304.4" y="436" width="66.9" height="22" fill="#f2c14e" stroke="#fff"/>
<text x="337.8" y="451.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">stop</text>
<rect x="371.3" y="436" width="104.4" height="22" fill="#1b8a5a" stroke="#fff"/>
<text x="423.5" y="451.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">back</text>
<rect x="475.7" y="436" width="66.9" height="22" fill="#f2c14e" stroke="#fff"/>
<text x="509.1" y="451.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">stop</text>
<text x="550.5" y="451.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">40.3 s</text>
<text x="200.0" y="482.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">FEM single cycle t_SC = mean of P1 and P2 cycles = (2·6.80 + 2·12.28)/2 + 2·7.87 = 34.8 s  -&gt;  103 jobs/h</text>
<text x="20.0" y="515.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Dual cycle</text>
<rect x="200.0" y="500" width="41.4" height="22" fill="#f2c14e" stroke="#fff"/>
<text x="220.7" y="515.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">LHD</text>
<rect x="241.4" y="500" width="57.8" height="22" fill="#2a78d6" stroke="#fff"/>
<text x="270.3" y="515.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">I/O-P1</text>
<rect x="299.2" y="500" width="25.5" height="22" fill="#555" stroke="#fff"/>
<rect x="324.7" y="500" width="41.4" height="22" fill="#f2c14e" stroke="#fff"/>
<text x="345.4" y="515.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">LHD</text>
<rect x="366.1" y="500" width="87.3" height="22" fill="#333" stroke="#fff"/>
<text x="409.7" y="515.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">P1-P2</text>
<rect x="453.4" y="500" width="25.5" height="22" fill="#555" stroke="#fff"/>
<rect x="478.9" y="500" width="41.4" height="22" fill="#f2c14e" stroke="#fff"/>
<text x="499.6" y="515.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">LHD</text>
<rect x="520.3" y="500" width="104.4" height="22" fill="#1b8a5a" stroke="#fff"/>
<text x="572.5" y="515.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">P2-I/O</text>
<rect x="624.7" y="500" width="25.5" height="22" fill="#555" stroke="#fff"/>
<rect x="650.2" y="500" width="41.4" height="22" fill="#f2c14e" stroke="#fff"/>
<text x="670.9" y="515.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">LHD</text>
<text x="699.6" y="515.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">57.8 s</text>
<text x="200.0" y="546.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">FEM dual cycle t_DC = 6.80 + 10.27 + 12.28 + 4·4.87 + 3·3.0 = 57.8 s for 2 jobs -&gt; 28.9 s per job -&gt; 125 jobs/h</text>
<text x="200.0" y="566.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Dark grey = fine positioning 3.0 s. Config crane_cycle_s = 50 s per job is 44 % above the FEM single cycle: it is a planning margin</text>
<text x="200.0" y="584.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">(I/O conveyor transfer, telegrams, slower real drives). Measure the real values at SAT (chapter 27). All values: calculated example.</text>
</svg>