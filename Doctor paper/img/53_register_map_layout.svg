<text x="392" y="344" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">22-23 std.scrap UINT32</text>
<text x="392" y="368" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">24-25 std.lastCycle_s REAL</text>
<text x="392" y="392" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">26-35 std.order ASCII20</text>
<text x="392" y="416" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">36-45 std.part ASCII20</text>
<text x="392" y="440" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">100-101 std.power_kW REAL</text>
<text x="392" y="464" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">102-103 std.energy_kWh REAL</text>
<text x="392" y="488" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">104-105 evt.counter UINT32</text>
<text x="392" y="512" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">106-107 evt.tLast_ms UINT32</text>
<text x="392" y="536" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">108-131 ring 8 × (state, t_ms)</text>
<text x="392" y="560" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">  entry k at 108 + 3k (newest k = 0)</text>
<rect x="700" y="270" width="300" height="330" rx="0" fill="#fffde7" stroke="#000" stroke-width="1.2"/>
