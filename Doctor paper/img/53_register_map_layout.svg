<text x="712" y="392" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">203-212 cmd.order ASCII20</text>
<text x="712" y="416" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">213-222 cmd.part ASCII20</text>
