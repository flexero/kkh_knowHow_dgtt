<rect x="60" y="270" width="300" height="330" rx="0" fill="#e8f5e9" stroke="#000" stroke-width="1.2"/>
<text x="72" y="293" font-size="13" text-anchor="start" font-weight="bold" fill="#000">FAST 0 – 11 (poll 500 ms)</text>
<text x="72" y="320" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">0  hdr.mapVersion = 0x0102</text>
<text x="72" y="344" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">1  hdr.typeCode 1 … 7</text>
<text x="72" y="368" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">2  hdr.unitId</text>
<text x="72" y="392" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">3  hdr.heartbeat +1/s</text>
<text x="72" y="416" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">4  std.status (bits)</text>
<text x="72" y="440" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">5  std.mode</text>
<text x="72" y="464" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">6  std.stateCode 0 … 6</text>
<text x="72" y="488" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">7  std.alarm</text>
<text x="72" y="512" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">8  hs.status ACK BUSY DONE REJ RDY</text>
<text x="72" y="536" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">9  hs.ackSeq</text>
<text x="72" y="560" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">10 hs.result 0 … 4</text>
<text x="72" y="584" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">11 hs.lotDone</text>
<rect x="380" y="270" width="300" height="330" rx="0" fill="#e3f2fd" stroke="#000" stroke-width="1.2"/>
<text x="392" y="293" font-size="13" text-anchor="start" font-weight="bold" fill="#000">COUNTERS 20 – 45 · ENERGY · EVENT</text>
