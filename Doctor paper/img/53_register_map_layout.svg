<text x="712" y="488" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">226 cmd.gwHeartbeat (1 s, FC06)</text>
<text x="712" y="512" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000"></text>
<text x="712" y="536" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">writes elsewhere → exception 02</text>
<text x="712" y="560" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">(fmsctl server; real PLCs: see ch. 15)</text>
<rect x="1020" y="270" width="300" height="330" rx="0" fill="#e3f2fd" stroke="#000" stroke-width="1.2"/>
<text x="1032" y="293" font-size="13" text-anchor="start" font-weight="bold" fill="#000">TYPE 300 – 389 · JOB 390 – 449</text>
<text x="1032" y="320" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">300-389 type status (per type)</text>
<text x="1032" y="344" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">  e.g. CNC 310-339 tool life</text>
<text x="1032" y="368" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">390-391 job.idDone UINT32</text>
<text x="1032" y="392" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">392 job.result 0 … 3</text>
<text x="1032" y="416" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">394-395 job.cycle_s REAL</text>
<text x="1032" y="440" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">400-401 job.id UINT32 (RW)</text>
<text x="1032" y="464" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">402-409 type params (RW,</text>
<text x="1032" y="488" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">   overlay per command code)</text>
<text x="1032" y="512" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">410-419 job.text ASCII20 (RW)</text>
<text x="1032" y="536" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">420-449 reserved (RW area)</text>
<rect x="60" y="625" width="1260" height="160" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="75" y="650" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Recommended FC03 polls per device (design example, chapter 10.6):</text>
<text x="75" y="680" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">FC03  0 / 12    FAST             every 0.5 s   response 33 bytes</text>
<text x="75" y="706" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">FC03  104 / 28  EVENT            every 0.5 s   response 65 bytes</text>
<text x="75" y="732" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">FC03  20 / 26   COUNTERS         every 1 s     response 61 bytes</text>
<text x="705" y="680" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">FC03  300 / 96  TYPE + JOB RESULT every 1 s     response 201 bytes</text>
<text x="705" y="706" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">FC03  100 / 4   ENERGY           every 10 s    response 17 bytes</text>
<text x="705" y="732" font-size="12" text-anchor="start" font-weight="normal" font-family="Consolas, Courier New, monospace" fill="#000">FC06  226       gateway heartbeat every 1 s    12 / 12 bytes</text>
<text x="60" y="815" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Rules: holding registers, 0-based (register n = 4xxxx 40001 + n) · UINT32 / REAL high word first, REAL IEEE 754 "ABCD" · ASCII20 = 10 registers, high byte first,</text>
<text x="60" y="835" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x00 padded · 32-bit values on even offsets (exception: ring time stamps at 109 + 3k, see ch. 7.4) · max 125 registers per FC03 → 300 / 96 is one request.</text>
