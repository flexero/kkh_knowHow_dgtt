<rect x="20" y="638" width="1050" height="120" fill="#fafafa" stroke="#ccc"/>
<line x1="30" y1="660" x2="80" y2="660" stroke="#2a78d6" stroke-width="3" marker-end="url(#arb)"/>
<text x="90.0" y="664.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">kanban castings box: node 1 (raw I/O) to node 2 (load station) – 22.97 m straight = 19.1 s at 1.2 m/s</text>
<line x1="30" y1="684" x2="80" y2="684" stroke="#1b8a5a" stroke-width="3" marker-end="url(#arg)"/>
<text x="90.0" y="688.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">finished compressor: node 7 (final out) to node 8 (FG AS/RS I/O) – 24.35 m straight = 20.3 s</text>
<line x1="30" y1="708" x2="80" y2="708" stroke="#888" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arx)"/>
<text x="90.0" y="712.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">empty legs (example): 2 to 1 = 22.97 m, 8 to 7 = 24.35 m, 8 to 1 = 51.69 m, 2 to 7 = 69.76 m</text>
<text x="30.0" y="738.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Nodes 9 / 10 = chargers (config agv.chargers). Nodes 3–6 exist in the map but no item-4 flow uses them yet. Distances are straight lines</text>
<text x="30.0" y="754.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">as in the code (math.dist); a real path along aisles is 1.13–1.42 times longer (Manhattan). Scale: 10 m = 105 px. Values: example layout.</text>
