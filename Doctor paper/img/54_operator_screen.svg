<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="780" fill="#ffffff"/>
  <text x="550" y="28" font-size="20" font-weight="bold" text-anchor="middle">Operator screen http://&lt;cell-PC&gt;:8090/ (fmsctl/web/cell.html) – annotated</text>
  <text x="550" y="48" font-size="13" text-anchor="middle" fill="#555">Refresh: GET /api/cell every 1 s · numbers ① … ⑨ explained on the right and in chapter 21</text>

  <!-- screen frame -->
  <rect x="20" y="62" width="700" height="700" rx="6" fill="#f6f6f3" stroke="#555" stroke-width="1.5"/>
  <!-- header -->
  <rect x="20" y="62" width="700" height="44" fill="#ffffff" stroke="#ccc"/>
  <text x="32" y="89" font-size="13" font-weight="bold">FMS cell controller – crankcase cell</text>
  <rect x="270" y="74" width="150" height="22" rx="11" fill="#fff" stroke="#bbb"/>
  <text x="345" y="89" font-size="11" text-anchor="middle">mode: auto · rule EDD</text>
  <rect x="428" y="74" width="74" height="22" rx="4" fill="#1baf7a"/>
  <text x="465" y="89" font-size="11" text-anchor="middle" fill="#fff">Automatic</text>
  <rect x="506" y="74" width="60" height="22" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="536" y="89" font-size="11" text-anchor="middle">Manual</text>
  <text x="574" y="89" font-size="11">Tools · Logistics · 14:32:05</text>

  <!-- machines card -->
  <rect x="32" y="116" width="330" height="150" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="44" y="136" font-size="12" font-weight="bold">Machines</text>
  <g font-size="11">
    <text x="44" y="156" fill="#666"><tspan x="44">Device</tspan><tspan x="102">State</tspan><tspan x="185">Job / info</tspan></text>
    <circle cx="48" cy="171" r="4" fill="#2a78d6"/><text x="56" y="175"><tspan x="56">PPS-1</tspan><tspan x="107">IDLE</tspan><tspan x="184">shuttle ready</tspan></text>
    <circle cx="48" cy="191" r="4" fill="#1baf7a"/><text x="56" y="195"><tspan x="56">LOAD-CC RUN</tspan><tspan x="178">operator task running</tspan></text>
    <circle cx="48" cy="211" r="4" fill="#1baf7a"/><text x="56" y="215"><tspan x="56">HMC-01</tspan><tspan x="107">RUN</tspan><tspan x="178">O1020 · pallet 3 · tool 41 %</tspan></text>
    <circle cx="48" cy="231" r="4" fill="#e34948"/><text x="56" y="235"><tspan x="56">HMC-02</tspan><tspan x="107">DOWN · alarm 107</tspan></text>
    <rect x="300" y="223" width="40" height="18" rx="3" fill="#fff" stroke="#999"/><text x="320" y="236" text-anchor="middle">Ack</text>
    <circle cx="48" cy="251" r="4" fill="#888"/><text x="56" y="255"><tspan x="56">HMC-03</tspan><tspan x="107">OFFLINE</tspan></text>
  </g>
  <!-- pallet pool -->
  <rect x="372" y="116" width="336" height="250" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="384" y="136" font-size="12" font-weight="bold">Pallet pool – 12 rack, load station, 3 HMC</text>
  <g font-size="11">
    <g fill="#ecebe6" stroke="#ddd">
      <rect x="384" y="146" width="76" height="44"/><rect x="464" y="146" width="76" height="44"/><rect x="544" y="146" width="76" height="44"/><rect x="624" y="146" width="76" height="44"/>
      <rect x="384" y="194" width="76" height="44"/><rect x="464" y="194" width="76" height="44"/><rect x="544" y="194" width="76" height="44"/><rect x="624" y="194" width="76" height="44"/>
      <rect x="384" y="242" width="76" height="44"/><rect x="464" y="242" width="76" height="44"/><rect x="544" y="242" width="76" height="44"/><rect x="624" y="242" width="76" height="44"/>
      <rect x="384" y="290" width="76" height="44"/><rect x="464" y="290" width="76" height="44"/><rect x="544" y="290" width="76" height="44"/><rect x="624" y="290" width="76" height="44"/>
    </g>
    <rect x="384" y="146" width="5" height="44" fill="#1baf7a"/><text x="393" y="158" fill="#666">rack 1</text><text x="393" y="172" font-weight="bold">P1·A·VC20</text><text x="393" y="185">machined</text>
    <rect x="464" y="146" width="5" height="44" fill="#2a78d6"/><text x="473" y="158" fill="#666">rack 2</text><text x="473" y="172" font-weight="bold">P2·A·VC10</text><text x="473" y="185">raw</text>
    <text x="553" y="158" fill="#666">rack 3</text><text x="633" y="158" fill="#666">rack 4</text>
    <rect x="384" y="194" width="5" height="44" fill="#bbb"/><text x="393" y="206" fill="#666">rack 5</text><text x="393" y="220" font-weight="bold">P9 · B</text><text x="393" y="232">empty</text>
    <text x="473" y="206" fill="#666">rack 6</text><text x="553" y="206" fill="#666">rack 7</text><text x="633" y="206" fill="#666">rack 8</text>
    <text x="393" y="254" fill="#666">rack 9</text><text x="473" y="254" fill="#666">rack 10</text><text x="553" y="254" fill="#666">rack 11</text><text x="633" y="254" fill="#666">rack 12</text>
    <rect x="384" y="290" width="5" height="44" fill="#1baf7a"/><text x="393" y="302" fill="#666">LOAD ST.</text><text x="393" y="316" font-weight="bold">P4·A·VC20</text><text x="393" y="329">machined</text>
    <rect x="464" y="290" width="5" height="44" fill="#2a78d6"/><text x="473" y="302" fill="#666">HMC-01</text><text x="473" y="316" font-weight="bold">P3·A·VC20</text><text x="473" y="329">raw</text>
    <rect x="544" y="290" width="5" height="44" fill="#e34948"/><text x="553" y="302" fill="#666">HMC-02</text><text x="553" y="316" font-weight="bold">P10·B·VC30</text><text x="553" y="329">nok</text>
    <text x="633" y="302" fill="#666">HMC-03</text>
    <text x="384" y="354" fill="#666">blue raw · green machined · red NOK · grey empty</text>
  </g>
  <!-- work orders -->
  <rect x="32" y="276" width="330" height="190" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="44" y="296" font-size="12" font-weight="bold">Work orders</text>
  <g font-size="11">
    <text x="44" y="316" fill="#666"><tspan x="44">WO</tspan><tspan x="95">Var.</tspan><tspan x="134">Qty Start Good Scrap Progress</tspan></text>
    <text x="44" y="336"><tspan x="44">WO-1001 VC20</tspan><tspan x="140">20</tspan><tspan x="178">9</tspan><tspan x="217">7</tspan><tspan x="255">1</tspan></text><rect x="270" y="327" width="80" height="8" fill="#ecebe6"/><rect x="270" y="327" width="28" height="8" fill="#1baf7a"/>
    <text x="44" y="356"><tspan x="44">WO-1002 VC30</tspan><tspan x="140">10</tspan><tspan x="178">2</tspan><tspan x="217">1</tspan><tspan x="255">0</tspan></text><rect x="270" y="347" width="80" height="8" fill="#ecebe6"/><rect x="270" y="347" width="8" height="8" fill="#1baf7a"/>
    <text x="44" y="376"><tspan x="44">WO-1003 VC10</tspan><tspan x="140">20</tspan><tspan x="178">0</tspan><tspan x="217">0</tspan><tspan x="255">0</tspan></text><rect x="270" y="367" width="80" height="8" fill="#ecebe6"/>
    <rect x="44" y="400" width="70" height="22" fill="#fff" stroke="#bbb"/><text x="50" y="415" fill="#999">WO-1004</text>
    <rect x="118" y="400" width="52" height="22" fill="#fff" stroke="#bbb"/><text x="124" y="415">VC20</text>
    <rect x="174" y="400" width="36" height="22" fill="#fff" stroke="#bbb"/><text x="180" y="415">6</text>
    <text x="214" y="415">pcs, due</text>
    <rect x="262" y="400" width="30" height="22" fill="#fff" stroke="#bbb"/><text x="268" y="415">24</text>
    <text x="296" y="415">h</text>
    <rect x="44" y="430" width="120" height="24" rx="4" fill="#fff" stroke="#999"/><text x="104" y="446" text-anchor="middle">Create + release</text>
  </g>
  <!-- jobs -->
  <rect x="32" y="476" width="330" height="276" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="44" y="496" font-size="12" font-weight="bold">Jobs (last 25)</text>
  <g font-size="11">
    <text x="44" y="516" fill="#666"><tspan x="44">Job</tspan><tspan x="102">Device</tspan><tspan x="159">Type</tspan><tspan x="255">Status</tspan></text>
    <text x="44" y="536"><tspan x="44">4521307 PPS-1</tspan><tspan x="146">move</tspan><tspan x="242">sent</tspan></text>
    <text x="44" y="556"><tspan x="44">4521306 HMC-01</tspan><tspan x="146">machine</tspan><tspan x="242">done</tspan></text>
    <text x="44" y="576"><tspan x="44">4521305 LOAD-CC operator task</tspan><tspan x="242">done</tspan></text>
    <text x="44" y="596"><tspan x="44">4521304 PPS-1</tspan><tspan x="146">move</tspan><tspan x="242">done</tspan></text>
    <text x="44" y="616"><tspan x="44">4521303 HMC-02</tspan><tspan x="146">machine</tspan><tspan x="242">done (2)</tspan></text>
    <text x="44" y="640" fill="#666">Info column: "machine pallet 3 VC20",</text>
    <text x="44" y="656" fill="#666">"unload + load VC30 for WO-1002" …</text>
  </g>
  <!-- events -->
  <rect x="372" y="376" width="336" height="376" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="384" y="396" font-size="12" font-weight="bold">Events and alarms (last 40)</text>
  <g font-size="11">
    <text x="384" y="418" fill="#e34948">14:31:50 HMC-02 machine DOWN, alarm 107</text>
    <text x="384" y="438" fill="#e34948">14:31:52 HMC-02 pallet 10 nok (O1030) – job ABORTED</text>
    <text x="384" y="458" fill="#eda100">14:30:10 LOAD-CC waiting for VC30 castings</text>
    <text x="384" y="478">14:29:44 HMC-01 pallet 7 machined (O1020)</text>
    <text x="384" y="498" fill="#e34948">14:12:03 HMC-03 OFFLINE – no connection: timed out</text>
    <text x="384" y="518">14:00:00 CELL mode -&gt; auto</text>
    <text x="384" y="550" fill="#666">Colours: red = alarm / error, amber = warn,</text>
    <text x="384" y="566" fill="#666">black = info. Newest first. No priority,</text>
    <text x="384" y="582" fill="#666">no "acknowledged" state, no shelving.</text>
  </g>

  <!-- callouts -->
  <g font-size="12" font-weight="bold" fill="#fff">
    <circle cx="345" cy="66" r="10" fill="#7a1fa2"/><text x="345" y="70" text-anchor="middle">1</text>
    <circle cx="500" cy="66" r="10" fill="#7a1fa2"/><text x="500" y="70" text-anchor="middle">2</text>
    <circle cx="350" cy="126" r="10" fill="#7a1fa2"/><text x="350" y="130" text-anchor="middle">3</text>
    <circle cx="346" cy="232" r="10" fill="#7a1fa2"/><text x="346" y="236" text-anchor="middle">4</text>
    <circle cx="696" cy="126" r="10" fill="#7a1fa2"/><text x="696" y="130" text-anchor="middle">5</text>
    <circle cx="350" cy="286" r="10" fill="#7a1fa2"/><text x="350" y="290" text-anchor="middle">6</text>
    <circle cx="176" cy="442" r="10" fill="#7a1fa2"/><text x="176" y="446" text-anchor="middle">7</text>
    <circle cx="350" cy="486" r="10" fill="#7a1fa2"/><text x="350" y="490" text-anchor="middle">8</text>
    <circle cx="696" cy="386" r="10" fill="#7a1fa2"/><text x="696" y="390" text-anchor="middle">9</text>
  </g>
  <g font-size="12">
    <text x="740" y="82" font-weight="bold" font-size="14">What the operator sees and does</text>
    <text x="740" y="106"><tspan font-weight="bold" fill="#7a1fa2">1</tspan> Mode pill: auto / manual + dispatch rule (EDD).</text>
    <text x="740" y="128"><tspan font-weight="bold" fill="#7a1fa2">2</tspan> Automatic / Manual buttons → POST /api/mode.</text>
    <text x="754" y="144">Manual = the controller sends NO command.</text>
    <text x="740" y="166"><tspan font-weight="bold" fill="#7a1fa2">3</tspan> Machines: state from register 6, alarm 7,</text>
    <text x="754" y="182">HMC program, pallet, lowest tool life.</text>
    <text x="740" y="204"><tspan font-weight="bold" fill="#7a1fa2">4</tspan> Ack button only when state = DOWN →</text>
    <text x="754" y="220">POST /api/ack → command 4 to the PLC.</text>
    <text x="740" y="242"><tspan font-weight="bold" fill="#7a1fa2">5</tspan> Pallet pool: 16 locations from PPS-1,</text>
    <text x="754" y="258">pallet id · fixture, content, variant, WO.</text>
    <text x="740" y="280"><tspan font-weight="bold" fill="#7a1fa2">6</tspan> Work orders: started, good, scrap, bar.</text>
    <text x="740" y="302"><tspan font-weight="bold" fill="#7a1fa2">7</tspan> New WO: id, variant, qty, due in h →</text>
    <text x="754" y="318">POST /api/wo (created AND released).</text>
    <text x="740" y="340"><tspan font-weight="bold" fill="#7a1fa2">8</tspan> Jobs: last 25 commands with status.</text>
    <text x="740" y="362"><tspan font-weight="bold" fill="#7a1fa2">9</tspan> Events: last 40, colour by level.</text>

    <text x="740" y="404" font-weight="bold" font-size="14">ISA-101 review (recommended changes)</text>
    <text x="740" y="428">• Normal states (RUN, IDLE) in grey shades,</text>
    <text x="754" y="444">not green / blue; colour only for abnormal.</text>
    <text x="740" y="466">• Pallet content by text / pattern, not by</text>
    <text x="754" y="482">colour alone (colour-blind operators).</text>
    <text x="740" y="504">• Alarm list with priority, time, state</text>
    <text x="754" y="520">(unack / ack / cleared) and operator id.</text>
    <text x="740" y="542">• Level 1 overview: output vs plan, KPI tiles</text>
    <text x="754" y="558">(parts/h, load-station busy, HMC busy).</text>
    <text x="740" y="580">• Confirm dialog for Manual / Automatic.</text>
    <text x="740" y="602">• Manual pallet move and "pallet blocked"</text>
    <text x="754" y="618">functions (missing today, chapter 29).</text>
    <text x="740" y="640">• Show WHY a machine waits ("no raw pallet",</text>
    <text x="754" y="656">"tool check failed", "no casting").</text>
    <text x="740" y="678">• Login / role before mode or order changes.</text>
    <text x="740" y="712" fill="#555">Dark mode follows the browser setting</text>
    <text x="740" y="728" fill="#555">(prefers-color-scheme) – keep the control</text>
    <text x="740" y="744" fill="#555">room setting fixed (light grey) per ISA-101.</text>
  </g>
</svg>
