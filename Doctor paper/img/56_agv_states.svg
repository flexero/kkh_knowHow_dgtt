<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>AGV state machine including charging</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a5a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#222">AGV states – register agv.state (0 idle, 1 moving, 2 loading / unloading, 3 charging, 4 error) and the fleet-manager view</text>
<rect x="60" y="272" width="180" height="56" rx="26" fill="#e6f2ea" stroke="#555" stroke-width="1.5"/>
<text x="150.0" y="305.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">IDLE (0)</text>
<rect x="310" y="112" width="180" height="56" rx="26" fill="#e6eff4" stroke="#555" stroke-width="1.5"/>
<text x="400.0" y="145.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">TO PICK-UP (1)</text>
<rect x="560" y="112" width="180" height="56" rx="26" fill="#fff3d6" stroke="#555" stroke-width="1.5"/>
<text x="650.0" y="145.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">LOADING (2)</text>
<rect x="810" y="112" width="180" height="56" rx="26" fill="#e6eff4" stroke="#555" stroke-width="1.5"/>
<text x="900.0" y="145.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">TO DROP (1)</text>
<rect x="810" y="272" width="180" height="56" rx="26" fill="#fff3d6" stroke="#555" stroke-width="1.5"/>
<text x="900.0" y="305.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">UNLOADING (2)</text>
<rect x="310" y="442" width="180" height="56" rx="26" fill="#e6eff4" stroke="#555" stroke-width="1.5"/>
<text x="400.0" y="475.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">TO CHARGER (1)</text>
<rect x="610" y="442" width="180" height="56" rx="26" fill="#f5e6e6" stroke="#555" stroke-width="1.5"/>
<text x="700.0" y="475.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">CHARGING (3)</text>
<rect x="810" y="442" width="180" height="56" rx="26" fill="#f9d6d6" stroke="#555" stroke-width="1.5"/>
<text x="900.0" y="475.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">ERROR (4)</text>
<line x1="210" y1="272" x2="340" y2="168" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="210.0" y="205.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">cmd 20 (battery &gt;= 25 %)</text>
<line x1="490" y1="140" x2="560" y2="140" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="525.0" y="120.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">at node frm</text>
<line x1="740" y1="140" x2="810" y2="140" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="775.0" y="120.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">20 s, loaded = 1</text>
<line x1="900" y1="168" x2="900" y2="272" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="910.0" y="225.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">at node too</text>
<line x1="810" y1="300" x2="240" y2="300" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="520.0" y="292.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">20 s, loaded = 0, battery - 2 % (virtual plant), job DONE</text>
<line x1="190" y1="328" x2="340" y2="442" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="250.0" y="392.0" font-size="11" text-anchor="end" font-weight="normal" fill="#333">battery &lt; 25 % and a</text>
<text x="250.0" y="408.0" font-size="11" text-anchor="end" font-weight="normal" fill="#222">free charger: cmd 21</text>
<line x1="490" y1="470" x2="590" y2="470" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="540.0" y="464.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">at node 9 / 10</text>
<line x1="620" y1="442" x2="210" y2="328" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="520.0" y="432.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">5 400 s × (100 - b)/100, battery 100 %, job DONE</text>
<line x1="970" y1="168" x2="970" y2="442" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="980.0" y="370.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">scanner stop,</text>
<text x="980.0" y="386.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222">position lost,</text>
<text x="980.0" y="402.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222">drive fault</text>
<text x="40.0" y="560.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Fleet manager rules: an AGV gets a transport only if online, READY, not BUSY, no active job, battery &gt;= 25 % (strictly: not &lt; 25).</text>
<text x="40.0" y="578.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">ERROR (4) is defined in the register map but not produced by the virtual plant and not handled by the manager yet (gap, chapter 30).</text>
<text x="40.0" y="596.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">After DONE the AGV stays at its last node (no park move) – this matters for the traffic rules (chapter 12).</text>
</svg>