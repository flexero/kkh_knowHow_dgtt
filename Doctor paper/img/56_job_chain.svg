<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Chained crane and AGV jobs</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a5a"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="1100" height="800" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#222">Chained jobs in fmsctl/logistics – kanban (crane, then AGV, then buffer) and finished goods (AGV, then crane store)</text>
<rect x="30" y="60" width="160" height="32" rx="6" fill="#e6eff4" stroke="#666"/>
<text x="110.0" y="81.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">Cell controller</text>
<line x1="110" y1="92" x2="110" y2="770" stroke="#bbb" stroke-dasharray="4 4"/>
<rect x="220" y="60" width="160" height="32" rx="6" fill="#e6eff4" stroke="#666"/>
<text x="300.0" y="81.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">Logistics manager</text>
<line x1="300" y1="92" x2="300" y2="770" stroke="#bbb" stroke-dasharray="4 4"/>
<rect x="410" y="60" width="160" height="32" rx="6" fill="#e6eff4" stroke="#666"/>
<text x="490.0" y="81.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">ASRS-RAW crane</text>
<line x1="490" y1="92" x2="490" y2="770" stroke="#bbb" stroke-dasharray="4 4"/>
<rect x="600" y="60" width="160" height="32" rx="6" fill="#e6eff4" stroke="#666"/>
<text x="680.0" y="81.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">AGV-01</text>
<line x1="680" y1="92" x2="680" y2="770" stroke="#bbb" stroke-dasharray="4 4"/>
<rect x="790" y="60" width="160" height="32" rx="6" fill="#e6eff4" stroke="#666"/>
<text x="870.0" y="81.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">ASRS-FG crane</text>
<line x1="870" y1="92" x2="870" y2="770" stroke="#bbb" stroke-dasharray="4 4"/>
<rect x="950" y="60" width="160" height="32" rx="6" fill="#e6eff4" stroke="#666"/>
<text x="1030.0" y="81.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">Load station / final</text>
<line x1="1030" y1="92" x2="1030" y2="770" stroke="#bbb" stroke-dasharray="4 4"/>
<text x="20.0" y="112.0" font-size="13" text-anchor="start" font-weight="bold" fill="#2a78d6">Kanban</text>
<line x1="110" y1="120" x2="294" y2="120" stroke="#333" stroke-width="1.8"  marker-end="url(#ar)"/>
<text x="205.0" y="115.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">take_casting(variant): buffer qty - 1</text>
<path d="M300,158 h40 v14 h-38" fill="none" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="346.0" y="168.0" font-size="11" text-anchor="start" font-weight="normal" fill="#2a78d6">kanban(): qty + on_way &lt;= 2 -&gt; hu reserved, transport need_retrieval</text>
<line x1="300" y1="196" x2="484" y2="196" stroke="#2a78d6" stroke-width="1.8"  marker-end="url(#arb)"/>
<text x="395.0" y="191.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#2a78d6">cmd 31 retrieve (bay, level, side), job id J1</text>
<path d="M300,234 h40 v14 h-38" fill="none" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="346.0" y="244.0" font-size="11" text-anchor="start" font-weight="normal" fill="#2a78d6">transport status open, wait_job = J1</text>
<line x1="490" y1="272" x2="306" y2="272" stroke="#2a78d6" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arb)"/>
<text x="395.0" y="267.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#2a78d6">idDone = J1, busy 0 (~50 s) -&gt; hu at_io, loc freed</text>
<path d="M300,310 h40 v14 h-38" fill="none" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="346.0" y="320.0" font-size="11" text-anchor="start" font-weight="normal" fill="#2a78d6">fleet(): J1 done, nodes 1 / 2 not reserved, nearest idle AGV</text>
<line x1="300" y1="348" x2="674" y2="348" stroke="#2a78d6" stroke-width="1.8"  marker-end="url(#arb)"/>
<text x="490.0" y="343.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#2a78d6">cmd 20 transport from 1 to 2, load type 1, job J2</text>
<line x1="680" y1="386" x2="1024" y2="386" stroke="#2a78d6" stroke-width="1.8"  marker-end="url(#arb)"/>
<text x="855.0" y="381.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#2a78d6">drive, load 20 s, drive, unload 20 s at node 2</text>
<line x1="680" y1="424" x2="306" y2="424" stroke="#2a78d6" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arb)"/>
<text x="490.0" y="419.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#2a78d6">idDone = J2 -&gt; buffer qty + C, on_way - C, hu consumed_at_cell</text>
<text x="20.0" y="464.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b8a5a">Finished goods</text>
<line x1="1030" y1="482" x2="306" y2="482" stroke="#1b8a5a" stroke-width="1.8"  marker-end="url(#arg)"/>
<text x="665.0" y="477.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b8a5a">POST /api/logistics/fg {serial} -&gt; hu at_final, transport 7 -&gt; 8 open</text>
<line x1="300" y1="520" x2="674" y2="520" stroke="#1b8a5a" stroke-width="1.8"  marker-end="url(#arg)"/>
<text x="490.0" y="515.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b8a5a">cmd 20 transport from 7 to 8, load type 4, job J3</text>
<line x1="680" y1="558" x2="306" y2="558" stroke="#1b8a5a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arg)"/>
<text x="490.0" y="553.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b8a5a">idDone = J3 -&gt; hu at_io_fg</text>
<path d="M300,596 h40 v14 h-38" fill="none" stroke="#1b8a5a" stroke-width="1.8" marker-end="url(#arg)"/>
<text x="346.0" y="606.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1b8a5a">wms(): ASRS-FG ready, no active job -&gt; free location nearest I/O</text>
<line x1="300" y1="634" x2="864" y2="634" stroke="#1b8a5a" stroke-width="1.8"  marker-end="url(#arg)"/>
<text x="585.0" y="629.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b8a5a">cmd 30 store (bay, level, side), job J4</text>
<line x1="870" y1="672" x2="306" y2="672" stroke="#1b8a5a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arg)"/>
<text x="585.0" y="667.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b8a5a">idDone = J4 -&gt; hu stored</text>
<text x="20.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Solid = command (Modbus write, toggle-bit handshake). Dashed = completion seen by poll() (job.idDone = job id and BUSY = 0). Loop period 50 ms.</text>
</svg>