<text x="760.0" y="587.0" font-size="12" text-anchor="start" fill="#111" font-weight="bold">Planning rules (chapter 18):</text>
<text x="760.0" y="604.0" font-size="11" text-anchor="start" fill="#333">• boring bars 3–8 side by side: check max. Ø and</text>
<text x="760.0" y="619.0" font-size="11" text-anchor="start" fill="#333">  weight with full neighbour pockets and the chain</text>
<text x="760.0" y="634.0" font-size="11" text-anchor="start" fill="#333">  load (machine manual) – spread them if needed</text>
<text x="760.0" y="649.0" font-size="11" text-anchor="start" fill="#333">• sisters for fast-wearing tools (parts/tool &lt; 150)</text>
<text x="760.0" y="664.0" font-size="11" text-anchor="start" fill="#333">• same pocket = same type in every HMC</text>
<text x="760.0" y="679.0" font-size="11" text-anchor="start" fill="#333">  (any pallet can go to any machine)</text>
