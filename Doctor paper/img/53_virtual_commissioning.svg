<rect x="0" y="0" width="1400" height="860" fill="#fff"/>
<rect x="6" y="6" width="1388" height="848" fill="none" stroke="#000" stroke-width="1"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Virtual commissioning – the same fmsctl code against the virtual plant, a real PLC (FAT) and the real plant (SAT)</text>
<text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Only the device table changes: device_table(virtual=True) → 127.0.0.1:15100+n ; device_table(virtual=False) → 10.70.&lt;zone&gt;.&lt;host&gt;:502</text>
