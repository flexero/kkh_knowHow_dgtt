<rect x="530" y="530" width="340" height="90" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="700.0" y="555.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Checked against the contract</text>
<text x="700.0" y="571.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">header, heartbeat, handshake,</text>
<text x="700.0" y="587.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">result codes, event block,</text>
