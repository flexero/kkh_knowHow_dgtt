<rect x="40" y="750" width="1320" height="60" rx="0" fill="#f5f5f5" stroke="#000" stroke-width="1.2"/>
<text x="55" y="775" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Principle: the virtual plant implements the SAME register map and the SAME handshake as the real PLC function block. A difference found in</text>
<text x="55" y="795" font-size="12" text-anchor="start" font-weight="normal" fill="#000">phase 2 is either a supplier error (fix the PLC) or a model error (fix virtual_plant.py) – never patched in the controller code.</text>
