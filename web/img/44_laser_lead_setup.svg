ine x1="612.0" y1="226.0" x2="970.0" y2="226.0" stroke="#1565c0" stroke-width="2" stroke-dasharray="10 4"/><text x="760.0" y="208.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1565c0">measuring beam (HeNe 633 nm)</text><line x1="612.0" y1="160.0" x2="940.0" y2="160.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#as)"/><text x="776.0" y="152.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">distance at the start = dead path (keep short)</text><line x1="680.0" y1="220.0" x2="680.0" y2="388.0" stroke="#1565c0" stroke-width="1.2" marker-end="url(#aa)" marker-start="url(#aas)"/><text x="688.0" y="262.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Abbe offset</text><text x="688.0" y="278.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">(beam to probe, keep small)</text><rect x="780.0" y="600.0" width="230.0" height="64.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="895.0" y="621.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">compensator (XC-80 class)</text><text x="895.0" y="636.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">air T, pressure, humidity</text><text x="895.0" y="651.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">+ 3 material sensors</text><rect x="322.0" y="350.0" width="16.0" height="10.0" rx="3" fill="#000" stroke="#000" stroke-width="1"/><path d="M330,350 C330,300 290,560 880,600" stroke="#000" stroke-width="0.8" fill="none" stroke-dasharray="4 3"/><rect x="552.0" y="350.0" width="16.0" height="10.0" rx="3" fill="#000" stroke="#000" stroke-width="1"/><path d="M560,350 C560,300 520,560 880,600" stroke="#000" stroke-width="0.8" fill="none" stroke-dasharray="4 3"/><rect x="792.0" y="350.0" width="16.0" height="10.0" rx="3" fill="#000" stroke="#000" stroke-width="1"/><path d="M800,350 C800,300 760,560 880,600" stroke="#000" stroke-width="0.8" fill="none" stroke-dasharray="4 3"/><text x="342.0" y="346.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">material sensors (3)</text><circle cx="880.0" cy="262.0" r="9.0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="892.0" y="266.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">air sensor</text><path d="M880,271 C880,450 900,500 900,600" stroke="#000" stroke-width="0.8" fill="none" stroke-dasharray="4 3"/><rect x="1030.0" y="600.0" width="130.0" height="64.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1095.0" y="621.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">evaluation PC</text><text x="1095.0" y="636.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">ISO 3408-3</text><text x="1095.0" y="651.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">JSON over HTTP</text><line x1="1010.0" y1="632.0" x2="1030.0" y2="632.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="40.0" y="580.0" width="700.0" height="150.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="52.0" y="602.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Formulas (example values – check ISO 3408-3)</text><text x="52.0" y="620.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">nominal travel  l_nom = θ · Ph / 2π      (Ph = 10 mm, one turn = 10 mm)</text><text x="52.0" y="638.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">actual travel deviation  e(l) = l_actual (laser) − l_nom (encoder)</text><text x="52.0" y="656.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">to 20 °C:  e20 = e − α · (Tm − 20 °C) · l      α = 11.5 µm/(m·K)</text><text x="52.0" y="674.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">example: Tm = 20.3 °C, l = 700 mm  gives  11.5 × 0.3 × 0.7 = 2.42 µm</text><text x="52.0" y="692.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">laser: ± 0.5 ppm with air compensation = 0.35 µm on 700 mm</text><text x="52.0" y="710.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 K screw temperature on 700 mm = 8.05 µm (¼ of the C5 e_p tolerance)</text><rect x="825.0" y="738.0" width="360.0" height="80.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825.0" y1="768.0" x2="1185.0" y2="768.0" stroke="#000" stroke-width="1.2"/><line x1="825.0" y1="792.0" x2="1185.0" y2="792.0" stroke="#000" stroke-width="1.2"/><text x="835.0" y="759.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Laser lead measuring bench</text><text x="835.0" y="785.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 44-02  ·  guide 44 §7</text><text x="835.0" y="810.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the standard</text></svg>
