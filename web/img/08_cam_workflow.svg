<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>CAM workflow – from the 3D model to a released NC program, with probe feedback</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1100" height="720" fill="#ffffff"/>
<rect x="6" y="6" width="1088" height="708" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">CAM workflow – from the 3D model to a released NC program, with probe feedback</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#000">Black arrows = program flow (forward). Red arrows = feedback loops. Role of each step in italics.</text>
<rect x="30.0" y="72.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="38.0" y="91.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">1  CAD model + drawing</text>
<text x="38.0" y="108.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">designer</text>
<text x="38.0" y="127.0" font-size="11" text-anchor="start" fill="#000">3D model (.prt / STEP AP242)</text>
<text x="38.0" y="142.0" font-size="11" text-anchor="start" fill="#000">tolerances, datums (PMI)</text>
<text x="38.0" y="157.0" font-size="11" text-anchor="start" fill="#000">casting model = stock</text>
<text x="38.0" y="172.0" font-size="11" text-anchor="start" fill="#000">drawing VC-PRD-CC-0020-C</text>
<rect x="300.0" y="72.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="308.0" y="91.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">2  Process plan</text>
<text x="308.0" y="108.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">manufacturing engineer</text>
<text x="308.0" y="127.0" font-size="11" text-anchor="start" fill="#000">operations, set-ups, B faces</text>
<text x="308.0" y="142.0" font-size="11" text-anchor="start" fill="#000">fixture VC-MCH-FIX-0014</text>
<text x="308.0" y="157.0" font-size="11" text-anchor="start" fill="#000">tool list, cutting data</text>
<text x="308.0" y="172.0" font-size="11" text-anchor="start" fill="#000">target cycle time (twin)</text>
<rect x="570.0" y="72.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="578.0" y="91.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">3  CAM programming</text>
<text x="578.0" y="108.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">CNC programmer</text>
<text x="578.0" y="127.0" font-size="11" text-anchor="start" fill="#000">tool paths (HSM, adaptive)</text>
<text x="578.0" y="142.0" font-size="11" text-anchor="start" fill="#000">tool library (ISO 13399)</text>
<text x="578.0" y="157.0" font-size="11" text-anchor="start" fill="#000">machine + fixture model</text>
<text x="578.0" y="172.0" font-size="11" text-anchor="start" fill="#000">output: neutral CL / APT</text>
<rect x="840.0" y="72.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="848.0" y="91.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">4  Post-processor</text>
<text x="848.0" y="108.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">CAM supplier / builder</text>
<text x="848.0" y="127.0" font-size="11" text-anchor="start" fill="#000">one post per machine + control</text>
<text x="848.0" y="142.0" font-size="11" text-anchor="start" fill="#000">Fanuc .nc / Siemens .MPF</text>
<text x="848.0" y="157.0" font-size="11" text-anchor="start" fill="#000">cycles, B-axis, tool change</text>
<text x="848.0" y="172.0" font-size="11" text-anchor="start" fill="#000">tested with test program</text>
<rect x="840.0" y="262.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="848.0" y="281.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">5  NC simulation (G-code)</text>
<text x="848.0" y="298.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">CNC programmer</text>
<text x="848.0" y="317.0" font-size="11" text-anchor="start" fill="#000">simulates the POST OUTPUT</text>
<text x="848.0" y="332.0" font-size="11" text-anchor="start" fill="#000">machine kinematics + control</text>
<text x="848.0" y="347.0" font-size="11" text-anchor="start" fill="#000">collision, gouge, over-travel</text>
<text x="848.0" y="362.0" font-size="11" text-anchor="start" fill="#000">stock vs model, real time</text>
<rect x="570.0" y="262.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="578.0" y="281.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">6  Release (PDM / DNC)</text>
<text x="578.0" y="298.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">programmer + quality</text>
<text x="578.0" y="317.0" font-size="11" text-anchor="start" fill="#000">Draft -&gt; Test -&gt; Released</text>
<text x="578.0" y="332.0" font-size="11" text-anchor="start" fill="#000">revision + checksum</text>
<text x="578.0" y="347.0" font-size="11" text-anchor="start" fill="#000">linked to drawing rev.</text>
<text x="578.0" y="362.0" font-size="11" text-anchor="start" fill="#000">and fixture ID</text>
<rect x="300.0" y="262.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="308.0" y="281.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">7  DNC / OPC UA transfer</text>
<text x="308.0" y="298.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">automatic (MES)</text>
<text x="308.0" y="317.0" font-size="11" text-anchor="start" fill="#000">MES selects the program</text>
<text x="308.0" y="332.0" font-size="11" text-anchor="start" fill="#000">revision for the next model</text>
<text x="308.0" y="347.0" font-size="11" text-anchor="start" fill="#000">file transfer to the control</text>
<text x="308.0" y="362.0" font-size="11" text-anchor="start" fill="#000">machine reports active prog.</text>
<rect x="30.0" y="262.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="38.0" y="281.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">8  CNC machine</text>
<text x="38.0" y="298.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">setter / operator</text>
<text x="38.0" y="317.0" font-size="11" text-anchor="start" fill="#000">prove-out (Step 7)</text>
<text x="38.0" y="332.0" font-size="11" text-anchor="start" fill="#000">series production</text>
<text x="38.0" y="347.0" font-size="11" text-anchor="start" fill="#000">tool life counters</text>
<text x="38.0" y="362.0" font-size="11" text-anchor="start" fill="#000">alarms, spindle load</text>
<rect x="30.0" y="470.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="38.0" y="489.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">9  Probing + measuring</text>
<text x="38.0" y="506.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">machine + quality</text>
<text x="38.0" y="525.0" font-size="11" text-anchor="start" fill="#000">G54 setting (spindle probe)</text>
<text x="38.0" y="540.0" font-size="11" text-anchor="start" fill="#000">in-process gauging</text>
<text x="38.0" y="555.0" font-size="11" text-anchor="start" fill="#000">tool setter / laser</text>
<text x="38.0" y="570.0" font-size="11" text-anchor="start" fill="#000">CMM, first-article report</text>
<rect x="570.0" y="470.0" width="240.0" height="132.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="578.0" y="489.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">10  MES + digital twin</text>
<text x="578.0" y="506.0" font-size="11" text-anchor="start" fill="#000" font-style="italic">production engineering</text>
<text x="578.0" y="525.0" font-size="11" text-anchor="start" fill="#000">real cycle time per program</text>
<text x="578.0" y="540.0" font-size="11" text-anchor="start" fill="#000">tool life, scrap, OEE</text>
<text x="578.0" y="555.0" font-size="11" text-anchor="start" fill="#000">capacity model update</text>
<text x="578.0" y="570.0" font-size="11" text-anchor="start" fill="#000">program revision per serial</text>
<line x1="272.0" y1="138.0" x2="296.0" y2="138.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="542.0" y1="138.0" x2="566.0" y2="138.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="812.0" y1="138.0" x2="836.0" y2="138.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="960.0" y1="206.0" x2="960.0" y2="258.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<text x="968.0" y="238.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">.nc / .MPF</text>
<line x1="838.0" y1="328.0" x2="814.0" y2="328.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="568.0" y1="328.0" x2="544.0" y2="328.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="298.0" y1="328.0" x2="274.0" y2="328.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="150.0" y1="396.0" x2="150.0" y2="466.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<path d="M250,468 L250,398" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arA)"/>
<text x="256.0" y="438.0" font-size="11" text-anchor="start" fill="#c0392b" font-weight="bold">A: wear offsets,</text>
<text x="256.0" y="452.0" font-size="11" text-anchor="start" fill="#c0392b">work offsets (seconds)</text>
<path d="M272,510 L420.0,510 L420.0,424 L690.0,424 L690.0,398" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arA)"/>
<text x="280.0" y="528.0" font-size="11" text-anchor="start" fill="#c0392b" font-weight="bold">B: real errors -&gt; new revision</text>
<text x="280.0" y="544.0" font-size="11" text-anchor="start" fill="#c0392b">(back to CAM 3 via release 6)</text>
<line x1="272.0" y1="570.0" x2="566.0" y2="570.0" stroke="#c0392b" stroke-width="2" marker-end="url(#arA)"/>
<text x="316.0" y="564.0" font-size="11" text-anchor="start" fill="#c0392b" font-weight="bold">C: measured data, times, tool life</text>
<path d="M812,536.0 L1000.0,536.0 L1000.0,398" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arA)"/>
<text x="846.0" y="488.0" font-size="11" text-anchor="start" fill="#c0392b" font-weight="bold">D: real times -&gt;</text>
<text x="846.0" y="504.0" font-size="11" text-anchor="start" fill="#c0392b">simulation + CAM</text>
<text x="846.0" y="520.0" font-size="11" text-anchor="start" fill="#c0392b">optimisation</text>
<rect x="656.0" y="654.0" width="430.0" height="52.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<line x1="656.0" y1="680.0" x2="1086.0" y2="680.0" stroke="#000" stroke-width="1"/>
<text x="664.0" y="672.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">EXAMPLE – check the maker's documentation</text>
<text x="664.0" y="698.0" font-size="12" text-anchor="start" fill="#000">Guide 08 – CNC / G-code · 08_cam_workflow</text>
