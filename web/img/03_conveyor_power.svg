<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" width="1500" height="960" font-family="Arial, Helvetica, sans-serif">
<title>Chain conveyor and roller conveyor with forces and drive power calculation – FG AS/RS in-feed example</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1500" height="960" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#000" font-weight="bold">Conveyor forces and drive power – 2-strand chain conveyor for packed compressors (FG AS/RS in-feed) + MDR roller zone for KLT boxes</text>
<text x="24.0" y="52.0" font-size="12" text-anchor="start" fill="#444">Example values: 6 m long, 4 loads × 250 kg on 1 200 × 800 pallets, chain 2 × 2.6 kg/m, rolling friction of chain μ_r = 0.12, pallet-on-chain sliding μ_s = 0.30, v = 0.2 m/s, η = 0.90 × 0.95.</text>
<line x1="120.0" y1="330.0" x2="1020.0" y2="330.0" stroke="#000" stroke-width="3"/>
<line x1="120.0" y1="390.0" x2="1020.0" y2="390.0" stroke="#000" stroke-width="3" stroke-dasharray="10,5"/>
<circle cx="120.0" cy="360.0" r="30.0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="1020.0" cy="360.0" r="30.0" fill="#fff" stroke="#c62828" stroke-width="2.2"/>
<text x="120.0" y="364.0" font-size="11" text-anchor="middle" fill="#000">idler</text>
<text x="1020.0" y="435.0" font-size="11" text-anchor="middle" fill="#c62828" font-weight="bold">drive sprocket d = 200 mm</text>
<rect x="1070.0" y="335.0" width="120.0" height="50.0" rx="0" fill="#fff" stroke="#c62828" stroke-width="2"/>
<text x="1130.0" y="358.0" font-size="11" text-anchor="middle" fill="#c62828">helical-bevel</text>
<text x="1130.0" y="373.0" font-size="11" text-anchor="middle" fill="#c62828">gearmotor</text>
<line x1="1050.0" y1="360.0" x2="1070.0" y2="360.0" stroke="#c62828" stroke-width="2"/>
<text x="570.0" y="410.0" font-size="11" text-anchor="middle" fill="#000">return strand (chain only: 31.2 kg)</text>
<rect x="142.5" y="312.0" width="180.0" height="18.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="152.5" y="202.0" width="160.0" height="110.0" rx="0" fill="#eeeeee" stroke="#000" stroke-width="1.2"/>
<text x="232.5" y="255.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">load 1</text>
<text x="232.5" y="272.0" font-size="11" text-anchor="middle" fill="#000">250 kg</text>
<line x1="232.5" y1="290.0" x2="232.5" y2="326.0" stroke="#000" stroke-width="1.4" marker-end="url(#ak)"/>
<text x="238.5" y="304.0" font-size="11" text-anchor="start" fill="#000">m·g = 2 453 N</text>
<rect x="360.0" y="312.0" width="180.0" height="18.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="370.0" y="202.0" width="160.0" height="110.0" rx="0" fill="#eeeeee" stroke="#000" stroke-width="1.2"/>
<text x="450.0" y="255.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">load 2</text>
<text x="450.0" y="272.0" font-size="11" text-anchor="middle" fill="#000">250 kg</text>
<line x1="450.0" y1="290.0" x2="450.0" y2="326.0" stroke="#000" stroke-width="1.4" marker-end="url(#ak)"/>
<text x="456.0" y="304.0" font-size="11" text-anchor="start" fill="#000">m·g = 2 453 N</text>
<rect x="577.5" y="312.0" width="180.0" height="18.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="587.5" y="202.0" width="160.0" height="110.0" rx="0" fill="#eeeeee" stroke="#000" stroke-width="1.2"/>
<text x="667.5" y="255.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">load 3</text>
<text x="667.5" y="272.0" font-size="11" text-anchor="middle" fill="#000">250 kg</text>
<line x1="667.5" y1="290.0" x2="667.5" y2="326.0" stroke="#000" stroke-width="1.4" marker-end="url(#ak)"/>
<text x="673.5" y="304.0" font-size="11" text-anchor="start" fill="#000">m·g = 2 453 N</text>
<rect x="795.0" y="312.0" width="180.0" height="18.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<rect x="805.0" y="202.0" width="160.0" height="110.0" rx="0" fill="#eeeeee" stroke="#000" stroke-width="1.2"/>
<text x="885.0" y="255.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">load 4</text>
<text x="885.0" y="272.0" font-size="11" text-anchor="middle" fill="#000">250 kg</text>
<line x1="885.0" y1="290.0" x2="885.0" y2="326.0" stroke="#000" stroke-width="1.4" marker-end="url(#ak)"/>
<text x="891.0" y="304.0" font-size="11" text-anchor="start" fill="#000">m·g = 2 453 N</text>
<rect x="997.5" y="280.0" width="12.0" height="50.0" rx="0" fill="#c62828" stroke="#c62828" stroke-width="1"/>
<text x="1003.5" y="270.0" font-size="11" text-anchor="middle" fill="#c62828" font-weight="bold">stop</text>
<line x1="210.0" y1="344.0" x2="150.0" y2="344.0" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="213.0" y="348.0" font-size="11" text-anchor="start" fill="#c62828">F_r</text>
<line x1="420.0" y1="185.0" x2="600.0" y2="185.0" stroke="#000" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="510.0" y="178.0" font-size="11" text-anchor="middle" fill="#000">chain runs at v = 0.2 m/s</text>
<text x="795.0" y="165.0" font-size="11" text-anchor="middle" fill="#c62828">case B: loads 2–4 held at the stop, chain slides under them</text>
<line x1="705.0" y1="344.0" x2="645.0" y2="344.0" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="708.0" y="348.0" font-size="11" text-anchor="start" fill="#c62828">F_acc = μ_s·m·g</text>
<line x1="120.0" y1="460.0" x2="1020.0" y2="460.0" stroke="#000" stroke-width="0.9" marker-end="url(#ak)" marker-start="url(#ak)"/>
<text x="570.0" y="456.0" font-size="11" text-anchor="middle" fill="#000">conveyor length 6 000 – pitch 1 450 per load (1 200 + 250 gap)</text>
<rect x="24.0" y="500.0" width="700.0" height="300.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="36.0" y="524.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="36.0" y="546.0" font-size="12" text-anchor="start" fill="#000">F_A = μ_r · g · (m_loads + m_chain,carry + m_chain,return)</text>
<text x="36.0" y="568.0" font-size="12" text-anchor="start" fill="#000">    = 0.12 × 9.81 × (1 000 + 31.2 + 31.2) = 1 251 N</text>
<text x="36.0" y="590.0" font-size="12" text-anchor="start" fill="#000">P_A = F·v/η = 1 251 × 0.2 / 0.855 = 293 W   (× 1.3 = 380 W → 0.55 kW)</text>
<text x="36.0" y="612.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="36.0" y="634.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="36.0" y="656.0" font-size="12" text-anchor="start" fill="#000">F_acc = μ_s · g · m_held = 0.30 × 9.81 × 750 = 2 207 N</text>
<text x="36.0" y="678.0" font-size="12" text-anchor="start" fill="#000">F_B = 0.12 × 9.81 × (250 + 62.4) + 2 207 = 2 575 N</text>
<text x="36.0" y="700.0" font-size="12" text-anchor="start" fill="#000">P_B = 2 575 × 0.2 / 0.855 = 602 W   (× 1.3 = 783 W → 1.1 kW)</text>
<text x="36.0" y="722.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="36.0" y="744.0" font-size="12" text-anchor="start" fill="#000">Sprocket: T = F·d/2 = 2 575 × 0.1 = 258 N·m;  n = v/(π·d) = 19.1 rpm</text>
<text x="36.0" y="766.0" font-size="12" text-anchor="start" fill="#000">Chain pull per strand 1 288 N × 8 safety = 10.3 kN ≤ breaking load</text>
<text x="36.0" y="524.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Case A – transport, no accumulation</text>
<text x="36.0" y="634.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">Case B – 3 loads accumulated on the running chain</text>
<text x="36.0" y="790.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Lesson: accumulating on a running chain doubles the power – use zero-pressure zones.</text>
<rect x="760.0" y="500.0" width="716.0" height="300.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="772.0" y="522.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Zero-pressure accumulation with 24 V motor-driven rollers (MDR) – KLT 600 × 400, 30 kg</text>
<circle cx="812.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="837.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
