<circle cx="937.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="962.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="987.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="800.0" y1="646.0" x2="1000.0" y2="646.0" stroke="#000" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="900.0" y="664.0" font-size="11" text-anchor="middle" fill="#000">zone 1 (600 mm)</text>
<circle cx="996.0" cy="598.0" r="4.0" fill="#c62828" stroke="#c62828" stroke-width="1"/>
<rect x="820.0" y="568.0" width="150.0" height="40.0" rx="0" fill="#eeeeee" stroke="#000" stroke-width="1"/>
<text x="895.0" y="593.0" font-size="11" text-anchor="middle" fill="#000">KLT 30 kg</text>
<circle cx="1022.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1047.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1072.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1097.0" cy="620.0" r="10.0" fill="#fff" stroke="#c62828" stroke-width="2"/>
<circle cx="1122.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1147.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1172.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1197.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="1010.0" y1="646.0" x2="1210.0" y2="646.0" stroke="#000" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="1110.0" y="664.0" font-size="11" text-anchor="middle" fill="#000">zone 2 (600 mm)</text>
<circle cx="1206.0" cy="598.0" r="4.0" fill="#c62828" stroke="#c62828" stroke-width="1"/>
<rect x="1030.0" y="568.0" width="150.0" height="40.0" rx="0" fill="#eeeeee" stroke="#000" stroke-width="1"/>
<text x="1105.0" y="593.0" font-size="11" text-anchor="middle" fill="#000">KLT 30 kg</text>
<circle cx="1232.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1257.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1282.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1307.0" cy="620.0" r="10.0" fill="#fff" stroke="#c62828" stroke-width="2"/>
<circle cx="1332.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1357.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1382.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="1407.0" cy="620.0" r="10.0" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="1220.0" y1="646.0" x2="1420.0" y2="646.0" stroke="#000" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="1320.0" y="664.0" font-size="11" text-anchor="middle" fill="#000">zone 3 (600 mm)</text>
<circle cx="1416.0" cy="598.0" r="4.0" fill="#c62828" stroke="#c62828" stroke-width="1"/>
<text x="800.0" y="558.0" font-size="11" text-anchor="start" fill="#000">zone stops when the zone ahead is occupied → no contact pressure between boxes</text>
<text x="1230.0" y="682.0" font-size="11" text-anchor="middle" fill="#c62828">red roller = RollerDrive (motor), others belt-driven; dot = zone photo-eye</text>
<text x="772.0" y="710.0" font-size="12" text-anchor="start" fill="#000">F = μ·m·g + m·a = 0.03 × 30 × 9.81 + 30 × 0.5 = 8.8 + 15.0 = 23.8 N</text>
<text x="772.0" y="731.0" font-size="12" text-anchor="start" fill="#000">T_roller = F × r = 23.8 × 0.025 = 0.60 N·m (Ø 50 roller)   P = F·v = 23.8 × 0.5 = 12 W</text>
<text x="772.0" y="752.0" font-size="12" text-anchor="start" fill="#000">Throughput = 3 600 · v / (load length + gap) = 3 600 × 0.5 / 0.8 = 2 250 boxes/h (theoretical)</text>
<text x="772.0" y="773.0" font-size="12" text-anchor="start" fill="#000">Roller pitch ≤ load length / 3 → ≥ 3 rollers under every box (here 75 mm pitch)</text>
<text x="24.0" y="830.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">General: F = g · [μ_r · (m_load + m_moving parts) + μ_s · m_accumulated + m_load · sin α (incline)];  P = F · v / η_total × service factor 1.2–1.5.</text>
<text x="24.0" y="850.0" font-size="12" text-anchor="start" fill="#000">Example: a 3° incline adds 250 × 9.81 × sin 3° = 128 N per 250 kg load. Friction values are examples – ask the conveyor maker for μ and the chain catalogue for breaking load.</text>
