<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Arial, Helvetica, sans-serif">
<title>12-step hydraulic design method – flow chart with the example job</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
<text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#000" font-weight="bold">Hydraulic design method – 12 steps with iterations (example job: F 20 kN, stroke 200 mm, 2 s / 2 s, cycle 60 s)</text>
<text x="30.0" y="56.0" font-size="12" text-anchor="start" fill="#555">Each box: step · what you decide · key formula · result of the example. Red dashed arrows = go back when a check fails.</text>
<rect x="40.0" y="130.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="40.0" y="130.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="62.0" y="194.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">1</text>
<text x="94.0" y="156.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Requirements + load list</text>
<text x="94.0" y="182.0" font-size="11" text-anchor="start" fill="#000">F, stroke, time, sequence, ambient</text>
<line x1="94.0" y1="196.0" x2="328.0" y2="196.0" stroke="#555" stroke-width="0.8"/>
<text x="94.0" y="218.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">20 kN · 200 mm · 2 s / 2 s · 60 s</text>
<rect x="376.0" y="130.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="376.0" y="130.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="398.0" y="194.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">2</text>
<text x="430.0" y="156.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">System pressure</text>
<text x="430.0" y="182.0" font-size="11" text-anchor="start" fill="#000">p_eff = p_sys · (1 − losses)</text>
<line x1="430.0" y1="196.0" x2="664.0" y2="196.0" stroke="#555" stroke-width="0.8"/>
<text x="430.0" y="218.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">10 MPa → 8.5 MPa at the cylinder</text>
<rect x="712.0" y="130.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="712.0" y="130.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="734.0" y="194.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">3</text>
<text x="766.0" y="156.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Actuator size</text>
<text x="766.0" y="182.0" font-size="11" text-anchor="start" fill="#000">A = F / (p_eff · η_cyl); buckling</text>
<line x1="766.0" y1="196.0" x2="1000.0" y2="196.0" stroke="#555" stroke-width="0.8"/>
<text x="766.0" y="218.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">Ø63/36, needs 6.75 MPa, F_k 302 kN</text>
<rect x="1048.0" y="130.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="1048.0" y="130.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="1070.0" y="194.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">4</text>
<text x="1102.0" y="156.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Flow of each movement</text>
<text x="1102.0" y="182.0" font-size="11" text-anchor="start" fill="#000">Q = A · v  (cm² · m/min / 10)</text>
<line x1="1102.0" y1="196.0" x2="1336.0" y2="196.0" stroke="#555" stroke-width="0.8"/>
<text x="1102.0" y="218.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">18.7 L/min extend · 12.6 retract</text>
<rect x="1048.0" y="330.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="1048.0" y="330.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="1070.0" y="394.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">5</text>
<text x="1102.0" y="356.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Duty cycle + p–Q</text>
<text x="1102.0" y="382.0" font-size="11" text-anchor="start" fill="#000">peak, average, RMS over the cycle</text>
<line x1="1102.0" y1="396.0" x2="1336.0" y2="396.0" stroke="#555" stroke-width="0.8"/>
<text x="1102.0" y="418.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">peak 18.7 · average 1.04 L/min</text>
<rect x="712.0" y="330.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="712.0" y="330.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="734.0" y="394.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">6</text>
<text x="766.0" y="356.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Supply type</text>
<text x="766.0" y="382.0" font-size="11" text-anchor="start" fill="#000">fixed / variable / accumulator / servo</text>
<line x1="766.0" y1="396.0" x2="1000.0" y2="396.0" stroke="#555" stroke-width="0.8"/>
<text x="766.0" y="418.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">A fixed pump · C pump + accumulator</text>
<rect x="376.0" y="330.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="376.0" y="330.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="398.0" y="394.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">7</text>
<text x="430.0" y="356.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Pump + motor</text>
<text x="430.0" y="382.0" font-size="11" text-anchor="start" fill="#000">V = Q·1000/(n·η_v); P = p·Q/(600·η)</text>
<line x1="430.0" y1="396.0" x2="664.0" y2="396.0" stroke="#555" stroke-width="0.8"/>
<text x="430.0" y="418.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">A 14 cc, 3 kW · C 4 cc, 0.75 kW</text>
<rect x="40.0" y="330.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="40.0" y="330.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="62.0" y="394.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">8</text>
<text x="94.0" y="356.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Accumulator</text>
<text x="94.0" y="382.0" font-size="11" text-anchor="start" fill="#000">V0 = ΔV / [(p0/p1)^1/n − (p0/p2)^1/n]</text>
<line x1="94.0" y1="396.0" x2="328.0" y2="396.0" stroke="#555" stroke-width="0.8"/>
<text x="94.0" y="418.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">4.09 L (abs, n 1.4) → 5 L bladder</text>
<rect x="40.0" y="530.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="40.0" y="530.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="62.0" y="594.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">9</text>
<text x="94.0" y="556.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Valves + circuit</text>
<text x="94.0" y="582.0" font-size="11" text-anchor="start" fill="#000">ISO 1219 diagram, NG size, settings</text>
<line x1="94.0" y1="596.0" x2="328.0" y2="596.0" stroke="#555" stroke-width="0.8"/>
<text x="94.0" y="618.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">NG6 · relief 10 (C: 11) MPa · POC 3:1</text>
<rect x="376.0" y="530.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="376.0" y="530.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="398.0" y="594.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">10</text>
<text x="430.0" y="556.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Pipes + hoses</text>
<text x="430.0" y="582.0" font-size="11" text-anchor="start" fill="#000">d = 4.61·√(Q/v); Δp = λ(L/d)ρv²/2</text>
<line x1="430.0" y1="596.0" x2="664.0" y2="596.0" stroke="#555" stroke-width="0.8"/>
<text x="430.0" y="618.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">15×2.5 · 18×2 · 16×2 · Δp 0.15 MPa</text>
<rect x="712.0" y="530.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="712.0" y="530.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="734.0" y="594.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">11</text>
<text x="766.0" y="556.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Tank, heat, cooling</text>
<text x="766.0" y="582.0" font-size="11" text-anchor="start" fill="#000">P_loss ≤ k · A · ΔT, else cooler</text>
<line x1="766.0" y1="596.0" x2="1000.0" y2="596.0" stroke="#555" stroke-width="0.8"/>
<text x="766.0" y="618.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">C: 0.14 kW &lt; 0.20 kW → no cooler</text>
<rect x="1048.0" y="530.0" width="300.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#fff"/>
<rect x="1048.0" y="530.0" width="44.0" height="112.0" rx="6" stroke="#000" stroke-width="1.6" fill="#f2f2f2"/>
<text x="1070.0" y="594.0" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold">12</text>
<text x="1102.0" y="556.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Oil, filters, safety</text>
<text x="1102.0" y="582.0" font-size="11" text-anchor="start" fill="#000">VG, ISO 4406, β ratio, EN ISO 4413</text>
<line x1="1102.0" y1="596.0" x2="1336.0" y2="596.0" stroke="#555" stroke-width="0.8"/>
<text x="1102.0" y="618.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">VG 46 · 18/16/13 · 10 µm β ≥ 200</text>
<line x1="340.0" y1="186.0" x2="374.0" y2="186.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="676.0" y1="186.0" x2="710.0" y2="186.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1012.0" y1="186.0" x2="1046.0" y2="186.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1198.0" y1="242.0" x2="1198.0" y2="328.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1048.0" y1="386.0" x2="1014.0" y2="386.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="712.0" y1="386.0" x2="678.0" y2="386.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="376.0" y1="386.0" x2="342.0" y2="386.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="190.0" y1="442.0" x2="190.0" y2="528.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="340.0" y1="586.0" x2="374.0" y2="586.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="676.0" y1="586.0" x2="710.0" y2="586.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1012.0" y1="586.0" x2="1046.0" y2="586.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<path d="M862.0,130 C862.0,90 566.0,90 566.0,127" stroke="#c62828" stroke-width="1.6" fill="none" stroke-dasharray="7,4" marker-end="url(#aa)"/>
<text x="694.0" y="96.0" font-size="11" text-anchor="middle" fill="#c62828">bore too big / not standard → higher p</text>
<path d="M972,530 L972,445" stroke="#c62828" stroke-width="1.6" fill="none" stroke-dasharray="7,4" marker-end="url(#aa)"/>
<text x="982.0" y="490.0" font-size="11" text-anchor="start" fill="#c62828">heat &gt; tank cooling → change supply</text>
<path d="M526.0,642 L526.0,668 L22,668 L22,108 L466,108 L466,127" stroke="#c62828" stroke-width="1.6" fill="none" stroke-dasharray="7,4" marker-end="url(#aa)"/>
<text x="536.0" y="662.0" font-size="11" text-anchor="start" fill="#c62828">Δp &gt; loss budget → bigger line or higher p_sys (back to step 2)</text>
<rect x="40.0" y="720.0" width="640.0" height="110.0" rx="0" stroke="#000" stroke-width="1.2" fill="#f7f7f7"/>
<text x="52.0" y="742.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Inputs you must give (step 1)</text>
<text x="52.0" y="762.0" font-size="11" text-anchor="start" fill="#000">• every actuator: force (both directions), stroke, time, sequence, holding needs</text>
<text x="52.0" y="776.0" font-size="11" text-anchor="start" fill="#000">• cycle time, duty (h/day), ambient 5–40 °C, cleanliness of the most sensitive part</text>
<text x="52.0" y="790.0" font-size="11" text-anchor="start" fill="#000">• supply voltage, noise limit, safety functions (falling loads, clamps), standards</text>
<text x="52.0" y="804.0" font-size="11" text-anchor="start" fill="#000">• space for the power unit, piping length, who maintains it</text>
<rect x="700.0" y="720.0" width="230.0" height="110.0" rx="0" stroke="#000" stroke-width="1.2" fill="#f7f7f7"/>
<text x="712.0" y="742.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Outputs</text>
<text x="712.0" y="762.0" font-size="11" text-anchor="start" fill="#000">• ISO 1219-2 circuit</text>
<text x="712.0" y="776.0" font-size="11" text-anchor="start" fill="#000">• component list + settings</text>
<text x="712.0" y="790.0" font-size="11" text-anchor="start" fill="#000">• calculation report</text>
<text x="712.0" y="804.0" font-size="11" text-anchor="start" fill="#000">• RFQ / supplier spec</text>
<rect x="950.0" y="736.0" width="430.0" height="86.0" rx="0" stroke="#000" stroke-width="1.5" fill="none"/>
<line x1="950.0" y1="766.0" x2="1380.0" y2="766.0" stroke="#000" stroke-width="1"/>
<text x="960.0" y="757.0" font-size="14" text-anchor="start" fill="#c62828" font-weight="bold">EXAMPLE – check the supplier's catalogue</text>
<text x="960.0" y="786.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">25_design_method_flow – 12-step method</text>
<text x="960.0" y="804.0" font-size="11" text-anchor="start" fill="#000">Guide 25 §6 · rev A</text>
<text x="1370.0" y="816.0" font-size="11" text-anchor="end" fill="#555">values = example · ISO 1219 style</text>
</svg>