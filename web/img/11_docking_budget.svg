<text x="1100.5" y="697.0" font-size="11" text-anchor="start" fill="#c62828">support angle ±25</text>
<text x="24.0" y="722.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">C  AS/RS OUT → crate AGV → stand</text>
<text x="322.0" y="740.0" font-size="11" text-anchor="end" fill="#000">crate on the AGV plate</text>
<rect x="330.0" y="728.0" width="752.9" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="1078.9" y="739.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±22.2</text>
<line x1="1094.5" y1="725.0" x2="1094.5" y2="745.0" stroke="#c62828" stroke-width="3" />
<text x="1100.5" y="739.0" font-size="11" text-anchor="start" fill="#c62828" font-weight="bold">rim ±25 → TIGHT</text>
<text x="322.0" y="760.0" font-size="11" text-anchor="end" fill="#000">AGV at the stand (error added twice)</text>
<rect x="330.0" y="748.0" width="804.2" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="1130.2" y="759.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±37.5</text>
<line x1="1180.1" y1="745.0" x2="1180.1" y2="765.0" stroke="#c62828" stroke-width="3" />
<text x="1186.1" y="759.0" font-size="11" text-anchor="start" fill="#c62828">stand flare ±60</text>
<text x="322.0" y="780.0" font-size="11" text-anchor="end" fill="#000">crate seated in 4 V-guides</text>
<rect x="330.0" y="768.0" width="607.3" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="933.3" y="779.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±5</text>
<text x="987.3" y="779.0" font-size="11" text-anchor="start" fill="#000">end ±5</text>
<text x="330.0" y="830.0" font-size="11" text-anchor="start" fill="#000">Code rule: ok if catch ≥ 1.2 × need and ≥ need + 1 mm; tight if catch ≥ need; else fault. Each guide RESETS the error to its own clearance.</text>
