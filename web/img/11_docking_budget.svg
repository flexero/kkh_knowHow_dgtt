<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" width="1500" height="980" font-family="Arial, Helvetica, sans-serif">
<title>AGV docking accuracy budget – stop error RSS and coarse-to-fine catching chains (example)</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1500" height="980" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#000" font-weight="bold">Docking accuracy budget – (A) how exactly does the AGV stop?  (B) does every stage fit into the catch range of the next?</text>
<text x="24.0" y="52.0" font-size="12" text-anchor="start" fill="#444">Item 1 RSS budget (guide 4.1.11) and item 4 chains A / B / C (guide 4.4.4). All ± mm. Values verified with Python.</text>
<text x="24.0" y="90.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">(A) Stop error of the crate AGV U300 at a taught station</text>
<text x="322.0" y="129.0" font-size="12" text-anchor="end" fill="#000">localisation (navigation)</text>
<rect x="330.0" y="116.0" width="240.0" height="18.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="576.0" y="129.0" font-size="12" text-anchor="start" fill="#000">8</text>
<text x="322.0" y="157.0" font-size="12" text-anchor="end" fill="#000">stop control: creep × (cycle + brake)</text>
<rect x="330.0" y="144.0" width="45.0" height="18.0" rx="0" fill="#9e9e9e" stroke="#000" stroke-width="1" />
<text x="381.0" y="157.0" font-size="12" text-anchor="start" fill="#000">1.5</text>
<text x="322.0" y="185.0" font-size="12" text-anchor="end" fill="#000">odometry last 300 mm × 0.5 %</text>
<rect x="330.0" y="172.0" width="45.0" height="18.0" rx="0" fill="#9e9e9e" stroke="#000" stroke-width="1" />
<text x="381.0" y="185.0" font-size="12" text-anchor="start" fill="#000">1.5</text>
<text x="322.0" y="213.0" font-size="12" text-anchor="end" fill="#000">gearbox backlash r · 15′</text>
<rect x="330.0" y="200.0" width="9.9" height="18.0" rx="0" fill="#9e9e9e" stroke="#000" stroke-width="1" />
<text x="345.9" y="213.0" font-size="12" text-anchor="start" fill="#000">0.33</text>
<text x="322.0" y="241.0" font-size="12" text-anchor="end" fill="#000">scanner mount 0.05° at 4 m</text>
<rect x="330.0" y="228.0" width="104.7" height="18.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="440.7" y="241.0" font-size="12" text-anchor="start" fill="#000">3.49</text>
<text x="322.0" y="269.0" font-size="12" text-anchor="end" fill="#000">floor tilt (H + s) · Δ / track</text>
<rect x="330.0" y="256.0" width="95.4" height="18.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="431.4" y="269.0" font-size="12" text-anchor="start" fill="#000">3.18</text>
<text x="322.0" y="297.0" font-size="12" text-anchor="end" fill="#000">lift plate guide play</text>
<rect x="330.0" y="284.0" width="9.0" height="18.0" rx="0" fill="#9e9e9e" stroke="#000" stroke-width="1" />
<text x="345.0" y="297.0" font-size="12" text-anchor="start" fill="#000">0.3</text>
<line x1="30.0" y1="314.0" x2="950.0" y2="314.0" stroke="#000" stroke-width="0.8" />
<text x="322.0" y="333.0" font-size="12" text-anchor="end" fill="#000" font-weight="bold">RSS = √(Σ e²)  (independent errors)</text>
<rect x="330.0" y="320.0" width="286.2" height="18.0" rx="0" fill="#c62828" stroke="#000" stroke-width="1" />
<text x="622.2" y="333.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">±9.5</text>
<text x="322.0" y="361.0" font-size="12" text-anchor="end" fill="#000">worst case Σ|e| (all at maximum together – unlikely)</text>
<rect x="330.0" y="348.0" width="549.0" height="18.0" rx="0" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3" />
<text x="885.0" y="361.0" font-size="12" text-anchor="start" fill="#000">±18.3</text>
<text x="30.0" y="396.0" font-size="12" text-anchor="start" fill="#000">Angle error ±√(0.3² + 0.05² + atan(2·1.5/440)²) = ±0.50°  →  at the crate corner 9.5 + 600 · sin 0.50° = ±14.7 mm</text>
<text x="30.0" y="414.0" font-size="12" text-anchor="start" fill="#000">Station capture: V-guide 55 mm (stand), flare 40 mm (AS/RS)  →  need ≤ 35 mm with reserve  →  OK, do not buy a ±2 mm AGV.</text>
<text x="30.0" y="432.0" font-size="12" text-anchor="start" fill="#000">Biggest two sources: localisation and scanner mount angle → reflectors near stations + rigid, dowelled scanner brackets.</text>
<text x="24.0" y="470.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">(B) Coarse-to-fine chains – accuracy of each stage (bar) vs catch range of the next part (red tick), log scale</text>
<line x1="330.0" y1="500.0" x2="330.0" y2="790.0" stroke="#e4e4e4" stroke-width="0.8" />
<text x="330.0" y="806.0" font-size="11" text-anchor="middle" fill="#000">0.01 mm</text>
<line x1="555.0" y1="500.0" x2="555.0" y2="790.0" stroke="#e4e4e4" stroke-width="0.8" />
<text x="555.0" y="806.0" font-size="11" text-anchor="middle" fill="#000">0.1 mm</text>
<line x1="780.0" y1="500.0" x2="780.0" y2="790.0" stroke="#e4e4e4" stroke-width="0.8" />
<text x="780.0" y="806.0" font-size="11" text-anchor="middle" fill="#000">1 mm</text>
<line x1="1005.0" y1="500.0" x2="1005.0" y2="790.0" stroke="#e4e4e4" stroke-width="0.8" />
<text x="1005.0" y="806.0" font-size="11" text-anchor="middle" fill="#000">10 mm</text>
<line x1="1230.0" y1="500.0" x2="1230.0" y2="790.0" stroke="#e4e4e4" stroke-width="0.8" />
<text x="1230.0" y="806.0" font-size="11" text-anchor="middle" fill="#000">100 mm</text>
<text x="24.0" y="518.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">A  pallet AGV → APC</text>
<text x="322.0" y="536.0" font-size="11" text-anchor="end" fill="#000">AGV stops (nav + lever·sin yaw)</text>
<rect x="330.0" y="524.0" width="701.4" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="1027.4" y="535.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±13.1</text>
<line x1="1050.9" y1="521.0" x2="1050.9" y2="541.0" stroke="#c62828" stroke-width="3" />
<text x="1056.9" y="535.0" font-size="11" text-anchor="start" fill="#c62828">cone pin lead-in ±16</text>
<text x="322.0" y="556.0" font-size="11" text-anchor="end" fill="#000">deck docked on 2 cone pins + stop faces</text>
<rect x="330.0" y="544.0" width="360.5" height="14.0" rx="0" fill="#9e9e9e" stroke="#000" stroke-width="1" />
<text x="694.5" y="555.0" font-size="11" text-anchor="start" fill="#000">±0.4</text>
<text x="322.0" y="576.0" font-size="11" text-anchor="end" fill="#000">pallet at the retractable stop</text>
<rect x="330.0" y="564.0" width="489.6" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="815.6" y="575.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±1.5</text>
<line x1="887.4" y1="561.0" x2="887.4" y2="581.0" stroke="#c62828" stroke-width="3" />
<text x="893.4" y="575.0" font-size="11" text-anchor="start" fill="#c62828">receiver lead-in ±3</text>
<text x="322.0" y="596.0" font-size="11" text-anchor="end" fill="#000">pallet in 4 zero-point receivers</text>
<rect x="330.0" y="584.0" width="67.7" height="14.0" rx="0" fill="#9e9e9e" stroke="#000" stroke-width="1" />
<text x="401.7" y="595.0" font-size="11" text-anchor="start" fill="#000">±0.02</text>
<text x="447.7" y="595.0" font-size="11" text-anchor="start" fill="#000">end ±0.02</text>
<text x="24.0" y="620.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">B  crate AGV → AS/RS IN</text>
<text x="322.0" y="638.0" font-size="11" text-anchor="end" fill="#000">AGV stops</text>
<rect x="330.0" y="626.0" width="715.9" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="1041.9" y="637.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±15.2</text>
<line x1="1156.2" y1="623.0" x2="1156.2" y2="643.0" stroke="#c62828" stroke-width="3" />
<text x="1162.2" y="637.0" font-size="11" text-anchor="start" fill="#c62828">V-flare ±47</text>
<text x="322.0" y="658.0" font-size="11" text-anchor="end" fill="#000">crate on the conveyor (side guides)</text>
<rect x="330.0" y="646.0" width="640.1" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="966.1" y="657.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±7</text>
<text x="322.0" y="678.0" font-size="11" text-anchor="end" fill="#000">crate at P&amp;D incl. crane ±3</text>
<rect x="330.0" y="666.0" width="675.0" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="1001.0" y="677.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±10</text>
<line x1="1219.7" y1="663.0" x2="1219.7" y2="683.0" stroke="#c62828" stroke-width="3" />
<text x="1225.7" y="677.0" font-size="11" text-anchor="start" fill="#c62828">fork clearance ±90</text>
<text x="322.0" y="698.0" font-size="11" text-anchor="end" fill="#000">crate in the rack</text>
<rect x="330.0" y="686.0" width="675.0" height="14.0" rx="0" fill="#000" stroke="#000" stroke-width="1" />
<text x="1001.0" y="697.0" font-size="11" text-anchor="end" fill="#fff" font-weight="bold">±10</text>
