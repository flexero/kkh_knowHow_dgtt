<text x="400.0" y="818.0" font-size="12" text-anchor="start" fill="#000">Kf = 1 + q·(Kt − 1)</text>
<text x="780.0" y="818.0" font-size="12" text-anchor="end" fill="#000">1.82 / 1.41</text>
