<rect x="820.0" y="668.0" width="540.0" height="168.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="832.0" y="692.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Result at the shoulder (normal running):</text>
<text x="832.0" y="717.0" font-size="12" text-anchor="start" fill="#000">σa = M/W = 18 320 / 785 = 23.3 MPa   τm = T/Wp = 28 300 / 1571 = 18.0 MPa</text>
<text x="832.0" y="742.0" font-size="12" text-anchor="start" fill="#000">S_fatigue = 1 / (σa/σWK + σmv/Rm) = 1 / (23.3/239 + 31.2/1000) = 7.8</text>
<text x="832.0" y="767.0" font-size="12" text-anchor="start" fill="#000">Stall (motor 2.5 × 54.3 = 136 N·m, loads × 4.8): σv = √(112² + 3·86²) = 187 MPa</text>
<text x="832.0" y="792.0" font-size="12" text-anchor="start" fill="#000">S_static = Re / σv = 750 / 187 = 4.0 – shaft OK; the KEY is not (§19)</text>
<text x="832.0" y="817.0" font-size="12" text-anchor="start" fill="#c62828">Lesson: this shaft is sized by bearing bore, key and stiffness, not by fatigue.</text>
