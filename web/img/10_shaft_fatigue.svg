<text x="780.0" y="842.0" font-size="12" text-anchor="end" fill="#000">0.93</text>
<text x="400.0" y="866.0" font-size="12" text-anchor="start" fill="#000">surface factor KF (Rz 6.3)</text>
<text x="780.0" y="866.0" font-size="12" text-anchor="end" fill="#000">0.88</text>
<text x="400.0" y="890.0" font-size="12" text-anchor="start" fill="#000">total Kσ = Kf/K2 + 1/KF − 1</text>
<text x="780.0" y="890.0" font-size="12" text-anchor="end" fill="#000">2.09</text>
<text x="400.0" y="914.0" font-size="12" text-anchor="start" fill="#000">σbW = 0.5·Rm (Rm 1000)</text>
<text x="780.0" y="914.0" font-size="12" text-anchor="end" fill="#000">500 MPa</text>
<text x="400.0" y="938.0" font-size="12" text-anchor="start" fill="#000">σWK = σbW / Kσ</text>
<text x="780.0" y="938.0" font-size="12" text-anchor="end" fill="#c62828" font-weight="bold">239 MPa</text>
