<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Inverse kinematics – wrist centre, J1 from the top view, J2 / J3 from a triangle</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="eg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#555"/></marker>
<marker id="sg" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#555"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24" y="30" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Arm plane (r = horizontal distance from the J1 axis, z = height), mm</text>
<line x1="27" y1="720" x2="650.5" y2="720" stroke="#000" stroke-width="1.4"/>
<rect x="27" y="720" width="623.5" height="10" rx="0" stroke="none" stroke-width="0" fill="url(#hatch)"/>
<line x1="70" y1="728.6" x2="70" y2="182.5" stroke="#555" stroke-width="0.8" stroke-dasharray="14 3 2 3"/>
<text x="74" y="186.8" font-size="11" text-anchor="start" fill="#555">J1 axis</text>
<rect x="18.4" y="502.9" width="129" height="217.2" rx="0" stroke="#9a9a9a" stroke-width="1" fill="#f4f4f4"/>
<path d="M134.5,528.6 L395.5,678.6 L558.2,373.9" stroke="#9a9a9a" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
<text x="403.5" y="672.6" font-size="11" text-anchor="start" fill="#555">elbow down (γ &gt; 0) – second solution</text>
<line x1="134.5" y1="528.6" x2="237.4" y2="245.8" stroke="#000" stroke-width="7"/>
<path d="M237.4,245.8 L262.2,203 L558.2,373.9" stroke="#000" stroke-width="5" fill="none"/>
<line x1="237.4" y1="245.8" x2="558.2" y2="373.9" stroke="#1f6fd1" stroke-width="1.4" stroke-dasharray="6 4"/>
<line x1="134.5" y1="528.6" x2="558.2" y2="373.9" stroke="#1f6fd1" stroke-width="1.6" stroke-dasharray="8 4"/>
<line x1="558.2" y1="373.9" x2="597.2" y2="481" stroke="#000" stroke-width="4"/>
<circle cx="134.5" cy="528.6" r="10" stroke="#000" stroke-width="1.6" fill="#fff"/>
<circle cx="237.4" cy="245.8" r="9" stroke="#000" stroke-width="1.6" fill="#fff"/>
<circle cx="558.2" cy="373.9" r="8" stroke="#000" stroke-width="1.6" fill="#fff"/>
<line x1="589.2" y1="481" x2="605.2" y2="481" stroke="#1f6fd1" stroke-width="1.6"/>
<line x1="597.2" y1="473" x2="597.2" y2="489" stroke="#1f6fd1" stroke-width="1.6"/>
<text x="585.2" y="499" font-size="12" text-anchor="end" fill="#1f6fd1" font-weight="bold">TCP (target)</text>
<text x="120.5" y="554.6" font-size="12" text-anchor="end" fill="#000" font-weight="bold">J2 (shoulder)</text>
<text x="223.4" y="237.8" font-size="12" text-anchor="end" fill="#000" font-weight="bold">J3 (elbow)</text>
<text x="572.2" y="363.9" font-size="12" text-anchor="start" fill="#000" font-weight="bold">wrist centre p_w</text>
<text x="172" y="387.2" font-size="12" text-anchor="end" fill="#000" font-weight="bold">a2 = 700</text>
<text x="337.4" y="395.8" font-size="12" text-anchor="middle" fill="#1f6fd1" font-weight="bold">b = √(a3² + d4²) = 803.3</text>
<text x="366.4" y="477.3" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">L = √(r² + z²) = 1049.1</text>
<text x="440.2" y="276.4" font-size="11" text-anchor="start" fill="#000">d4 = 795</text>
<text x="270.2" y="195" font-size="11" text-anchor="start" fill="#000">a3 = 115</text>
<text x="587.7" y="427.4" font-size="11" text-anchor="start" fill="#000">d6 + tool = 265</text>
<line x1="134.5" y1="528.6" x2="634.2" y2="528.6" stroke="#555" stroke-width="0.7" stroke-dasharray="3 3"/>
<line x1="134.5" y1="525.6" x2="134.5" y2="523.6" stroke="#555" stroke-width="0.7"/>
<line x1="558.2" y1="525.6" x2="558.2" y2="523.6" stroke="#555" stroke-width="0.7"/>
<line x1="134.5" y1="528.6" x2="558.2" y2="528.6" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="346.4" y="524.6" font-size="11" text-anchor="middle" fill="#000"></text>
<text x="416.4" y="544.6" font-size="12" text-anchor="middle" fill="#000">r = r_w − a1 = 985.4</text>
<line x1="631.2" y1="528.6" x2="633.2" y2="528.6" stroke="#555" stroke-width="0.7"/>
<line x1="631.2" y1="373.9" x2="633.2" y2="373.9" stroke="#555" stroke-width="0.7"/>
<line x1="628.2" y1="528.6" x2="628.2" y2="373.9" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="615.2" y="451.3" font-size="11" text-anchor="middle" fill="#000" transform="rotate(90 615.2 451.3)">z = 359.9</text>
<line x1="568.2" y1="373.9" x2="634.2" y2="373.9" stroke="#555" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="70" y1="561.6" x2="70" y2="563.6" stroke="#555" stroke-width="0.7"/>
<line x1="134.5" y1="561.6" x2="134.5" y2="563.6" stroke="#555" stroke-width="0.7"/>
<line x1="70" y1="558.6" x2="134.5" y2="558.6" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="102.2" y="571.6" font-size="11" text-anchor="middle" fill="#000">a1 = 150</text>
<line x1="47.2" y1="720" x2="49.2" y2="720" stroke="#555" stroke-width="0.7"/>
<line x1="47.2" y1="528.6" x2="49.2" y2="528.6" stroke="#555" stroke-width="0.7"/>
<line x1="44.2" y1="720" x2="44.2" y2="528.6" stroke="#000" stroke-width="0.9" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="48.2" y="624.3" font-size="11" text-anchor="middle" fill="#000" transform="rotate(90 48.2 624.3)">h1 = 445</text>
<path d="M254.5,528.6 A120,120 0 0 0 247.2,487.5" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#eg)"/>
<text x="296.5" y="509.3" font-size="12" text-anchor="middle" fill="#555" font-weight="bold">20.06°</text>
<path d="M204.5,528.6 A70,70 0 0 0 158.4,462.9" stroke="#1f6fd1" stroke-width="1.4" fill="none" marker-end="url(#ea)"/>
<text x="233.3" y="468.5" font-size="12" text-anchor="middle" fill="#1f6fd1" font-weight="bold">α2 = 70.00°</text>
<path d="M256.3,194.1 A55,55 0 0 1 288.5,266.2" stroke="#1f6fd1" stroke-width="1.4" fill="none" marker-end="url(#ea)"/>
<text x="300.4" y="221.6" font-size="12" text-anchor="middle" fill="#1f6fd1" font-weight="bold"></text>
<text x="225.4" y="187.8" font-size="12" text-anchor="end" fill="#1f6fd1" font-weight="bold">γ = −91.77°</text>
<line x1="237.4" y1="245.8" x2="268.2" y2="161.2" stroke="#555" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="237.4" y1="245.8" x2="376" y2="325.8" stroke="#555" stroke-width="0.8" stroke-dasharray="4 3"/>
<path d="M358.2,294 A130,130 0 0 1 350,310.8" stroke="#000" stroke-width="1.4" fill="none" marker-end="url(#ek)"/>
<text x="367" y="312.7" font-size="12" text-anchor="middle" fill="#000" font-weight="bold"></text>
<text x="297.4" y="320.8" font-size="11" text-anchor="end" fill="#000" font-weight="bold">β = 8.23°</text>
<rect x="760" y="50" width="426" height="92" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="768" y="66.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Step 1 – wrist centre</text>
<text x="768" y="82.6" font-size="11.5" text-anchor="start" fill="#000">p_w = p_TCP − (d6 + tool) · z_tool</text>
<text x="768" y="98.1" font-size="11.5" text-anchor="start" fill="#000">= (1061.8, 613.0, 555.9) − 265 · z_tool</text>
<text x="768" y="113.6" font-size="11.5" text-anchor="start" fill="#000">= (983.3, 567.7, 804.9) mm  →  r_w = 1135.4</text>
<rect x="760" y="152" width="426" height="74" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="768" y="168.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Step 2 – J1 from the top view</text>
<text x="768" y="184.6" font-size="11.5" text-anchor="start" fill="#000">q1 = atan2(y_w, x_w) = atan2(567.7, 983.3) = 30.00°</text>
<text x="768" y="200.1" font-size="11.5" text-anchor="start" fill="#000">(second solution: q1 + 180°, arm over the back)</text>
<text x="760" y="250" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Top view</text>
<line x1="800" y1="360" x2="1000" y2="360" stroke="#000" stroke-width="1.2" marker-end="url(#ek)"/>
<text x="1004" y="364" font-size="12" text-anchor="start" fill="#000" font-weight="bold">x</text>
<line x1="800" y1="360" x2="800" y2="260" stroke="#000" stroke-width="1.2" marker-end="url(#ek)"/>
<text x="794" y="258" font-size="12" text-anchor="end" fill="#000" font-weight="bold">y</text>
<line x1="800" y1="360" x2="957.3" y2="269.2" stroke="#1f6fd1" stroke-width="1.6" stroke-dasharray="6 3"/>
<circle cx="957.3" cy="269.2" r="5" stroke="#000" stroke-width="1.3" fill="#fff"/>
<text x="965.3" y="267.2" font-size="11" text-anchor="start" fill="#000">p_w (top)</text>
<path d="M860,360 A60,60 0 0 0 852,330" stroke="#1f6fd1" stroke-width="1.4" fill="none" marker-end="url(#ea)"/>
<text x="870" y="348" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">q1 = 30°</text>
<text x="868.7" y="304.6" font-size="11" text-anchor="end" fill="#000">r_w = 1135.4</text>
<rect x="760" y="390" width="426" height="196" rx="4" stroke="#1f6fd1" stroke-width="1.2" fill="#fff"/>
<text x="768" y="406.5" font-size="12.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Step 3 – J2, J3 from the triangle (law of cosines)</text>
<text x="768" y="422.6" font-size="11.5" text-anchor="start" fill="#000">cos γ = (L² − a2² − b²) / (2 · a2 · b) = −0.0309</text>
<text x="768" y="438.1" font-size="11.5" text-anchor="start" fill="#000">γ = −91.77° (elbow up)   or   +91.77° (elbow down)</text>
<text x="768" y="453.7" font-size="11.5" text-anchor="start" fill="#000">α2 = atan2(z, r) − atan2(b·sin γ, a2 + b·cos γ)</text>
<text x="768" y="469.2" font-size="11.5" text-anchor="start" fill="#000">    = 20.06° − (−49.94°) = 70.00°</text>
<text x="768" y="484.7" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">q2 = 90° − α2 = 20.00°</text>
<text x="768" y="500.2" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">q3 = β − 90° − γ = 8.23 − 90 + 91.77 = 10.00°</text>
<text x="768" y="515.8" font-size="11.5" text-anchor="start" fill="#000">|cos γ| &gt; 1 → the triangle cannot close → out of reach</text>
<rect x="760" y="596" width="426" height="92" rx="4" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="768" y="612.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Step 4 – J4, J5, J6 from the wrist rotation</text>
<text x="768" y="628.6" font-size="11.5" text-anchor="start" fill="#000">R36 = R03ᵀ · R_target · Ry(90°)ᵀ = Rx(q4) · Ry(q5) · Rx(q6)</text>
<text x="768" y="644.1" font-size="11.5" text-anchor="start" fill="#000">→ q4 = 0°, q5 = 40°, q6 = 0°  (q5 = 0 → wrist singularity)</text>
<text x="768" y="659.6" font-size="11.5" text-anchor="start" fill="#000">up to 8 solutions: front/back × elbow up/down × wrist flip</text>
<rect x="540" y="764" width="648" height="54" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="540" y1="790" x2="1188" y2="790" stroke="#000" stroke-width="0.8"/>
<line x1="910" y1="790" x2="910" y2="818" stroke="#000" stroke-width="0.8"/>
<text x="548" y="782" font-size="14" font-weight="bold">Inverse kinematics – wrist centre, J1 from the top view, J2 / J3 from a triangle</text>
<text x="548" y="809" font-size="12" font-weight="bold" fill="#1f6fd1">EXAMPLE – check the maker's documentation</text>
<text x="918" y="802" font-size="11.5">Dwg 22-02 · guide 22 §7 steps 1–4</text>
<text x="918" y="814" font-size="11">example pose q = (30, 20, 10, 0, 40, 0)° – IRB 2600</text>
</svg>
