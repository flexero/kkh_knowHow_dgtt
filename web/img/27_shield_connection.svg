<text x="1071.0" y="124.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">shield clamp, full contact round the braid</text>
<text x="720.0" y="270.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">contact ≈ 0.5 nH (very short, wide)</text>
<text x="720.0" y="288.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">X = 2π · 10 MHz · 0.5 nH = 0.031 Ω</text>
<text x="720.0" y="306.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 A → 31 mV (100 × better)</text>
<text x="720.0" y="324.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">both ends: drive side clamp + EMC gland / metal connector at motor</text>
<text x="40.0" y="370.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">Cabinet EMC zones (machine control cabinet, top view of the mounting plate)</text>
