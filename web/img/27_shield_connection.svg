<text x="411.0" y="196.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">pigtail 50 mm ≈ 50 nH</text>
<text x="60.0" y="270.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Rule of thumb: ≈ 1 nH per mm of wire</text>
<text x="60.0" y="288.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">X = 2π · f · L = 2π · 10 MHz · 50 nH = 3.14 Ω</text>
<text x="60.0" y="306.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 A HF shield current → 3.1 V noise right at the connector</text>
<text x="60.0" y="324.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">the shield 'floats' at HF → noise couples into the pairs</text>
<text x="720.0" y="92.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">b) 360° CLAMP / EMC GLAND (right)</text>
