<text x="835.0" y="795.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">shield clamp rail for encoder / analog / network</text>
<line x1="540.0" y1="630.0" x2="640.0" y2="630.0" stroke="#000" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="590.0" y="622.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">≥ 200 mm</text>
<text x="590.0" y="650.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">or metal wall</text>
<path d="M 1060 520 q 30 10 0 20 q -30 10 0 20 q 30 10 0 20" stroke="#000" stroke-width="2" fill="none"/>
<text x="1080.0" y="540.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">door bonded with short</text>
<text x="1080.0" y="554.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">flat braid (not a thin wire)</text>
<text x="1080.0" y="610.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Rules</text>
<text x="1080.0" y="630.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• filter at the cabinet entry,</text>
<text x="1080.0" y="645.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">  input and output cables apart</text>
<text x="1080.0" y="660.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• motor cables never through</text>
<text x="1080.0" y="675.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">  the clean zone</text>
<text x="1080.0" y="690.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• signals cross power at 90°</text>
<text x="1080.0" y="705.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• analog shield: input side,</text>
<text x="1080.0" y="720.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">  or both ends + bonding</text>
<text x="1080.0" y="735.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">  conductor (16 mm²)</text>
<text x="1080.0" y="750.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• unused cores: earth both ends</text>
</svg>