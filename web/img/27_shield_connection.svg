<text x="915.0" y="534.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0 V earthed once)</text>
<rect x="660.0" y="590.0" width="350.0" height="60.0" rx="0" stroke="#000" stroke-width="1.5" fill="#fff"/>
<text x="835.0" y="625.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">I/O modules, safety relay, terminals</text>
