<text x="24.0" y="660.0" font-size="12" text-anchor="start" fill="#000">Deposit = the same frames backwards: carry at 180 (runners 60 over the beams), extend, lower 100 (60 to set down + 40 free), retract empty.</text>
<text x="24.0" y="682.0" font-size="12" text-anchor="start" fill="#000">Times (core asrscore, items 1 / 6 / 7): fine positioning 3.0 s + extend 2.18 s + lift 0.5 s + retract 2.18 s → load handling 4.87 s per stop.</text>
<text x="24.0" y="704.0" font-size="12" text-anchor="start" fill="#1f6fd1">Item 7 cycle: travel 3.92 + 3.0 + 4.87 (pick L) + travel 3.92 + 3.0 + 4.87 (store R) = 23.58 s.</text>
