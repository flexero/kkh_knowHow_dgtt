<text x="860.0" y="250.0" font-size="12" text-anchor="start" fill="#111">Lq = ρ² / (1 − ρ)    Wq = ρ / (μ − λ)</text>
<text x="860.0" y="269.0" font-size="12" text-anchor="start" fill="#111">Little: Lq = λ × Wq = 14.4 × 17.8/60 = 4.27 parts</text>
<text x="860.0" y="288.0" font-size="12" text-anchor="start" fill="#111">B_P4 holds 6 parts → full ≈ 6 % of the time</text>
<text x="860.0" y="307.0" font-size="12" text-anchor="start" fill="#111">(M/M/1/K, K = 6 + 1 in the machine).</text>
<text x="860.0" y="326.0" font-size="12" text-anchor="start" fill="#111"></text>
