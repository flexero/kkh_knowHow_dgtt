<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">01 – Waiting time grows without limit when utilisation ρ → 1 (M/M/1 and Kingman) – FINAL-01 and WASH-01 examples</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" fill="#444">y = waiting time in the queue Wq divided by the service time ts.  M/M/1: Wq/ts = ρ/(1−ρ).  Kingman G/G/1: Wq/ts ≈ (ca² + cs²)/2 × ρ/(1−ρ).</text>
