<text x="860.0" y="383.0" font-size="12" text-anchor="start" fill="#111">Erlang C: P(wait) = 0.587, Wq = 5.9 min</text>
<text x="860.0" y="402.0" font-size="12" text-anchor="start" fill="#111"></text>
<text x="860.0" y="421.0" font-size="12" text-anchor="start" fill="#111">Real cycle times are almost constant</text>
<text x="860.0" y="440.0" font-size="12" text-anchor="start" fill="#111">(cs² ≈ 0.1) → Kingman gives ≈ 55 % of</text>
<text x="860.0" y="459.0" font-size="12" text-anchor="start" fill="#111">M/M/1: FINAL-01 @ 12 /h: 8.0 → 4.4 min.</text>
<text x="860.0" y="478.0" font-size="12" text-anchor="start" fill="#111">But SETUP (29 % of FINAL-01 time in the</text>
