<text x="830.0" y="100.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Fleet sizing (guide §25.4)</text>
<text x="830.0" y="122.0" font-size="12" text-anchor="start" fill="#000">N = workload / (3600 · u · A),  workload = trips/h · cycle time</text>
<text x="830.0" y="140.0" font-size="12" text-anchor="start" fill="#000">u = 0.70 target utilisation · A = 0.90 availability (charging, service)</text>
<text x="830.0" y="172.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Vehicle / task</text>
<text x="1080.0" y="172.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">cycle</text>
<text x="1150.0" y="172.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">per h</text>
<text x="1220.0" y="172.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">s/h</text>
<text x="1290.0" y="172.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">N calc</text>
<text x="1370.0" y="172.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">buy</text>
<line x1="830.0" y1="178.0" x2="1470.0" y2="178.0" stroke="#000" stroke-width="1" />
<text x="830.0" y="198.0" font-size="12" text-anchor="start" fill="#000">U300 castings: full crate in,</text>
<text x="1080.0" y="198.0" font-size="12" text-anchor="start" fill="#000">184 s</text>
<text x="1150.0" y="198.0" font-size="12" text-anchor="start" fill="#000">5.0</text>
<text x="1220.0" y="198.0" font-size="12" text-anchor="start" fill="#000">922</text>
<text x="1290.0" y="198.0" font-size="12" text-anchor="start" fill="#000">0.41</text>
<text x="1370.0" y="198.0" font-size="12" text-anchor="start" fill="#000">1 + 1</text>
<text x="830.0" y="216.0" font-size="12" text-anchor="start" fill="#000">   empty crate back to AS/RS</text>
<text x="1080.0" y="216.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1150.0" y="216.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1220.0" y="216.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1290.0" y="216.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1370.0" y="216.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="830.0" y="234.0" font-size="12" text-anchor="start" fill="#000">P1000 pallets: 4 hand-overs</text>
<text x="1080.0" y="234.0" font-size="12" text-anchor="start" fill="#000">174 s</text>
<text x="1150.0" y="234.0" font-size="12" text-anchor="start" fill="#000">17.2</text>
<text x="1220.0" y="234.0" font-size="12" text-anchor="start" fill="#000">2986</text>
<text x="1290.0" y="234.0" font-size="12" text-anchor="start" fill="#000">1.32</text>
<text x="1370.0" y="234.0" font-size="12" text-anchor="start" fill="#000">2</text>
<text x="830.0" y="252.0" font-size="12" text-anchor="start" fill="#000">   per crankcase (LOAD – HMC)</text>
<text x="1080.0" y="252.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1150.0" y="252.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1220.0" y="252.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1290.0" y="252.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1370.0" y="252.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="830.0" y="290.0" font-size="12" text-anchor="start" fill="#000">U300 cycle = 2 legs × 42.5 s + 4 station events × 19.7 s + 10 s shuffle + 10 s crane wait.</text>
<text x="830.0" y="308.0" font-size="12" text-anchor="start" fill="#000">P1000 cycle = 32 + 33 + 32 + 33 s hand-over (§4.3.1) + 2 legs × 21.8 s.</text>
<text x="830.0" y="326.0" font-size="12" text-anchor="start" fill="#000">2 × P1000: each 46 % busy; one down → 92 % → line slows (accept or buy 3rd).</text>
<text x="830.0" y="344.0" font-size="12" text-anchor="start" fill="#000">Maximum with 2 P1000 at 85 %: 31.7 crankcases/h (needed 17.2).</text>
<text x="830.0" y="380.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Traffic rules (fleet manager, VDA 5050)</text>
<text x="830.0" y="402.0" font-size="12" text-anchor="start" fill="#000">1  Zone reservation (mutex): only one vehicle in Z1, Z2, Z3 and in crossing C1.</text>
<text x="830.0" y="420.0" font-size="12" text-anchor="start" fill="#000">2  A vehicle enters a zone only when the fleet manager released the nodes</text>
<text x="830.0" y="438.0" font-size="12" text-anchor="start" fill="#000">   (VDA 5050 base = released, horizon = planned, not yet allowed).</text>
<text x="830.0" y="456.0" font-size="12" text-anchor="start" fill="#000">3  Waiting points W1 / W2 on the P1000 lane – the second P1000 waits there</text>
<text x="830.0" y="474.0" font-size="12" text-anchor="start" fill="#000">   while the first docks (no passing in the lane).</text>
<text x="830.0" y="492.0" font-size="12" text-anchor="start" fill="#000">4  Deadlock rule: never release a vehicle into a dead-end (APC spur)</text>
<text x="830.0" y="510.0" font-size="12" text-anchor="start" fill="#000">   unless its exit path is free; reserve spur + lane node together.</text>
<text x="830.0" y="528.0" font-size="12" text-anchor="start" fill="#000">5  Right of way at C1: loaded before empty, then first come first served.</text>
<text x="830.0" y="546.0" font-size="12" text-anchor="start" fill="#000">6  Speed zones are map zones: 1.2 m/s aisle, 0.6 m/s lanes, 0.3 m/s near</text>
<text x="830.0" y="564.0" font-size="12" text-anchor="start" fill="#000">   stations and people, 0.05 m/s docking – with the matching field sets.</text>
<text x="830.0" y="582.0" font-size="12" text-anchor="start" fill="#000">7  People cross only at marked crossings; restricted zone at the APC</text>
<text x="830.0" y="600.0" font-size="12" text-anchor="start" fill="#000">   stations (ISO 3691-4) – fence or floor marking + signs.</text>
<text x="830.0" y="618.0" font-size="12" text-anchor="start" fill="#000">8  Opportunity charging at LOAD-CC (P1000) and CHG-01/02 (U300);</text>
<text x="830.0" y="636.0" font-size="12" text-anchor="start" fill="#000">   send to charger at SOC ≤ 25 %, release at ≥ 60 % if work waits.</text>
<text x="830.0" y="676.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Distances (example)</text>
<text x="830.0" y="698.0" font-size="12" text-anchor="start" fill="#000">AS/RS I/O → stand: 2.7 + 7.8 + 24.3 = 34.8 m (Manhattan route of the twin)</text>
<text x="830.0" y="716.0" font-size="12" text-anchor="start" fill="#000">LOAD-CC → APC HMC-01 / 02 / 03: ≈ 11.0 / 6.2 / 2.2 m (lane + spurs), mean 6.5 m;</text>
<text x="830.0" y="734.0" font-size="12" text-anchor="start" fill="#000">   sizing uses 12 m per leg (conservative: turns, buffer, detours).</text>
