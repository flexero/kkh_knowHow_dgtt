<text x="1010.0" y="560.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Z_s = √(ΣR² + ΣX²)</text>
<text x="1010.0" y="576.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ΣR = 1.703 + 44.37 + 46.35 = 92.43</text>
<text x="1010.0" y="592.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ΣX = 9.685 + 9.60 + 4.00 = 23.29</text>
<text x="1010.0" y="608.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Z_s = √(92.43² + 23.29²) = 95.3 mΩ</text>
<text x="1010.0" y="624.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Ik1 = 219.4 V / 0.0953 Ω = 2302 A</text>
<text x="1010.0" y="640.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">I_a = 1.2 · I_m = 1.2 · 800 = 960 A</text>
