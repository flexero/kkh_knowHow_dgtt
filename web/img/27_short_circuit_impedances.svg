<text x="40.0" y="830.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Why two calculations? Ik3 max chooses the breaking capacity I_cu and the peak rating I_pk of boards; Ik1 min proves that the protective device</text>
