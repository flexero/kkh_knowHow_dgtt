<text x="1010.0" y="110.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Z_Q = 1.1·U²/S″k = 1.1·400²/500 MVA = 0.352</text>
<text x="1010.0" y="126.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">  X_Q = 0.995·Z_Q, R_Q = 0.1·X_Q</text>
<text x="1010.0" y="142.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Z_T = u_k·U²/S_T = 0.06·400²/1000 kVA = 9.6</text>
<text x="1010.0" y="158.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">R_T = P_k·U²/S_T² = 10.5 kW·400²/(1000 kVA)² = 1.68</text>
<text x="1010.0" y="174.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">X_T = √(9.6² − 1.68²) = 9.452</text>
<text x="1010.0" y="190.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">cable: R = R₂₀·L (Ω/km × m = mΩ), X = 0.08·L</text>
<text x="1010.0" y="206.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Ik3 = c·U / (√3·|ΣZ|)</text>
<text x="1010.0" y="222.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">κ = 1.02 + 0.98·e^(−3R/X); ip = κ·√2·Ik3</text>
