<text x="42.0" y="246.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">MES: work orders, dispatch, traceability, SPC, OEE, maintenance; twin</text>
<text x="42.0" y="270.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">time frame: days – minutes</text>
<text x="42.0" y="290.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">typical protocols up: OPC UA, MQTT, SQL</text>
