<text x="130.0" y="452.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Basic control</text>
<text x="42.0" y="478.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">PLC, safety PLC, CNC, robot controller, test-bench DAQ</text>
<text x="42.0" y="502.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">time frame: ms – s</text>
<text x="42.0" y="522.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">typical protocols up: PROFINET, EtherCAT, PROFIsafe</text>
