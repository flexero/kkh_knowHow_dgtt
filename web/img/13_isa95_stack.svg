<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">13 – Digital factory stack: ISA-95 / IEC 62264 levels, systems, time frames, protocols and IEC 62443 zones</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444">Left: functional levels with the systems of this project. Right: security zones and conduits (firewalls) – one zone per cell, DMZ between IT and OT.</text>
