<text x="42.0" y="130.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">ERP: sales orders, MRP, purchasing, cost, finance</text>
<text x="42.0" y="154.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">time frame: months – days</text>
<text x="42.0" y="174.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">typical protocols up: REST / B2MML / EDI</text>
