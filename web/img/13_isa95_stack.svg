<text x="130.0" y="336.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Supervisory control</text>
<text x="42.0" y="362.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">SCADA / HMI, historian, alarm server, AGV fleet manager</text>
<text x="42.0" y="386.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">time frame: minutes – seconds</text>
<text x="42.0" y="406.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">typical protocols up: OPC UA, VDA 5050</text>
