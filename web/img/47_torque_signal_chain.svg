"650" y2="370.0" stroke="#888" stroke-width="0.8" stroke-dasharray="4 4"/><text x="656" y="374.0" font-size="11.5" text-anchor="start" fill="#000">Tmin 0.240</text><line x1="70" y1="287.0" x2="650" y2="287.0" stroke="#888" stroke-width="0.8" stroke-dasharray="4 4"/><text x="656" y="291.0" font-size="11.5" text-anchor="start" fill="#000">0.406 = 0.29 + 40 %</text><line x1="70" y1="403.0" x2="650" y2="403.0" stroke="#888" stroke-width="0.8" stroke-dasharray="4 4"/><text x="656" y="407.0" font-size="11.5" text-anchor="start" fill="#000">0.174 = 0.29 − 40 %</text><line x1="111.42857142857142" y1="190" x2="111.42857142857142" y2="490" stroke="#000" stroke-width="1" stroke-dasharray="6 3"/><text x="111.42857142857142" y="520" font-size="11.5" text-anchor="middle" fill="#000">50 mm</text><line x1="608.5714285714286" y1="190" x2="608.5714285714286" y2="490" stroke="#000" stroke-width="1" stroke-dasharray="6 3"/><text x="608.5714285714286" y="520" font-size="11.5" text-anchor="middle" fill="#000">650 mm</text><text x="360.0" y="520" font-size="12" text-anchor="middle" font-weight="700" fill="#000">measuring window (360 samples)</text><text x="70.0" y="504" font-size="11" text-anchor="start" fill="#000">0</text><text x="152.85714285714283" y="504" font-size="11" text-anchor="start" fill="#000">100</text><text x="235.7142857142857" y="504" font-size="11" text-anchor="start" fill="#000">200</text><text x="318.57142857142856" y="504" font-size="11" text-anchor="start" fill="#000">300</text><text x="401.4285714285714" y="504" font-size="11" text-anchor="start" fill="#000">400</text><text x="484.2857142857143" y="504" font-size="11" text-anchor="start" fill="#000">500</text><text x="567.1428571428571" y="504" font-size="11" text-anchor="start" fill="#000">600</text><text x="650.0" y="504" font-size="11" text-anchor="start" fill="#000">700</text><text x="860" y="210" font-size="14" text-anchor="start" font-weight="700" fill="#000">Evaluation in the PLC (step 4)</text><text x="860" y="236" font-size="12.5" text-anchor="start" fill="#000">n = 600 mm / (16.67 mm/s × 0.1 s) = 360</text><text x="860" y="260" font-size="12.5" text-anchor="start" fill="#000">Tp = Σ T / n = 0.300 N·m</text><text x="860" y="284" font-size="12.5" text-anchor="start" fill="#000">ΔTp = max(Tmax − Tp, Tp − Tmin) = 0.060</text><text x="860" y="308" font-size="12.5" text-anchor="start" fill="#000">ΔTp / Tp = 0.060 / 0.300 = 20 %</text><text x="860" y="332" font-size="12.5" text-anchor="start" fill="#1f6fd1">OK: 0.174 ≤ Tp ≤ 0.406 AND ≤ 40 %</text><text x="860" y="356" font-size="12.5" text-anchor="start" fill="#000">drag force F = 2π Tp / lead = 188.5 N</text><text x="860" y="380" font-size="12.5" text-anchor="start" fill="#000">tight spot + 0.25 N·m at 300 mm:</text><text x="860" y="404" font-size="12.5" text-anchor="start" fill="#000">   ΔTp ≈ 0.30 → 93 % → NOK</text><text x="860" y="428" font-size="12.5" text-anchor="start" fill="#000">limits: example – check ISO 3408-3 /</text><text x="860" y="452" font-size="12.5" text-anchor="start" fill="#000">   JIS B 1192 table for grade + length</text><text x="30" y="560" font-size="14" text-anchor="start" font-weight="700" fill="#000">Good practice</text><text x="30" y="586" font-size="12.5" text-anchor="start" fill="#000">• tare the amplifier at standstill (0.5 s) and store the residual offset – subtract it from every sample</text><text x="30" y="610" font-size="12.5" text-anchor="start" fill="#000">• ignore the first and last 50 mm (acceleration, seal friction at the screw ends); constant speed in the window</text><text x="30" y="634" font-size="12.5" text-anchor="start" fill="#000">• sample with a fixed time base (10 Hz clock / cyclic interrupt OB), not 'every scan' – the scan time varies</text><text x="30" y="658" font-size="12.5" text-anchor="start" fill="#000">• 16-bit AI and a 2 N·m sensor for a 0.3 N·m torque: resolution 2 N·m / 27648 ≈ 0.07 mN·m – fine; a 20 N·m sensor would be too coarse</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>