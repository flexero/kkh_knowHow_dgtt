<rect x="20.0" y="660.0" width="860.0" height="255.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="34.0" y="684.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Key numbers (formulas in chapter 20)</text>
<text x="34.0" y="708.0" font-size="12" text-anchor="start" fill="#000">q_s = v_s · 60 / v_w = 45 · 60 / 20 = 135 (external 60–150)</text>
<text x="34.0" y="729.0" font-size="12" text-anchor="start" fill="#000">d_e = d_s · d_w / (d_s + d_w) = 400 · 70 / 470 = 59.6 mm ; internal 32 · 46.4 / 14.4 = 103 mm</text>
<text x="34.0" y="750.0" font-size="12" text-anchor="start" fill="#000">Q′_w = π · d_w · v_fr = π · 70 · 0.00303 = 0.67 mm³/(mm·s) ; h_eq = 0.015 µm</text>
<text x="34.0" y="771.0" font-size="12" text-anchor="start" fill="#000">l_g = √(a_e · d_e) = √(0.002 · 59.6) = 0.35 mm ; P = e_c · Q′_w · b = 40 · 0.67 · 40 = 1.07 kW</text>
<text x="34.0" y="792.0" font-size="12" text-anchor="start" fill="#000">Burn estimate: CBN careful Δθ ≈ 34 K (safe) · corundum aggressive Δθ ≈ 500 K (burn!)</text>
<text x="34.0" y="813.0" font-size="12" text-anchor="start" fill="#000">Plunge time = 0.14 + 0.11 + 0.1 = 0.35 min ; all ground surfaces + dressing ≈ 20 min</text>
<text x="34.0" y="834.0" font-size="12" text-anchor="start" fill="#000">Coolant: neat oil, 40–80 l/min for a 40 mm wheel, ≤ 5 µm filter, chiller ±0.5 K</text>
<text x="34.0" y="855.0" font-size="12" text-anchor="start" fill="#000">Thermal: 0.5 K coolant drift → 0.4 µm on Ø70 (js4 band ±4 µm)</text>
<text x="34.0" y="876.0" font-size="12" text-anchor="start" fill="#000">Dressing: U_d = b_d / f_ad = 0.5 / 0.1 = 5 ; rotary dresser q_d ≈ +0.5 … +0.8</text>
