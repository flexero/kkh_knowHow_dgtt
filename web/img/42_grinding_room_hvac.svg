<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#111"/></marker><marker id="arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#1f6fd1"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs><rect width="1200" height="830" fill="#fff"/><text x="20.0" y="30.0" font-size="20" font-weight="700">Grinding room HVAC – 20 ± 1 °C (thread grinding + measurement ± 0.5 °C)</text><text x="20.0" y="50.0" font-size="12" fill="#666">Displacement / low-velocity supply from above, return at ceiling, 6 room sensors, heat mostly removed by the oil chillers</text><rect x="60.0" y="140.0" width="760.0" height="300.0" fill="none" stroke="#1f6fd1" stroke-width="3"/><text x="68.0" y="170.0" font-size="12" font-weight="700">Grinding room 42 × 24 m, clear height 4.5 m, sandwich panels PIR 100 mm (U ≈ 0.22 W/m²K)</text><rect x="130.0" y="360.0" width="90.0" height="70.0" fill="#eee" stroke="#111" stroke-width="1"/><text x="175.0" y="400.0" font-size="11" text-anchor="middle">thread grinder</text><path d="M155,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M175,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M195,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><rect x="270.0" y="360.0" width="90.0" height="70.0" fill="#eee" stroke="#111" stroke-width="1"/><text x="315.0" y="400.0" font-size="11" text-anchor="middle">thread grinder</text><path d="M295,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M315,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M335,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><rect x="410.0" y="360.0" width="90.0" height="70.0" fill="#eee" stroke="#111" stroke-width="1"/><text x="455.0" y="400.0" font-size="11" text-anchor="middle">thread grinder</text><path d="M435,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M455,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M475,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><rect x="550.0" y="360.0" width="90.0" height="70.0" fill="#eee" stroke="#111" stroke-width="1"/><text x="595.0" y="400.0" font-size="11" text-anchor="middle">profile grinder</text><path d="M575,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M595,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M615,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><rect x="690.0" y="360.0" width="90.0" height="70.0" fill="#eee" stroke="#111" stroke-width="1"/><text x="735.0" y="400.0" font-size="11" text-anchor="middle">cyl. grinder</text><path d="M715,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M735,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><path d="M755,355 q6,-12 0,-24 q-6,-12 0,-24" fill="none" stroke="#666" stroke-width="1"/><rect x="80.0" y="180.0" width="720.0" height="22.0" fill="#fff" stroke="#111" stroke-width="1"/><text x="440.0" y="196.0" font-size="11" text-anchor="middle">supply air duct over the ceiling – textile / perforated outlets, low velocity ≤ 0.2 m/s in the occupied zone</text><line x1="140.0" y1="202.0" x2="140.0" y2="255.0" stroke="#1f6fd1" stroke-width="1.5" marker-end="url(#arA)"/><line x1="260.0" y1="202.0" x2="260.0" y2="255.0" stroke="#1f6fd1" stroke-width="1.5" marker-end="url(#arA)"/><line x1="380.0" y1="202.0" x2="380.0" y2="255.0" stroke="#1f6fd1" stroke-width="1.5" marker-end="url(#arA)"/><line x1="500.0" y1="202.0" x2="500.0" y2="255.0" stroke="#1f6fd1" stroke-width="1.5" marker-end="url(#arA)"/><line x1="620.0" y1="202.0" x2="620.0" y2="255.0" stroke="#1f6fd1" stroke-width="1.5" marker-end="url(#arA)"/><line x1="740.0" y1="202.0" x2="740.0" y2="255.0" stroke="#1f6fd1" stroke-width="1.5" marker-end="url(#arA)"/><rect x="200.0" y="142.0" width="60.0" height="10.0" fill="#666" stroke="#111" stroke-width="1"/><text x="230.0" y="136.0" font-size="11" text-anchor="middle">return grille</text><rect x="430.0" y="142.0" width="60.0" height="10.0" fill="#666" stroke="#111" stroke-width="1"/><text x="460.0" y="136.0" font-size="11" text-anchor="middle">return grille</text><rect x="660.0" y="142.0" width="60.0" height="10.0" fill="#666" stroke="#111" stroke-width="1"/><text x="690.0" y="136.0" font-size="11" text-anchor="middle">return grille</text><circle cx="120" cy="290" r="6" fill="#fff" stroke="#1f6fd1" stroke-width="2"/><text x="120.0" y="310.0" font-size="11" text-anchor="middle" fill="#1f6fd1">T1</text><circle cx="250" cy="290" r="6" fill="#fff" stroke="#1f6fd1" stroke-width="2"/><text x="250.0" y="310.0" font-size="11" text-anchor="middle" fill="#1f6fd1">T2</text><circle cx="380" cy="290" r="6" fill="#fff" stroke="#1f6fd1" stroke-width="2"/><text x="380.0" y="310.0" font-size="11" text-anchor="middle" fill="#1f6fd1">T3</text><circle cx="510" cy="290" r="6" fill="#fff" stroke="#1f6fd1" stroke-width="2"/><text x="510.0" y="310.0" font-size="11" text-anchor="middle" fill="#1f6fd1">T4</text><circle cx="640" cy="290" r="6" fill="#fff" stroke="#1f6fd1" stroke-width="2"/><text x="640.0" y="310.0" font-size="11" text-anchor="middle" fill="#1f6fd1">T5</text><circle cx="770" cy="290" r="6" fill="#fff" stroke="#1f6fd1" stroke-width="2"/><text x="770.0" y="310.0" font-size="11" text-anchor="middle" fill="#1f6fd1">T6</text><rect x="870.0" y="150.0" width="290.0" height="120.0" fill="none" stroke="#111" stroke-width="1"/><text x="880.0" y="170.0" font-size="12" font-weight="700">Air-handling unit (plant room)</text><text x="880.0" y="190.0" font-size="11">filter F7 → cooling coil → reheat → fan (EC)</text><text x="880.0" y="208.0" font-size="11">→ supply 16 – 18 °C, ΔT 4 – 6 K to the room</text><text x="880.0" y="226.0" font-size="11">PID: mean of T1 … T6 → valve + fan speed</text><text x="880.0" y="244.0" font-size="11">band ± 1 K, gradient ≤ 1 K/m height</text><line x1="870.0" y1="200.0" x2="820.0" y2="200.0" stroke="#1f6fd1" stroke-width="2"/><line x1="820.0" y1="170.0" x2="810.0" y2="170.0" stroke="#1f6fd1" stroke-width="2"/><rect x="870.0" y="300.0" width="290.0" height="90.0" fill="none" stroke="#111" stroke-width="1"/><text x="880.0" y="320.0" font-size="12" font-weight="700">Chiller (glycol) + free cooling</text><text x="880.0" y="340.0" font-size="11">≈ 150 kW for the AHU</text><text x="880.0" y="358.0" font-size="11">+ central grinding-oil chiller ≈ 220 kW</text><text x="880.0" y="376.0" font-size="11">oil 20 ± 0.5 °C (most grinding heat)</text><line x1="1015.0" y1="270.0" x2="1015.0" y2="300.0" stroke="#111" stroke-width="1.5"/><rect x="700.0" y="434.0" width="110.0" height="40.0" fill="none" stroke="#1f6fd1" stroke-width="2"/><text x="755.0" y="458.0" font-size="11" text-anchor="middle">airlock 2 doors</text><rect x="60.0" y="480.0" width="1100.0" height="160.0" fill="none" stroke="#1f6fd1" stroke-width="1"/><text x="72.0" y="504.0" font-size="12" font-weight="700">Heat load to the room air (example, guide 42 §9.2):</text><text x="72.0" y="527.0" font-size="12">machines 572 kW installed × 0.5 average × 0.3 to air ≈ 86 kW (70 % goes into the oil)</text><text x="72.0" y="550.0" font-size="12">lights 1 008 m² × 8 W/m² ≈ 8 kW · people 10 × 120 W ≈ 1.2 kW</text><text x="72.0" y="573.0" font-size="12">walls + roof + doors ≈ 10 kW · margin 20 % → Q ≈ 126 kW → AHU ≈ 130 – 150 kW</text><text x="72.0" y="596.0" font-size="12" font-weight="700">Air flow V = Q / (ρ · cp · ΔT) = 126 / (1.2 × 1.005 × 5) = 20.9 m³/s ≈ 75 000 m³/h</text><text x="72.0" y="619.0" font-size="12">Air change n = V / room volume = 75 000 / (1 008 × 4.5) ≈ 17 per hour</text><text x="60.0" y="670.0" font-size="12">Rules: no sun, no outside door, parts soak ≥ 4 h inside before thread grinding / measurement, machines run warm-up programs, log T1 … T6 every minute (Modbus TCP → twin).</text><g><rect x="800.0" y="756.0" width="390.0" height="64.0" fill="none" stroke="#111" stroke-width="1.2"/><line x1="800.0" y1="780.0" x2="1190.0" y2="780.0" stroke="#111" stroke-width="1"/><text x="808.0" y="773.0" font-size="13" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your planner</text><text x="808.0" y="796.0" font-size="11">Ball screw + guide factory · item 3 · guide 42</text><text x="808.0" y="812.0" font-size="11" fill="#666">Drawing 42-07 · all values are examples · 2026</text></g></svg>