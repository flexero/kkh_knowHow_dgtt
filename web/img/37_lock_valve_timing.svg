<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Timing – vertical axis lock + counterbalance</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="10" y="10" width="1180" height="810" fill="none" stroke="#000" stroke-width="1.4"/><text x="30" y="40" font-size="18" text-anchor="start" fill="#000" font-weight="bold">7 · Timing diagram – lift up and down with the leak-free lock valve 1V4 (1Y3) and its monitoring switch 1S3</text><text x="30" y="62" font-size="12.5" text-anchor="start" fill="#333">Lock opens first, 4/3 valve moves the lift, lock closes 0.3 s after the stop (TOF) – the seat closes without flow. Simulated values, scan 20 ms.</text><line x1="200.0" y1="100" x2="200.0" y2="572" stroke="#ccc" stroke-width="0.5"/><text x="200.0" y="588" font-size="10" text-anchor="middle" fill="#000">0</text><line x1="425.0" y1="100" x2="425.0" y2="572" stroke="#ccc" stroke-width="0.5"/><text x="425.0" y="588" font-size="10" text-anchor="middle" fill="#000">1</text><line x1="650.0" y1="100" x2="650.0" y2="572" stroke="#ccc" stroke-width="0.5"/><text x="650.0" y="588" font-size="10" text-anchor="middle" fill="#000">2</text><line x1="875.0" y1="100" x2="875.0" y2="572" stroke="#ccc" stroke-width="0.5"/><text x="875.0" y="588" font-size="10" text-anchor="middle" fill="#000">3</text><line x1="1100.0" y1="100" x2="1100.0" y2="572" stroke="#ccc" stroke-width="0.5"/><text x="1100.0" y="588" font-size="10" text-anchor="middle" fill="#000">4</text><text x="1108" y="588" font-size="10" text-anchor="start" fill="#000">t [s]</text><text x="190" y="136" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">S_UP</text><polyline points="200,142 245.0,142 245.0,118.9 290.0,118.9 290.0,142 1100,142" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="178" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">M_UPREQ</text><polyline points="200,184 245.0,184 245.0,160.9 438.5,160.9 438.5,184 1100,184" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="220" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">Y3_LOCK</text><polyline points="200,226 245.0,226 245.0,202.9 506.0,202.9 506.0,226 650.0,226 650.0,202.9 929.0,202.9 929.0,226 1100,226" fill="none" stroke="#1c7c3a" stroke-width="2" stroke-linejoin="round"/><text x="190" y="262" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">S3_OPEN</text><polyline points="200,268 254.0,268 254.0,244.9 515.0,244.9 515.0,268 659.0,268 659.0,244.9 938.0,244.9 938.0,268 1100,268" fill="none" stroke="#777" stroke-width="2" stroke-linejoin="round"/><text x="190" y="304" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">Y1_UP</text><polyline points="200,310 258.5,310 258.5,286.9 438.5,286.9 438.5,310 1100,310" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="346" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">B2_UP (top)</text><polyline points="200,352 438.5,352 438.5,328.9 710.75,328.9 710.75,352 1100,352" fill="none" stroke="#777" stroke-width="2" stroke-linejoin="round"/><text x="190" y="388" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">S_DOWN</text><polyline points="200,394 650.0,394 650.0,370.9 695.0,370.9 695.0,394 1100,394" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="430" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">M_DNREQ</text><polyline points="200,436 650.0,436 650.0,412.9 861.5,412.9 861.5,436 1100,436" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="472" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">M_DNOK (+0.2 s)</text><polyline points="200,478 704.0,478 704.0,454.9 861.5,454.9 861.5,478 1100,478" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="514" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">Y2_DN</text><polyline points="200,520 708.5,520 708.5,496.9 861.5,496.9 861.5,520 1100,520" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="556" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">B1_DOWN</text><polyline points="200,562 260.75,562 260.75,562 888.5,562 888.5,538.9 1100,538.9" fill="none" stroke="#777" stroke-width="2" stroke-linejoin="round"/><line x1="245.0" y1="96" x2="245.0" y2="572" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="4 3"/><text x="248.0" y="92" font-size="10" text-anchor="start" fill="#0b5ea8">push UP</text><line x1="438.5" y1="83" x2="438.5" y2="572" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="4 3"/><text x="441.5" y="79" font-size="10" text-anchor="start" fill="#0b5ea8">top 60 mm</text><line x1="650.0" y1="96" x2="650.0" y2="572" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="4 3"/><text x="653.0" y="92" font-size="10" text-anchor="start" fill="#0b5ea8">push DOWN</text><line x1="861.5" y1="83" x2="861.5" y2="572" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="4 3"/><text x="864.5" y="79" font-size="10" text-anchor="start" fill="#0b5ea8">bottom</text><text x="30" y="612" font-size="11.5" text-anchor="start" fill="#000">Up: 1Y3 at 0.20 s, 1S3 confirms after 40 ms, 1Y1 at 0.26 s, 60 mm at 75 mm/s = 0.8 s → top at 1.06 s, 1Y3 off at 1.36 s (TOF 0.3 s).</text><text x="30" y="630" font-size="11.5" text-anchor="start" fill="#000">Down: 1Y3 at 2.00 s, feedback 2.04 s, + 0.2 s (T_LOPEN) → 1Y2 at 2.26 s, bottom at ≈ 3.06 s. The counterbalance 1V3 (≈ 9.6 MPa = 1.3 × 7.39 MPa)</text><text x="30" y="648" font-size="11.5" text-anchor="start" fill="#000">and the pilot check 1V2 open only with pilot pressure from line B → the lift is driven down, never free fall. 1Y1 and 1Y2 are never ON together.</text><text x="30" y="666" font-size="11.5" text-anchor="start" fill="#000">4/3 valve with FLOAT centre (A, B → T): the pilot lines are vented, the checks close at once when the coil drops (guide 30 §4.4).</text><rect x="770" y="760" width="420" height="60" fill="#fff" stroke="#000" stroke-width="1"/><line x1="770" y1="782" x2="1190" y2="782" stroke="#000" stroke-width="0.8"/><text x="778" y="776" font-size="12" font-weight="bold">Timing – vertical axis lock + counterbalance</text><text x="778" y="798" font-size="10.5">program 3, networks 2–8</text><text x="778" y="813" font-size="10.5" fill="#0b5ea8">Guide 37 · page 7 · EXAMPLE – check with your PLC configuration</text></svg>
