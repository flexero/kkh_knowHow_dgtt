<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#111"/></marker><marker id="arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#1f6fd1"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs><rect width="1200" height="830" fill="#fff"/><text x="20.0" y="30.0" font-size="20" font-weight="700">Isolated foundation for a thread grinder (section)</text><text x="20.0" y="50.0" font-size="12" fill="#666">Concrete block in a pit on spring-damper elements or an elastomer mat, separated from the hall slab by a joint</text><rect x="40.0" y="420.0" width="760.0" height="230.0" fill="url(#hat)" stroke="#666" stroke-width="1"/><text x="50.0" y="640.0" font-size="11">soil (report: bearing capacity, ground water)</text><rect x="40.0" y="390.0" width="760.0" height="30.0" fill="#ddd" stroke="#111" stroke-width="1"/><text x="50.0" y="410.0" font-size="11">hall floor slab 250 mm</text><rect x="200.0" y="390.0" width="480.0" height="200.0" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="440.0" y="608.0" font-size="11" text-anchor="middle">pit with lean concrete 100 mm</text><rect x="230.0" y="410.0" width="420.0" height="130.0" fill="#cfcfcf" stroke="#111" stroke-width="1.5"/><text x="440.0" y="480.0" font-size="12" text-anchor="middle" font-weight="700">isolated concrete block 6.5 × 3.6 × 0.9 m ≈ 50 t</text><rect x="255.0" y="545.0" width="50.0" height="20.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1" fill-opacity="0.6"/><rect x="345.0" y="545.0" width="50.0" height="20.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1" fill-opacity="0.6"/><rect x="435.0" y="545.0" width="50.0" height="20.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1" fill-opacity="0.6"/><rect x="525.0" y="545.0" width="50.0" height="20.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1" fill-opacity="0.6"/><rect x="615.0" y="545.0" width="50.0" height="20.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1" fill-opacity="0.6"/><text x="440.0" y="582.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f6fd1">spring-damper elements (f0 ≈ 4 Hz) or PUR mat (f0 ≈ 8 – 12 Hz)</text><line x1="220.0" y1="390.0" x2="220.0" y2="590.0" stroke="#1f6fd1" stroke-width="2" stroke-dasharray="5 3"/><line x1="660.0" y1="390.0" x2="660.0" y2="590.0" stroke="#1f6fd1" stroke-width="2" stroke-dasharray="5 3"/><text x="670.0" y="380.0" font-size="11" fill="#1f6fd1">joint 30 – 50 mm, sealed</text><rect x="270.0" y="270.0" width="340.0" height="140.0" fill="#eee" stroke="#111" stroke-width="1"/><text x="440.0" y="340.0" font-size="12" text-anchor="middle" font-weight="700">thread grinder ≈ 12 t</text><text x="440.0" y="358.0" font-size="11" text-anchor="middle">on 6 levelling elements</text><rect x="285.0" y="408.0" width="20.0" height="6.0" fill="#111" stroke="#111" stroke-width="1"/><rect x="343.0" y="408.0" width="20.0" height="6.0" fill="#111" stroke="#111" stroke-width="1"/><rect x="401.0" y="408.0" width="20.0" height="6.0" fill="#111" stroke="#111" stroke-width="1"/><rect x="459.0" y="408.0" width="20.0" height="6.0" fill="#111" stroke="#111" stroke-width="1"/><rect x="517.0" y="408.0" width="20.0" height="6.0" fill="#111" stroke="#111" stroke-width="1"/><rect x="575.0" y="408.0" width="20.0" height="6.0" fill="#111" stroke="#111" stroke-width="1"/><rect x="840.0" y="80.0" width="330.0" height="560.0" fill="none" stroke="#1f6fd1" stroke-width="1"/><text x="852.0" y="104.0" font-size="12" font-weight="700" fill="#1f6fd1">Design notes (example)</text><text x="852.0" y="128.0" font-size="11">Why: presses, saws, HMCs, forklifts + AGVs</text><text x="852.0" y="144.0" font-size="11">make floor vibration; thread grinding needs &lt;</text><text x="852.0" y="160.0" font-size="11">1 µm relative motion.</text><text x="852.0" y="186.0" font-size="11">Mass ratio block / machine ≥ 2 – 4 (here 50 t</text><text x="852.0" y="202.0" font-size="11">/ 12 t ≈ 4) → lower vibration amplitude,</text><text x="852.0" y="218.0" font-size="11">stable levelling.</text><text x="852.0" y="244.0" font-size="11">Natural frequency f0 = (1 / 2π) · √(k / m).</text><text x="852.0" y="260.0" font-size="11">Isolation from f / f0 &gt; √2. Transmissibility</text><text x="852.0" y="276.0" font-size="11">T = 1 / |(f / f0)² − 1| (no damping).</text><text x="852.0" y="302.0" font-size="11">Example: press 25 Hz, f0 = 4 Hz → T = 1 /</text><text x="852.0" y="318.0" font-size="11">(39.1 − 1) = 0.026 → 97 % isolated. Mat f0 =</text><text x="852.0" y="334.0" font-size="11">10 Hz → T = 1 / (6.25 − 1) = 0.19 → 81 %.</text><text x="852.0" y="360.0" font-size="11">Criteria: vibration velocity at the machine</text><text x="852.0" y="376.0" font-size="11">foot ≤ VC-B 25 µm/s rms (1/3 octave, 4 – 80</text><text x="852.0" y="392.0" font-size="11">Hz) – generic VC curves (check), or the</text><text x="852.0" y="408.0" font-size="11">maker's limit.</text><text x="852.0" y="434.0" font-size="11">Measure the site BEFORE you build</text><text x="852.0" y="450.0" font-size="11">(accelerometers, 24 h), keep presses ≥ 15 –</text><text x="852.0" y="466.0" font-size="11">20 m away, no AGV lane over the block.</text><g><rect x="800.0" y="756.0" width="390.0" height="64.0" fill="none" stroke="#111" stroke-width="1.2"/><line x1="800.0" y1="780.0" x2="1190.0" y2="780.0" stroke="#111" stroke-width="1"/><text x="808.0" y="773.0" font-size="13" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your planner</text><text x="808.0" y="796.0" font-size="11">Ball screw + guide factory · item 3 · guide 42</text><text x="808.0" y="812.0" font-size="11" fill="#666">Drawing 42-08 · all values are examples · 2026</text></g></svg>