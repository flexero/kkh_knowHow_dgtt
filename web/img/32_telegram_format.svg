<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
<rect width="1200" height="830" fill="#fff"/>
<text x="40.0" y="44.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">WCS → crane PLC job telegram – fixed length 66 bytes ASCII (example) + answer + OPC UA alternative</text><rect x="40.0" y="90.0" width="49.4" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="64.7" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">STX</text><text x="64.7" y="132.0" font-size="11" text-anchor="middle" fill="#000">&lt;</text><text x="42.0" y="166.0" font-size="11" text-anchor="start" fill="#000">0</text><rect x="89.4" y="90.0" width="60.2" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="119.5" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Sender</text><text x="119.5" y="132.0" font-size="11" text-anchor="middle" fill="#000">WCS1</text><text x="91.4" y="166.0" font-size="11" text-anchor="start" fill="#000">1</text><rect x="149.6" y="90.0" width="60.2" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="179.7" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Receiver</text><text x="179.7" y="132.0" font-size="11" text-anchor="middle" fill="#000">PLC1</text><text x="151.6" y="166.0" font-size="11" text-anchor="start" fill="#000">5</text><rect x="209.8" y="90.0" width="60.2" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="239.9" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">SeqNo</text><text x="239.9" y="132.0" font-size="11" text-anchor="middle" fill="#000">0012</text><text x="211.8" y="166.0" font-size="11" text-anchor="start" fill="#000">9</text><rect x="270.0" y="90.0" width="49.4" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="294.7" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Type</text><text x="294.7" y="132.0" font-size="11" text-anchor="middle" fill="#000">ST</text><text x="272.0" y="166.0" font-size="11" text-anchor="start" fill="#000">13</text><rect x="319.5" y="90.0" width="120.4" height="60.0" rx="0" fill="#eef4fb" stroke="#1565c0" stroke-width="1.2"/><text x="379.7" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">JobId</text><text x="379.7" y="132.0" font-size="11" text-anchor="middle" fill="#000">J00012</text><text x="321.5" y="166.0" font-size="11" text-anchor="start" fill="#000">15</text><rect x="439.8" y="90.0" width="150.5" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="515.1" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">LU-ID</text><text x="515.1" y="132.0" font-size="11" text-anchor="middle" fill="#000">CR00000012</text><text x="441.8" y="166.0" font-size="11" text-anchor="start" fill="#000">23</text><rect x="590.3" y="90.0" width="180.6" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="680.6" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Source</text><text x="680.6" y="132.0" font-size="11" text-anchor="middle" fill="#000">IO-IN</text><text x="592.3" y="166.0" font-size="11" text-anchor="start" fill="#000">33</text><rect x="770.9" y="90.0" width="180.6" height="60.0" rx="0" fill="#eef4fb" stroke="#1565c0" stroke-width="1.2"/><text x="861.2" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Target</text><text x="861.2" y="132.0" font-size="11" text-anchor="middle" fill="#000">A01L-L5-S05</text><text x="772.9" y="166.0" font-size="11" text-anchor="start" fill="#000">45</text><rect x="951.5" y="90.0" width="60.2" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="981.6" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Weight</text><text x="981.6" y="132.0" font-size="11" text-anchor="middle" fill="#000">0217</text><text x="953.5" y="166.0" font-size="11" text-anchor="start" fill="#000">57</text><rect x="1011.7" y="90.0" width="49.4" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1036.4" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Status</text><text x="1036.4" y="132.0" font-size="11" text-anchor="middle" fill="#000">00</text><text x="1013.7" y="166.0" font-size="11" text-anchor="start" fill="#000">61</text><rect x="1061.1" y="90.0" width="49.4" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1085.8" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">Check</text><text x="1085.8" y="132.0" font-size="11" text-anchor="middle" fill="#000">7C</text><text x="1063.1" y="166.0" font-size="11" text-anchor="start" fill="#000">63</text><rect x="1110.6" y="90.0" width="49.4" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="1135.3" y="112.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">ETX</text><text x="1135.3" y="132.0" font-size="11" text-anchor="middle" fill="#000">&gt;</text><text x="1112.6" y="166.0" font-size="11" text-anchor="start" fill="#000">65</text><text x="1160.0" y="186.0" font-size="11" text-anchor="end" fill="#000">total 66 bytes (offsets = first byte of the field)</text><text x="40.0" y="210.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">STX / ETX</text><text x="200.0" y="210.0" font-size="12" text-anchor="start" fill="#000">frame start / end characters</text><text x="40.0" y="230.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Sender / Receiver</text><text x="200.0" y="230.0" font-size="12" text-anchor="start" fill="#000">node names, checked by both sides</text><text x="40.0" y="250.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">SeqNo</text><text x="200.0" y="250.0" font-size="12" text-anchor="start" fill="#000">0000 – 9999, +1 per telegram; repeated number = repeat, not a new job</text><text x="40.0" y="270.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Type</text><text x="200.0" y="270.0" font-size="12" text-anchor="start" fill="#000">ST store · RT retrieve · RL relocate · ST answer = same type + Status</text><text x="40.0" y="290.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">JobId / LU-ID</text><text x="200.0" y="290.0" font-size="12" text-anchor="start" fill="#000">WCS job number / load unit (crate) ID from the label</text><text x="40.0" y="310.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Source / Target</text><text x="200.0" y="310.0" font-size="12" text-anchor="start" fill="#000">location code per guide 15 (ASRS-RAW-A01L-L5-S05 = aisle 1 side L, level 5, slot 5), IO-IN / IO-OUT</text><text x="40.0" y="330.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Weight</text><text x="200.0" y="330.0" font-size="12" text-anchor="start" fill="#000">kg from the infeed scale (store) or the WMS (retrieve)</text><text x="40.0" y="350.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Status</text><text x="200.0" y="350.0" font-size="12" text-anchor="start" fill="#000">00 OK / done · 11 no-read · 12 slot occupied · 13 slot empty · 14 overweight · 15 contour · 20 crane fault</text><text x="40.0" y="370.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Check</text><text x="200.0" y="370.0" font-size="12" text-anchor="start" fill="#000">XOR of the data bytes (after STX, before Check) as 2 hex characters</text><text x="40.0" y="410.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Sequence (TCP, port e.g. 2000, one connection per direction, life telegram every 1 s)</text><text x="200.0" y="436.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">WCS</text><line x1="200.0" y1="444.0" x2="200.0" y2="700.0" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/><text x="700.0" y="436.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">crane PLC</text><line x1="700.0" y1="444.0" x2="700.0" y2="700.0" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="200.0" y1="470.0" x2="700.0" y2="470.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="450.0" y="464.0" font-size="12" text-anchor="middle" fill="#000">job telegram ST J00012 Target A01L-L5-S05</text><line x1="700.0" y1="506.0" x2="200.0" y2="506.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="450.0" y="500.0" font-size="12" text-anchor="middle" fill="#000">acknowledge (same SeqNo, Status 00 = accepted)</text><text x="450.0" y="542.0" font-size="12" text-anchor="middle" font-style="italic" fill="#000">… crane works: steps 20 – 160 …</text><line x1="700.0" y1="578.0" x2="200.0" y2="578.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="450.0" y="572.0" font-size="12" text-anchor="middle" fill="#000">done telegram J00012 Status 00</text><line x1="200.0" y1="614.0" x2="700.0" y2="614.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="450.0" y="608.0" font-size="12" text-anchor="middle" fill="#000">acknowledge</text><line x1="700.0" y1="650.0" x2="200.0" y2="650.0" stroke="#1565c0" stroke-width="1.4" marker-end="url(#ar)"/><text x="450.0" y="644.0" font-size="12" text-anchor="middle" fill="#000">error case: done telegram Status 12 (slot occupied)</text><line x1="200.0" y1="686.0" x2="700.0" y2="686.0" stroke="#1565c0" stroke-width="1.4" marker-end="url(#ar)"/><text x="450.0" y="680.0" font-size="12" text-anchor="middle" fill="#000">new target telegram (RL) from the WCS</text><text x="800.0" y="410.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">OPC UA alternative (method call)</text><text x="800.0" y="432.0" font-size="12" text-anchor="start" fill="#000">Server in the PLC (S7-1500: OPC UA server)</text><text x="800.0" y="451.0" font-size="12" text-anchor="start" fill="#000">Method LOG_L0_ASRSRAW_Store(LU-ID, Target)</text><text x="800.0" y="470.0" font-size="12" text-anchor="start" fill="#000">  → returns JobId, StatusCode</text><text x="800.0" y="489.0" font-size="12" text-anchor="start" fill="#000">Variables: Job.Active, Job.Step,</text><text x="800.0" y="508.0" font-size="12" text-anchor="start" fill="#000">  Crane.Pos.X, Crane.Pos.Z, Crane.Mode,</text><text x="800.0" y="527.0" font-size="12" text-anchor="start" fill="#000">  MachineryItemState, OperationMode</text><text x="800.0" y="546.0" font-size="12" text-anchor="start" fill="#000">  (style of OPC 40001-1 Machinery – check</text><text x="800.0" y="565.0" font-size="12" text-anchor="start" fill="#000">  the current companion specifications)</text><text x="800.0" y="584.0" font-size="12" text-anchor="start" fill="#000">Security: Sign &amp; Encrypt, user per client,</text><text x="800.0" y="603.0" font-size="12" text-anchor="start" fill="#000">  firewall VLAN 30 → 54 port 4840 only</text>
<rect x="10.0" y="10.0" width="1180.0" height="810.0" rx="0" fill="none" stroke="#000" stroke-width="1.5"/><rect x="760.0" y="738.0" width="430.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="760.0" y1="766.0" x2="1190.0" y2="766.0" stroke="#000" stroke-width="1"/><line x1="760.0" y1="792.0" x2="1190.0" y2="792.0" stroke="#000" stroke-width="1"/><line x1="1040.0" y1="792.0" x2="1040.0" y2="820.0" stroke="#000" stroke-width="1"/><text x="770.0" y="758.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the AS/RS supplier's documentation</text><text x="770.0" y="785.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">WCS telegram format and sequence</text><text x="770.0" y="812.0" font-size="11" text-anchor="start" fill="#000">32_telegram_format.svg · guide 32 §3</text><text x="1050.0" y="812.0" font-size="11" text-anchor="start" fill="#000">n.t.s. · 2026-11-12</text>
</svg>