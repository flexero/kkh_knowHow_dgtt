<text x="44.0" y="560.0" font-size="12" text-anchor="start" fill="#000">How it works</text>
<text x="44.0" y="579.0" font-size="12" text-anchor="start" fill="#000">• Free flow valve side → cylinder: oil lifts the main poppet (cracking ≈ 0.1–0.3 MPa class).</text>
<text x="44.0" y="598.0" font-size="12" text-anchor="start" fill="#000">• Reverse: load pressure pushes the poppet onto the seat → leak-free (drops per hour, not cm³/min).</text>
<text x="44.0" y="617.0" font-size="12" text-anchor="start" fill="#000">• X pressurised → pilot piston first opens the small ball: trapped oil decompresses slowly</text>
<text x="44.0" y="636.0" font-size="12" text-anchor="start" fill="#000">  (no bang), then the rod lifts the main poppet: pilot ratio φ = A_X / A_seat (e.g. 4:1).</text>
<text x="44.0" y="655.0" font-size="12" text-anchor="start" fill="#000">• Opening (external drain): p_X ≥ (p_load − p_back) / φ</text>
<text x="44.0" y="674.0" font-size="12" text-anchor="start" fill="#000">  internal drain: p_X ≥ (p_load − p_back) / φ + p_back  → use external drain with back-pressure.</text>
<text x="44.0" y="693.0" font-size="12" text-anchor="start" fill="#000">Guide-25 job: (6.4 − 0.5) / 4 = 1.48 MPa (external) · 1.98 MPa (internal drain).</text>
<text x="44.0" y="730.0" font-size="12" text-anchor="start" fill="#555">Examples: Rexroth SV / SL (subplate, line), Z2S (sandwich); HAWE RH; Sun CKCB… pilot-to-open cartridges (check).</text>
<text x="744.0" y="100.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">2  Double pilot-operated check on a cylinder (hydraulic lock)</text>
