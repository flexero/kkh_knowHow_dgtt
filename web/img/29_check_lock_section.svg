<text x="744.0" y="640.0" font-size="12" text-anchor="start" fill="#000">• Centre A + B → T: both pilot lines vent, both checks close at once.</text>
<text x="744.0" y="659.0" font-size="12" text-anchor="start" fill="#000">  A closed centre would trap pilot pressure → the load creeps or drops.</text>
<text x="744.0" y="678.0" font-size="12" text-anchor="start" fill="#000">• Mount the block ON the cylinder (hose burst does not drop the load).</text>
<text x="744.0" y="697.0" font-size="12" text-anchor="start" fill="#000">• Drift with spool valve only: 30 cm³/min / 31.2 cm² = 9.6 mm/min;</text>
<text x="744.0" y="716.0" font-size="12" text-anchor="start" fill="#000">  with the POC: ≈ 0 (seat valve).</text>
<text x="744.0" y="735.0" font-size="12" text-anchor="start" fill="#000">• Running-away load (lowering): use a counterbalance valve instead.</text>
<text x="30.0" y="800.0" font-size="12" text-anchor="start" fill="#555">Data: guide 29 §10.2, 10.3, 10.7 and §7.1 (drift table). Pilot ratios and cracking pressures: see the datasheet of the chosen series.</text>
