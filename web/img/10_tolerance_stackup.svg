<text x="960.0" y="798.0" font-size="12" text-anchor="start" fill="#000">Cpk = 3 / (3·0.28) = 3.5 → no stud lands outside the lead-in.</text>
<text x="960.0" y="816.0" font-size="12" text-anchor="start" fill="#c62828">Without the pad compensation (mean 1.25 mm):</text>
<text x="960.0" y="834.0" font-size="12" text-anchor="start" fill="#c62828">WC = 2.77 mm – only 0.23 mm margin to the catch.</text>
<text x="40.0" y="840.0" font-size="12" text-anchor="start" fill="#000">Rules: worst case for catch ranges, collisions and safety; RSS only when contributors are independent and centred;</text>
<text x="40.0" y="860.0" font-size="12" text-anchor="start" fill="#000">the biggest contributor (here the PU pad, 79 % of Σe²) is where tightening pays – a hard stop face would make WC ≈ 0.8 mm.</text>
