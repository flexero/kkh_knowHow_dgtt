<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#666666">Springs clamp (fail-safe), oil opens. Taper = X/Y location (capture ±1 mm), face contact = Z reference. Repeatability ≤ 0.005 mm (catalogue class).</text>
