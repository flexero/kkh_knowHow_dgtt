<text x="1187.6" y="314.6" font-size="12" text-anchor="start" fill="#000">free to leave</text>
<line x1="1038.2" y1="392.6" x2="1183.6" y2="361.0" stroke="#000" stroke-width="0.8"/>
<circle cx="1038.2" cy="392.6" r="2.0" stroke="#000" stroke-width="1" fill="#000"/>
<text x="1187.6" y="365.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">oil 5 MPa lifts</text>
<text x="1187.6" y="379.0" font-size="12" text-anchor="start" fill="#000">the piston</text>
<line x1="1121.0" y1="342.0" x2="1183.6" y2="420.8" stroke="#000" stroke-width="0.8"/>
<circle cx="1121.0" cy="342.0" r="2.0" stroke="#000" stroke-width="1" fill="#000"/>
<text x="1187.6" y="424.8" font-size="12" text-anchor="start" fill="#000" font-weight="bold">piston drawn +10 mm</text>
<text x="1187.6" y="438.8" font-size="12" text-anchor="start" fill="#000">(real 2–3 mm)</text>
<rect x="859.0" y="162.0" width="202.0" height="15.0" fill="#fff"/>
<text x="960.0" y="173.0" font-size="12" text-anchor="middle" fill="#000">pallet (bottom face = Z datum)</text>
<rect x="30.0" y="520.0" width="820.0" height="270.0" rx="0" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="42.0" y="542.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Key formulas (example module – use the catalogue values)</text>
<text x="42.0" y="564.0" font-size="12" text-anchor="start" fill="#000">Clamping force on the pallet   FN = n · F_pull + m·g = 4 · 20 kN + 510·9.81 N = 85.0 kN   (page check: slip 78 %, tilt 18 %)</text>
<text x="42.0" y="588.0" font-size="12" text-anchor="start" fill="#000">Release:  p_rel · A_piston ≥ 1.1 · F_spring(compressed) + seal friction     (example A = π/4·(90² − 36²) = 5 341 mm² → 26.7 kN at 5 MPa)</text>
<text x="42.0" y="612.0" font-size="12" text-anchor="start" fill="#000">Release oil per module   V = A · stroke ≈ 5 341 mm² · 2.2 mm ≈ 11.8 cm³   → 4 modules 47 cm³ in 0.8 s = 3.5 L/min (guide 25 §14)</text>
<text x="42.0" y="636.0" font-size="12" text-anchor="start" fill="#000">Holding force (maker value, e.g. 2–4 × pull-in) = the pull the locked balls carry before the stud lifts – use it for the tilt check</text>
<text x="42.0" y="660.0" font-size="12" text-anchor="start" fill="#000">Lift-off check: cutting moment 1 200 N·m over pitch 0.4 m → 1 500 N per pair (750 N per module) ≪ 20 kN pull-in → no gap</text>
<text x="42.0" y="684.0" font-size="12" text-anchor="start" fill="#000">Seating air (slit flow) Q = w·h³·Δp/(12·η·L): h 5 µm → 0.11 L/min, 20 µm → 6.9 L/min, 50 µm → 108 L/min</text>
<text x="42.0" y="708.0" font-size="12" text-anchor="start" fill="#000">Release pressure ≤ maker's max. and ≤ 0.9 · p_system; feed through a reducing valve (2V2, 5 MPa) – the HPU runs at 10–11.5 MPa</text>
<text x="42.0" y="732.0" font-size="12" text-anchor="start" fill="#000">Cleanliness: oil ISO 4406 17/15/12 (modules + rotary union), air ISO 8573-1 per catalogue (≤ 5 µm, dry, oil-free)</text>
<text x="42.0" y="756.0" font-size="12" text-anchor="start" fill="#000">Drawn piston stroke 10 mm for clarity – real modules move ≈ 2–3 mm (see datasheet).</text>
<rect x="880.0" y="520.0" width="508.0" height="360.0" rx="0" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="892.0" y="542.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Words on the datasheet (do not mix them up)</text>
<text x="892.0" y="566.0" font-size="12" text-anchor="start" fill="#000">Pull-in force – force that pulls the stud down onto the face</text>
<text x="892.0" y="587.0" font-size="12" text-anchor="start" fill="#000">  (the clamping force FN for the slip check). Example 20 kN.</text>
<text x="892.0" y="608.0" font-size="12" text-anchor="start" fill="#000">Holding force – external pull the locked module carries</text>
<text x="892.0" y="629.0" font-size="12" text-anchor="start" fill="#000">  before the stud lifts (maker value, higher than pull-in).</text>
<text x="892.0" y="650.0" font-size="12" text-anchor="start" fill="#000">Turbo / boost – extra pneumatic pull-in (pneumatic modules).</text>
<text x="892.0" y="671.0" font-size="12" text-anchor="start" fill="#000">Release pressure – min. pressure that fully opens the module</text>
<text x="892.0" y="692.0" font-size="12" text-anchor="start" fill="#000">  (example 5 MPa); also respect the max. pressure.</text>
<text x="892.0" y="713.0" font-size="12" text-anchor="start" fill="#000">Repeatability – scatter of the pallet position after many</text>
<text x="892.0" y="734.0" font-size="12" text-anchor="start" fill="#000">  clamp cycles, same pallet (≤ 0.005 mm class).</text>
<text x="892.0" y="755.0" font-size="12" text-anchor="start" fill="#000">Interchangeability – different pallets: add the stud-hole</text>
<text x="892.0" y="776.0" font-size="12" text-anchor="start" fill="#000">  position error of each pallet (±0.005 mm jig-bored).</text>
<text x="892.0" y="797.0" font-size="12" text-anchor="start" fill="#000">Capture range – stud offset the taper still pulls in (±1 mm).</text>
<text x="892.0" y="818.0" font-size="12" text-anchor="start" fill="#000">Stud types – 1 fit stud (X+Y), 1 slot stud (rotation),</text>
