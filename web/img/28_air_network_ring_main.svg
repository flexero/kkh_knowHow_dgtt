<text x="300.0" y="314.0" font-size="11" text-anchor="start" fill="#555">condensate is oily: treat it, never into the sewer; use level-controlled drains</text>
<text x="1060.0" y="92.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Design values (from docs/28, example)</text>
<text x="1060.0" y="114.0" font-size="11" text-anchor="start" fill="#000">Σ average 910 NL/min, Σ peak 2 200 NL/min</text>
<text x="1060.0" y="131.0" font-size="11" text-anchor="start" fill="#000">design q = 910 × 1.10 × 1.20 = 1 201 NL/min</text>
<text x="1060.0" y="148.0" font-size="11" text-anchor="start" fill="#000">  = 20.02 l/s = 72.1 Nm³/h</text>
<text x="1060.0" y="165.0" font-size="11" text-anchor="start" fill="#000">set pressure 7 bar g, need 0.5–0.6 MPa at machine</text>
<text x="1060.0" y="182.0" font-size="11" text-anchor="start" fill="#000">ring main ID 32 mm, L = 100 m + 30 % = 130 m</text>
<text x="1060.0" y="199.0" font-size="11" text-anchor="start" fill="#000">Δp = 450·q^1.85·L/(d^5·p) = 0.0556 bar ✓</text>
<text x="1060.0" y="216.0" font-size="11" text-anchor="start" fill="#000">(25 mm: 0.191 bar ✗), v = 3.15 m/s</text>
<text x="1060.0" y="233.0" font-size="11" text-anchor="start" fill="#000">quality ISO 8573-1 class 1.4.1:</text>
<text x="1060.0" y="250.0" font-size="11" text-anchor="start" fill="#000">  particles 1, PDP ≤ +3 °C, oil ≤ 0.01 mg/m³</text>
<text x="1060.0" y="267.0" font-size="11" text-anchor="start" fill="#000">condensate ≈ 0.94 L/h at 25 °C / 60 % RH</text>
