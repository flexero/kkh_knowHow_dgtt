<rect x="700.0" y="330.0" width="160.0" height="56.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="780.0" y="354.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">TCP header</text>
<text x="780.0" y="374.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">20 bytes</text>
<rect x="860.0" y="330.0" width="150.0" height="56.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1.5"/>
