<text x="715.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">00 34</text>
<text x="715.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">length 52</text>
<rect x="750.0" y="494.0" width="60.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="780.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">1C 46</text>
<text x="780.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">ident.</text>
<rect x="810.0" y="494.0" width="64.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="842.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">40 00</text>
<text x="842.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">flags DF</text>
<rect x="874.0" y="494.0" width="54.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="901.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">40</text>
<text x="901.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">TTL 64</text>
<rect x="928.0" y="494.0" width="48.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="952.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">06</text>
<text x="952.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">TCP</text>
<rect x="976.0" y="494.0" width="70.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1011.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">09 16</text>
<text x="1011.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">checksum</text>
<rect x="1046.0" y="494.0" width="120.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1106.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">0A 28 00 64</text>
<text x="1106.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">src 10.40.0.100</text>
<rect x="1166.0" y="494.0" width="120.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1226.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">0A 33 00 AA</text>
<text x="1226.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">dst 10.51.0.170</text>
<text x="580.0" y="562.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">checksum: 4500+0034+1C46+4000+4006+0000+0A28+0064+0A33+00AA = F6E9 → NOT = 0916</text>
<text x="580.0" y="580.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">TCP header 20 B: src port 50123, dst port 502, seq, ack, flags PSH+ACK, window</text>
<text x="580.0" y="598.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Modbus 00 01 00 00 00 06 01 03 00 00 00 0A = trans. 1, length 6, unit 1, FC 03, addr 0, qty 10</text>
<text x="40.0" y="700.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">Efficiency η = p / (p + 82)</text>
<rect x="40.0" y="714.0" width="200.0" height="26.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1"/>
<text x="48.0" y="732.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">p (application bytes)</text>
<rect x="240.0" y="714.0" width="120.0" height="26.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1"/>
<text x="248.0" y="732.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">on the wire</text>
<rect x="360.0" y="714.0" width="90.0" height="26.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1"/>
<text x="368.0" y="732.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">η</text>
<rect x="40.0" y="740.0" width="200.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="48.0" y="758.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">12 (Modbus request)</text>
<rect x="240.0" y="740.0" width="120.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="248.0" y="758.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">94 B</text>
<rect x="360.0" y="740.0" width="90.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="368.0" y="758.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">12.8 %</text>
<rect x="40.0" y="766.0" width="200.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="48.0" y="784.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">100</text>
<rect x="240.0" y="766.0" width="120.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="248.0" y="784.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">182 B</text>
<rect x="360.0" y="766.0" width="90.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="368.0" y="784.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">54.9 %</text>
<rect x="40.0" y="792.0" width="200.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="48.0" y="810.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">500</text>
<rect x="240.0" y="792.0" width="120.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="248.0" y="810.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">582 B</text>
<rect x="360.0" y="792.0" width="90.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="368.0" y="810.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">85.9 %</text>
<rect x="40.0" y="818.0" width="200.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="48.0" y="836.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 460 (full segment)</text>
<rect x="240.0" y="818.0" width="120.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="248.0" y="836.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 542 B</text>
<rect x="360.0" y="818.0" width="90.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="368.0" y="836.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">94.7 %</text>
<text x="40.0" y="860.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">82 B = Ethernet 14 + VLAN 4 + FCS 4 + IP 20 + TCP 20 + preamble/gap 20</text>
<text x="40.0" y="878.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Max TCP goodput (MSS 1 448 in 1 538 B): 94.1 Mbit/s on 100 Mbit/s, 941 Mbit/s on 1 Gbit/s</text>
<text x="560.0" y="700.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">PROFINET RT frame (no IP, not routable) – smallest size</text>
<rect x="560.0" y="714.0" width="80.0" height="48.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="600.0" y="734.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">MACs</text>
<text x="600.0" y="752.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">12 B</text>
<rect x="640.0" y="714.0" width="100.0" height="48.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="690.0" y="734.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">VLAN PCP 6</text>
<text x="690.0" y="752.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">4 B</text>
<rect x="740.0" y="714.0" width="70.0" height="48.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="775.0" y="734.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">0x8892</text>
<text x="775.0" y="752.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">2 B</text>
<rect x="810.0" y="714.0" width="70.0" height="48.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="845.0" y="734.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">FrameID</text>
<text x="845.0" y="752.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">2 B</text>
<rect x="880.0" y="714.0" width="250.0" height="48.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1.2"/>
<text x="1005.0" y="734.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">C_SDU IO data + IOPS/IOCS</text>
<text x="1005.0" y="752.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">40 B</text>
<rect x="1130.0" y="714.0" width="100.0" height="48.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1180.0" y="734.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">APDU status</text>
<text x="1180.0" y="752.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">4 B</text>
<rect x="1230.0" y="714.0" width="50.0" height="48.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1255.0" y="734.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">FCS</text>
<text x="1255.0" y="752.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">4 B</text>
<text x="560.0" y="784.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">frame = 12 + 4 + 2 + 2 + 40 + 4 + 4 = 68 B → 88 B on the wire (84 B without VLAN tag)</text>
<text x="560.0" y="802.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 device, 1 frame per direction every update time: 88 B × 8 / 2 ms = 0.35 Mbit/s per direction</text>
<text x="560.0" y="820.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">EtherTypes: 0x0800 IPv4 · 0x8892 PROFINET · 0x88A4 EtherCAT · 0x88F7 PTP · 0x88CC LLDP · 0x88E3 MRP</text>
