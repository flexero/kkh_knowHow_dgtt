<text x="935.0" y="110.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L7: Modbus 12 B</text>
<rect x="700.0" y="130.0" width="310.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="855.0" y="150.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L4 transport: TCP segment 32 B</text>
<rect x="540.0" y="170.0" width="470.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="775.0" y="190.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L3 network: IP packet 52 B</text>
<rect x="170.0" y="210.0" width="940.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="640.0" y="230.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L2 data link: Ethernet frame 74 B  (64 … 1 518 B, 1 522 with VLAN tag)</text>
<rect x="60.0" y="250.0" width="1200.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="660.0" y="270.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L1 physical: on the wire 94 B = frame + 20 (preamble 8 + gap 12)</text>
<text x="60.0" y="80.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Each layer adds its header (encapsulation). Field widths not to scale.</text>
<text x="20.0" y="426.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000"></text>
<line x1="170.0" y1="400.0" x2="1110.0" y2="400.0" stroke="#000" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="640.0" y="418.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">frame = 14 + 4 + 20 + 20 + 12 + 4 = 74 bytes (≥ 64, no padding)</text>
<text x="640.0" y="438.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">efficiency η = 12 / 94 = 12.8 %   ·   answer (10 registers): 29 B Modbus → 91 B frame → 111 B on the wire</text>
<text x="40.0" y="480.0" font-size="14" text-anchor="start" font-weight="bold" fill="#0b62c4">VLAN tag (IEEE 802.1Q) – 4 bytes</text>
<rect x="40.0" y="494.0" width="180.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="130.0" y="514.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">TPID 0x8100</text>
<text x="130.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">16 bit</text>
<rect x="220.0" y="494.0" width="70.0" height="44.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1.5"/>
<text x="255.0" y="514.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">PCP</text>
<text x="255.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">3 bit</text>
<rect x="290.0" y="494.0" width="50.0" height="44.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1.5"/>
<text x="315.0" y="514.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">DEI</text>
<text x="315.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1 bit</text>
<rect x="340.0" y="494.0" width="200.0" height="44.0" rx="0" fill="#e3eefb" stroke="#000" stroke-width="1.5"/>
<text x="440.0" y="514.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">VID (VLAN id)</text>
<text x="440.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">12 bit</text>
<text x="40.0" y="562.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">PCP = priority 0 … 7 (PROFINET RT = 6)   VID = 1 … 4094 (0 = priority tag only)</text>
<text x="40.0" y="580.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">VLAN 51, PCP 0  → TCI = 0x0033</text>
<text x="40.0" y="598.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">PROFINET RT, PCP 6, VID 0 → TCI = 0xC000</text>
<text x="40.0" y="616.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">PCP 5, VLAN 51 → TCI = (5 × 8192) + 51 = 0xA033</text>
<text x="580.0" y="480.0" font-size="14" text-anchor="start" font-weight="bold" fill="#0b62c4">IPv4 header – 20 bytes (hex)</text>
<rect x="580.0" y="494.0" width="50.0" height="44.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="605.0" y="513.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">45</text>
<text x="605.0" y="531.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">ver/IHL</text>
