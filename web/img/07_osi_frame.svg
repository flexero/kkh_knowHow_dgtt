<text x="20.0" y="32.0" font-size="17" text-anchor="start" font-weight="bold" fill="#000">Ethernet frame byte by byte – Modbus TCP request SCADA 10.40.0.100 → energy meter 10.51.0.170 (VLAN 51)</text>
