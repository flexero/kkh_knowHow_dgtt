<text x="40.0" y="450.0" font-size="11.5" text-anchor="start" fill="#000">Delta: TMR T0 K20 (100 ms base, K = PT / 0.1 s). Siemens: TON in an instance DB, PT := T#2S. Accuracy: Q comes in the first scan with ET ≥ PT → error 0 … +1 scan.</text>
