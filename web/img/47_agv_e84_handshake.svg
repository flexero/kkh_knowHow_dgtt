<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700" fill="#000">AGV transfer port – E84-style handshake (load = AGV puts a carrier on the port)</text><line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/><text x="24" y="114" font-size="13" text-anchor="start" font-weight="700" fill="#000">CS_0</text><text x="24" y="130" font-size="11.5" text-anchor="start" fill="#000">AGV</text><line x1="250" y1="130" x2="1150" y2="130" stroke="#999" stroke-width="0.6"/><path d="M250 130 L250.0 130 L250.0 102 L1090.0 102 L1090.0 130 L1150 130" fill="none" stroke="#000" stroke-width="2"/><text x="24" y="174" font-size="13" text-anchor="start" font-weight="700" fill="#000">VALID</text><text x="24" y="190" font-size="11.5" text-anchor="start" fill="#000">AGV</text><line x1="250" y1="190" x2="1150" y2="190" stroke="#999" stroke-width="0.6"/><path d="M250 190 L280.0 190 L280.0 162 L1090.0 162 L1090.0 190 L1150 190" fill="none" stroke="#000" stroke-width="2"/><text x="24" y="234" font-size="13" text-anchor="start" font-weight="700" fill="#000">L_REQ</text><text x="24" y="250" font-size="11.5" text-anchor="start" fill="#000">station</text><line x1="250" y1="250" x2="1150" y2="250" stroke="#999" stroke-width="0.6"/><path d="M250 250 L280.0 250 L280.0 222 L745.0 222 L745.0 250 L1150 250" fill="none" stroke="#1f6fd1" stroke-width="2"/><text x="24" y="294" font-size="13" text-anchor="start" font-weight="700" fill="#000">TR_REQ</text><text x="24" y="310" font-size="11.5" text-anchor="start" fill="#000">AGV</text><line x1="250" y1="310" x2="1150" y2="310" stroke="#999" stroke-width="0.6"/><path d="M250 310 L295.0 310 L295.0 282 L752.5 282 L752.5 310 L1150 310" fill="none" stroke="#000" stroke-width="2"/><text x="24" y="354" font-size="13" text-anchor="start" font-weight="700" fill="#000">READY</text><text x="24" y="370" font-size="11.5" text-anchor="start" fill="#000">station</text><line x1="250" y1="370" x2="1150" y2="370" stroke="#999" stroke-width="0.6"/><path d="M250 370 L295.0 370 L295.0 342 L752.5 342 L752.5 370 L1150 370" fill="none" stroke="#1f6fd1" stroke-width="2"/><text x="24" y="414" font-size="13" text-anchor="start" font-weight="700" fill="#000">BUSY</text><text x="24" y="430" font-size="11.5" text-anchor="start" fill="#000">AGV</text><line x1="250" y1="430" x2="1150" y2="430" stroke="#999" stroke-width="0.6"/><path d="M250 430 L302.5 430 L302.5 402 L752.5 402 L752.5 430 L1150 430" fill="none" stroke="#000" stroke-width="2"/><text x="24" y="474" font-size="13" text-anchor="start" font-weight="700" fill="#000">carrier on port (B_PORT)</text><text x="24" y="490" font-size="11.5" text-anchor="start" fill="#000">sensor</text><line x1="250" y1="490" x2="1150" y2="490" stroke="#999" stroke-width="0.6"/><path d="M250 490 L745.0 490 L745.0 462 L1150 462" fill="none" stroke="#000" stroke-width="2"/><text x="24" y="534" font-size="13" text-anchor="start" font-weight="700" fill="#000">COMPT</text><text x="24" y="550" font-size="11.5" text-anchor="start" fill="#000">AGV</text><line x1="250" y1="550" x2="1150" y2="550" stroke="#999" stroke-width="0.6"/><path d="M250 550 L752.5 550 L752.5 522 L1090.0 522 L1090.0 550 L1150 550" fill="none" stroke="#000" stroke-width="2"/><line x1="250.0" y1="84" x2="250.0" y2="575" stroke="#666" stroke-width="0.7" stroke-dasharray="3 4"/><line x1="295.0" y1="84" x2="295.0" y2="575" stroke="#666" stroke-width="0.7" stroke-dasharray="3 4"/><line x1="745.0" y1="84" x2="745.0" y2="575" stroke="#666" stroke-width="0.7" stroke-dasharray="3 4"/><line x1="752.5" y1="84" x2="752.5" y2="575" stroke="#666" stroke-width="0.7" stroke-dasharray="3 4"/><line x1="1090.0" y1="84" x2="1090.0" y2="575" stroke="#666" stroke-width="0.7" stroke-dasharray="3 4"/><text x="299.0" y="68" font-size="11.5" text-anchor="start" fill="#000">TR_REQ → READY ≤ 1 scan</text><text x="741.0" y="68" font-size="11.5" text-anchor="end" fill="#000">carrier arrived → L_REQ off</text><text x="756.5" y="82" font-size="11.5" text-anchor="start" fill="#000">COMPT → READY off ≤ 1 scan</text><text x="1086.0" y="82" font-size="11.5" text-anchor="end" fill="#000">AGV leaves</text><text x="250.0" y="590" font-size="11" text-anchor="middle" fill="#000">0 s</text><text x="400.0" y="590" font-size="11" text-anchor="middle" fill="#000">1 s</text><text x="550.0" y="590" font-size="11" text-anchor="middle" fill="#000">2 s</text><text x="700.0" y="590" font-size="11" text-anchor="middle" fill="#000">3 s</text><text x="850.0" y="590" font-size="11" text-anchor="middle" fill="#000">4 s</text><text x="1000.0" y="590" font-size="11" text-anchor="middle" fill="#000">5 s</text><text x="1150.0" y="590" font-size="11" text-anchor="middle" fill="#000">6 s</text><text x="24" y="628" font-size="12.5" text-anchor="start" fill="#000">Station side (accent): L_REQ (port empty, station idle) or U_REQ (finished carrier on the port), READY, HO_AVBL (AUTO, no alarm), ES (1 = no emergency).</text><text x="24" y="650" font-size="12.5" text-anchor="start" fill="#000">Unload is the same with U_REQ: U_REQ goes off when the carrier has LEFT the port (sensor 0). Transfer time-out READY → COMPT 30 s → alarm, ES = 0 (AGV stops).</text><text x="24" y="672" font-size="12.5" text-anchor="start" fill="#000">How the bits travel: AGV ⇄ Wi-Fi ⇄ fleet manager (HTTP API) ⇄ remote I/O module with REST API or an optical PIO at the port ⇄ 24 V DI / DQ ⇄ PLC.</text><text x="24" y="694" font-size="12.5" text-anchor="start" fill="#000">The PLC never talks to the AGV over Modbus or HTTP; the MES orders the transport over HTTP when the station is STARVED (port empty) or BLOCKED (finished carrier).</text><text x="24" y="716" font-size="12.5" text-anchor="start" fill="#1f6fd1">Timing values (TA1 … TA3, TP1 … TP5) of SEMI E84 – check the standard and the AGV maker; here: example values of the simulation.</text><rect x="760" y="772" width="420" height="44" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="770" y="790" font-size="12" font-weight="700" fill="#000">EXAMPLE – check with your PLC configuration</text><text x="770" y="808" font-size="11" fill="#000">Ball screw + guide factory · item 8 · guide 47 · values are examples</text></svg>