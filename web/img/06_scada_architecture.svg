<text x="68.0" y="508.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">SCADA server A (active)</text>
<text x="68.0" y="525.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">vc-sup-scada01 · 10.40.0.100</text>
<text x="68.0" y="541.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">I/O + alarm + display server</text>
<text x="68.0" y="557.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">OPC UA client to 5 PLCs</text>
<text x="68.0" y="573.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">licence ≥ 2 500 tags</text>
<rect x="420.0" y="490.0" width="250.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="428.0" y="508.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">SCADA server B (standby)</text>
<text x="428.0" y="525.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">vc-sup-scada02 · 10.40.0.101</text>
<text x="428.0" y="541.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">same project, hot standby</text>
<text x="428.0" y="557.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">takes over in ≤ 10 s (spec)</text>
<text x="428.0" y="573.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">own UPS feed</text>
