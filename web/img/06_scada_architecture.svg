<text x="318.0" y="358.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Historian server</text>
<text x="318.0" y="375.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">vc-ops-hist01 · RAID 10</text>
<text x="318.0" y="391.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">≈ 4.5 M values/day (ch. 21)</text>
<text x="318.0" y="407.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">store-and-forward from collectors</text>
<rect x="590.0" y="340.0" width="230.0" height="100.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="598.0" y="358.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Engineering station</text>
<text x="598.0" y="375.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">PLC + SCADA projects</text>
<text x="598.0" y="391.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">version control, backup</text>
<text x="598.0" y="407.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">only by named engineers</text>
<rect x="840.0" y="340.0" width="230.0" height="100.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="848.0" y="358.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Domain + NTP + backup</text>
<text x="848.0" y="375.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">OT domain (users, roles)</text>
<text x="848.0" y="391.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">2 NTP sources (GPS/DCF)</text>
<text x="848.0" y="407.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">backup NAS, 3-2-1 rule</text>
