<text x="690.0" y="645.0" font-size="11" text-anchor="start" font-weight="bold" fill="#c0392b">OPC UA :4840 · sampling 500 ms · publishing 1 000 ms · Sign &amp; Encrypt</text>
<text x="40.0" y="860.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">4–20 mA (temperature 0–150 °C, pressure 0–16 bar)  ·  IO-Link vibration  ·  PROFINET drives / CNC  ·  safety (PROFIsafe) – never via SCADA</text>
<text x="40.0" y="884.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Each line PLC keeps its machines running if SCADA, network or historian fail – SCADA is supervisory only.</text>
