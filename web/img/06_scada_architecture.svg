<text x="68.0" y="130.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">orders, material, cost</text>
<text x="68.0" y="146.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">REST / database link to MES</text>
