<text x="68.0" y="228.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Historian replica / web reports</text>
<text x="68.0" y="245.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">read-only copy for office users</text>
<text x="68.0" y="261.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HTTPS 443 from IT only</text>
<rect x="330.0" y="210.0" width="230.0" height="82.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="338.0" y="228.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Remote-access gateway</text>
<text x="338.0" y="245.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">jump host, MFA, session record</text>
<text x="338.0" y="261.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">time-limited vendor access</text>
<rect x="820.0" y="210.0" width="230.0" height="82.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="828.0" y="228.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Patch + antivirus server</text>
<text x="828.0" y="245.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">tested OS / AV updates</text>
<text x="828.0" y="261.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">pushed into OT zones</text>
<rect x="60.0" y="340.0" width="230.0" height="100.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="68.0" y="358.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">MES server</text>
<text x="68.0" y="375.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">orders, serial numbers, OEE</text>
<text x="68.0" y="391.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">reads SCADA / PLC via OPC UA</text>
<text x="68.0" y="407.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">vc-ops-mes01 (example)</text>
