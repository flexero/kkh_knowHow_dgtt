<text x="328.0" y="113.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Office PCs</text>
<text x="328.0" y="130.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">reports (PDF/CSV) via web</text>
<text x="328.0" y="146.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">no direct OT access</text>
<rect x="620.0" y="168.0" width="150.0" height="26.0" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="695.0" y="186.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#c0392b">FIREWALL 1 (IT/DMZ)</text>
