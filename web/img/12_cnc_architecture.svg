<text x="42.0" y="698.0" font-size="12" text-anchor="start" fill="#000" >Rule: buy CNC, drives, motors and encoders from ONE family (safety integration, tuning tools, service).</text>
<text x="42.0" y="718.0" font-size="12" text-anchor="start" fill="#000" >Control loops: current (in the drive, kHz) → speed → position (Kv 20–60 1/s, feed-forward) – guide 23.</text>
<text x="42.0" y="738.0" font-size="12" text-anchor="start" fill="#000" >Following error without feed-forward: e = v / Kv → 20 m/min, Kv 40 1/s → 8.3 mm (M12.2).</text>
<text x="42.0" y="758.0" font-size="12" text-anchor="start" fill="#000" >Safety functions per IEC 61800-5-2, required PL from the ISO 12100 risk assessment (M11).</text>
