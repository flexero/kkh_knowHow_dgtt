<text x="830.0" y="564.0" font-size="12" text-anchor="start" fill="#000">Strong steels give strength cheaply; plastics and stainless are for</text>
<text x="830.0" y="582.0" font-size="12" text-anchor="start" fill="#000">friction, wear or corrosion – not for strength.</text>
<text x="60.0" y="760.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Selection rules for station parts (details: doc 14 §3.9):</text>
<text x="60.0" y="782.0" font-size="12" text-anchor="start" fill="#000">• welded frames, brackets, posts → S355J2 (stress relieve, then machine)  • shafts, pins under load → 42CrMo4+QT or C45</text>
<text x="60.0" y="804.0" font-size="12" text-anchor="start" fill="#000">• wear parts with impact (pins, bushes, receivers) → 16MnCr5 case hardened  • light moving parts / profiles → EN AW-6082 T6</text>
<text x="60.0" y="826.0" font-size="12" text-anchor="start" fill="#000">• slide strips, guides for crates → PE-UHMW  • precise plastic parts → POM-C  • coolant zone → X5CrNi18-10 or painted S355</text>
<text x="60.0" y="848.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Steels all have E ≈ 210 GPa: a stronger steel is NOT stiffer.</text>
<text x="60.0" y="870.0" font-size="12" text-anchor="start" fill="#000">Aluminium: same E/ρ as steel (26), but a plate of equal bending stiffness weighs only half.</text>
