<text x="420" y="658" font-size="12" text-anchor="start" fill="#000">Up (backward trace): assembly serial → children → lots → heats, machines, operators, measured values.</text>
<text x="420" y="677" font-size="12" text-anchor="start" fill="#000">   GET /api/bsf/mes/trace?serial=A-BS-261114-0005</text>
<text x="420" y="696" font-size="12" text-anchor="start" fill="#000">Links are made by the MES: components FIFO from the same work order at the assembly op,</text>
<text x="420" y="715" font-size="12" text-anchor="start" fill="#000">or by scanning (POST /api/bsf/mes/genealogy/link {parent, children}).</text>
