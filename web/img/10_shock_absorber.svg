<text x="803.6" y="169.0" font-size="11" text-anchor="start" fill="#000">single-orifice dashpot: peak at the start</text>
<text x="770.0" y="560.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Sizing steps (maker method – ACE / Enidine / Weforma style):</text>
<text x="770.0" y="582.0" font-size="12" text-anchor="start" fill="#000">1  E1 = ½·m·v² = ½·510·0.2² = 10.2 J (creep failed)</text>
<text x="770.0" y="604.0" font-size="12" text-anchor="start" fill="#000">2  E2 = F·s = 750·0.025 = 18.8 J (chains keep pushing)</text>
<text x="770.0" y="626.0" font-size="12" text-anchor="start" fill="#000">3  E3 = 29.0 J/stroke → choose ≥ 1.25·E3 = 36 J</text>
<text x="770.0" y="648.0" font-size="12" text-anchor="start" fill="#000">4  me = 2·E3/v² = 1450 kg → must lie inside the absorber's me range</text>
<text x="770.0" y="670.0" font-size="12" text-anchor="start" fill="#000">5  ET = E3 × cycles/h ≤ catalogue ET (heat)</text>
<text x="770.0" y="692.0" font-size="12" text-anchor="start" fill="#000">6  F ≈ E3/(0.85·s) = 1.36 kN → stop and bracket design load</text>
<text x="770.0" y="714.0" font-size="12" text-anchor="start" fill="#000">7  pallet decel. (1363 − 750)/510 = 1.2 m/s² → tipping safety 7.9 ✓</text>
<text x="770.0" y="736.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">Rule: the PU pad behind the absorber is the fixed end stop.</text>
