<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
<rect width="1200" height="830" fill="#fff"/>
<text x="40.0" y="44.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">Crane step chain for one job (GRAFCET style) – step number = time-out alarm ASRSRAW_A8sss</text><rect x="80.0" y="70.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="2"/><rect x="84.0" y="74.0" width="46.0" height="26.0" rx="0" fill="none" stroke="#1565c0" stroke-width="1.2"/><text x="107.0" y="92.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">10</text><rect x="134.0" y="74.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="92.0" font-size="12" text-anchor="start" fill="#000">wait for job</text><line x1="107.0" y1="104.0" x2="107.0" y2="124.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="114.0" x2="119.0" y2="114.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="118.0" font-size="11" text-anchor="start" fill="#333">job telegram valid + interlocks OK</text><rect x="80.0" y="124.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="146.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">20</text><rect x="134.0" y="128.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="146.0" font-size="12" text-anchor="start" fill="#000">travel + hoist to pick point</text><line x1="107.0" y1="158.0" x2="107.0" y2="178.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="168.0" x2="119.0" y2="168.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="172.0" font-size="11" text-anchor="start" fill="#333">in position window (coarse)</text><rect x="80.0" y="178.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="200.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">30</text><rect x="134.0" y="182.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="200.0" font-size="12" text-anchor="start" fill="#000">fine positioning</text><line x1="107.0" y1="212.0" x2="107.0" y2="232.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="222.0" x2="119.0" y2="222.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="226.0" font-size="11" text-anchor="start" fill="#333">|e| ≤ 3 mm, sway &lt; 2 mm</text><rect x="80.0" y="232.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="254.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">40</text><rect x="134.0" y="236.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="254.0" font-size="12" text-anchor="start" fill="#000">fork out</text><line x1="107.0" y1="266.0" x2="107.0" y2="286.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="276.0" x2="119.0" y2="276.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="280.0" font-size="11" text-anchor="start" fill="#333">fork end position + no collision</text><rect x="80.0" y="286.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="308.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">50</text><rect x="134.0" y="290.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="308.0" font-size="12" text-anchor="start" fill="#000">lift 100 mm (pick)</text><line x1="107.0" y1="320.0" x2="107.0" y2="340.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="330.0" x2="119.0" y2="330.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="334.0" font-size="11" text-anchor="start" fill="#333">load sensor ON, weight OK</text><rect x="80.0" y="340.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="362.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">60</text><rect x="134.0" y="344.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="362.0" font-size="12" text-anchor="start" fill="#000">fork in to centre</text><line x1="107.0" y1="374.0" x2="107.0" y2="394.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="384.0" x2="119.0" y2="384.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="388.0" font-size="11" text-anchor="start" fill="#333">centre sensors 1 + 2 ON</text><rect x="80.0" y="394.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="416.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">120</text><rect x="134.0" y="398.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="416.0" font-size="12" text-anchor="start" fill="#000">travel + hoist to drop point</text><line x1="107.0" y1="428.0" x2="107.0" y2="448.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="438.0" x2="119.0" y2="438.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="442.0" font-size="11" text-anchor="start" fill="#333">in position window</text><rect x="80.0" y="448.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="470.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">130</text><rect x="134.0" y="452.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="470.0" font-size="12" text-anchor="start" fill="#000">fine positioning</text><line x1="107.0" y1="482.0" x2="107.0" y2="502.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="492.0" x2="119.0" y2="492.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="496.0" font-size="11" text-anchor="start" fill="#333">|e| ≤ 3 mm</text><rect x="80.0" y="502.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="524.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">140</text><rect x="134.0" y="506.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="524.0" font-size="12" text-anchor="start" fill="#000">fork out (slot free checked)</text><line x1="107.0" y1="536.0" x2="107.0" y2="556.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="546.0" x2="119.0" y2="546.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="550.0" font-size="11" text-anchor="start" fill="#333">fork end position</text><rect x="80.0" y="556.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="578.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">150</text><rect x="134.0" y="560.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="578.0" font-size="12" text-anchor="start" fill="#000">lower 100 mm (drop)</text><line x1="107.0" y1="590.0" x2="107.0" y2="610.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="600.0" x2="119.0" y2="600.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="604.0" font-size="11" text-anchor="start" fill="#333">load sensor OFF</text><rect x="80.0" y="610.0" width="54.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="107.0" y="632.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">160</text><rect x="134.0" y="614.0" width="230.0" height="26.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="142.0" y="632.0" font-size="12" text-anchor="start" fill="#000">fork in to centre</text><line x1="107.0" y1="644.0" x2="107.0" y2="664.0" stroke="#000" stroke-width="1.4"/><line x1="95.0" y1="654.0" x2="119.0" y2="654.0" stroke="#000" stroke-width="2.2"/><text x="126.0" y="658.0" font-size="11" text-anchor="start" fill="#333">centre OK → report done</text><text x="80.0" y="680.0" font-size="12" text-anchor="start" fill="#000">back to 10 · dual command: steps 220 … 360 for the second job</text><text x="520.0" y="80.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Time-outs and alarms (example)</text><text x="520.0" y="102.0" font-size="12" text-anchor="start" fill="#000">move steps 20 / 120: 1.5 × planned time + 2 s → A8020 / A8120</text><text x="520.0" y="121.0" font-size="12" text-anchor="start" fill="#000">fine positioning 30 / 130: 6 s → A8030 / A8130</text><text x="520.0" y="140.0" font-size="12" text-anchor="start" fill="#000">fork out / in 40, 60: 5 s → A8040 / A8060</text><text x="520.0" y="159.0" font-size="12" text-anchor="start" fill="#000">lift / lower 50 / 150: 2 s → A8050 / A8150</text><text x="520.0" y="178.0" font-size="12" text-anchor="start" fill="#000">a time-out does NOT move the crane: it stops in the step,</text><text x="520.0" y="197.0" font-size="12" text-anchor="start" fill="#000">the operator sees the step + the missing transition</text><text x="520.0" y="240.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Operating modes (mode selector, key switch)</text><rect x="490.0" y="270.0" width="140.0" height="46.0" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/><text x="560.0" y="297.3" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">AUTO</text><rect x="690.0" y="270.0" width="140.0" height="46.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="760.0" y="297.3" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">SEMI</text><rect x="890.0" y="270.0" width="140.0" height="46.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="960.0" y="297.3" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">MANUAL</text><line x1="630.0" y1="286.0" x2="690.0" y2="286.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><line x1="830.0" y1="286.0" x2="890.0" y2="286.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><line x1="690.0" y1="302.0" x2="630.0" y2="302.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><line x1="890.0" y1="302.0" x2="830.0" y2="302.0" stroke="#000" stroke-width="1.3" marker-end="url(#ar)"/><text x="520.0" y="345.0" font-size="12" text-anchor="start" fill="#000">AUTO: jobs from the WCS queue, dual command when a store + a retrieval wait</text><text x="520.0" y="364.0" font-size="12" text-anchor="start" fill="#000">SEMI: one job entered at the HMI, executed automatically, then stop</text><text x="520.0" y="383.0" font-size="12" text-anchor="start" fill="#000">MANUAL: hold-to-run jog at SLS 0.3 m/s, no jobs, all safety active</text><text x="520.0" y="402.0" font-size="12" text-anchor="start" fill="#000">mode change only at standstill (step 10) – a running job is finished</text><text x="520.0" y="421.0" font-size="12" text-anchor="start" fill="#000">after a fault: SEMI / MANUAL recovery, then load tracking check, then AUTO</text><text x="520.0" y="460.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Error reactions inside the chain</text><text x="520.0" y="482.0" font-size="12" text-anchor="start" fill="#000">step 40 drop: slot occupied → A7051, fork stays in, WCS sends new target</text><text x="520.0" y="501.0" font-size="12" text-anchor="start" fill="#000">step 50 pick: no load seen → A7061, job aborted, WMS stock correction</text><text x="520.0" y="520.0" font-size="12" text-anchor="start" fill="#000">step 50 pick: load cell &gt; 110 % → A5011, lower again, stop</text><text x="520.0" y="539.0" font-size="12" text-anchor="start" fill="#000">step 40: fork collision sensor → A4041, fork stop, travel + hoist blocked</text><text x="520.0" y="558.0" font-size="12" text-anchor="start" fill="#000">infeed: no-read A7011 / contour A7021 / weight A7031 → reject lane</text><text x="520.0" y="577.0" font-size="12" text-anchor="start" fill="#000">e-stop / door / safety fault: chain frozen in its step,</text><text x="520.0" y="596.0" font-size="12" text-anchor="start" fill="#000">resumes in the same step after reset (no new start)</text><text x="520.0" y="640.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Referencing after power-on (absolute systems):</text><text x="520.0" y="662.0" font-size="12" text-anchor="start" fill="#000">laser vs wheel encoder &lt; 20 mm · bar-code read OK · fork centred</text><text x="520.0" y="681.0" font-size="12" text-anchor="start" fill="#000">load sensor = WCS tracking · then AUTO (no homing run)</text>
<rect x="10.0" y="10.0" width="1180.0" height="810.0" rx="0" fill="none" stroke="#000" stroke-width="1.5"/><rect x="760.0" y="738.0" width="430.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="760.0" y1="766.0" x2="1190.0" y2="766.0" stroke="#000" stroke-width="1"/><line x1="760.0" y1="792.0" x2="1190.0" y2="792.0" stroke="#000" stroke-width="1"/><line x1="1040.0" y1="792.0" x2="1040.0" y2="820.0" stroke="#000" stroke-width="1"/><text x="770.0" y="758.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the AS/RS supplier's documentation</text><text x="770.0" y="785.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Crane step chain, modes and error reactions</text><text x="770.0" y="812.0" font-size="11" text-anchor="start" fill="#000">32_step_chain.svg · guide 32 §8</text><text x="1050.0" y="812.0" font-size="11" text-anchor="start" fill="#000">n.t.s. · 2026-11-12</text>
</svg>