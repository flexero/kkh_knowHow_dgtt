<polyline points="300.0,794.0 1141.9,794.0 1141.9,780.0 1340.0,780.0 1340.0,794.0 1340.0,794.0" stroke="#c62828" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
<text x="1147.9" y="776.0" font-size="10" text-anchor="start" fill="#c62828">AlarmNo = 7, chain holds, air off</text>
<text x="24.0" y="850.0" font-size="12" text-anchor="start" fill="#000">Reading: in the twin a step ends in the scan its sensor comes (plant before logic) → 8.80 s. A real PLC adds filter + scan + valve time ≈ 30 ms per step (guide 36 §8.4).</text>
<text x="24.0" y="866.0" font-size="12" text-anchor="start" fill="#000">Watchdog = 2 × nominal (guide 09 §24.3). Timer accuracy: + 0 … 1 scan (the timer is evaluated once per scan).</text>
<text x="24.0" y="882.0" font-size="12" text-anchor="start" fill="#000">FIN handshake: NC sets M60 (strobe) → PLC does the change → FIN = 1 → NC sets M60 = 0 → PLC sets FIN = 0. Never a fixed FIN pulse time.</text>
