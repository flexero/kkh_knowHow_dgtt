<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#111"/></marker><marker id="arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#1f6fd1"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs><rect width="1200" height="830" fill="#fff"/><text x="20.0" y="30.0" font-size="20" font-weight="700">Factory planning method – from demand to the decision</text><text x="20.0" y="50.0" font-size="12" fill="#666">Each step uses the result of the previous one; steps 8 and 9 are this page (live twin + what-if)</text><rect x="40.0" y="120.0" width="200.0" height="120.0" fill="none" stroke="#111" stroke-width="1.2" rx="6"/><text x="140.0" y="150.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">1 Demand</text><text x="140.0" y="182.0" font-size="11" text-anchor="middle">120 screw sets + 200</text><text x="140.0" y="200.0" font-size="11" text-anchor="middle">guide sets / day, 250 days</text><line x1="240.0" y1="180.0" x2="266.0" y2="180.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="268.0" y="120.0" width="200.0" height="120.0" fill="none" stroke="#111" stroke-width="1.2" rx="6"/><text x="368.0" y="150.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">2 Routings</text><text x="368.0" y="182.0" font-size="11" text-anchor="middle">51 operations, cycle +</text><text x="368.0" y="200.0" font-size="11" text-anchor="middle">set-up + scrap (item 2)</text><line x1="468.0" y1="180.0" x2="494.0" y2="180.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="496.0" y="120.0" width="200.0" height="120.0" fill="none" stroke="#111" stroke-width="1.2" rx="6"/><text x="596.0" y="150.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">3 Capacity</text><text x="596.0" y="182.0" font-size="11" text-anchor="middle">machines = Σ load /</text><text x="596.0" y="200.0" font-size="11" text-anchor="middle">(avail × OEE) → 72 + lab</text><line x1="696.0" y1="180.0" x2="722.0" y2="180.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="724.0" y="120.0" width="200.0" height="120.0" fill="none" stroke="#111" stroke-width="1.2" rx="6"/><text x="824.0" y="150.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">4 Areas</text><text x="824.0" y="182.0" font-size="11" text-anchor="middle">footprint × 2.5 – 3 +</text><text x="824.0" y="200.0" font-size="11" text-anchor="middle">stores + aisles</text><line x1="924.0" y1="180.0" x2="950.0" y2="180.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="952.0" y="120.0" width="200.0" height="120.0" fill="none" stroke="#111" stroke-width="1.2" rx="6"/><text x="1052.0" y="150.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">5 Block layout</text><text x="1052.0" y="182.0" font-size="11" text-anchor="middle">flow order, climate</text><text x="1052.0" y="200.0" font-size="11" text-anchor="middle">zones, HT apart</text><rect x="40.0" y="350.0" width="200.0" height="120.0" fill="none" stroke="#111" stroke-width="1.2" rx="6"/><text x="140.0" y="380.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">6 Detailed layout</text><text x="140.0" y="412.0" font-size="11" text-anchor="middle">machines, aisles 3 – 4 m,</text><text x="140.0" y="430.0" font-size="11" text-anchor="middle">doors, utilities</text><line x1="240.0" y1="410.0" x2="266.0" y2="410.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="268.0" y="350.0" width="200.0" height="120.0" fill="none" stroke="#111" stroke-width="1.2" rx="6"/><text x="368.0" y="380.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">7 Flow check</text><text x="368.0" y="412.0" font-size="11" text-anchor="middle">from–to matrix, m/day,</text><text x="368.0" y="430.0" font-size="11" text-anchor="middle">AGV fleet</text><line x1="468.0" y1="410.0" x2="494.0" y2="410.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="496.0" y="350.0" width="200.0" height="120.0" fill="none" stroke="#1f6fd1" stroke-width="2.2" rx="6"/><text x="596.0" y="380.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f6fd1">8 Simulation</text><text x="596.0" y="412.0" font-size="11" text-anchor="middle">live twin: WIP, lead</text><text x="596.0" y="430.0" font-size="11" text-anchor="middle">time, bottleneck</text><line x1="696.0" y1="410.0" x2="722.0" y2="410.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="724.0" y="350.0" width="200.0" height="120.0" fill="none" stroke="#1f6fd1" stroke-width="2.2" rx="6"/><text x="824.0" y="380.0" font-size="15" text-anchor="middle" font-weight="700" fill="#1f6fd1">9 What-if</text><text x="824.0" y="412.0" font-size="11" text-anchor="middle">7 vs 8 grinders, OEE,</text><text x="824.0" y="430.0" font-size="11" text-anchor="middle">AGVs, lots</text><line x1="924.0" y1="410.0" x2="950.0" y2="410.0" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><rect x="952.0" y="350.0" width="200.0" height="120.0" fill="none" stroke="#111" stroke-width="1.2" rx="6"/><text x="1052.0" y="380.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">10 Decision</text><text x="1052.0" y="412.0" font-size="11" text-anchor="middle">buy list, building, HVAC,</text><text x="1052.0" y="430.0" font-size="11" text-anchor="middle">foundations</text><polyline points="1052.0,240.0 1052.0,300.0 140.0,300.0 140.0,348.0" fill="none" stroke="#111" stroke-width="1" marker-end="url(#ar)"/><polyline points="940.0,470.0 940.0,530.0 600.0,530.0 600.0,470.0" fill="none" stroke="#1f6fd1" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arA)"/><text x="770.0" y="550.0" font-size="11" text-anchor="middle" fill="#1f6fd1">loop: change the layout / machines / lots and simulate again</text><text x="40.0" y="610.0" font-size="12">Rule: capacity first (how many machines), then areas, then the layout, then check the flow – and only then buy. The twin is used again later with real data.</text><g><rect x="800.0" y="756.0" width="390.0" height="64.0" fill="none" stroke="#111" stroke-width="1.2"/><line x1="800.0" y1="780.0" x2="1190.0" y2="780.0" stroke="#111" stroke-width="1"/><text x="808.0" y="773.0" font-size="13" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your planner</text><text x="808.0" y="796.0" font-size="11">Ball screw + guide factory · item 3 · guide 42</text><text x="808.0" y="812.0" font-size="11" fill="#666">Drawing 42-11 · all values are examples · 2026</text></g></svg>