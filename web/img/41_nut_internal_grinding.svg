<text x="300.0" y="120.0" font-size="11.5" text-anchor="middle" fill="#000">nut body 58 – 62 HRC (case hardened)</text>
<text x="122.0" y="122.0" font-size="11.5" text-anchor="start" fill="#000">flange</text>
<rect x="314.0" y="258.0" width="320.0" height="16.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.3"/>
<rect x="620.0" y="220.0" width="180.0" height="90.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="710.0" y="330.0" font-size="11.5" text-anchor="middle" fill="#000">HF spindle 30 000 min⁻¹</text>
<rect x="294.0" y="254.0" width="20.0" height="24.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<path d="M290,280 L290,238 L300,214 L310,238 L310,280 Z" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.6"/>
<line x1="294.0" y1="260.0" x2="200.0" y2="320.0" stroke="#1f6fd1" stroke-width="0.8"/>
<circle cx="294.0" cy="260.0" r="2.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="0.5"/>
<text x="196.0" y="324.0" font-size="11.5" text-anchor="end" fill="#1f6fd1">CBN wheel Ø25 × 6</text>
<line x1="314.0" y1="280.0" x2="314.0" y2="419.0" stroke="#000" stroke-width="0.8"/>
<line x1="620.0" y1="280.0" x2="620.0" y2="419.0" stroke="#000" stroke-width="0.8"/>
<line x1="314.0" y1="415.0" x2="620.0" y2="415.0" stroke="#000" stroke-width="1" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="467.0" y="410.0" font-size="11.5" text-anchor="middle" fill="#000">quill overhang 120 mm (drawn shorter)</text>
<line x1="110.0" y1="250.0" x2="820.0" y2="250.0" stroke="#000" stroke-width="0.7" stroke-dasharray="16,4,3,4"/>
<text x="860.0" y="58.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">B  Quill deflection → taper</text>
<line x1="870.0" y1="180.0" x2="1150.0" y2="180.0" stroke="#000" stroke-width="1.2"/>
<rect x="1150.0" y="160.0" width="30.0" height="40.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
<path d="M1150,180 Q1010,186 870,206" fill="none" stroke="#1f6fd1" stroke-width="2"/>
<line x1="870.0" y1="180.0" x2="870.0" y2="206.0" stroke="#1f6fd1" stroke-width="1" marker-end="url(#ea)"/>
<text x="880.0" y="226.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">δ = F·L³/(3·E·I)</text>
<text x="870.0" y="250.0" font-size="11.5" text-anchor="start" fill="#000">F = 20 N grinding normal force, L = 120 mm:</text>
<text x="870.0" y="267.0" font-size="11.5" text-anchor="start" fill="#000">steel quill Ø16: I = π·16⁴/64 = 3 217 mm⁴</text>
<text x="870.0" y="284.0" font-size="11.5" text-anchor="start" fill="#000">→ δ = 20·120³/(3·206 000·3 217) = 17.4 µm</text>
<text x="870.0" y="301.0" font-size="11.5" text-anchor="start" fill="#000">carbide quill (E 600 000): δ = 6.0 µm</text>
<text x="870.0" y="318.0" font-size="11.5" text-anchor="start" fill="#000">δ changes with the wheel position</text>
<text x="870.0" y="335.0" font-size="11.5" text-anchor="start" fill="#000">→ thread tapers (bell-mouth); correct it</text>
<text x="870.0" y="352.0" font-size="11.5" text-anchor="start" fill="#000">with a CNC taper correction + spark-out.</text>
<rect x="30.0" y="440.0" width="640.0" height="22.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="456.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Item</text>
<line x1="200.0" y1="440.0" x2="200.0" y2="462.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="456.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Value (example)</text>
<rect x="30.0" y="462.0" width="640.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="478.0" font-size="11.5" text-anchor="start" fill="#000">Wheel speed</text>
<line x1="200.0" y1="462.0" x2="200.0" y2="484.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="478.0" font-size="11.5" text-anchor="start" fill="#000">n = vs·60 000/(π·d) = 30·60 000/(π·25) = 22 918 min⁻¹</text>
<rect x="30.0" y="484.0" width="640.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="500.0" font-size="11.5" text-anchor="start" fill="#000">Work speed / table</text>
<line x1="200.0" y1="484.0" x2="200.0" y2="506.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="500.0" font-size="11.5" text-anchor="start" fill="#000">rough 30 min⁻¹ (300 mm/min), finish 8 min⁻¹ (80 mm/min)</text>
<rect x="30.0" y="506.0" width="640.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="522.0" font-size="11.5" text-anchor="start" fill="#000">Passes</text>
<line x1="200.0" y1="506.0" x2="200.0" y2="528.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="522.0" font-size="11.5" text-anchor="start" fill="#000">4 rough (0.04 mm) + 2 finish (0.01 mm)</text>
<rect x="30.0" y="528.0" width="640.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="544.0" font-size="11.5" text-anchor="start" fill="#000">Grinding time</text>
<line x1="200.0" y1="528.0" x2="200.0" y2="550.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="544.0" font-size="11.5" text-anchor="start" fill="#000">4 × 80/(10·30) + 2 × 80/(10·8) = 1.07 + 2.0 = 3.07 min</text>
<rect x="30.0" y="550.0" width="640.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="566.0" font-size="11.5" text-anchor="start" fill="#000">Cycle</text>
<line x1="200.0" y1="550.0" x2="200.0" y2="572.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="566.0" font-size="11.5" text-anchor="start" fill="#000">9 min incl. load, dressing, ball gauge (BN-ITG, 2 machines)</text>
<rect x="30.0" y="572.0" width="640.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="588.0" font-size="11.5" text-anchor="start" fill="#000">Oil</text>
<line x1="200.0" y1="572.0" x2="200.0" y2="594.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="588.0" font-size="11.5" text-anchor="start" fill="#000">grinding oil 20 ± 1 °C</text>
<rect x="30.0" y="594.0" width="640.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="610.0" font-size="11.5" text-anchor="start" fill="#000">Check QG-BN-2</text>
<line x1="200.0" y1="594.0" x2="200.0" y2="616.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="610.0" font-size="11.5" text-anchor="start" fill="#000">pitch Ø over 2 balls 100 %, profile 1 in 10, taper ≤ 2 µm</text>
<rect x="30.0" y="616.0" width="640.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="35.0" y="632.0" font-size="11.5" text-anchor="start" fill="#000">Typical mistake</text>
<line x1="200.0" y1="616.0" x2="200.0" y2="638.0" stroke="#000" stroke-width="0.8"/>
<text x="205.0" y="632.0" font-size="11.5" text-anchor="start" fill="#000">quill deflection, wheel wear → profile error, burn (small wheel, long contact)</text>
<rect x="700.0" y="440.0" width="470.0" height="180.0" rx="0" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="712.0" y="462.0" font-size="11.5" text-anchor="start" fill="#000">Why is the nut harder to grind than the screw?</text>
<text x="712.0" y="480.0" font-size="11.5" text-anchor="start" fill="#000">• the wheel must fit inside the bore (land Ø ≈ 34.5 mm)</text>
<text x="712.0" y="498.0" font-size="11.5" text-anchor="start" fill="#000">  and be tilted by 5.51° → wheel Ø ≤ 25 mm</text>
<text x="712.0" y="516.0" font-size="11.5" text-anchor="start" fill="#000">• small wheel → very high rpm for 30 m/s, fast wear,</text>
<text x="712.0" y="534.0" font-size="11.5" text-anchor="start" fill="#000">  frequent dressing (CBN keeps its form longer)</text>
<text x="712.0" y="552.0" font-size="11.5" text-anchor="start" fill="#000">• long thin quill → deflection, chatter</text>
<text x="712.0" y="570.0" font-size="11.5" text-anchor="start" fill="#000">• the contact arc inside a bore is long → more heat</text>
<text x="712.0" y="588.0" font-size="11.5" text-anchor="start" fill="#000">  → burn risk; use CBN + oil, small infeed</text>
<rect x="812.0" y="742.0" width="382.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="812.0" y1="768.0" x2="1194.0" y2="768.0" stroke="#000" stroke-width="0.8"/>
<line x1="812.0" y1="792.0" x2="1194.0" y2="792.0" stroke="#000" stroke-width="0.8"/>
<line x1="1002.0" y1="792.0" x2="1002.0" y2="824.0" stroke="#000" stroke-width="0.8"/>
<text x="820.0" y="760.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Ball nut internal thread grinding</text>
<text x="820.0" y="785.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the machine maker's data</text>
<text x="820.0" y="812.0" font-size="11.5" text-anchor="start" fill="#000">Drawing 41-08</text>
<text x="1010.0" y="806.0" font-size="11" text-anchor="start" fill="#000">Scale: none</text>
<text x="1010.0" y="819.0" font-size="11" text-anchor="start" fill="#000">guide 41 §14</text>
