<text x="20.0" y="30.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Internal thread grinding of the ball nut BN-3210-FL – small CBN wheel on a long quill, quill tilted by the lead angle</text>
<text x="30.0" y="58.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">A  Section (schematic)</text>
