<text x="636.0" y="480.0" font-size="11" text-anchor="start" fill="#000">apart from signals)</text>
<rect x="50.0" y="800.0" width="860.0" height="190.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="60.0" y="820.0" font-size="11" text-anchor="start" fill="#000">Sensor positions (numbers in the plan – example):</text>
<text x="60.0" y="840.0" font-size="11" text-anchor="start" fill="#000">1, 2  IEPE accelerometers 100 mV/g on the housing at the front / rear bearing plane, radial, stud-mounted on a spot face</text>
<text x="60.0" y="860.0" font-size="11" text-anchor="start" fill="#000">3  PRB-01 capacitive probes X + Y at the mandrel near the nose and at 300 mm   ·   4  PRB-01 Z probe on the mandrel end (growth)</text>
<text x="60.0" y="880.0" font-size="11" text-anchor="start" fill="#000">5  T1 front bearings, T2 rear bearings, T3 stator (Pt100/KTY in the spindle); T4/T5 water in/out at the spindle (Pt100 4-wire, class A)</text>
<text x="60.0" y="900.0" font-size="11" text-anchor="start" fill="#000">6  drive encoder at the tail (speed for control and safe speed monitoring)   ·   7  microphone M1, 1 m from the spindle surface</text>
<text x="60.0" y="920.0" font-size="11" text-anchor="start" fill="#000">Line instruments (see P&amp;ID): FT-101 flow, PT-101 pressure, FI-301 sealing-air flow, PT-401 = PRS-01 unclamp pressure</text>
<text x="60.0" y="940.0" font-size="11" text-anchor="start" fill="#000">S1 door guard locking: unlock only at safe standstill (e.g. SSM &lt; 10 rpm); 2 E-stops (PL d example – the risk assessment decides)</text>
<text x="60.0" y="960.0" font-size="11" text-anchor="start" fill="#000">Noise and vibration: bench on isolators, chiller and hydraulic unit placed outside the guard (heat + noise sources)</text>
