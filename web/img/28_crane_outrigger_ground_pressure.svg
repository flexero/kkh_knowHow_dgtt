<text x="838.0" y="915.0" font-size="14" text-anchor="start" font-weight="bold" fill="#c62828">EXAMPLE – check the maker&#x27;s installation manual</text>
<text x="838.0" y="944.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Crane outrigger ground pressure</text>
<text x="838.0" y="964.0" font-size="11" text-anchor="start" fill="#555">F ≈ 0.75 (60 + 12.12) t = 530.6 kN · mat 1.7 m → 183.6 kPa</text>
<text x="1218.0" y="944.0" font-size="12" text-anchor="start" fill="#000">Doc 28 · Fig. 28-4</text>
<text x="1218.0" y="964.0" font-size="11" text-anchor="start" fill="#555">2026-11 · not for construction</text>
<text x="24.0" y="968.0" font-size="11" text-anchor="start" fill="#555">Values from docs/28 and web/instseq_calc.js (example data, crankcase line HMC-01/02/03).</text>
