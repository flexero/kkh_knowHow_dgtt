<text x="542.5" y="636.0" font-size="11" text-anchor="middle" fill="#000">working radius R (slew centre → hook), e.g. 8 m</text>
<text x="60.0" y="120.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">hook load 12 120 kg (machine + 120 kg gear)</text>
<text x="60.0" y="138.0" font-size="11" text-anchor="start" fill="#000">crane load-chart value at radius R (with the real counterweight,</text>
<text x="60.0" y="154.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">outrigger base and slew zone) ≥ 1.25 × 12.12 = 15.15 t</text>
<path d="M85,560 L45,600 L215,600 L175,560" stroke="#c62828" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>
<text x="50.0" y="620.0" font-size="11" text-anchor="start" fill="#c62828">load spreads ~45° (concrete/gravel) – check the layer below</text>
<text x="90.0" y="530.0" font-size="11" text-anchor="end" fill="#000">mat</text>
<text x="590.0" y="588.0" font-size="11" text-anchor="middle" fill="#000">float on mat</text>
<text x="40.0" y="650.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">2  Plan of the outrigger base (schematic)</text>
