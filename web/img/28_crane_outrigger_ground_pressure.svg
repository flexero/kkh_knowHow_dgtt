<text x="240.0" y="794.0" font-size="11" text-anchor="middle" fill="#000">carrier</text>
<line x1="360.0" y1="772.0" x2="570.0" y2="730.0" stroke="#000" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="576.0" y="730.0" font-size="11" text-anchor="start" fill="#000">load side</text>
<text x="50.0" y="940.0" font-size="11" text-anchor="start" fill="#000">The outriggers on the load side carry most. Slewing over a corner = worst case.</text>
<text x="880.0" y="88.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">3  Ground pressure – worked example</text>
<text x="880.0" y="114.0" font-size="12" text-anchor="start" fill="#000">Crane total mass incl. counterweight (example): 60 t</text>
<text x="880.0" y="133.0" font-size="12" text-anchor="start" fill="#000">Hook load: 12.12 t</text>
<text x="880.0" y="152.0" font-size="12" text-anchor="start" fill="#000">Rule of thumb (crane hire firms, e.g. CPA guidance):</text>
<text x="880.0" y="171.0" font-size="12" text-anchor="start" fill="#000">  F_max ≈ 0.75 × (crane + load) = 0.75 × 72.12</text>
<text x="880.0" y="190.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">  F_max = 54.09 t = 530.6 kN on one float</text>
<text x="880.0" y="209.0" font-size="12" text-anchor="start" fill="#000">Better: the crane maker&#x27;s outrigger calculator</text>
<text x="880.0" y="228.0" font-size="12" text-anchor="start" fill="#000">(e.g. Liebherr LICCON planner, maker apps).</text>
<text x="880.0" y="247.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="880.0" y="266.0" font-size="12" text-anchor="start" fill="#000">Ground pressure  q = F / A_mat</text>
<text x="880.0" y="285.0" font-size="12" text-anchor="start" fill="#c62828">  mat 1.2 × 1.2 m (1.44 m²): q = 368.5 kPa  ✗</text>
<text x="880.0" y="304.0" font-size="12" text-anchor="start" fill="#c62828">  mat 1.5 × 1.5 m (2.25 m²): q = 235.8 kPa  ✗</text>
<text x="880.0" y="323.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">  mat 1.7 × 1.7 m (2.89 m²): q = 183.6 kPa  ✓</text>
<text x="880.0" y="342.0" font-size="12" text-anchor="start" fill="#000">Allowed (example, compacted gravel): 200 kPa</text>
<text x="880.0" y="361.0" font-size="12" text-anchor="start" fill="#000">  A_req = 530.6 / 200 = 2.65 m²</text>
<text x="880.0" y="380.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="880.0" y="399.0" font-size="12" text-anchor="start" fill="#000">Mat must be stiff enough to spread the load</text>
<text x="880.0" y="418.0" font-size="12" text-anchor="start" fill="#000">(steel / hardwood / composite crane mats).</text>
<text x="880.0" y="437.0" font-size="12" text-anchor="start" fill="#000">Over cellars, drains, trenches: forbidden or</text>
<text x="880.0" y="456.0" font-size="12" text-anchor="start" fill="#000">design check by a structural engineer.</text>
<text x="880.0" y="520.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">4  Typical allowable ground pressure (guide values)</text>
<rect x="874.0" y="531.0" width="460.0" height="20.0" rx="0" stroke="none" stroke-width="0" fill="#e8e8e8"/>
<text x="880.0" y="546.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Ground</text>
<text x="1140.0" y="546.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">kPa (guide)</text>
<text x="880.0" y="566.0" font-size="12" text-anchor="start" fill="#000">soft clay, made ground</text>
<text x="1140.0" y="566.0" font-size="12" text-anchor="start" fill="#000">≤ 75 – test!</text>
<text x="880.0" y="586.0" font-size="12" text-anchor="start" fill="#000">firm clay</text>
<text x="1140.0" y="586.0" font-size="12" text-anchor="start" fill="#000">≈ 75–150</text>
<text x="880.0" y="606.0" font-size="12" text-anchor="start" fill="#000">stiff clay / dense sand</text>
<text x="1140.0" y="606.0" font-size="12" text-anchor="start" fill="#000">≈ 150–300</text>
<text x="880.0" y="626.0" font-size="12" text-anchor="start" fill="#000">compacted crushed gravel</text>
<text x="1140.0" y="626.0" font-size="12" text-anchor="start" fill="#000">≈ 200–400</text>
<text x="880.0" y="646.0" font-size="12" text-anchor="start" fill="#000">asphalt on good base</text>
<text x="1140.0" y="646.0" font-size="12" text-anchor="start" fill="#000">≈ 200 – check</text>
<text x="880.0" y="666.0" font-size="12" text-anchor="start" fill="#000">rock</text>
<text x="1140.0" y="666.0" font-size="12" text-anchor="start" fill="#000">&gt; 1 000</text>
<text x="880.0" y="686.0" font-size="12" text-anchor="start" fill="#000">concrete slab</text>
<text x="1140.0" y="686.0" font-size="12" text-anchor="start" fill="#000">punching check (doc 26)</text>
<text x="880.0" y="720.0" font-size="11" text-anchor="start" fill="#555">Values vary a lot – a geotechnical engineer or a plate-load</text>
<text x="880.0" y="736.0" font-size="11" text-anchor="start" fill="#555">test decides. Rain softens the ground: check on the day.</text>
