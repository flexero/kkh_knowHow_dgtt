<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Arial, Helvetica, sans-serif">
<title>Pneumatic cylinder ISO 15552 – forces, air consumption and a basic circuit (example)</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">Pneumatic cylinder ISO 15552 Ø50/20 × 100 at 6 bar – forces, air consumption, valve flow and circuit</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#666666">Example: lifting the retractable stop (item 1). F = p·A·η, free air per cycle Q = (A1 + A2)·s·(p + 1.013)/1.013. Guide 10 §31.</text>
<rect x="80.0" y="140.0" width="400.0" height="110.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="2"/>
<rect x="50.0" y="130.0" width="30.0" height="130.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<rect x="480.0" y="130.0" width="30.0" height="130.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<rect x="210.0" y="144.0" width="26.0" height="102.0" rx="0" fill="#000" stroke="#000" stroke-width="1"/>
<rect x="236.0" y="179.0" width="404.0" height="32.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.6"/>
<text x="223.0" y="284.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">piston Ø50 (A1 = 1963 mm²)</text>
<text x="580.0" y="171.0" font-size="12" text-anchor="middle" fill="#000">rod Ø20</text>
<text x="580.0" y="239.0" font-size="12" text-anchor="middle" fill="#000">annulus A2 = 1649 mm²</text>
<rect x="84.0" y="106.0" width="24.0" height="24.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="96.0" y="100.0" font-size="11" text-anchor="middle" fill="#000">port 1</text>
<rect x="452.0" y="106.0" width="24.0" height="24.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="464.0" y="100.0" font-size="11" text-anchor="middle" fill="#000">port 2</text>
<rect x="80.0" y="185.0" width="40.0" height="20.0" rx="0" fill="#f0c4c4" stroke="#000" stroke-width="1"/>
<text x="120.0" y="266.0" font-size="11" text-anchor="middle" fill="#c62828">cushion (adjustable)</text>
<line x1="140.0" y1="160.0" x2="206.0" y2="160.0" stroke="#c62828" stroke-width="1.6" marker-end="url(#aa)"/>
<line x1="140.0" y1="184.0" x2="206.0" y2="184.0" stroke="#c62828" stroke-width="1.6" marker-end="url(#aa)"/>
<line x1="140.0" y1="208.0" x2="206.0" y2="208.0" stroke="#c62828" stroke-width="1.6" marker-end="url(#aa)"/>
<line x1="140.0" y1="232.0" x2="206.0" y2="232.0" stroke="#c62828" stroke-width="1.6" marker-end="url(#aa)"/>
<text x="170.0" y="122.0" font-size="12" text-anchor="middle" fill="#c62828" font-weight="bold">p = 6 bar</text>
<line x1="640.0" y1="195.0" x2="710.0" y2="195.0" stroke="#000" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="718.0" y="200.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">F</text>
<line x1="236.0" y1="310.0" x2="476.0" y2="310.0" stroke="#000" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="356.0" y="306.0" font-size="11" text-anchor="middle" fill="#000">stroke s = 100 mm</text>
<text x="60.0" y="390.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Forces (η = 0.9 for seal friction)</text>
<text x="60.0" y="411.0" font-size="12" text-anchor="start" fill="#000">extend:  F = p·A1·η = 0.6·1963·0.9 = 1060 N   (theoretical 1178 N)</text>
<text x="60.0" y="432.0" font-size="12" text-anchor="start" fill="#000">retract: F = p·A2·η = 0.6·1649·0.9 = 891 N    (theoretical 990 N)</text>
<text x="60.0" y="453.0" font-size="12" text-anchor="start" fill="#000">Design rule: use ≤ 50–70 % of F for a moving load (speed reserve)</text>
<text x="60.0" y="474.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="60.0" y="495.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Air consumption (free air at 1.013 bar)</text>
<text x="60.0" y="516.0" font-size="12" text-anchor="start" fill="#000">compression ratio (6 + 1.013)/1.013 = 6.92</text>
<text x="60.0" y="537.0" font-size="12" text-anchor="start" fill="#000">per double stroke: (1963 + 1649)·100·6.92 = 2.50 L</text>
<text x="60.0" y="558.0" font-size="12" text-anchor="start" fill="#000">+ 2 tubes 6/4 × 2 m: 0.35 L  → 2.85 L per cycle</text>
<text x="60.0" y="579.0" font-size="12" text-anchor="start" fill="#000">5.2 cycles/h → 15 L/h (negligible) – leaks cost more!</text>
<text x="60.0" y="600.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="60.0" y="621.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Valve size for 0.5 s stroke (v = 0.2 m/s)</text>
<text x="60.0" y="642.0" font-size="12" text-anchor="start" fill="#000">Q = A1·v·6.92 = 1963·200·6.92 = 2.7 L/s = 163 Nl/min</text>
<text x="60.0" y="663.0" font-size="12" text-anchor="start" fill="#000">→ choose a valve with ≥ 2 × this standard flow (≈ 350 Nl/min)</text>
<text x="60.0" y="684.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="60.0" y="705.0" font-size="12" text-anchor="start" fill="#c62828">Leak check: 1 mm hole at 6 bar ≈ 42–72 Nl/min</text>
<text x="60.0" y="726.0" font-size="12" text-anchor="start" fill="#c62828">→ ≈ 2 400–4 200 kWh per year (≈ 490–830 € at 0.20 €/kWh)</text>
<text x="800.0" y="96.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Force at 6 bar (η = 0.9) for ISO 15552 bores</text>
