<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 740" width="1150" height="740" font-family="Arial, Helvetica, sans-serif"><title>Bearing mounting – heating, pressing, preload check</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.8"/></pattern><pattern id="hatA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1565c0" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1150" height="740" fill="#fff"/><rect x="4.0" y="4.0" width="1142.0" height="732.0" rx="0" fill="none" stroke="#000" stroke-width="1.5"/><text x="30.0" y="34.0" font-size="17" text-anchor="start" font-weight="bold" fill="#000">Bearing mounting – heating, force path when pressing, preload / friction torque checks</text><rect x="20.0" y="50.0" width="330.0" height="560.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="20.0" y="50.0" width="222.6" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="25.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">A  Induction heating (step 7)</text><rect x="60.0" y="300.0" width="250.0" height="90.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="185.0" y="350.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">heater body + coil</text><rect x="80.0" y="180.0" width="30.0" height="120.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><rect x="260.0" y="180.0" width="30.0" height="120.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><rect x="80.0" y="165.0" width="210.0" height="18.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><text x="185.0" y="160.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">yoke (fills the bore)</text><rect x="140.0" y="150.0" width="90.0" height="46.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="2"/><rect x="160.0" y="163.0" width="50.0" height="20.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.2"/><text x="185.0" y="140.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1565c0">bearing inner ring</text><line x1="230.0" y1="173.0" x2="300.0" y2="120.0" stroke="#000" stroke-width="1"/><circle cx="230.0" cy="173.0" r="3.0" fill="#000" stroke="#000" stroke-width="1.2"/><rect x="300.0" y="96.0" width="60.0" height="34.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="330.0" y="118.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0">106 °C</text><text x="290.0" y="90.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">magnetic probe</text><text x="35.0" y="420.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Temperature mode, set 100–110 °C</text><text x="35.0" y="439.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">(open bearings ≤ 120 °C, sealed ≤ 80 °C)</text><text x="35.0" y="458.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">ΔT = (U_max + s)/(α·d)</text><text x="35.0" y="477.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">  = (17 + 10) µm / (12.5e-6 · 25 mm)</text><text x="35.0" y="496.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">  = 86 K → 20 + 86 ≈ 106 °C</text><text x="35.0" y="515.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Auto demagnetise at the end</text><text x="35.0" y="534.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Push on in one move, hold to shoulder</text><text x="35.0" y="553.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Check gap ≤ 0.02 mm after cooling</text><text x="35.0" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">then re-tighten the KM nut</text><rect x="360.0" y="50.0" width="410.0" height="560.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="360.0" y="50.0" width="237.4" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="365.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">B  Pressing – force path (19.5)</text><rect x="450.0" y="150.0" width="60.0" height="240.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><text x="480.0" y="405.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">shaft Ø25 k5</text><rect x="420.0" y="290.0" width="30.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><rect x="510.0" y="290.0" width="30.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><rect x="381.0" y="290.0" width="25.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><rect x="554.0" y="290.0" width="25.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><circle cx="413.0" cy="305.0" r="6.0" fill="none" stroke="#000" stroke-width="1.2"/><circle cx="547.0" cy="305.0" r="6.0" fill="none" stroke="#000" stroke-width="1.2"/><rect x="420.0" y="190.0" width="30.0" height="90.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><rect x="510.0" y="190.0" width="30.0" height="90.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="415.0" y="140.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">sleeve on</text><text x="415.0" y="154.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">inner ring</text><line x1="435.0" y1="130.0" x2="435.0" y2="186.0" stroke="#1565c0" stroke-width="2.2" marker-end="url(#aa)"/><line x1="525.0" y1="130.0" x2="525.0" y2="186.0" stroke="#1565c0" stroke-width="2.2" marker-end="url(#aa)"/><text x="480.0" y="124.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0">F ≤ 3.7 kN</text><text x="480.0" y="440.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">CORRECT: force only</text><text x="480.0" y="456.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">through the fitted ring</text><rect x="654.0" y="150.0" width="36.0" height="240.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><rect x="624.0" y="290.0" width="30.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><rect x="690.0" y="290.0" width="30.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><rect x="592.0" y="290.0" width="22.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><rect x="730.0" y="290.0" width="22.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><circle cx="619.0" cy="305.0" r="6.0" fill="none" stroke="#000" stroke-width="1.2"/><circle cx="725.0" cy="305.0" r="6.0" fill="none" stroke="#000" stroke-width="1.2"/><line x1="603.0" y1="220.0" x2="603.0" y2="286.0" stroke="#000" stroke-width="2.2" marker-end="url(#ar)"/><line x1="741.0" y1="220.0" x2="741.0" y2="286.0" stroke="#000" stroke-width="2.2" marker-end="url(#ar)"/><text x="672.0" y="212.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">push on outer ring</text><line x1="632.0" y1="330.0" x2="712.0" y2="380.0" stroke="#1565c0" stroke-width="3"/><line x1="712.0" y1="330.0" x2="632.0" y2="380.0" stroke="#1565c0" stroke-width="3"/><text x="672.0" y="440.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">WRONG: force through</text><text x="672.0" y="456.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">balls → brinelling</text><text x="375.0" y="500.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Dowel Ø10 m6 in H7: F ≈ 9.6 kN max → small press</text><text x="375.0" y="519.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">(18.5), never a hammer near the wheel</text><text x="375.0" y="538.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Dismounting: pull on the tight ring only</text><rect x="780.0" y="50.0" width="350.0" height="560.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="780.0" y="50.0" width="267.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="785.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">C  Preload / friction torque checks</text><rect x="800.0" y="300.0" width="120.0" height="30.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><text x="860.0" y="348.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">J6 base (cartridge Ø80)</text><rect x="835.0" y="150.0" width="50.0" height="150.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><rect x="815.0" y="250.0" width="90.0" height="40.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="860.0" y="274.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">bearing pair</text><rect x="850.0" y="110.0" width="20.0" height="40.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><circle cx="860.0" cy="96.0" r="16.0" fill="#fff" stroke="#1565c0" stroke-width="2"/><text x="860.0" y="100.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0">T</text><text x="885.0" y="90.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">torque gauge</text><text x="885.0" y="104.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">0.25–0.50 N·m</text><text x="885.0" y="118.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">(datasheet window)</text><path d="M836,96 A24,24 0 0 1 884,96" fill="none" stroke="#1565c0" stroke-width="1.5"/><rect x="800.0" y="432.0" width="60.0" height="16.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="830.0" y="466.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">table axis</text><circle cx="830.0" cy="440.0" r="3.0" fill="#000" stroke="#000" stroke-width="1.2"/><line x1="830.0" y1="440.0" x2="1080.0" y2="440.0" stroke="#000" stroke-width="4"/><line x1="830.0" y1="480.0" x2="1080.0" y2="480.0" stroke="#000" stroke-width="0.8" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="955.0" y="496.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#000">L = 0.5 m</text><line x1="1080.0" y1="390.0" x2="1080.0" y2="436.0" stroke="#1565c0" stroke-width="2.2" marker-end="url(#aa)"/><text x="1076.0" y="384.0" font-size="12" text-anchor="end" font-weight="bold" fill="#1565c0">F = 50 N</text><text x="785.0" y="526.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">T = F · L = 50 · 0.5 = 25 N·m</text><text x="785.0" y="544.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">= catalogue bearing friction (guide 12)</text><text x="785.0" y="564.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">2 × higher → distorted ring; much lower →</text><text x="785.0" y="580.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">preload lost (transport screws too early)</text><rect x="670.0" y="666.0" width="470.0" height="64.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><line x1="670.0" y1="688.0" x2="1140.0" y2="688.0" stroke="#000" stroke-width="1.2"/><line x1="670.0" y1="709.0" x2="1140.0" y2="709.0" stroke="#000" stroke-width="1.2"/><text x="678.0" y="682.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Bearing mounting – heating, pressing, preload check</text><text x="678.0" y="703.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the maker's documentation</text><text x="678.0" y="724.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">17_bearing_mounting.svg · Guide 17 · twin example values · not to scale</text></svg>