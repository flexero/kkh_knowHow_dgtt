<text x="985.0" y="470.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">MESA-11 vs VDI 5600 vs ISA-95 Part 3:</text>
<text x="985.0" y="494.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">• MESA-11 (1997) = list of functions (what software does).</text>
<text x="985.0" y="513.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">• VDI 5600 = list of tasks + benefits (German practice).</text>
<text x="985.0" y="532.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">• ISA-95 Part 3 = activity model (4 categories × 8</text>
<text x="985.0" y="551.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">   activities) – the best checklist for a tender.</text>
<text x="985.0" y="570.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">• Use one of them as the chapter list of your MES</text>
<text x="985.0" y="589.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">   requirement specification (chapters 11.15, 30.2).</text>
<text x="985.0" y="608.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">• Twin coverage: 6 yes, 3 partly, 2 missing (labour,</text>
<text x="985.0" y="627.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">   documents) – a real MES must add them.</text>
