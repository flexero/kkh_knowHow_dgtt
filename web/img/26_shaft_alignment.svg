<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Arial, Helvetica, sans-serif">
<title>Shaft alignment offset and angle</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" markerUnits="userSpaceOnUse"><circle cx="5" cy="5" r="4" fill="#000"/></marker>
<pattern id="conc" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f2f2f2"/><circle cx="3" cy="4" r="1" fill="#888"/><circle cx="10" cy="9" r="1.3" fill="#888"/><path d="M6,11 l2,-2 l1,2 z" fill="none" stroke="#888" stroke-width="0.7"/></pattern>
<pattern id="soil" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff"/><line x1="0" y1="0" x2="0" y2="12" stroke="#888" stroke-width="1"/></pattern>
<pattern id="gravel" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#fafafa"/><circle cx="4" cy="4" r="2.2" fill="none" stroke="#777" stroke-width="0.8"/><circle cx="12" cy="9" r="2.6" fill="none" stroke="#777" stroke-width="0.8"/></pattern>
<pattern id="grout" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
<pattern id="steel" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444" stroke-width="0.8"/></pattern>
<pattern id="filler" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff6d8"/><circle cx="4" cy="4" r="1.2" fill="#b08a00"/></pattern>
<pattern id="iso" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#fff"/><path d="M0,3 q2.5,-3 5,0 t5,0" fill="none" stroke="#666" stroke-width="0.8"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="900" fill="#fff"/>
<rect x="6" y="6" width="1188" height="888" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="32.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">(a) Offset and angle at the coupling (side view, errors exaggerated)</text>
<rect x="60.0" y="110.0" width="250.0" height="100.0" rx="0" stroke="#000" stroke-width="1.4" fill="#efefef"/>
<text x="185.0" y="100.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">motor (movable)</text>
<rect x="330.0" y="90.0" width="30.0" height="140.0" rx="0" stroke="#000" stroke-width="1.2" fill="#dcdcdc"/>
<line x1="310.0" y1="156.0" x2="360.0" y2="158.0" stroke="#000" stroke-width="1"/>
<path d="M200,138.2 L345,146.9" stroke="#000" stroke-width="8" fill="none"/>
<rect x="360.0" y="90.0" width="30.0" height="140.0" rx="0" stroke="#000" stroke-width="1.2" fill="#dcdcdc"/>
<path d="M375,160 L600,160" stroke="#000" stroke-width="8" fill="none"/>
<rect x="600.0" y="105.0" width="240.0" height="110.0" rx="0" stroke="#000" stroke-width="1.4" fill="#efefef"/>
<text x="720.0" y="95.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">pump (fixed)</text>
<line x1="60.0" y1="160.0" x2="900.0" y2="160.0" stroke="#1f6fd1" stroke-width="1" stroke-dasharray="12 3 2 3"/>
<line x1="150.0" y1="134.3" x2="520.0" y2="156.5" stroke="#555" stroke-width="1" stroke-dasharray="12 3 2 3"/>
<line x1="352.0" y1="147.9" x2="352.0" y2="160.0" stroke="#000" stroke-width="0.9" marker-start="url(#sk)" marker-end="url(#ek)"/>
<text x="357.0" y="157.9" font-size="11.5" text-anchor="start" fill="#000"></text>
<line x1="355.0" y1="153.0" x2="420.0" y2="55.0" stroke="#000" stroke-width="0.8"/>
<circle cx="355.0" cy="153.0" r="2.2" stroke="#000" stroke-width="1.0" fill="#000"/>
<text x="423.0" y="59.0" font-size="11.5" text-anchor="start" fill="#000">offset = distance of the two axes</text>
<text x="423.0" y="73.0" font-size="11.5" text-anchor="start" fill="#000">at the coupling centre (mm)</text>
<line x1="250.0" y1="143.0" x2="120.0" y2="255.0" stroke="#000" stroke-width="0.8"/>
<circle cx="250.0" cy="143.0" r="2.2" stroke="#000" stroke-width="1.0" fill="#000"/>
<text x="123.0" y="259.0" font-size="11.5" text-anchor="start" fill="#000">angle = slope difference of the axes,</text>
<text x="123.0" y="273.0" font-size="11.5" text-anchor="start" fill="#000">mm per 100 mm (= gap difference / coupling Ø × 100)</text>
<text x="620.0" y="245.0" font-size="11.5" text-anchor="start" fill="#000">measured in two planes: vertical (shims) and horizontal (side jack bolts)</text>
<text x="24.0" y="330.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">(b) From offset + angle to shims under the motor feet (vertical plane)</text>
<rect x="120.0" y="390.0" width="360.0" height="80.0" rx="0" stroke="#000" stroke-width="1.4" fill="#efefef"/>
<rect x="150.0" y="470.0" width="40.0" height="18.0" rx="0" stroke="#000" stroke-width="1.2" fill="url(#steel)"/>
<rect x="410.0" y="470.0" width="40.0" height="18.0" rx="0" stroke="#000" stroke-width="1.2" fill="url(#steel)"/>
<rect x="100.0" y="488.0" width="400.0" height="14.0" rx="0" stroke="#000" stroke-width="1" fill="url(#conc)"/>
<line x1="480.0" y1="430.0" x2="600.0" y2="430.0" stroke="#000" stroke-width="6"/>
<rect x="600.0" y="410.0" width="24.0" height="40.0" rx="0" stroke="#000" stroke-width="1.2" fill="#dcdcdc"/>
<text x="612.0" y="400.0" font-size="11.5" text-anchor="middle" fill="#000">coupling</text>
<line x1="430.0" y1="488.0" x2="430.0" y2="534.0" stroke="#000" stroke-width="0.7"/>
<line x1="612.0" y1="488.0" x2="612.0" y2="534.0" stroke="#000" stroke-width="0.7"/>
<line x1="430.0" y1="530.0" x2="612.0" y2="530.0" stroke="#000" stroke-width="0.9" marker-start="url(#sk)" marker-end="url(#ek)"/>
<text x="521.0" y="526.0" font-size="11.5" text-anchor="middle" fill="#000">F: 200</text>
<line x1="170.0" y1="488.0" x2="170.0" y2="564.0" stroke="#000" stroke-width="0.7"/>
<line x1="612.0" y1="488.0" x2="612.0" y2="564.0" stroke="#000" stroke-width="0.7"/>
<line x1="170.0" y1="560.0" x2="612.0" y2="560.0" stroke="#000" stroke-width="0.9" marker-start="url(#sk)" marker-end="url(#ek)"/>
<text x="391.0" y="556.0" font-size="11.5" text-anchor="middle" fill="#000">R: 600 (from the coupling centre)</text>
<text x="160.0" y="482.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">R</text>
<text x="420.0" y="482.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">F</text>
<rect x="660.0" y="360.0" width="520.0" height="149.5" rx="3" stroke="#000" stroke-width="1.0" fill="#fff"/>
<text x="668.0" y="375.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Move the motor, never the pump (example)</text>
<text x="668.0" y="391.0" font-size="11.5" text-anchor="start" fill="#000">correction at a foot = offset + angle × distance (signs!)</text>
<text x="668.0" y="406.5" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">example: motor 0.08 mm high, angle 0.05 mm/100 (open at top)</text>
<text x="668.0" y="422.0" font-size="11.5" text-anchor="start" fill="#000">front foot F (200 mm): 0.08 + 0.0005 · 200 = 0.18 mm</text>
<text x="668.0" y="437.5" font-size="11.5" text-anchor="start" fill="#000">rear foot R (600 mm): 0.08 + 0.0005 · 600 = 0.38 mm</text>
<text x="668.0" y="453.0" font-size="11.5" text-anchor="start" fill="#000">→ remove 0.18 mm shims at F, 0.38 mm at R (both sides)</text>
<text x="668.0" y="468.5" font-size="11.5" text-anchor="start" fill="#000">then horizontal plane with the side jack bolts, then re-measure</text>
<text x="668.0" y="484.0" font-size="11.5" text-anchor="start" fill="#000">thermal growth: 11.5·10⁻⁶ · 250 mm · 40 K = 0.115 mm → set cold motor</text>
<text x="668.0" y="499.5" font-size="11.5" text-anchor="start" fill="#000">  lower by the maker's/tool's thermal offset value (example)</text>
<text x="24.0" y="600.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">(c) Laser alignment: heads on both shafts, read at 9 – 12 – 3 o'clock</text>
<circle cx="140.0" cy="720.0" r="55.0" stroke="#000" stroke-width="1.4" fill="none"/>
<circle cx="140.0" cy="720.0" r="10.0" stroke="#000" stroke-width="1.0" fill="#000"/>
<rect x="122.0" y="650.0" width="36.0" height="26.0" rx="0" stroke="#1f6fd1" stroke-width="1.4" fill="#1f6fd1"/>
<text x="140.0" y="800.0" font-size="11.5" text-anchor="middle" fill="#000">S head (stationary)</text>
<text x="68.0" y="724.0" font-size="11.5" text-anchor="middle" fill="#000" font-weight="bold">9</text>
<text x="212.0" y="724.0" font-size="11.5" text-anchor="middle" fill="#000" font-weight="bold">3</text>
<text x="110.0" y="660.0" font-size="11.5" text-anchor="middle" fill="#000" font-weight="bold">12</text>
<circle cx="330.0" cy="720.0" r="55.0" stroke="#000" stroke-width="1.4" fill="none"/>
<circle cx="330.0" cy="720.0" r="10.0" stroke="#000" stroke-width="1.0" fill="#000"/>
<rect x="312.0" y="650.0" width="36.0" height="26.0" rx="0" stroke="#1f6fd1" stroke-width="1.4" fill="#fff"/>
<text x="330.0" y="800.0" font-size="11.5" text-anchor="middle" fill="#000">M head (movable)</text>
<text x="258.0" y="724.0" font-size="11.5" text-anchor="middle" fill="#000" font-weight="bold">9</text>
<text x="402.0" y="724.0" font-size="11.5" text-anchor="middle" fill="#000" font-weight="bold">3</text>
<text x="300.0" y="660.0" font-size="11.5" text-anchor="middle" fill="#000" font-weight="bold">12</text>
<line x1="158.0" y1="663.0" x2="312.0" y2="663.0" stroke="#1f6fd1" stroke-width="1.2" stroke-dasharray="4 2" marker-start="url(#sa)" marker-end="url(#ea)"/>
<text x="235.0" y="655.0" font-size="11" text-anchor="middle" fill="#1f6fd1">laser beams</text>
<text x="24.0" y="830.0" font-size="11.5" text-anchor="start" fill="#000">turn both shafts together; the tool calculates offset, angle and foot corrections</text>
<text x="620.0" y="600.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">(d) Soft foot – check FIRST</text>
<rect x="660.0" y="680.0" width="160.0" height="60.0" rx="0" stroke="#000" stroke-width="1.3" fill="#efefef"/>
<rect x="670.0" y="740.0" width="40.0" height="14.0" rx="0" stroke="#000" stroke-width="1" fill="url(#steel)"/>
<rect x="770.0" y="746.0" width="40.0" height="8.0" rx="0" stroke="#000" stroke-width="1" fill="url(#steel)"/>
<rect x="640.0" y="754.0" width="200.0" height="12.0" rx="0" stroke="#000" stroke-width="1" fill="url(#conc)"/>
<line x1="790.0" y1="741.0" x2="790.0" y2="746.0" stroke="#1f6fd1" stroke-width="2"/>
<line x1="790.0" y1="743.0" x2="870.0" y2="700.0" stroke="#000" stroke-width="0.8"/>
<circle cx="790.0" cy="743.0" r="2.2" stroke="#000" stroke-width="1.0" fill="#000"/>
<text x="873.0" y="704.0" font-size="11.5" text-anchor="start" fill="#000">gap under one foot when</text>
<text x="873.0" y="718.0" font-size="11.5" text-anchor="start" fill="#000">its bolt is loose: ≤ 0.05 mm</text>
<text x="640.0" y="790.0" font-size="11.5" text-anchor="start" fill="#000">loosen one foot bolt at a time, measure with a feeler gauge or</text>
<text x="640.0" y="806.0" font-size="11.5" text-anchor="start" fill="#000">dial indicator; shim the gap; types: parallel, angled, induced</text>
<text x="24.0" y="856.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">App tolerances (short flexible coupling): 3000 rpm offset 0.03 / 0.07 mm,</text>
<text x="24.0" y="872.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">angle 0.04 / 0.07 mm/100 (excellent / acceptable)</text>
<rect x="628.0" y="832.0" width="560.0" height="56.0" rx="0" stroke="#000" stroke-width="1.2" fill="#fff"/>
<line x1="628.0" y1="858.0" x2="1188.0" y2="858.0" stroke="#000" stroke-width="0.8"/>
<line x1="941.6" y1="858.0" x2="941.6" y2="888.0" stroke="#000" stroke-width="0.8"/>
<text x="636.0" y="850.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Shaft alignment – offset, angle, feet, soft foot</text>
<text x="636.0" y="877.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the maker's installation manual</text>
<text x="949.6" y="870.0" font-size="11.5" text-anchor="start" fill="#000">Dwg 26-08 · guide 26 §B4, §E8</text>
<text x="949.6" y="883.0" font-size="11" text-anchor="start" fill="#000">coolant / HP pump on a common base</text>
</svg>
