ge</text><text x="330.0" y="754.0" font-size="12" text-anchor="end" fill="#000">0.5</text><text x="50.0" y="771.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">RSS = √(Σ e²)</text><text x="330.0" y="771.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000">2.7</text><text x="50.0" y="788.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">worst case Σ e</text><text x="330.0" y="788.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000">5.5</text><text x="50.0" y="805.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">target window (example)</text><text x="330.0" y="805.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000">±3 … ±5</text><text x="380.0" y="668.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Why fine positioning?</text><text x="380.0" y="686.0" font-size="12" text-anchor="start" fill="#000">The slot table holds taught absolute values; the real rack</text><text x="380.0" y="703.0" font-size="12" text-anchor="start" fill="#000">deviates (EN 15620 tolerances, floor settlement, heat).</text><text x="380.0" y="720.0" font-size="12" text-anchor="start" fill="#000">The reference sensor finds the real beam mark and the PLC</text><text x="380.0" y="737.0" font-size="12" text-anchor="start" fill="#000">corrects x / z at creep speed 0.05 m/s until |e| ≤ 3 mm.</text><text x="380.0" y="754.0" font-size="12" text-anchor="start" fill="#000">Twin: 3 s per stop (CRANE.tPos).</text>
