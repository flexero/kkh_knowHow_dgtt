<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="Arial, Helvetica, sans-serif">
<title>ISA-101 display hierarchy</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">06 – ISA-101 display hierarchy: 4 levels, 68 screens for the factory (example)</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444">Rule: from the overview to any machine faceplate in ≤ 3 clicks; the same navigation bar on every screen.</text>
<polygon points="261.2,245.0 330.0,80.0 398.8,245.0" fill="#f2f2f2" stroke="#111" stroke-width="1.4"/>
<text x="330.0" y="180.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#c0392b">L1</text>
<rect x="680.0" y="90.0" width="520.0" height="145.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="688.0" y="108.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Level 1 · Plant overview</text>
<text x="688.0" y="126.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">1 screen · SCR1_PLANT</text>
<text x="688.0" y="142.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111"></text>
<text x="688.0" y="158.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">whole factory on one wall screen (65")</text>
<text x="688.0" y="174.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">KPIs: OEE, output vs plan, alarms by line</text>
<text x="688.0" y="190.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">only deviations stand out (grey normal)</text>
<line x1="374.4" y1="162.0" x2="680.0" y2="162.0" stroke="#111" stroke-width="1.0" stroke-dasharray="4 3"/>
<polygon points="184.2,430.0 252.9,265.0 407.1,265.0 475.8,430.0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="330.0" y="365.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#c0392b">L2</text>
<text x="330.0" y="393.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">e.g. SCR2_MCH_L2</text>
<rect x="680.0" y="275.0" width="520.0" height="145.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="688.0" y="293.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Level 2 · Line / area</text>
<text x="688.0" y="311.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">5 screens · SCR2_MCH_L1 … SCR2_LOG_L0</text>
<text x="688.0" y="327.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111"></text>
<text x="688.0" y="343.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">one line: stations, buffers, AGVs</text>
<text x="688.0" y="359.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">analog indicators with limits</text>
<text x="688.0" y="375.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">used most of the shift</text>
<line x1="451.5" y1="347.0" x2="680.0" y2="347.0" stroke="#111" stroke-width="1.0" stroke-dasharray="4 3"/>
<polygon points="107.1,615.0 175.8,450.0 484.2,450.0 552.9,615.0" fill="#f2f2f2" stroke="#111" stroke-width="1.4"/>
<text x="330.0" y="550.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#c0392b">L3</text>
<text x="330.0" y="578.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">e.g. SCR3_MCH_L2_HMC02</text>
<rect x="680.0" y="460.0" width="520.0" height="145.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="688.0" y="478.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Level 3 · Machine (faceplate)</text>
<text x="688.0" y="496.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">20 screens · SCR3_MCH_L2_HMC01 …</text>
<text x="688.0" y="512.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111"></text>
<text x="688.0" y="528.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">16 stations + APC + AS/RS + 2 AGV</text>
<text x="688.0" y="544.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">values, limits, step, commands</text>
<text x="688.0" y="560.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">1-h trend of key values</text>
<line x1="528.5" y1="532.0" x2="680.0" y2="532.0" stroke="#111" stroke-width="1.0" stroke-dasharray="4 3"/>
<polygon points="30.0,800.0 98.8,635.0 561.2,635.0 630.0,800.0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="330.0" y="735.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#c0392b">L4</text>
<text x="330.0" y="763.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">e.g. SCR4_MCH_L2_HMC02_IO</text>
<rect x="680.0" y="645.0" width="520.0" height="145.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
<text x="688.0" y="663.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Level 4 · Diagnostics</text>
<text x="688.0" y="681.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">42 screens · SCR4_…_IO, _TRD …</text>
<text x="688.0" y="697.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111"></text>
<text x="688.0" y="713.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">I/O status, CNC alarms, tag list</text>
<text x="688.0" y="729.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">2 per station + 10 system screens</text>
<text x="688.0" y="745.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">maintenance and engineers</text>
<line x1="605.6" y1="717.0" x2="680.0" y2="717.0" stroke="#111" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="20.0" y="836.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Navigation: click a line on L1 → L2; click a station on L2 → L3 faceplate;</text>
<text x="20.0" y="854.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">button "Diagnostics" on the faceplate → L4. Alarm list and trends reachable from every screen.</text>
<rect x="798.0" y="826.0" width="430.0" height="62.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<line x1="798.0" y1="848.0" x2="1228.0" y2="848.0" stroke="#111" stroke-width="0.8"/>
<line x1="1048.0" y1="848.0" x2="1048.0" y2="888.0" stroke="#111" stroke-width="0.8"/>
<text x="806.0" y="842.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">EXAMPLE – check the maker's documentation</text>
<text x="806.0" y="866.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Drawing 06-02  display hierarchy</text>
<text x="806.0" y="882.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Guide 06 SCADA · V-compressor factory</text>
<text x="1056.0" y="866.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">no scale</text>
<text x="1056.0" y="882.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">rev A · 2026-11-12</text>
</svg>