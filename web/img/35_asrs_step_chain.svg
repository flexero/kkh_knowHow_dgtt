<text x="640.0" y="680.0" font-size="11.5" text-anchor="start" fill="#000">Rules used in the ladder:</text>
<text x="640.0" y="697.0" font-size="11.5" text-anchor="start" fill="#000">• SET the next step and RST the own step in ONE rung (network 7 / 8)</text>
<text x="640.0" y="714.0" font-size="11.5" text-anchor="start" fill="#000">• transition rungs in REVERSE order → never two steps in one scan</text>
<text x="640.0" y="731.0" font-size="11.5" text-anchor="start" fill="#000">• actions (outputs) written in ONE place: Q_MOVE = (S20 OR S120) AND …</text>
<text x="640.0" y="748.0" font-size="11.5" text-anchor="start" fill="#000">• every action has a time-out timer → alarm 8000 + step number</text>
<text x="640.0" y="765.0" font-size="11.5" text-anchor="start" fill="#000">• a fault stops the action, the step is KEPT → Reset + Start continues</text>
</svg>