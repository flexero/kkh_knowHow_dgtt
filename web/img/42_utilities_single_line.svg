.0" y="398.0" font-size="11" text-anchor="middle" font-weight="700">Offices,</text><text x="1081.0" y="413.0" font-size="11" text-anchor="middle" font-weight="700">IT, lights</text><text x="1081.0" y="438.0" font-size="11" text-anchor="middle">80 kW inst.</text><text x="1081.0" y="456.0" font-size="11" text-anchor="middle">g = 0.5</text><text x="1081.0" y="476.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f6fd1">40 kW</text><text x="1081.0" y="496.0" font-size="11" text-anchor="middle">demand</text><rect x="60.0" y="560.0" width="1100.0" height="130.0" fill="none" stroke="#1f6fd1" stroke-width="1"/><text x="72.0" y="584.0" font-size="12">Installed: machines 1 758 kW + infrastructure 505 kW = 2 262 kW</text><text x="72.0" y="607.0" font-size="12">Demand = Σ installed × diversity factor g (per sub-board, example) = 1 265 kW</text><text x="72.0" y="630.0" font-size="12" font-weight="700">Apparent power S = P / cos φ = 1 265 / 0.93 = 1 360 kVA → transformer 1 600 kVA (≈ 85 % load, room for growth)</text><text x="72.0" y="653.0" font-size="12">Media (not electric): compressed air ring 8 bar DN 50 · emulsion central (soft) · grinding-oil central ≤ 5 µm 20 ± 0.5 °C · chip conveyors → briquetting · quench oil + gas (HT)</text><text x="72.0" y="676.0" font-size="12">All meters + utility PLCs on the machine VLAN, Modbus TCP, polled every 10 s by the gateway (energy KPIs in the twin).</text><g><rect x="800.0" y="756.0" width="390.0" height="64.0" fill="none" stroke="#111" stroke-width="1.2"/><line x1="800.0" y1="780.0" x2="1190.0" y2="780.0" stroke="#111" stroke-width="1"/><text x="808.0" y="773.0" font-size="13" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your planner</text><text x="808.0" y="796.0" font-size="11">Ball screw + guide factory · item 3 · guide 42</text><text x="808.0" y="812.0" font-size="11" fill="#666">Drawing 42-09 · all values are examples · 2026</text></g></svg>