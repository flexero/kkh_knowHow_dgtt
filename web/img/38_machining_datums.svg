<text x="975.0" y="243.5" font-size="11.5" text-anchor="start" fill="#000">≥ 3–5 mm on pads</text>
<text x="780.0" y="270.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Why stress relief before machining?</text>
<text x="780.0" y="288.0" font-size="11.5" text-anchor="start" fill="#000">welding leaves residual stress near yield;</text>
<text x="780.0" y="306.0" font-size="11.5" text-anchor="start" fill="#000">cutting metal away releases it and the part</text>
<text x="780.0" y="324.0" font-size="11.5" text-anchor="start" fill="#000">moves → bores go out of line. Furnace</text>
<text x="780.0" y="342.0" font-size="11.5" text-anchor="start" fill="#000">580–620 °C, ≈ 2 min/mm (min 1 h), slow cool,</text>
<text x="780.0" y="360.0" font-size="11.5" text-anchor="start" fill="#000">then machine all datum features in ONE set-up.</text>
