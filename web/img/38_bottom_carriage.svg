<text x="790.0" y="80.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Data (example)</text>
<text x="790.0" y="98.0" font-size="11.5" text-anchor="start" fill="#000">S355J2+N plates EN 10025-2, 3.1 certificate</text>
<text x="790.0" y="116.0" font-size="11.5" text-anchor="start" fill="#000">flanges 420 × 15, webs 130 × 10 (inside)</text>
<text x="790.0" y="134.0" font-size="11.5" text-anchor="start" fill="#000">I = 70.1 × 10⁶ mm⁴, W = 877 × 10³ mm³</text>
<text x="790.0" y="170.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Beam check (simply supported on the wheels)</text>
<text x="790.0" y="188.0" font-size="11.5" text-anchor="start" fill="#000">M = N·a·b/L + M_foot·b/L + cabinet</text>
<text x="790.0" y="206.0" font-size="11.5" text-anchor="start" fill="#000">  = 5.41 + 16.16 + 0.34 = 21.9 kN·m</text>
<text x="790.0" y="224.0" font-size="11.5" text-anchor="start" fill="#000">  (M_foot = 18.47 kN·m emergency case)</text>
<text x="790.0" y="242.0" font-size="11.5" text-anchor="start" fill="#000">σ = 21.9 × 10⁶ / 877 × 10³ = 25 MPa</text>
<text x="790.0" y="260.0" font-size="11.5" text-anchor="start" fill="#000">deflection under the mast ≈ 0.08 mm</text>
<text x="790.0" y="296.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Make: cut → bevel → fit in jig → weld</text>
<text x="790.0" y="314.0" font-size="11.5" text-anchor="start" fill="#000">(MAG, balanced) → stress relief 580–620 °C</text>
<text x="790.0" y="332.0" font-size="11.5" text-anchor="start" fill="#000">→ machine pads + bores in one set-up</text>
<text x="790.0" y="350.0" font-size="11.5" text-anchor="start" fill="#000">→ NDT (UT butt welds, MT fillets) → paint</text>
<text x="790.0" y="368.0" font-size="11.5" text-anchor="start" fill="#000">mass ≈ 650 kg welded (frame only)</text>
<text x="790.0" y="404.0" font-size="11.5" text-anchor="start" fill="#1f6fd1" font-weight="bold">Datums</text>
<text x="790.0" y="422.0" font-size="11.5" text-anchor="start" fill="#000">A = wheel-block pad plane</text>
<text x="790.0" y="440.0" font-size="11.5" text-anchor="start" fill="#000">B = drive-wheel bore axis</text>
<text x="790.0" y="458.0" font-size="11.5" text-anchor="start" fill="#000">C = side face (rail side)</text>
