<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Timing, data age, load – drawing 43-12</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Polling timing, data age and network load – 73 machines × 3 read groups + heartbeat write (map V1.1)</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Each poll = one FC03 request + one response; heartbeat = one FC06 write of 226 + echo. Data age = poll period + round-trip time (worst case)</text><line x1="120" y1="230" x2="1040" y2="230" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><line x1="120.0" y1="225" x2="120.0" y2="235" stroke="#000" stroke-width="1.2"/><text x="120.0" y="250" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0.0 s</text><line x1="345.0" y1="225" x2="345.0" y2="235" stroke="#000" stroke-width="1.2"/><text x="345.0" y="250" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0.5 s</text><line x1="570.0" y1="225" x2="570.0" y2="235" stroke="#000" stroke-width="1.2"/><text x="570.0" y="250" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1.0 s</text><line x1="795.0" y1="225" x2="795.0" y2="235" stroke="#000" stroke-width="1.2"/><text x="795.0" y="250" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1.5 s</text><line x1="1020.0" y1="225" x2="1020.0" y2="235" stroke="#000" stroke-width="1.2"/><text x="1020.0" y="250" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">2.0 s</text><text x="24" y="126" font-size="11" text-anchor="start" font-weight="bold" fill="#000">fast 0 – 11</text><rect x="120.0" y="114" width="18" height="18" rx="1" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><rect x="345.0" y="114" width="18" height="18" rx="1" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><rect x="570.0" y="114" width="18" height="18" rx="1" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><rect x="795.0" y="114" width="18" height="18" rx="1" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="24" y="160" font-size="11" text-anchor="start" font-weight="bold" fill="#000">counters from 20</text><rect x="142.5" y="148" width="18" height="18" rx="1" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><rect x="592.5" y="148" width="18" height="18" rx="1" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="24" y="194" font-size="11" text-anchor="start" font-weight="bold" fill="#000">energy 100 – 103</text><rect x="165.0" y="182" width="18" height="18" rx="1" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="1050" y="126" font-size="11" text-anchor="start" font-weight="normal" fill="#000">every 0.5 s</text><text x="1050" y="160" font-size="11" text-anchor="start" font-weight="normal" fill="#000">every 1 s</text><text x="1050" y="194" font-size="11" text-anchor="start" font-weight="normal" fill="#000">every 10 s</text><text x="24" y="219" font-size="11" text-anchor="start" font-weight="bold" fill="#000">gw heartbeat 226</text><rect x="187.5" y="208" width="14" height="14" rx="1" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><rect x="637.5" y="208" width="14" height="14" rx="1" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="1050" y="219" font-size="11" text-anchor="start" font-weight="normal" fill="#000">every 1 s (FC06 write)</text><text x="24" y="300" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Data age of the fast block (period T = 500 ms, RTT ≈ 2 ms on a real PLC)</text><line x1="120" y1="420" x2="1040" y2="420" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><line x1="120" y1="420" x2="120" y2="320" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="114" y="330" font-size="11" text-anchor="end" font-weight="normal" fill="#000">age</text><path d="M120,414 L345.0,334 L345.0,414 L570.0,334 L570.0,414 L795.0,334 L795.0,414 L1020.0,334 L1020.0,414" stroke="#1565c0" stroke-width="2" fill="none"/><line x1="1050" y1="334" x2="1050" y2="414" stroke="#000" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#as)"/><text x="1060" y="370" font-size="11" text-anchor="start" font-weight="bold" fill="#000">max = T + RTT = 502 ms</text><text x="1060" y="386" font-size="11" text-anchor="start" font-weight="normal" fill="#000">average ≈ T / 2 + RTT</text><text x="1060" y="402" font-size="11" text-anchor="start" font-weight="normal" fill="#000">stale if &gt; 3 T + time-outs</text><rect x="24" y="460" width="620" height="26" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="30" y="478" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Group</text><text x="140" y="478" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Registers</text><text x="230" y="478" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Period</text><text x="310" y="478" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Polls / s</text><text x="400" y="478" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Wire bytes / poll</text><text x="540" y="478" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Bytes / s</text><rect x="24" y="486" width="620" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="30" y="504" font-size="12" text-anchor="start" font-weight="normal" fill="#000">fast</text><text x="140" y="504" font-size="12" text-anchor="start" font-weight="normal" fill="#000">12</text><text x="230" y="504" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0.5 s</text><text x="310" y="504" font-size="12" text-anchor="start" font-weight="normal" fill="#000">146.0</text><text x="400" y="504" font-size="12" text-anchor="start" font-weight="normal" fill="#000">201.0</text><text x="540" y="504" font-size="12" text-anchor="start" font-weight="normal" fill="#000">29 346</text><rect x="24" y="512" width="620" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="30" y="530" font-size="12" text-anchor="start" font-weight="normal" fill="#000">counters</text><text x="140" y="530" font-size="12" text-anchor="start" font-weight="normal" fill="#000">35.7</text><text x="230" y="530" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 s</text><text x="310" y="530" font-size="12" text-anchor="start" font-weight="normal" fill="#000">73.0</text><text x="400" y="530" font-size="12" text-anchor="start" font-weight="normal" fill="#000">248.4</text><text x="540" y="530" font-size="12" text-anchor="start" font-weight="normal" fill="#000">18 131</text><rect x="24" y="538" width="620" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="30" y="556" font-size="12" text-anchor="start" font-weight="normal" fill="#000">energy</text><text x="140" y="556" font-size="12" text-anchor="start" font-weight="normal" fill="#000">4</text><text x="230" y="556" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10 s</text><text x="310" y="556" font-size="12" text-anchor="start" font-weight="normal" fill="#000">7.3</text><text x="400" y="556" font-size="12" text-anchor="start" font-weight="normal" fill="#000">185.0</text><text x="540" y="556" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 350</text><rect x="24" y="564" width="620" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><rect x="24" y="590" width="620" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="30" y="582" font-size="12" text-anchor="start" font-weight="normal" fill="#000">gw heartbeat 226</text><text x="140" y="582" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 (FC06)</text><text x="230" y="582" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 s</text><text x="310" y="582" font-size="12" text-anchor="start" font-weight="normal" fill="#000">73.0</text><text x="400" y="582" font-size="12" text-anchor="start" font-weight="normal" fill="#000">180.0</text><text x="540" y="582" font-size="12" text-anchor="start" font-weight="normal" fill="#000">13 140</text><text x="30" y="608" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Total (73 machines)</text><text x="310" y="608" font-size="12" text-anchor="start" font-weight="bold" fill="#000">299.3</text><text x="540" y="608" font-size="12" text-anchor="start" font-weight="bold" fill="#000">61 968 B/s</text><text x="24" y="646" font-size="12" text-anchor="start" font-weight="bold" fill="#000">= 62.0 kB/s = 0.50 Mbit/s = 0.5 % of a 100 Mbit/s link (V1.0 without heartbeat: 226.3 /s, 48.8 kB/s, 0.39 %) – the network is never the problem.</text><text x="24" y="666" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Wire bytes per frame = max(64, ADU + 58) + 20  (58 = Ethernet 14 + IP 20 + TCP 20 + FCS 4; 20 = preamble + gap)</text><text x="24" y="684" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Fast: request 12 B → 90; response 33 B → 111 → 201 B per poll. Heartbeat FC06: 12 B → 90 + echo 12 B → 90 = 180 B. The limit is the device: answer time 2 – 20 ms,</text><text x="24" y="702" font-size="11" text-anchor="start" font-weight="normal" fill="#000">often 1 – 4 connections, one request at a time per connection → 4.1 requests/s per machine (3.1 reads + 1 heartbeat write) is easy.</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Timing, data age, load</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-12  ·  guide 43 §9.6</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
