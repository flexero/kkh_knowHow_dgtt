<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="Arial, Helvetica, sans-serif">
<title>IEC 62443 zones and conduits</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">06 – IEC 62443 zones and conduits for the factory SCADA (example target security levels SL-T)</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444">Zone = devices with the same security needs. Conduit = the only allowed path between zones, through a firewall with a rule list.</text>
<rect x="30.0" y="70.0" width="360.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="40.0" y="90.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z1 Enterprise (IT)</text>
<text x="380.0" y="90.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 1</text>
<text x="40.0" y="112.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">ERP, office PCs, e-mail, internet</text>
<text x="40.0" y="128.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">IT department owns it</text>
<rect x="440.0" y="70.0" width="360.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="450.0" y="90.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z2 Industrial DMZ</text>
<text x="790.0" y="90.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 2</text>
<text x="450.0" y="112.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">historian replica, web reports</text>
<text x="450.0" y="128.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">jump host (remote access), patch/AV</text>
<text x="450.0" y="144.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">no data path IT → OT through it</text>
<rect x="850.0" y="70.0" width="360.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="860.0" y="90.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z7 Vendor remote</text>
<text x="1200.0" y="90.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T –</text>
<text x="860.0" y="112.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">machine builders, SCADA vendor</text>
<text x="860.0" y="128.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">only via jump host, MFA, approval</text>
<rect x="30.0" y="290.0" width="560.0" height="150.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="40.0" y="310.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z3 Operations + Supervisory (L3/L2)</text>
<text x="580.0" y="310.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 2</text>
<text x="40.0" y="332.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">MES, historian, SCADA servers A/B, clients</text>
<text x="40.0" y="348.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">engineering station, OT domain, NTP, backup</text>
<text x="40.0" y="364.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">VLAN 30 + 40</text>
<text x="40.0" y="380.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">personal accounts in OT domain, roles (ch. 5.6)</text>
<text x="40.0" y="396.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">each conduit = one firewall + rule list</text>
<rect x="650.0" y="290.0" width="560.0" height="150.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="660.0" y="310.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z5 AGV / Wi-Fi</text>
<text x="1200.0" y="310.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 2</text>
<text x="660.0" y="332.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">2 AGVs, fleet manager, access points</text>
<text x="660.0" y="348.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">own SSID + VLAN, WPA3-Enterprise</text>
<text x="660.0" y="364.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">MQTT 8883 (TLS) to the broker only</text>
<rect x="30.0" y="530.0" width="226.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="40.0" y="550.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z4.1 Control L1 crankshaft</text>
<text x="246.0" y="550.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 2</text>
<text x="40.0" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">line PLC, CNC, robot</text>
<text x="40.0" y="588.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HMI panels, IO</text>
<text x="40.0" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">PROFINET inside</text>
<rect x="268.0" y="530.0" width="226.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="278.0" y="550.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z4.2 Control L2 crankcase</text>
<text x="484.0" y="550.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 2</text>
<text x="278.0" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">line PLC, CNC, robot</text>
<text x="278.0" y="588.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HMI panels, IO</text>
<text x="278.0" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">PROFINET inside</text>
<rect x="506.0" y="530.0" width="226.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="516.0" y="550.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z4.3 Control L3 cylinder</text>
<text x="722.0" y="550.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 2</text>
<text x="516.0" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">line PLC, CNC, robot</text>
<text x="516.0" y="588.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HMI panels, IO</text>
<text x="516.0" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">PROFINET inside</text>
<rect x="744.0" y="530.0" width="226.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="754.0" y="550.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z4.4 Control ASM + TST</text>
<text x="960.0" y="550.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 2</text>
<text x="754.0" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">line PLC, CNC, robot</text>
<text x="754.0" y="588.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HMI panels, IO</text>
<text x="754.0" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">PROFINET inside</text>
<rect x="982.0" y="530.0" width="226.0" height="120.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="992.0" y="550.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z4.5 Control Final + pack</text>
<text x="1198.0" y="550.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 2</text>
<text x="992.0" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">line PLC, CNC, robot</text>
<text x="992.0" y="588.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HMI panels, IO</text>
<text x="992.0" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">PROFINET inside</text>
<rect x="30.0" y="700.0" width="600.0" height="70.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="40.0" y="720.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Z6 Safety (inside each control zone)</text>
<text x="620.0" y="720.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">SL-T 3</text>
<text x="40.0" y="742.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">F-CPU, PROFIsafe devices – no conduit to any other zone</text>
<line x1="390.0" y1="130.0" x2="440.0" y2="130.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="400.0" y="107.0" width="19.2" height="18.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="402.0" y="120.0" font-size="11" text-anchor="start" font-weight="bold" fill="#c0392b">C1</text>
<line x1="850.0" y1="130.0" x2="800.0" y2="130.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="810.0" y="107.0" width="19.2" height="18.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="812.0" y="120.0" font-size="11" text-anchor="start" font-weight="bold" fill="#c0392b">C6</text>
<line x1="560.0" y1="190.0" x2="400.0" y2="290.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="486.0" y="223.0" width="19.2" height="18.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="488.0" y="236.0" font-size="11" text-anchor="start" font-weight="bold" fill="#c0392b">C2</text>
<line x1="310.0" y1="440.0" x2="310.0" y2="530.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="316.0" y="479.0" width="124.8" height="18.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="318.0" y="492.0" font-size="11" text-anchor="start" font-weight="bold" fill="#c0392b">C3 (to every line)</text>
<line x1="650.0" y1="365.0" x2="590.0" y2="365.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="604.0" y="343.0" width="19.2" height="18.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="606.0" y="356.0" font-size="11" text-anchor="start" font-weight="bold" fill="#c0392b">C4</text>
<text x="660.0" y="680.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Conduit rule list (example – deny everything else)</text>
<text x="660.0" y="702.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">C1</text>
<text x="700.0" y="702.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">IT → DMZ</text>
<text x="820.0" y="702.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HTTPS 443 to web reports / replica</text>
<text x="660.0" y="724.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">C2</text>
<text x="700.0" y="724.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">DMZ ↔ Ops</text>
<text x="820.0" y="724.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">historian replication, patch, jump host RDP</text>
<text x="660.0" y="746.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">C3</text>
<text x="700.0" y="746.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Ops → Control</text>
<text x="820.0" y="746.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">OPC UA 4840 from SCADA/MES only</text>
<text x="660.0" y="768.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">C4</text>
<text x="700.0" y="768.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">AGV → Ops</text>
<text x="820.0" y="768.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">MQTT 8883 (TLS) to broker</text>
<text x="660.0" y="790.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">C6</text>
<text x="700.0" y="790.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Vendor → DMZ</text>
<text x="820.0" y="790.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">VPN to jump host, MFA, logged</text>
<text x="30.0" y="840.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">SL-T 1 = protect against casual mistakes, 2 = intentional attack with simple means, 3 = sophisticated means,</text>
<text x="30.0" y="858.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">4 = sophisticated means with extended resources (IEC 62443-3-3). Choose SL-T from the risk assessment (IEC 62443-3-2).</text>
<rect x="798.0" y="826.0" width="430.0" height="62.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<line x1="798.0" y1="848.0" x2="1228.0" y2="848.0" stroke="#111" stroke-width="0.8"/>
<line x1="1048.0" y1="848.0" x2="1048.0" y2="888.0" stroke="#111" stroke-width="0.8"/>
<text x="806.0" y="842.0" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b">EXAMPLE – check the maker's documentation</text>
<text x="806.0" y="866.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Drawing 06-08  zones + conduits</text>
<text x="806.0" y="882.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Guide 06 SCADA · V-compressor factory</text>
<text x="1056.0" y="866.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">no scale</text>
<text x="1056.0" y="882.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">rev A · 2026-11-12</text>
</svg>