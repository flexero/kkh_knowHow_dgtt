<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Straightening – 3-point bending</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="eab" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="20.0" y="30.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Straightening of the screw shaft by 3-point bending – V-blocks, ram, dial gauge; overbend = spring-back + permanent set</text>
<text x="30.0" y="58.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">A  Press set-up (shaft Ø36, span 400 mm)</text>
<rect x="60.0" y="212.0" width="620.0" height="36.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="50.0" y1="230.0" x2="690.0" y2="230.0" stroke="#000" stroke-width="0.7" stroke-dasharray="16,4,3,4"/>
<polygon points="136.0,282.0 204.0,282.0 204.0,308.0 136.0,308.0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<polygon points="140.0,282.0 170.0,248.0 200.0,282.0" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="170.0" y="326.0" font-size="11.5" text-anchor="middle" fill="#000">V-block</text>
<polygon points="536.0,282.0 604.0,282.0 604.0,308.0 536.0,308.0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<polygon points="540.0,282.0 570.0,248.0 600.0,282.0" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="570.0" y="326.0" font-size="11.5" text-anchor="middle" fill="#000">V-block</text>
<rect x="330.0" y="90.0" width="80.0" height="90.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<polygon points="340.0,180.0 370.0,212.0 400.0,180.0" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="420.0" y="120.0" font-size="11.5" text-anchor="start" fill="#000">hydraulic ram 100 kN with prism</text>
<line x1="370.0" y1="55.0" x2="370.0" y2="88.0" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#eab)"/>
<text x="380.0" y="70.0" font-size="13" text-anchor="start" fill="#1f6fd1" font-weight="bold">F</text>
<line x1="170.0" y1="310.0" x2="170.0" y2="384.0" stroke="#000" stroke-width="0.8"/>
<line x1="570.0" y1="310.0" x2="570.0" y2="384.0" stroke="#000" stroke-width="0.8"/>
<line x1="170.0" y1="380.0" x2="570.0" y2="380.0" stroke="#000" stroke-width="1" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="370.0" y="375.0" font-size="12" text-anchor="middle" fill="#000">span L = 400 mm</text>
<circle cx="280.0" cy="300.0" r="22.0" fill="#fff" stroke="#000" stroke-width="1.3"/>
<line x1="280.0" y1="300.0" x2="291.0" y2="289.0" stroke="#1f6fd1" stroke-width="1.6"/>
<line x1="280.0" y1="278.0" x2="280.0" y2="250.0" stroke="#000" stroke-width="1.2"/>
<text x="280.0" y="340.0" font-size="11.5" text-anchor="middle" fill="#000">dial gauge 0.01 mm</text>
<path d="M60,208 Q370.0,168 680,208" fill="none" stroke="#1f6fd1" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="680.0" y="182.0" font-size="11" text-anchor="end" fill="#1f6fd1">bow before straightening (exaggerated)</text>
<text x="30.0" y="420.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">B  Bending moment</text>
<polygon points="170.0,520.0 370.0,450.0 570.0,520.0" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.4"/>
<line x1="170.0" y1="520.0" x2="570.0" y2="520.0" stroke="#000" stroke-width="1"/>
<text x="370.0" y="442.0" font-size="12" text-anchor="middle" fill="#1f6fd1" font-weight="bold">M_max = F·L/4</text>
<text x="720.0" y="58.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">C  Force – deflection under the ram</text>
<line x1="760.0" y1="360.0" x2="1140.0" y2="360.0" stroke="#000" stroke-width="1.2" marker-end="url(#ek)"/>
<line x1="760.0" y1="360.0" x2="760.0" y2="90.0" stroke="#000" stroke-width="1.2" marker-end="url(#ek)"/>
<text x="1140.0" y="394.0" font-size="11.5" text-anchor="end" fill="#000">δ (mm)</text>
<text x="766.0" y="96.0" font-size="11.5" text-anchor="start" fill="#000">F (kN)</text>
<polyline points="760.0,360.0 919.6,220.9 1051.3,151.6" fill="none" stroke="#1f6fd1" stroke-width="2.2"/>
<line x1="1051.3" y1="151.6" x2="811.9" y2="360.0" stroke="#1f6fd1" stroke-width="2" stroke-dasharray="6,4"/>
<circle cx="919.6" cy="220.9" r="3.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="913.6" y="214.9" font-size="11" text-anchor="end" fill="#000">yield start 32 kN, δy 2.52 mm</text>
<circle cx="1051.3" cy="151.6" r="3.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="1043.3" y="143.6" font-size="11" text-anchor="end" fill="#000">overbend 1.5 × F_y ≈ 48 kN</text>
<text x="798.0" y="352.0" font-size="11" text-anchor="middle" fill="#1f6fd1" font-weight="bold">set</text>
<line x1="760.0" y1="394.0" x2="811.9" y2="394.0" stroke="#000" stroke-width="1" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="786.0" y="389.0" font-size="11" text-anchor="middle" fill="#000">permanent set</text>
<text x="988.0" y="299.3" font-size="11" text-anchor="start" fill="#000">unloading = spring-back</text>
<text x="760.0" y="376.0" font-size="11" text-anchor="middle" fill="#000">0</text>
<text x="823.3" y="376.0" font-size="11" text-anchor="middle" fill="#000">1</text>
<text x="886.7" y="376.0" font-size="11" text-anchor="middle" fill="#000">2</text>
<text x="950.0" y="376.0" font-size="11" text-anchor="middle" fill="#000">3</text>
<text x="1013.3" y="376.0" font-size="11" text-anchor="middle" fill="#000">4</text>
<text x="1076.7" y="376.0" font-size="11" text-anchor="middle" fill="#000">5</text>
<text x="1140.0" y="376.0" font-size="11" text-anchor="middle" fill="#000">6</text>
<text x="754.0" y="364.0" font-size="11" text-anchor="end" fill="#000">0</text>
<text x="754.0" y="277.3" font-size="11" text-anchor="end" fill="#000">20</text>
<text x="754.0" y="190.7" font-size="11" text-anchor="end" fill="#000">40</text>
<text x="754.0" y="104.0" font-size="11" text-anchor="end" fill="#000">60</text>
<rect x="720.0" y="440.0" width="450.0" height="22.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="0.8"/>
<text x="725.0" y="456.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Formula</text>
<line x1="920.0" y1="440.0" x2="920.0" y2="462.0" stroke="#000" stroke-width="0.8"/>
<text x="925.0" y="456.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Example Ø36, σy 700 MPa (QT), L 400 mm</text>
<rect x="720.0" y="462.0" width="450.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="725.0" y="478.0" font-size="11.5" text-anchor="start" fill="#000">W = π·d³/32</text>
<line x1="920.0" y1="462.0" x2="920.0" y2="484.0" stroke="#000" stroke-width="0.8"/>
<text x="925.0" y="478.0" font-size="11.5" text-anchor="start" fill="#000">4 580 mm³</text>
<rect x="720.0" y="484.0" width="450.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="725.0" y="500.0" font-size="11.5" text-anchor="start" fill="#000">M_y = σy·W</text>
<line x1="920.0" y1="484.0" x2="920.0" y2="506.0" stroke="#000" stroke-width="0.8"/>
<text x="925.0" y="500.0" font-size="11.5" text-anchor="start" fill="#000">3.21 kN·m</text>
<rect x="720.0" y="506.0" width="450.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="725.0" y="522.0" font-size="11.5" text-anchor="start" fill="#000">F_y = 4·M_y/L</text>
<line x1="920.0" y1="506.0" x2="920.0" y2="528.0" stroke="#000" stroke-width="0.8"/>
<text x="925.0" y="522.0" font-size="11.5" text-anchor="start" fill="#000">32.1 kN (yield starts)</text>
<rect x="720.0" y="528.0" width="450.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="725.0" y="544.0" font-size="11.5" text-anchor="start" fill="#000">I = π·d⁴/64</text>
<line x1="920.0" y1="528.0" x2="920.0" y2="550.0" stroke="#000" stroke-width="0.8"/>
<text x="925.0" y="544.0" font-size="11.5" text-anchor="start" fill="#000">82 448 mm⁴</text>
<rect x="720.0" y="550.0" width="450.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="725.0" y="566.0" font-size="11.5" text-anchor="start" fill="#000">δ_y = F·L³/(48·E·I)</text>
<line x1="920.0" y1="550.0" x2="920.0" y2="572.0" stroke="#000" stroke-width="0.8"/>
<text x="925.0" y="566.0" font-size="11.5" text-anchor="start" fill="#000">2.52 mm elastic deflection</text>
<rect x="720.0" y="572.0" width="450.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="725.0" y="588.0" font-size="11.5" text-anchor="start" fill="#000">overbend</text>
<line x1="920.0" y1="572.0" x2="920.0" y2="594.0" stroke="#000" stroke-width="0.8"/>
<text x="925.0" y="588.0" font-size="11.5" text-anchor="start" fill="#000">≈ 1.5 × F_y = 48 kN → press 100 kN</text>
<rect x="720.0" y="594.0" width="450.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="725.0" y="610.0" font-size="11.5" text-anchor="start" fill="#000">hardened shaft d_r 26.4, σ 1 400</text>
<line x1="920.0" y1="594.0" x2="920.0" y2="616.0" stroke="#000" stroke-width="0.8"/>
<text x="925.0" y="610.0" font-size="11.5" text-anchor="start" fill="#000">F_y = 33.7 kN – small strokes, crack risk!</text>
<text x="30.0" y="570.0" font-size="11.5" text-anchor="start" fill="#000">Overbend = spring-back + wanted set. Measure → bend → re-measure, 3 – 6 loops.</text>
<text x="30.0" y="588.0" font-size="11.5" text-anchor="start" fill="#000">Targets: soft bar ≤ 0.10 mm/m (op 20), after hardening ≤ 0.02 mm TIR (op 70, QG-BS-3).</text>
<text x="30.0" y="606.0" font-size="11.5" text-anchor="start" fill="#000">Typical mistakes: too large stroke in the hardened case → cracks (eddy-current test 100 %);</text>
<text x="30.0" y="624.0" font-size="11.5" text-anchor="start" fill="#000">residual stress → the shaft bends again in grinding.</text>
<rect x="812.0" y="742.0" width="382.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="812.0" y1="768.0" x2="1194.0" y2="768.0" stroke="#000" stroke-width="0.8"/>
<line x1="812.0" y1="792.0" x2="1194.0" y2="792.0" stroke="#000" stroke-width="0.8"/>
<line x1="1002.0" y1="792.0" x2="1002.0" y2="824.0" stroke="#000" stroke-width="0.8"/>
<text x="820.0" y="760.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Straightening – 3-point bending</text>
<text x="820.0" y="785.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the machine maker's data</text>
<text x="820.0" y="812.0" font-size="11.5" text-anchor="start" fill="#000">Drawing 41-10</text>
<text x="1010.0" y="806.0" font-size="11" text-anchor="start" fill="#000">Scale: none</text>
<text x="1010.0" y="819.0" font-size="11" text-anchor="start" fill="#000">guide 41 §16</text>
</svg>
