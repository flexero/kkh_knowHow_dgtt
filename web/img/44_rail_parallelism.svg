ight="normal" fill="#000">· straight edge (low, at datum side C)</text><path d="M96,310 L188,310 L188,260 L180,250 L188,240 L188,222 L96,222 L96,240 L104,250 L96,260 Z" stroke="#000" stroke-width="1.6" fill="none"/><text x="142.0" y="290.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">rail 25</text><text x="142.0" y="306.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">A (bottom)</text><text x="92.0" y="286.0" font-size="11" text-anchor="end" font-weight="bold" fill="#000">C</text><path d="M80,250 L80,170 L266,170 L266,250 L200,250 L200,214 L92,214 L92,250 Z" stroke="#1565c0" stroke-width="1.8" fill="none"/><text x="216.0" y="196.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1565c0">carriage (block)</text><text x="272.0" y="230.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">D</text><text x="156.0" y="166.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">B</text><line x1="370.0" y1="310.0" x2="370.0" y2="100.0" stroke="#000" stroke-width="1.6"/><line x1="370.0" y1="100.0" x2="166.0" y2="100.0" stroke="#000" stroke-width="1.6"/><line x1="166.0" y1="100.0" x2="166.0" y2="160.0" stroke="#000" stroke-width="1.4"/><circle cx="166.0" cy="164.0" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><line x1="370.0" y1="220.0" x2="276.0" y2="220.0" stroke="#000" stroke-width="1.4"/><circle cx="271.0" cy="220.0" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="378.0" y="114.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">probe 1 on top B (reference A = granite)</text><text x="378.0" y="216.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">probe 2 on side D</text><text x="378.0" y="232.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">(reference C = straight edge)</text><text x="378.0" y="296.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">probe stand on granite</text><text x="70.0" y="400.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Rail LG-25-1000 laid / bolted on granite,</text><text x="70.0" y="418.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">datum side C against the straight edge.</text><text x="70.0" y="436.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Block moves 0 … 1 000 mm, reading every 5 mm.</text><text x="70.0" y="454.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Vertical = block top B to rail bottom A,</text><text x="70.0" y="472.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">horizontal = block side D to datum side C.</text><text x="70.0" y="490.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Compare max − min with the class value</text><text x="70.0" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">for the rail length.</text><rect x="640.0" y="100.0" width="500.0" height="330.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><line x1="640.0" y1="430.0" x2="1140.0" y2="430.0" stroke="#000" stroke-width="0.3" stroke-dasharray="2 3"/><text x="635.0" y="434.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">0</text><line x1="640.0" y1="388.8" x2="1140.0" y2="388.8" stroke="#000" stroke-width="0.3" stroke-dasharray="2 3"/><text x="635.0" y="392.8" font-size="11" text-anchor="end" font-weight="normal" fill="#000">5</text><line x1="640.0" y1="347.5" x2="1140.0" y2="347.5" stroke="#000" stroke-width="0.3" stroke-dasharray="2 3"/><text x="635.0" y="351.5" font-size="11" text-anchor="end" font-weight="normal" fill="#000">10</text><line x1="640.0" y1="306.2" x2="1140.0" y2="306.2" stroke="#000" stroke-width="0.3" stroke-dasharray="2 3"/><text x="635.0" y="310.2" font-size="11" text-anchor="end" font-weight="normal" fill="#000">15</text><line x1="640.0" y1="265.0" x2="1140.0" y2="265.0" stroke="#000" stroke-width="0.3" st