238.57142857142858,152 1100,152" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="190" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">M_RUN</text><polyline points="200,196 219.28571428571428,196 219.28571428571428,171.8 1100,171.8" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="234" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">KM1</text><polyline points="200,240 219.28571428571428,240 219.28571428571428,215.8 1100,215.8" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="278" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">KM1_FB</text><polyline points="200,284 221.85714285714286,284 221.85714285714286,259.8 1100,259.8" fill="none" stroke="#777" stroke-width="2" stroke-linejoin="round"/><text x="190" y="322" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">KM3 (star)</text><polyline points="200,328 219.28571428571428,328 219.28571428571428,303.8 544.5714285714287,303.8 544.5714285714287,328 1100,328" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="366" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">KM3_FB</text><polyline points="200,372 221.85714285714286,372 221.85714285714286,347.8 547.1428571428572,347.8 547.1428571428572,372 1100,372" fill="none" stroke="#777" stroke-width="2" stroke-linejoin="round"/><text x="190" y="410" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">M_GAP</text><polyline points="200,416 553.5714285714287,416 553.5714285714287,391.8 1100,391.8" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="454" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">KM2 (delta)</text><polyline points="200,460 553.5714285714287,460 553.5714285714287,435.8 1100,435.8" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="498" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">KM2_FB</text><polyline points="200,504 556.1428571428571,504 556.1428571428571,479.8 1100,479.8" fill="none" stroke="#777" stroke-width="2" stroke-linejoin="round"/><text x="190" y="542" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">M_PUMP</text><polyline points="200,548 556.1428571428571,548 556.1428571428571,523.8 1100,523.8" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/><text x="190" y="586" font-size="11.5" text-anchor="end" fill="#000" font-weight="bold">Y_0V5 (load)</text><polyline points="200,592 556.1428571428571,592 556.1428571428571,567.8 1048.5714285714284,567.8 1048.5714285714284,592 1100,592" fill="none" stroke="#1c7c3a" stroke-width="2" stroke-linejoin="round"/><line x1="219.28571428571428" y1="104" x2="219.28571428571428" y2="602" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="4 3"/><text x="222.28571428571428" y="100" font-size="10" text-anchor="start" fill="#0b5ea8">start</text><line x1="544.5714285714287" y1="91" x2="544.5714285714287" y2="602" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="4 3"/><text x="547.5714285714287" y="87" font-size="10" text-anchor="start" fill="#0b5ea8">T_YD 5.0 s</text><line x1="553.5714285714287" y1="104" x2="553.5714285714287" y2="602" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="4 3"/><text x="556.5714285714287" y="100" font-size="10" text-anchor="start" fill="#0b5ea8">gap 0.1 s</text><line x1="1048.5714285714284" y1="91" x2="1048.5714285714284" y2="602" stroke="#0b5ea8" stroke-width="1" stroke-dasharray="4 3"/><text x="1051.5714285714284" y="87" font-size="10" text-anchor="start" fill="#0b5ea8">11.5 MPa</text><text x="30" y="634" font-size="11.5" text-anchor="start" fill="#000">Reading (live simulation, scan 20 ms, contactor delay 30 ms = 2 scans): KM1_FB at +0.04 s, star timer 5.0 s → KM3 off at +5.06 s, KM3_FB off +5.10 s,</text><text x="30" y="652" font-size="11.5" text-anchor="start" fill="#000">T_GAP 0.1 s → KM2 at +5.20 s. Loading starts with M_PUMP (KM1_FB · KM2_FB · NOT KM3_FB) at +5.24 s. From 0 MPa: the lines fill to the pre-charge 8.99 MPa</text><text x="30" y="670" font-size="11.5" text-anchor="start" fill="#000">in &lt; 0.1 s, then the 4 L accumulator takes 0.64 L up to 11.5 MPa → 7.7 s with ≈ 5.2 L/min net (gas law, n = 1.4). Ready: ≥ 10.7 MPa for 1 s and oil ≥ 20 °C.</text><text x="30" y="688" font-size="11.5" text-anchor="start" fill="#000">Timer accuracy: a TON with PT 5 s finishes in the first scan after 5 s → 5.00 … 5.02 s at 20 ms scan. Delta TMR (100 ms base): ± 0.1 s.</text><rect x="770" y="760" width="420" height="60" fill="#fff" stroke="#000" stroke-width="1"/><line x1="770" y1="782" x2="1190" y2="782" stroke="#000" stroke-width="0.8"/><text x="778" y="776" font-size="12" font-weight="bold">Timing – star-delta start + loading</text><text x="778" y="798" font-size="10.5">program 1, networks 4–9 · simulated values</text><text x="778" y="813" font-size="10.5" fill="#0b5ea8">Guide 37 · page 4 · EXAMPLE – check with your PLC configuration</text></svg>
