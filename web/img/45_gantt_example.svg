<text x="40" y="152" font-size="14" text-anchor="start" font-weight="700" fill="#000">EDD (earliest due date)</text>
<rect x="200.0" y="130" width="210.25" height="34" fill="#1f6fd1" stroke="#000" stroke-width="1.4"/>
<rect x="200.0" y="130" width="65.25" height="34" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<text x="271.25" y="152" font-size="13" text-anchor="start" font-weight="700" fill="#fff">X1  set-up 45</text>
<rect x="410.25" y="130" width="210.25" height="34" fill="#fff" stroke="#000" stroke-width="1.4"/>
<rect x="410.25" y="130" width="65.25" height="34" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<text x="481.5" y="152" font-size="13" text-anchor="start" font-weight="700" fill="#000">Y1  set-up 45</text>
<rect x="620.5" y="130" width="210.25" height="34" fill="#1f6fd1" stroke="#000" stroke-width="1.4"/>
<rect x="620.5" y="130" width="65.25" height="34" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<text x="691.75" y="152" font-size="13" text-anchor="start" font-weight="700" fill="#fff">X2  set-up 45</text>
<rect x="830.75" y="130" width="210.25" height="34" fill="#fff" stroke="#000" stroke-width="1.4"/>
<rect x="830.75" y="130" width="65.25" height="34" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<text x="902.0" y="152" font-size="13" text-anchor="start" font-weight="700" fill="#000">Y2  set-up 45</text>
<text x="1049.0" y="152" font-size="13" text-anchor="start" font-weight="700" fill="#1f6fd1">makespan 580 min</text>
<text x="40" y="342" font-size="14" text-anchor="start" font-weight="700" fill="#000">FAM (keep the family)</text>
<rect x="200.0" y="320" width="210.25" height="34" fill="#1f6fd1" stroke="#000" stroke-width="1.4"/>
<rect x="200.0" y="320" width="65.25" height="34" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<text x="271.25" y="342" font-size="13" text-anchor="start" font-weight="700" fill="#fff">X1  set-up 45</text>
<rect x="410.25" y="320" width="166.75" height="34" fill="#1f6fd1" stroke="#000" stroke-width="1.4"/>
<rect x="410.25" y="320" width="21.75" height="34" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<text x="438.0" y="342" font-size="13" text-anchor="start" font-weight="700" fill="#fff">X2  set-up 15</text>
<rect x="577.0" y="320" width="210.25" height="34" fill="#fff" stroke="#000" stroke-width="1.4"/>
<rect x="577.0" y="320" width="65.25" height="34" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<text x="648.25" y="342" font-size="13" text-anchor="start" font-weight="700" fill="#000">Y1  set-up 45</text>
<rect x="787.25" y="320" width="166.75" height="34" fill="#fff" stroke="#000" stroke-width="1.4"/>
<rect x="787.25" y="320" width="21.75" height="34" fill="url(#hatch)" stroke="#000" stroke-width="1.4"/>
<text x="815.0" y="342" font-size="13" text-anchor="start" font-weight="700" fill="#000">Y2  set-up 15</text>
<text x="962.0" y="342" font-size="13" text-anchor="start" font-weight="700" fill="#1f6fd1">makespan 520 min</text>
<line x1="200.0" y1="110" x2="200.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="200.0" y="104" font-size="11" text-anchor="middle" fill="#000">0</text>
<line x1="287.0" y1="110" x2="287.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="287.0" y="104" font-size="11" text-anchor="middle" fill="#000">60</text>
<line x1="374.0" y1="110" x2="374.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="374.0" y="104" font-size="11" text-anchor="middle" fill="#000">120</text>
<line x1="461.0" y1="110" x2="461.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="461.0" y="104" font-size="11" text-anchor="middle" fill="#000">180</text>
<line x1="548.0" y1="110" x2="548.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="548.0" y="104" font-size="11" text-anchor="middle" fill="#000">240</text>
<line x1="635.0" y1="110" x2="635.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="635.0" y="104" font-size="11" text-anchor="middle" fill="#000">300</text>
<line x1="722.0" y1="110" x2="722.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="722.0" y="104" font-size="11" text-anchor="middle" fill="#000">360</text>
<line x1="809.0" y1="110" x2="809.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="809.0" y="104" font-size="11" text-anchor="middle" fill="#000">420</text>
<line x1="896.0" y1="110" x2="896.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="896.0" y="104" font-size="11" text-anchor="middle" fill="#000">480</text>
<line x1="983.0" y1="110" x2="983.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="983.0" y="104" font-size="11" text-anchor="middle" fill="#000">540</text>
<line x1="1070.0" y1="110" x2="1070.0" y2="380" stroke="#000" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="1070.0" y="104" font-size="11" text-anchor="middle" fill="#000">600</text>
<text x="1080.0" y="104" font-size="11" text-anchor="start" fill="#000">min</text>
<rect x="200" y="420" width="30" height="20" fill="url(#hatch)" stroke="#000"/>
<text x="240" y="435" font-size="12" text-anchor="start" fill="#000">set-up (hatched): full 45 min when the family changes, 15 min inside the family (same lead / size)</text>
<rect x="200" y="452" width="30" height="20" fill="#1f6fd1" stroke="#000"/>
<text x="240" y="467" font-size="12" text-anchor="start" fill="#000">family X (Ø32 × 10)        </text>
<rect x="420" y="452" width="30" height="20" fill="#fff" stroke="#000"/>
<text x="460" y="467" font-size="12" text-anchor="start" fill="#000">family Y (Ø32 × 20)</text>
<text x="40" y="520" font-size="13" text-anchor="start" fill="#000">Data: 4 lots X1 (due 100), Y1 (200), X2 (300), Y2 (400) min, 100 min run each, one machine.</text>
<text x="40" y="542" font-size="13" text-anchor="start" fill="#000">EDD: X1 Y1 X2 Y2 → 4 full set-ups → 4 × 45 + 400 = 580 min.</text>
<text x="40" y="564" font-size="13" text-anchor="start" fill="#000">FAM: after X1 the machine has family X → X2 first (15 min) → Y1 (45) → Y2 (15) → 45 + 15 + 45 + 15 + 400 = 520 min.</text>
<text x="40" y="586" font-size="13" text-anchor="start" fill="#000">Price of FAM: Y1 finishes later (405 instead of 290 min) → it can become late. The MES shows both KPIs (on time %, set-ups).</text>
<text x="40" y="608" font-size="13" text-anchor="start" fill="#000">In the plant: 8 thread grinders, families = screw Ø × lead (wheel profile + dresser). Same numbers are in the self-check &amp;bf6test.</text>
<rect x="770" y="766" width="406" height="48" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="770" y1="790" x2="1176" y2="790" stroke="#000" stroke-width="1"/>
<text x="778" y="783" font-size="12" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your MES team</text>
<text x="778" y="807" font-size="11" fill="#000">Ball screw + guide factory · item 6 MES · guide 45 · 45_gantt_example.svg</text>
</svg>
