<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Mast deflection under acceleration – cantilever model</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="30.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#000">Model: mast = cantilever clamped in the bottom frame; inertia forces act opposite to the acceleration a</text>
<rect x="290.0" y="740.0" width="260.0" height="26.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="784.0" font-size="11.5" text-anchor="middle" fill="#000">bottom frame (clamp)</text>
<rect x="380.0" y="140.0" width="40.0" height="600.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="1.4"/>
<polyline points="400.0,740.0 400.1,720.0 400.6,700.0 401.3,680.0 402.2,660.0 403.4,640.0 404.9,620.0 406.5,600.0 408.4,580.0 410.4,560.0 412.7,540.0 415.1,520.0 417.6,500.0 420.3,480.0 423.2,460.0 426.2,440.0 429.3,420.0 432.5,400.0 435.8,380.0 439.2,360.0 442.6,340.0 446.2,320.0 449.8,300.0 453.4,280.0 457.2,260.0 460.9,240.0 464.7,220.0 468.5,200.0 472.3,180.0 476.2,160.0 480.0,140.0" fill="none" stroke="#1f6fd1" stroke-width="2.0" stroke-dasharray="7 4"/>
<text x="370.0" y="132.0" font-size="11.5" text-anchor="end" fill="#1f6fd1">deflected axis (exaggerated, dashed)</text>
<line x1="310.0" y1="710.0" x2="376.0" y2="710.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="653.0" x2="376.0" y2="653.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="596.0" x2="376.0" y2="596.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="539.0" x2="376.0" y2="539.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="482.0" x2="376.0" y2="482.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="425.0" x2="376.0" y2="425.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="368.0" x2="376.0" y2="368.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="311.0" x2="376.0" y2="311.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="254.0" x2="376.0" y2="254.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<line x1="310.0" y1="197.0" x2="376.0" y2="197.0" stroke="#000" stroke-width="1.0" marker-end="url(#ek)"/>
<text x="304.0" y="440.0" font-size="12" text-anchor="end" font-weight="bold" fill="#000">q = m_mast·a / H</text>
<line x1="260.0" y1="223.9" x2="376.0" y2="223.9" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#ea)"/>
<text x="254.0" y="217.9" font-size="12" text-anchor="end" font-weight="bold" fill="#1f6fd1">P = (m_carr + m_load)·a</text>
<line x1="424.0" y1="740.0" x2="540.0" y2="740.0" stroke="#555" stroke-width="0.6"/>
<line x1="424.0" y1="223.9" x2="480.0" y2="223.9" stroke="#555" stroke-width="0.6"/>
<line x1="424.0" y1="140.0" x2="540.0" y2="140.0" stroke="#555" stroke-width="0.6"/>
<line x1="475.0" y1="740.0" x2="475.0" y2="223.9" stroke="#000" stroke-width="0.9" marker-start="url(#sk)" marker-end="url(#ek)"/>
<text x="481.0" y="481.9" font-size="11.5" text-anchor="middle" fill="#000" transform="rotate(-90 481.0 481.9)">h = 8.0 m</text>
<line x1="530.0" y1="740.0" x2="530.0" y2="140.0" stroke="#000" stroke-width="0.9" marker-start="url(#sk)" marker-end="url(#ek)"/>
<text x="536.0" y="440.0" font-size="11.5" text-anchor="middle" fill="#000" transform="rotate(-90 536.0 440.0)">H = 9.3 m</text>
<line x1="580.0" y1="720.0" x2="670.0" y2="720.0" stroke="#000" stroke-width="1.8" marker-end="url(#ek)"/>
<text x="680.0" y="724.0" font-size="11.5" text-anchor="start" fill="#000">travel acceleration a = 0.5 m/s²</text>
<text x="600.0" y="110.0" font-size="11.5" text-anchor="start" fill="#000">Section: welded box 500 × 350 × 6 mm (bending about the 500 depth)</text>
<text x="600.0" y="129.0" font-size="11.5" text-anchor="start" fill="#000">I = (350·500³ − 338·488³)/12 = 372.5 × 10⁶ mm⁴ ; E = 210 000 N/mm²</text>
<text x="600.0" y="148.0" font-size="11.5" text-anchor="start" fill="#000"></text>
<text x="600.0" y="167.0" font-size="11.5" text-anchor="start" fill="#000">q = 1 000 kg × 0.5 / 9 300 mm = 0.0538 N/mm</text>
<text x="600.0" y="186.0" font-size="11.5" text-anchor="start" fill="#000">δ_q = q·H⁴/(8·E·I) = 0.0538 × 9 300⁴ / (8 × 210 000 × 372.5·10⁶) = 0.64 mm</text>
<text x="600.0" y="205.0" font-size="11.5" text-anchor="start" fill="#000"></text>
<text x="600.0" y="224.0" font-size="11.5" text-anchor="start" fill="#000">P = (600 + 300) × 0.5 = 450 N at h = 8 000 mm</text>
<text x="600.0" y="243.0" font-size="11.5" text-anchor="start" fill="#000">δ_P = P·h²·(3H − h)/(6·E·I) = 450 × 8 000² × 19 900 / (6 E I) = 1.22 mm</text>
<text x="600.0" y="262.0" font-size="11.5" text-anchor="start" fill="#000"></text>
<text x="600.0" y="281.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f6fd1">static top deflection δ = 0.64 + 1.22 = 1.86 mm</text>
<text x="600.0" y="300.0" font-size="11.5" text-anchor="start" fill="#000">sudden start / stop (no jerk limit): dynamic factor ≈ 2 → ≈ 3.7 mm</text>
<text x="600.0" y="319.0" font-size="11.5" text-anchor="start" fill="#000"></text>
<text x="600.0" y="338.0" font-size="11.5" text-anchor="start" fill="#000">stiffness k = 3·E·I/H³ = 292 kN/m (at the top)</text>
<text x="600.0" y="357.0" font-size="11.5" text-anchor="start" fill="#000">m_eq = 0.24 × 1 000 + 900 = 1 140 kg</text>
<text x="600.0" y="376.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f6fd1">f₁ = √(k/m_eq) / 2π = √(291 727 / 1 140) / 2π = 2.55 Hz</text>
<text x="600.0" y="395.0" font-size="11.5" text-anchor="start" fill="#000"></text>
<text x="600.0" y="414.0" font-size="11.5" text-anchor="start" fill="#000">What it means: after each stop the mast swings with ≈ 2.5 Hz;</text>
<text x="600.0" y="433.0" font-size="11.5" text-anchor="start" fill="#000">jerk-limited (S-curve) moves and sway damping in the drive</text>
<text x="600.0" y="452.0" font-size="11.5" text-anchor="start" fill="#000">keep the residual amplitude at the fork &lt; ± 2 mm within the</text>
<text x="600.0" y="471.0" font-size="11.5" text-anchor="start" fill="#000">3 s fine-positioning time (budget, guide 31 §9).</text>
<rect x="774" y="764" width="414" height="54" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="774" y1="786" x2="1188" y2="786" stroke="#000" stroke-width="0.8"/><text x="782" y="780" font-size="12" font-weight="bold" fill="#000">Mast deflection under acceleration – cantilever model</text><text x="782" y="801" font-size="11.5" font-weight="bold" fill="#b00000">EXAMPLE – check the AS/RS supplier's documentation</text><text x="782" y="814" font-size="11" fill="#000">Digital twin · ASRS-RAW · guide 31 · dimensions in mm unless stated</text>
</svg>
