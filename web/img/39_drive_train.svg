<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<title>Drive train – motor to tine, speeds, torques, forces</title>
<defs>
<marker id="ek" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#000"/></marker>
<marker id="sk" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#000"/></marker>
<marker id="ea" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 Z" fill="#1f6fd1"/></marker>
<marker id="sa" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,1.5 L0,5 L10,8.5 Z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1"/></pattern>
<pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eaf1fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f6fd1" stroke-width="0.9"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="32.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Gear motor → hollow-shaft gearbox → synchronising shaft → 2 pinions → racks on the middle stages → chains → tines</text>
<rect x="40.0" y="70.0" width="205.0" height="150.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="142.0" y="92.0" font-size="12.5" text-anchor="middle" fill="#000" font-weight="bold">Motor 1.1 kW, 4-pole</text>
<text x="50.0" y="120.0" font-size="12" text-anchor="start" fill="#000">+ brake (holds the fork)</text>
<text x="50.0" y="142.0" font-size="12" text-anchor="start" fill="#000">+ encoder 4 096 counts</text>
<text x="50.0" y="164.0" font-size="12" text-anchor="start" fill="#000">n = 1 400 rpm</text>
<text x="50.0" y="186.0" font-size="12" text-anchor="start" fill="#000">M = 6.49 N·m (rated 7.50)</text>
<rect x="270.0" y="70.0" width="205.0" height="150.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="372.0" y="92.0" font-size="12.5" text-anchor="middle" fill="#000" font-weight="bold">Helical-bevel gearbox</text>
<text x="280.0" y="120.0" font-size="12" text-anchor="start" fill="#000">hollow shaft</text>
<text x="280.0" y="142.0" font-size="12" text-anchor="start" fill="#000">i = 1 400 / 238.7 = 5.86</text>
<text x="280.0" y="164.0" font-size="12" text-anchor="start" fill="#000">η ≈ 0.9 (gear)</text>
<text x="280.0" y="186.0" font-size="12" text-anchor="start" fill="#000">out: 238.7 rpm</text>
<rect x="500.0" y="70.0" width="205.0" height="150.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="602.0" y="92.0" font-size="12.5" text-anchor="middle" fill="#000" font-weight="bold">2 synchronising shafts</text>
<text x="510.0" y="120.0" font-size="12" text-anchor="start" fill="#000">Ø30, coupled by a chain</text>
<text x="510.0" y="142.0" font-size="12" text-anchor="start" fill="#000">M = 30.4 N·m (total)</text>
<text x="510.0" y="164.0" font-size="12" text-anchor="start" fill="#000">keep both tines</text>
<text x="510.0" y="186.0" font-size="12" text-anchor="start" fill="#000">at the same position</text>
<rect x="730.0" y="70.0" width="205.0" height="150.0" rx="0" fill="#fff" stroke="#1f6fd1" stroke-width="1.5"/>
<text x="832.0" y="92.0" font-size="12.5" text-anchor="middle" fill="#000" font-weight="bold">4 pinions m 2, z 20</text>
<text x="740.0" y="120.0" font-size="12" text-anchor="start" fill="#000">d = 40 mm, 2 per tine</text>
<text x="740.0" y="142.0" font-size="12" text-anchor="start" fill="#000">≤ 15.2 N·m per tine</text>
<text x="740.0" y="164.0" font-size="12" text-anchor="start" fill="#000">v = π·d·n/60</text>
<text x="740.0" y="186.0" font-size="12" text-anchor="start" fill="#000">= 0.50 m/s</text>
<rect x="960.0" y="70.0" width="205.0" height="150.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="1062.0" y="92.0" font-size="12.5" text-anchor="middle" fill="#000" font-weight="bold">Racks + chains</text>
<text x="970.0" y="120.0" font-size="12" text-anchor="start" fill="#000">rack force 1 521 N (2 racks)</text>
<text x="970.0" y="142.0" font-size="12" text-anchor="start" fill="#000">middle stage 0.50 m/s</text>
<text x="970.0" y="164.0" font-size="12" text-anchor="start" fill="#000">chains double: tine 1.0 m/s</text>
<text x="970.0" y="186.0" font-size="12" text-anchor="start" fill="#000">F_top = 761 N</text>
<line x1="245.0" y1="145.0" x2="270.0" y2="145.0" stroke="#1f6fd1" stroke-width="2.5" marker-end="url(#ea)"/>
<line x1="475.0" y1="145.0" x2="500.0" y2="145.0" stroke="#1f6fd1" stroke-width="2.5" marker-end="url(#ea)"/>
<line x1="705.0" y1="145.0" x2="730.0" y2="145.0" stroke="#1f6fd1" stroke-width="2.5" marker-end="url(#ea)"/>
<line x1="935.0" y1="145.0" x2="960.0" y2="145.0" stroke="#1f6fd1" stroke-width="2.5" marker-end="url(#ea)"/>
<text x="24.0" y="270.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Plan view of the carriage (from above): one motor drives both tines – 2 pinions per tine, coupled</text>
<rect x="160.0" y="300.0" width="760.0" height="300.0" rx="0" fill="#fff" stroke="#777" stroke-width="1" stroke-dasharray="6 4"/>
<text x="170.0" y="318.0" font-size="12" text-anchor="start" fill="#777">lifting carriage</text>
<rect x="200.0" y="338.0" width="680.0" height="44.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="890.0" y="364.0" font-size="12" text-anchor="start" fill="#000">tine</text>
<rect x="410.0" y="354.0" width="40.0" height="12.0" rx="0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="630.0" y="354.0" width="40.0" height="12.0" rx="0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="200.0" y="518.0" width="680.0" height="44.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
<text x="890.0" y="544.0" font-size="12" text-anchor="start" fill="#000">tine</text>
<rect x="410.0" y="534.0" width="40.0" height="12.0" rx="0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<rect x="630.0" y="534.0" width="40.0" height="12.0" rx="0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.2"/>
<text x="676.0" y="336.0" font-size="12" text-anchor="start" fill="#1f6fd1">pinion on rack (2 per tine, ± 300)</text>
<rect x="422.0" y="360.0" width="16.0" height="180.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<rect x="642.0" y="360.0" width="16.0" height="180.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="416.0" y="400.0" font-size="12" text-anchor="end" fill="#000">shaft 1</text>
<text x="664.0" y="400.0" font-size="12" text-anchor="start" fill="#000">shaft 2</text>
<rect x="430.0" y="488.0" width="220.0" height="12.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="540.0" y="516.0" font-size="11.5" text-anchor="middle" fill="#000">coupling chain (same direction)</text>
<rect x="390.0" y="425.0" width="80.0" height="46.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="430.0" y="452.0" font-size="11.5" text-anchor="middle" fill="#000">gearbox</text>
<rect x="470.0" y="432.0" width="150.0" height="32.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="545.0" y="453.0" font-size="11.5" text-anchor="middle" fill="#000">motor + brake + enc.</text>
<line x1="140.0" y1="360.0" x2="140.0" y2="540.0" stroke="#000" stroke-width="1" marker-end="url(#ek)" marker-start="url(#sk)"/>
<text x="134.0" y="454.0" font-size="11.5" text-anchor="end" fill="#000">500 (tines ± 250)</text>
<text x="170.0" y="590.0" font-size="11.5" text-anchor="start" fill="#000">Why 2 pinions: rack = stage length 1 000 mm, middle stroke 675 mm &gt; 500 mm → one central pinion would run off the rack.</text>
<text x="940.0" y="300.0" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">Same power everywhere:</text>
<text x="940.0" y="328.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">tine</text>
<text x="990.0" y="328.0" font-size="12" text-anchor="start" fill="#000">761 N × 1.0 m/s</text>
<text x="990.0" y="340.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1180.0" y="328.0" font-size="12" text-anchor="end" fill="#1f6fd1">761 W</text>
<text x="940.0" y="352.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">rack</text>
<text x="990.0" y="352.0" font-size="12" text-anchor="start" fill="#000">1 521 N × 0.5 m/s</text>
<text x="990.0" y="364.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1180.0" y="352.0" font-size="12" text-anchor="end" fill="#1f6fd1">761 W</text>
<text x="940.0" y="376.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">shaft</text>
<text x="990.0" y="376.0" font-size="12" text-anchor="start" fill="#000">30.4 N·m × 25.0 rad/s</text>
<text x="990.0" y="388.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1180.0" y="376.0" font-size="12" text-anchor="end" fill="#1f6fd1">761 W</text>
<text x="940.0" y="400.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">motor</text>
<text x="990.0" y="400.0" font-size="12" text-anchor="start" fill="#000">761 / 0.8</text>
<text x="990.0" y="412.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="1180.0" y="400.0" font-size="12" text-anchor="end" fill="#1f6fd1">951 W → 1.1 kW</text>
<text x="24.0" y="640.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Formulas (example values)</text>
<text x="24.0" y="664.0" font-size="12" text-anchor="start" fill="#000">F_top = m·a + μ·m·g = 450 × 1.2 + 0.05 × 450 × 9.81 = 761 N   (m = 300 kg load + 150 kg fork allowance, guide 31 §7.8)</text>
<text x="24.0" y="686.0" font-size="12" text-anchor="start" fill="#000">n_pinion = v_mid · 60 / (π · d) = 0.5 × 60 / (π × 0.040) = 238.7 rpm;   i = 1 400 / 238.7 = 5.86 (take the nearest catalogue ratio)</text>
<text x="24.0" y="708.0" font-size="12" text-anchor="start" fill="#000">M_shaft = F_rack · d/2 = 1 521 × 0.020 = 30.4 N·m;   M_motor = 30.4 / (5.86 × 0.8) = 6.49 N·m ≤ 7.50 N·m (1.1 kW at 1 400 rpm)</text>
<text x="24.0" y="730.0" font-size="12" text-anchor="start" fill="#000">Servo version: 3 000 rpm motor, i ≈ 12.6 – better dynamics + absolute encoder; asynchronous + inverter + encoder is common and cheaper.</text>
<rect x="774" y="752" width="414" height="66" fill="#fff" stroke="#000" stroke-width="1.2"/>
<line x1="774" y1="774" x2="1188" y2="774" stroke="#000" stroke-width="0.8"/><line x1="844" y1="752" x2="844" y2="774" stroke="#000" stroke-width="0.8"/>
<text x="782" y="768" font-size="12.5" fill="#000" font-weight="bold">39-03</text>
<text x="852" y="768" font-size="12" fill="#000" font-weight="bold">Drive train – motor to tine, speeds, torques, forces</text>
<text x="782" y="791" font-size="12" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the fork maker's documentation</text>
<text x="782" y="809" font-size="11" fill="#000">Digital twin · ASRS-RAW telescopic fork · guide 39 · not to scale · mm</text>
</svg>
