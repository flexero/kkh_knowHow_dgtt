<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>NCR / 8D workflow – drawing 44-12</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.6"/></pattern></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24.0" y="36.0" font-size="20" text-anchor="start" font-weight="bold" fill="#000">NCR / 8D workflow – example: v_300 too high on screws ground on BS-TGR-03</text><text x="24.0" y="58.0" font-size="13" text-anchor="start" font-weight="normal" fill="#000">12 of 40 C5 screws with v_300 = 19 – 23 µm (limit 18 µm), night shift only, only BS-TGR-03</text><rect x="30.0" y="80.0" width="170.0" height="64.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="115.0" y="101.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">1. detect</text><text x="115.0" y="115.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">D0 / D2</text><text x="115.0" y="129.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">describe IS / IS NOT</text><line x1="200.0" y1="112.0" x2="222.0" y2="112.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="222.0" y="80.0" width="170.0" height="64.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="307.0" y="101.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">2. contain</text><text x="307.0" y="115.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">D3</text><text x="307.0" y="129.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">block lot, WIP, stock</text><line x1="392.0" y1="112.0" x2="414.0" y2="112.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="414.0" y="80.0" width="170.0" height="64.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="499.0" y="101.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">3. root cause</text><text x="499.0" y="115.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">D4</text><text x="499.0" y="129.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">5-Why + Ishikawa</text><line x1="584.0" y1="112.0" x2="606.0" y2="112.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="606.0" y="80.0" width="170.0" height="64.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="691.0" y="101.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">4. action</text><text x="691.0" y="115.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">D5 / D6</text><text x="691.0" y="129.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">permanent fix, update CP / FMEA</text><line x1="776.0" y1="112.0" x2="798.0" y2="112.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="798.0" y="80.0" width="170.0" height="64.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="883.0" y="101.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">5. verify</text><text x="883.0" y="115.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">D7</text><text x="883.0" y="129.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">Ppk, 3 lots OK, prevent</text><line x1="968.0" y1="112.0" x2="990.0" y2="112.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="990.0" y="80.0" width="170.0" height="64.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="1075.0" y="101.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">6. close</text><text x="1075.0" y="115.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">D8</text><text x="1075.0" y="129.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">sign-off, thank the team</text><text x="30.0" y="185.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">5-Why (D4)</text><rect x="30.0" y="200.0" width="540.0" height="34.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40.0" y="221.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">1. Why too high? A long wave (≈ 230 mm, 8 µm) is in the lead curve.</text><line x1="300.0" y1="234.0" x2="300.0" y2="244.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="30.0" y="244.0" width="540.0" height="34.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40.0" y="265.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">2. Why a long wave? The screw temperature changed ≈ 1.5 K during the finish pass.</text><line x1="300.0" y1="278.0" x2="300.0" y2="288.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="30.0" y="288.0" width="540.0" height="34.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40.0" y="309.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">3. Why? The grinding-oil temperature rose from 20.0 to 21.6 °C.</text><line x1="300.0" y1="322.0" x2="300.0" y2="332.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="30.0" y="332.0" width="540.0" height="34.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="40.0" y="353.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">4. Why? The oil chiller of BS-TGR-03 tripped (alarm 213, dirty condenser).</text><line x1="300.0" y1="366.0" x2="300.0" y2="376.0" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><rect x="30.0" y="376.0" width="540.0" height="34.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.2"/><text x="40.0" y="397.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">5. Why not stopped? Alarm 213 was only a warning, no interlock, nobody at night.</text><text x="30.0" y="432.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Root cause = missing interlock + chiller maintenance (system cause, not 'operator error').</text><line x1="620.0" y1="300.0" x2="1120.0" y2="300.0" stroke="#000" stroke-width="2.4" marker-end="url(#a)"/><rect x="1120.0" y="270.0" width="60.0" height="60.0" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="1150.0" y="296.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">v_300</text><text x="1150.0" y="310.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">&gt; 18</text><line x1="620.0" y1="190.0" x2="680.0" y2="300.0" stroke="#000" stroke-width="1.4"/><text x="620.0" y="182.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Man</text><text x="620.0" y="166.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">no reaction to the warning</text><line x1="790.0" y1="190.0" x2="850.0" y2="300.0" stroke="#000" stroke-width="1.4"/><text x="790.0" y="182.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Machine</text><text x="790.0" y="166.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">chiller tripped (dirty condenser)</text><line x1="950.0" y1="190.0" x2="1010.0" y2="300.0" stroke="#000" stroke-width="1.4"/><text x="950.0" y="182.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Method</text><text x="950.0" y="166.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">alarm 213 = warning only</text><line x1="620.0" y1="410.0" x2="680.0" y2="300.0" stroke="#000" stroke-width="1.4"/><text x="620.0" y="428.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Material</text><text x="620.0" y="444.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">– (no finding)</text><line x1="790.0" y1="410.0" x2="850.0" y2="300.0" stroke="#000" stroke-width="1.4"/><text x="790.0" y="428.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Measurement</text><text x="790.0" y="444.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">lead only at the end, no trend</text><line x1="950.0" y1="410.0" x2="1010.0" y2="300.0" stroke="#000" stroke-width="1.4"/><text x="950.0" y="428.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Environment</text><text x="950.0" y="444.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">hall at night OK</text><text x="1040.0" y="245.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Ishikawa (6M)</text><rect x="30.0" y="470.0" width="1140.0" height="200.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="42.0" y="492.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Actions + verification (example)</text><text x="42.0" y="514.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">D3 contain: block 40 screws, re-measure all screws of the night: 12 to C7 or regrind.</text><text x="42.0" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">D5/D6: clean the chiller + filter plan (maintenance); alarm 213 becomes an interlock: no finish pass when |oil − 20 °C| &gt; 0.5 K (PLC, item 8).</text><text x="42.0" y="558.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">        oil temperature to gateway (Modbus TCP) and MES trend + andon (HTTP, items 4 / 6); FMEA + control plan: oil temperature as process parameter.</text><text x="42.0" y="580.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">D7 verify: 3 weeks without v_300 rejects, Ppk (v_300) from 0.9 to 1.6. Same check on BS-TGR-01 / -02 and BN-ITG (similar processes).</text><text x="42.0" y="602.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">D8: close in the QA service (POST /api/bsf/qa/ncr/{id}/step  step = close), lessons learned to all grinding cells.</text><text x="42.0" y="624.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Disposition of parts: use-as-is (only with customer deviation) · rework (regrind) · downgrade (C7) · scrap.</text><rect x="825.0" y="738.0" width="360.0" height="80.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825.0" y1="768.0" x2="1185.0" y2="768.0" stroke="#000" stroke-width="1.2"/><line x1="825.0" y1="792.0" x2="1185.0" y2="792.0" stroke="#000" stroke-width="1.2"/><text x="835.0" y="759.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">NCR / 8D workflow</text><text x="835.0" y="785.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 44-12  ·  guide 44 §17</text><text x="835.0" y="810.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the standard</text></svg>
