<text x="30" y="874" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">Host name rule: vc-&lt;area&gt;-&lt;equipment ID lower case, no hyphen&gt;[-&lt;function&gt;&lt;n&gt;]; servers vc-&lt;zone&gt;-&lt;role&gt;&lt;nn&gt;. Windows hosts ≤ 15 characters (NetBIOS).</text>
<text x="30" y="894" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">DNS zone e.g. plant1.ot.&lt;company domain&gt; (not .local). PROFINET device name = host name text. No DHCP in OT cells.</text>
