<text x="24" y="34" font-size="17" text-anchor="start" fill="#000" font-weight="bold" xml:space="preserve">IP address plan 10.&lt;VLAN&gt;.0.&lt;host&gt; and host names vc-&lt;area&gt;-&lt;device&gt; (consistent with guide 07 and twin/plc.py)</text>
<text x="24" y="56" font-size="12" text-anchor="start" fill="#555" xml:space="preserve">Second byte = VLAN number. Twin addresses 192.168.10.x keep their host number. Firewall between every zone (IEC 62443 zones and conduits).</text>
