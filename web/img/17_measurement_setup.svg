<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 800" width="1150" height="800" font-family="Arial, Helvetica, sans-serif"><title>Measuring set-ups during assembly</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.8"/></pattern><pattern id="hatA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1565c0" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1150" height="800" fill="#fff"/><rect x="4.0" y="4.0" width="1142.0" height="792.0" rx="0" fill="none" stroke="#000" stroke-width="1.5"/><text x="30.0" y="34.0" font-size="17" text-anchor="start" font-weight="bold" fill="#000">Measuring during assembly – runout, flatness, worm axial play, friction torque</text><rect x="20.0" y="50.0" width="545.0" height="330.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="20.0" y="50.0" width="333.6" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="25.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">A  Radial + axial runout (steps 4, 5, 6, 11)</text><rect x="60.0" y="170.0" width="260.0" height="30.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/><rect x="140.0" y="200.0" width="100.0" height="60.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="190.0" y1="95.0" x2="190.0" y2="290.0" stroke="#000" stroke-width="0.8" stroke-dasharray="10 3 2 3"/><text x="190.0" y="190.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">table Ø580</text><rect x="285.0" y="110.0" width="16.0" height="40.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><line x1="293.0" y1="150.0" x2="293.0" y2="170.0" stroke="#1565c0" stroke-width="1.5"/><text x="305.0" y="126.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">axial dial</text><text x="305.0" y="140.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">at Ø500</text><rect x="330.0" y="176.0" width="40.0" height="16.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><line x1="320.0" y1="184.0" x2="330.0" y2="184.0" stroke="#1565c0" stroke-width="1.5"/><text x="340.0" y="212.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">radial dial</text><path d="M150,290 A60,14 0 1 0 230,290" fill="none" stroke="#000" stroke-width="1.2"/><text x="245.0" y="300.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">turn slowly 2 turns</text><line x1="390.0" y1="250.0" x2="550.0" y2="250.0" stroke="#000" stroke-width="0.8"/><line x1="390.0" y1="300.0" x2="390.0" y2="190.0" stroke="#000" stroke-width="0.8"/><polyline points="390.0,230.2 394.0,226.0 398.0,222.3 402.0,219.3 406.0,217.0 410.0,215.6 414.0,215.0 418.0,215.3 422.0,216.4 426.0,218.4 430.0,221.1 434.0,224.6 438.0,228.6 442.0,233.2 446.0,238.2 450.0,243.5 454.0,249.0 458.0,254.5 462.0,259.9 466.0,265.0 470.0,269.8 474.0,274.0 478.0,277.7 482.0,280.7 486.0,283.0 490.0,284.4 494.0,285.0 498.0,284.7 502.0,283.6 506.0,281.6 510.0,278.9 514.0,275.4 518.0,271.4 522.0,266.8 526.0,261.8 530.0,256.5 534.0,251.0 538.0,245.5 542.0,240.1 546.0,235.0 550.0,230.2" fill="none" stroke="#1565c0" stroke-width="1.8"/><line x1="556.0" y1="215.0" x2="556.0" y2="285.0" stroke="#000" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="546.0" y="300.0" font-size="11" text-anchor="end" font-weight="bold" fill="#000">TIR = max − min</text><text x="390.0" y="184.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">reading over 1 turn</text><text x="40.0" y="345.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">TIR = 2·e (e = eccentricity) · axial runout = 2·r·φ → state the radius · resolution ≤ 1/10 of the limit</text><text x="40.0" y="362.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Limits (twin): bearing 3 µm (0.1 µm probe), table 5 µm at Ø500, wheel 10 µm, scale ring 5 µm</text><rect x="585.0" y="50.0" width="545.0" height="330.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="585.0" y="50.0" width="289.2" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="590.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">B  Flatness of the table top (step 15)</text><circle cx="700.0" cy="210.0" r="120.0" fill="none" stroke="#000" stroke-width="1.5"/><line x1="589.6" y1="210.0" x2="810.4" y2="210.0" stroke="#1565c0" stroke-width="1.3"/><line x1="621.9" y1="131.9" x2="778.1" y2="288.1" stroke="#1565c0" stroke-width="1.3"/><line x1="700.0" y1="99.6" x2="700.0" y2="320.4" stroke="#1565c0" stroke-width="1.3"/><line x1="778.1" y1="131.9" x2="621.9" y2="288.1" stroke="#1565c0" stroke-width="1.3"/><rect x="720.0" y="202.0" width="40.0" height="16.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="740.0" y="196.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">level</text><text x="700.0" y="350.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">8-line grid (Union Jack / star)</text><text x="850.0" y="110.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Electronic level, step = foot spacing</text><text x="850.0" y="130.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">e.g. 100 mm</text><text x="850.0" y="150.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">height step = reading × step</text><text x="850.0" y="170.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">4 µm/m × 0.1 m = 0.4 µm</text><text x="850.0" y="190.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">sum steps along each line,</text><text x="850.0" y="210.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">fit a plane: flatness = max − min</text><text x="850.0" y="230.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">limit (twin) ≤ 5 µm</text><text x="850.0" y="250.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">or dial on the turning table</text><text x="850.0" y="270.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">= axial runout per radius</text><rect x="20.0" y="395.0" width="545.0" height="325.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="20.0" y="395.0" width="296.6" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="25.0" y="411.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">C  Worm axial play + stiffness (step 7)</text><rect x="80.0" y="520.0" width="330.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><rect x="60.0" y="505.0" width="40.0" height="52.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><rect x="390.0" y="508.0" width="40.0" height="46.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><rect x="440.0" y="523.0" width="40.0" height="16.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><line x1="430.0" y1="531.0" x2="440.0" y2="531.0" stroke="#1565c0" stroke-width="1.5"/><text x="440.0" y="512.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">0.1 µm probe</text><line x1="230.0" y1="470.0" x2="230.0" y2="515.0" stroke="#000" stroke-width="0.8"/><line x1="170.0" y1="470.0" x2="290.0" y2="470.0" stroke="#1565c0" stroke-width="2" marker-end="url(#aa)" marker-start="url(#aa)"/><text x="230.0" y="462.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1565c0">± 100 N (lever / force gauge)</text><text x="40.0" y="590.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Reading = play + elastic deflection</text><text x="40.0" y="610.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Measure at 50 N and 100 N: elastic part grows with F,</text><text x="40.0" y="630.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">play stays → limit play ≤ 2 µm (target 0)</text><text x="40.0" y="650.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Example: 50 N → 0.35 µm, 100 N → 0.6 µm → play ≈ 0.1 µm</text><rect x="585.0" y="395.0" width="545.0" height="325.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="585.0" y="395.0" width="363.2" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="590.0" y="411.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">D  Friction (turning) torque (steps 4, 5, 7, 12)</text><circle cx="700.0" cy="540.0" r="70.0" fill="none" stroke="#000" stroke-width="1.5"/><circle cx="700.0" cy="540.0" r="3.0" fill="#000" stroke="#000" stroke-width="1.2"/><line x1="700.0" y1="540.0" x2="860.0" y2="540.0" stroke="#000" stroke-width="4"/><line x1="860.0" y1="490.0" x2="860.0" y2="536.0" stroke="#1565c0" stroke-width="2.2" marker-end="url(#aa)"/><text x="866.0" y="500.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">F</text><line x1="700.0" y1="575.0" x2="860.0" y2="575.0" stroke="#000" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="780.0" y="592.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">L = 0.5 m</text><text x="900.0" y="470.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Table only:</text><text x="900.0" y="488.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">T = F · L = 50 N · 0.5 m</text><text x="900.0" y="506.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">= 25 N·m (bearing, guide 12)</text><text x="900.0" y="536.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">At the worm shaft:</text><text x="900.0" y="554.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">T = 0.36 + 0.10 + 40/(90·0.713)</text><text x="900.0" y="572.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">≈ 1.08 N·m expected</text><text x="600.0" y="640.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Read the steady running value (not the break-away peak), turn 1–5 rpm,</text><text x="600.0" y="656.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">compare before / after each step: + 10 % = look for the cause (seal, union side load, ring).</text><rect x="670.0" y="726.0" width="470.0" height="64.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><line x1="670.0" y1="748.0" x2="1140.0" y2="748.0" stroke="#000" stroke-width="1.2"/><line x1="670.0" y1="769.0" x2="1140.0" y2="769.0" stroke="#000" stroke-width="1.2"/><text x="678.0" y="742.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Measuring set-ups during assembly</text><text x="678.0" y="763.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the maker's documentation</text><text x="678.0" y="784.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">17_measurement_setup.svg · Guide 17 · twin example values · not to scale</text></svg>