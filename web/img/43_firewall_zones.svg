<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Zones, conduits, firewall – drawing 43-10</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Cyber-security – IEC 62443 zones + conduits and firewall rules</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Modbus TCP has no login and no encryption → protect it by segmentation, a single client (the gateway) and allow lists</text><rect x="24" y="80" width="520" height="60" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="104" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Enterprise (IT)</text><text x="36" y="124" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ERP 10.10.0.20, office</text><text x="470" y="116" font-size="12" text-anchor="start" font-weight="bold" fill="#000">C1</text><rect x="400" y="140" width="60" height="20" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/><text x="430" y="154" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">FW</text><rect x="24" y="160" width="520" height="60" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="184" font-size="13" text-anchor="start" font-weight="bold" fill="#000">DMZ  VLAN 610</text><text x="36" y="204" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ERP connector, NTP</text><text x="470" y="196" font-size="12" text-anchor="start" font-weight="bold" fill="#000">C2</text><rect x="400" y="220" width="60" height="20" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/><text x="430" y="234" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">FW</text><rect x="24" y="240" width="520" height="60" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="264" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Operations  VLAN 620 (SL 2)</text><text x="36" y="284" font-size="11" text-anchor="start" font-weight="normal" fill="#000">MES, print server, historian</text><text x="470" y="276" font-size="12" text-anchor="start" font-weight="bold" fill="#000">C3</text><rect x="400" y="300" width="60" height="20" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/><text x="430" y="314" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">FW</text><rect x="24" y="320" width="520" height="60" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="36" y="344" font-size="13" text-anchor="start" font-weight="bold" fill="#1565c0">Supervisory  VLAN 630 (SL 2)</text><text x="36" y="364" font-size="11" text-anchor="start" font-weight="normal" fill="#000">gateway, twin, fleet, eng. PC</text><rect x="400" y="380" width="60" height="20" rx="0" fill="#000" stroke="#000" stroke-width="1.2"/><text x="430" y="394" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">FW</text><rect x="24" y="410" width="96" height="60" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="72" y="434" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Soft 641</text><text x="72" y="452" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">19 machines</text><rect x="130" y="410" width="96" height="60" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="178" y="434" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">HT 642</text><text x="178" y="452" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">9 machines</text><rect x="236" y="410" width="96" height="60" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="284" y="434" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Grind 643</text><text x="284" y="452" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">22 machines</text><rect x="342" y="410" width="96" height="60" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="390" y="434" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">QC 644</text><text x="390" y="452" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">8 machines</text><rect x="448" y="410" width="96" height="60" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.4"/><text x="496" y="434" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Assy 645</text><text x="496" y="452" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">15 machines</text><rect x="24" y="486" width="250" height="46" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="506" font-size="11" text-anchor="start" font-weight="bold" fill="#000">AGV Wi-Fi 650 (WPA3-Enterprise)</text><text x="36" y="522" font-size="11" text-anchor="start" font-weight="normal" fill="#000">only fleet manager ↔ AGVs</text><rect x="294" y="486" width="250" height="46" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="306" y="506" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Utilities 660</text><text x="306" y="522" font-size="11" text-anchor="start" font-weight="normal" fill="#000">meters, air, HVAC – Modbus 502</text><text x="24" y="556" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Cell zones (SL 1 – 2): only Modbus TCP 502 from the gateway in.</text><text x="24" y="572" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Safety (SIS) is a separate zone: hard-wired, no network at all.</text><rect x="24" y="590" width="520" height="130" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="610" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Extra protection because Modbus is open</text><text x="36" y="628" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• one Modbus client per cell: the gateway (+ eng. PC by ticket)</text><text x="36" y="646" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• read-only maps where possible; writes only in 200 – 226</text><text x="36" y="664" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• switch: port security, unused ports off, no DHCP</text><text x="36" y="682" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• firewall logs to syslog, Modbus FC allow list (DPI) if offered</text><text x="36" y="700" font-size="11" text-anchor="start" font-weight="normal" fill="#000">• HTTPS + API key above the gateway, TLS 1.2 or newer</text><text x="566" y="96" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Conduits = firewall allow list (everything else is denied)</text><rect x="566" y="104" width="600" height="26" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="572" y="122" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">#</text><text x="606" y="122" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">From</text><text x="760" y="122" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">To</text><text x="910" y="122" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Port</text><text x="1014" y="122" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Note</text><rect x="566" y="130" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="148" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C1</text><text x="606" y="148" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ERP 10.10.0.20</text><text x="760" y="148" font-size="11" text-anchor="start" font-weight="normal" fill="#000">erpgw01 10.60.10.11</text><text x="910" y="148" font-size="11" text-anchor="start" font-weight="normal" fill="#000">TCP 443</text><text x="1014" y="148" font-size="11" text-anchor="start" font-weight="normal" fill="#000">HTTPS, API key</text><rect x="566" y="156" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="174" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C2</text><text x="606" y="174" font-size="11" text-anchor="start" font-weight="normal" fill="#000">erpgw01</text><text x="760" y="174" font-size="11" text-anchor="start" font-weight="normal" fill="#000">MES 10.60.20.10</text><text x="910" y="174" font-size="11" text-anchor="start" font-weight="normal" fill="#000">TCP 443</text><text x="1014" y="174" font-size="11" text-anchor="start" font-weight="normal" fill="#000">HTTPS</text><rect x="566" y="182" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="200" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C3</text><text x="606" y="200" font-size="11" text-anchor="start" font-weight="normal" fill="#000">MES</text><text x="760" y="200" font-size="11" text-anchor="start" font-weight="normal" fill="#000">gw01 / gw02 .30.10/.9</text><text x="910" y="200" font-size="11" text-anchor="start" font-weight="normal" fill="#000">TCP 443</text><text x="1014" y="200" font-size="11" text-anchor="start" font-weight="normal" fill="#000">HTTP API (REST)</text><rect x="566" y="208" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="226" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C4</text><text x="606" y="226" font-size="11" text-anchor="start" font-weight="normal" fill="#000">twin, andon, clients</text><text x="760" y="226" font-size="11" text-anchor="start" font-weight="normal" fill="#000">gateway / twin</text><text x="910" y="226" font-size="11" text-anchor="start" font-weight="normal" fill="#000">TCP 443 / 8080</text><text x="1014" y="226" font-size="11" text-anchor="start" font-weight="normal" fill="#000">read + SSE</text><rect x="566" y="234" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="252" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C5</text><text x="606" y="252" font-size="11" text-anchor="start" font-weight="normal" fill="#000">gw01 / gw02</text><text x="760" y="252" font-size="11" text-anchor="start" font-weight="normal" fill="#000">cells 641 – 645, 660</text><text x="910" y="252" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">TCP 502</text><text x="1014" y="252" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Modbus TCP only</text><rect x="566" y="260" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="278" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C6</text><text x="606" y="278" font-size="11" text-anchor="start" font-weight="normal" fill="#000">eng01 10.60.30.20</text><text x="760" y="278" font-size="11" text-anchor="start" font-weight="normal" fill="#000">cells</text><text x="910" y="278" font-size="11" text-anchor="start" font-weight="normal" fill="#000">502 + tools</text><text x="1014" y="278" font-size="11" text-anchor="start" font-weight="normal" fill="#000">time-limited ticket</text><rect x="566" y="286" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="304" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C7</text><text x="606" y="304" font-size="11" text-anchor="start" font-weight="normal" fill="#000">fleet01</text><text x="760" y="304" font-size="11" text-anchor="start" font-weight="normal" fill="#000">AGV VLAN 650</text><text x="910" y="304" font-size="11" text-anchor="start" font-weight="normal" fill="#000">HTTP(S)</text><text x="1014" y="304" font-size="11" text-anchor="start" font-weight="normal" fill="#000">maker API</text><rect x="566" y="312" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="330" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C8</text><text x="606" y="330" font-size="11" text-anchor="start" font-weight="normal" fill="#000">all OT hosts</text><text x="760" y="330" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ntp01 10.60.10.10</text><text x="910" y="330" font-size="11" text-anchor="start" font-weight="normal" fill="#000">UDP 123</text><text x="1014" y="330" font-size="11" text-anchor="start" font-weight="normal" fill="#000">infrastructure</text><rect x="566" y="338" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="356" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C9</text><text x="606" y="356" font-size="11" text-anchor="start" font-weight="normal" fill="#000">MES</text><text x="760" y="356" font-size="11" text-anchor="start" font-weight="normal" fill="#000">print server</text><text x="910" y="356" font-size="11" text-anchor="start" font-weight="normal" fill="#000">TCP 443</text><text x="1014" y="356" font-size="11" text-anchor="start" font-weight="normal" fill="#000">HTTP print jobs</text><rect x="566" y="364" width="600" height="26" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="572" y="382" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C10</text><text x="606" y="382" font-size="11" text-anchor="start" font-weight="bold" fill="#000">any</text><text x="760" y="382" font-size="11" text-anchor="start" font-weight="bold" fill="#000">any</text><text x="910" y="382" font-size="11" text-anchor="start" font-weight="bold" fill="#000">any</text><text x="1014" y="382" font-size="11" text-anchor="start" font-weight="bold" fill="#000">DENY + log</text><text x="566" y="414" font-size="11" text-anchor="start" font-weight="bold" fill="#000">NTP is UDP, not HTTP – the one honest infrastructure exception</text><text x="566" y="430" font-size="11" text-anchor="start" font-weight="normal" fill="#000">(like DNS); option: HTTP Date header check as plausibility test.</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Zones, conduits, firewall</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-10  ·  guide 43 §13</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
