<path d="M60,90 L71,90 A11,11 0 0,1 60,101 Z" fill="#000" stroke="#000" stroke-width="0"/>
<path d="M60,90 L49,90 A11,11 0 0,1 60,79 Z" fill="#000" stroke="#000" stroke-width="0"/>
<text x="78.0" y="82.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">M = machine zero (machine X0 Z0, at the + end of X and Z)</text>
<line x1="200.0" y1="250.0" x2="140.0" y2="250.0" stroke="#000" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="112.0" y="254.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">X+</text>
<line x1="200.0" y1="250.0" x2="200.0" y2="190.0" stroke="#000" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="192.0" y="184.0" font-size="12" text-anchor="start" fill="#000">Z+ (towards</text>
<text x="192.0" y="198.0" font-size="1" text-anchor="start" fill="#000"></text>
<text x="206.0" y="200.0" font-size="12" text-anchor="start" fill="#000">the spindle)</text>
<circle cx="200.0" cy="250.0" r="5.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<text x="80.0" y="276.0" font-size="12" text-anchor="start" fill="#000">(dot = Y+ out of the page)</text>
<path d="M188,222 A30,30 0 0,0 172,238" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arA)"/>
<text x="76.0" y="210.0" font-size="12" text-anchor="start" fill="#c0392b">B+ (check machine)</text>
<rect x="338.0" y="110.0" width="64.0" height="70.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.5"/>
<text x="410.0" y="130.0" font-size="12" text-anchor="start" fill="#000">spindle (horizontal, along Z)</text>
<line x1="310.0" y1="180.0" x2="430.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="434.0" y="184.0" font-size="12" text-anchor="start" fill="#c0392b">gauge line (spindle nose)</text>
<path d="M348,180 L392,180 L382,208 L358,208 Z" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<rect x="362.0" y="208.0" width="16.0" height="82.0" rx="0" fill="#bbb" stroke="#000" stroke-width="1.5"/>
<text x="386.0" y="260.0" font-size="12" text-anchor="start" fill="#000">tool T1 (holder + cutter)</text>
<line x1="318.0" y1="180.0" x2="318.0" y2="290.0" stroke="#000" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line x1="312.0" y1="290.0" x2="362.0" y2="290.0" stroke="#000" stroke-width="0.8"/>
<text x="312.0" y="240.0" font-size="12" text-anchor="end" fill="#000" font-weight="bold">H1 =</text>
<text x="312.0" y="255.0" font-size="12" text-anchor="end" fill="#000" font-weight="bold">185.220</text>
<text x="312.0" y="300.0" font-size="11" text-anchor="end" fill="#000">tool tip</text>
<circle cx="410.0" cy="520.0" r="112.0" fill="none" stroke="#000" stroke-width="1.5"/>
<circle cx="410.0" cy="520.0" r="4.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<line x1="396.0" y1="520.0" x2="424.0" y2="520.0" stroke="#000" stroke-width="1"/>
<line x1="410.0" y1="506.0" x2="410.0" y2="534.0" stroke="#000" stroke-width="1"/>
<text x="390.0" y="586.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">B table centre</text>
<text x="390.0" y="602.0" font-size="12" text-anchor="start" fill="#000">Xc −250.000  Zc −700.000</text>
<rect x="290.0" y="460.0" width="160.0" height="100.0" rx="0" fill="#eeeeee" stroke="#000" stroke-width="1.5"/>
<text x="300.0" y="545.0" font-size="11" text-anchor="start" fill="#000">crankcase on fixture</text>
<circle cx="370.0" cy="460.0" r="9.0" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<line x1="357.0" y1="460.0" x2="383.0" y2="460.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="370.0" y1="447.0" x2="370.0" y2="473.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="356.0" y="450.0" font-size="12" text-anchor="end" fill="#c0392b" font-weight="bold">W = work zero G54</text>
<text x="356.0" y="434.0" font-size="11" text-anchor="end" fill="#c0392b">(X0 Y0 Z0 of the program)</text>
<line x1="396.0" y1="290.0" x2="396.0" y2="458.0" stroke="#000" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="400.0" y="380.0" font-size="11" text-anchor="start" fill="#000">Zw = tip position</text>
<text x="400.0" y="394.0" font-size="11" text-anchor="start" fill="#000">in the program</text>
<line x1="410.0" y1="520.0" x2="364.0" y2="468.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arA)"/>
<text x="416.0" y="494.0" font-size="11" text-anchor="start" fill="#c0392b">x 40, z 60</text>
<line x1="370.0" y1="473.0" x2="370.0" y2="625.0" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="60.0" y1="104.0" x2="60.0" y2="625.0" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="370.0" y1="618.0" x2="60.0" y2="618.0" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arA)" marker-end="url(#arA)"/>
<text x="215.0" y="612.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">G54 X = −210.000</text>
<line x1="383.0" y1="460.0" x2="632.0" y2="460.0" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="74.0" y1="90.0" x2="632.0" y2="90.0" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="626.0" y1="90.0" x2="626.0" y2="460.0" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arA)" marker-end="url(#arA)"/>
<text x="632.0" y="290.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">G54 Z =</text>
<text x="632.0" y="306.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">−640.000</text>
<rect x="690.0" y="70.0" width="395.0" height="168.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="698.0" y="88.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Tool length (Fanuc G43 H.. / Siemens D..)</text>
<text x="698.0" y="107.0" font-size="12" text-anchor="start" fill="#000">Machine Z of the gauge line:</text>
<text x="698.0" y="124.0" font-size="12" text-anchor="start" fill="#000">Zm = Zw + G54 Z + H</text>
<text x="698.0" y="141.0" font-size="12" text-anchor="start" fill="#000">G54 Z = −640.000   H1 = 185.220</text>
<text x="698.0" y="158.0" font-size="12" text-anchor="start" fill="#000">tip at Zw = 0   -&gt;  Zm = −454.780</text>
<text x="698.0" y="175.0" font-size="12" text-anchor="start" fill="#000">tip at Zw = 50  -&gt;  Zm = −404.780</text>
<text x="698.0" y="192.0" font-size="12" text-anchor="start" fill="#000">wrong H (150.000 instead of 185.220):</text>
<text x="698.0" y="209.0" font-size="12" text-anchor="start" fill="#000">tip goes 35.22 mm deeper -&gt; CRASH</text>
<rect x="690.0" y="248.0" width="395.0" height="150.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="698.0" y="266.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Work offsets</text>
<text x="698.0" y="285.0" font-size="12" text-anchor="start" fill="#000">G54 (B0):  X −210.000   Z −640.000</text>
<text x="698.0" y="302.0" font-size="12" text-anchor="start" fill="#000">G55 = same point after B90:</text>
<text x="698.0" y="319.0" font-size="12" text-anchor="start" fill="#000">          X −190.000   Z −740.000</text>
<text x="698.0" y="336.0" font-size="12" text-anchor="start" fill="#000">Fanuc: G54…G59 + G54.1 P1…P48 (option)</text>
<text x="698.0" y="353.0" font-size="12" text-anchor="start" fill="#000">Siemens: G54…G57, G505…G599, TRANS/ROT</text>
<text x="698.0" y="370.0" font-size="12" text-anchor="start" fill="#000">Heidenhain: preset table + CYCL DEF 7</text>
<rect x="690.0" y="408.0" width="395.0" height="250.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="698.0" y="426.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">B-axis: where W goes when the table turns</text>
<circle cx="790.0" cy="545.0" r="80.0" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="790.0" cy="545.0" r="3.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<line x1="790.0" y1="545.0" x2="754.0" y2="491.0" stroke="#000" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="750.0" y="485.0" font-size="12" text-anchor="end" fill="#000" font-weight="bold">B0</text>
<line x1="790.0" y1="545.0" x2="736.0" y2="581.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arA)"/>
<text x="732.0" y="597.0" font-size="12" text-anchor="end" fill="#c0392b" font-weight="bold">B90</text>
<path d="M760,500 A54,54 0 0,0 740,575" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arA)"/>
<line x1="875.0" y1="545.0" x2="700.0" y2="545.0" stroke="#000" stroke-width="0.6"/>
<text x="702.0" y="541.0" font-size="11" text-anchor="start" fill="#000">x+</text>
<line x1="790.0" y1="633.0" x2="790.0" y2="457.0" stroke="#000" stroke-width="0.6"/>
<text x="794.0" y="465.0" font-size="11" text-anchor="start" fill="#000">z</text>
<text x="890.0" y="448.0" font-size="12" text-anchor="start" fill="#000">x' = x·cosB + z·sinB</text>
<text x="890.0" y="466.0" font-size="12" text-anchor="start" fill="#000">z' = −x·sinB + z·cosB</text>
<text x="890.0" y="484.0" font-size="12" text-anchor="start" fill="#000">W at B0: x = 40, z = 60</text>
<text x="890.0" y="502.0" font-size="12" text-anchor="start" fill="#000">B 90: x' = 60, z' = −40</text>
<text x="890.0" y="520.0" font-size="12" text-anchor="start" fill="#000">B 30: x' = 64.641</text>
<text x="890.0" y="538.0" font-size="12" text-anchor="start" fill="#000">       z' = 31.962</text>
<text x="890.0" y="556.0" font-size="12" text-anchor="start" fill="#000">G5x = table centre + (x', z')</text>
<text x="890.0" y="574.0" font-size="12" text-anchor="start" fill="#000">Sign of B: check machine</text>
<text x="890.0" y="592.0" font-size="12" text-anchor="start" fill="#000">(ISO 841 right-hand rule)</text>
<rect x="656.0" y="674.0" width="430.0" height="52.0" rx="0" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<line x1="656.0" y1="700.0" x2="1086.0" y2="700.0" stroke="#000" stroke-width="1"/>
<text x="664.0" y="692.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">EXAMPLE – check the maker's documentation</text>
<text x="664.0" y="718.0" font-size="12" text-anchor="start" fill="#000">Guide 08 – CNC / G-code · 08_coordinate_systems</text>
