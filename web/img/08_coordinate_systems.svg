<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Coordinate systems on the HMC – machine zero, work offset G54, tool length H, B-axis</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1100" height="740" fill="#ffffff"/>
<rect x="6" y="6" width="1088" height="728" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">Coordinate systems on the HMC – machine zero, work offset G54, tool length H, B-axis</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#000">Top view of the HMC (looking down from +Y, so X+ points LEFT – right-hand system). Not to scale. Numbers: §18.7 and §19.2.</text>
<rect x="60.0" y="90.0" width="540.0" height="545.0" rx="0" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="6 4"/>
