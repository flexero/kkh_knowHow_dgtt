<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
<rect width="1200" height="830" fill="#fff"/>
<text x="40.0" y="44.0" font-size="14" text-anchor="start" font-weight="bold" fill="#000">Cascade position control of the travel axis (drive-internal) with speed + acceleration feedforward</text><rect x="40.0" y="170.0" width="130.0" height="60.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="105.0" y="189.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Profile</text><text x="105.0" y="204.0" font-size="12" text-anchor="middle" fill="#000">generator (PLC/drive)</text><text x="105.0" y="219.0" font-size="12" text-anchor="middle" fill="#000">x_ref, v_ref, a_ref</text><line x1="170.0" y1="200.0" x2="216.0" y2="200.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><circle cx="230" cy="200" r="14" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="230.0" y="205.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">Σ</text><line x1="244.0" y1="200.0" x2="290.0" y2="200.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="290.0" y="172.0" width="110.0" height="56.0" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/><text x="345.0" y="196.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Position P</text><text x="345.0" y="211.5" font-size="12" text-anchor="middle" fill="#000">K_v = 2 1/s</text><line x1="400.0" y1="200.0" x2="446.0" y2="200.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><circle cx="460" cy="200" r="14" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="460.0" y="205.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">Σ</text><line x1="474.0" y1="200.0" x2="520.0" y2="200.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="520.0" y="172.0" width="130.0" height="56.0" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/><text x="585.0" y="189.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Speed PI</text><text x="585.0" y="204.0" font-size="12" text-anchor="middle" fill="#000">K_p = 90 kN·s/m</text><text x="585.0" y="219.0" font-size="12" text-anchor="middle" fill="#000">T_i = 0.2 s</text><line x1="650.0" y1="200.0" x2="696.0" y2="200.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><circle cx="710" cy="200" r="14" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="710.0" y="205.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">Σ</text><line x1="724.0" y1="200.0" x2="770.0" y2="200.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="770.0" y="172.0" width="130.0" height="56.0" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/><text x="835.0" y="189.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Current / force</text><text x="835.0" y="204.0" font-size="12" text-anchor="middle" fill="#000">T_c = 2 ms</text><text x="835.0" y="219.0" font-size="12" text-anchor="middle" fill="#000">limit 4.7 kN</text><line x1="900.0" y1="200.0" x2="946.0" y2="200.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="946.0" y="172.0" width="130.0" height="56.0" rx="5" fill="#fff" stroke="#000" stroke-width="1.3"/><text x="1011.0" y="189.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Motor + crane</text><text x="1011.0" y="204.0" font-size="12" text-anchor="middle" fill="#000">m = 4 500 kg</text><text x="1011.0" y="219.0" font-size="12" text-anchor="middle" fill="#000">1/(m·s)</text><line x1="1076.0" y1="200.0" x2="1150.0" y2="200.0" stroke="#000" stroke-width="1.4"/><text x="1110.0" y="192.0" font-size="12" text-anchor="middle" fill="#000">v, x</text><line x1="1130.0" y1="200.0" x2="1130.0" y2="320.0" stroke="#000" stroke-width="1.4"/><line x1="1130.0" y1="320.0" x2="460.0" y2="320.0" stroke="#000" stroke-width="1.4"/><line x1="460.0" y1="320.0" x2="460.0" y2="214.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="700.0" y="314.0" font-size="12" text-anchor="start" fill="#000">speed feedback (motor encoder)</text><line x1="1150.0" y1="200.0" x2="1150.0" y2="370.0" stroke="#000" stroke-width="1.4"/><line x1="1150.0" y1="370.0" x2="230.0" y2="370.0" stroke="#000" stroke-width="1.4"/><line x1="230.0" y1="370.0" x2="230.0" y2="214.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="600.0" y="364.0" font-size="12" text-anchor="start" fill="#000">position feedback (laser distance sensor, absolute)</text><line x1="105.0" y1="170.0" x2="105.0" y2="110.0" stroke="#1565c0" stroke-width="1.4"/><line x1="105.0" y1="110.0" x2="460.0" y2="110.0" stroke="#1565c0" stroke-width="1.4"/><line x1="460.0" y1="110.0" x2="460.0" y2="186.0" stroke="#1565c0" stroke-width="1.4"/><text x="250.0" y="104.0" font-size="12" text-anchor="start" fill="#1565c0">speed feedforward ff·v_ref (ff = 0.95)</text><line x1="125.0" y1="170.0" x2="125.0" y2="80.0" stroke="#1565c0" stroke-width="1.4"/><line x1="125.0" y1="80.0" x2="710.0" y2="80.0" stroke="#1565c0" stroke-width="1.4"/><line x1="710.0" y1="80.0" x2="710.0" y2="186.0" stroke="#1565c0" stroke-width="1.4"/><text x="450.0" y="74.0" font-size="12" text-anchor="start" fill="#1565c0">acceleration (force) feedforward m·a_ref</text><text x="40.0" y="420.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1565c0">Tuning rules (example – the drive commissioning decides)</text><text x="40.0" y="441.0" font-size="12" text-anchor="start" fill="#000">current loop: set by the drive (T_c ≈ 1 – 2 ms, PWM 4 – 8 kHz)</text><text x="40.0" y="462.0" font-size="12" text-anchor="start" fill="#000">speed loop: bandwidth ω_v ≈ 20 rad/s → K_p = m·ω_v = 4 500 · 20 = 90 000 N·s/m, T_i = 4/ω_v = 0.2 s</text><text x="40.0" y="483.0" font-size="12" text-anchor="start" fill="#000">position loop: K_v ≤ 0.3·ω_mast = 0.3 · 7.54 = 2.3 1/s (the soft mast limits the gain; rigid machine tools use 30 – 100 1/s)</text><text x="40.0" y="504.0" font-size="12" text-anchor="start" fill="#000">following error at constant speed: e = v / K_v = 3 / 2 = 1.5 m without feedforward (!)</text><text x="40.0" y="525.0" font-size="12" text-anchor="start" fill="#000">with 95 % speed feedforward: e = (1 − 0.95) · 3 / 2 = 0.075 m = 75 mm; with 100 % + force feedforward: a few mm</text><text x="40.0" y="546.0" font-size="12" text-anchor="start" fill="#000">following-error monitoring: alarm if |e| &gt; e_expected + 50 mm → ASRSRAW_A4011 (drive fault)</text><text x="40.0" y="567.0" font-size="12" text-anchor="start" fill="#000"></text><text x="40.0" y="588.0" font-size="12" text-anchor="start" fill="#000">Two travel drives (bottom + top or front + rear wheel): master / slave with torque sharing; a skew controller keeps the mast vertical.</text><text x="40.0" y="609.0" font-size="12" text-anchor="start" fill="#000">Hoist: same cascade, position from the bar-code reader; brake opened only when torque is built up (no sag at start).</text><text x="40.0" y="630.0" font-size="12" text-anchor="start" fill="#000">Fork: position from the absolute encoder; torque limit as collision protection; centre sensors are safety inputs.</text>
<rect x="10.0" y="10.0" width="1180.0" height="810.0" rx="0" fill="none" stroke="#000" stroke-width="1.5"/><rect x="760.0" y="738.0" width="430.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><line x1="760.0" y1="766.0" x2="1190.0" y2="766.0" stroke="#000" stroke-width="1"/><line x1="760.0" y1="792.0" x2="1190.0" y2="792.0" stroke="#000" stroke-width="1"/><line x1="1040.0" y1="792.0" x2="1040.0" y2="820.0" stroke="#000" stroke-width="1"/><text x="770.0" y="758.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the AS/RS supplier's documentation</text><text x="770.0" y="785.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Cascade position / speed / current control</text><text x="770.0" y="812.0" font-size="11" text-anchor="start" fill="#000">32_cascade_loop.svg · guide 32 §6.4</text><text x="1050.0" y="812.0" font-size="11" text-anchor="start" fill="#000">n.t.s. · 2026-11-12</text>
</svg>