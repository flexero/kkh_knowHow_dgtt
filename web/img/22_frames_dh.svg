<text x="698" y="260.5" font-size="12.5" text-anchor="start" fill="#000" font-weight="bold">How to read it</text>
<text x="698" y="276.6" font-size="11.5" text-anchor="start" fill="#000">A_i = Rz(θ_i) · Tz(d_i) · Tx(a_i) · Rx(α_i)</text>
<text x="698" y="292.1" font-size="11.5" text-anchor="start" fill="#000">T_06 = A1 · A2 · A3 · A4 · A5 · A6,   T_TCP = T_06 · Tz(180)</text>
<text x="698" y="307.7" font-size="11.5" text-anchor="start" fill="#000">θ_i = joint angle (about z_(i−1)),  d_i = offset along z_(i−1)</text>
<text x="698" y="323.2" font-size="11.5" text-anchor="start" fill="#000">a_i = length along x_i (common normal),  α_i = twist about x_i</text>
<text x="698" y="338.7" font-size="11.5" text-anchor="start" fill="#000">Offsets: −90° on θ2 (DH from horizontal, app from vertical),</text>
<text x="698" y="354.2" font-size="11.5" text-anchor="start" fill="#000">+180° on θ6 (DH flange frame = app flange frame)</text>
<text x="690" y="400" font-size="12" text-anchor="start" fill="#000" font-weight="bold">One DH step: from frame i−1 to frame i</text>
<line x1="750" y1="580" x2="750" y2="430" stroke="#000" stroke-width="2" marker-end="url(#ek)"/>
<text x="742" y="426" font-size="12" text-anchor="end" fill="#000" font-weight="bold">z_(i−1)</text>
