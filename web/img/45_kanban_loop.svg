<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker>
<marker id="arrKs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#000"/></marker>
<marker id="arrAs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f6fd1"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.4"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#000">Kanban loop for bought parts – supermarket at assembly (balls Ø6.35 example)</text>
<line x1="24" y1="50" x2="1176" y2="50" stroke="#000" stroke-width="1.2"/>
<rect x="80" y="140" width="260" height="120" rx="6" fill="#fff" stroke="#1f6fd1" stroke-width="2.4"/>
<text x="210.0" y="187.55" font-size="13" text-anchor="middle" font-weight="700" fill="#1f6fd1">Supermarket at AS-NAS</text>
<text x="210.0" y="204.55" font-size="13" text-anchor="middle" fill="#000">9 boxes × 5 000 balls</text>
<text x="210.0" y="221.55" font-size="13" text-anchor="middle" fill="#000">first-in first-out rack</text>
<rect x="470" y="140" width="260" height="120" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="600.0" y="179.05" font-size="13" text-anchor="middle" font-weight="700" fill="#000">MES</text>
<text x="600.0" y="196.05" font-size="13" text-anchor="middle" fill="#000">POST /kanban/{item}/scan</text>
<text x="600.0" y="213.05" font-size="13" text-anchor="middle" fill="#000">or automatic from confirmations</text>
<text x="600.0" y="230.05" font-size="13" text-anchor="middle" fill="#000">(60 balls per nut at op 80)</text>
<rect x="860" y="140" width="260" height="120" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="990.0" y="187.55" font-size="13" text-anchor="middle" font-weight="700" fill="#000">ERP / supplier</text>
<text x="990.0" y="204.55" font-size="13" text-anchor="middle" fill="#000">replenishment order</text>
<text x="990.0" y="221.55" font-size="13" text-anchor="middle" fill="#000">lead time LT = 5 days</text>
<rect x="470" y="400" width="260" height="110" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="600.0" y="442.55" font-size="13" text-anchor="middle" font-weight="700" fill="#000">Goods receipt</text>
<text x="600.0" y="459.55" font-size="13" text-anchor="middle" fill="#000">incoming check QC-INC</text>
<text x="600.0" y="476.55" font-size="13" text-anchor="middle" fill="#000">full box back to the rack</text>
<line x1="340" y1="200" x2="470" y2="200" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#arrA)"/>
<text x="409.0" y="195.0" font-size="11" text-anchor="start" fill="#1f6fd1">empty box scanned</text>
<line x1="730" y1="200" x2="860" y2="200" stroke="#1f6fd1" stroke-width="2.2" marker-end="url(#arrA)"/>
<text x="799.0" y="195.0" font-size="11" text-anchor="start" fill="#1f6fd1">signal (HTTP)</text>
<polyline points="990,260 990,455 730,455" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrK)"/>
<text x="1000" y="360" font-size="11" text-anchor="start" fill="#000">delivery</text>
<polyline points="470,455 210,455 210,260" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrK)"/>
<text x="120" y="360" font-size="11" text-anchor="start" fill="#000">full box</text>
<rect x="80" y="570" width="1040" height="120" rx="6" fill="#fff" stroke="#1f6fd1" stroke-width="2.4"/>
<text x="88" y="616.9" font-size="14" text-anchor="start" font-weight="700" fill="#1f6fd1">N = ceil( D × LT × (1 + α) / C )</text>
<text x="88" y="634.9" font-size="14" text-anchor="start" fill="#000">D = 60 balls × 120 nuts per day = 7 200 per day · LT = 5 days · α = 0.2 (safety) · C = 5 000 per box</text>
<text x="88" y="652.9" font-size="14" text-anchor="start" fill="#000">N = ceil(7 200 × 5 × 1.2 / 5 000) = ceil(8.64) = 9 boxes in the loop · red when ≤ 30 % full</text>
<rect x="770" y="766" width="406" height="48" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="770" y1="790" x2="1176" y2="790" stroke="#000" stroke-width="1"/>
<text x="778" y="783" font-size="12" font-weight="700" fill="#1f6fd1">EXAMPLE – check with your MES team</text>
<text x="778" y="807" font-size="11" fill="#000">Ball screw + guide factory · item 6 MES · guide 45 · 45_kanban_loop.svg</text>
</svg>
