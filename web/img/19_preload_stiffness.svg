<text x="102.0" y="257.5" font-size="11" text-anchor="start" font-weight="normal" fill="#0b6fb8" >Fa = 2 kN (4.8)</text>
<rect x="98.0" y="96.0" width="290.0" height="76.0" fill="#fff" stroke="#000" stroke-width="0.8" />
<line x1="104.0" y1="110.0" x2="144.0" y2="110.0" stroke="#000" stroke-width="2.4" />
<text x="152.0" y="114.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >rigid preload (both pairs work)</text>
<line x1="104.0" y1="130.0" x2="144.0" y2="130.0" stroke="#000" stroke-width="1.8" stroke-dasharray="8,5"/>
<text x="152.0" y="134.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >spring preload 800 N (pair A only)</text>
<line x1="104.0" y1="150.0" x2="144.0" y2="150.0" stroke="#0b6fb8" stroke-width="2" />
<text x="152.0" y="154.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >measured spindle cax = 160 N/µm</text>
<rect x="680.0" y="80.0" width="480.0" height="400.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="690.0" y="104.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Formulas</text>
<text x="690.0" y="127.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >one bearing:  F = Fpre · (δ/δ0)^1.5,  k = dF/dδ = 1.5 · F / δ</text>
<text x="690.0" y="150.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Fpre = 400 N, δ0 = 8 µm  →  k = 1.5 × 400 / 8 = 75 N/µm</text>
<text x="690.0" y="173.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >rigid TBT:  Fa = 800 · [(1 + x/8)^1.5 − (1 − x/8)^1.5]</text>
<text x="690.0" y="196.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >spring:      Fa = 800 · [(1 + x/8)^1.5 − 1]</text>
<text x="690.0" y="219.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >lift-off:    Fa = 2 · 400 · 2^1.5 = 2 263 N (x = δ0)</text>
<text x="690.0" y="242.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Worked example</text>
<text x="690.0" y="265.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >start stiffness rigid = 4 × 75 = 300 N/µm</text>
<text x="690.0" y="288.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >Fa = 2 kN:  rigid 6.93 µm (mean 289 N/µm)</text>
<text x="690.0" y="311.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >                spring 10.44 µm (about half as stiff)</text>
<text x="690.0" y="334.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >measured 160 N/µm  →  shaft, rings, nut, housing in series:</text>
<text x="690.0" y="357.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >1/160 = 1/300 + 1/k_rest  →  k_rest ≈ 343 N/µm</text>
<text x="690.0" y="380.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Preload classes (example 1 : 2 : 4)</text>
<text x="690.0" y="403.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >L 400 N: δ 8.0 µm, k 75 N/µm</text>
<text x="690.0" y="426.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >M 800 N: δ 12.7 µm, k 94 N/µm (+26 %), heat × 2</text>
<text x="690.0" y="449.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >H 1 600 N: δ 20.2 µm, k 119 N/µm (+59 %), heat × 4</text>
<text x="690.0" y="510.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Spacer error ε (+ = inner spacer too short):</text>
<text x="690.0" y="529.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >F = 400 · (1 + ε/8)^1.5:  −1 µm → 327 N,  +1 µm → 477 N,</text>
<text x="690.0" y="548.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >+2 µm → 559 N,  +6 µm (fault) → 926 N</text>
<rect x="680.0" y="600.0" width="480.0" height="74.0" fill="#fff" stroke="#000" stroke-width="1.2" />
