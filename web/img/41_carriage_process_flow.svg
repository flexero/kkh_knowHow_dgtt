<rect x="0" y="0" width="1200" height="830" fill="#fff"/>
<rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="20.0" y="30.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Carriage LB-25-FL – routing (20CrMo4 drawn block profile, carburised 58 – 62 HRC, 4 raceways ground in one set-up)</text>
<rect x="40.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="47.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 10</text>
<text x="229.0" y="86.0" font-size="11" text-anchor="end" fill="#000">LG-SAW</text>
<text x="47.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Cut the drawn block profile</text>
<text x="47.0" y="117.0" font-size="11" text-anchor="start" fill="#000">to 62 mm</text>
<text x="47.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 0.6 min</text>
<rect x="270.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="277.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 20</text>
<text x="459.0" y="86.0" font-size="11" text-anchor="end" fill="#000">LB-MC</text>
<text x="277.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Milling all faces + channel</text>
<text x="277.0" y="117.0" font-size="11" text-anchor="start" fill="#000">(tombstone 12)</text>
<text x="277.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 3.5 min</text>
<rect x="500.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="507.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 30</text>
<text x="689.0" y="86.0" font-size="11" text-anchor="end" fill="#000">LB-MC</text>
<text x="507.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Drill + tap 4 × M8, return</text>
<text x="507.0" y="117.0" font-size="11" text-anchor="start" fill="#000">holes Ø7 × 58, M3</text>
<text x="507.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 3.0 min</text>
<rect x="730.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="737.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 40</text>
<text x="919.0" y="86.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">HT-CAR</text>
<text x="737.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Carburise + harden + temper</text>
<text x="737.0" y="117.0" font-size="11" text-anchor="start" fill="#000">(200 per load)</text>
<text x="737.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 3.0 min</text>
<text x="919.0" y="142.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-LB-1</text>
<rect x="960.0" y="70.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="967.0" y="86.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 50</text>
<text x="1149.0" y="86.0" font-size="11" text-anchor="end" fill="#000">LB-SGR</text>
<text x="967.0" y="103.0" font-size="11" text-anchor="start" fill="#000">Grind base + reference side</text>
<text x="967.0" y="117.0" font-size="11" text-anchor="start" fill="#000">(magnetic)</text>
<text x="967.0" y="158.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 1.0 min</text>
<rect x="960.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="967.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 60</text>
<text x="1149.0" y="256.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">LB-RGR</text>
<text x="967.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Raceway grinding, form wheel,</text>
<text x="967.0" y="287.0" font-size="11" text-anchor="start" fill="#000">string of 10</text>
<text x="967.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 2.2 min</text>
<text x="1149.0" y="312.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-LB-2</text>
<rect x="730.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="737.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 70</text>
<text x="919.0" y="256.0" font-size="11" text-anchor="end" fill="#000">AS-WSH</text>
<text x="737.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Wash</text>
<text x="737.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 0.5 min</text>
<rect x="500.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="507.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 75</text>
<text x="689.0" y="256.0" font-size="11" text-anchor="end" fill="#000">QC-INC</text>
<text x="507.0" y="273.0" font-size="11" text-anchor="start" fill="#000">End caps + seals – injection</text>
<text x="507.0" y="287.0" font-size="11" text-anchor="start" fill="#000">moulded (incoming check)</text>
<text x="507.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 0.1 min</text>
<text x="689.0" y="312.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">BOUGHT</text>
<rect x="270.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="277.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 80</text>
<text x="459.0" y="256.0" font-size="11" text-anchor="end" fill="#000">AS-BAS</text>
<text x="277.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Assembly: pipes, retainers, 4</text>
<text x="277.0" y="287.0" font-size="11" text-anchor="start" fill="#000">× 30 balls, caps, seals</text>
<text x="277.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 4.0 min</text>
<rect x="40.0" y="240.0" width="196.0" height="96.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="47.0" y="256.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">op 90</text>
<text x="229.0" y="256.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QC-MAT</text>
<text x="47.0" y="273.0" font-size="11" text-anchor="start" fill="#000">Preload matching on the rail</text>
<text x="47.0" y="287.0" font-size="11" text-anchor="start" fill="#000">→ ball class Z1</text>
<text x="47.0" y="328.0" font-size="11" text-anchor="start" fill="#000" font-weight="bold">cycle 2.0 min</text>
<text x="229.0" y="312.0" font-size="11" text-anchor="end" fill="#1f6fd1" font-weight="bold">QG-LB-3</text>
<line x1="236.0" y1="118.0" x2="270.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="466.0" y1="118.0" x2="500.0" y2="118.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
