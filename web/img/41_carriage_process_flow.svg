<text x="820.0" y="760.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Carriage – process flow</text>
<text x="820.0" y="785.0" font-size="12" text-anchor="start" fill="#1f6fd1" font-weight="bold">EXAMPLE – check the machine maker's data</text>
<text x="820.0" y="812.0" font-size="11.5" text-anchor="start" fill="#000">Drawing 41-04</text>
<text x="1010.0" y="806.0" font-size="11" text-anchor="start" fill="#000">Scale: none (flow)</text>
<text x="1010.0" y="819.0" font-size="11" text-anchor="start" fill="#000">guide 41 §9</text>
