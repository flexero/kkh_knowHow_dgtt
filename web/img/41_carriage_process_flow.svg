<line x1="1058.0" y1="166.0" x2="1058.0" y2="240.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="960.0" y1="288.0" x2="926.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
