<line x1="500.0" y1="288.0" x2="466.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<line x1="270.0" y1="288.0" x2="236.0" y2="288.0" stroke="#000" stroke-width="1.3" marker-end="url(#ek)"/>
<rect x="40.0" y="430.0" width="730.0" height="22.0" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="446.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Item</text>
<line x1="270.0" y1="430.0" x2="270.0" y2="452.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="446.0" font-size="11.5" text-anchor="start" fill="#000" font-weight="bold">Value (example)</text>
<rect x="40.0" y="452.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="468.0" font-size="11.5" text-anchor="start" fill="#000">Σ cycle per block</text>
<line x1="270.0" y1="452.0" x2="270.0" y2="474.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="468.0" font-size="11.5" text-anchor="start" fill="#000">19.9 min incl. 0.1 min incoming check (op 75)</text>
<rect x="40.0" y="474.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="490.0" font-size="11.5" text-anchor="start" fill="#000">Takt (400 blocks / day)</text>
<line x1="270.0" y1="474.0" x2="270.0" y2="496.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="490.0" font-size="11.5" text-anchor="start" fill="#000">2.25 min per block</text>
<rect x="40.0" y="496.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="512.0" font-size="11.5" text-anchor="start" fill="#000">Drag force Z1</text>
<line x1="270.0" y1="496.0" x2="270.0" y2="518.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="512.0" font-size="11.5" text-anchor="start" fill="#000">≈ 10 – 20 N per block (example); outside → re-ball with the next class</text>
<rect x="40.0" y="518.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="534.0" font-size="11.5" text-anchor="start" fill="#000">Height variation of a pair</text>
<line x1="270.0" y1="518.0" x2="270.0" y2="540.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="534.0" font-size="11.5" text-anchor="start" fill="#000">≤ 15 µm (class H)</text>
<rect x="40.0" y="540.0" width="730.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="0.8"/>
<text x="45.0" y="556.0" font-size="11.5" text-anchor="start" fill="#000">Machines (400 / day)</text>
<line x1="270.0" y1="540.0" x2="270.0" y2="562.0" stroke="#000" stroke-width="0.8"/>
<text x="275.0" y="556.0" font-size="11.5" text-anchor="start" fill="#000">LB-MC 5 · HT-CAR 2 (shared with nuts) · LB-RGR 2 · AS-BAS 3 · QC-MAT 2</text>
<rect x="800.0" y="440.0" width="34.0" height="18.0" rx="4" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="2.2"/>
<text x="842.0" y="454.0" font-size="11.5" text-anchor="start" fill="#000">quality gate (QG-… feeds item 5 – quality)</text>
<rect x="800.0" y="466.0" width="34.0" height="18.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="842.0" y="480.0" font-size="11.5" text-anchor="start" fill="#000">operation: op no. · machine type id · name ·</text>
<text x="842.0" y="496.0" font-size="11.5" text-anchor="start" fill="#000">cycle per piece incl. load / unload (min)</text>
<text x="800.0" y="524.0" font-size="11.5" text-anchor="start" fill="#000">Dashed box: bought part (end caps, seals)</text>
<text x="800.0" y="540.0" font-size="11.5" text-anchor="start" fill="#000">– only an incoming check in our plant.</text>
<rect x="812.0" y="742.0" width="382.0" height="82.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="812.0" y1="768.0" x2="1194.0" y2="768.0" stroke="#000" stroke-width="0.8"/>
<line x1="812.0" y1="792.0" x2="1194.0" y2="792.0" stroke="#000" stroke-width="0.8"/>
