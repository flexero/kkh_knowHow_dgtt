 x2="50.0" y2="340.0" stroke="#000" stroke-width="1.2"/><text x="42.0" y="344.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">-5</text><line x1="45.0" y1="290.0" x2="50.0" y2="290.0" stroke="#000" stroke-width="1.2"/><text x="42.0" y="294.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">0</text><line x1="45.0" y1="240.0" x2="50.0" y2="240.0" stroke="#000" stroke-width="1.2"/><text x="42.0" y="244.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">+5</text><line x1="45.0" y1="190.0" x2="50.0" y2="190.0" stroke="#000" stroke-width="1.2"/><text x="42.0" y="194.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">+10</text><line x1="45.0" y1="140.0" x2="50.0" y2="140.0" stroke="#000" stroke-width="1.2"/><text x="42.0" y="144.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">+15</text><line x1="50.0" y1="130.0" x2="50.0" y2="400.0" stroke="#000" stroke-width="1.2" marker-end="url(#ar)"/><rect x="80.0" y="290.0" width="60.0" height="60.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><text x="110.0" y="366.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">bore P5</text><text x="110.0" y="380.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0 / −6</text><rect x="150.0" y="180.0" width="60.0" height="90.0" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2" fill-opacity="0.35"/><text x="180.0" y="174.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">shaft k5</text><text x="180.0" y="160.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">+2 / +11</text><line x1="222.0" y1="180.0" x2="222.0" y2="350.0" stroke="#1565c0" stroke-width="1.5" marker-end="url(#aa)" marker-start="url(#aa)"/><text x="228.0" y="270.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">U max</text><text x="228.0" y="284.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">17 µm</text><text x="80.0" y="90.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Inner ring on journal:</text><text x="80.0" y="106.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">interference 2 … 17 µm</text><text x="30.0" y="420.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Outer ring Ø52 H5 / OD P5:</text><text x="30.0" y="436.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">clearance 0 … 22 µm (cartridge)</text><text x="30.0" y="470.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Rotating inner ring + fixed load direction → interference;</text><text x="30.0" y="484.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">standing outer ring → clearance / transition.</text><rect x="380.0" y="50.0" width="380.0" height="440.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="380.0" y="50.0" width="304.0" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="385.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">B  Lamé – pressure and stress (max case)</text><circle cx="480.0" cy="190.0" r="67.2" fill="url(#hat)" stroke="#000" stroke-width="1.4"/><circle cx="480.0" cy="190.0" r="52.5" fill="#fff" stroke="#000" stroke-width="1.4"/><circle cx="480.0" cy="190.0" r="52.5" fill="#1565c0" stroke="#1565c0" stroke-width="1.2" fill-opacity="0.15"/><line x1="550.5" y1="190.0" x2="534.5" y2="190.0" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="541.1" y1="225.2" x2="527.2" y2="217.2" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="515.2" y1="251.1" x2="507.2" y2="237.2" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="480.0" y1="260.5" x2="480.0" y2="244.5" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="444.8" y1="251.1" x2="452.8" y2="237.2" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="418.9" y1="225.2" x2="432.8" y2="217.2" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="409.5" y1="190.0" x2="425.5" y2="190.0" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="418.9" y1="154.8" x2="432.8" y2="162.8" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="444.8" y1="128.9" x2="452.8" y2="142.8" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="480.0" y1="119.5" x2="480.0" y2="135.5" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="515.2" y1="128.9" x2="507.2" y2="142.8" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><line x1="541.1" y1="154.7" x2="527.2" y2="162.7" stroke="#1565c0" stroke-width="1.4" marker-end="url(#aa)"/><text x="560.0" y="140.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">p = 25.9 N/mm²</text><text x="560.0" y="156.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">on d = 25 mm</text><text x="560.0" y="180.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">ring D ≈ 32 mm</text><text x="560.0" y="196.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">(raceway shoulder)</text><text x="560.0" y="216.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">solid shaft: σr = σt = −p</text><line x1="440.0" y1="412.5" x2="730.0" y2="412.5" stroke="#000" stroke-width="0.8"/><line x1="440.0" y1="450.0" x2="440.0" y2="300.0" stroke="#000" stroke-width="1.2" marker-end="url(#ar)"/><line x1="440.0" y1="450.0" x2="740.0" y2="450.0" stroke="#000" stroke-width="1.2" marker-end="url(#ar)"/><text x="436.0" y="454.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">-40</text><text x="436.0" y="416.5" font-size="11" text-anchor="end" font-weight="normal" fill="#000">0</text><text x="436.0" y="379.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">40</text><text x="436.0" y="341.5" font-size="11" text-anchor="end" font-weight="normal" fill="#000">80</text><text x="436.0" y="304.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">120</text><text x="440.0" y="464.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0</text><text x="512.5" y="464.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">4</text><text x="585.0" y="464.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">8</text><text x="666.6" y="464.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">12.5</text><text x="730.0" y="464.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">16</text><text x="730.0" y="478.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">radius r (mm)</text><text x="446.0" y="304.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">σ (N/mm²)</text><line x1="440.0" y1="436.8" x2="666.6" y2="436.8" stroke="#000" stroke-width="1.8"/><polyline points="666.6,312.1 671.1,314.6 675.6,316.9 680.2,319.0 684.7,321.0 689.2,323.0 693.8,324.8 698.3,326.5 702.8,328.2 707.3,329.7 711.9,331.2 716.4,332.6 720.9,333.9 725.5,335.2 730.0,336.4" fill="none" stroke="#1565c0" stroke-width="2.2"/><polyline points="666.6,436.8 671.1,434.4 675.6,432.1 680.2,429.9 684.7,427.9 689.2,426.0 693.8,424.1 698.3,422.4 702.8,420.8 707.3,419.2 711.9,417.7 716.4,416.3 720.9,415.0 725.5,413.7 730.0,412.5" fill="none" stroke="#000" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="666.6" y1="450.0" x2="666.6" y2="300.0" stroke="#000" stroke-width="0.6" stroke-dasharray="2 2"/><text x="670.6" y="308.2" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">σt = 107</text><text x="728.0" y="328.6" font-size="11" text-anchor="end" font-weight="normal" fill="#1565c0">81</text><text x="458.1" y="430.8" font-size="11" text-anchor="start" font-weight="normal" fill="#000">shaft −25.9</text><text x="672.0" y="425.6" font-size="11" text-anchor="start" font-weight="normal" fill="#000">σr</text><rect x="780.0" y="50.0" width="350.0" height="440.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="780.0" y="50.0" width="185.6" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="785.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">C  Worked numbers (18.4)</text><text x="792.0" y="98.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Data</text><text x="792.0" y="116.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">d 25, D ≈ 32, L 15 mm, E 208 000 N/mm²</text><text x="792.0" y="134.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">μ 0.12, smoothing 0.4·(1.6+1.0) = 1.04 µm</text><text x="792.0" y="158.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Pressure</text><text x="792.0" y="176.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">p = E·U_eff/(2d)·(1 − (d/D)²)</text><text x="792.0" y="194.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">U 17 → U_eff 15.96 µm → p = 25.9 N/mm²</text><text x="792.0" y="212.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">U 11 → p 16.1; U 2 → p 1.6 N/mm²</text><text x="792.0" y="236.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Hoop stress</text><text x="792.0" y="254.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">σt = p·(D²+d²)/(D²−d²) = 107 N/mm²</text><text x="792.0" y="278.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Torque capacity</text><text x="792.0" y="296.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">T = μ·p·π·d²·L/2 = 45.7 / 28.5 / 2.7 N·m</text><text x="792.0" y="314.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">→ KM nut clamping is essential</text><text x="792.0" y="338.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Press force (cold)</text><text x="792.0" y="356.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">F = μ·p·π·d·L = 3.66 kN max</text><text x="792.0" y="374.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">never through the balls</text><text x="792.0" y="398.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">Heating</text><text x="792.0" y="416.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">ΔT = (U_max+s)/(α·d)</text><text x="792.0" y="434.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">= (0.017+0.010)/(12.5e-6·25) = 86 K</text><text x="792.0" y="452.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">→ ring ≈ 106 °C  (limit 110 °C)</text><text x="30.0" y="514.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Other fits of the table (18.2, µm, + clearance / − interference)</text><text x="40.0" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Ø300 H6 main bearing seat</text><text x="300.0" y="536.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">+32/0</text><text x="420.0" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">clearance – lower with J4</text><text x="40.0" y="556.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Ø80 H6 / h5 cartridge</text><text x="300.0" y="556.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">0 … +32</text><text x="420.0" y="556.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">push by hand</text><text x="40.0" y="576.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Ø160 H6 / js5 wheel spigot</text><text x="300.0" y="576.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">−9 … +34</text><text x="420.0" y="576.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">slide on, dowels locate</text><text x="40.0" y="596.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Ø10 m6 dowel / H7</text><text x="300.0" y="596.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">−15 … +9</text><text x="420.0" y="596.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">press ≈ 9.6 kN max</text><text x="40.0" y="616.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Ø335 bronze rim (guide 12)</text><text x="300.0" y="616.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">−185 … −215</text><text x="420.0" y="616.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">shrink ≈ 109 °C</text><rect x="670.0" y="646.0" width="470.0" height="64.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><line x1="670.0" y1="668.0" x2="1140.0" y2="668.0" stroke="#000" stroke-width="1.2"/><line x1="670.0" y1="689.0" x2="1140.0" y2="689.0" stroke="#000" stroke-width="1.2"/><text x="678.0" y="662.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Interference fit – Lamé, fit zones, worked numbers</text><text x="678.0" y="683.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the maker's documentation</text><text x="678.0" y="704.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">17_interference_fit.svg · Guide 17 · twin example values · not to scale</text></svg>