<text x="38.0" y="646.8" font-size="15" text-anchor="start" font-weight="700" fill="#000">Example: 2 000 cartons BOX-FABS from S-2008 (web shop, HTTP)</text>
<text x="38.0" y="665.8" font-size="15" text-anchor="start" fill="#000">AQL 1.0, lot 2 000 → code K → sample n = 125, accept ≤ 3, reject ≥ 4</text>
<text x="38.0" y="684.8" font-size="15" text-anchor="start" fill="#000">PPV = (PO price − std price) × qty = (3.50 − 3.50) × 2 000 = 0 €</text>
<text x="38.0" y="703.8" font-size="15" text-anchor="start" fill="#000">moving average: (400 m × 14.40 + 400 m × 14.10) / 800 m = 14.25 €/m</text>
