<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Arial, Helvetica, sans-serif">
<title>DAQ signal chain</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.6"/></pattern><pattern id="hat2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.6"/></pattern></defs>
<rect x="0" y="0" width="1400" height="900" fill="#fff"/>
<text x="20.0" y="30.0" font-size="15" text-anchor="start" fill="#000" font-weight="bold">Data acquisition signal chain – from the sensor to the live twin (example values)</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" fill="#000">fast lane: vibration (51.2 kS/s per channel) → features at the edge; slow lane: temperatures, flow, speed (1–10 Hz) → PLC → twin</text>
<rect x="20.0" y="110.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="95.0" y="139.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Accelerometer A1/A2</text>
<text x="95.0" y="152.8" font-size="11" text-anchor="middle" fill="#000">IEPE 100 mV/g</text>
<text x="95.0" y="166.6" font-size="11" text-anchor="middle" fill="#000">0.5 Hz–10 kHz (±3 dB)</text>
<rect x="200.0" y="110.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="275.0" y="139.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Signal conditioning</text>
<text x="275.0" y="152.8" font-size="11" text-anchor="middle" fill="#000">IEPE 2–4 mA constant</text>
<text x="275.0" y="166.6" font-size="11" text-anchor="middle" fill="#000">current, AC coupling</text>
<rect x="380.0" y="110.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="455.0" y="139.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Anti-alias filter</text>
<text x="455.0" y="152.8" font-size="11" text-anchor="middle" fill="#000">analog + digital,</text>
<text x="455.0" y="166.6" font-size="11" text-anchor="middle" fill="#000">cut-off ≈ 0.45·fs</text>
<rect x="560.0" y="110.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="635.0" y="139.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">ADC 24-bit ΔΣ</text>
<text x="635.0" y="152.8" font-size="11" text-anchor="middle" fill="#000">fs = 51.2 kS/s</text>
<text x="635.0" y="166.6" font-size="11" text-anchor="middle" fill="#000">simultaneous channels</text>
<rect x="740.0" y="110.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="815.0" y="139.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Block N = 65 536</text>
<text x="815.0" y="152.8" font-size="11" text-anchor="middle" fill="#000">T = N/fs = 1.28 s</text>
<text x="815.0" y="166.6" font-size="11" text-anchor="middle" fill="#000">Hann window, 67 % overlap</text>
<rect x="920.0" y="110.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="995.0" y="139.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">FFT</text>
<text x="995.0" y="152.8" font-size="11" text-anchor="middle" fill="#000">Δf = fs/N = 0.78 Hz</text>
<text x="995.0" y="166.6" font-size="11" text-anchor="middle" fill="#000">f_max = fs/2.56 = 20 kHz</text>
<line x1="170.0" y1="149.0" x2="200.0" y2="149.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="350.0" y1="149.0" x2="380.0" y2="149.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="530.0" y1="149.0" x2="560.0" y2="149.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="710.0" y1="149.0" x2="740.0" y2="149.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="890.0" y1="149.0" x2="920.0" y2="149.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="1100.0" y="110.0" width="170.0" height="78.0" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.8"/>
<text x="1185.0" y="139.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Features (edge PC)</text>
<text x="1185.0" y="152.8" font-size="11" text-anchor="middle" fill="#000">v RMS 10–1000 Hz,</text>
<text x="1185.0" y="166.6" font-size="11" text-anchor="middle" fill="#000">a peak, envelope BPFO/BPFI</text>
<line x1="1070.0" y1="149.0" x2="1100.0" y2="149.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560.0" y="240.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="635.0" y="269.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Band-pass</text>
<text x="635.0" y="282.9" font-size="11" text-anchor="middle" fill="#000">5–20 kHz</text>
<text x="635.0" y="296.6" font-size="11" text-anchor="middle" fill="#000">(resonance band)</text>
<rect x="740.0" y="240.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="815.0" y="269.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Rectify + low-pass</text>
<text x="815.0" y="282.9" font-size="11" text-anchor="middle" fill="#000">= envelope</text>
<text x="815.0" y="296.6" font-size="11" text-anchor="middle" fill="#000">(demodulation)</text>
<rect x="920.0" y="240.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="995.0" y="269.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Envelope FFT</text>
<text x="995.0" y="282.9" font-size="11" text-anchor="middle" fill="#000">BPFO 1761, BPFI 2239,</text>
<text x="995.0" y="296.6" font-size="11" text-anchor="middle" fill="#000">BSF 798, FTF 88 Hz</text>
<line x1="635.0" y1="188.0" x2="635.0" y2="240.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="710.0" y1="279.0" x2="740.0" y2="279.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="890.0" y1="279.0" x2="920.0" y2="279.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="1070.0,279.0 1085.0,279.0 1085.0,174.0 1100.0,174.0" fill="none" stroke="#1565c0" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arA)"/>
<text x="640.0" y="218.0" font-size="11" text-anchor="middle" fill="#000">branch</text>
<rect x="20.0" y="400.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="95.0" y="429.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Pt100 T1–T5</text>
<text x="95.0" y="442.9" font-size="11" text-anchor="middle" fill="#000">4-wire, class A</text>
<text x="95.0" y="456.6" font-size="11" text-anchor="middle" fill="#000">1 mA excitation</text>
<rect x="200.0" y="400.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="275.0" y="429.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">RTD input module</text>
<text x="275.0" y="442.9" font-size="11" text-anchor="middle" fill="#000">24-bit, 1–10 S/s</text>
<text x="275.0" y="456.6" font-size="11" text-anchor="middle" fill="#000">(e.g. NI 9216 / F-RTD)</text>
<rect x="20.0" y="510.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="95.0" y="539.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Flow FT-101, PT-101</text>
<text x="95.0" y="552.9" font-size="11" text-anchor="middle" fill="#000">4–20 mA</text>
<text x="95.0" y="566.6" font-size="11" text-anchor="middle" fill="#000"></text>
<rect x="200.0" y="510.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="275.0" y="539.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">AI module 4–20 mA</text>
<text x="275.0" y="552.9" font-size="11" text-anchor="middle" fill="#000">16-bit, 10 S/s</text>
<text x="275.0" y="566.6" font-size="11" text-anchor="middle" fill="#000">in the PLC rack</text>
<rect x="20.0" y="620.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="95.0" y="649.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Drive encoder</text>
<text x="95.0" y="662.9" font-size="11" text-anchor="middle" fill="#000">sin/cos 1 Vpp</text>
<text x="95.0" y="676.6" font-size="11" text-anchor="middle" fill="#000">+ SMC module</text>
<rect x="200.0" y="620.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="275.0" y="649.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">SINAMICS S120</text>
<text x="275.0" y="662.9" font-size="11" text-anchor="middle" fill="#000">speed actual,</text>
<text x="275.0" y="676.6" font-size="11" text-anchor="middle" fill="#000">torque, current</text>
<rect x="20.0" y="730.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="95.0" y="759.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Capacitive probes PRB-01</text>
<text x="95.0" y="772.9" font-size="11" text-anchor="middle" fill="#000">±10 V, 0.1 µm,</text>
<text x="95.0" y="786.6" font-size="11" text-anchor="middle" fill="#000">≥ 2 kHz bandwidth</text>
<rect x="200.0" y="730.0" width="150.0" height="78.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="275.0" y="759.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">DAQ AI ±10 V</text>
<text x="275.0" y="772.9" font-size="11" text-anchor="middle" fill="#000">24-bit, 1–50 kS/s</text>
<text x="275.0" y="786.6" font-size="11" text-anchor="middle" fill="#000">runout + growth</text>
<line x1="170.0" y1="439.0" x2="200.0" y2="439.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="170.0" y1="549.0" x2="200.0" y2="549.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="170.0" y1="659.0" x2="200.0" y2="659.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="170.0" y1="769.0" x2="200.0" y2="769.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="450.0" y="510.0" width="170.0" height="100.0" rx="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="535.0" y="550.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">PLC S7-1500F</text>
<text x="535.0" y="563.9" font-size="11" text-anchor="middle" fill="#000">scaling, limits,</text>
<text x="535.0" y="577.6" font-size="11" text-anchor="middle" fill="#000">interlocks, stop rules</text>
<line x1="350.0" y1="439.0" x2="450.0" y2="540.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="350.0" y1="549.0" x2="450.0" y2="560.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="350.0" y1="659.0" x2="450.0" y2="580.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="350.0,769.0 420.0,769.0 420.0,810.0 1385.0,810.0 1385.0,303.0 1270.0,303.0" fill="none" stroke="#000" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="900.0" y="804.0" font-size="11" text-anchor="middle" fill="#000">PRB-01 runout / growth values → edge PC → twin</text>
<rect x="700.0" y="510.0" width="180.0" height="100.0" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.8"/>
<text x="790.0" y="550.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Modbus TCP server</text>
<text x="790.0" y="563.9" font-size="11" text-anchor="middle" fill="#000">RUN-01 registers 0–9,</text>
<text x="790.0" y="577.6" font-size="11" text-anchor="middle" fill="#000">100–102 (map ch. 6.2)</text>
<line x1="620.0" y1="560.0" x2="700.0" y2="560.0" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="1100.0" y="258.0" width="170.0" height="90.0" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.8"/>
<text x="1185.0" y="293.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Edge PC gateway</text>
<text x="1185.0" y="306.9" font-size="11" text-anchor="middle" fill="#000">OPC UA client/server,</text>
<text x="1185.0" y="320.6" font-size="11" text-anchor="middle" fill="#000">MQTT publish</text>
<line x1="1185.0" y1="188.0" x2="1185.0" y2="258.0" stroke="#1565c0" stroke-width="1.4" marker-end="url(#arA)"/>
<rect x="1000.0" y="560.0" width="200.0" height="100.0" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.8"/>
<text x="1100.0" y="600.1" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Station twin</text>
<text x="1100.0" y="613.9" font-size="11" text-anchor="middle" fill="#000">server.py → SpindleStation</text>
<text x="1100.0" y="627.6" font-size="11" text-anchor="middle" fill="#000">/api/spst · spstation.db</text>
<line x1="880.0" y1="585.0" x2="1000.0" y2="605.0" stroke="#1565c0" stroke-width="1.4" marker-end="url(#arA)"/>
<text x="940.0" y="575.0" font-size="11" text-anchor="middle" fill="#1565c0">FC 3 read / FC 6 write</text>
<line x1="1185.0" y1="348.0" x2="1120.0" y2="560.0" stroke="#1565c0" stroke-width="1.4" marker-end="url(#arA)"/>
<text x="1200.0" y="520.0" font-size="11" text-anchor="start" fill="#1565c0">HTTP POST /api/spst/ingest</text>
<text x="1200.0" y="534.0" font-size="11" text-anchor="start" fill="#1565c0">or MQTT vc/asm/ASSY-SP1/…</text>
<line x1="1000.0" y1="640.0" x2="880.0" y2="590.0" stroke="#1565c0" stroke-width="1.4" marker-end="url(#arA)"/>
<text x="990.0" y="662.0" font-size="11" text-anchor="end" fill="#1565c0">rpm_set → reg. 100 (FC 6)</text>
<text x="450.0" y="675.0" font-size="11" text-anchor="start" fill="#000">Rules of thumb (example):</text>
<text x="450.0" y="692.0" font-size="11" text-anchor="start" fill="#000">• fs ≥ 2.56 × highest frequency of interest; anti-alias filter before the ADC</text>
<text x="450.0" y="709.0" font-size="11" text-anchor="start" fill="#000">• Δf = fs / N; for side bands of ±200 Hz Δf ≤ 5 Hz is enough → N = 16 384 (0.32 s)</text>
<text x="450.0" y="726.0" font-size="11" text-anchor="start" fill="#000">• store raw data only on events (alarm, end of run-in); send features every 1 s</text>
<text x="450.0" y="743.0" font-size="11" text-anchor="start" fill="#000">• 4 ch × 51.2 kS/s × 24 bit ≈ 4.9 Mbit/s raw – do not send this to the twin</text>
<text x="450.0" y="760.0" font-size="11" text-anchor="start" fill="#000">• time-stamp at the source; NTP / PTP clock in the cell</text>
<rect x="920.0" y="828.0" width="470.0" height="62.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<line x1="920.0" y1="850.0" x2="1390.0" y2="850.0" stroke="#000" stroke-width="0.8"/>
<text x="928.0" y="844.0" font-size="12" text-anchor="start" fill="#1565c0" font-weight="bold">EXAMPLE – check the maker&#x27;s documentation</text>
<text x="928.0" y="866.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">20_daq_signal_chain – sensor → ADC → FFT → OPC UA/MQTT → twin</text>
<text x="928.0" y="882.0" font-size="11" text-anchor="start" fill="#000">Guide 20 – spindle station live twin · values: examples from the guide / app</text>
