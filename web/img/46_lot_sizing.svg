<text x="48.0" y="659.0" font-size="13" text-anchor="start" fill="#000">EOQ = √(2 × D × S / H) = √(2 × 587.5 × 400 / 0.48) = 989.5 pcs</text>
<text x="48.0" y="676.0" font-size="13" text-anchor="start" fill="#000">POQ: P = round(EOQ / mean demand) = round(1.68) = 2 weeks</text>
<text x="48.0" y="693.0" font-size="13" text-anchor="start" fill="#000">EOQ assumes even demand – with lumpy weeks POQ or L4L are often better.</text>
<text x="48.0" y="710.0" font-size="13" text-anchor="start" fill="#000">Make items: S = Σ set-up minutes × machine hour rate of the route.</text>
