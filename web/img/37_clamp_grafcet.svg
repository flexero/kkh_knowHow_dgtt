<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>GRAFCET – clamp, then work</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="10" y="10" width="1180" height="810" fill="none" stroke="#000" stroke-width="1.4"/><text x="30" y="40" font-size="18" text-anchor="start" fill="#000" font-weight="bold">6 · GRAFCET (IEC 60848) of program 2 – clamp, then work, with pressure switch 1S1</text><text x="30" y="62" font-size="12.5" text-anchor="start" fill="#333">Each square = one step bit (M0 … M5 / %M20.0 …). Transition = condition under the step. SET the next step, RST the own step (networks 3–8).</text><rect x="160" y="100" width="90" height="44" rx="0" fill="none" stroke="#000" stroke-width="2"/><rect x="164" y="104" width="82" height="36" rx="0" fill="none" stroke="#000" stroke-width="1.2"/><text x="205.0" y="128" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">0</text><line x1="250" y1="122.0" x2="280" y2="122.0" stroke="#000" stroke-width="1.5"/><rect x="280" y="104" width="330" height="36" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1"/><text x="290" y="127" font-size="12" text-anchor="start" fill="#000" font-weight="bold">idle (no step active)</text><line x1="205.0" y1="144" x2="205.0" y2="184" stroke="#000" stroke-width="1.5"/><line x1="187.0" y1="164" x2="223.0" y2="164" stroke="#000" stroke-width="2.5"/><text x="231.0" y="169" font-size="11" text-anchor="start" fill="#000">S_CYC rising · auto · HPU_RDY · GUARD · PART · 1B1 · 2B1 · no fault</text><rect x="160" y="184" width="90" height="44" rx="0" fill="none" stroke="#000" stroke-width="2"/><text x="205.0" y="212" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">1</text><line x1="250" y1="206.0" x2="280" y2="206.0" stroke="#000" stroke-width="1.5"/><rect x="280" y="188" width="330" height="36" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1"/><text x="290" y="211" font-size="12" text-anchor="start" fill="#000" font-weight="bold">1Y1 clamp</text><text x="630" y="211" font-size="10.5" text-anchor="start" fill="#0b5ea8">T_TO1 2 s</text><line x1="205.0" y1="228" x2="205.0" y2="268" stroke="#000" stroke-width="1.5"/><line x1="187.0" y1="248" x2="223.0" y2="248" stroke="#000" stroke-width="2.5"/><text x="231.0" y="253" font-size="11" text-anchor="start" fill="#000">1S1 (≥ 4.5 MPa) · NOT 1B1 · for 0.3 s</text><rect x="160" y="268" width="90" height="44" rx="0" fill="none" stroke="#000" stroke-width="2"/><text x="205.0" y="296" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">2</text><line x1="250" y1="290.0" x2="280" y2="290.0" stroke="#000" stroke-width="1.5"/><rect x="280" y="272" width="330" height="36" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1"/><text x="290" y="295" font-size="12" text-anchor="start" fill="#000" font-weight="bold">1Y1 + 2Y1 extend</text><text x="630" y="295" font-size="10.5" text-anchor="start" fill="#0b5ea8">T_TO2 3 s · 2Y1 only with 1S1</text><line x1="205.0" y1="312" x2="205.0" y2="352" stroke="#000" stroke-width="1.5"/><line x1="187.0" y1="332" x2="223.0" y2="332" stroke="#000" stroke-width="2.5"/><text x="231.0" y="337" font-size="11" text-anchor="start" fill="#000">2B2 (extended)</text><rect x="160" y="352" width="90" height="44" rx="0" fill="none" stroke="#000" stroke-width="2"/><text x="205.0" y="380" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">3</text><line x1="250" y1="374.0" x2="280" y2="374.0" stroke="#000" stroke-width="1.5"/><rect x="280" y="356" width="330" height="36" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1"/><text x="290" y="379" font-size="12" text-anchor="start" fill="#000" font-weight="bold">1Y1 · dwell 1.0 s</text><line x1="205.0" y1="396" x2="205.0" y2="436" stroke="#000" stroke-width="1.5"/><line x1="187.0" y1="416" x2="223.0" y2="416" stroke="#000" stroke-width="2.5"/><text x="231.0" y="421" font-size="11" text-anchor="start" fill="#000">T_DWELL 1.0 s</text><rect x="160" y="436" width="90" height="44" rx="0" fill="none" stroke="#000" stroke-width="2"/><text x="205.0" y="464" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">4</text><line x1="250" y1="458.0" x2="280" y2="458.0" stroke="#000" stroke-width="1.5"/><rect x="280" y="440" width="330" height="36" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1"/><text x="290" y="463" font-size="12" text-anchor="start" fill="#000" font-weight="bold">1Y1 + 2Y2 retract</text><text x="630" y="463" font-size="10.5" text-anchor="start" fill="#0b5ea8">T_TO4 3 s</text><line x1="205.0" y1="480" x2="205.0" y2="520" stroke="#000" stroke-width="1.5"/><line x1="187.0" y1="500" x2="223.0" y2="500" stroke="#000" stroke-width="2.5"/><text x="231.0" y="505" font-size="11" text-anchor="start" fill="#000">2B1 (home)</text><rect x="160" y="520" width="90" height="44" rx="0" fill="none" stroke="#000" stroke-width="2"/><text x="205.0" y="548" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">5</text><line x1="250" y1="542.0" x2="280" y2="542.0" stroke="#000" stroke-width="1.5"/><rect x="280" y="524" width="330" height="36" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1"/><text x="290" y="547" font-size="12" text-anchor="start" fill="#000" font-weight="bold">1Y2 unclamp</text><text x="630" y="547" font-size="10.5" text-anchor="start" fill="#0b5ea8">T_TO5 2 s</text><line x1="205.0" y1="564" x2="205.0" y2="604" stroke="#000" stroke-width="1.5"/><line x1="187.0" y1="584" x2="223.0" y2="584" stroke="#000" stroke-width="2.5"/><text x="231.0" y="589" font-size="11" text-anchor="start" fill="#000">1B1 open · NOT 1S1  → counter C_PARTS + 1</text><polyline points="205.0,604 110,604 110,80 205.0,80 205.0,100" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><line x1="205.0" y1="86" x2="205.0" y2="99" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="720" y="520" width="440" height="190" rx="0" fill="#fff" stroke="#b3261e" stroke-width="1.2"/><text x="730" y="540" font-size="12" text-anchor="start" fill="#b3261e" font-weight="bold">Fault reactions (networks 9 + 10)</text><text x="730" y="562" font-size="11" text-anchor="start" fill="#000">1S1 lost in step 2/3 for 0.1 s → AL_CLP, jump to step 4</text><text x="730" y="582" font-size="11" text-anchor="start" fill="#000">  (retract, the clamp stays ON – never unclamp with the tool in)</text><text x="730" y="602" font-size="11" text-anchor="start" fill="#000">Stop button in step 2/3 → step 4 (retract), then normal end</text><text x="730" y="622" font-size="11" text-anchor="start" fill="#000">Step time-out → AL_TO; the step stays active</text><text x="730" y="642" font-size="11" text-anchor="start" fill="#000">Manual + ack → all steps reset → step 0</text><text x="730" y="662" font-size="11" text-anchor="start" fill="#000">Clamp pressure &gt; 5.5 MPa for 1 s → AL_PHI</text><text x="730" y="682" font-size="11" text-anchor="start" fill="#000">No cycle start while any alarm is latched (M_FLT)</text><text x="30" y="730" font-size="11" text-anchor="start" fill="#000" font-weight="bold">SCL equivalent (TIA Portal, one INT step number instead of 6 bits):</text><text x="30" y="748" font-size="11" text-anchor="start" fill="#000">CASE #Step OF 0: IF #Start THEN #Step := 1; END_IF;  1: IF "1S1" AND #T_Stab.Q THEN #Step := 2; END_IF;  … END_CASE;</text><rect x="770" y="760" width="420" height="60" fill="#fff" stroke="#000" stroke-width="1"/><line x1="770" y1="782" x2="1190" y2="782" stroke="#000" stroke-width="0.8"/><text x="778" y="776" font-size="12" font-weight="bold">GRAFCET – clamp, then work</text><text x="778" y="798" font-size="10.5">program 2, step chain with pressure switch 1S1</text><text x="778" y="813" font-size="10.5" fill="#0b5ea8">Guide 37 · page 6 · EXAMPLE – check with your PLC configuration</text></svg>
