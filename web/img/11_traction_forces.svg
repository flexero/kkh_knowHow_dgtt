<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" width="1500" height="980" font-family="Arial, Helvetica, sans-serif">
<title>Traction forces of the 1 t pallet AGV P1000 – free-body diagram and sizing (example)</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1500" height="980" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="18" text-anchor="start" fill="#000" font-weight="bold">Traction and motor sizing – 1 t pallet AGV P1000 (item 3), worked example of §20</text>
<text x="24.0" y="52.0" font-size="12" text-anchor="start" fill="#444">m = 545 kg empty + 510 kg pallet = 1055 kg · c_rr 0.015 · slope 1 % · a = 0.3 m/s² · wheel Ø200 · i = 30 · η 0.9 · 2 × 400 W (1.27 / 3.8 Nm)</text>
<text x="24.0" y="90.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Free-body diagram (uphill, accelerating). Slope drawn 5° – real 1 % = 0.57°</text>
<g transform="rotate(-5.0 120 520)">
<line x1="50.0" y1="520.0" x2="680.0" y2="520.0" stroke="#000" stroke-width="1.8" />
<rect x="50.0" y="520.0" width="630.0" height="10.0" rx="0" fill="url(#hatch)" stroke="none" stroke-width="0" />
<rect x="180.0" y="430.0" width="288.0" height="81.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.8" />
<line x1="240.0" y1="430.0" x2="408.0" y2="370.0" stroke="#000" stroke-width="1.4" />
<line x1="240.0" y1="370.0" x2="408.0" y2="430.0" stroke="#000" stroke-width="1.4" />
<rect x="240.0" y="325.0" width="168.0" height="45.0" rx="0" fill="#d0d0d0" stroke="#000" stroke-width="1.2" />
<rect x="249.0" y="169.0" width="150.0" height="156.0" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="1.2" />
<text x="324.0" y="161.0" font-size="11" text-anchor="middle" fill="#000">pallet + workpiece 510 kg</text>
<circle cx="216.0" cy="497.5" r="22.5" fill="#fff" stroke="#000" stroke-width="1.2"/>
<circle cx="432.0" cy="497.5" r="22.5" fill="#fff" stroke="#000" stroke-width="1.2"/>
<circle cx="324.0" cy="490.0" r="30.0" fill="#000" stroke="#000" stroke-width="1"/>
<circle cx="324.0" cy="341.8" r="9.0" fill="#fff" stroke="#000" stroke-width="1.6"/>
