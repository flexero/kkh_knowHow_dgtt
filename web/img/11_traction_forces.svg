<rect x="1040.0" y="124.0" width="14.0" height="12.0" rx="0" fill="#9e9e9e" stroke="#000" stroke-width="1.2" />
<text x="1060.0" y="135.0" font-size="11" text-anchor="start" fill="#000">continuous (rolling + slope)</text>
<text x="780.0" y="514.0" font-size="12" text-anchor="start" fill="#000">Reading: the 400 W motor is fine up to 2 %. On a 4 % ramp the continuous torque</text>
<text x="780.0" y="532.0" font-size="12" text-anchor="start" fill="#000">(1.05 Nm) is above the 80 % limit → keep ramps short (&lt; 10 s) or use 750 W.</text>
<text x="780.0" y="550.0" font-size="12" text-anchor="start" fill="#000">Downhill braking grip (loaded, μ 0.35): 1.72 / 1.62 / 1.52 / 1.32 / 1.13 m/s²</text>
<text x="780.0" y="568.0" font-size="12" text-anchor="start" fill="#000">at 0 / 1 / 2 / 4 / 6 % – the safety field must use the smaller value (§23.3).</text>
<rect x="780.0" y="640.0" width="700.0" height="200.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2" />
<text x="792.0" y="664.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Floor step or joint of height h – force to roll over it</text>
<text x="792.0" y="686.0" font-size="12" text-anchor="start" fill="#000">F = N · √(2·r·h − h²) / (r − h)      (wheel radius r, wheel load N, slow speed)</text>
<text x="792.0" y="712.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">h</text>
<text x="850.0" y="712.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">castor Ø150, N 1293 N</text>
<text x="1070.0" y="712.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">drive Ø200: F/N needed</text>
<text x="1280.0" y="712.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">result</text>
<text x="792.0" y="734.0" font-size="12" text-anchor="start" fill="#000">2 mm</text>
<text x="850.0" y="734.0" font-size="12" text-anchor="start" fill="#000">305 N</text>
<text x="1070.0" y="734.0" font-size="12" text-anchor="start" fill="#000">0.203 &lt; μ 0.35</text>
<text x="1280.0" y="734.0" font-size="12" text-anchor="start" fill="#000">ok</text>
<text x="792.0" y="756.0" font-size="12" text-anchor="start" fill="#000">5 mm</text>
<text x="850.0" y="756.0" font-size="12" text-anchor="start" fill="#000">497 N</text>
<text x="1070.0" y="756.0" font-size="12" text-anchor="start" fill="#000">0.329 ≈ μ 0.35</text>
<text x="1280.0" y="756.0" font-size="12" text-anchor="start" fill="#000">limit – slow down</text>
<text x="792.0" y="778.0" font-size="12" text-anchor="start" fill="#000">10 mm</text>
<text x="850.0" y="778.0" font-size="12" text-anchor="start" fill="#000">744 N</text>
<text x="1070.0" y="778.0" font-size="12" text-anchor="start" fill="#000">0.484 &gt; μ 0.35</text>
<text x="1280.0" y="778.0" font-size="12" text-anchor="start" fill="#c62828">drive wheel slips ✗</text>
<text x="792.0" y="810.0" font-size="12" text-anchor="start" fill="#000">Rule: floor joints, rails and door sills ≤ 3 mm, chamfered; one castor on a 5 mm step</text>
<text x="792.0" y="828.0" font-size="12" text-anchor="start" fill="#000">needs 497 N – almost the whole 575 N drive force.</text>
