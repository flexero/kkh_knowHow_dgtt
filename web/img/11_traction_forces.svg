<text x="338.0" y="333.8" font-size="11" text-anchor="start" fill="#000">CoG 594 mm</text>
<line x1="324.0" y1="517.0" x2="474.0" y2="517.0" stroke="#c62828" stroke-width="3" marker-end="url(#ar)" />
<text x="484.0" y="512.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">F_t = 575 N</text>
<line x1="314.0" y1="341.8" x2="194.0" y2="341.8" stroke="#c62828" stroke-width="2" marker-end="url(#ar)" />
<text x="190.0" y="359.8" font-size="11" text-anchor="start" fill="#c62828">m·a = 316 N (inertia)</text>
<line x1="256.0" y1="546.0" x2="176.0" y2="546.0" stroke="#000" stroke-width="1.4" marker-end="url(#ak)" />
<text x="172.0" y="550.0" font-size="11" text-anchor="end" fill="#000">F_r = 155 N</text>
<line x1="216.0" y1="578.0" x2="216.0" y2="522.0" stroke="#000" stroke-width="1.6" marker-end="url(#ak)" />
<text x="216.0" y="592.0" font-size="11" text-anchor="middle" fill="#000">N_c 2 × 1293 N</text>
<line x1="432.0" y1="578.0" x2="432.0" y2="522.0" stroke="#000" stroke-width="1.6" marker-end="url(#ak)" />
<text x="432.0" y="592.0" font-size="11" text-anchor="middle" fill="#000">N_c 2 × 1293 N</text>
<line x1="324.0" y1="578.0" x2="324.0" y2="522.0" stroke="#000" stroke-width="1.6" marker-end="url(#ak)" />
<text x="324.0" y="592.0" font-size="11" text-anchor="middle" fill="#000">N_d 2 × 2587 N</text>
</g>
<line x1="307.7" y1="324.7" x2="307.7" y2="434.7" stroke="#000" stroke-width="2" marker-end="url(#ak)" />
<line x1="309.7" y1="384.7" x2="470.0" y2="250.0" stroke="#000" stroke-width="0.7" />
<text x="474.0" y="248.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">m·g = 10347 N (vertical)</text>
<text x="474.0" y="264.0" font-size="11" text-anchor="start" fill="#000">slope part F_s = m·g·sin(atan 0.01) = 103 N</text>
<text x="720.0" y="420.0" font-size="12" text-anchor="end" fill="#000">uphill →</text>
<text x="30.0" y="626.0" font-size="11" text-anchor="start" fill="#000">F_r = c_rr · m · g acts at all 6 wheels (shown once). Castor loads with the 50 % drive share of the twin.</text>
<rect x="24.0" y="640.0" width="700.0" height="320.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.2" />
<text x="36.0" y="664.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Worked numbers (guide §20.2 – verified with Python)</text>
<text x="36.0" y="690.0" font-size="12" text-anchor="start" fill="#000">Rolling      F_r = 0.015 · 1055 · 9.81       =    155 N</text>
<text x="36.0" y="711.0" font-size="12" text-anchor="start" fill="#000">Slope 1 %    F_s = 0.01 · 1055 · 9.81        =    103 N</text>
<text x="36.0" y="732.0" font-size="12" text-anchor="start" fill="#000">Accelerate   F_a = 1055 · 0.3                =    316 N</text>
<text x="36.0" y="753.0" font-size="12" text-anchor="start" fill="#000">Peak         F   = F_r + F_s + F_a           =    575 N  → 288 N per drive wheel</text>
<text x="36.0" y="774.0" font-size="12" text-anchor="start" fill="#000">Wheel speed  n = 1.0 · 60 / (π · 0.2) = 95.5 rpm → i ≤ 3000/95.5/0.97 = 32.4 → i = 30</text>
<text x="36.0" y="795.0" font-size="12" text-anchor="start" fill="#000">Motor peak   T = 288 · 0.1 / (30 · 0.9) = 1.07 Nm   ≤ 0.8 · 3.8 = 3.04 ✓</text>
<text x="36.0" y="816.0" font-size="12" text-anchor="start" fill="#000">Motor cont.  T = (155 + 103) / 2 · 0.1 / 27 = 0.48 Nm ≤ 0.8 · 1.27 = 1.02 ✓</text>
<text x="36.0" y="837.0" font-size="12" text-anchor="start" fill="#000">RMS (one part cycle 174 s, 4 starts, 4 stops)  T_rms = 0.33 Nm ✓</text>
<text x="36.0" y="858.0" font-size="12" text-anchor="start" fill="#000">Grip loaded  μ·N_d = 0.35 · 5173 = 1811 N ≥ 1.3 · 575 → ×3.15 ✓</text>
<text x="36.0" y="879.0" font-size="12" text-anchor="start" fill="#000">Grip empty   0.35 · 2672 = 935 N vs 297 N → ×3.15; wheel spins above</text>
<text x="36.0" y="900.0" font-size="12" text-anchor="start" fill="#000">             1.66 Nm motor torque (44 % of peak) → current limit / ramps</text>
<text x="36.0" y="921.0" font-size="12" text-anchor="start" fill="#000">Rotating parts add ≈ 13.5 kg equivalent mass (1.3 %) – ignored</text>
<style>text{white-space:pre}</style>
