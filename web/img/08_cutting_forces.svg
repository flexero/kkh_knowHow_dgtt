<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Cutting forces, power and torque – face milling, drilling and the spindle power curve (GG25)</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1100" height="790" fill="#ffffff"/>
<rect x="6" y="6" width="1088" height="778" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">Cutting forces, power and torque – face milling, drilling and the spindle power curve (GG25)</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#000">Kienzle kc = kc1.1 · h^−mc with kc1.1 = 1 150 N/mm², mc = 0.26 (EN-GJL-250, typical). Worked numbers of §20.3 / §10.3.</text>
<rect x="20.0" y="70.0" width="520.0" height="645.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="30.0" y="92.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">A  Face milling the cylinder deck (top view)</text>
<rect x="30.0" y="195.0" width="470.0" height="150.0" rx="0" fill="#e6e6e6" stroke="#000" stroke-width="1"/>
<text x="400.0" y="212.0" font-size="12" text-anchor="start" fill="#000">workpiece</text>
<text x="400.0" y="226.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">ae = 75 mm</text>
<circle cx="230.0" cy="270.0" r="100.0" fill="none" stroke="#000" stroke-width="1.8"/>
<circle cx="230.0" cy="270.0" r="3.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<path d="M296.1,345.0 A100,100 0 0,0 296.1,195.0" fill="none" stroke="#c0392b" stroke-width="5"/>
<line x1="230.0" y1="270.0" x2="296.1" y2="345.0" stroke="#000" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="230.0" y1="270.0" x2="296.1" y2="195.0" stroke="#000" stroke-width="1" stroke-dasharray="3 2"/>
<text x="260.0" y="274.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">φs = 97.2°</text>
<path d="M170,190 A100,100 0 0,1 270,178" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="138.0" y="162.0" font-size="12" text-anchor="start" fill="#000">n = 700 rpm (M3, clockwise)</text>
<line x1="200.0" y1="400.0" x2="300.0" y2="400.0" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
<text x="306.0" y="404.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">vf = 980 mm/min</text>
<circle cx="330.0" cy="270.0" r="5.0" fill="#000" stroke="#000" stroke-width="1.5"/>
<line x1="330.0" y1="270.0" x2="330.0" y2="322.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arA)"/>
<text x="338.0" y="314.0" font-size="12" text-anchor="start" fill="#c0392b">Fc on the tooth</text>
<text x="135.0" y="284.0" font-size="12" text-anchor="start" fill="#000">Ø100, z = 7, κ 45°</text>
<text x="34.0" y="450.0" font-size="12" text-anchor="start" fill="#000">n  = 1000 · vc / (π · D) = 1000 · 220 / (π · 100) = 700 rpm</text>
<text x="34.0" y="471.0" font-size="12" text-anchor="start" fill="#000">vf = n · z · fz = 700 · 7 · 0.20 = 980 mm/min</text>
<text x="34.0" y="492.0" font-size="12" text-anchor="start" fill="#000">Q  = ap · ae · vf / 1000 = 3 · 75 · 980 / 1000 = 220.5 cm³/min</text>
<text x="34.0" y="513.0" font-size="12" text-anchor="start" fill="#000">φs = 2 · arcsin(ae / D) = 97.2°</text>
<text x="34.0" y="534.0" font-size="12" text-anchor="start" fill="#000">hm = 360 · sin κ · ae · fz / (π · D · φs) = 0.125 mm</text>
<text x="34.0" y="555.0" font-size="12" text-anchor="start" fill="#000">kc = 1 150 · 0.125^−0.26 = 1 974 N/mm²</text>
<text x="34.0" y="576.0" font-size="12" text-anchor="start" fill="#000">Pc = Q · kc / 60 000 = 7.26 kW   (motor ≈ Pc / 0.8 = 9.1 kW)</text>
<text x="34.0" y="597.0" font-size="12" text-anchor="start" fill="#000">M  = 9 550 · Pc / n = 99 N·m</text>
<text x="34.0" y="618.0" font-size="12" text-anchor="start" fill="#000">Ft = 2 · M / D = 1 980 N  (sum of tangential tooth forces)</text>
<text x="34.0" y="639.0" font-size="12" text-anchor="start" fill="#000">With ap = 2 mm: Q 147 cm³/min, Pc 4.84 kW, M 66 N·m</text>
<rect x="560.0" y="70.0" width="520.0" height="300.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="570.0" y="92.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">B  Drilling Ø8.5 in GG25 (T4)</text>
<rect x="643.0" y="120.0" width="34.0" height="150.0" rx="0" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<path d="M643,270 L660,290 L677,270 Z" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<text x="600.0" y="316.0" font-size="11" text-anchor="start" fill="#000">118° point</text>
<line x1="700.0" y1="320.0" x2="700.0" y2="260.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arA)"/>
<text x="706.0" y="280.0" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">Ff ≈ 790 N</text>
<text x="706.0" y="296.0" font-size="11" text-anchor="start" fill="#c0392b">(feed force, on spindle</text>
<text x="706.0" y="310.0" font-size="11" text-anchor="start" fill="#c0392b"> and fixture)</text>
<text x="580.0" y="350.0" font-size="11" text-anchor="start" fill="#000">feed f = 0.20 mm/rev (down)</text>
<text x="800.0" y="120.0" font-size="12" text-anchor="start" fill="#000">n = 3 370 rpm, vc = 90 m/min</text>
<text x="800.0" y="140.0" font-size="12" text-anchor="start" fill="#000">h = f/2 · sin(118°/2) = 0.086 mm</text>
<text x="800.0" y="160.0" font-size="12" text-anchor="start" fill="#000">kc = 1 150 · 0.086^−0.26</text>
<text x="800.0" y="180.0" font-size="12" text-anchor="start" fill="#000">   = 2 178 N/mm²</text>
<text x="800.0" y="200.0" font-size="12" text-anchor="start" fill="#000">Pc = f · vc · D · kc / 240 000</text>
<text x="800.0" y="220.0" font-size="12" text-anchor="start" fill="#000">   = 1.39 kW</text>
<text x="800.0" y="240.0" font-size="12" text-anchor="start" fill="#000">Mc = 9 550 · Pc / n = 3.9 N·m</text>
<text x="800.0" y="260.0" font-size="12" text-anchor="start" fill="#000">Ff ≈ 0.5 · kc · (D/2) · f · sin κ</text>
<text x="800.0" y="280.0" font-size="12" text-anchor="start" fill="#000">   ≈ 790 N (estimate)</text>
<rect x="560.0" y="380.0" width="520.0" height="335.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="570.0" y="402.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">C  Is the spindle strong enough at this speed?</text>
