<text x="320.0" y="670.0" font-size="9.5" text-anchor="middle" fill="#000">-XD1 terminals: 24 V / 0 V distribution, inputs (3-level sensor terminals), outputs</text>
<rect x="85.0" y="690.0" width="470.0" height="22.0" rx="0" fill="#e6e6e6" stroke="#777" stroke-width="0.8"/>
<text x="320.0" y="705.0" font-size="9.5" text-anchor="middle" fill="#666">wiring duct 60 × 80</text>
<text x="320.0" y="740.0" font-size="10" text-anchor="middle" fill="#666">PE bar · cable entry · gland plate (bottom)</text>
<text x="640.0" y="90.0" font-size="12" text-anchor="start" fill="#000">Layout rules (IEC 60204-1, EN 61439):</text>
<text x="640.0" y="107.0" font-size="12" text-anchor="start" fill="#000">• power at the top / left, signal electronics in the middle,</text>
<text x="640.0" y="124.0" font-size="12" text-anchor="start" fill="#000">  terminals at the bottom; 230 V and 24 V in separate ducts</text>
<text x="640.0" y="141.0" font-size="12" text-anchor="start" fill="#000">• 24 V supply with DC-OK contact to a PLC input; one ECB</text>
<text x="640.0" y="158.0" font-size="12" text-anchor="start" fill="#000">  channel per group (PLC, sensors, outputs, safety)</text>
<text x="640.0" y="175.0" font-size="12" text-anchor="start" fill="#000">• safety relay -KF2 next to the PSU, its wiring marked</text>
<text x="640.0" y="192.0" font-size="12" text-anchor="start" fill="#000">  (e.g. yellow wires or labels) – changes only by trained staff</text>
<text x="640.0" y="209.0" font-size="12" text-anchor="start" fill="#000">• keep 25 % spare space and 20 % spare I/O</text>
<text x="640.0" y="226.0" font-size="12" text-anchor="start" fill="#000">• heat: PLC + I/O ≈ 25 W, PSU losses ≈ 20 W, relays ≈ 10 W</text>
<text x="640.0" y="243.0" font-size="12" text-anchor="start" fill="#000">  → ≈ 55 W; check with IEC/TR 60890 (guide 33 §19.3)</text>
<text x="640.0" y="260.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="640.0" y="277.0" font-size="12" text-anchor="start" fill="#000">Siemens variant (CPU 1515F-2 PN):</text>
<text x="640.0" y="294.0" font-size="12" text-anchor="start" fill="#000">• CPU + PM 70 W on a DIN rail where the AS rack is</text>
<text x="640.0" y="311.0" font-size="12" text-anchor="start" fill="#000">• the crane I/O is NOT in this cabinet: ET 200SP station</text>
<text x="640.0" y="328.0" font-size="12" text-anchor="start" fill="#000">  on the crane (+CRN01) and at the conveyor (+CAB02),</text>
<text x="640.0" y="345.0" font-size="12" text-anchor="start" fill="#000">  connected by PROFINET (optical link to the crane)</text>
<text x="640.0" y="362.0" font-size="12" text-anchor="start" fill="#000">• no hard-wired safety relay: F-DI / F-DQ modules +</text>
<text x="640.0" y="379.0" font-size="12" text-anchor="start" fill="#000">  F-program; only the e-stop buttons and door switches</text>
<text x="640.0" y="396.0" font-size="12" text-anchor="start" fill="#000">  are wired 2-channel to the F-modules</text>
<text x="640.0" y="413.0" font-size="12" text-anchor="start" fill="#000">• PROFINET switch (e.g. SCALANCE XB005) for HMI + PG</text>
</svg>