<line x1="330.0" y1="542.0" x2="330.0" y2="564.0" stroke="#000" stroke-width="0.8"/>
<text x="335.0" y="558.0" font-size="11.5" text-anchor="start" fill="#000"></text>
<line x1="460.0" y1="542.0" x2="460.0" y2="564.0" stroke="#000" stroke-width="0.8"/>
<text x="465.0" y="558.0" font-size="11.5" text-anchor="start" fill="#000"></text>
<line x1="560.0" y1="542.0" x2="560.0" y2="564.0" stroke="#000" stroke-width="0.8"/>
<text x="565.0" y="558.0" font-size="11.5" text-anchor="start" fill="#000">≈ 6.25 → cycle 40 min</text>
<rect x="730.0" y="420.0" width="450.0" height="206.0" rx="0" fill="#eaf1fb" stroke="#1f6fd1" stroke-width="1.4"/>
<text x="745.0" y="442.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">D  Thermal lead growth during grinding</text>
<text x="745.0" y="464.0" font-size="11.5" text-anchor="start" fill="#000">ΔL = α · L · ΔT = 11.8·10⁻⁶ · 850 mm · 1 K = 10.0 µm per K</text>
<text x="745.0" y="482.0" font-size="11.5" text-anchor="start" fill="#000">2 K warmer screw → 20 µm – more than half of</text>
<text x="745.0" y="500.0" font-size="11.5" text-anchor="start" fill="#000">the C5 tolerance e_p ± 35 µm over 700 mm!</text>
<text x="745.0" y="518.0" font-size="11.5" text-anchor="start" fill="#000">Counter-measures:</text>
<text x="745.0" y="536.0" font-size="11.5" text-anchor="start" fill="#000">• grinding oil 20 ± 0.5 °C, 200 l/min, room 20 ± 1 °C</text>
<text x="745.0" y="554.0" font-size="11.5" text-anchor="start" fill="#000">• screw temperature sensor → CNC corrects the lead:</text>
<text x="745.0" y="572.0" font-size="11.5" text-anchor="start" fill="#000">   Ph_set = Ph · (1 − α·ΔT) = 9.999823 mm for ΔT 1.5 K</text>
<text x="745.0" y="590.0" font-size="11.5" text-anchor="start" fill="#000">• T value (target travel deviation) for pre-tension</text>
<text x="745.0" y="608.0" font-size="11.5" text-anchor="start" fill="#000">• finish passes after dressing, same direction</text>
<text x="30.0" y="590.0" font-size="11.5" text-anchor="start" fill="#000">Typical mistakes: oil temperature drifts → lead error; worn wheel profile → wrong contact angle;</text>
<text x="30.0" y="606.0" font-size="11.5" text-anchor="start" fill="#000">too large infeed → grinding burn (find it with nital etch / Barkhausen noise).</text>
<text x="30.0" y="640.0" font-size="11.5" text-anchor="start" fill="#1f6fd1">Quality gate QG-BS-4: pitch Ø over balls 100 %, profile (45° ± 2°) 1 in 10; lead measured later at QG-BS-5 (laser).</text>
