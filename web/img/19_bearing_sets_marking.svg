<text x="520.0" y="470.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >7014 C HC P4</text>
<text x="520.0" y="638.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#0b6fb8" >ΔD −3</text>
<text x="520.0" y="499.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000" >set 023417</text>
<text x="520.0" y="608.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#0b6fb8" >Δd −2</text>
<circle cx="575.0" cy="540.0" r="3.0" fill="#000" stroke="#000" stroke-width="1" />
<line x1="578.0" y1="538.0" x2="634.0" y2="504.0" stroke="#000" stroke-width="0.8" />
<text x="640.0" y="460.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >• set number on all rings</text>
<text x="640.0" y="474.9" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >• Δd = bore − nominal (µm)</text>
<text x="640.0" y="489.7" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >• ΔD = OD − nominal (µm)</text>
<text x="640.0" y="504.6" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >• dot = high point of the</text>
<text x="640.0" y="519.4" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >  ring radial runout</text>
<text x="640.0" y="534.2" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >• V-line across all ODs</text>
<text x="640.0" y="549.1" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >• wide face = thrust side</text>
<text x="410.0" y="730.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000" >Example: Δd −2 → bore 69.998 mm; ΔD −3 → OD 109.997 mm</text>
<rect x="800.0" y="400.0" width="360.0" height="170.0" fill="#fff" stroke="#000" stroke-width="1" />
<text x="810.0" y="422.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000" >Rules at steps 1, 6 and 10</text>
<text x="810.0" y="441.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >1  never mix rings of two sets</text>
<text x="810.0" y="460.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >2  keep the order and direction of the box</text>
<text x="810.0" y="479.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >3  check the V before the housing goes on</text>
<text x="810.0" y="498.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >4  photo of the V-line into the record</text>
<text x="810.0" y="517.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >5  matched set = fixed arrangement;</text>
<text x="810.0" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >    universal bearing (U) = any DB/DF/DT</text>
<text x="810.0" y="555.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000" >6  angle drawn 25° for clarity (real 15°)</text>
