<text x="838.0" y="462.8" font-size="15" text-anchor="start" font-weight="700" fill="#1f6fd1">Week 4 of B, by hand</text>
<text x="838.0" y="481.8" font-size="15" text-anchor="start" fill="#000">available = 10 + 0 − 100 = −90</text>
<text x="838.0" y="500.8" font-size="15" text-anchor="start" fill="#000">net = SS − available = 10 + 90 = 100</text>
<text x="838.0" y="519.8" font-size="15" text-anchor="start" fill="#000">lot 100 (fixed) → receipt 100</text>
<text x="838.0" y="538.8" font-size="15" text-anchor="start" fill="#000">POH = −90 + 100 = 10</text>
<text x="838.0" y="557.8" font-size="15" text-anchor="start" fill="#000">release = week 4 − LT 2 = week 2</text>
<rect x="830" y="90" width="340" height="200" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
