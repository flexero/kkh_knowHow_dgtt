" cy="170" r="18" fill="#b3261e" stroke="#000" stroke-width="1.5"/><text x="1030" y="205" font-size="10" text-anchor="middle" fill="#000">-PF2 fault</text><rect x="790" y="230" width="40" height="40" rx="0" fill="#eee" stroke="#000" stroke-width="1.5"/><text x="810" y="285" font-size="10" text-anchor="middle" fill="#000">-SF2 start</text><rect x="900" y="230" width="40" height="40" rx="0" fill="#eee" stroke="#000" stroke-width="1.5"/><text x="920" y="285" font-size="10" text-anchor="middle" fill="#000">-SF1 stop</text><rect x="1010" y="230" width="40" height="40" rx="0" fill="#eee" stroke="#000" stroke-width="1.5"/><text x="1030" y="285" font-size="10" text-anchor="middle" fill="#000">-SF3 ack</text><circle cx="1105" cy="250" r="24" fill="#d22" stroke="#000" stroke-width="1.5"/><text x="1100" y="292" font-size="10" text-anchor="middle" fill="#000" font-weight="bold">-SF0 E-STOP</text><rect x="800" y="320" width="300" height="60" rx="0" fill="#f4f7fb" stroke="#000" stroke-width="1.5"/><text x="950" y="345" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">HMI Delta DOP-107 / Siemens KTP700</text><text x="950" y="362" font-size="10" text-anchor="middle" fill="#000">(option, Ethernet)</text><text x="760" y="440" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Heat (example):</text><text x="760" y="462" font-size="11" text-anchor="start" fill="#000">PLC + modules ≈ 12 W, 24 V supply losses ≈ 12 W</text><text x="760" y="480" font-size="11" text-anchor="start" fill="#000">contactor coils 3 × 3 W, relays 6 × 0.5 W, -QM1 ≈ 2 W</text><text x="760" y="498" font-size="11" text-anchor="start" fill="#000">total ≈ 40 W → 600 × 800 × 250 enclosure, ΔT ≈ 5 K</text><text x="760" y="516" font-size="11" text-anchor="start" fill="#000">(A ≈ 1.4 m², k = 5.5 W/m²K) – no fan needed below 35 °C</text><text x="760" y="534" font-size="11" text-anchor="start" fill="#000">Rule: 400 V and 24 V in separate ducts; analog cable</text><text x="760" y="552" font-size="11" text-anchor="start" fill="#000">shielded, shield on the EMC rail at the entry.</text><text x="760" y="570" font-size="11" text-anchor="start" fill="#000">Cabinet to IEC 61439-1/-2 + IEC 60204-1; IP54 next to the HPU</text><text x="760" y="588" font-size="11" text-anchor="start" fill="#000">(oil mist) – cable glands at the bottom.</text><rect x="770" y="760" width="420" height="60" fill="#fff" stroke="#000" stroke-width="1"/><line x1="770" y1="782" x2="1190" y2="782" stroke="#000" stroke-width="0.8"/><text x="778" y="776" font-size="12" font-weight="bold">HPU control cabinet – layout</text><text x="778" y="798" font-size="10.5">600 × 800 × 250 mm example, PLC, contactors, terminals</text><text x="778" y="813" font-size="10.5" fill="#0b5ea8">Guide 37 · page 8 · EXAMPLE – check with your PLC configuration</text></svg>
