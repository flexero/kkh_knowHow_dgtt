<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Metrology room layout – drawing 44-10</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.6"/></pattern></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24.0" y="36.0" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Metrology room 20 ± 0.5 °C – layout example (≈ 10 × 8 m)</text><text x="24.0" y="58.0" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Plan view. All granites on isolated foundations. Parts soak ≥ 4 h in the room before measuring.</text><rect x="60.0" y="112.0" width="580.0" height="464.0" rx="0" fill="#fff" stroke="#000" stroke-width="3"/><rect x="60.0" y="460.0" width="127.6" height="116.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="123.8" y="506.4" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">air lock</text><text x="123.8" y="523.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">+ soak racks</text><text x="123.8" y="541.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">(≥ 4 h)</text><line x1="94.8" y1="576.0" x2="152.8" y2="576.0" stroke="#fff" stroke-width="4"/><text x="123.8" y="592.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">door</text><rect x="71.6" y="129.4" width="46.4" height="301.6" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="94.8" y="277.1" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">soak</text><text x="94.8" y="291.1" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">racks</text><rect x="152.8" y="135.2" width="290.0" height="69.6" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="297.8" y="166.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">rail measuring bench 5 × 1.2 m</text><text x="297.8" y="180.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">(QC-RAL, granite)</text><rect x="152.8" y="239.6" width="203.0" height="69.6" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="254.3" y="271.3" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">lead bench 3.5 × 1.2 m</text><text x="254.3" y="285.3" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">(QC-LED, laser)</text><rect x="384.8" y="228.0" width="139.2" height="139.2" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="454.4" y="294.5" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">CMM</text><text x="454.4" y="308.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">700 × 1 000 × 600</text><rect x="152.8" y="355.6" width="92.8" height="58.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="199.2" y="388.5" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">roundness</text><rect x="257.2" y="355.6" width="92.8" height="58.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="303.6" y="388.5" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">contour</text><rect x="361.6" y="390.4" width="92.8" height="58.0" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="408.0" y="423.2" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">roughness</text><rect x="541.4" y="135.2" width="87.0" height="127.6" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="584.9" y="188.8" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">hardness</text><text x="584.9" y="202.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">corner</text><text x="584.9" y="216.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">(vibration!)</text><rect x="541.4" y="436.8" width="87.0" height="127.6" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="584.9" y="490.4" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">desk + PC</text><text x="584.9" y="504.4" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">SPC / QA</text><text x="584.9" y="518.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">HTTP</text><rect x="234.0" y="483.2" width="150.8" height="69.6" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="309.4" y="514.9" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">preload torque</text><text x="309.4" y="528.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">tester (ref.)</text><rect x="147.0" y="129.4" width="301.6" height="81.2" rx="0" fill="#fff" stroke="#000" stroke-width="0.8" stroke-dasharray="5 3" fill-opacity="0"/><rect x="147.0" y="233.8" width="214.6" height="81.2" rx="0" fill="#fff" stroke="#000" stroke-width="0.8" stroke-dasharray="5 3" fill-opacity="0"/><rect x="379.0" y="222.2" width="150.8" height="150.8" rx="0" fill="#fff" stroke="#000" stroke-width="0.8" stroke-dasharray="5 3" fill-opacity="0"/><text x="379.0" y="387.5" font-size="11" text-anchor="start" font-weight="normal" fill="#000">dashed = isolated foundations</text><circle cx="135.4" cy="219.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="135.4" cy="335.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="135.4" cy="451.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="268.8" cy="219.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="268.8" cy="335.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="268.8" cy="451.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="402.2" cy="219.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="402.2" cy="335.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="402.2" cy="451.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="535.6" cy="219.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="535.6" cy="335.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><circle cx="535.6" cy="451.3" r="5.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><line x1="205.0" y1="616.0" x2="205.0" y2="570.0" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><line x1="350.0" y1="616.0" x2="350.0" y2="570.0" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><line x1="495.0" y1="616.0" x2="495.0" y2="570.0" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><text x="332.6" y="632.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">supply air low, slow (displacement ventilation)</text><line x1="205.0" y1="118.0" x2="205.0" y2="94.0" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><line x1="350.0" y1="118.0" x2="350.0" y2="94.0" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><line x1="495.0" y1="118.0" x2="495.0" y2="94.0" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="518.2" y="100.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">return air high</text><text x="350.0" y="650.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">10 m</text><text x="46.0" y="344.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#000" transform="rotate(-90 46 344.0)">8 m</text><rect x="720.0" y="90.0" width="450.0" height="300.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1"/><text x="732.0" y="112.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Room limits (example – check ISO 1 / your customer)</text><text x="732.0" y="132.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">temperature 20 ± 0.5 °C (reference 20 °C, ISO 1)</text><text x="732.0" y="152.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">change ≤ 0.5 K per hour</text><text x="732.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">gradient ≤ 0.5 K per m (vertical)</text><text x="732.0" y="192.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">humidity 45 ± 10 % rH (no rust, stable granite)</text><text x="732.0" y="212.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">air speed at the benches ≤ 0.2 m/s</text><text x="732.0" y="232.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vibration: hardness tester + traffic away</text><text x="732.0" y="252.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">light 1 000 lx, no sun, no heaters near granites</text><text x="732.0" y="272.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">people + PCs = heat: log occupancy</text><text x="732.0" y="292.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">sensors (blue dots) logged every 1 min</text><rect x="720.0" y="410.0" width="450.0" height="120.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="732.0" y="432.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Why so strict?</text><text x="732.0" y="451.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">ΔL = α · L · ΔT = 11.5 µm/(m·K) × 0.7 m × 1 K</text><text x="732.0" y="470.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">1 K on 700 mm = 8.05 µm</text><text x="732.0" y="489.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">= ¼ of the C5 e_p tolerance (± 35 µm)</text><text x="732.0" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">= almost all of C3 v_300 (8 µm)</text><rect x="825.0" y="738.0" width="360.0" height="80.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825.0" y1="768.0" x2="1185.0" y2="768.0" stroke="#000" stroke-width="1.2"/><line x1="825.0" y1="792.0" x2="1185.0" y2="792.0" stroke="#000" stroke-width="1.2"/><text x="835.0" y="759.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Metrology room layout</text><text x="835.0" y="785.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 44-10  ·  guide 44 §13</text><text x="835.0" y="810.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the standard</text></svg>
