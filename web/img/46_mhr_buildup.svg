<text x="735" y="152.0" font-size="13" text-anchor="middle" font-weight="700" fill="#000">55 000</text>
<text x="735" y="660" font-size="13" text-anchor="middle" fill="#000">maintenance</text>
<rect x="830" y="160.0" width="110" height="480.0" fill="#000" stroke="#000" stroke-width="1"/>
<text x="885" y="152.0" font-size="13" text-anchor="middle" font-weight="700" fill="#000">217 080 €/year</text>
<text x="885" y="660" font-size="13" text-anchor="middle" fill="#000">total</text>
<line x1="60" y1="640" x2="900" y2="640" stroke="#000" stroke-width="1.5"/>
<rect x="920" y="140" width="250" height="280" rx="6" fill="#fff" stroke="#1f6fd1" stroke-width="2.4"/>
<text x="1045.0" y="216.6" font-size="13" text-anchor="middle" font-weight="700" fill="#1f6fd1">rate = total / hours</text>
<text x="1045.0" y="233.6" font-size="13" text-anchor="middle" fill="#000">217 080 € / 3 750 h</text>
<text x="1045.0" y="250.6" font-size="13" text-anchor="middle" fill="#000">= 57.89 €/h</text>
<text x="1045.0" y="267.6" font-size="13" text-anchor="middle" fill="#000"></text>
<text x="1045.0" y="284.6" font-size="13" text-anchor="middle" fill="#000">+ labour 0.5 × 42 €/h</text>
<text x="1045.0" y="301.6" font-size="13" text-anchor="middle" fill="#000">= 21.00 €/h</text>
<text x="1045.0" y="318.6" font-size="13" text-anchor="middle" fill="#000"></text>
<text x="1045.0" y="335.6" font-size="13" text-anchor="middle" fill="#000">hours = 250 days × 2 shifts</text>
<text x="1045.0" y="352.6" font-size="13" text-anchor="middle" fill="#000">× 7.5 h = 3 750 h</text>
<rect x="920" y="450" width="250" height="170" rx="6" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="1045.0" y="505.6" font-size="13" text-anchor="middle" font-weight="700" fill="#000">cost per piece (op 100)</text>
<text x="1045.0" y="522.5" font-size="13" text-anchor="middle" fill="#000">t = 40 + 45 / 20 = 42.25 min</text>
<text x="1045.0" y="539.5" font-size="13" text-anchor="middle" fill="#000">42.25 / 60 / 0.75 × 57.89</text>
<text x="1045.0" y="556.5" font-size="13" text-anchor="middle" fill="#000">= 54.35 € machine</text>
<text x="1045.0" y="573.5" font-size="13" text-anchor="middle" fill="#000">+ 19.72 € labour</text>
<text x="80" y="690" font-size="12" text-anchor="start" fill="#000">depreciation: 1 100 000 € / 10 years = 110 000 €</text>
<text x="80" y="708" font-size="12" text-anchor="start" fill="#000">interest: price / 2 × 6 % = 33 000 €</text>
<text x="80" y="726" font-size="12" text-anchor="start" fill="#000">space: 27.72 m² × 250 €/m² (climate room) = 6 930 €</text>
<text x="80" y="744" font-size="12" text-anchor="start" fill="#000">energy: 30 kW × 0.6 × 3 750 h × 0.18 €/kWh = 12 150 €</text>
<text x="80" y="762" font-size="12" text-anchor="start" fill="#000">maintenance: 5 % of the price per year = 55 000 €</text>
