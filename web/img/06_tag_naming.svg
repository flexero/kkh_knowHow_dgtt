<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" font-family="Arial, Helvetica, sans-serif">
<title>Tag naming scheme</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1240" height="820" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">06 – Tag naming scheme of the project (doc 15 §3.10) compared with ISA-5.1 and KKS</text>
<text x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444">One name for the same signal in PLC symbol, OPC UA node, SCADA tag, historian and MQTT topic.</text>
