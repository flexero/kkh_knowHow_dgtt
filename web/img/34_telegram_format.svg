<text x="30.0" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">Status codes (TC)</text>
<text x="40.0" y="412.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">00</text>
<text x="80.0" y="412.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">done OK – WMS books the movement</text>
<text x="40.0" y="431.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">11</text>
<text x="80.0" y="431.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">no-read at the ID point → reject lane</text>
<text x="40.0" y="450.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">12</text>
<text x="80.0" y="450.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">contour / overhang fault → reject lane</text>
<text x="40.0" y="469.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">13</text>
<text x="80.0" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">overweight &gt; 300 kg</text>
<text x="40.0" y="488.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">21</text>
<text x="80.0" y="488.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">destination occupied / store full</text>
<text x="40.0" y="507.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">22</text>
<text x="80.0" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">source slot empty (no stock)</text>
<text x="40.0" y="526.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">31</text>
<text x="80.0" y="526.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">crane fault – job aborted, load position reported</text>
<text x="40.0" y="545.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">90</text>
<text x="80.0" y="545.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">other error – see WCS log</text>
<text x="560.0" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">Other telegrams</text>
<text x="570.0" y="412.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">ACK</text>
<text x="610.0" y="412.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">acknowledge of every telegram: type + seq of the received one</text>
<text x="570.0" y="431.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">LS</text>
<text x="610.0" y="431.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">life sign every 10 s each way; 3 missing = link down</text>
<text x="570.0" y="450.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">ID</text>
<text x="610.0" y="450.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">ID point scan: HU, SSCC, contour, weight</text>
<text x="570.0" y="469.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">ST</text>
<text x="610.0" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">device status: crane auto / manual / fault, conveyor states</text>
<text x="570.0" y="488.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">CA</text>
<text x="610.0" y="488.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">cancel a queued job (WMS → WCS); active jobs cannot be cancelled</text>
<text x="570.0" y="507.0" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="start" font-weight="bold" xml:space="preserve" fill="#111111">SY</text>
<text x="610.0" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">synchronisation after a restart: WCS sends all open jobs</text>
<rect x="30.0" y="590.0" width="1140.0" height="190.0" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="42.0" y="612.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#111111">Rules for a robust telegram interface</text>
<text x="42.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">1  sequence number 00001 … 99999, wraps; same seq again = duplicate (ACK again, do not execute twice); a gap = lost telegram → SY</text>
<text x="42.0" y="658.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">2  every telegram is acknowledged within 5 s; no ACK → resend up to 3 × with the same seq, then alarm 'WMS–WCS link'</text>
<text x="42.0" y="680.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">3  fixed length, ASCII, text left-aligned and space-padded, numbers zero-padded; no field may contain STX / ETX</text>
<text x="42.0" y="702.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">4  the WMS books stock only after TC 00; after a restart both sides run SY so that no job is lost or done twice</text>
<text x="42.0" y="724.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">5  modern alternative: OPC UA methods or JSON over TCP with the same fields – keep the same rules (ID, ACK, idempotent, resync)</text>
<text x="42.0" y="746.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#111111">6  write the field table, status codes and timing into ONE interface spec signed by the WMS and the AS/RS supplier (guide 34 §7.4)</text>
</svg>