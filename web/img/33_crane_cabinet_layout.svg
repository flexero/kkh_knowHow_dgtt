nchor="middle" class="ck-tx ck-mut" font-size="11">D</text><path d="M16,520 H30" class="ck-frame2"/><text x="23" y="585" text-anchor="middle" class="ck-tx ck-mut" font-size="11">E</text><path d="M16,642 H30" class="ck-frame2"/><text x="23" y="707" text-anchor="middle" class="ck-tx ck-mut" font-size="11">F</text><rect x="30" y="764" width="230" height="62" class="ck-frame2"/><text x="35" y="778" class="ck-tx ck-mut" font-size="11">Project</text><text x="35" y="797" class="ck-tx" font-size="12">Compressor factory – AS/RS raw materials</text><text x="35" y="814" class="ck-tx ck-mut" font-size="11">PLC-ASRS-RAW · S7-1515F-2 PN</text><rect x="260" y="764" width="300" height="62" class="ck-frame2"/><text x="265" y="778" class="ck-tx ck-mut" font-size="11">Page title</text><text x="265" y="797" class="ck-tx" font-size="12" font-weight="700">Crane cabinet layout + heat</text><rect x="560" y="764" width="190" height="62" class="ck-frame2"/><text x="565" y="778" class="ck-tx ck-mut" font-size="11">Function / location</text><text x="565" y="797" class="ck-tx" font-size="12">=LOG.ASRSRAW</text><text x="565" y="814" class="ck-tx ck-mut" font-size="11">+CRN01</text><rect x="750" y="764" width="170" height="62" class="ck-frame2"/><text x="755" y="778" class="ck-tx ck-mut" font-size="11">Drawn to</text><text x="755" y="797" class="ck-tx" font-size="12">IEC 60617 · 81346 · 60204-1/-32</text><text x="755" y="814" class="ck-tx ck-mut" font-size="11">EN 528 · ISO 13849</text><rect x="920" y="764" width="180" height="62" class="ck-frame2"/><text x="925" y="778" class="ck-tx ck-mut" font-size="11">Status</text><text x="925" y="797" class="ck-tx ck-warnTx" font-size="12" font-weight="700">EXAMPLE – not for manufacture</text><text x="925" y="814" class="ck-tx ck-mut" font-size="11">check the AS/RS supplier's docs</text><rect x="1100" y="764" width="60" height="62" class="ck-frame2"/><text x="1105" y="778" class="ck-tx ck-mut" font-size="11">Page</text><text x="1105" y="797" class="ck-tx" font-size="16" font-weight="700">8 / 8</text><text x="60" y="48" class="ck-tx ck-b" text-anchor="start" font-size="11">+CRN01 crane cabinet, front view, door removed (800 × 1200 × 400 mm)</text><rect x="60" y="60" width="384" height="576" class="ck-box"/><rect x="72" y="72" width="360" height="552" class="ck-box ck-plate"/><rect x="78" y="132" width="348" height="14" class="ck-duct"/><rect x="84" y="86" width="52" height="40" rx="2" class="ck-dev"/><text x="87" y="101" class="ck-tx" text-anchor="start" font-size="11">-QB10</text><rect x="142" y="86" width="56" height="40" rx="2" class="ck-dev"/><text x="145" y="101" class="ck-tx" text-anchor="start" font-size="11">-FC10</text><rect x="204" y="86" width="56" height="40" rx="2" class="ck-dev"/><text x="207" y="101" class="ck-tx" text-anchor="start" font-size="11">-QA10</text><rect x="266" y="86" width="66" height="40" rx="2" class="ck-dev"/><text x="269" y="101" class="ck-tx" text-anchor="start" font-size="11">-RA10</text><rect x="338" y="86" width="64" height="40" rx="2" class="ck-dev"/><text x="341" y="101" class="ck-tx" text-anchor="start" font-size="11">-FC11…</text><rect x="78" y="350" width="348" height="14" class="ck-duct"/><rect x="84" y="200" width="70" height="140" rx="2" class="ck-dev"/><text x="87" y="215" class="ck-tx" text-anchor="start" font-size="11">-TA10</text><rect x="160" y="200" width="50" height="140" rx="2" class="ck-dev"/><text x="163" y="215" class="ck-tx" text-anchor="start" font-size="11">-TA11</text><rect x="216" y="200" width="50" height="140" rx="2" class="ck-dev"/><text x="219" y="215" class="ck-tx" text-anchor="start" font-size="11">-TA12</text><rect x="272" y="200" width="64" height="140" rx="2" class="ck-dev"/><text x="275" y="215" class="ck-tx" text-anchor="start" font-size="11">-TA13</text><rect x="342" y="200" width="40" height="140" rx="2" class="ck-dev"/><text x="345" y="215" class="ck-tx" text-anchor="start" font-size="11">-TA14</text><rect x="78" y="436" width="348" height="14" class="ck-duct"/><rect x="84" y="390" width="200" height="40" rx="2" class="ck-dev"/><text x="87" y="405" class="ck-tx" text-anchor="start" font-size="11">-KF30 ET 200SP + -KF23/-KF24</text><rect x="290" y="390" width="50" height="40" rx="2" class="ck-dev"/><text x="293" y="405" class="ck-tx" text-anchor="start" font-size="11">-KF33</text><rect x="346" y="390" width="50" height="40" rx="2" class="ck-dev"/><text x="349" y="405" class="ck-tx" text-anchor="start" font-size="11">-KF35</text><rect x="78" y="516" width="348" height="14" class="ck-duct"/><rect x="84" y="470" width="70" height="40" rx="2" class="ck-dev"/><text x="87" y="485" class="ck-tx" text-anchor="start" font-size="11">-TB10</text><rect x="160" y="470" width="110" height="40" rx="2" class="ck-dev"/><text x="163" y="485" class="ck-tx" text-anchor="start" font-size="11">-FC21…26 ECB</text><rect x="276" y="470" width="50" height="40" rx="2" class="ck-dev"/><text x="279" y="485" class="ck-tx" text-anchor="start" font-size="11">-KF71</text><rect x="332" y="470" width="60" height="40" rx="2" class="ck-dev"/><text x="335" y="485" class="ck-tx" text-anchor="start" font-size="11">relays</text><rect x="78" y="596" width="348" height="14" class="ck-duct"/><rect x="84" y="550" width="300" height="40" rx="2" class="ck-dev"/><text x="87" y="565" class="ck-tx" text-anchor="start" font-size="11">-XD1 terminals (spring-cage)</text><text x="84" y="380" class="ck-tx ck-mut" text-anchor="start" font-size="11">drives: push-through heat sinks</text><rect x="52" y="80" width="8" height="20" class="sr-mount"/><rect x="444" y="80" width="8" height="20" class="sr-mount"/><rect x="52" y="596" width="8" height="20" class="sr-mount"/><rect x="444" y="596" width="8" height="20" class="sr-mount"/><text x="60" y="686" class="ck-tx ck-mut" text-anchor="start" font-size="11">anti-vibration mounts (wire-rope / rubber-metal) at the 4 corners</text><rect x="60" y="636" width="384" height="16" class="ck-gland"/><circle cx="90" cy="644" r="5" class="ck-box"/><circle cx="130" cy="644" r="5" class="ck-box"/><circle cx="170" cy="644" r="5" class="ck-box"/><circle cx="210" cy="644" r="5" class="ck-box"/><circle cx="250" cy="644" r="5" class="ck-box"/><circle cx="290" cy="644" r="5" class="ck-box"/><circle cx="330" cy="644" r="5" class="ck-box"/><circle cx="370" cy="644" r="5" class="ck-box"/><circle cx="410" cy="644" r="5" class="ck-box"/><text x="60" y="670" class="ck-tx ck-mut" text-anchor="start" font-size="11">gland plate: EMC glands (360° shield), strain relief, cables from the rail collector + drag chains</text><text x="520" y="70" class="ck-tx ck-b" text-anchor="start" font-size="12.5">Rules for a cabinet on a moving crane (example)</text><text x="520" y="92" class="ck-tx" text-anchor="start" font-size="11">• vibration + shock: devices tested to IEC 60068-2-6 / -27 (ask: 'suitable for crane use?')</text><text x="520" y="108" class="ck-tx" text-anchor="start" font-size="11">• spring-cage or screw terminals with ferrules; no plug-in relays without clips</text><text x="520" y="124" class="ck-tx" text-anchor="start" font-size="11">• heavy parts (reactor, drives) low on the plate; mounting rails screwed every 100 mm</text><text x="520" y="140" class="ck-tx" text-anchor="start" font-size="11">• brake resistor outside (on the crane frame), with thermal switch to the PLC</text><text x="520" y="156" class="ck-tx" text-anchor="start" font-size="11">• cooling unit rated for vibration and tilting; condensate drain; door seal IP54</text><text x="520" y="172" class="ck-tx" text-anchor="start" font-size="11">• cable entry from below; drip loop; no water from the roof (indoor store)</text><text x="520" y="188" class="ck-tx" text-anchor="start" font-size="11">• PE + HF bonding: cabinet ↔ crane frame with flat braid ≥ 16 mm²</text><text x="520" y="204" class="ck-tx" text-anchor="start" font-size="11">• lighting + socket for service; documentation pocket in the door</text><text x="520" y="250" class="ck-tx ck-b" text-anchor="start" font-size="12.5">Heat balance (IEC/TR 60890, example)</text><text x="520" y="270" class="ck-tx" text-anchor="start" font-size="11">drive power sections (push-through heat sinks, internal part 5 × 30 W)</text><text x="1140" y="270" class="ck-tx" text-anchor="end" font-size="11">150.0 W</text><text x="520" y="286" class="ck-tx" text-anchor="start" font-size="11">line reactor + EMC filter</text><text x="1140" y="286" class="ck-tx" text-anchor="end" font-size="11">60.0 W</text><text x="520" y="302" class="ck-tx" text-anchor="start" font-size="11">24 V loads inside (drive electronics, PLC, relays)</text><text x="1140" y="302" class="ck-tx" text-anchor="end" font-size="11">120.0 W</text><text x="520" y="318" class="ck-tx" text-anchor="start" font-size="11">24 V power supply loss</text><text x="1140" y="318" class="ck-tx" text-anchor="end" font-size="11">22.0 W</text><text x="520" y="334" class="ck-tx" text-anchor="start" font-size="11">contactors, MCBs, terminals, wiring</text><text x="1140" y="334" class="ck-tx" text-anchor="end" font-size="11">30.0 W</text><path d="M520,340 H1140" class="ck-thin"/><text x="520" y="358" class="ck-tx ck-b" text-anchor="start" font-size="11">total loss P_v</text><text x="1140" y="358" class="ck-tx ck-b" text-anchor="end" font-size="11">382.0 W</text><text x="520" y="375" class="ck-tx" text-anchor="start" font-size="11">surface A = 1.4·W·(H+D) + 1.8·D·H = 2.656 m² (wall-mounted)</text><text x="520" y="392" class="ck-tx" text-anchor="start" font-size="11">through the walls k·A·ΔT = 5.5 · 2.66 · 5 K</text><text x="1140" y="392" class="ck-tx" text-anchor="end" font-size="11">73.0 W</text><text x="520" y="409" class="ck-tx ck-b" text-anchor="start" font-size="11">to remove</text><text x="1140" y="409" class="ck-tx ck-b" text-anchor="end" font-size="11">309.0 W</text><text x="520" y="426" class="ck-tx" text-anchor="start" font-size="11">filter fan: V = 3.1 · P / ΔT = 192 m³/h (dusty store: prefer a cooling unit)</text><text x="520" y="443" class="ck-tx ck-b" text-anchor="start" font-size="11">cooling unit ≥ 1.3 × 309 W → 500 W class</text><text x="520" y="460" class="ck-tx" text-anchor="start" font-size="11">ambient at the crane cabinet 35 °C, inside max 40 °C (ΔT = 5 K)</text><rect x="520" y="600" width="620" height="110" rx="2" class="ck-box ck-note"/><text x="530" y="618" class="ck-tx ck-b" text-anchor="start" font-size="11">24 V budget of the crane cabinet</text><text x="530" y="635" class="ck-tx" text-anchor="start" font-size="11">sum 12.16 A · × 1.25 reserve = 15.20 A → -TB10 20 A PSU (load 61 %)</text><text x="530" y="652" class="ck-tx" text-anchor="start" font-size="11">brakes have their own ECB channel; drives' 24 V on a separate ECB</text><text x="530" y="669" class="ck-tx" text-anchor="start" font-size="11">buffer module 24 V (e.g. 0.5 s) – no reset of the PLC when the collector bounces on the rail joints</text><text x="530" y="686" class="ck-tx" text-anchor="start" font-size="11">UPS for the PLC is not needed with DDLS + F-PLC in +CAB01 (example)</text></svg>
