<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Modbus TCP frame anatomy – drawing 43-03</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Modbus TCP frame (ADU) – MBAP header + PDU, byte by byte</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Request of the gateway: read 12 holding registers from offset 0 of unit 15 (BS-TGR-03) · hex: 00 01 00 00 00 06 0F 03 00 00 00 0C</text><rect x="120" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="160.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">00</text><text x="160.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0</text><rect x="200" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="240.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">01</text><text x="240.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1</text><rect x="280" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="320.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">00</text><text x="320.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">2</text><rect x="360" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="400.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">00</text><text x="400.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">3</text><rect x="440" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="480.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">00</text><text x="480.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">4</text><rect x="520" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="560.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">06</text><text x="560.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">5</text><rect x="600" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="640.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">0F</text><text x="640.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">6</text><rect x="680" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="720.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#1565c0">03</text><text x="720.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">7</text><rect x="760" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="800.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#1565c0">00</text><text x="800.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">8</text><rect x="840" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="880.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#1565c0">00</text><text x="880.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">9</text><rect x="920" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="960.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#1565c0">00</text><text x="960.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">10</text><rect x="1000" y="150" width="80" height="48" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="1040.0" y="181" font-size="18" text-anchor="middle" font-weight="bold" fill="#1565c0">0C</text><text x="1040.0" y="214" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">11</text><path d="M122,144 L122,136 L678,136 L678,144" stroke="#000" stroke-width="1.3" fill="none"/><text x="400.0" y="130" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">MBAP header – 7 bytes (Modbus Application Protocol header)</text><path d="M682,144 L682,136 L1078,136 L1078,144" stroke="#1565c0" stroke-width="1.3" fill="none"/><text x="880.0" y="130" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0">PDU – 5 bytes</text><path d="M122,226 L122,234 L278,234 L278,226" stroke="#000" stroke-width="1.3" fill="none"/><text x="200.0" y="250" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Transaction id</text><text x="200.0" y="265" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0x0001 – echoed</text><path d="M282,226 L282,234 L438,234 L438,226" stroke="#000" stroke-width="1.3" fill="none"/><text x="360.0" y="250" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Protocol id</text><text x="360.0" y="265" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">0 = Modbus</text><path d="M442,226 L442,234 L598,234 L598,226" stroke="#000" stroke-width="1.3" fill="none"/><text x="520.0" y="250" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Length</text><text x="520.0" y="265" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">6 = unit + PDU</text><path d="M602,226 L602,234 L678,234 L678,226" stroke="#000" stroke-width="1.3" fill="none"/><text x="640.0" y="250" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Unit id</text><text x="640.0" y="265" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">15</text><path d="M682,226 L682,234 L758,234 L758,226" stroke="#1565c0" stroke-width="1.3" fill="none"/><text x="720.0" y="250" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0">Function</text><text x="720.0" y="265" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">03</text><path d="M762,226 L762,234 L918,234 L918,226" stroke="#1565c0" stroke-width="1.3" fill="none"/><text x="840.0" y="250" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0">Start</text><text x="840.0" y="265" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">0 = 40001</text><path d="M922,226 L922,234 L1078,234 L1078,226" stroke="#1565c0" stroke-width="1.3" fill="none"/><text x="1000.0" y="250" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0">Quantity</text><text x="1000.0" y="265" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">12 registers</text><rect x="24" y="330" width="1030" height="28" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="32" y="349" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Field</text><text x="202" y="349" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Bytes</text><text x="272" y="349" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Value here</text><text x="422" y="349" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Meaning / rule</text><rect x="24" y="358" width="1030" height="28" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="377" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Transaction id</text><text x="202" y="377" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0 – 1</text><text x="272" y="377" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x0001</text><text x="422" y="377" font-size="11" text-anchor="start" font-weight="normal" fill="#000">chosen by the client, +1 per request; the server copies it into the answer – late answers are found by it</text><rect x="24" y="386" width="1030" height="28" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="405" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Protocol id</text><text x="202" y="405" font-size="12" text-anchor="start" font-weight="normal" fill="#000">2 – 3</text><text x="272" y="405" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x0000</text><text x="422" y="405" font-size="11" text-anchor="start" font-weight="normal" fill="#000">always 0 for Modbus</text><rect x="24" y="414" width="1030" height="28" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="433" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Length</text><text x="202" y="433" font-size="12" text-anchor="start" font-weight="normal" fill="#000">4 – 5</text><text x="272" y="433" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x0006 = 6</text><text x="422" y="433" font-size="11" text-anchor="start" font-weight="normal" fill="#000">number of bytes that follow: unit id (1) + PDU (5)</text><rect x="24" y="442" width="1030" height="28" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="461" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Unit id</text><text x="202" y="461" font-size="12" text-anchor="start" font-weight="normal" fill="#000">6</text><text x="272" y="461" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x0F = 15</text><text x="422" y="461" font-size="11" text-anchor="start" font-weight="normal" fill="#000">selects the device behind a gateway; plan: unit id = machine 1 … 73</text><rect x="24" y="470" width="1030" height="28" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="489" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Function code</text><text x="202" y="489" font-size="12" text-anchor="start" font-weight="normal" fill="#000">7</text><text x="272" y="489" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x03</text><text x="422" y="489" font-size="11" text-anchor="start" font-weight="normal" fill="#000">03 read holding registers (04 input registers, 06 write one, 16 write many)</text><rect x="24" y="498" width="1030" height="28" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="517" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Start address</text><text x="202" y="517" font-size="12" text-anchor="start" font-weight="normal" fill="#000">8 – 9</text><text x="272" y="517" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x0000 = 0</text><text x="422" y="517" font-size="11" text-anchor="start" font-weight="normal" fill="#000">0-based offset on the wire; tools that count from 1 show it as 40001</text><rect x="24" y="526" width="1030" height="28" rx="0" fill="#fff" stroke="#000" stroke-width="0.6"/><text x="32" y="545" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Quantity</text><text x="202" y="545" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10 – 11</text><text x="272" y="545" font-size="12" text-anchor="start" font-weight="normal" fill="#000">0x000C = 12</text><text x="422" y="545" font-size="11" text-anchor="start" font-weight="normal" fill="#000">1 … 125 registers per read (else exception 03)</text><rect x="24" y="584" width="760" height="150" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="606" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Rules to remember</text><text x="36" y="630" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• All numbers big-endian (high byte first). TCP port 502, one TCP connection carries many requests.</text><text x="36" y="654" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Max ADU 260 bytes = 7 MBAP + 253 PDU → max 125 registers per read, 123 per write (FC16).</text><text x="36" y="678" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• No CRC: TCP/Ethernet check the data. No 3.5-character gaps like Modbus RTU.</text><text x="36" y="702" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Answer = same MBAP (length changes) + PDU: 03, byte count, register values.</text><text x="36" y="726" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Error answer: function code + 0x80 and one exception code (01, 02, 03, 04, 0B …).</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Modbus TCP frame anatomy</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-03  ·  guide 43 §6.2</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
