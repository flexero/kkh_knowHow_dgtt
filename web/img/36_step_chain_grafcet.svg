<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 970" width="1400" height="970" font-family="Arial, Helvetica, sans-serif">
<title>APC step chain as GRAFCET (IEC 60848) – steps 0 to 9 with actions and transitions (example)</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="0.8"/></pattern></defs>
<rect x="0" y="0" width="1400" height="970" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#000" font-weight="bold">APC step chain as GRAFCET (IEC 60848) – steps, actions, transitions, watchdogs (= Networks 8–14 of the program)</text>
<text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#666666">Square = step (double square = initial step). Box on the right = action (output while the step is active). Bar = transition condition.</text>
