<text x="110.0" y="115.0" font-size="11" text-anchor="end" fill="#666666">S0</text>
<text x="180.0" y="106.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">idle – wait for M60</text>
<line x1="142.0" y1="130.0" x2="142.0" y2="174.0" stroke="#000" stroke-width="1.5"/>
<line x1="124.0" y1="152.0" x2="160.0" y2="152.0" stroke="#000" stroke-width="3"/>
<text x="170.0" y="156.0" font-size="11" text-anchor="start" fill="#1565c0">NC_M60 · M_StartOK (Network 6) · M_TrEn</text>
<rect x="120.0" y="174.0" width="44.0" height="40.0" rx="0" stroke="#000" stroke-width="2" fill="#fff"/>
<text x="142.0" y="200.0" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">1</text>
<text x="110.0" y="199.0" font-size="11" text-anchor="end" fill="#666666">S1</text>
<text x="180.0" y="190.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">door open</text>
<line x1="164.0" y1="194.0" x2="320.0" y2="194.0" stroke="#000" stroke-width="1.2"/>
<rect x="320.0" y="180.0" width="360.0" height="28.0" rx="0" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="328.0" y="199.0" font-size="11" text-anchor="start" fill="#000">DoorOpen (Y0.4 / %Q20.4)</text>
<line x1="142.0" y1="214.0" x2="142.0" y2="258.0" stroke="#000" stroke-width="1.5"/>
<line x1="124.0" y1="236.0" x2="160.0" y2="236.0" stroke="#000" stroke-width="3"/>
<text x="170.0" y="240.0" font-size="11" text-anchor="start" fill="#1565c0">APCDoorOpen · NC_InPos · station door closed · curtain free</text>
<text x="700.0" y="199.0" font-size="11" text-anchor="start" fill="#c62828">watchdog T_Wd1 = 3.0 s → F_Wd</text>
<rect x="120.0" y="258.0" width="44.0" height="40.0" rx="0" stroke="#000" stroke-width="2" fill="#fff"/>
<text x="142.0" y="284.0" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">2</text>
<text x="110.0" y="283.0" font-size="11" text-anchor="end" fill="#666666">S2</text>
<text x="180.0" y="274.0" font-size="12" text-anchor="start" fill="#000" font-weight="bold">unclamp</text>
<line x1="164.0" y1="278.0" x2="320.0" y2="278.0" stroke="#000" stroke-width="1.2"/>
<rect x="320.0" y="264.0" width="360.0" height="28.0" rx="0" stroke="#000" stroke-width="1.2" fill="#fff"/>
<text x="328.0" y="283.0" font-size="11" text-anchor="start" fill="#000">UnclampValve 2V1 (Y0.2 / %Q20.2)</text>
<line x1="142.0" y1="298.0" x2="142.0" y2="342.0" stroke="#000" stroke-width="1.5"/>
<line x1="124.0" y1="320.0" x2="160.0" y2="320.0" stroke="#000" stroke-width="3"/>
<text x="170.0" y="324.0" font-size="11" text-anchor="start" fill="#1565c0">MachineUnclamped (2S1 ≥ 4.5 MPa) · ArmDown</text>
<text x="700.0" y="283.0" font-size="11" text-anchor="start" fill="#c62828">watchdog T_Wd2 = 1.6 s → F_Wd</text>
<rect x="120.0" y="342.0" width="44.0" height="40.0" rx="0" stroke="#000" stroke-width="2" fill="#fff"/>
<text x="142.0" y="368.0" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">3</text>
