<text x="190.0" y="792.0" font-size="11" text-anchor="start" fill="#000">Tank 600 × 400 × 330 = 79 L gross; oil at max level ≈ 600 × 400 × 260 = 62 L (option A: 3–5 × 18.7 L/min).</text>
<text x="700.0" y="790.0" font-size="11" text-anchor="start" fill="#000"></text>
<rect x="950.0" y="90.0" width="430.0" height="560.0" rx="0" stroke="#000" stroke-width="1.2" fill="#f7f7f7"/>
<text x="962.0" y="114.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Design rules for the tank and the HPU (example values)</text>
<text x="962.0" y="140.0" font-size="11" text-anchor="start" fill="#000">Oil volume 3–5 × pump flow per minute (industrial);</text>
<text x="962.0" y="163.0" font-size="11" text-anchor="start" fill="#000">  with accumulator / small pump: oil swing + 20–30 % reserve.</text>
<text x="962.0" y="186.0" font-size="11" text-anchor="start" fill="#000">Air release: dwell time of the oil ≥ 3–5 min in the tank.</text>
<text x="962.0" y="209.0" font-size="11" text-anchor="start" fill="#000">Baffle 2/3 of the oil height between return and suction.</text>
<text x="962.0" y="232.0" font-size="11" text-anchor="start" fill="#000">Suction velocity 0.6–1.2 m/s; pump inlet ≥ −0.02 MPa</text>
<text x="962.0" y="255.0" font-size="11" text-anchor="start" fill="#000">  (gear) – check the pump datasheet. Submerged pump = quiet.</text>
<text x="962.0" y="278.0" font-size="11" text-anchor="start" fill="#000">Return pipe below min level (no foam), 45° cut to the wall.</text>
<text x="962.0" y="301.0" font-size="11" text-anchor="start" fill="#000">Return filter on the lid: change the element without draining.</text>
<text x="962.0" y="324.0" font-size="11" text-anchor="start" fill="#000">Breather 3 µm (β ≥ 200), with desiccant in humid shops.</text>
<text x="962.0" y="347.0" font-size="11" text-anchor="start" fill="#000">Level + temperature: sight gauge + switch (min level,</text>
<text x="962.0" y="370.0" font-size="11" text-anchor="start" fill="#000">  alarm 60 °C, stop 70 °C – example).</text>
<text x="962.0" y="393.0" font-size="11" text-anchor="start" fill="#000">Drain at the lowest point, bottom sloped, clean-out covers.</text>
<text x="962.0" y="416.0" font-size="11" text-anchor="start" fill="#000">Free surface for cooling: k ≈ 10–15 W/m²K (still air).</text>
<text x="962.0" y="439.0" font-size="11" text-anchor="start" fill="#000">Motor–pump: bell housing + elastic coupling, alignment</text>
<text x="962.0" y="462.0" font-size="11" text-anchor="start" fill="#000">  by spigot; anti-vibration mounts; hoses to the machine.</text>
<text x="962.0" y="485.0" font-size="11" text-anchor="start" fill="#000">Lid: oil-tight, sloped, drip tray under the whole unit</text>
<text x="962.0" y="508.0" font-size="11" text-anchor="start" fill="#000">  (110 % of the oil volume where the site rules ask).</text>
<text x="962.0" y="531.0" font-size="11" text-anchor="start" fill="#000">Test points (M16×2) at pump, after filter, at each consumer.</text>
<text x="962.0" y="554.0" font-size="11" text-anchor="start" fill="#000">Electric: motor IE3 (EU 2019/1781), 24 V DC solenoids,</text>
<text x="962.0" y="577.0" font-size="11" text-anchor="start" fill="#000">  level/temperature/filter switches to the PLC.</text>
<text x="962.0" y="600.0" font-size="11" text-anchor="start" fill="#000">Paint inside: oil-resistant primer or bare pickled steel.</text>
<text x="962.0" y="623.0" font-size="11" text-anchor="start" fill="#000">Nameplate: fluid, volume, p max, relief setting, circuit no.</text>
<text x="40.0" y="810.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Top view (not to scale)</text>
