<text x="24.0" y="700.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Interlocks (PLC, safety PLC for the safe ones):</text>
<text x="24.0" y="724.0" font-size="12" text-anchor="start" fill="#000">travel + hoist only if S2 centre = 1 (2 channels, PL d typical – check EN 528 / EN ISO 13849 risk assessment)</text>
<text x="24.0" y="746.0" font-size="12" text-anchor="start" fill="#000">fork extends only if S1 in position = 1 and (store) S7/S8 occupancy = 0;  stop if torque / current high (collision)</text>
<text x="24.0" y="768.0" font-size="12" text-anchor="start" fill="#000">after retract: S4 load = 1, S5 + S6 overhang = 0, encoder = end switch (± 10 mm slip check), weight ≤ 330 kg (load pins)</text>
