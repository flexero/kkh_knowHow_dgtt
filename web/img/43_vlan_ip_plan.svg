<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>VLAN + IP plan – drawing 43-02</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">VLAN + IP plan – 10.60.xx.host, VLAN 6xx (proposal)</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Second byte 60 = this plant, third byte = VLAN – 600, so every technician reads the VLAN from the address</text><rect x="24" y="80" width="1150" height="30" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="32" y="100" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">VLAN</text><text x="92" y="100" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Name</text><text x="202" y="100" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Subnet</text><text x="332" y="100" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Zone</text><text x="542" y="100" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Devices + host range</text><text x="762" y="100" font-size="12" text-anchor="start" font-weight="bold" fill="#fff">Example host name + IP</text><rect x="24" y="110" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="130" font-size="12" text-anchor="start" font-weight="bold" fill="#000">610</text><text x="92" y="130" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-DMZ</text><text x="202" y="130" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.10.0/24</text><text x="332" y="130" font-size="12" text-anchor="start" font-weight="normal" fill="#000">DMZ (IT &lt;-&gt; OT)</text><text x="542" y="130" font-size="12" text-anchor="start" font-weight="normal" fill="#000">servers .10 – .19</text><text x="762" y="130" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-dmz-erpgw01  10.60.10.11</text><rect x="24" y="140" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="160" font-size="12" text-anchor="start" font-weight="bold" fill="#000">620</text><text x="92" y="160" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-OPS</text><text x="202" y="160" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.20.0/24</text><text x="332" y="160" font-size="12" text-anchor="start" font-weight="normal" fill="#000">operations (level 3)</text><text x="542" y="160" font-size="12" text-anchor="start" font-weight="normal" fill="#000">servers .10 – .19</text><text x="762" y="160" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-ops-mes01  10.60.20.10</text><rect x="24" y="170" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="190" font-size="12" text-anchor="start" font-weight="bold" fill="#000">630</text><text x="92" y="190" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-SUP</text><text x="202" y="190" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.30.0/24</text><text x="332" y="190" font-size="12" text-anchor="start" font-weight="normal" fill="#000">supervisory (level 2)</text><text x="542" y="190" font-size="12" text-anchor="start" font-weight="normal" fill="#000">servers .9 – .31</text><text x="762" y="190" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-sup-gw01  10.60.30.10</text><rect x="24" y="200" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="220" font-size="12" text-anchor="start" font-weight="bold" fill="#000">641</text><text x="92" y="220" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-SOFT</text><text x="202" y="220" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.41.0/24</text><text x="332" y="220" font-size="12" text-anchor="start" font-weight="normal" fill="#000">cell: soft machining</text><text x="542" y="220" font-size="12" text-anchor="start" font-weight="normal" fill="#000">19 machines .11 – .29</text><text x="762" y="220" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-smc-mssaw01  10.60.41.11</text><rect x="24" y="230" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#000">642</text><text x="92" y="250" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-HT</text><text x="202" y="250" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.42.0/24</text><text x="332" y="250" font-size="12" text-anchor="start" font-weight="normal" fill="#000">cell: heat treatment</text><text x="542" y="250" font-size="12" text-anchor="start" font-weight="normal" fill="#000">9 machines .11 – .19</text><text x="762" y="250" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-htr-bsind01  10.60.42.11</text><rect x="24" y="260" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="280" font-size="12" text-anchor="start" font-weight="bold" fill="#000">643</text><text x="92" y="280" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-GRIND</text><text x="202" y="280" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.43.0/24</text><text x="332" y="280" font-size="12" text-anchor="start" font-weight="normal" fill="#000">cell: grinding room</text><text x="542" y="280" font-size="12" text-anchor="start" font-weight="normal" fill="#000">22 machines .11 – .32</text><text x="762" y="280" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-grd-bsclp01  10.60.43.11</text><rect x="24" y="290" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="310" font-size="12" text-anchor="start" font-weight="bold" fill="#000">644</text><text x="92" y="310" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-QC</text><text x="202" y="310" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.44.0/24</text><text x="332" y="310" font-size="12" text-anchor="start" font-weight="normal" fill="#000">cell: metrology</text><text x="542" y="310" font-size="12" text-anchor="start" font-weight="normal" fill="#000">8 machines .11 – .18</text><text x="762" y="310" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-qcl-qcled01  10.60.44.11</text><rect x="24" y="320" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="340" font-size="12" text-anchor="start" font-weight="bold" fill="#000">645</text><text x="92" y="340" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-ASSY</text><text x="202" y="340" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.45.0/24</text><text x="332" y="340" font-size="12" text-anchor="start" font-weight="normal" fill="#000">cell: assembly + packing</text><text x="542" y="340" font-size="12" text-anchor="start" font-weight="normal" fill="#000">15 machines .11 – .25</text><text x="762" y="340" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-asm-aswsh01  10.60.45.11</text><rect x="24" y="350" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="370" font-size="12" text-anchor="start" font-weight="bold" fill="#000">650</text><text x="92" y="370" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-AGV</text><text x="202" y="370" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.50.0/24</text><text x="332" y="370" font-size="12" text-anchor="start" font-weight="normal" fill="#000">AGV Wi-Fi (own SSID)</text><text x="542" y="370" font-size="12" text-anchor="start" font-weight="normal" fill="#000">AGVs .51 –, chargers .150 –</text><text x="762" y="370" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-agv-agv01  10.60.50.51</text><rect x="24" y="380" width="1150" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="0.7"/><text x="32" y="400" font-size="12" text-anchor="start" font-weight="bold" fill="#000">660</text><text x="92" y="400" font-size="12" text-anchor="start" font-weight="normal" fill="#000">BSF-UTIL</text><text x="202" y="400" font-size="12" text-anchor="start" font-weight="normal" fill="#000">10.60.60.0/24</text><text x="332" y="400" font-size="12" text-anchor="start" font-weight="normal" fill="#000">utilities</text><text x="542" y="400" font-size="12" text-anchor="start" font-weight="normal" fill="#000">meters .150 –, others .11 –</text><text x="762" y="400" font-size="12" text-anchor="start" font-weight="normal" fill="#000">vc-bsf-utl-em01  10.60.60.150</text><rect x="24" y="434" width="560" height="186" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="456" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Host numbers inside every cell VLAN</text><text x="36" y="480" font-size="12" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">.1          router interface (firewall / core) = default gateway</text><text x="36" y="502" font-size="12" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">.2 – .9     switches of this VLAN (vc-bsf-&lt;area&gt;-sw&lt;VLAN&gt;-&lt;n&gt;)</text><text x="36" y="524" font-size="12" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">.11 – .99   machines in the order of the machine list (= unit id order)</text><text x="36" y="546" font-size="12" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">.100 – .149 HMIs, station PCs</text><text x="36" y="568" font-size="12" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">.150 – .199 I/O couplers, energy meters, cameras, printers</text><text x="36" y="590" font-size="12" text-anchor="start" font-weight="normal" fill="#000" xml:space="preserve">.240 – .254 service laptops (fixed, documented) – no DHCP</text><rect x="604" y="434" width="572" height="108" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="616" y="456" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Host name rule (guide 15 style, lower case, hyphen only)</text><text x="616" y="480" font-size="13" text-anchor="start" font-weight="bold" fill="#1565c0">vc-bsf-&lt;area&gt;-&lt;machine id without hyphens&gt;</text><text x="616" y="502" font-size="11" text-anchor="start" font-weight="normal" fill="#000">areas: smc soft · htr heat · grd grinding · qcl metrology · asm assembly</text><text x="616" y="522" font-size="11" text-anchor="start" font-weight="normal" fill="#000">servers: vc-bsf-&lt;dmz|ops|sup&gt;-&lt;role&gt;&lt;nn&gt;, e.g. vc-bsf-sup-gw01</text><rect x="604" y="552" width="200" height="68" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="614" y="572" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Modbus unit id</text><text x="614" y="590" font-size="11" text-anchor="start" font-weight="normal" fill="#000">1 … 73, plant-wide unique</text><text x="614" y="608" font-size="11" text-anchor="start" font-weight="normal" fill="#000">(same order as the list)</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">VLAN + IP plan</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-02  ·  guide 43 §4.3</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
