<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Arial, Helvetica, sans-serif"><title>Sequence MES order → machine – drawing 43-09</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><rect x="0" y="0" width="1200" height="830" fill="#fff"/><rect x="6" y="6" width="1188" height="818" fill="none" stroke="#000" stroke-width="1"/><text x="24" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#000">Sequence – production order from ERP to the machine and the confirmation back</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Above the gateway: HTTP (black) · below the gateway: Modbus TCP (blue) · machine BS-TGR-03, unit 15</text><rect x="55.0" y="74" width="150" height="32" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="130.0" y="94.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">ERP (IT)</text><line x1="130" y1="106" x2="130" y2="728" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/><rect x="295.0" y="74" width="210" height="32" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="400.0" y="94.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">MES vc-bsf-ops-mes01</text><line x1="400" y1="106" x2="400" y2="728" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/><rect x="595.0" y="74" width="210" height="32" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="700.0" y="94.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Gateway vc-bsf-sup-gw01</text><line x1="700" y1="106" x2="700" y2="728" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/><rect x="935.0" y="74" width="210" height="32" rx="3" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="1040.0" y="94.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#000">Machine PLC BS-TGR-03</text><line x1="1040" y1="106" x2="1040" y2="728" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/><line x1="130" y1="134" x2="394" y2="134" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="265.0" y="129" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">1  POST /api/bsf/erp/productionorders/{id}/release</text><line x1="400" y1="170" x2="136" y2="170" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="265.0" y="165" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">2  201 Created {mesWorkOrder, lots}</text><line x1="400" y1="206" x2="694" y2="206" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="550.0" y="201" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">3  POST /api/bsf/command {id, cmd: order, msgId}</text><line x1="700" y1="242" x2="1034" y2="242" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><text x="870.0" y="237" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">4  FC03 read 200 – 202 (code, seq, ctl)</text><line x1="700" y1="278" x2="1034" y2="278" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><text x="870.0" y="273" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">5  FC03 read 8 – 10: REQ = ACK? (free)</text><line x1="700" y1="314" x2="1034" y2="314" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><text x="870.0" y="309" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">6  FC16 write 200 – 225 (code 1, seq + 1, order …)</text><line x1="700" y1="350" x2="1034" y2="350" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><text x="870.0" y="345" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">7  FC06 write 202: toggle REQ (LAST)</text><path d="M1040,380 h34 v14 h-32" stroke="#1565c0" stroke-width="1.4" fill="none"/><text x="1030" y="390" font-size="11" text-anchor="end" font-weight="bold" fill="#1565c0"> 8</text><text x="1024" y="400" font-size="11" text-anchor="end" font-weight="normal" fill="#1565c0">check data, copy, ACK = REQ (≈ 150 ms)</text><line x1="700" y1="422" x2="1034" y2="422" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><text x="870.0" y="417" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">9  FC03 poll 8 – 11 every 100 ms until ACK = REQ</text><line x1="700" y1="458" x2="406" y2="458" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="550.0" y="453" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">10  200 OK {ok: true, result 0, ackSeq} (or 422)</text><path d="M1040,488 h34 v14 h-32" stroke="#1565c0" stroke-width="1.4" fill="none"/><text x="1030" y="498" font-size="11" text-anchor="end" font-weight="bold" fill="#1565c0">11</text><text x="1024" y="508" font-size="11" text-anchor="end" font-weight="normal" fill="#1565c0">produce the lot, hs.lotDone counts up</text><line x1="700" y1="530" x2="1034" y2="530" stroke="#1565c0" stroke-width="1.6" marker-end="url(#aa)"/><text x="870.0" y="525" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">12  fast poll 500 ms sees DONE toggle</text><line x1="400" y1="566" x2="694" y2="566" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="550.0" y="561" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">13  GET /api/bsf/events?since=N&amp;wait=20 (long poll)</text><line x1="700" y1="602" x2="406" y2="602" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="550.0" y="597" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">14  event: hs.status DONE, std.good + 20</text><path d="M400,632 h34 v14 h-32" stroke="#000" stroke-width="1.4" fill="none"/><text x="390" y="642" font-size="11" text-anchor="end" font-weight="bold" fill="#000">15</text><text x="440" y="644" font-size="11" text-anchor="start" font-weight="normal" fill="#000">operation confirmation, lot complete</text><line x1="400" y1="674" x2="136" y2="674" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/><text x="265.0" y="669" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">16  POST /api/bsf/erp/goodsmovements {type: GR}</text><rect x="24" y="738" width="760" height="64" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="36" y="758" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Why the toggle bit: a level (1 = request) stays on after a gateway restart and would be</text><text x="36" y="774" font-size="11" text-anchor="start" font-weight="normal" fill="#000">executed twice. A toggle + sequence number + msgId makes every command exactly-once.</text><text x="36" y="790" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Time-out 3 s without ACK → 422 to the MES, operator checks the machine (mode auto?).</text><rect x="825" y="738" width="360" height="80" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="825" y1="768" x2="1185" y2="768" stroke="#000" stroke-width="1.2"/><line x1="825" y1="792" x2="1185" y2="792" stroke="#000" stroke-width="1.2"/><text x="835" y="759" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Sequence MES order → machine</text><text x="835" y="785" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Drawing 43-09  ·  guide 43 §11</text><text x="835" y="810" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check with your network designer</text></svg>
