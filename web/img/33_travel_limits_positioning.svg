at 0); drive out only in manual with key</text><rect x="620" y="250" width="56" height="36" rx="2" class="ck-box ck-boxon"/><path d="M635,268 H654" class="ck-thin"/><path d="M654,264 L661,268 L654,272 Z" class="sr-fill"/><circle cx="635" cy="268" r="3" class="sr-fill"/><text x="686" y="262" class="ck-tx ck-b" text-anchor="start" font-size="12.5">-BG44 laser distance sensor (travel)</text><text x="686" y="275" class="ck-tx ck-mut" text-anchor="start" font-size="11">e.g. SICK DL100 Pro / Leuze AMS 300i, PROFINET</text><text x="686" y="287.5" class="ck-tx ck-mut" text-anchor="start" font-size="11">range ≥ 30 m · resolution 0.1 mm · reflector at the end</text><rect x="620" y="330" width="56" height="36" rx="2" class="ck-box ck-boxon"/><path d="M636,340 V356 M640,340 V356 M645,340 V356 M649,340 V356 M654,340 V356 M659,340 V356" class="ck-thin"/><text x="686" y="342" class="ck-tx ck-b" text-anchor="start" font-size="12.5">-BG45 bar-code positioning (hoist)</text><text x="686" y="355" class="ck-tx ck-mut" text-anchor="start" font-size="11">e.g. Leuze BPS 300i / SICK OLM100, bar code on the mast</text><text x="686" y="367.5" class="ck-tx ck-mut" text-anchor="start" font-size="11">absolute position, no reference run</text><rect x="620" y="410" width="56" height="36" rx="2" class="ck-box"/><path d="M636,424 L652,424 M636,432 L652,432" class="ck-thin"/><path d="M652,421 L658,424 L652,427 Z M652,429 L658,432 L652,435 Z" class="sr-fill"/><text x="686" y="422" class="ck-tx ck-b" text-anchor="start" font-size="12.5">-BG67 slot-reference sensor (fine positioning)</text><text x="686" y="435" class="ck-tx ck-mut" text-anchor="start" font-size="11">reflects on a mark at each bay / level</text><text x="686" y="447.5" class="ck-tx ck-mut" text-anchor="start" font-size="11">corrects rack tolerances</text><path d="M648,286 L648,300 L600,300 L600,500" class="ck-w ck-w-bus"/><path d="M648,366 L648,378 L600,378" class="ck-w ck-w-bus"/><path d="M620,428 L600,428" class="ck-w ck-w-24"/><text x="604" y="520" class="ck-tx ck-ref" text-anchor="start" font-size="11">PROFINET (green) + 24 V to -KF30 → /6</text><rect x="40" y="540" width="520" height="160" rx="2" class="ck-box ck-note"/><text x="50" y="558" class="ck-tx ck-b" text-anchor="start" font-size="11">Safe end-of-aisle function (example values)</text><text x="50" y="575" class="ck-tx" text-anchor="start" font-size="11">normal stop from 3 m/s at 0.5 m/s²: s = v²/(2a) = 9.0 m</text><text x="50" y="592" class="ck-tx" text-anchor="start" font-size="11">emergency stop (SS1, 1 m/s²): s = 4.5 m</text><text x="50" y="609" class="ck-tx" text-anchor="start" font-size="11">slow-down zone starts ≥ braking distance + reaction (speed cam or safe position)</text><text x="50" y="626" class="ck-tx" text-anchor="start" font-size="11">safe position: laser -BG44 + motor encoder compared in the F-PLC (2 ch)</text><text x="50" y="643" class="ck-tx" text-anchor="start" font-size="11">buffer only for the monitored residual speed, e.g. 1.0 m/s:</text><text x="50" y="660" class="ck-tx" text-anchor="start" font-size="11">E = ½·m·v² = ½ · 4500 · 1.0² = 2.25 kJ · stroke at 5 m/s²: 100 mm</text><text x="50" y="677" class="ck-tx" text-anchor="start" font-size="11">(the buffer data come from the crane maker – EN 528)</text><rect x="600" y="560" width="540" height="140" rx="2" class="ck-box ck-note"/><text x="610" y="578" class="ck-tx ck-b" text-anchor="start" font-size="11">Now (live)</text><text x="610" y="596" class="ck-tx" text-anchor="start" font-size="11">crane x = 20.00 m · v_x = 0.00 m/s</text><text x="610" y="614" class="ck-tx" text-anchor="start" font-size="11">slow-down front -BG40: free · rear -BG41: free</text><text x="610" y="632" class="ck-tx" text-anchor="start" font-size="11">final limits: closed (OK)</text><text x="610" y="650" class="ck-tx" text-anchor="start" font-size="11">slot reference -BG67: –</text><text x="610" y="668" class="ck-tx" text-anchor="start" font-size="11">wiring: laser + BPS on PROFINET, shielded, cable in the drag chain of the carriage</text></svg>
