<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 760" width="1150" height="760" font-family="Arial, Helvetica, sans-serif"><title>Worm mesh – contact pattern and backlash</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.8"/></pattern><pattern id="hatA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1565c0" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1150" height="760" fill="#fff"/><rect x="4.0" y="4.0" width="1142.0" height="752.0" rx="0" fill="none" stroke="#000" stroke-width="1.5"/><text x="30.0" y="34.0" font-size="17" text-anchor="start" font-weight="bold" fill="#000">Worm mesh – contact pattern, duplex worm backlash adjustment, backlash measurement</text><rect x="20.0" y="50.0" width="370.0" height="610.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="20.0" y="50.0" width="281.8" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="25.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">A  Contact pattern on the wheel flank</text><rect x="40.0" y="110.0" width="150.0" height="110.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="38.0" y="104.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">tip</text><text x="38.0" y="234.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">root</text><text x="100.0" y="234.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">entry side</text><text x="190.0" y="234.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">exit</text><ellipse cx="123.0" cy="165.0" rx="55.0" ry="32.0" fill="#1565c0" fill-opacity="0.45" stroke="#1565c0"/><text x="40.0" y="258.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Correct: centred, ≥ 60 %,</text><text x="40.0" y="272.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">slightly to the exit side</text><rect x="215.0" y="110.0" width="150.0" height="110.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="213.0" y="104.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">tip</text><text x="213.0" y="234.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">root</text><text x="275.0" y="234.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">entry side</text><text x="365.0" y="234.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">exit</text><ellipse cx="326.0" cy="165.0" rx="38.5" ry="22.4" fill="#1565c0" fill-opacity="0.45" stroke="#1565c0"/><text x="215.0" y="258.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Mid-plane wrong (shim):</text><text x="215.0" y="272.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">pattern to one side</text><rect x="40.0" y="360.0" width="150.0" height="110.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="38.0" y="354.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">tip</text><text x="38.0" y="484.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">root</text><text x="100.0" y="484.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">entry side</text><text x="190.0" y="484.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">exit</text><ellipse cx="123.0" cy="393.0" rx="27.5" ry="16.0" fill="#1565c0" fill-opacity="0.45" stroke="#1565c0"/><text x="40.0" y="508.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Centre distance too big:</text><text x="40.0" y="522.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">small, at the tip</text><rect x="215.0" y="360.0" width="150.0" height="110.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="213.0" y="354.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">tip</text><text x="213.0" y="484.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">root</text><text x="275.0" y="484.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">entry side</text><text x="365.0" y="484.0" font-size="11" text-anchor="end" font-weight="normal" fill="#000">exit</text><ellipse cx="298.0" cy="437.0" rx="27.5" ry="16.0" fill="#1565c0" fill-opacity="0.45" stroke="#1565c0"/><text x="215.0" y="508.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">Centre distance too small:</text><text x="215.0" y="522.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">at the root – stop</text><text x="35.0" y="640.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Face width along x (36 mm), tooth height along y.</text><rect x="405.0" y="50.0" width="725.0" height="300.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="405.0" y="50.0" width="429.8" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="410.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">B  Duplex worm – the spacer ring sets the backlash (21.3)</text><rect x="500.0" y="170.0" width="520.0" height="20.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.5"/><path d="M529.0,170 L535.0,146 L545.0,146 L551.0,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M566.2,170 L572.2,146 L583.8,146 L589.8,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M603.4,170 L609.4,146 L622.6,146 L628.6,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M640.6,170 L646.6,146 L661.4,146 L667.4,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M677.8,170 L683.8,146 L700.2,146 L706.2,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M715.0,170 L721.0,146 L739.0,146 L745.0,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M752.2,170 L758.2,146 L777.8,146 L783.8,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M789.4,170 L795.4,146 L816.6,146 L822.6,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M826.6,170 L832.6,146 L855.4,146 L861.4,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M863.8,170 L869.8,146 L894.2,146 L900.2,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M901.0,170 L907.0,146 L933.0,146 L939.0,170" fill="#fff" stroke="#000" stroke-width="1.2"/><path d="M938.2,170 L944.2,146 L971.8,146 L977.8,170" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="760.0" y="136.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">tooth thickness grows along the worm (Δp = 0.2 mm per pitch)</text><rect x="440.0" y="140.0" width="40.0" height="80.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><rect x="480.0" y="140.0" width="14.0" height="80.0" rx="0" fill="#1565c0" stroke="#1565c0" stroke-width="1.2"/><text x="460.0" y="236.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">fixed cartridge</text><text x="487.0" y="252.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1565c0">spacer ring</text><rect x="1030.0" y="150.0" width="40.0" height="60.0" rx="0" fill="url(#hat)" stroke="#000" stroke-width="1.2"/><text x="1050.0" y="226.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">floating side</text><line x1="560.0" y1="210.0" x2="660.0" y2="210.0" stroke="#1565c0" stroke-width="2" marker-end="url(#aa)"/><text x="610.0" y="228.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1565c0">shift s</text><text x="420.0" y="300.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Δj = s · Δp / pₓ = s · 0.2 / 12.566 = 15.92 µm per mm</text><text x="420.0" y="320.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Example: j_min 49.6 µm → s = (49.6 − 8)/15.92 = 2.61 mm → spacer 5.000 → 7.614 mm → j 7.6 µm</text><text x="420.0" y="338.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Centre distance and pattern do NOT change. Do a 0.5 mm direction test (≈ 8 µm) before grinding.</text><rect x="405.0" y="365.0" width="400.0" height="295.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="405.0" y="365.0" width="281.8" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="410.0" y="381.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">C  Backlash measurement (worm locked)</text><circle cx="560.0" cy="520.0" r="100.0" fill="none" stroke="#000" stroke-width="1.4"/><circle cx="560.0" cy="520.0" r="72.0" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="6 3"/><circle cx="560.0" cy="520.0" r="3.0" fill="#000" stroke="#000" stroke-width="1.2"/><text x="560.0" y="538.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">pitch Ø360</text><text x="560.0" y="638.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#000">table, dial at Ø500</text><rect x="656.0" y="424.0" width="18.0" height="40.0" rx="0" fill="#fff" stroke="#1565c0" stroke-width="1.6"/><text x="680.0" y="440.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1565c0">dial 0.001</text><text x="680.0" y="454.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1565c0">tangential</text><line x1="560.0" y1="520.0" x2="630.0" y2="450.0" stroke="#000" stroke-width="0.8"/><text x="590.0" y="474.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">r_g 250</text><path d="M500,440 A100,100 0 0 1 620,440" fill="none" stroke="#1565c0" stroke-width="1.5"/><text x="680.0" y="500.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">j = x · 180 / 250</text><text x="680.0" y="520.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">x 68.9 µm → j 49.6 µm</text><text x="680.0" y="540.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">4 positions, smallest</text><text x="680.0" y="554.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">value counts</text><rect x="820.0" y="365.0" width="310.0" height="295.0" rx="0" fill="none" stroke="#000" stroke-width="1"/><rect x="820.0" y="365.0" width="252.2" height="22.0" rx="0" fill="#fff" stroke="#000" stroke-width="1"/><text x="825.0" y="381.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">D  Thermal backlash change (21.4)</text><text x="834.0" y="400.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Δj ≈ 2·tan α·(Δr₂ + Δr₁ − Δa)</text><text x="834.0" y="424.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Unit +10 K, steel hub wheel:</text><text x="834.0" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">  21.5 + 2.9 − 21.5 → −2.1 µm</text><text x="834.0" y="472.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">If wheel all bronze:</text><text x="834.0" y="496.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">  32.4 + 2.9 − 21.5 → −10.0 µm</text><text x="834.0" y="520.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Worm +15 K more: −3.1 µm</text><text x="834.0" y="544.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Worst case set 7.6 → ≈ 2.4 µm left</text><text x="834.0" y="568.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Centre distance 0.01 mm → 7.3 µm</text><text x="834.0" y="592.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">→ never below 5 µm cold</text><rect x="670.0" y="686.0" width="470.0" height="64.0" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><line x1="670.0" y1="708.0" x2="1140.0" y2="708.0" stroke="#000" stroke-width="1.2"/><line x1="670.0" y1="729.0" x2="1140.0" y2="729.0" stroke="#000" stroke-width="1.2"/><text x="678.0" y="702.0" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Worm mesh – contact pattern and backlash</text><text x="678.0" y="723.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1565c0">EXAMPLE – check the maker's documentation</text><text x="678.0" y="744.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">17_worm_mesh_contact.svg · Guide 17 · twin example values · not to scale</text></svg>