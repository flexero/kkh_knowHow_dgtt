<text x="34.0" y="494.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Formulas and the worked example (Op 30, rough turning the Ø130 bar)</text>
<text x="34.0" y="520.0" font-size="12" text-anchor="start" fill="#000">n = 1000 · v_c / (π · D) = 1000 · 180 / (π · 130) = 441 rpm</text>
<text x="34.0" y="541.0" font-size="12" text-anchor="start" fill="#000">h = f · sin κ_r = 0.35 · sin 95° = 0.349 mm ;  b = a_p / sin κ_r = 3.01 mm</text>
<text x="34.0" y="562.0" font-size="12" text-anchor="start" fill="#000">k_c = k_c1.1 · h^(−m_c) = 2 300 · 0.349^(−0.25) = 2 993 N/mm²  (k_c1.1, m_c: reference – tool maker)</text>
<text x="34.0" y="583.0" font-size="12" text-anchor="start" fill="#000">F_c = b · h · k_c = 3.01 · 0.349 · 2 993 = 3 143 N ;  torque M = F_c · D/2 = 204 N·m</text>
<text x="34.0" y="604.0" font-size="12" text-anchor="start" fill="#000">P_c = F_c · v_c / 60 000 = 3 143 · 180 / 60 000 = 9.4 kW ;  P_motor = P_c / 0.8 = 11.8 kW</text>
<text x="34.0" y="625.0" font-size="12" text-anchor="start" fill="#000">Q = v_c · a_p · f = 180 · 3 · 0.35 = 189 cm³/min  →  roughing time ≈ V / Q · 1.3 + 6 = 37 min</text>
<text x="720.0" y="520.0" font-size="12" text-anchor="start" fill="#000">R_z ≈ f² / (8 · r_ε) · 1000 ;  real R_a ≈ 1.2–2 × theoretical</text>
<text x="720.0" y="541.0" font-size="12" text-anchor="start" fill="#000">Hard turning CBN: k_c1.1 ≈ 4 500, h 0.08 → F_c 66 N, P_c 0.17 kW</text>
<text x="720.0" y="562.0" font-size="12" text-anchor="start" fill="#000">Boring bar overhang L/D: steel ≤ 4, carbide ≤ 6, damped ≤ 10–14</text>
<text x="720.0" y="583.0" font-size="12" text-anchor="start" fill="#000">  HSK taper from the nose: 75 / 32 = 2.3 (easy)</text>
<text x="720.0" y="604.0" font-size="12" text-anchor="start" fill="#000">  Ø41 chamber through Ø22: 290 / 18 = 16 (not possible – 17.2)</text>
<text x="720.0" y="625.0" font-size="12" text-anchor="start" fill="#000">Thread M70×1.5: depth h₃ = 0.613 · 1.5 = 0.92 mm, 6–8 passes</text>
<text x="720.0" y="646.0" font-size="12" text-anchor="start" fill="#000">Grinding is different: v_s 45 m/s = 2 700 m/min, a_e µm (chapter 20)</text>
