<text x="40.0" y="790.0" font-size="12" text-anchor="start" fill="#1565c0">Delta AS: bit addresses word.bit (X0.0 … X0.15), DVP: octal (X0 … X7, X10 …). Siemens: byte.bit, bit 0 … 7 only (%I0.7 → next is %I1.0).</text>
