<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="Arial, Helvetica, sans-serif">
<title>Hydraulic stiffness and natural frequency of a cylinder drive</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect x="0" y="0" width="1400" height="960" fill="#ffffff"/>
<text x="30.0" y="36.0" font-size="16" text-anchor="start" fill="#000" font-weight="bold">Hydraulic stiffness and natural frequency – the oil columns are springs (example: Ø63/36 × 200, load 2 039 kg, β_eff 1.0 GPa)</text>
<text x="30.0" y="56.0" font-size="12" text-anchor="start" fill="#555">Both chambers are closed by the valve: the oil is compressed like a spring. The mass on this oil spring oscillates at f0. Control speed must stay well below f0.</text>
<text x="40.0" y="100.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">Model</text>
<rect x="120.0" y="220.0" width="120.0" height="330.0" rx="0" stroke="#000" stroke-width="2" fill="none"/>
<rect x="122.0" y="403.0" width="116.0" height="14.0" rx="0" stroke="#000" stroke-width="1.2" fill="#ccc"/>
<rect x="165.0" y="150.0" width="30.0" height="253.0" rx="0" stroke="#000" stroke-width="1.5" fill="#fff"/>
<rect x="130.0" y="100.0" width="100.0" height="50.0" rx="0" stroke="#000" stroke-width="1.5" fill="#f2f2f2"/>
<text x="180.0" y="130.0" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">m = 2 039 kg</text>
<polyline points="145.0,228.0 137.0,242.4 153.0,256.8 137.0,271.2 153.0,285.7 137.0,300.1 153.0,314.5 137.0,328.9 153.0,343.3 137.0,357.8 153.0,372.2 137.0,386.6 145.0,401.0" stroke="#000" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<polyline points="215.0,228.0 207.0,242.4 223.0,256.8 207.0,271.2 223.0,285.7 207.0,300.1 223.0,314.5 207.0,328.9 223.0,343.3 207.0,357.8 223.0,372.2 207.0,386.6 215.0,401.0" stroke="#000" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<polyline points="180.0,419.0 166.0,427.8 194.0,436.6 166.0,445.4 194.0,454.1 166.0,462.9 194.0,471.7 166.0,480.5 194.0,489.3 166.0,498.1 194.0,506.9 166.0,515.6 194.0,524.4 166.0,533.2 180.0,542.0" stroke="#000" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="255.0" y="310.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">rod side: c2 = β·A2²/V2</text>
<text x="255.0" y="480.0" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold">cap side: c1 = β·A1²/V1</text>
<text x="255.0" y="502.0" font-size="11" text-anchor="start" fill="#000">x = piston position from the cap end</text>
<line x1="240.0" y1="416.0" x2="250.0" y2="416.0" stroke="#000" stroke-width="1"/>
<text x="40.0" y="610.0" font-size="12" text-anchor="start" fill="#000">c = c1 + c2 = β·(A1²/V1 + A2²/V2)</text>
<text x="40.0" y="629.0" font-size="12" text-anchor="start" fill="#000">V1 = A1·x + V_dead1,  V2 = A2·(s − x) + V_dead2</text>
<text x="40.0" y="648.0" font-size="12" text-anchor="start" fill="#000">ω0 = √(c/m),  f0 = ω0 / 2π</text>
<text x="40.0" y="667.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="40.0" y="686.0" font-size="12" text-anchor="start" fill="#000">Simple textbook form (symmetric cylinder,</text>
<text x="40.0" y="705.0" font-size="12" text-anchor="start" fill="#000">piston in the middle, no dead volume):</text>
<text x="40.0" y="724.0" font-size="12" text-anchor="start" fill="#000">ω0 = √(4·β·A² / (V·m)),  V = A·s</text>
<text x="40.0" y="743.0" font-size="12" text-anchor="start" fill="#000"></text>
<text x="40.0" y="762.0" font-size="12" text-anchor="start" fill="#000">Example (dead volume 0.0985 L per side =</text>
<text x="40.0" y="781.0" font-size="12" text-anchor="start" fill="#000">1 m of 10 mm line + 20 cm³ in the ports):</text>
<text x="40.0" y="800.0" font-size="12" text-anchor="start" fill="#000">simple: f0 = 27.8 Hz (A = A1, V = A1·s)</text>
<text x="40.0" y="819.0" font-size="12" text-anchor="start" fill="#000">exact:  f0 = 21.7 Hz at mid stroke,</text>
<text x="40.0" y="838.0" font-size="12" text-anchor="start" fill="#000">        minimum 21.5 Hz at x = 121 mm</text>
