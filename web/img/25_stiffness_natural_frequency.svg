<text x="575.2" y="228.9" font-size="11" text-anchor="start" fill="#000">higher near the ends (small oil volume on one side)</text>
<rect x="560.0" y="620.0" width="760.0" height="220.0" rx="0" stroke="#000" stroke-width="1.2" fill="#f7f7f7"/>
<text x="572.0" y="642.0" font-size="13" text-anchor="start" fill="#000" font-weight="bold">What f0 means for the design (rules of thumb)</text>
<text x="572.0" y="664.0" font-size="11" text-anchor="start" fill="#000">• Position loop gain K_v ≤ 2·ζ·ω0 (ζ ≈ 0.1–0.2 hydraulic damping): ω0 = 135 rad/s, ζ 0.2 → K_v ≤ 54 1/s.</text>
<text x="572.0" y="685.0" font-size="11" text-anchor="start" fill="#000">• Following error at 0.1 m/s = v / K_v = 1.9 mm. Bandwidth of the closed loop ≈ K_v / 2π ≈ 9 Hz.</text>
<text x="572.0" y="706.0" font-size="11" text-anchor="start" fill="#000">• Valve bandwidth (−90° frequency) ≥ 3 × f0 so the valve is not the slowest part.</text>
<text x="572.0" y="727.0" font-size="11" text-anchor="start" fill="#000">• Acceleration ramps: ramp time ≥ 3–5 × 1/f0 (here ≥ 0.15–0.25 s) – no jerk, no oscillation.</text>
<text x="572.0" y="748.0" font-size="11" text-anchor="start" fill="#000">• Raise f0: steel tube instead of hose, valve on the cylinder, bigger area A, smaller volume V,</text>
<text x="572.0" y="769.0" font-size="11" text-anchor="start" fill="#000">  no air in the oil (bleed!), lighter moving mass. f0 ∝ A·√(β/(V·m)).</text>
<text x="572.0" y="790.0" font-size="11" text-anchor="start" fill="#000">• APC lift (Ø63/36 × 60, 1 200 kg, 1.5 m lines ID 8): f0 ≈ 41 Hz at mid stroke.</text>
