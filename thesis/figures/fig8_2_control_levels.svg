y="30" width="640" height="60" rx="6" fill="#ffffff" stroke="#5f5e57" stroke-width="1.2"/><text x="520.0" y="56.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">ERP</text><text x="520.0" y="72.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">orders, bill of materials, stock, cost</text><rect x="200" y="120" width="640" height="60" rx="6" fill="#ffffff" stroke="#5f5e57" stroke-width="1.2"/><text x="520.0" y="146.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">MES</text><text x="520.0" y="162.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">work orders, serial numbers, OEE, test records</text><rect x="200" y="220" width="640" height="200" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="520" y="244" font-size="13.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">FMS control PC (fmsctl, Python standard library, offline) – the only Modbus client</text><rect x="215" y="260" width="145" height="64" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="287.5" y="288.4" font-size="12.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Cell controller</text><text x="287.5" y="303.9" font-size="11.0" fill="#1f1f1e" text-anchor="middle">dispatching, pallets</text><rect x="370" y="260" width="145" height="64" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="442.5" y="288.4" font-size="12.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Tool management</text><text x="442.5" y="303.9" font-size="11.0" fill="#1f1f1e" text-anchor="middle">tool check, offsets</text><rect x="525" y="260" width="145" height="64" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="597.5" y="288.4" font-size="12.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Logistics</text><text x="597.5" y="303.9" font-size="11.0" fill="#1f1f1e" text-anchor="middle">AGV fleet, AS/RS</text><rect x="680" y="260" width="145" height="64" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="752.5" y="288.4" font-size="12.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">HTTP server</text><text x="752.5" y="303.9" font-size="11.0" fill="#1f1f1e" text-anchor="middle">API, operator screens</text><rect x="215" y="338" width="610" height="66" rx="6" fill="#fbf6e4" stroke="#5f5e57" stroke-width="1.2"/><text x="520.0" y="367.4" font-size="12.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Interface layer</text><text x="520.0" y="382.9" font-size="11.0" fill="#1f1f1e" text-anchor="middle">register map V1.2 · Modbus TCP driver · toggle-bit job handshake · virtual plant</text><rect x="200" y="470" width="640" height="150" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text x="520" y="494" font-size="13.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">21 machine PLCs as Modbus TCP servers – each runs the standard interface block V1.2</text><rect x="210" y="512" width="84" height="84" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="252.0" y="550.6" font-size="11.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">CNC × 7</text><text x="252.0" y="565.1" font-size="10.0" fill="#1f1f1e" text-anchor="middle">HMC, VMC, ...</text><rect x="299" y="512" width="84" height="84" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="341.0" y="550.6" font-size="11.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Pallet × 1</text><text x="341.0" y="565.1" font-size="10.0" fill="#1f1f1e" text-anchor="middle">pool + shuttle</text><rect x="388" y="512" width="84" height="84" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="430.0" y="550.6" font-size="11.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Load × 1</text><text x="430.0" y="565.1" font-size="10.0" fill="#1f1f1e" text-anchor="middle">operator station</text><rect x="477" y="512" width="84" height="84" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="519.0" y="550.6" font-size="11.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Station × 7</text><text x="519.0" y="565.1" font-size="10.0" fill="#1f1f1e" text-anchor="middle">wash, assembly, ...</text><rect x="566" y="512" width="84" height="84" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="608.0" y="550.6" font-size="11.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Test × 2</text><text x="608.0" y="565.1" font-size="10.0" fill="#1f1f1e" text-anchor="middle">ISO 1217</text><rect x="655" y="512" width="84" height="84" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="697.0" y="550.6" font-size="11.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">AGV × 2</text><text x="697.0" y="565.1" font-size="10.0" fill="#1f1f1e" text-anchor="middle">Wi-Fi</text><rect x="744" y="512" width="84" height="84" rx="6" fill="#f4f3ef" stroke="#5f5e57" stroke-width="1.2"/><text x="786.0" y="550.6" font-size="11.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">AS/RS × 2</text><text x="786.0" y="565.1" font-size="10.0" fill="#1f1f1e" text-anchor="middle">raw + FG</text><rect x="200" y="670" width="640" height="60" rx="6" fill="#ffffff" stroke="#5f5e57" stroke-width="1.2"/><text x="520.0" y="696.3" font-size="13" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Machines</text><text x="520.0" y="712.3" font-size="11.5" fill="#1f1f1e" text-anchor="middle">motors, valves, sensors, axes, clamps, AGV and crane drives</text><line x1="520" y1="92" x2="520" y2="118" stroke="#7a3ea1" stroke-width="2" marker-start="url(#ah2)" marker-end="url(#ah2)"/><text x="530" y="109.0" font-size="12" fill="#7a3ea1" font-weight="bold">HTTP / JSON</text><line x1="520" y1="182" x2="520" y2="218" stroke="#7a3ea1" stroke-width="2" marker-start="url(#ah2)" marker-end="url(#ah2)"/><text x="530" y="204.0" font-size="12" fill="#7a3ea1" font-weight="bold">HTTP / JSON</text><line x1="520" y1="422" x2="520" y2="468" stroke="#2a78d6" stroke-width="2" marker-start="url(#ah2)" marker-end="url(#ah2)"/><text x="530" y="449.0" font-size="12" fill="#2a78d6" font-weight="bold">Modbus TCP (FC03 / FC06 / FC16)</text><line x1="520" y1="622" x2="520" y2="668" stroke="#1baf7a" stroke-width="2" marker-start="url(#ah2)" marker-end="url(#ah2)"/><text x="530" y="649.0" font-size="12" fill="#1baf7a" font-weight="bold">hard-wired I/O, drives, machine-internal fieldbus</text><rect x="880" y="120" width="280" height="110" rx="6" fill="#f2f2f2" stroke="#5f5e57" stroke-width="1.2"/><text x="1020.0" y="155.9" font-size="12.5" fill="#1f1f1e" text-anchor="middle" font-weight="bold">Digital twin (Chapters 4 – 7)</text><text x="1020.0" y="171.4" font-size="11.0" fill="#1f1f1e" text-anchor="middle">reads snapshots and events over HTTP;</text><text x="1020.0" y="186.9" font-size="11.0" fill="#1f1f1e" text-anchor="middle">Bayesian updating, prediction;</text><text x="1020.0" y="202.4" font-size="11.0" fill="#1f1f1e" text-anchor="middle">never commands the machines</text><path d="M880,175 C860,175 860,300 842,300" fill="none" stroke="#5f5e57" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah2)"/><rect x="880" y="300" width="280" height="300" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.8"/><text x="1020" y="330" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">Safety – hard-wired</text><text x="1020" y="353" font-size="12.5" fill="#1f1f1e" text-anchor="middle">e-stop chains, guard doors,</text><text x="1020" y="376" font-size="12.5" fill="#1f1f1e" text-anchor="middle">light curtains, safe torque off,</text><text x="1020" y="399" font-size="12.5" fill="#1f1f1e" text-anchor="middle">safety relays / safety CPU per machine</text><text x="1020" y="422" font-size="12.5" fill="#1f1f1e" text-anchor="middle">(ISO 13849-1, IEC 60204-1)</text><text x="1020" y="445" font-size="12.5" fill="#1f1f1e" text-anchor="middle"></text><text x="1020" y="468" font-size="12.5" fill="#1f1f1e" text-anchor="middle">never over Modbus or HTTP;</text><text x="1020" y="491" font-size="12.5" fill="#1f1f1e" text-anchor="middle">a lost network means no new jobs –</text><text x="1020" y="514" font-size="12.5" fill="#1f1f1e" text-anchor="middle">running cycles end safely,</text><text x="1020" y="537" font-size="12.5" fill="#1f1f1e" text-anchor="middle">PLC watchdog on the gateway</text><text x="1020" y="560" font-size="12.5" fill="#1f1f1e" text-anchor="middle">heartbeat (5 s)</text><line x1="842" y1="555" x2="878" y2="555" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/></svg>