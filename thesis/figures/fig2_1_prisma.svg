<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Figure 1. PRISMA 2020 flow diagram</title>
  <rect width="900" height="760" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <g fill="#333" font-weight="bold" font-size="13">
    <text x="20" y="80" transform="rotate(-90 20 80)" text-anchor="middle">Identification</text>
    <text x="20" y="330" transform="rotate(-90 20 330)" text-anchor="middle">Screening</text>
    <text x="20" y="660" transform="rotate(-90 20 660)" text-anchor="middle">Included</text>
  </g>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="50" y="20" width="400" height="90" rx="6"/>
    <rect x="510" y="20" width="370" height="90" rx="6"/>
    <rect x="50" y="160" width="400" height="60" rx="6"/>
    <rect x="510" y="150" width="370" height="130" rx="6"/>
    <rect x="50" y="320" width="400" height="60" rx="6"/>
    <rect x="510" y="320" width="370" height="60" rx="6"/>
    <rect x="50" y="430" width="400" height="60" rx="6"/>
    <rect x="510" y="420" width="370" height="150" rx="6"/>
    <rect x="50" y="620" width="400" height="80" rx="6"/>
  </g>
  <g stroke="#333" stroke-width="1.5" marker-end="url(#a)">
    <line x1="250" y1="110" x2="250" y2="158"/>
    <line x1="250" y1="220" x2="250" y2="318"/>
    <line x1="250" y1="380" x2="250" y2="428"/>
    <line x1="250" y1="490" x2="250" y2="618"/>
    <line x1="450" y1="65" x2="508" y2="65"/>
    <line x1="450" y1="190" x2="508" y2="210"/>
    <line x1="450" y1="350" x2="508" y2="350"/>
    <line x1="450" y1="460" x2="508" y2="490"/>
  </g>
  <g fill="#111">
    <text x="64" y="46" font-weight="bold">Records identified (OpenAlex, 13 Nov 2026)</text>
    <text x="64" y="70">n = 486</text>
    <text x="64" y="94">S1 = 269 · S2 = 167 · S3 = 50</text>
    <text x="524" y="46" font-weight="bold">Records removed before screening</text>
    <text x="524" y="70">Duplicates: n = 41</text>
    <text x="524" y="94">(38 across strings, 3 repository copies)</text>
    <text x="64" y="186" font-weight="bold">Records screened (title / abstract)</text>
    <text x="64" y="208">n = 445</text>
    <text x="524" y="174" font-weight="bold">Records excluded: n = 241</text>
    <text x="524" y="198">E1 not discrete manufacturing: 72</text>
    <text x="524" y="218">E2 concept only: 14 · E3 single process: 50</text>
    <text x="524" y="238">E4 not peer-reviewed / not English: 21</text>
    <text x="524" y="258">E5 no review question addressed: 84</text>
    <text x="64" y="346" font-weight="bold">Reports sought for retrieval</text>
    <text x="64" y="368">n = 204</text>
    <text x="524" y="346" font-weight="bold">Reports not retrieved</text>
    <text x="524" y="368">(no open-access full text): n = 162</text>
    <text x="64" y="456" font-weight="bold">Reports assessed for eligibility</text>
    <text x="64" y="478">n = 42</text>
    <text x="524" y="444" font-weight="bold">Reports excluded: n = 14</text>
    <text x="524" y="468">E1: 1 · E2: 3 · E3: 2</text>
    <text x="524" y="488">E4 (not English): 2 · E5: 3</text>
    <text x="524" y="508">Document incomplete or not the</text>
    <text x="524" y="528">article version: 3</text>
    <text x="64" y="650" font-weight="bold">Studies included in the review</text>
    <text x="64" y="674">n = 28 (27 primary studies, 1 review)</text>
  </g>
  <text x="50" y="740" font-size="12" fill="#555">Screening and extraction AI-assisted with author verification (see Section 3.4). Based on PRISMA 2020 (Page et al., 2021).</text>
</svg>
