<text x="168.0" y="348.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">ring entry 1: state + time ms</text>
<rect x="80.0" y="358.0" width="80.0" height="22.0" rx="0" fill="#56B4E9" stroke="#000" stroke-width="0.7"/>
