<rect x="160.0" y="383.0" width="250.0" height="22.0" rx="0" fill="#FFFFFF" stroke="#000" stroke-width="0.7"/>
<text x="168.0" y="398.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">ring entries 3 … 7 (oldest last)</text>
<text x="450.0" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Gateway reconstruction at each poll</text>
<text x="450.0" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">d = (c − c_prev) mod 2³²</text>
<text x="450.0" y="293.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">d = 0: no change</text>
<text x="450.0" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">1 ≤ d ≤ R: read entries d−1 … 0 (oldest first)</text>
<text x="450.0" y="335.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">d &gt; R: read R entries, flag d − R events lost</text>
<text x="450.0" y="356.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">c &lt; c_prev (restart): re-baseline, flag gap</text>
<text x="450.0" y="377.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">c_prev = c</text>
<text x="450.0" y="410.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333">One FC03 per poll; R = 8 entries = 28 registers.</text></svg>