<text x="80.0" y="195.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">State-only polling sees RUN, RUN, IDLE, IDLE: 1 change reported, 6 of 7 lost, time error up to P.</text>
<text x="80.0" y="214.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Event block: the change counter c reads 0 → 2 → 5 → 7; the ring returns every change with its PLC time stamp.</text>
<text x="80.0" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">Event block (registers 104–131, map V1.2)</text>
