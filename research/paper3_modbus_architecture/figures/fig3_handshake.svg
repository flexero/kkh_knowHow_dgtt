<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20.0" y="22.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="bold" fill="#000">Controller (FMS PC)</text>
<text x="430.0" y="22.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="bold" fill="#000">PLC (scan cycle)</text>
<rect x="20.0" y="40.0" width="360.0" height="46.0" rx="8" fill="#E8F3FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="32.0" y="59.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">IDLE</text>
<text x="32.0" y="77.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">REQ = ACK</text>
<line x1="200.0" y1="86.0" x2="200.0" y2="102.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="20.0" y="102.0" width="360.0" height="46.0" rx="8" fill="#E8F3FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="32.0" y="121.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">WRITE</text>
<text x="32.0" y="139.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">FC16 job 400–405, FC16 code+seq 200–201</text>
<line x1="200.0" y1="148.0" x2="200.0" y2="164.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="20.0" y="164.0" width="360.0" height="46.0" rx="8" fill="#E8F3FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="32.0" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">TOGGLE</text>
<text x="32.0" y="201.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">FC06 REQ := ¬REQ (202)</text>
<line x1="200.0" y1="210.0" x2="200.0" y2="226.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="20.0" y="226.0" width="360.0" height="46.0" rx="8" fill="#E8F3FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="32.0" y="245.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">WAIT ACK</text>
<text x="32.0" y="263.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">FC03 8–10 until ACK = REQ ∧ ackSeq = seq</text>
<line x1="200.0" y1="272.0" x2="200.0" y2="288.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="20.0" y="288.0" width="360.0" height="46.0" rx="8" fill="#E8F3FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="32.0" y="307.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">SENT</text>
<text x="32.0" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">job running; poll idDone, BUSY</text>
<line x1="200.0" y1="334.0" x2="200.0" y2="350.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="20.0" y="350.0" width="360.0" height="46.0" rx="8" fill="#E8F3FA" stroke="#0072B2" stroke-width="1.4"/>
<text x="32.0" y="369.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">DONE</text>
<text x="32.0" y="387.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">idDone = id ∧ BUSY = 0</text>
<rect x="430.0" y="40.0" width="370.0" height="50.0" rx="8" fill="#FDF3E1" stroke="#E69F00" stroke-width="1.4"/>
<text x="442.0" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">WAIT</text>
<text x="442.0" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">REQ = ACK; READY = 1</text>
<line x1="615.0" y1="90.0" x2="615.0" y2="114.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="430.0" y="114.0" width="370.0" height="50.0" rx="8" fill="#FDF3E1" stroke="#E69F00" stroke-width="1.4"/>
<text x="442.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">VALIDATE</text>
<text x="442.0" y="153.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">REQ ≠ ACK (edge of toggle); code, ready, data</text>
<line x1="615.0" y1="164.0" x2="615.0" y2="188.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="430.0" y="188.0" width="370.0" height="50.0" rx="8" fill="#FDF3E1" stroke="#E69F00" stroke-width="1.4"/>
<text x="442.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">ACCEPT / REJECT</text>
<text x="442.0" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">latch 400–449; write ackSeq, result; then ACK := REQ</text>
<line x1="615.0" y1="238.0" x2="615.0" y2="262.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="430.0" y="262.0" width="370.0" height="50.0" rx="8" fill="#FDF3E1" stroke="#E69F00" stroke-width="1.4"/>
<text x="442.0" y="282.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">BUSY</text>
<text x="442.0" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">execute job; DONE toggle at end</text>
<line x1="615.0" y1="312.0" x2="615.0" y2="336.0" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="430.0" y="336.0" width="370.0" height="50.0" rx="8" fill="#FDF3E1" stroke="#E69F00" stroke-width="1.4"/>
<text x="442.0" y="356.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#000">RESULT</text>
<text x="442.0" y="375.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#000">write idDone, result, duration; then BUSY := 0</text>
<line x1="380.0" y1="196.0" x2="430.0" y2="120.0" stroke="#777777" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="392.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#777777">REQ</text>
<line x1="430.0" y1="215.0" x2="380.0" y2="245.0" stroke="#777777" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="392.0" y="240.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#777777">ACK</text>
<text x="20.0" y="420.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#D55E00">Time-out: no ACK within 5 s → job state noack (the PLC may still run it); rejected only if the device is idle and idDone ≠ id.</text>
<text x="20.0" y="440.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#D55E00">Time-out: accepted but not finished within 3 × the longest cycle → job state unknown + alarm; the operator resolves it.</text>
<text x="20.0" y="460.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#D55E00">Controller restart: start in manual mode; read REQ, ACK and idDone of every device; never toggle while REQ ≠ ACK.</text>
<text x="20.0" y="480.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#009E73">PLC restart: in the first scan ACK := REQ, so an old command is never executed again.</text>
<text x="20.0" y="500.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#009E73">Sequence guard (proposed for map V1.3): accept a toggle only if cmd.seq ≠ the last acknowledged sequence number.</text></svg>