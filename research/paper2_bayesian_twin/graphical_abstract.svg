<svg xmlns="http://www.w3.org/2000/svg" width="234.2mm" height="93.8mm" viewBox="0 0 664.0 266.0" font-family="Arial, Helvetica, sans-serif">
<desc>Graphical abstract: uncertainty-aware digital twin with sequential conjugate Bayesian updating for FMS ramp-up</desc>
<rect width="664.0" height="266.0" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker><marker id="ahv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D55E00"/></marker></defs>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="bold">Uncertainty-aware digital twin for FMS ramp-up (simulation study)</text>
<rect x="16.0" y="48.0" width="180.0" height="64.0" rx="3" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="106.0" y="61.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Design stage</text>
<text x="106.0" y="73.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">priors from design statements</text>
<text x="106.0" y="84.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">frozen forecast P0 + interval</text>
<rect x="16.0" y="136.0" width="180.0" height="64.0" rx="3" fill="#e6f1f8" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="106.0" y="149.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Ramp-up, every month</text>
<text x="106.0" y="161.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">machine events → conjugate</text>
<text x="106.0" y="172.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">update with forgetting</text>
<rect x="232.0" y="48.0" width="180.0" height="64.0" rx="3" fill="#e6f1f8" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="322.0" y="61.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Nested Monte Carlo DES</text>
<text x="322.0" y="73.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">epistemic × aleatory</text>
<text x="322.0" y="84.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">uncertainty of output</text>
<rect x="232.0" y="136.0" width="180.0" height="64.0" rx="3" fill="#fbe9df" stroke="#D55E00" stroke-width="0.9"/>
<text x="322.0" y="149.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Discrepancy layer</text>
<text x="322.0" y="161.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">learns the lag of a</text>
<text x="322.0" y="172.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">stationary model</text>
<path d="M106.0,112.0 L106.0,134.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M196.0,160.0 L230.0,90.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M322.0,112.0 L322.0,134.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M412.0,168.0 L444.0,168.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<rect x="448.0" y="44.0" width="204.0" height="176.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="550.0" y="62.0" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Results (100 virtual ramp-ups)</text>
<text x="460.0" y="84.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">Output error, months 2–12</text>
<text x="460.0" y="100.0" font-size="12" text-anchor="start" fill="#999999" font-weight="bold">13.0 %</text>
<text x="504.0" y="100.0" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">→</text>
<text x="522.0" y="100.0" font-size="12" text-anchor="start" fill="#D55E00" font-weight="bold">3.6 %</text>
<text x="644.0" y="100.0" font-size="9" text-anchor="end" fill="#4d4d4d" font-weight="normal">B0 → P07D</text>
<text x="460.0" y="121.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">Coverage of 90 % interval</text>
<text x="460.0" y="137.0" font-size="12" text-anchor="start" fill="#999999" font-weight="bold">7 %</text>
<text x="504.0" y="137.0" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">→</text>
<text x="522.0" y="137.0" font-size="12" text-anchor="start" fill="#D55E00" font-weight="bold">94 %</text>
<text x="644.0" y="137.0" font-size="9" text-anchor="end" fill="#4d4d4d" font-weight="normal">P07 → P07D</text>
<text x="460.0" y="158.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">Bottleneck found, months 2–12</text>
<text x="460.0" y="174.0" font-size="12" text-anchor="start" fill="#999999" font-weight="bold">76.5 %</text>
<text x="504.0" y="174.0" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">→</text>
<text x="522.0" y="174.0" font-size="12" text-anchor="start" fill="#D55E00" font-weight="bold">95.1 %</text>
<text x="644.0" y="174.0" font-size="9" text-anchor="end" fill="#4d4d4d" font-weight="normal">B0 → P07</text>
<text x="460.0" y="195.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">Epistemic variance share</text>
<text x="460.0" y="211.0" font-size="12" text-anchor="start" fill="#999999" font-weight="bold">95 %</text>
<text x="504.0" y="211.0" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">→</text>
<text x="522.0" y="211.0" font-size="12" text-anchor="start" fill="#D55E00" font-weight="bold">40 %</text>
<text x="644.0" y="211.0" font-size="9" text-anchor="end" fill="#4d4d4d" font-weight="normal">month 1 → 2</text>
<text x="16.0" y="244.0" font-size="10" text-anchor="start" fill="#4d4d4d" font-weight="normal">All factory data are design estimates; all results are simulated. A field-validation protocol is provided.</text>
</svg>