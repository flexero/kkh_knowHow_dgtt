<svg xmlns="http://www.w3.org/2000/svg" width="190.0mm" height="92.4mm" viewBox="0 0 538.6 262.0" font-family="Arial, Helvetica, sans-serif">
<desc>Information loop of the uncertainty-aware digital twin with sequential conjugate updating</desc>
<rect width="538.6" height="262.0" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker><marker id="ahv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D55E00"/></marker></defs>
<rect x="277.2" y="8.0" width="118.0" height="50.0" rx="3" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="336.2" y="21.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Design statements</text>
<text x="336.2" y="33.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">MTBF, MTTR, cycle, scrap</text>
<text x="336.2" y="44.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">confidence = equivalent data</text>
<rect x="411.8" y="8.0" width="118.0" height="50.0" rx="3" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="470.8" y="21.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Station-level knowledge</text>
<text x="470.8" y="33.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">capacities, bottleneck</text>
<text x="470.8" y="44.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">→ improvement, investment</text>
<rect x="8.0" y="84.0" width="118.0" height="56.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="67.0" y="97.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Physical FMS</text>
<text x="67.0" y="109.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">here: hidden true factory</text>
<text x="67.0" y="120.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">(virtual ramp-up)</text>
<text x="67.0" y="131.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">machine state events</text>
<rect x="142.6" y="84.0" width="118.0" height="56.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="201.6" y="97.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Sufficient statistics</text>
<text x="201.6" y="109.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">failures n, exposure T</text>
<text x="201.6" y="120.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">repairs k, Σr; scrap x, N</text>
<text x="201.6" y="131.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">log cycle ratio: n, mean, S</text>
<rect x="277.2" y="84.0" width="118.0" height="56.0" rx="3" fill="#e6f1f8" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="336.2" y="97.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Conjugate update</text>
<text x="336.2" y="109.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">Gamma–Poisson, Gamma–</text>
<text x="336.2" y="120.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">exponential, NIG, Beta–</text>
<text x="336.2" y="131.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">binomial; forgetting ρ</text>
<rect x="411.8" y="84.0" width="118.0" height="56.0" rx="3" fill="#e6f1f8" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="470.8" y="97.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Posterior of θ</text>
<text x="470.8" y="109.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">per station: MTBF, MTTR,</text>
<text x="470.8" y="120.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">speed factor, cycle log-sd,</text>
<text x="470.8" y="131.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">scrap probability</text>
<rect x="411.8" y="182.0" width="118.0" height="56.0" rx="3" fill="#e6f1f8" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="470.8" y="195.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Nested Monte Carlo</text>
<text x="470.8" y="207.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">outer: draws of θ</text>
<text x="470.8" y="218.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">(epistemic)</text>
<text x="470.8" y="229.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">inner: DES runs (aleatory)</text>
<rect x="277.2" y="182.0" width="118.0" height="56.0" rx="3" fill="#e6f1f8" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="336.2" y="195.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Predictive distribution</text>
<text x="336.2" y="207.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">of Y(k+1): mean, quantiles,</text>
<text x="336.2" y="218.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">epistemic / aleatory</text>
<text x="336.2" y="229.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">variance split</text>
<rect x="142.6" y="182.0" width="118.0" height="56.0" rx="3" fill="#fbe9df" stroke="#D55E00" stroke-width="0.9"/>
<text x="201.6" y="195.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Discrepancy layer</text>
<text x="201.6" y="207.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">NIG on log error e(k)</text>
<text x="201.6" y="218.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">with forgetting: shifts the</text>
<text x="201.6" y="229.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">mean, widens the interval</text>
<rect x="8.0" y="182.0" width="118.0" height="56.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.9"/>
<text x="67.0" y="195.0" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Frozen prediction record</text>
<text x="67.0" y="207.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">append-only; written</text>
<text x="67.0" y="218.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">before data of k+1 exist</text>
<text x="67.0" y="229.5" font-size="9" text-anchor="middle" fill="#1a1a1a" font-weight="normal">(P0 at design freeze)</text>
<path d="M126.0,112.0 L140.6,112.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M260.6,112.0 L275.2,112.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M395.2,112.0 L409.8,112.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M336.2,58.0 L336.2,82.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<text x="340.2" y="71.0" font-size="9" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic">priors (k = 0)</text>
<path d="M470.8,84.0 L470.8,60.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<text x="474.8" y="71.0" font-size="9" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic">means</text>
<path d="M470.8,140.0 L470.8,180.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<text x="474.8" y="162.0" font-size="9" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic">samples of θ</text>
<path d="M411.8,210.0 L397.2,210.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M277.2,210.0 L262.6,210.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M142.6,202.0 L128.0,202.0" fill="none" stroke="#1a1a1a" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M126.0,220.0 L140.6,220.0" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#ahv)"/>
<text x="134.3" y="236.0" font-size="9" text-anchor="middle" fill="#D55E00" font-weight="normal" font-style="italic">e(k)</text>
<path d="M67.0,140.0 L67.0,180.0" fill="none" stroke="#D55E00" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#ahv)"/>
<text x="71.0" y="162.0" font-size="9" text-anchor="start" fill="#D55E00" font-weight="normal" font-style="italic">realised Y(k+1)</text>
<text x="8.0" y="248.0" font-size="9" text-anchor="start" fill="#4d4d4d" font-weight="normal">Monthly loop: learn from months 1..k → freeze forecast for month k+1 → observe month k+1 → score and learn.</text>
</svg>