<text x="90.0" y="428.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">- =&gt; SF1-SF7 of Part B redesigned at the same PL (item F8)</text>
<text x="80.0" y="760.0" font-size="12" text-anchor="start" font-weight="normal" fill="#000">CANopen load 33.5 % at 500 kbit/s (limit 50 %), length 18 m &lt;= 100 m. Modbus TCP over the DDLS: polling 0.2 s, &lt;= 10 kbit/s.</text>
