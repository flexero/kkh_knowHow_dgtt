<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="920" viewBox="0 0 1180 920" font-family="Arial" font-size="13">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b00"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="28" font-size="17" font-weight="bold">Stacker crane state machine - FB_Crane (asrs_crane.scl) = CraneModel (asrs_sim.py)</text>
<g transform="translate(0,45)">
<path d="M205,110 L275,110" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="240" y="92" fill="#222" font-size="11.5" text-anchor="middle">safety OK +</text>
<text x="240" y="105" fill="#222" font-size="11.5" text-anchor="middle">drives ready</text>
<path d="M465,110 L555,110" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="510" y="92" fill="#222" font-size="11.5" text-anchor="middle">positions valid,</text>
<text x="510" y="105" fill="#222" font-size="11.5" text-anchor="middle">fork centred</text>
<path d="M745,98 L885,60" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="790" y="70" fill="#222" font-size="11.5" text-anchor="middle">selector MANUAL</text>
<path d="M745,122 L885,165" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="790" y="150" fill="#222" font-size="11.5" text-anchor="middle">key MAINTENANCE</text>
<path d="M980,33 Q680,-10 370,83" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="650" y="30" fill="#222" font-size="11.5" text-anchor="middle">selector AUTO</text>
<path d="M980,192 Q500,300 110,137" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="150" y="190" fill="#222" font-size="11.5" text-anchor="middle">key off</text>
<path d="M600,137 L250,313" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="470" y="262" fill="#222" font-size="11.5" text-anchor="start">new job 30 / 31 / 32</text>
<text x="470" y="275" fill="#222" font-size="11.5" text-anchor="start">(30 only with fork empty)</text>
<path d="M650,137 L580,513" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="598" y="405" fill="#222" font-size="11.5" text-anchor="end">30 with load on fork,</text>
<text x="598" y="418" fill="#222" font-size="11.5" text-anchor="end">33 park</text>
<path d="M200,367 L200,513" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="210" y="435" fill="#222" font-size="11.5" text-anchor="start">both axes in position</text>
<text x="210" y="448" fill="#222" font-size="11.5" text-anchor="start">(low pick height)</text>
<path d="M295,540 L485,540" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="390" y="528" fill="#222" font-size="11.5" text-anchor="middle">load on fork,</text>
<text x="390" y="541" fill="#222" font-size="11.5" text-anchor="middle">no overhang</text>
<path d="M675,540 L865,540" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="770" y="528" fill="#222" font-size="11.5" text-anchor="middle">in position (high)</text>
<path d="M630,567 Q760,330 700,137" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="760" y="300" fill="#222" font-size="11.5" text-anchor="start">33: parked = job done</text>
<path d="M960,513 L980,367" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="978" y="445" fill="#222" font-size="11.5" text-anchor="start">fork empty:</text>
<text x="978" y="458" fill="#222" font-size="11.5" text-anchor="start">JOB DONE (result 0)</text>
<path d="M980,313 Q870,170 650,137" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="840" y="220" fill="#222" font-size="11.5" text-anchor="middle">at the I/O point</text>
<path d="M885,340 L295,340" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="590" y="332" fill="#222" font-size="11.5" text-anchor="middle">new job interrupts RETURN</text>
<path d="M200,567 Q220,760 485,758" fill="none" stroke="#b00" stroke-width="1.6" marker-end="url(#r)" stroke-dasharray="6 4"/>
<text x="230" y="660" fill="#900" font-size="11.5" text-anchor="start">22 source empty, 23 contour,</text>
<text x="230" y="673" fill="#900" font-size="11.5" text-anchor="start">24 I/O not ready, 33 load lost</text>
<path d="M960,567 Q950,760 675,758" fill="none" stroke="#b00" stroke-width="1.6" marker-end="url(#r)" stroke-dasharray="6 4"/>
<text x="930" y="660" fill="#900" font-size="11.5" text-anchor="end">21 DOUBLE OCCUPANCY (load stays</text>
<text x="930" y="673" fill="#900" font-size="11.5" text-anchor="end">on the fork), 24, 33</text>
<path d="M580,743 Q300,560 370,137" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="395" y="690" fill="#222" font-size="11.5" text-anchor="end">acknowledge (cmd 4)</text>
<text x="395" y="703" fill="#222" font-size="11.5" text-anchor="end">and cause removed</text>
<rect x="15" y="83" width="190" height="54" rx="10" fill="#eeeeee" stroke="#333" stroke-width="1.5"/>
<text x="110" y="108" text-anchor="middle" font-weight="bold">OFF</text>
<text x="110" y="125" text-anchor="middle" font-size="11" fill="#444">state 0 (register 304)</text>
<rect x="275" y="83" width="190" height="54" rx="10" fill="#cfe2f3" stroke="#333" stroke-width="1.5"/>
<text x="370" y="108" text-anchor="middle" font-weight="bold">HOMING</text>
<text x="370" y="125" text-anchor="middle" font-size="11" fill="#444">state 1 (register 304)</text>
<rect x="555" y="83" width="190" height="54" rx="10" fill="#d9ead3" stroke="#333" stroke-width="1.5"/>
<text x="650" y="108" text-anchor="middle" font-weight="bold">IDLE</text>
<text x="650" y="125" text-anchor="middle" font-size="11" fill="#444">state 2 (register 304)</text>
<rect x="885" y="33" width="190" height="54" rx="10" fill="#fff2cc" stroke="#333" stroke-width="1.5"/>
<text x="980" y="58" text-anchor="middle" font-weight="bold">MANUAL</text>
<text x="980" y="75" text-anchor="middle" font-size="11" fill="#444">state 9 (register 304)</text>
<rect x="885" y="138" width="190" height="54" rx="10" fill="#fff2cc" stroke="#333" stroke-width="1.5"/>
<text x="980" y="163" text-anchor="middle" font-weight="bold">MAINTENANCE</text>
<text x="980" y="180" text-anchor="middle" font-size="11" fill="#444">state 10 (register 304)</text>
<rect x="105" y="313" width="190" height="54" rx="10" fill="#fce5cd" stroke="#333" stroke-width="1.5"/>
<text x="200" y="338" text-anchor="middle" font-weight="bold">MOVE_TO_SOURCE</text>
<text x="200" y="355" text-anchor="middle" font-size="11" fill="#444">state 3 (register 304)</text>
<rect x="885" y="313" width="190" height="54" rx="10" fill="#d9ead3" stroke="#333" stroke-width="1.5"/>
<text x="980" y="338" text-anchor="middle" font-weight="bold">RETURN</text>
<text x="980" y="355" text-anchor="middle" font-size="11" fill="#444">state 7 (register 304)</text>
<rect x="105" y="513" width="190" height="54" rx="10" fill="#fce5cd" stroke="#333" stroke-width="1.5"/>
<text x="200" y="538" text-anchor="middle" font-weight="bold">PICK</text>
<text x="200" y="555" text-anchor="middle" font-size="11" fill="#444">state 4 (register 304)</text>
<rect x="485" y="513" width="190" height="54" rx="10" fill="#fce5cd" stroke="#333" stroke-width="1.5"/>
<text x="580" y="538" text-anchor="middle" font-weight="bold">MOVE_TO_DEST</text>
<text x="580" y="555" text-anchor="middle" font-size="11" fill="#444">state 5 (register 304)</text>
<rect x="865" y="513" width="190" height="54" rx="10" fill="#fce5cd" stroke="#333" stroke-width="1.5"/>
<text x="960" y="538" text-anchor="middle" font-weight="bold">PUT</text>
<text x="960" y="555" text-anchor="middle" font-size="11" fill="#444">state 6 (register 304)</text>
<rect x="485" y="743" width="190" height="54" rx="10" fill="#f4cccc" stroke="#333" stroke-width="1.5"/>
<text x="580" y="768" text-anchor="middle" font-weight="bold">FAULT</text>
<text x="580" y="785" text-anchor="middle" font-size="11" fill="#444">state 8 (register 304)</text>
</g>
<text x="580" y="884" fill="#900" font-size="12" text-anchor="middle">Any state except OFF / FAULT / MAINTENANCE: door open, e-stop or safety PLC -&gt; 31; axis fault -&gt; 32; fork fault -&gt; 33</text>
<text x="580" y="900" fill="#900" font-size="12" text-anchor="middle">(a running job is aborted with job.result 2, the detail code is in register 305)</text>
<text x="20" y="916" font-size="11.5" fill="#444">Store 30 = I/O infeed -&gt; rack;  retrieve 31 = rack -&gt; I/O outfeed;  relocate 32 = rack -&gt; rack;  park 33 = maintenance position.</text>
</svg>