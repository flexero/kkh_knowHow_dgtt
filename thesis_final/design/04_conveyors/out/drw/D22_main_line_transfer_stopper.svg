<text x="230.00" y="26.00" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">Accumulation principle: the carriers ride on free-turning rollers of the chain; a stopped</text>
<text x="230.00" y="30.40" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">carrier lets the chain run under it with a small back pressure (mu_acc 0.05) -> queues</text>
<text x="230.00" y="34.80" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">wait ON the line without stopping the drive.</text>
<text x="230.00" y="39.20" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000"></text>
<text x="230.00" y="43.60" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000"> Accumulation chain</text>
<text x="230.00" y="48.00" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">Carrier + adapter + heaviest product = 232 kg. A section FULL of accumulated carriers may be</text>
<text x="230.00" y="52.40" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">at most 41.9 m long (F_allow 1500 N per strand).</text>
<text x="230.00" y="56.80" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">Design: 4 sections of 25 m; with the 21 carriers of the loop the worst section pull is 895 N</text>
<text x="230.00" y="61.20" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">per strand -> drive 421 W -> 0.75 kW per section.</text>
<text x="230.00" y="65.60" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000"> Lift-transfers</text>
<text x="230.00" y="150.00" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">Drive sections: 4 x 25 m, 0.75 kW each (asm_line.py C).</text>
<text x="230.00" y="154.60" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">Stopper class 1500 N static / 10 J (damped): line pressure of the largest queue + impact.</text>
<text x="230.00" y="159.20" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">Lift-transfer: 3 belts at 90 deg, stroke 30 mm, cycle lift 2 s + spur 10 s + lower 2 s.</text>
<text x="230.00" y="163.80" font-family="Arial" font-size="2.20" text-anchor="start" fill="#000">Side guides 25 mm above the chain top keep the carrier in line.</text>
