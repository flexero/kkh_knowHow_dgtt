<text x="560.0" y="470.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Lowering: both valves must open; the edge or an E-stop closes both (Cat 3, MTTFd 150 a each, DC 90 % by spool monitoring).</text>
<text x="560.0" y="488.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Raising: the HPU runs only while 'up' is pressed (hold-to-run) or a memory height is recalled with the pit cover closed.</text>
<text x="60.0" y="540.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Stopping check: overrun after edge contact s = v (t_edge + t_valve) = 30 mm/s x (20 + 80) ms = 3 mm &lt;= 25 mm edge travel -&gt; no crushing.</text>
<text x="60.0" y="562.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Pit: cover plates follow the table; pit cover closed = DI; light pit lamp; drain for hydraulic oil (F11).</text>
<text x="60.0" y="620.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Safety functions (conv_elec.py, ISO 13849-1 simplified method):</text>
