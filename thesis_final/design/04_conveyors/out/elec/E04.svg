<text x="85.0" y="553.0" font-size="11" text-anchor="start" font-weight="normal" fill="#2a6fbb">PROFINET (daisy chain through the drives) + PROFIsafe telegram (STO, SS1)</text>
<line x1="80.0" y1="590.0" x2="1300.0" y2="590.0" stroke="#c00000" stroke-width="2.0"/>
<text x="85.0" y="583.0" font-size="11" text-anchor="start" font-weight="normal" fill="#c00000">24 V DC (separate supply for logic, drives keep their PROFINET link when the power is off)</text>
<text x="60.0" y="650.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Why a ramp is mandatory (conv_elec.py ch. 1, direct-on-line start with 2 x rated torque):</text>
<text x="80.0" y="672.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">- light crate (45 kg) on a chain zone: a = 31.4 m/s2 &gt; 0.5 g -&gt; crate jumps, parts shift</text>
<text x="80.0" y="690.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">- one moving carrier on an assembly section (0.75 kW): a = 15.9 m/s2 &gt; 3.9 m/s2 sliding limit of the product</text>
<text x="80.0" y="708.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">-&gt; every drive ramps at 0.3 m/s2; the inverter also gives speed control for zone accumulation and soft stops</text>
<text x="80.0" y="726.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">STO / SS1 are commanded by the F-CPU over PROFIsafe (no hard-wired STO cable per drive); E-stop SF-C1 = SS1 then STO.</text>
<text x="60.0" y="770.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Safety functions (conv_elec.py, ISO 13849-1 simplified method):</text>
<text x="60.0" y="788.0" font-size="10" text-anchor="start" font-weight="bold" fill="#000">SF</text>
<text x="120.0" y="788.0" font-size="10" text-anchor="start" font-weight="bold" fill="#000">PLr</text>
<text x="160.0" y="788.0" font-size="10" text-anchor="start" font-weight="bold" fill="#000">PL</text>
<text x="200.0" y="788.0" font-size="10" text-anchor="start" font-weight="bold" fill="#000">function</text>
<text x="60.0" y="804.0" font-size="10" text-anchor="start" font-weight="normal" fill="#000">SF-C1</text>
<text x="120.0" y="804.0" font-size="10" text-anchor="start" font-weight="normal" fill="#000">d</text>
<text x="160.0" y="804.0" font-size="10" text-anchor="start" font-weight="bold" fill="#000">d</text>
<text x="200.0" y="804.0" font-size="9" text-anchor="start" font-weight="normal" fill="#000">E-stop per area -&gt; SS1 then STO of all drives of the area</text>
