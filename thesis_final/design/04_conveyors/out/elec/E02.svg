<text x="60.0" y="680.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Case A properties:</text>
<text x="80.0" y="702.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">+ cheapest: no expansion module (0 EUR extra)</text>
<text x="80.0" y="720.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">- one PROFINET line per PLC: a cable fault can stop all devices behind it (use an MRP ring)</text>
<text x="80.0" y="738.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">- the CPU X2 port sits directly on VLAN 720: the only conduit is the core firewall (IEC 62443 zone = whole VLAN)</text>
<text x="80.0" y="756.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">- no serial port: energy meters / hydraulic units need gateways</text>
<text x="80.0" y="774.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">Bandwidth is not a limit in either case (cyclic load far below the 50 % planning limit).</text>
