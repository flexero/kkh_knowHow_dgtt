<text x="160.0" y="734.0" font-size="10" text-anchor="start" font-weight="bold" fill="#000">d</text>
<text x="200.0" y="734.0" font-size="9" text-anchor="start" font-weight="normal" fill="#000">AGV dock: light curtain (multi-beam) with muting while AGV_PRESENT + docking sensor; a person -&gt; STO of lane + AGV rollers stop (ST_FAULT)</text>
