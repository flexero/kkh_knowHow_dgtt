<text x="835.0" y="515.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000">coupler -KF70: S4 ST_FAULT</text>
<text x="835.0" y="530.0" font-size="10" text-anchor="start" font-weight="normal" fill="#000">AGV stops its deck rollers</text>
<text x="80.0" y="480.0" font-size="10" text-anchor="start" font-weight="normal" fill="#000">Muting = curtain bridged only while AGV_PRESENT = 1 AND the docking sensor sees the AGV AND both muting sensors are on in the right</text>
<text x="80.0" y="494.0" font-size="10" text-anchor="start" font-weight="normal" fill="#000">order within 4 s; muting ends 2 s after the AGV leaves; max muting time 20 s -&gt; otherwise STO + alarm.</text>
<text x="60.0" y="580.0" font-size="12" text-anchor="start" font-weight="bold" fill="#000">Optical coupler signals (F4.3, 8 + 8 bit, NOT safety-related):</text>
<text x="80.0" y="602.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">A1 AGV_PRESENT</text>
<text x="380.0" y="602.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">A2 AGV_READY_SEND</text>
<text x="680.0" y="602.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">A3 AGV_READY_RECV</text>
<text x="980.0" y="602.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">A4 AGV_TRANSFER_DONE</text>
<text x="80.0" y="620.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">S1 ST_READY_RECV</text>
<text x="380.0" y="620.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">S2 ST_READY_SEND</text>
<text x="680.0" y="620.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">S3 ST_TRANSFER_DONE</text>
<text x="980.0" y="620.0" font-size="11" text-anchor="start" font-weight="normal" fill="#000">S4 ST_FAULT</text>
<text x="80.0" y="650.0" font-size="10" text-anchor="start" font-weight="normal" fill="#000">Spare bits A5-A8 / S5-S8 reserved (crate id parity, lane select). Job data (crate id, destination) over the fleet manager / fmsctl.</text>
