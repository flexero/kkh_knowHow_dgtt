<text x="382" y="372" font-size="11" fill="#2a8a2a">TU1: contour frame + scale + ID</text>
<text x="20" y="620" font-size="12">Flows: AGV crate -> TU1 check (8 s, AGV waits) -> Z12..Z15 accumulation -> Z16 P&amp;D in -> crane.  Crane -> Z26 P&amp;D out -> Z25..Z22 -> TU2 -> AGV.</text>
<text x="20" y="640" font-size="12">Kit visit: TU2 -> Z31 pick (90 s) -> TU1 check -> rack (fail: back to Z31, rework 180 s).  AGV crate that fails (2 %%): back onto the AGV -> rework area.</text>
<text x="20" y="660" font-size="12">Safety (F4.5/F8): fences, light curtains with muting at both AGV docks, enabling at the operator place; EN 619, ISO 3691-4.</text>
<text x="20" y="700" font-size="11" fill="#b00000">DESIGN - F4.1 sizing layout; mechanical detail in F4.2/F4.3 (3D). Replaces the simple I/O sketch of F3 Part A (contour check moved onto TU1, pick place = Z31).</text>
